invariants:
- configuration validation never equals native attestation
- hard deny-all must be enforced before turn, independently of hook success
- native tools remain denied after attestation
- current0.147.0 cannot be admitted by this proposal without a proven hard fence
- attempt starts at send, not successful response
- late/foreign evidence never authorizes acceptance
- counterexamples/control are synthetic and not successful acceptance
