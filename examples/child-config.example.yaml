# .ai-ops.yaml — заготовка child-конфига (создаётся ai-ops init, отредактируйте под проект)
schema_version: 1
kind: ai-ops-child-config
parent:
  source: git+<ai-ops-kit-repo-url>
  installed_version: 1.1.0
  allowed_version_range: ">=1.0.0 <2.0.0"
  update_channel: stable
  update_policy: pr
  auto_update: true   # по умолчанию ВКЛ: ежедневный workflow сам открывает update-PR (не авто-мерж;
                      #   мажорный bump всё равно блокируется). Поставьте false, чтобы отключить (опт-аут).
project:
  name: <project-name>
  documentation_language: ru
  confidentiality_policy: internal
presets: {enabled: []}
adapters: {enabled: [claude-code, codex, generic]}
providers:
  default: anthropic
  configured:
    - {id: anthropic, credentials_ref: "env:ANTHROPIC_API_KEY"}
    - {id: openai, credentials_ref: "env:OPENAI_API_KEY"}
  fallback_chain: [anthropic, openai]
runtimes: {default: claude-code, configured: [claude-code, codex, generic-orchestrator]}
openspec: {enabled: true, profile: core, schema: spec-driven}
agents: {source: parent-package, disabled: [], custom: []}
workflows:
  mappings: {bug: QUICK, feature: ENGINEERING, discovery: PRODUCT, research: RESEARCH}
quality_gates:
  blocking: [intake_completeness, requirements, specification, plan_readiness, implementation_verification, code_review]
  overrides: []
routing_policy: default
approval_policy: {human_approval_required_for: [protected_paths, destructive]}
overlays: {project: .ai/project/, custom: .ai/custom/}
protected_paths: [.github/workflows/]
confidentiality_policy: {send_code_to_external_provider: allowed}

# v3.35 Human Communication Layer: как кит разговаривает с ЧЕЛОВЕКОМ в этом репозитории.
# `product` (по умолчанию) — сначала смысл и результат, техника по запросу. Меняется и обычной
# фразой: «рассказывай подробнее техническую часть» -> technical, «полный контекст» -> debug.
communication: {audience: product, detail_level: concise, explain_jargon: true, technical_details: on_request}

# v3.35 Модель продуктового репозитория: доопределение сигнальных путей под ЭТОТ стек.
# Кит знает типовые пути; какие пути в этом продукте относятся к контуру, знает владелец.
# Доопределение превращает `unknown` («не умею видеть здесь») в проверяемое состояние — кит
# ничего не выдумывает вместо вас. Раскомментируйте и укажите свои.
# product_operating_model:
#   contours:
#     analytics_learning: {change_signals: ["src/telemetry/**", "src/**/events.ts"]}
#     data_contracts:     {change_signals: ["src/domain/**"]}
