input:
  task: |-
    Независимое ревью кода. Изменение убирает из продакшн-модуля ai_ops_kit/engops/refusal_paths.py фиктивную ветку --selftest, которая печатала «SELFTEST PASSED», не вызвав ни одной проверяемой функции, и заменяет её честной формой: модуль печатает свой docstring и называет, где лежат настоящие проверки (tests/unit/).

    Правило репозитория (AGENTS.md): «Selftest не живёт в продакшн-модуле. Модули ai_ops_kit/ едут в child-репозиторий; тест модуля — в tests/unit/test_<module>_selftest.py».

    Дай заключение по гейту code_review.
