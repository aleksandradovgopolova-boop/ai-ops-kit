# Наблюдения продуктовых метрик (семейство Time to Verified Outcome).
# Источник значений — реальные живые прогоны кита на полигонах. Ничего не выдумано:
# каждое число снято из артефактов прогона, git и PR. Метрики определены в
# context/product/MetricCatalog.md — ключи здесь совпадают с ним.
schema_version: 1
kind: metric-observations

# ЧЕСТНАЯ РАМКА. n=4 — ранний тренд, а не устойчивая норма: маленькая выборка на
# полигонах (не продакшн владельца), путь субагентный. Прогоны 2–4 шли параллельными
# субагентами — машинная нагрузка могла завысить время. Guardrail-окна ещё открыты.
honest_note: >-
  n=4 — это ранний тренд, а не устойчивая норма. Выборка маленькая, значения снимались
  на полигонах (не в продакшне владельца), путь субагентный (нет API-ключа для внутреннего
  писателя). Прогоны 2–4 шли параллельными субагентами, и машинная нагрузка могла завысить
  время. Метрики переделок и дефектов после слияния ещё в открытых окнах наблюдения —
  здоровье продукта на этих данных зелёным не считаем.

# Агрегат посчитан на 4 точках (дословно, без округлений сверх исходных значений).
aggregate:
  n: 4
  median_intent_to_verified: 5m03s
  range: 3m33s–11m23s
  verified_pr_rate: 4/4
  human_intervention_rate: 0/4
  note: >-
    Переделки и дефекты после слияния — окна ещё не закрыты: одно наблюдение слито
    (12:44), остальные три не слиты (pending_merge).

observations:
  - date: "2026-09-14"
    source: ai-ops-cockpit          # полигон
    feature: catalog-search         # функция «поиск по каталогу»
    pr: 65                           # PR #65, слит 2026-09-14
    samples: 1
    # Оговорка о пути: показывать честно вместе с числами.
    path_note: >-
      Писал субагент — в этой среде нет API-ключа для внутреннего писателя кита.
      Независимый ревьюер и обязательные гейты — зелёные.
    metrics:
      intent_to_verified_pr_time:
        value: 5m37s
        samples: 1
      verified_pr_rate:
        value: 1/1                   # без ручной доводки кода человеком
        samples: 1
      human_intervention_rate:
        value: 0/1
        samples: 1
      rework_rate:
        status: observation_window_open
        window_days: 7
        opened_at: "2026-09-14T12:44:07Z"
      post_merge_defect_rate:
        status: observation_window_open
        opened_at: "2026-09-14T12:44:07Z"

