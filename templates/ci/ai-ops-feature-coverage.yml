# ai-ops-feature-coverage.yml — child-CI: охват фич дочки как БЛОКИРУЮЩИЙ гейт (W4).
# Устанавливается `ai-ops init` в .github/workflows/ (или скопируйте вручную).
#
# ЧТО ДЕЛАЕТ. Прямо В ДОЧКЕ собирает вход гейта охвата фич и выносит вердикт:
#   реестр фич дочки (`registry/features.yaml`)
#   + поверхности продукта, ИЗВЛЕЧЁННЫЕ из её кода (`extract_surfaces`, W2)
#   → судья охвата (W3) под ПЕРСИСТЕНТНЫМ baseline verified-сирот.
# Незадокументированная verified-поверхность (доказанная детерминированным разбором фича в коде без
# записи в реестре) сверх принятого baseline РОНЯЕТ джобу (exit≠0) — это и есть внешний путь
# enforcement, ради которого гейт feature_coverage переведён в blocking. inferred-сироты и ghost'ы
# остаются предупреждениями и код возврата не меняют (сила честна по confidence — статьи FEAT-003/004).
#
# ПЕРСИСТЕНТНЫЙ BASELINE (`.ai/feature-coverage-baseline.yaml`, живёт В ДОЧКЕ).
# CI не пишет в защищённый main: первый seed/снижение предлагается как artifact и принимается PR.
# Пока seed не принят, прогон лишь предлагает исходный потолок; это НЕ доказательство ратчета.
# С принятым baseline рост verified-сирот блокирует, снижение предлагается для следующего PR.
# PR не должен повышать уже принятый потолок. Обновлённый baseline проверяется владельцем.
#
# Опт-аут: удалить этот файл. Инструменты кита не в репо — берутся из parent по ПИНУ = installed_version
# (как в ai-ops-validate): один источник версии, который и так едет через PR обновления.
name: ai-ops-feature-coverage
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read   # baseline меняется только через проверенный PR
concurrency:
  # Отменять УСТАРЕВШИЕ прогоны — но ТОЛЬКО для PR (новый пуш в тот же PR гасит прежний).
  # На push в main / schedule / release / record отмена НЕ применяется: там каждый прогон
  # относится к своему коммиту/событию, и его потеря = дыра в проверке или в записи.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  feature-coverage:
    # Раннер выбирается ПЕРЕМЕННОЙ, а не зашит. `ubuntu-latest` существует только у GitHub: в
    # организации со своими раннерами джоба с этим ярлыком просто висит в очереди. Задайте
    # `vars.CI_RUNNER_LINUX` — и кит поедет на вашей машине (обкатано на self-hosted стенде).
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # Python ставим ТОЛЬКО на раннерах GitHub. На своей машине `setup-python` уходит в tool cache
      # по пути раннеров GitHub, которого там нет, а `pip install` в системный python Ubuntu 24.04
      # запрещён (PEP 668). На своём раннере предустановку не молчим, а ПРОВЕРЯЕМ (см. ai-ops-validate).
      - uses: actions/setup-python@v5
        if: ${{ !vars.CI_RUNNER_LINUX }}
        with: {python-version: "3.12"}
      - run: pip install pyyaml
        if: ${{ !vars.CI_RUNNER_LINUX }}
      - name: Проверить python и pyyaml (свой раннер)
        if: ${{ vars.CI_RUNNER_LINUX }}
        run: |
          python3 -c 'import sys, yaml; print("python", sys.version.split()[0], "· pyyaml", yaml.__version__)' \
            || { echo "на раннере '${{ vars.CI_RUNNER_LINUX }}' нет python3 с pyyaml — поставьте их на машину раннера (кит ставить их в системный python не будет: PEP 668)"; exit 1; }
      - name: Клонировать kit на пин = installed_version (.ai-ops.yaml)
        run: |
          SRC=$(python3 -c "import yaml;s=yaml.safe_load(open('.ai-ops.yaml'))['parent']['source'];print(s[4:] if s.startswith('git+') else s)")
          VER=$(python3 -c "import yaml;print(yaml.safe_load(open('.ai-ops.yaml'))['parent']['installed_version'])")
          echo "kit pin = v$VER (из .ai-ops.yaml, не protected)"
          git clone --depth 1 --branch "v$VER" "$SRC" "$RUNNER_TEMP/ai-ops-kit" \
            || { echo "не удалось клонировать kit v$VER из $SRC — нет тега v$VER, нет доступа к репозиторию или каталог занят (причина в выводе git выше)"; exit 1; }
      - name: Проверить принятый baseline (PR не повышает и не сбрасывает потолок)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          import yaml
          rel = ".ai/feature-coverage-baseline.yaml"
          def value(text):
              data = yaml.safe_load(text)
              n = data.get("verified_orphans") if isinstance(data, dict) else None
              if type(n) is not int or n < 0:
                  raise SystemExit("Baseline повреждён: нужен неотрицательный integer verified_orphans")
              return n
          path = Path(rel)
          current = value(path.read_text(encoding="utf-8")) if path.exists() else None
          base = os.environ.get("BASE_SHA", "")
          if base:
              subprocess.run(["git", "rev-parse", "--verify", base + "^{commit}"], check=True, stdout=subprocess.DEVNULL)
              present = subprocess.check_output(["git", "ls-tree", "--name-only", base, "--", rel]).decode().strip()
              if present:
                  accepted = value(subprocess.check_output(["git", "show", base + ":" + rel]).decode())
                  if current is None or current > accepted:
                      raise SystemExit("PR удаляет или повышает принятый baseline; добавьте фичу/связь, потолок ходит только вниз")
          PY
      # ГЕЙТ ОХВАТА ФИЧ. Судья и извлечение поверхностей едут в дочку (пакет ai_ops_kit/checks); сам
      # валидатор берётся ИЗ КЛОНА (как соседние validate_*), поэтому PYTHONPATH = клон кита. Режим
      # --child-root собирает вход из кода дочки; --seed включает персистентный baseline (сидирование
      # + ратчет вниз). Возврат 1 = появилась verified-сирота сверх baseline → джоба падает.
      - name: Гейт охвата фич (verified-orphan блокирует; inferred/ghost — предупреждают)
        run: |
          PYTHONPATH="$RUNNER_TEMP"/ai-ops-kit \
            python3 "$RUNNER_TEMP"/ai-ops-kit/ai_ops_kit/validation/validate_feature_coverage.py \
              --child-root . \
              --registry registry/features.yaml \
              --baseline .ai/feature-coverage-baseline.yaml \
              --seed
      - name: Сохранить предложенный baseline для принятия через PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-coverage-baseline-${{ github.run_id }}
          path: .ai/feature-coverage-baseline.yaml
          include-hidden-files: true   # .ai/ — скрытый каталог; иначе artifact пуст
          if-no-files-found: ignore
      - name: Граница проверки baseline
        run: |
          echo "Seed/снижение baseline из artifact принимается через PR; CI не коммитит в main."
          echo "Без принятого baseline первый seed не доказывает блокировку роста."
