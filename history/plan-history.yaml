      больше не требует правки реестра — расхождение невозможно by construction; сверка при
      объявлении сохранена (защита от повторного «прибивания гвоздём»), публичный текст сверяется с
      этим фактом через derived_numbers_in_docs. ЗАМЕР: три теста на capability
      (side-effect/positive/fail-closed) + обновлён инвариант test_rules_are_data_not_code; быстрый
      контур 3044 passed, ruff 0.
      ПОТОЛКИ (вторая половина названия) закрыты ОСОЗНАННО, а не сделаны: вывести потолок «из факта»
      значит приравнять его к текущему размеру и убить запас, ради которого он существует. У потолков
      delivery-budget уже своя дисциплина подъёма (названные файлы, даты, одно место в реестре —
