    # РЕШЕНО ВЛАДЕЛЬЦЕМ 2026-08-12: отлагать в ветку + PR. СДЕЛАНО: локальный `update` при
    # `policy: pr` применяет обновление в отдельном git-worktree на ветке `ai-ops/update-v<версия>`
    # и коммитит там; рабочее дерево владельца не трогается вовсе (грязное дерево не блокер).
    # Обновление не переписано — тот же `cmd_update` с `--in-place` и другим корнем. CI-путь сохранён
    # ЯВНЫМ флагом в шаблоне, а не угадыванием окружения. Отсутствие поля читается как `pr`.
