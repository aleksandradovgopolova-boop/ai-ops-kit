      ПОРЯДОК их — часть правки: замер до неё — `./ai-ops specify docs --feature wi-collide` создавал
      каркас в `docs/features/…` и возвращал 0.
      F-033 — `validate_acceptance_result` (механизм против ложного green) в дочке не исполнялся
