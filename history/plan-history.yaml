  - id: registry-reconciles-with-base
    title: >-
      Реестр активной работы сверяется с базой — влитая работа перестаёт числиться брошенной
    goal: team-works-in-parallel
    status: done
    closed_at: '2026-08-18'
    pr: 167
    result: >-
      ЗАКРЫТО 2026-08-18 (PR #167). Заявка #137. ЗАМЕР на 3.36.12: ветка работы влита обычным merge,
      запись оставлена `blocked` — `ai-ops status` отвечает «Работа идёт» и советует не трогать те же
      файлы; сверки с базой не было НИКАКОЙ (ни `merged`, ни `is-ancestor`, ни `superseded`). В поле
      (17.08, ИИ-Среда) из четырёх незакрытых записей ТРИ относились к давно влитой работе.
      СДЕЛАНО: `reconcile_with_base` сверяет запись при чтении — база тем же резолвером, что у
      `run`/`review` (`pipeline_git._resolve_base`, PR #164), а не хардкод `main`; расхождение
      считается В ОБЕ СТОРОНЫ и показывается двумя числами (в поле нашлась ветка впереди на 1 и позади
      на 241 — одно направление давало «не влито» на закрытой задаче), а влитость определяется ПО
      СОДЕРЖАНИЮ (`merge-base --is-ancestor`); влитая запись помечается `superseded` с причиной И ДАТОЙ;
      неизмеримость (ветки нет локально, база не подобралась) называется, а не выдаётся за «не влито».
      ПОДКЛЮЧЕНО КО ВСЕМ ТРЁМ ПУТЯМ ОТВЕТА: `status`, прогноз при `register`, прогноз при `check` —
      иначе предупреждение «не трогай те же файлы» продолжало бы приходить от работы, которой нет.
      СНЯТОЕ ПИШЕТСЯ НА ДИСК (только переход в `superseded`, только для своей машины): без записи та же
      ложь возвращается при следующем чтении. Это делает `status` пишущей командой — решение осознанное
      и названо в выводе. `status_reason` датируется («код не написан — правок 0» без даты читается как
      утверждение о настоящем). ПРИЁМКА: 13 тестов (влитая снята; КОНТРОЛЬ — живая остаётся и оба числа
      названы; форма «впереди 1, позади много» не читается как влитая; ветки нет -> причина; `done` не
      трогаем; снятое сохраняется; причина датирована), ШОВ через `ai-ops status` плюс швы на
      `register` и `check` с обратными половинами; 4 пробы — killed 4, выжило 0;
      `validate_mutation_probes` OK 50 проб; полный быстрый профиль без фильтра 2186 passed.
      НАЙДЕНО ПРОБОЙ В СВОЁМ ЖЕ КОДЕ: первая версия seam-пробы ВЫЖИЛА — тест звал `reconcile_with_base`
      сам и до `register` не доходил, то есть проверял функцию, а не шов; разбор записан в пробу.
      СВЯЗЬ: `what-is-running-answered-from-the-plan` (реестр не сверяют С ПЛАНОМ) остаётся открытой —
      это вторая слепота того же ответа.
  - id: run-execute-dies-on-ii-sreda
    title: '`run --execute` падает FileNotFoundError: ''claude'' при живом claude в PATH'
    goal: real-product-qualification
    status: done
    closed_at: '2026-08-18'
    commit: 58395de53c83907384a562d655425e08cef81db1
    pr: 168
    result: >
      ЗАКРЫТО 2026-08-18 (PR #168). Заявка поля 13.08 и 15.08.2026 (ИИ-Среда): `run --execute` падал
      `FileNotFoundError: 'claude'` при живом claude в PATH, УЖЕ сделав часть работы — правка лежала в
      worktree кита, прогон умер на более позднем шаге.
      ЗАМЕР НА 3.36.12, СНАЧАЛА ВОСПРОИЗВЕДЕНИЕ: живой прогон в дочке (крошечный python-репозиторий,
      claude в PATH, ключа нет, путь `./ai-ops run --execute`) прошёл целиком — READY_FOR_PR, 9 шагов
      tool-loop, 3 правки через брокера. Проба ДОШЛА до запуска модели, то есть замер содержателен:
      в этой конфигурации класс не воспроизводится, и закрывать работу «переписыванием адаптера»
      было бы лечением догадки.
      ЧТО ОКАЗАЛОСЬ ЖИВЫМ. 17.08 (PR #141) закрыл ОДИН путь — явный `--provider claude-cli`.
      Расхождение осталось на двух остальных, и оба замерены на стенде: (1) назван рабочий
      AI_OPS_CLAUDE_BIN, claude вне PATH (venv / планировщик / LaunchAgent) -> автовыбор уходит в mock
      и печатает «правок не будет» ПРИ ЖИВОМ исполнителе; (2) claude в PATH, названный путь битый ->
      автовыбор берёт claude-cli без предупреждения, работа регистрируется, дерево готовится, и первый
      же вызов модели отказывается — ровно поле 15.08 (прогон умер, работа осталась в worktree).
      ПРИЧИНА ОДНА И ОНА ШОВ: автовыбор (`resolve_provider`) и выбор сильного writer'а в движке
      (complexity-routing, `ai_ops_run`) звали голый `which("claude")` — тот второй взгляд, который
      `claude_binary` заводился устранить. Класс возвращался дважды (13.08 и 15.08) именно так: каждый
      новый вызывающий писал `which("claude")` заново.
      СДЕЛАНО: `claude_lookup` отвечает «что нашли и ГДЕ искали» (named|path), `claude_binary` остался
      тонкой обёрткой — вызывающих не переписывали; оба пути спрашивают его; причина называет источник
      и больше не говорит «найден в PATH» там, где PATH не спрашивали; битый названный путь — отказ ДО
      прогона с советом про переменную, а не «установите claude CLI» тому, у кого CLI стоит и назван.
      PATH читается из ПЕРЕДАННОГО env: на этом споткнулась первая проба самой работы — замер с
