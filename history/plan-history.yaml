  - id: run-execute-dies-on-ii-sreda
    title: '`run --execute` падает FileNotFoundError: ''claude'' при живом claude в PATH'
    goal: real-product-qualification
    status: done
    closed_at: '2026-08-18'
    commit: 58395de53c83907384a562d655425e08cef81db1
    pr: 168
    result: >
      ЗАКРЫТО 2026-08-18 (PR #168). Заявка поля 13.08 и 15.08.2026 (ИИ-Среда): `run --execute` падал
      `FileNotFoundError: 'claude'` при живом claude в PATH, УЖЕ сделав часть работы — правка лежала в
      worktree кита, прогон умер на более позднем шаге.
      ЗАМЕР НА 3.36.12, СНАЧАЛА ВОСПРОИЗВЕДЕНИЕ: живой прогон в дочке (крошечный python-репозиторий,
      claude в PATH, ключа нет, путь `./ai-ops run --execute`) прошёл целиком — READY_FOR_PR, 9 шагов
      tool-loop, 3 правки через брокера. Проба ДОШЛА до запуска модели, то есть замер содержателен:
      в этой конфигурации класс не воспроизводится, и закрывать работу «переписыванием адаптера»
      было бы лечением догадки.
      ЧТО ОКАЗАЛОСЬ ЖИВЫМ. 17.08 (PR #141) закрыл ОДИН путь — явный `--provider claude-cli`.
      Расхождение осталось на двух остальных, и оба замерены на стенде: (1) назван рабочий
      AI_OPS_CLAUDE_BIN, claude вне PATH (venv / планировщик / LaunchAgent) -> автовыбор уходит в mock
      и печатает «правок не будет» ПРИ ЖИВОМ исполнителе; (2) claude в PATH, названный путь битый ->
      автовыбор берёт claude-cli без предупреждения, работа регистрируется, дерево готовится, и первый
      же вызов модели отказывается — ровно поле 15.08 (прогон умер, работа осталась в worktree).
      ПРИЧИНА ОДНА И ОНА ШОВ: автовыбор (`resolve_provider`) и выбор сильного writer'а в движке
      (complexity-routing, `ai_ops_run`) звали голый `which("claude")` — тот второй взгляд, который
      `claude_binary` заводился устранить. Класс возвращался дважды (13.08 и 15.08) именно так: каждый
      новый вызывающий писал `which("claude")` заново.
      СДЕЛАНО: `claude_lookup` отвечает «что нашли и ГДЕ искали» (named|path), `claude_binary` остался
      тонкой обёрткой — вызывающих не переписывали; оба пути спрашивают его; причина называет источник
      и больше не говорит «найден в PATH» там, где PATH не спрашивали; битый названный путь — отказ ДО
      прогона с советом про переменную, а не «установите claude CLI» тому, у кого CLI стоит и назван.
      PATH читается из ПЕРЕДАННОГО env: на этом споткнулась первая проба самой работы — замер с
      подменённым окружением молча смотрел в настоящий PATH и показывал ложную картину.
      СТРУКТУРНЫЙ ЗАПРЕТ вместо надежды на память: `which("claude")` мимо `claude_lookup` краснеет, и
      сборка команды с голым именем — тоже. Поведенческие тесты ловят два известных места, этот —
      третье, которого ещё нет.
      ПРИЁМКА: 10 тестов (оба направления лжи; матрица равносильности «выбрали claude-cli» ⟺ «есть чем
      запустить» на четырёх конфигурациях; КОНТРОЛЬ — обычный случай не изменился слово в слово;
      замыкание круга — запускается ровно выбранный файл); мутация ПАРОЙ: без исправления 3 из 10
      красные, с исправлением 37 зелёных вместе с `test_provider_resolution.py`; 3 пробы прогнаны
      механизмом — выжило 0; `validate_mutation_probes` OK 53 пробы; охват full-current-python
      2194 passed, 9 skipped.
      ОСТАЛОСЬ ОТКРЫТЫМ, НО НЕ ЭТИМ: замер на самой ИИ-Среде не делался — дерево держат живые сессии,
      и решение владельца 18.08 было туда не писать; предсуществующий красный
      `test_documented_entry_point_actually_runs` (проверен на чистом main той же машины) — работа
      `local-run-must-mirror-ci`.
      ПОБОЧНОЕ НАБЛЮДЕНИЕ СТЕНДА: `plan` на крошечной задаче доложил «на разбор ушло 362 тысячи
      токенов при потолке 50» — счётчик мерил расход сессии, из которой шёл прогон, а не разбор задачи.
      Заведено отдельно не было: сначала проверить, повторяется ли вне сессии-обёртки.
  - id: child-observations-reach-the-kit
    title: Наблюдения о ките из продуктового репозитория доезжают до кита как данные
    goal: real-product-qualification
    status: done
    closed_at: '2026-08-18'
    pr: 169
    result: >
      ЗАКРЫТО 2026-08-18 (PR #169) — ПРИЗНАКОМ ГОТОВНОСТИ, а не механизмом: механизм влит 17.08
      (PR #135), а объявленный признак требовал провести НАСТОЯЩЕЕ наблюдение ИИ-Среды контуром от
      записи в дочке до строки в плане кита и обратно до состояния в дочке. Признак пройден на живом
      `~/ii-sreda` (кит там 3.36.12 — блокер «команды feedback нет в 3.36.8» снят обновлением 17.08).
      ЧТО ПРОВЕДЕНО. Наблюдение из памяти проекта ИИ-Среды за 12.08.2026 («прогон трижды остановился,
      не доделав; тест порога сузил до сделанного») записано командой дочки с УЛИКОЙ ИЗ САМОЙ ДОЧКИ:
      `git show 06f8041 -- src/shared/api/eval-scenario-balance.test.ts` показывает
      `MVP_SCENARIOS = ["note", "presentation", "dashboard"]` — порог на трёх сценариях из четырёх,
      одностраничник выпал; четвёртый вернул ЧЕЛОВЕК, и рядом с порогом в текущем main стоит
      объяснение, почему вынимать сценарий нельзя. Дальше: сборка в кит (`findings/from-children/`),
      решение `became_work` со ссылкой на работу `run-finishes-the-task-or-says-it-did-not`, и
      состояние вернулось в дочку — `./ai-ops feedback` в ИИ-Среде печатает «стало работой» с
      причиной. Круг замкнут на живом репозитории.
      ТРИ ДЕФЕКТА, НАЙДЕННЫЕ ЭТОЙ ЖЕ ПРОБОЙ, и все из класса, который кит требует от других.
      (1) `./ai-ops feedback .` — ровно та команда, которую кит САМ печатает как «посмотреть судьбу
      сказанного», плюс привычная по всем остальным командам точка — ЗАПИСАЛА наблюдение с
      содержанием «.» и ответила «записал»; судьбу человек не увидел. Обёртка подставляет путь первым
      позиционным, второй уезжал в текст. Закрыто на ДВУХ уровнях: путь-как-текст читается как
      просьба показать судьбу (CLI), и запись пути отказывается с причиной (модуль) — канал наполняют
      и командой, и модулем. (2) Первая запись легла в дерево дочки НЕотслеживаемой и
      НЕигнорируемой — худшее из состояний: git-гигиене не видно, чужой `git add -A` унёс бы в
      посторонний коммит (так уже терялись правки 12.08). Выбрано игнорировать, а не отслеживать: кит
      не сорит в истории продукта, а копия наблюдения лежит в ките и там отслеживается; цена названа —
      записи локальны для машины. Дописка в `.gitignore` владельца названа в отчёте установки.
      (3) ОДНА битая запись глушила ВЕСЬ ответ о судьбе: человек читал «часть замечаний я не читаю» и
      ни слова о том, что стало с настоящим наблюдением, по которому решение принято. Это и есть та
      тишина, от которой канал умирает. Плюс арифметика ответа врала: `total` считает только читаемые
      записи, поэтому «записано 1, но 1 из них не разбираются» на одной хорошей и одной битой
      читалось как «единственная запись сломана».
      ПОЙМАНО СОБСТВЕННОЙ ПРОВЕРКОЙ КИТА: правило ignore уехало дочкам, а сам кит его не применял —
      `validate_own_medicine` покраснел третьим пунктом (база — два известных: `entry_point` и
      `communication_adapter`, работа `own-medicine-checked`). Правило добавлено и в `.gitignore` кита.
      ПРИЁМКА: 13 тестов, из них контрольные с обеих сторон (наблюдение с путём ВНУТРИ фразы
      принимается; короткое замечание «тормозит» принимается — отказ по длине отшивал бы настоящую
      обратную связь); CLI зовётся ПРОЦЕССОМ в порядке обёртки, а не `main()` в человеческом порядке —
      именно этого тесты кита и не видели; мутация парой (без исправлений 6 из 13 красные), 4 пробы
      прогнаны механизмом — выжило 0; охват full-current-python 2197 passed при единственном
      предсуществующем красном (`test_documented_entry_point_actually_runs`).
      ЧТО ОСТАЛОСЬ И ЧЕМ: исправления живут в ките, а дочка исполняет свою копию — в ИИ-Среде
      `./ai-ops feedback .` до обновления снова запишет мусор (проверено, запись убрана). Это работа
      `fixes-must-reach-the-child` (закрыта 17.08) плюс следующий релиз, а не остаток этой.
