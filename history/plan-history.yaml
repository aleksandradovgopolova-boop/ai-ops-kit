      (`cz bump --check-consistency` с `version_provider = "scm"`) НЕ ПРИМЕНИМ на этом репозитории:
      провайдер читает теги и падает `InvalidVersion: '3.9.2-remote'` — в репозитории висит
      посторонний тег `v3.9.2-remote` рядом с `v3.9.2`. Гейт, зависящий от гигиены 259 тегов, ломается
      от одного лишнего. Тег НЕ УДАЛЁН: удаление тега — решение владельца, и оно не требовалось.
      ЧТО СДЕЛАНО — ТРИ ВОРОТ, каждые со своей дырой. (а) `towncrier check --compare-with origin/main`
      — «в этой ветке добавлена запись для CHANGELOG»; единственный из шести рассмотренных
      инструментов с таким гейтом (EV-1137). `build` не зовётся НИГДЕ — старый CHANGELOG.md остаётся
      как есть, ретро-миграция 364 КБ не нужна; тест это сторожит. Тип `chore` введён намеренно: гейт
      строгий (решение владельца), а служебные изменения — план, история, решения — тоже идут через
      PR, и без такого типа строгий гейт заставлял бы придумывать «новость», то есть его обходили бы.
      (б) `cz check` от ТОЧКИ ВКЛЮЧЕНИЯ (решение владельца 17.08: только новые коммиты). Замер 18.08:
      на последних 5 коммитах зелено, на последних 30 красно. Код 3 («в диапазоне нет коммитов»)
      ЗАМЕРЕН и считается за успех — гейт, краснеющий на пустоте, отключают целиком. (в) Выпуск без
      раздела CHANGELOG для своей версии теперь ОТКАЗЫВАЕТСЯ: здесь стояло «записки будут краткими»,
      то есть релиз выходил с пустой историей и никто об этом не узнавал. Отказ дешёвый и обратимый —
      тег ещё не создан.
      ГДЕ СТОЯТ ВОРОТА И ПОЧЕМУ ИМЕННО ТАМ: шаги добавлены в УЖЕ ОБЯЗАТЕЛЬНУЮ джобу `lint`, а не в
      новую. Новая джоба не попадает в обязательные статусы защиты ветки без действия владельца — то
      есть гейт исполнялся бы «по желанию», ровно класс «объявлено, но не исполняется». Имя джобы не
      меняли: оно закреплено в защите. `fetch-depth: 0` добавлен не для красоты — на shallow-клоне
      базы нет, и гейт молча не нашёл бы diff.
      ЗА ПРЕДЕЛАМИ ОБЪЯВЛЕННОГО write_scope (названо, а не сделано молча): `AGENTS.md` — релизный
      процесс описан там, и вторая правда в `docs/` разошлась бы с ним; `newsfragments/` — носитель
      записей; `tests/`, `quality/` — приёмка и пробы. Точка включения живёт в `pyproject.toml`
      (в объявленном scope), а не строкой в workflow: её читают два потребителя.
      ПРИЁМКА: 14 тестов. Поведенческие — оба гейта в ДВУХ состояниях (ветка без записи краснеет, с
      записью проходит; выпуск без раздела отказывается с причиной, с разделом берёт записки именно из
      своего раздела); логика выпуска ИЗВЛЕКАЕТСЯ из workflow и исполняется bash-ем, а не
      пересказывается. Мутация парой: две мутации роняют 3 теста. Две пробы прогнаны механизмом —
      выжило 0. Охват full-current-python 2267 passed.
      НАЙДЕНО ПРОБОЙ В СВОЁМ ЖЕ КОДЕ (третий раз за день): тест «прежнее поведение не вернулось»
      поймал МОЙ ЖЕ комментарий, цитирующий прежнюю формулировку, — проверял слова, а не код; и тест
      точки включения падал в копии дерева без `.git`, из-за чего базовый прогон проб покраснел и две
      пробы остались НЕПРОВЕРЕННЫМИ. Оба исправлены (сравнение по исполняемым строкам; честный пропуск
      с причиной вместо красноты не по делу).
  - id: capability-freeze-enforced
    title: Заморозка новых умений до второго brownfield исполняется проверкой, а не памятью
    goal: second-real-brownfield
    status: done
    closed_at: '2026-08-19'
    pr: 173
    result: >
      ЗАКРЫТО 2026-08-19 (PR #173). ПОВОД ЖИВОЙ, а не теоретический: 18.08 вечером кит САМ предложил
      мне взять `watch-contract-for-night-review` — работу из цели `nightly-product-review`, то есть
      новое умение, — при держащейся заморозке. Решение владельца
      `ep-2026-08-17-capability-freeze-until-second-brownfield` существовало ЗАПИСЬЮ в реестре и
      ничем не сверялось; ровно это и было предметом работы. Владелец 19.08 подтвердила: брать
      исполнение заморозки вместо замороженной работы.
      СДЕЛАНО. Отношение к заморозке объявляется НА ЦЕЛИ (`freeze_relation: run_condition|extension`),
      а не на работе: оговорка решения сказана про НАЗНАЧЕНИЕ, и проверять её по формулировке заявки
      значило бы открыть лазейку через слова — это названо в самом решении. Классификация 14 целей
      выведена из трёх оговорок решения, помечена обратимой и правится одной строкой; пять целей —
      расширения (`advisory-gates-obkatka`, `storybook-as-visual-contract`,
      `owner-speaks-product-not-pipeline`, `nightly-product-review`, `outcome-and-analytics-loop`),
      их семь работ кит больше не предлагает.
      ЧЕТЫРЕ УСЛОВИЯ ИЗ ПЛАНА ВЫПОЛНЕНЫ: (1) объявление обязательно и его отсутствие краснеет;
      (2) взятие замороженной работы — ошибка проверки плана, называющая решение НОМЕРОМ; ОБЪЯВЛЯТЬ
      замороженную работу в плане при этом можно — иначе план перестал бы описывать продукт;
      (3) оговорка сверяется с целью, а исключение существует только явно
      (`freeze_exception: <причина>`), причём пустая причина — ошибка, потому что молчаливый обход и
      есть то, от чего правило не работает; (4) снятие — не дата и не флаг: состояние читается из
      исхода `owner_reaches_verified_pr_without_patching_the_kit`, ручного выключателя в коде нет, и
      отдельный тест сторожит, что он не появится.
      FAIL-CLOSED С ГРАНИЦЕЙ. Цель есть, а исхода нет — заморозка считается держащейся: иначе правило
      снималось бы удалением одной строки в том же файле, который оно охраняет. НО цели нет вовсе —
      правило не применяется: заморозка это внутреннее решение о развитии КИТА, и требовать её
      классификацию от плана чужого продукта значило бы экспортировать свою политику в чужой CI.
      Эту границу нашёл ПЕРВЫЙ ЖЕ полный прогон: обязательный признак уронил 12 проверок, включая
      планы, которые кит САМ создаёт дочке (`bootstrap`), и шаблон плана. Признак применимости —
      наличие цели заморозки в плане: она есть только там, где решение принято.
      ЧЕЛОВЕКУ СКАЗАНО: ответ `next` называет, сколько работ не предложено и почему («помечены как
      расширение умений, а твоё решение держит их до второго живого проекта») — замороженное не
      исчезает молча, иначе это читалось бы как «в плане их нет».
      ПРИЁМКА: 21 тест, включая контроли с обеих сторон (работа цели-условия не замораживается;
      план продукта без цели заморозки не обязан ничего объявлять; ответ без заморозки не обрастает
      лишними словами) и проверку на настоящем плане репозитория. Мутация парой: три мутации роняют
      3 теста; три пробы прогнаны механизмом — выжило 0.
      ПОПУТНО: образец одной пробы пришлось привести к изменившемуся коду — валидатор проб это и
      поймал («образец охраны встречается 0 раз»), то есть механизм проверки проверок сработал на
      самой этой работе.
  - id: security-gate-closable-on-quick
    title: 'Гейт безопасности либо закрывается на уровне задачи, либо не блокирует её'
    goal: green-means-checked
    status: done
    closed_at: '2026-08-19'
    pr: 176
    result: >
      ЗАКРЫТО 2026-08-19 (PR #176). Повод — находка B2-24 третьего прогона на втором brownfield:
      прогон QUICK дошёл до конца, СДЕЛАЛ РАБОТУ (13 шагов, коммит, критерий приёмки подтверждён
      цитатой ревьюера) и остановился на гейте `security` с `checks: []`, `evidence: []` и
      единственным блокером «нужен независимый security-reviewer/человек». Диф — три файла, ни один
      из четырёх названных доменов им не затронут: домены подняты СОВПАДЕНИЕМ ПО СОДЕРЖИМОМУ, а на
      уровне QUICK судья выключен автоподбором. Закрыть требование было НЕЧЕМ.
      РАЗВИЛКУ РЕШИЛ ЗАМЕР, А НЕ ВКУС — и это было условие самой работы. Корпус: 240 НАСТОЯЩИХ
      коммитов четырёх живых репозиториев (niti, ii-sreda, msh_news_bot_v2, bolshe-ne-budu-menshe).
      Класс «домен применим, находок ноль, закрыть нечем» — 184 прогона из 240 (77%). Из них в 148
      КАЖДЫЙ такой домен поднят ТОЛЬКО содержимым — 62% всех прогонов. Цена второго варианта
      («поднимать судью на QUICK») тем же замером: судья на 7 из 10 мелких правок. Выбран вариант
      «предупреждать, а не блокировать».
      ПЕРВАЯ ПРОБА КОРПУСА БЫЛА НЕВЕРНОЙ, И ЭТО НАШЛОСЬ ДО ВЫВОДОВ. `_git_changed_files` сравнивает
      `base..HEAD`, поэтому «base=<sha>~1» на старом коммите даёт НАКОПЛЕННЫЙ диф до HEAD, а не диф
      коммита: первый замер показал «блокировано 59 из 60» и приписал это работе гейта, хотя мерил
      чужие правки. Признак подделки нашёлся по составу находок — все лежали в `.ai/managed/`, то
      есть в установленной копии САМОГО кита. Замер переделан на карту файлов из `git show <sha>:<путь>`.
      СДЕЛАНО. (1) Домен без единой находки, поднятый ТОЛЬКО содержимым (`_content_only`), получает
      статус `advisory` и уходит в отдельный список, а не в `needs_review`. (2) `advisory` — ОТДЕЛЬНЫЙ
      вердикт, не `clear`: «проверено чисто» и «проверять было нечего» обязаны выглядеть по-разному,
      иначе цена правки превращается в ложный зелёный; список предупреждений уезжает в evidence гейта
      и в `run-report.json`. (3) Вторая половина названия работы — ЗАКРЫВАЕМОСТЬ: ветка
      человеко-одобрения требовала `review`, которого на QUICK не бывает, и прогон падал в общий
      отказ, называвший нужным того, кого на этом уровне не запускают. Теперь ветка достижима без
      судьи, а причина отказа говорит правду («судья на этом уровне задачи выключен автоподбором») и
      называет способ закрыть (ApprovalRecord).
      ИНВАРИАНТ НЕ ТРОНУТ И ОХРАНЯЕТСЯ С ДВУХ СТОРОН: домен с находками critical/high блокирует
      независимо от основания; домен, поднятый ПУТЁМ или СИГНАЛОМ, остаётся воротами.
      ОДИН СУЩЕСТВУЮЩИЙ ТЕСТ ИЗМЕНЁН ОСОЗНАННО, а не подогнан:
      `test_behaviour_files_still_raise_domains_by_content` ожидал `needs_review` для auth-логики в
      файле с не совпадающим путём. Это ровно названная цена варианта (б). Утверждение не ослаблено,
      а уточнено: домен обязан быть НАЗВАН (`advisory`), потому что «не блокирует» и «исчез» — разные
      вещи, и вторая вернула бы дефект v2.104.
      ЗА ПРЕДЕЛАМИ ОБЪЯВЛЕННОГО write_scope (названо, а не сделано молча): `newsfragments/` —
      запись для CHANGELOG, которой с 18.08 требует гейт выпуска; `planning/` и `history/` —
      закрытие самой работы. Кода это не касается.
      ПРИЁМКА: 8 тестов, из них два — на НАСТОЯЩЕМ прогоне `run_pipeline` уровня QUICK (тот самый,
      что упирался в гейт). Мутация парой: без правки 5 поведенческих тестов красные, 3 контроля
      зелёные В ОБОИХ состояниях (контроли намеренно читают новый ключ через `.get`, иначе их краснота
      говорила бы об отсутствии ключа, а не о поведении). Четыре пробы прогнаны механизмом — выжило 0.
      Полный прогон: 2619 passed; 5 красных — предсуществующие на чистом main и воспроизведены на нём
      же, это открытая работа `local-run-must-mirror-ci` (её формулировка «пять проверок красные
      всегда» подтвердилась буквально).
      НАБЛЮДЕНИЕ, НЕ ЗАКРЫТОЕ ЗДЕСЬ: признак `pending_human` до отчёта не доезжает — `gate_results`
      его теряет при уплощении, и человек читает только текст блокера. Текст теперь говорит, что делать,
      но сам признак стоит донести отдельной работой.
