  - id: session-handoff-written-not-declared
    title: >-
      Состояние сессии записывается перед уходом, а не объявляется записанным
    goal: green-means-checked
    status: done
    closed_at: '2026-08-17'
    pr: 145
    result: >-
      ЗАКРЫТО 2026-08-17 (PR #145). Сломано было НЕ измерение (оно точное: на сессии `88c802ae` кит
      напечатал контекст 427k и расход 85.2M из 20.0M — оба числа из транскрипта рантайма), а два
      других места, и закрыты оба. (1) НОСИТЕЛЬ ПОЯВИЛСЯ: `engops/session_handoff.py` пишет SESSION
      COMPLETE с семью разделами разбора владельца
      (Goal/Done/Decisions/Changed/Tests/Open/Next/Risks), названными ДОСЛОВНО как у `RunHandoff` —
      второй словарь развёл бы две правды об одном. Замер, из которого видно, что одного `RunHandoff`
      мало: в сессии `88c802ae` 329 ходов, движок не звался ни разу, `features/` пуст — весь труд
      сессии не имел носителя вообще. (2) ЗАЯВЛЕНИЕ ЗАМЕНЕНО ВЫВОДОМ: `handoff_created` считается из
      наличия файла, параметр `handoff_saved` УДАЛЁН (не переименован — вернуть его значит вернуть
      ложную галочку), обе безусловные фразы про сохранение заменены на производные, «не смог
      посмотреть» отличается от «не сохранён», а страж CLI на исходах `new_session`/`clear` теперь
      ПИШЕТ handoff, а не только советует уйти. МУТАЦИОННЫЙ ЗАМЕР: 3 пробы (2 охранные, 1 шовная),
      выжило 0, база зелёная — шовная ломает именно вызов из стража, потому что модуль можно написать,
      покрыть тестами и оставить мёртвым, как уже было с `from_doctor`. Решения владельца о протоколе
      записаны отдельно (PR #147, `ep-2026-08-17-session-protocol`). ОСОЗНАННО НЕ ВХОДИЛО и заведено
      отдельными работами: `session-watch-speaks-unasked` (проактивность),
      `session-command-reaches-the-child` (недостижимость из дочки),
      `session-ritual-validators-are-dead` (мёртвые контракты), `session-thresholds-remeasured`
      (пороги по замеру).
    # РАЗБОР, как он был записан в плане (перенесён дословно):
    # title: Состояние сессии записывается перед уходом, а не объявляется записанным
    # type: engineering
    # goal: green-means-checked
    # status: in_progress
    # branch: engops/session-protocol-handoff-2026-08-17
    # owner_role: engineer
    # depends_on: []
    # write_scope: [ai_ops_kit/engops/, ai_ops_kit/cli/, ai_ops_kit/ui/, tools/, tests/, quality/,
    #               rules/core/]
    # value: high
    # affects: {engineering_quality_security: true, delivery_operations: true}
    # ПОВОД — ЗАМЕР НА ЖИВОЙ СЕССИИ КИТА, 17.08.2026 (сессия `88c802ae`, 329 ходов). Владелец
    # спросила, почему кит не следит за лимитами сессии. Проверка показала обратное тому, что
    # ожидалось: СЛЕДИТ, и точно. `ai-ops session` на той же сессии напечатал контекст 427k
    # [measured], «прочитала 85.2M из 20.0M [over_budget]», исход NEW_SESSION и точную команду
    # выхода. Оба числа — из транскрипта рантайма, а не оценка.
    #
    # ЧТО БЫЛО СЛОМАНО НА САМОМ ДЕЛЕ — не измерение, а ДВА ДРУГИХ МЕСТА:
    #   1. никто не спрашивал. Совет живёт на двух путях: `_session_guard_before_start`
    #      (`cli/ai_ops_cli.py:961`, только `do` и `run --execute`) и конец прогона движка
    #      (`engine/ai_ops_run.py:1512`). Обычная рабочая сессия — разбор, правки, ревью — не
    #      проходит ни через один, и кит молчит не потому, что «норма», а потому, что его не звали;
    #   2. когда спрашивали — он ВРАЛ в последней строке. «Что сохранено: … handoff_created …» и
    #      «Handoff/решения сохранены в репозитории» были КОНСТАНТАМИ: параметр `handoff_saved=True`
    #      по умолчанию, которого ни один из двух вызывающих не передавал, и строковая константа в
    #      тексте рекомендации. Сессионного handoff в ките не существовало ни одного файла. То есть
    #      совет «уходи в новую сессию» успокаивал ровно там, где обязан предупредить.
    #
    # ЭТО СВОЙ СОБСТВЕННЫЙ КЛАСС «ОБЪЯВЛЕНО — НЕ ИСПОЛНЯЕТСЯ», в ритуале, который сам проверяет
    # честность закрытия работы. Ни один из 1800+ тестов его не видел: все они проверяли, что
    # функция возвращает то, что в неё написано. `rules/core/SessionEconomyPolicy.md:110-116`
    # объявляет Task Completion Ritual ОБЯЗАТЕЛЬНЫМ («без этого задача не считается закрытой») — и
    # один его пункт был неопровержим по построению.
    #
    # СДЕЛАНО: `engops/session_handoff.py` — SESSION COMPLETE с разделами разбора владельца
    # (Goal/Done/Decisions/Changed/Tests/Open/Next/Risks). Разделы НАЗВАНЫ ИМЕНАМИ `RunHandoff`
    # дословно: тот уже несёт те же семь полей, и заводить второй словарь значило бы развести две
    # правды об одном. Предмет разный, и это единственная причина второй сущности: `RunHandoff` —
    # один прогон движка по одному WorkItem (`features/<wid>/run-handoff.yaml`, читается `resume`);
    # `SessionHandoff` — рабочий контекст целиком, включая работу, которую движок не делал. Замер, из
    # которого видно, что одного `RunHandoff` мало: в сессии `88c802ae` 329 ходов, движок не звался
    # ни разу, `features/` пуст — весь труд сессии не имел носителя вообще.
    # Заявление заменено на ВЫВОД: `handoff_created` считается из наличия файла, параметр
    # `handoff_saved` УДАЛЁН (не переименован — вернуть его значит вернуть ложную галочку), обе
    # безусловные фразы про handoff заменены на производные, и «не смог посмотреть» отличается от
    # «не сохранён». Страж CLI на исходах `new_session`/`clear` теперь ПИШЕТ handoff, а не только
    # советует уйти.
    # Мутационный замер: 3 пробы (2 охранные, 1 шовная), выжило 0, база зелёная. Шовная ломает
    # именно вызов из стража — модуль можно написать и покрыть тестами, и он останется мёртвым, как
    # уже было с `from_doctor` и со всей политикой экономии сессии до 13.08.2026.
    #
    # ЧЕГО В ЭТОЙ РАБОТЕ НЕТ (осознанно, каждое — отдельной работой ниже): проактивного наблюдения
    # (кит по-прежнему говорит только когда его позвали), Checkpoint как сущности, переезда handoff
    # между машинами, и решения владельца о порогах и обязательности ритуала.

  - id: absent-base-is-resolved-or-refused
    title: >-
      Отсутствие базы сравнения подбирается или называется причиной — но не падает и не берёт
      весь репозиторий
    goal: green-means-checked
    status: done
    closed_at: '2026-08-18'
    pr: 164
    result: >-
      ЗАКРЫТО 2026-08-18 (PR #164). Одна причина, два заявленных дефекта поля (#136 и ПЕРВАЯ
      половина #139), оба воспроизведены на 3.36.12 до правки и перемерены после — парой замеров на
      каждый путь. ЗАМЕР ДО, пробный репозиторий (корневой коммит с ЧУЖИМ legacy
      `el.innerHTML = userInput`, затем безобидная правка одного файла): `run_pack(base=None)` дал
      `blocked` с находкой в `src/legacy.tsx`, которого правка не касалась, а с базой — `clear`;
      `review(base=None)` упал `TypeError … not NoneType`, с базой — `needs-reviewer`. Врал не
      вердикт, а ОХВАТ: при `base=None` сканировался весь репозиторий (`git ls-files`) — отсюда
      заявка и читалась как «блокирует без единой находки». СДЕЛАНО. `review`: применён автоподбор,
      который УЖЕ БЫЛ НАПИСАН (`pipeline_git._resolve_base`: текущая ветка -> upstream -> remote
      default) — тот же, что у `run`/`resume`, поэтому обещание справки CLI стало исполняться, а не
      печататься; хардкод `base="main"` убран (в чужом репозитории её может не быть, и этот дефолт
      прятал отсутствие базы); неразрешённая или выдуманная база — названный отказ в `base_note`;
      авто-база, совпавшая с ревьюируемой веткой, — тоже отказ, а не «изменений нет».
      `security_pack`: `base=None` -> отказ fail-closed с причиной; оба молчаливых варианта
      запрещены (весь репозиторий = аудит чужого legacy, пустой диф = «не проверено» под видом
      `clear`); единственный законный случай неразрешимой базы — `<sha>~1` у КОРНЕВОГО коммита —
      распознан точно, охват = файлы того коммита (проверено: файл, добавленный позже, в охват не
      попадает). ОХВАТ ТЕПЕРЬ РЯДОМ С ВЕРДИКТОМ: `scan_scope` в результате пака, база и её источник
      в отчёте ревью, в артефакте `branch-review.yaml` и в тексте для человека; отказ CLI — причина
      и код 2, не стек. ПРИЁМКА: 13 тестов (`tests/unit/test_absent_base_is_resolved_or_refused.py`),
