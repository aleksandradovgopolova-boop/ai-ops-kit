      ЗАКРЫТО 2026-08-18 (PR #165). ВТОРАЯ половина заявки #139; первую (охват скана) закрыл PR #164
      работой `absent-base-is-resolved-or-refused`. ЗАМЕР: в `run-report.json` писались ровно четыре
      поля (overall/applicable_domains/blocking/needs_review), а `domain_results` — сами находки
      (path/line/класс) и `applies_because` — не попадали ВОВСЕ (проверено чтением живого отчёта
      дочки ИИ-Среда от 17.08). Дефект не в экономии места: гейт говорит человеку «блокирующие домены
      (critical/high находки)» и ОТПРАВЛЯЕТ ЕГО В ОТЧЁТ, поэтому отчёт без находок делает утверждение
      гейта непроверяемым из артефакта, на который он сам ссылается — отсюда и читалась заявка
      «блокирует без единой находки». СДЕЛАНО: `security_pack.for_report` — проекция вердикта в отчёт
      (четыре прежних поля + `scan_scope` + `domain_results` с находками, статусом, severity,
      `applies_because`, remediation), терпимая к форме деградации `{"overall": "error"}` — упавшая
      проекция оставила бы отчёт вообще без security. ГРАНИЦА В КОДЕ, А НЕ В ОБЕЩАНИИ: список полей
      находки БЕЛЫЙ (`FINDING_REPORT_FIELDS`) — отчёт уезжает в PR, и при сквозном копировании новое
      поле находки, однажды принесшее значение, уехало бы туда само. ОБА ПУТИ ОТВЕТА: одиночный
      прогон и последовательный (`_aggregate_verify`, откуда наружу уходил только `security_overall`)
      — иначе две разные правды об одном вопросе, причём вторая молчит. ПРИЁМКА: 7 тестов
      (`tests/unit/test_security_verdict_shows_its_findings.py`), включая ШОВ через настоящий прогон с
      настоящим секретом и проверку, что ключа `AKIA…` нет во всём сериализованном отчёте даже когда в
      находки подсунуты поля `value`/`snippet`; 3 новые пробы (1 guard + 2 seam) — killed 3, выжило 0;
      `validate_mutation_probes` OK 43 пробы; смежный охват 430 passed. С этим обе половины заявки
      #139 закрыты.

