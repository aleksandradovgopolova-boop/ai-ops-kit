    goal: qualification-closeout
    status: done
    closed_at: '2026-08-14'
    pr: 122
    evidence: quality/mutation-probes.yaml
    result: >-
      ЗАКРЫТО 2026-08-14 двумя половинами (PR #122 — мутационные пробы, PR #123 — проба ШВА как
      требование приёмки). Правило «мутируй исправление» стало ИСПОЛНЯЕМЫМ:
      `quality/mutation-probes.yaml` называет охранные проверки механизмов,
      `devtools/mutation_probe.py` копирует дерево, снимает охрану В КОПИИ и требует, чтобы названный
      тест покраснел; `validate_mutation_probes.py` (75-й валидатор) держит реестр от отставания от
      кода. Исходов три — killed / survived / not_verified: неизвестность не выдаётся за успех. Вторая
      половина: у пробы появился `kind` (guard|seam), и валидатор требует хотя бы одну ШОВНУЮ пробу на
      каждый файл с охранными — правило нашло разрыв в той же работе, где было введено
      (`delivery_plan.py` имел три охранные пробы и ни одной шовной, при том что именно этот шов и
      сломался при разносе плана). ЗАМЕР: 9 проб (7 охранных, 2 шовных), 0 выживших. Исход цели
      `qualification-closeout -> contour_catches_declared_but_not_executed` стоит `true` по этому
      замеру. ОСТАТОК — РЕШЕНИЕ ВЛАДЕЛЬЦА, а не инженерный долг: делать ли пробы блокирующими для
      чужих правок. Сейчас они блокируют только через свой тест в общем прогоне; отдельного гейта нет
      НАМЕРЕННО — по правилу `dp-002` механизм становится блокирующим после обкатки, а обкатки у проб
      на момент закрытия один день.
    # РАЗБОР, как он был записан в плане (перенесён дословно):
    # title: Контур ловит класс «объявлено — не исполняется», а не только поломки
    # type: quality
    # goal: qualification-closeout
    # status: in_progress
    # branch: engops/mutation-probes-2026-08-14
    # evidence: quality/mutation-probes.yaml
    # owner_role: engineer
    # depends_on: []
    # write_scope: [tests/, ai_ops_kit/validation/, .github/]
    # value: high
    # affects: {engineering_quality_security: true, delivery_operations: true}
    # ПОВОД — ЗАМЕР ДНЯ, не мнение: PR #118 прошёл ПЯТЬ кругов свежего ревью, 36 находок, из них 6
    # уровня HIGH, и НИ ОДНУ не поймали 11 обязательных джоб CI (включая coverage, python39-compat,
    # clean-install и четыре группы quality). Три HIGH были ложным green ВНУТРИ механизма, который
    # ложный green и чинит; дважды дыру создавала правка предыдущего круга.
    # ЧТО ИМЕННО НЕ РАБОТАЕТ. Тесты проверяют, что код делает то, что написано, и молчат о том, что
    # проверка ничего не проверяет. Мутация ловит это за минуты: восемь правок дня были «покрыты
    # тестами» и не проверялись ничем — снятие проверки оставляло тесты зелёными.
    # ПРЕДЛОЖЕНИЕ (решать при взятии): (а) мутационная проверка как ТРЕБОВАНИЕ приёмки работы, а не
    # личная привычка исполнителя — снятие каждой новой проверки обязано ронять свой тест, и это
    # называется в отчёте; (б) тесты ШВОВ и ПОРЯДКА для каждого нового механизма (модульный тест
    # остаётся зелёным, если конвейер механизм не звал — так дефект и жил); (в) `field-lessons.yaml`
    # уже содержит правило про мутацию — сделать его исполняемым, а не прозой.
    # СДЕЛАНО 2026-08-14 (первая половина, ветка `engops/mutation-probes-2026-08-14`): правило
    # «мутируй исправление» стало ИСПОЛНЯЕМЫМ. `quality/mutation-probes.yaml` называет охранные
    # проверки механизмов (8 проб), `devtools/mutation_probe.py` копирует дерево, снимает охрану в
    # КОПИИ и требует, чтобы названный тест покраснел; `validate_mutation_probes.py` (75-й
    # валидатор) держит реестр от отставания от кода — образец охраны обязан встречаться ровно
    # один раз. Исходов три: killed / survived (дефект контура) / not_verified (красная база,
    # неоднозначный образец) — неизвестность не выдаётся за успех. Замер на ките: 8 проб, 0
    # выживших. Прогон в CI — тест с маркером slow (~9 с).
    # СДЕЛАНО 2026-08-14 (вторая половина): проба ШВА стала ТРЕБОВАНИЕМ ПРИЁМКИ. У пробы появился
    # `kind` (guard|seam) и `covers` у шовной; валидатор требует хотя бы одну шовную пробу на каждый
    # файл с охранными. Правило нашло разрыв в этой же работе с первого запуска: у `delivery_plan.py`
    # было три охранные пробы и ни одной шовной — при том что именно этот шов и сломался при разносе
    # плана. Добавлены `tests/unit/test_plan_history_seam.py` и проба `plan-seam-next-work-feeds-history`.
    # Замер: 9 проб (7 охранных, 2 шовных), 0 выживших.
    # ОСТАЛОСЬ, и это РЕШЕНИЕ ВЛАДЕЛЬЦА: делать ли пробы блокирующими для чужих правок. Сейчас они
    # блокируют только через свой тест в общем прогоне; отдельного гейта нет намеренно — по правилу
    # `dp-002` механизм становится блокирующим после обкатки, а обкатки у проб пока один день.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: добавлять джобу, которая гоняет то же, что уже гоняется. Класс не в
    # объёме прогонов, а в том, что зелёное не означает проверенного.

  - id: plan-split-active-from-history
    title: >-
      Разнести план на активную работу, находки, решения и историю
    goal: plan-as-control-plane
    status: done
    closed_at: '2026-08-14'
    pr: 120
    result: >-
      ЗАКРЫТО 2026-08-14 (PR #120), и правила исполняются КОДОМ, а не соглашением
      (`delivery_plan.validate` + `validate_history`): открытый PR не сосуществует со статусом `todo`;
      merged PR сам по себе не даёт `done` — нужен названный результат и место перепроверки; закрытая
      работа уезжает в `history/plan-history.yaml` вместе с разбором ДОСЛОВНО, и ссылка из истории
      обязана резолвиться. `depends_on` активных работ резолвится и по истории — иначе разнос
      заблокировал бы весь план. ЗАМЕР: 11 тестов, 10 мутаций — 10 красных. ПРОВЕРЕНО НА СЕБЕ: 21
      закрытая работа из 32 уехала в историю, и активный план стал отвечать на четыре вопроса
      управления вместо чтения разбора оплаченных дефектов. Все три объявленных исхода цели
      `plan-as-control-plane` стоят `true`.
    # РАЗБОР, как он был записан в плане (перенесён дословно):
    # title: Разнести план на активную работу, находки, решения и историю
    # type: quality
    # goal: plan-as-control-plane
    # Первое применение новых правил К СЕБЕ: работа с открытым PR не может стоять `todo`, а
    # `done` она станет не по факту мержа, а по проверенному результату.
    # status: in_progress
    # pr: 120
    # branch: engops/plan-control-plane-2026-08-14
    # owner_role: engineer
    # depends_on: []
    # write_scope: [planning/, findings/, history/, ai_ops_kit/planning/]
    # value: high
    # affects: {planning_execution: true, delivery_operations: true}
    # ПОВОД. `planning/plan.yaml` — одновременно план, бэклог, журнал расследований, changelog и
    # отчёт квалификации. Для археологии это ценно, для управления — нет: чтобы ответить «что идёт
    # сейчас и что заблокировано», приходится читать разбор десятков уже закрытых дефектов.
    # ЧТО ДЕЛАЕМ: активная и ближайшая работа остаётся в плане; расследования уходят в `findings/`,
    # решения и trade-offs — в `decisions/`, доказательства прогонов — в `qualification/`,
    # завершённое — в `history/`. Правила связи: открытый PR не сосуществует со статусом `todo`,
    # merged PR сам по себе не даёт `done` (нужен проверенный результат), каждая работа связана с
    # целью, PR, веткой, evidence и решением владельца, если оно требовалось.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: терять разбор. Комментарии закрытых работ — оплаченное знание; они
    # переезжают, а не удаляются, и ссылка из истории обязана резолвиться (`validate_references`).

