# history/plan-history.yaml — ЗАКРЫТАЯ работа кита.
#
# ПОЧЕМУ ФАЙЛ ПОЯВИЛСЯ (`plan-as-control-plane`, 2026-08-14). `planning/plan.yaml` был одновременно
# планом, бэклогом, журналом расследований, changelog'ом и отчётом квалификации: 21 работа из 32
# была закрыта, и чтобы ответить «что идёт сейчас и что взять следующим», приходилось вычитывать
# разбор давно оплаченных дефектов. Управляющий файл, в котором управление занимает треть, управлять
# перестаёт. Активный план теперь отвечает на четыре вопроса управления, а ОПЛАЧЕННОЕ ЗНАНИЕ никуда
# не выброшено — оно здесь, вместе с разбором, дословно.
#
# ЧТО ПРОВЕРЯЕТ КОД (`delivery_plan.validate_history`): в истории только `done`/`dropped`; работа не
# может быть одновременно здесь и в активном плане; у каждой записи есть `result` — НАЗВАННЫЙ
# результат, а не «PR смержен»; у `done` есть место, где результат перепроверяется (`pr`/`evidence`/
# `finding`). `closed_at` — ИЗМЕРЕННАЯ дата: последний коммит, где id работы упоминался в плане.
#
# `depends_on` активных работ резолвится и по этому файлу: без этого разнос превратил бы каждую
# зависимость от завершённой работы в «неизвестную», то есть заблокировал бы весь план.
