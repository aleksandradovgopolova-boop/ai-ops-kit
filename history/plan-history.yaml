      `.pth`, и ни чистка `PYTHONPATH`, ни `-E`, ни `-I` его не снимают) плюс каталог СИМЛИНКОВ на
      сторонние пакеты (сам site-packages передать нельзя — он вернул бы пояс). Список зависимостей
      ЯВНЫЙ: подкладывать «всё, что найдём» значило бы вернуть тот же ambient от имени проб.
      Три пробы переведены на него. `check-full.sh` берёт `${PYTHON:-python3}`, объявляет ЕГО и им же
      гоняет тесты, а интерпретатор без pytest получает названный отказ (код 2) с командой, что
      делать, — вместо трассировки импорта.
      EDITABLE-УСТАНОВКА НЕ ТРОНУТА: это машина владельца и её настройка (записано в самой работе).
      Чинилась проба, мерившая не своё дерево, а не чужой venv.
      ПРИЁМКА: 5 прежде-красных зелены, +5 новых тестов. ПАРА ИЗМЕРЯЕТСЯ ПРЯМО В ТЕСТЕ, а не только
      пробой: `test_without_isolation_the_same_probe_is_blind` показывает, что БЕЗ изоляции та же
      проба поломку не видит, — то есть зелень первой даёт именно изоляция. Пояса нет не везде (в CI
      его нет), поэтому там тест ЧЕСТНО пропускается с названной причиной, а не притворяется успехом.
      Пять проб (4 guard + 1 seam) прогнаны механизмом — выжило 0.
      ДВА ШВА НАШЁЛ СОБСТВЕННЫЙ ИНСТРУМЕНТ, А НЕ Я. `validate_mutation_probes` потребовал пробу шва
      для `tests/ambient.py` («снятие охраны поймается, а отключённый ВЫЗОВ механизма — нет»). А
      проба «объявить охват одним интерпретатором, гонять другим» ВЫЖИЛА: тест смотрел только на
      текст объявления. Добавлен тест, доказывающий совпадение ФАКТОМ вызова — `$PYTHON` подменяется
      обёрткой, которая записывает каждый свой запуск, и в журнале обязан быть `-m pytest`.
      ПОПУТНО НАЙДЕНО, НЕ ЗАКРЫТО: базовый прогон проб идёт в копии БЕЗ `.git`, и
      `test_standalone_validator_is_green_from_a_copy[validate_release_claims]` там краснеет по
      посторонней причине. Обошлось указанием УЗЛА теста в пробе, но класс тот же и он остался.
      ЗА ПРЕДЕЛАМИ ОБЪЯВЛЕННОГО write_scope (названо, а не сделано молча): `scripts/check-full.sh` —
      сама точка входа живёт там; `quality/` — пробы; `planning/` и `history/` — закрытие работы.

