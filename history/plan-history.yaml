    goal: real-product-qualification
    status: done
    closed_at: '2026-08-17'
    pr: 144
    evidence: tests/unit/test_child_seam.py + tests/unit/test_child_plan_migration.py
    result: >-
      ЗАКРЫТО 2026-08-17 тремя работами одного дня (PR #140, #144) — и причина у всех трёх дефектов
      оказалась ОДНА: переезд кода дал новые пути, а источник и фильтры остались на старых.
      F-032 — половина первая: три шага доставки читали шаблон из managed-слоя ДОЧКИ, а шаги доставки
      идут ДО замены managed, то есть читалась предыдущая версия; точка входа отставала ровно на
      релиз, и в дочке лежали обе. Источник теперь один и назван — `installer/_delivery_source`.
      Половина вторая — разбор аргументов: обёртка подставляет каталог сразу ПОСЛЕ интента (иначе
      argparse не берёт хвост после флагов), а разбор искал его только в хвосте. Правил стало три, и
      ПОРЯДОК их — часть правки: замер до неё — `./ai-ops specify docs --feature wi-collide` создавал
      каркас в `docs/features/…` и возвращал 0.
      F-033 — `validate_acceptance_result` (механизм против ложного green) в дочке не исполнялся
      НИКОГДА: имя не внесли в белый список поставки. Теперь это сторожит проверка «что поставка
      ЗОВЁТ, то обязана и СОДЕРЖАТЬ», читающая установленную копию. Ею же найдено, что в дочку
      целиком уезжал `ai_ops_kit/devtools/`: поставка 470 -> 462 файла, 3.5257 -> 3.4515 МБ.
      F-030 — обновление делало план дочки невалидным (правило «закрытая работа живёт в history»
      пришло к дочкам без миграции). Замер на ИИ-Среде 17.08.2026: `./ai-ops next` ОТКАЗЫВАЛСЯ
      отвечать и печатал 32 ошибки. Закрыто миграцией `3.36-to-3.37-plan-history` по решению
      владельца — перенос с пометкой «результат не записан», без выдумывания результатов; проверено
      на настоящем плане ИИ-Среды (32 работы перенесены, в активном плане осталось 62).
      ПРОБА ШВА ЕСТЬ И МЕРИТ УСТАНОВЛЕННУЮ КОПИЮ: кит ставится в ПУСТУЮ дочку, зовётся настоящая
      обёртка `./ai-ops` подпроцессом; состояние «дочка установлена предыдущим релизом»
      воспроизводится копией кита с помеченным шаблоном и версией на патч ниже. Все три требования
      плана закрыты: команда с флагом исполнима, сверка приёмки запускается, план переживает
      обновление.
      ЦЕНА, КОТОРУЮ СТОИТ ЗАПОМНИТЬ: проба шва была принята с ТРЕТЬЕГО раза. Первая версия зелёная
      на двух мутациях из трёх; вторая краснела ВСЕГДА, то есть «убивала» любую мутацию и не
      сторожила ничего. Отсюда правило для следующих работ: замер считается только в двух состояниях
      — зелено без мутации И красно с ней. Выпущено в v3.36.11 «Reaches The Owner».
      ЧЕГО В ЭТОЙ РАБОТЕ НЕТ: обкатки на живых дочках. Обновление ИИ-Среды подготовлено заявкой в её
      репозитории и ждёт вливания владельцем; `field_evidence` релиза честно пуст.

