      discovery-шаблонов свёрнуты в четыре управляющих объекта (Opportunity Brief, Product Decision
      Record, Outcome Contract, Outcome Readout) без новых агентов и документов — решение владельца.
      `validate_product_objects.py` (76-й валидатор) проверяет СУЩЕСТВО, а не наличие разделов:
