  - id: plan-split-active-from-history
    title: >-
      Разнести план на активную работу, находки, решения и историю
    goal: plan-as-control-plane
    status: done
    closed_at: '2026-08-14'
    pr: 120
    result: >-
      ЗАКРЫТО 2026-08-14 (PR #120), и правила исполняются КОДОМ, а не соглашением
      (`delivery_plan.validate` + `validate_history`): открытый PR не сосуществует со статусом `todo`;
      merged PR сам по себе не даёт `done` — нужен названный результат и место перепроверки; закрытая
      работа уезжает в `history/plan-history.yaml` вместе с разбором ДОСЛОВНО, и ссылка из истории
      обязана резолвиться. `depends_on` активных работ резолвится и по истории — иначе разнос
      заблокировал бы весь план. ЗАМЕР: 11 тестов, 10 мутаций — 10 красных. ПРОВЕРЕНО НА СЕБЕ: 21
      закрытая работа из 32 уехала в историю, и активный план стал отвечать на четыре вопроса
      управления вместо чтения разбора оплаченных дефектов. Все три объявленных исхода цели
      `plan-as-control-plane` стоят `true`.
    # РАЗБОР, как он был записан в плане (перенесён дословно):
    # title: Разнести план на активную работу, находки, решения и историю
    # type: quality
    # goal: plan-as-control-plane
    # Первое применение новых правил К СЕБЕ: работа с открытым PR не может стоять `todo`, а
    # `done` она станет не по факту мержа, а по проверенному результату.
    # status: in_progress
    # pr: 120
    # branch: engops/plan-control-plane-2026-08-14
    # owner_role: engineer
    # depends_on: []
    # write_scope: [planning/, findings/, history/, ai_ops_kit/planning/]
    # value: high
    # affects: {planning_execution: true, delivery_operations: true}
    # ПОВОД. `planning/plan.yaml` — одновременно план, бэклог, журнал расследований, changelog и
    # отчёт квалификации. Для археологии это ценно, для управления — нет: чтобы ответить «что идёт
    # сейчас и что заблокировано», приходится читать разбор десятков уже закрытых дефектов.
    # ЧТО ДЕЛАЕМ: активная и ближайшая работа остаётся в плане; расследования уходят в `findings/`,
    # решения и trade-offs — в `decisions/`, доказательства прогонов — в `qualification/`,
    # завершённое — в `history/`. Правила связи: открытый PR не сосуществует со статусом `todo`,
    # merged PR сам по себе не даёт `done` (нужен проверенный результат), каждая работа связана с
    # целью, PR, веткой, evidence и решением владельца, если оно требовалось.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: терять разбор. Комментарии закрытых работ — оплаченное знание; они
    # переезжают, а не удаляются, и ссылка из истории обязана резолвиться (`validate_references`).

