      умолчание о заранее объявленном guardrail ловится (`cross_check`). ОСТАТОК ВЫНЕСЕН, А НЕ
      ПОТЕРЯН: провести ОДНУ настоящую функцию через все четыре объекта и только потом решать, делать
      ли их обязательными в workflow PRODUCT — это `cockpit-vertical-slice`, и при закрытии этой
      работы 18.08.2026 она получила зависимость от неё, чтобы остаток был связан механизмом, а не
      памятью. Исходы цели `product-decision-loop` остаются `false` ОСОЗНАННО: механизм есть, обкатки
      на живой функции нет — объявлять цель достигнутой по наличию валидатора значило бы ровно тот
