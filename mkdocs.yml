# MkDocs configuration for AI Ops Kit API documentation (v3.28.0 R18)
# Build: pip install mkdocs mkdocs-material && mkdocs build
# Serve: mkdocs serve
site_name: AI Ops Kit
site_description: AI Product Operating System — API Reference
site_url: https://ai-ops-kit.github.io/
repo_url: https://github.com/aleksandradovgopolova-boop/ai-ops-kit

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

# НАВИГАЦИЯ НАЗЫВАЕТ ТОЛЬКО СУЩЕСТВУЮЩЕЕ (19.08.2026). Прежде здесь стояли шесть страниц, которых
# нет ни одной: api/orchestrator, api/execution-pipeline, api/preflight, api/tool-loop,
# api/usage-ledger, api/benchmarks. Сборка документации не запускалась нигде, поэтому обещание
# шести разделов держалось ровно до первой попытки собрать. Заглушки на их месте были бы хуже:
# страница, которая существует и ничего не говорит, тратит время читателя дважды.
#
# `QUICKSTART.md` — регистр как у файла. На macOS и Windows расхождение не видно, на Linux сборка
# падает: тот же класс, что «у меня работает».
nav:
  - Home: index.md
  - Quickstart: QUICKSTART.md
  - Architecture:
    - Overview: architecture/overview.md
    - Execution Engine: architecture/execution-engine.md
    - Quality Gates: architecture/quality-gates.md
    - Registry: architecture/registry.md
  - API Reference:
    - Contracts:
      - TypedDict Contracts: api/contracts.md
      - Invariants: api/invariants.md
    - Operations:
      - Kit Observability: api/kit-observability.md
  - Guides:
    - Installation: guides/installation.md
    - Child Repository: guides/child-repo.md
    - CI Configuration: guides/ci.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true
