# Ратчет доли ПОВЕДЕНЧЕСКИХ тестов против СТРУКТУРНЫХ (issue #439).
#
# ЗАЧЕМ. Перекос «тест читает свои файлы вместо того, чтобы исполнять поведение» рос молча: числа
# не было. Структурный тест (открыл yaml/md/py по пути, утвердил на его форме) не ловит ни одной
# регрессии продукта. Теперь доля поведенческих зафиксирована ратчетом вниз — как потолки размера
# функций (packages/func-size-baseline.yaml): она не может незаметно упасть.
#
# Измеряется: validate_test_taxonomy.py (AST каждого tests/**/test_*.py; поведенческий =
# импортирует продуктовый код кита И зовёт импортированный символ; структурный = всё остальное).
# Эвристика и её честные границы — в докстринге валидатора.
#
# РАТЧЕТ ходит ТОЛЬКО ВНИЗ по структурности: доля поведенческих не может упасть ниже записанной.
# Сравнение точное, целыми (перекрёстное умножение): current_beh * base_total >= base_beh * current_total.
# Файлы добавлять можно; уронить долю поведенческих — нельзя. Осознанное снижение baseline
# записывается в ленту `raises` ниже с обоснованием (по образцу func-size-baseline.yaml).
#
# ЗАМЕР ЧЕСТНЫЙ, НЕ ЗАВЫШЕН. Доля поведенческих здесь ВЫШЕ грубой оценки issue («~195 из ~391
# структурных»): точный критерий «импортирует И зовёт» относит к поведенческим и тесты валидаторов,
# которые читают реестр репозитория И вызывают валидатор над ним — issue сам велит считать такой
# тест поведенческим («читает файлы И зовёт продуктовый код = behavioral»). Смещение классификатора —
# в сторону СТРУКТУРНОГО: тест, лишь проверяющий `callable(x)` без вызова, считается структурным.
schema_version: 1
kind: test-taxonomy-ratchet

