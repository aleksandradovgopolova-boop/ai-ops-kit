# Ратчет максимального размера функции в ai_ops_kit/.
#
# K6-глубина (Волна 5): god-функции реально расщепляются на фазы, а не только замораживаются.
# Ратчет ходит ТОЛЬКО ВНИЗ: разбиение god-функций снижает потолок,
# новая god-функция сверх потолка — красный сигнал.
#
# Измеряется: validate_func_size.py (AST-обход, end_lineno - lineno + 1).
#
# 2026-09-02 (func-size-ratchet-wider): ратчет расширен с одного каталога engine/ на пять
# каталогов, где живут крупнейшие функции пакета. Раньше потолок стерёг только engine/, а
# god-функции ВНЕ engine/ (cli/main, planning/validate, providers/run_workflow,
# validation/run_scenarios) росли свободно — ратчет давал ложное чувство защиты. Теперь у
# каждого каталога свой потолок, замороженный на ТЕКУЩЕМ максимуме: это не заставляет
# рефакторить существующий код прямо сейчас, а останавливает НОВЫЙ рост везде.
# Каждый scope сверяется точно (max == потолок): превышение краснеет как новая god-функция,
# снижение — как «опусти потолок» (ратчет ходит только вниз).
schema_version: 2
kind: func-size-ratchet

# По одному потолку на каталог. Потолок = текущий измеренный максимум каталога.
scopes:
  # engine/ — исторический scope ратчета (K6-глубина расщепляла именно его).
  # История опускания потолка 1285 -> 399 -> 184 (срезы run()/run_pipeline; run_pipeline
  # расщеплён на фазовые помощники _pipeline_*) — в git-логе этого файла.
  - path: ai_ops_kit/engine/
    max_function_lines: 184
    max_function: _evaluate_security
    max_function_file: pipeline_readiness.py
    max_function_lineno: 71

  # cli/ — точка входа CLI. main() аккумулировала разбор аргументов и диспетч; разбор и путь
  # run --execute/do вынесены в _build_cli_arg_parser/_main_run_execute (ратчет опущен 348 -> 154).
  # #587: разбор позиционных вынесен из main в _parse_task_and_root -> худшая функция теперь
  # _main_run_execute (150); ратчет опущен 154 -> 150.
  # refactor(cli): слой реализации команд вынесен в ai_ops_cli_commands.py; _main_run_execute (150,
  # без изменений тела) переехал туда и остаётся максимумом каталога cli/ — потолок тот же, обновлён
  # лишь указатель файла/строки.
  - path: ai_ops_kit/cli/
    max_function_lines: 150
    max_function: _main_run_execute
    max_function_file: ai_ops_cli_commands.py
    max_function_lineno: 476

  # planning/ — контур Planning & Execution.
  # Опущено 157 -> 138 (2026-09-14): проверку milestone вынесли из `validate` в помощники
  # `_milestone_errors`/`_goal_errors`, `validate` ужалась до 137 строк, и новым максимумом стала
  # `next_work.compute` (138). Ратчет ходит только вниз.
  - path: ai_ops_kit/planning/
    max_function_lines: 138
    max_function: compute
    max_function_file: next_work.py
    max_function_lineno: 306

  # providers/ — адаптеры исполнителей и оркестрация workflow.
  - path: ai_ops_kit/providers/
    max_function_lines: 169
    max_function: run_workflow
    max_function_file: orchestrator.py
    max_function_lineno: 149

  # validation/ — валидаторы (сценарии квалификации — крупнейшая функция каталога).
  - path: ai_ops_kit/validation/
    max_function_lines: 207
    max_function: run_scenarios
    max_function_file: validate_product_qualification.py
    max_function_lineno: 63
  # #1119: intelligence/ оставался вне ратчета — и там выросла САМАЯ ДЛИННАЯ функция репозитория
  # (build_graph, 275 строк: больше любого другого потолка, включая installer 264). Для модулей
  # сторож уже есть — `module-size` поймал knowledge_graph.py на 708 строках и заставил разрезать
  # его по смыслу; для функций этого каталога сторожа не было, и каждая работа по графу истории
  # удлиняла build_graph на десяток строк, не встречая сопротивления.
  # Потолок = ТЕКУЩИЙ максимум, а не идеальное число: цель записи — остановить рост немедленно, а
  # не заставить рефакторить в чужом PR. Разрез build_graph по источникам — отдельной работой,
  # после которой потолок опускается (ратчет ходит только вниз).
  # 2026-09-23 (#1127): 275 -> 137. `build_graph` разрезана на четыре прохода по источникам
  # (план, паспорта функций, обучение, вердикты ревью); фасад собирает их и остался на 40 строк.
  # Граф на реальных данных (кит, ии-среда) после разреза совпал с прежним ПОБАЙТНО — поведение не
  # менялось. Ратчет пошёл вниз, как и обещано записью #1119: теперь максимум каталога — `trace`.
  - path: ai_ops_kit/intelligence/
    max_function_lines: 137
    max_function: trace
    max_function_file: knowledge_graph_query.py
    max_function_lineno: 111

  # #1119, ВТОРОЙ ШАГ: остальные каталоги пакета. Сторож охвата (tests/unit/test_validate_func_size)
  # показал, что вне ратчета росла не только `intelligence/`: ещё в семи каталогах жили функции
  # крупнее самого низкого объявленного потолка. Список каталогов пополнялся РУКАМИ и отставал от
  # кода — поэтому теперь покрыт ВЕСЬ пакет, а не «дома известных god-функций». Потолки = текущие
  # максимумы: цель — остановить рост, а не заставить рефакторить в чужом PR.
  - path: ai_ops_kit/checks/
    max_function_lines: 163
    max_function: validate_dir_full
    max_function_file: feature_blueprint.py
    max_function_lineno: 64
  - path: ai_ops_kit/context/
    max_function_lines: 167
    max_function: build_context
    max_function_file: context_engine.py
    max_function_lineno: 166
  - path: ai_ops_kit/delivery/
    max_function_lines: 85
    max_function: record_delivery_for_pr
    max_function_file: record_delivery.py
    max_function_lineno: 65
  - path: ai_ops_kit/devtools/
    max_function_lines: 193
    max_function: _cases
    max_function_file: bench_lite.py
    max_function_lineno: 230
  - path: ai_ops_kit/engops/
    max_function_lines: 104
    max_function: parse_session_metadata
    max_function_file: session_telemetry_provider.py
    max_function_lineno: 165
  - path: ai_ops_kit/gates/
    max_function_lines: 171
    max_function: collect
    max_function_file: evidence_collector.py
    max_function_lineno: 55
  - path: ai_ops_kit/governance/
    max_function_lines: 52
    max_function: adjust_priority
    max_function_file: override_learning.py
    max_function_lineno: 50
  - path: ai_ops_kit/integrations/
    max_function_lines: 36
    max_function: _rest_get
    max_function_file: github.py
    max_function_lineno: 174
  - path: ai_ops_kit/kernel/
    max_function_lines: 4
    max_function: deliver
    max_function_file: ports.py
    max_function_lineno: 234
  - path: ai_ops_kit/lifecycle/
    max_function_lines: 139
    max_function: register
    max_function_file: active_work.py
    max_function_lineno: 333
  - path: ai_ops_kit/security/
    max_function_lines: 79
    max_function: run_pack
    max_function_file: security_pack.py
    max_function_lineno: 179
  - path: ai_ops_kit/shared/
    max_function_lines: 177
    max_function: route
    max_function_file: ai_route.py
    max_function_lineno: 44
  - path: ai_ops_kit/ui/
    max_function_lines: 163
    max_function: from_next_work
    max_function_file: presenter_work.py
    max_function_lineno: 17

  # F-06 внешнего аудита: installer/ — крупнейший файл репозитория, первое, что запускает пользователь,
  # оставался вне func-size. Потолок = текущий максимум (cmd_doctor 264); расщепление — отдельной работой.
  - path: installer/
    max_function_lines: 264
    max_function: cmd_doctor
    max_function_file: ai_ops.py
    max_function_lineno: 3030
