schema_version: 1
kind: ai-ops-package
name: ai-ops-quality
description: >
  Quality gates, исполнение и блокировка гейтов, structured reviewer-result, детект стека и
  stack-aware сбор evidence, чек-листы ревью/дизайна/инженерии. Зависит от core.
depends_on: [ai-ops-core]
includes:
  - quality/**
  - ai_ops_kit/gates/gate_executor.py
  - ai_ops_kit/shared/project_detector.py
  - ai_ops_kit/gates/evidence_collector.py
  - rules/quality/**
  - rules/design/**
  - rules/engineering/**
  # Карта `constitution_id -> правило`: чек-листы `rules/design/**` цитируют ID, а раскрывается он
  # по этому реестру. Принадлежит тому же пакету, что и цитирующие чек-листы, чтобы карта ехала
  # ровно туда, где ID вообще может быть процитирован (а не в дочку без дизайн-гейтов).
  - standards/uiux/rules.yaml
