# layering.yaml — направления зависимостей между пакетами ai_ops_kit/* (v3.32.0)
#
# Переезд в пакеты (3.31.0) дал модулям осмысленные имена, но НЕ дал границам силы: `gates` мог
# импортировать `engops`, `context` — `delivery`, и никто бы не заметил. Здесь объявлено, кто от
# кого вправе зависеть; validate_layering.py считает реальный граф импортов и сверяет.
#
# ПОЧЕМУ РАТЧЕТ, А НЕ СТРОГИЙ DAG. Замер: 12 взаимных зависимостей и 210 циклов длиннее
# двух. Строгое правило покраснело бы на всём сразу — и его бы выключили, как выключают проверку,
# которая ничего не даёт починить. Поэтому нарушения заморожены поимённо в known_violations:
# новые запрещены, список вправе только СОКРАЩАТЬСЯ. Исчезнувшее нарушение обязано быть удалено
# отсюда — иначе список превратится в кладбище и перестанет что-либо значить.
schema_version: 1
kind: package-layering

# Слои снизу вверх. Пакет вправе зависеть от СВОЕГО слоя и от любого НИЖЕ; вверх — нельзя.
# Основание — не вкус, а замер входящих степеней: shared имеет 11 входящих и ноль исходящих,
# cli/devtools — ноль входящих.
layers:
  - name: foundation
    purpose: "общий фундамент: пути, контракты, детект стека, генераторы. Не зависит ни от кого."
    packages: [shared]

  - name: primitives
    purpose: >
      самостоятельные предметные области: сканы и политика безопасности, UI-evidence. Сегодня
      каждая зависит ТОЛЬКО от foundation — это замеренный факт, а не пожелание, поэтому слой
      объявлен отдельно: попытка втянуть сюда гейты или исполнение будет поймана.
    packages: [security, ui]

  - name: capabilities
    purpose: >
      ядро движка: контекст, провайдеры, состояние работы, гейты, исполнение, доставка,
      инженерная операционная модель, планирование (v3.35: `planning` — модель контуров, delivery
      plan, next work; читает `lifecycle`/`shared`, и его не импортирует никто из ядра — точка
      входа одна, CLI). Внутри слоя связи допустимы — это одно кольцо, а не
      лестница; разбор взаимных зависимостей идёт отдельными срезами (см. baseline).
    packages: [context, providers, lifecycle, gates, engine, delivery, engops, planning]

  - name: intelligence
    purpose: >
      продуктовая аналитика: здоровье продукта, эффект, триггеры эволюции. Кольцо Intelligence из
      AGENTS.md — зависит от Kernel и ЧИТАЕТ его события, но Kernel от него НЕ зависит. Слой выше
      ядра именно поэтому: зависимость вверх запрещена, значит инвариант проверяется, а не
      декларируется. Отключение этого слоя целиком не должно мешать доставке.
    packages: [intelligence]

  - name: entrypoints
    purpose: >
      точки входа: CLI, инструменты разработки кита, валидаторы инвариантов. Способ вызова —
      запуск процессом (CI, `ai-ops doctor`, pytest), а не импорт. `cli` и `devtools` не
      импортирует действительно НИКТО; `validation` импортируют шесть пакетов ядра, и это
      перечислено в known_violations поимённо, а не спрятано понижением слоя.
    packages: [cli, devtools, validation]

# Правила поверх слоёв — то, что слоями не выражается.
rules:
  # devtools не едет в child (installer.DEV_ONLY_TOOLS). Импорт из продуктового пакета означал бы,
  # что пользователь получил модуль, ссылающийся на отсутствующий файл.
  - id: no-product-depends-on-devtools
    forbid: {to: devtools}
    reason: "devtools исключён из поставки; зависимость от него ломает child-репозиторий"

  # foundation обязан оставаться листом: он импортируется отовсюду, любая его зависимость
  # мгновенно становится циклом через весь граф.
  - id: foundation-is-a-leaf
    forbid: {from: shared}
    reason: "shared импортируют все; его собственная зависимость замыкает граф"

# Замороженные нарушения. Каждая строка — «есть сегодня, чинить отдельно».
# Формат: <пакет> -> <пакет>: причина существования. Реестр вправе только СОКРАЩАТЬСЯ:
# исчезнувшее нарушение обязано быть удалено отсюда, это проверяется.
#
# v3.34: пять строк появились не потому, что связи появились, — они были всегда. Пока
# `validation` не был пакетом, у этих рёбер не было имени, и граф их не видел. Перенос в
# `ai_ops_kit/validation/` сделал их СЧИТАЕМЫМИ, и первое, что они сделали, — покраснели.
# Движок зовёт валидатор не как процесс, а как библиотеку: check(data), profile(), validate_dir(),
# check_feature(), render(). Развязка — перевод этих вызовов на подпроцесс с машиночитаемым
# выводом, то есть шесть контрактов, включая пишущий файлы render(). Это отдельный срез, и
# записать его отдельным честнее, чем сделать вид, что перенос каталога его выполнил.
known_violations:
  - "engine -> validation: pipeline_evidence/pipeline_helpers зовут check()/render() валидаторов артефактов"
  - "lifecycle -> validation: run_report зовёт validate_dir()/check_feature() по фиче"
  - "providers -> validation: orchestrator проверяет результат ревьюера через check()"
  - "security -> validation: security_enforcement зовёт check() политики памяти"
  - "intelligence -> validation: evolution_triggers зовёт profile()/check_registry()"

# Цифры замера — ПОТОЛОК, а не заметка на память: с v3.34 их читает ratchet_errors в
# validate_layering.py. Ратчет ходит только ВНИЗ: превышение краснеет, снижение обязано быть
# записано сюда. Обновлять осознанно, как и прочие DERIVED-числа.
baseline:
  measured_at: "3.34.0"
  mutual_pairs: 12         # context<->engine, delivery<->engine, engine<->engops, engine<->gates,
                           # engine<->providers, engops<->gates, engops<->providers,
                           # gates<->lifecycle, gates<->providers,
                           # engine<->validation, security<->validation (v3.34, см. ниже),
                           # engine<->lifecycle (v3.34: workitem зовёт ai_route, переехавший в engine)
  cycles_longer_than_two: 210
  internal_imports_by_flat_name: 262   # переход на пакетные имена — отдельный срез
  note: >
    Десять из двенадцати взаимных пар лежат ВНУТРИ слоя capabilities и текущими правилами не
    запрещены — это осознанная граница первого шага. Оставшиеся две (engine<->validation,
    security<->validation) пересекают слои и потому перечислены в known_violations поимённо:
    разрешено только то, что названо. Разбор циклов внутри ядра идёт отдельными срезами.
  raised_in_3_34: >
    Потолок ПОДНЯТ в том же срезе, где введён: 9 -> 12 пар, 31 -> 210 циклов. Связей в коде при
    этом не прибавилось ни одной. Пока `validation` не был пакетом, шесть пакетов ядра импортировали
    валидаторы по плоскому имени, а валидаторы — модули движка; для графа этих рёбер не
    существовало, потому что не существовало вершины. Перенос дал вершину, и невидимое стало
    считаемым. Число выросло в шесть раз не от ухудшения кода, а от того, что раньше мерили
    вслепую — тот же класс, что и «119 циклов», только там врала методика, а здесь врал охват.
    Развязка перечислена поимённо в known_violations и стоит отдельным срезом.
    Двенадцатая пара (engine<->lifecycle) — единственная НАСТОЯЩАЯ новая связь среза, и она
    честная: `ai_route` лежал среди валидаторов, хотя движком маршрутизации был всегда; после
    переезда в `engine` зависимость `workitem -> ai_route` наконец видна как есть, а не спрятана
    в каталоге, который графу не принадлежал.
  cycles_correction: >
    ЧИСЛО ИСПРАВЛЕНО в 3.34 с 119 на 31, и граф при этом не менялся. 119 считало РОТАЦИИ: обход
    стартовал в каждой вершине и находил один и тот же цикл столько раз, сколько в нём вершин —
    11 троек, 14 четвёрок и 6 пятёрок дали 33+56+30. Различных элементарных циклов 31; проверено,
    что обе методики дают свои числа на неизменном графе 3.31.1, 3.32.0 и текущем. Потолком может
    быть только величина, не зависящая от способа обхода, иначе следующий замер посчитает иначе и
    получит другой ответ на том же коде. Историю (CHANGELOG 3.32.0) не переписываем: там записано,
    что было измерено тогда.
  what_is_enforced_today: >
    Не всё. Запрещено и проверяется: security/ui тянут что-либо выше foundation; shared тянет
    что-либо вообще; любой пакет тянет cli/devtools; продуктовый код тянет devtools (он не едет
    в child). НЕ запрещено: взаимные связи внутри capabilities. Это пол, а не лестница — но пол,
    которого не было.

# v3.33.2: инвариант трёх колец СТАЛ проверяемым. Прежде `lifecycle` держал и ядро
# (lifecycle_store, workitem, run_report), и аналитику (product_health, effect_metrics,
# evolution_triggers) — «Kernel не зависит от Intelligence» было невыразимо в терминах пакетов и
# честно значилось непроверяемым. Аналитика вынесена в пакет `intelligence` слоем ВЫШЕ ядра;
# зависимость вверх запрещена, поэтому утверждение теперь проверяет validate_layering.
# Перенос оказался безопасным по замеру: эти три модуля не импортировал НИКТО, а сами они тянули
# только shared — то есть кольцо де-факто уже соблюдалось, не хватало границы, чтобы это увидеть.
verified_invariants:
  - id: kernel-does-not-depend-on-intelligence
    how: "слой intelligence выше capabilities; зависимость вверх запрещена (validate_layering)"

unverifiable_today: []
