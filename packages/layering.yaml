# layering.yaml — направления зависимостей между пакетами ai_ops_kit/* (v3.32.0)
#
# Переезд в пакеты (3.31.0) дал модулям осмысленные имена, но НЕ дал границам силы: `gates` мог
# импортировать `engops`, `context` — `delivery`, и никто бы не заметил. Здесь объявлено, кто от
# кого вправе зависеть; validate_layering.py считает реальный граф импортов и сверяет.
#
# ПОЧЕМУ РАТЧЕТ, А НЕ СТРОГИЙ DAG. Замер: 12 взаимных зависимостей и 210 циклов длиннее
# двух. Строгое правило покраснело бы на всём сразу — и его бы выключили, как выключают проверку,
# которая ничего не даёт починить. Поэтому нарушения заморожены поимённо в known_violations:
# новые запрещены, список вправе только СОКРАЩАТЬСЯ. Исчезнувшее нарушение обязано быть удалено
# отсюда — иначе список превратится в кладбище и перестанет что-либо значить.
schema_version: 1
kind: package-layering

# Слои снизу вверх. Пакет вправе зависеть от СВОЕГО слоя и от любого НИЖЕ; вверх — нельзя.
# Основание — не вкус, а замер входящих степеней: shared имеет 11 входящих и ноль исходящих,
# cli/devtools — ноль входящих.
layers:
  - name: foundation
    purpose: >
      общий фундамент: пути, контракты, детект стека, генераторы, порты ядра.
      Не зависит ни от кого. `kernel` (v3.38, trustworthy-core K0): Protocol'ы и TypedDict
      контракты ядра — шов между ядром и реализациями. Зависит только от `shared`.
    packages: [shared, kernel]

  - name: primitives
    purpose: >
      самостоятельные предметные области: сканы и политика безопасности, UI-evidence. Сегодня
      каждая зависит ТОЛЬКО от foundation — это замеренный факт, а не пожелание, поэтому слой
      объявлен отдельно: попытка втянуть сюда гейты или исполнение будет поймана.
      `integrations` (чтение GitHub как operational source of truth) здесь по той же причине:
      зависит только от `shared`, а его потребитель — `planning` (слой выше) — тянет его вниз.
      `checks` (v3.38, ленты №4-№5): проверяющая логика валидаторов, вынесенная вниз, чтобы рантайм
      звал её ВНИЗ, а не тянул `validation` (entrypoints) вверх. Часть функций чистые (check(data)),
      часть — read-only чтение каталога артефакта (validate_dir/check_feature/check_registry).
      Зависит только от stdlib и pyyaml, НЕ импортирует ничего из ai_ops_kit выше foundation.
    packages: [security, ui, integrations, governance, checks]

  - name: capabilities
    purpose: >
      ядро движка: контекст, провайдеры, состояние работы, гейты, исполнение, доставка,
      инженерная операционная модель, планирование (v3.35: `planning` — модель контуров, delivery
      plan, next work; читает `lifecycle`/`shared`, и его не импортирует никто из ядра — точка
      входа одна, CLI). Внутри слоя связи допустимы — это одно кольцо, а не
      лестница; разбор взаимных зависимостей идёт отдельными срезами (см. baseline).
    packages: [context, providers, lifecycle, gates, engine, delivery, engops, planning]

  - name: intelligence
    purpose: >
      продуктовая аналитика: здоровье продукта, эффект, триггеры эволюции. Кольцо Intelligence из
      AGENTS.md — зависит от Kernel и ЧИТАЕТ его события, но Kernel от него НЕ зависит. Слой выше
      ядра именно поэтому: зависимость вверх запрещена, значит инвариант проверяется, а не
      декларируется. Отключение этого слоя целиком не должно мешать доставке.
    packages: [intelligence]

  - name: entrypoints
    purpose: >
      точки входа: CLI, инструменты разработки кита, валидаторы инвариантов. Способ вызова —
      запуск процессом (CI, `ai-ops doctor`, pytest), а не импорт. `cli` не импортирует НИКТО;
      `validation` с v3.38 (ленты №4-№5) не импортирует как библиотеку вверх НИ ОДИН пакет ядра —
      вся проверяющая логика, которую звал рантайм, вынесена вниз в `checks`; единственный, кто
      зависит от `validation`, — `devtools` (тот же слой entrypoints, это разрешено).
    packages: [cli, devtools, validation]

# ─── Концептуальные слои (РОЛЬ), ортогонально dependency-слоям выше (#638) ──────────────────────
# Пять слоёв ВЫШЕ — по направлению ЗАВИСИМОСТЕЙ (кто кого вправе импортировать). Эти четыре — по
# РОЛИ пакета в продукте: чтобы 19 пакетов читались как доменная модель, а не как история
# разработки, и чтобы не утонуть в собственных абстракциях. Ортогональны: dependency-слой пакета
# НЕ равен его роль-слою (напр. `gates` — capabilities по зависимостям, POLICY по роли; `providers`
# — capabilities по зависимостям, ADAPTERS по роли). Документарно, БЕЗ переезда файлов — именуются в
# ARCHITECTURE.md. Ратчет `validate_layering.conceptual_layer_errors`: каждый top-level пакет
# отнесён РОВНО к одному роль-слою; новый пакет обязан быть классифицирован, а не проскользнуть.
conceptual_layers:
  - name: DOMAIN
    role: >
      продуктовые сущности и доменные контракты: Work / Run / Outcome / Decision, порты ядра и
      общий фундамент, на который опирается всё остальное.
    packages: [kernel, lifecycle, shared]
  - name: APPLICATION
    role: >
      как ведётся работа: сборка контекста, планирование, исполнение, доставка, инженерная
      экономика, обучение из исходов (Workflow / Planning / Execution / Learning).
    packages: [context, engine, planning, delivery, engops, intelligence]
  - name: POLICY
    role: >
      что разрешено и что проверяется: quality gates, governance, безопасность, проверяющая логика
      и валидаторы инвариантов (Governance / Security / Quality / Autonomy).
    packages: [gates, governance, security, checks, validation]
  - name: ADAPTERS
    role: >
      мосты к внешним поверхностям: CLI, чтение форджа, маршрутизация к модельным рантаймам
      (Claude / Codex / Qwen), рендер человеку, dev-инструменты и CI-харнессы.
    packages: [cli, integrations, providers, ui, devtools]

# ─── Потолок на ЧИСЛО top-level пакетов (ратчет, #638) ──────────────────────────────────────────
# Структура обязана отражать доменную модель, а не историю разработки. Прежде `AGENTS.md` прямо
# разрешал «новый модуль — в свой пакет», и ограничение было только по слоям, не по числу: пакеты
# плодились бы молча. Теперь число top-level пакетов в `ai_ops_kit/` — ПОТОЛОК. Новая capability
# живёт в СУЩЕСТВУЮЩЕМ домене; рост числа требует архитектурного решения (запись сюда + ADR/DP), а
# не привычки. Ратчет ходит вниз: слили/удалили пакет — опустить `count`. Считает
# `validate_layering.package_ceiling_errors`.
package_ceiling:
  count: 19
  measured_at: "2026-09-08"
  reason: >
    19 top-level пакетов (#638): checks, cli, context, delivery, devtools, engine, engops, gates,
    governance, integrations, intelligence, kernel, lifecycle, planning, providers, security,
    shared, ui, validation. Рост числа требует архитектурного решения; снижение — опустить count.

# Правила поверх слоёв — то, что слоями не выражается.
rules:
  # devtools не едет в child (installer.DEV_ONLY_TOOLS). Импорт из продуктового пакета означал бы,
  # что пользователь получил модуль, ссылающийся на отсутствующий файл.
  - id: no-product-depends-on-devtools
    forbid: {to: devtools}
    reason: "devtools исключён из поставки; зависимость от него ломает child-репозиторий"

  # foundation обязан оставаться листом: он импортируется отовсюду, любая его зависимость
  # мгновенно становится циклом через весь граф.
  - id: foundation-is-a-leaf
    forbid: {from: shared}
    reason: "shared импортируют все; его собственная зависимость замыкает граф"

  # Ядро не импортирует спутники. Три кольца (AGENTS.md): Kernel — {shared, kernel, engine,
  # gates, lifecycle, delivery, governance}; Intelligence читает Kernel, но Kernel от него
  # НЕ зависит. planning и engops — спутники внутри capabilities, слоями не запрещены (они в
  # том же слое), поэтому правило поверх слоёв. intelligence запрещена слоями (выше), но
  # перечислена здесь для полноты картины.
  - id: kernel-boundary
    kernel_members: [shared, kernel, engine, gates, lifecycle, delivery, governance]
    forbidden_imports: [planning, intelligence, engops]
    reason: "ядро не импортирует спутники: planning, intelligence, engops — надстроя над ядром"

# Замороженные нарушения. Каждая строка — «есть сегодня, чинить отдельно».
# Формат: <пакет> -> <пакет>: причина существования. Реестр вправе только СОКРАЩАТЬСЯ:
# исчезнувшее нарушение обязано быть удалено отсюда, это проверяется.
#
# v3.34: пять строк появились не потому, что связи появились, — они были всегда. Пока
# `validation` не был пакетом, у этих рёбер не было имени, и граф их не видел. Перенос в
# `ai_ops_kit/validation/` сделал их СЧИТАЕМЫМИ, и первое, что они сделали, — покраснели.
# Рантайм звал валидатор не как процесс, а как библиотеку: check(data), profile(), validate_dir(),
# check_feature(), render(). ИСХОД (v3.38, ленты №4-№5): развязка сделана НЕ подпроцессом, а
# переносом самой логики ВНИЗ в пакет `checks` (primitives) — рантайм зовёт её в свой слой. Все пять
# рёбер сняты, включая разрез пишущего render() на чистый render_content() + запись в вызывателе.
# Список ниже пуст: он сокращался фактом каждой развязки, а не решением.
# ПУСТО с v3.38 (лента №5 завершена). Все пять восходящих рёбер `рантайм -> validation` сняты одним
# способом: чистую/read-only проверяющую логику вынесли ВНИЗ в пакет `checks` (слой primitives), и
# рантайм зовёт её в СВОЙ слой, не тянет `validation` (entrypoints) вверх. Хронология развязки:
#   №4: security -> validation      (memory_governance.check)            7->6 пар, 52->28 циклов
#   №5: engine -> validation        (reviewer/requirements/plan/         6->5 пар, 28->17 циклов
#       providers -> validation      acceptance/spec + разрез render)
#   №5: lifecycle -> validation     (feature_blueprint/cross_artifacts)  17->11 циклов
#   №5: intelligence -> validation  (quality_attributes/architecture_    без изменения чисел —
#                                    decision/adr_registry)               ребро не было в цикле
# Список ратчета сократился ФАКТОМ развязки, а не решением, и теперь пуст. `validation` (entrypoints)
# больше не импортирует НИ ОДИН пакет ядра как библиотеку вверх; единственный, кто зависит от
# `validation`, — `devtools` (тот же слой entrypoints, это разрешено). Новых нарушений нет.
#
# v3.38 (W3.2): engine -> engops СНЯТО — session recommendation через событие run_completed.
# F-03 (внешний аудит 2026-09-09): вскрыто ОДНО нарушение kernel-boundary, спрятанное от анализатора
# динамическим импортом — gates грузит engops.environment_map через __import__ (deploy_readiness).
# Ребро было всегда, но validate_layering не видел __import__; теперь видит. Заморожено как известное
# нарушение, развязка — отдельной работой; реестр вправе только сокращаться.
# K4 РАЗВЯЗАНА (2026-09-10): environment_map переехал engops -> checks (примитив детекции), ребро
# gates -> engops снято. Нарушений kernel-boundary больше нет.
known_violations: []

# Цифры замера — ПОТОЛОК, а не заметка на память: с v3.34 их читает ratchet_errors в
# validate_layering.py. Ратчет ходит только ВНИЗ: превышение краснеет, снижение обязано быть
# записано сюда. Обновлять осознанно, как и прочие DERIVED-числа.
baseline:
  measured_at: "3.34.0"
  mutual_pairs: 0          # НАСТОЯЩИЙ НОЛЬ (2026-09-10). F-03 (аудит 2026-09-09) вскрыл 5 пар,
                           # спрятанных за __import__ (validate_layering видел только ast.Import/ImportFrom
                           # и печатал 0 с ложной подписью «кольцо стало DAG»). Теперь гейт считает и
                           # динамику — и все ПЯТЬ пар РАЗВЯЗАНЫ ПО-НАСТОЯЩЕМУ: ноль теперь не слепота,
                           # а факт. Кольцо capabilities стало DAG по-честному.
                           #   K1 engine<->gates СНЯТА: CLI-обёртка evidence_collector (строила broker
                           #   через __import__ engine) вынесена в ai_ops_kit/devtools/evidence_collect_cli.py
                           #   — devtools это entrypoints, ему engine импортить можно; библиотечный
                           #   collect() давно принимает broker параметром. Гейт больше не зависит от
                           #   engine ни статически, ни динамически. Это НЕ сокрытие (как прежнее
                           #   «K1 снята» через __import__), а перенос проводки в точку входа. 5 -> 4.
                           # K4 engops<->gates СНЯТА (2026-09-10): environment_map — примитив
                           # детекции окружения — переехал engops -> checks (слой primitives), gates
                           # и engops зовут его ВНИЗ по слоям, ребро gates->engops исчезло. 4 -> 3.
                           # K2 context<->engine СНЯТА (2026-09-10): context_compiler.compile_bundle
                           #   строил RunPlan сам через __import__ engine.run_plan, когда plan не передан.
                           #   Теперь план приходит извне — готовым (plan=) или инъекцией строителя
                           #   (build_plan=run_plan.build_plan); context НЕ упоминает engine ни статически,
                           #   ни динамически. CLI-обёртка, которой нужен построитель, вынесена в
                           #   ai_ops_kit/devtools/context_compile_cli.py (entrypoints). 3 -> 2, и это
                           #   ребро замыкало все длинные циклы -> cycles 5 -> 0.
                           # K3 delivery<->engine СНЯТА (2026-09-10): review_branch (единственный
                           #   держатель всех трёх рёбер delivery->engine: _resolve_base, worktree,
                           #   _run_reviews) ЗАПУСКАЕТ движковые ревью-гейты — это исполнение, не
                           #   доставка. Переехал delivery -> engine (git mv), импорты стали
                           #   внутрипакетными; delivery больше не зависит от engine. CLI-обёртка (с
                           #   print) вынесена в devtools/branch_review_cli.py. Акт доставки (draft PR)
                           #   остался в delivery/pr_open — направление engine->delivery естественно
                           #   и сохранено. 2 -> 1.
                           # K5 engine<->lifecycle СНЯТА (2026-09-10): lifecycle тянул engine ВВЕРХ тремя
                           #   динамическими __import__ — workitem->ai_route.route (маршрутизация),
                           #   active_work->pipeline_git._resolve_base (git-база), active_work->
                           #   work_areas.areas_overlap (зоны). Все три — чистые сущности без зависимостей
                           #   от кита, нужные многим: по правилу foundation они переехали ВНИЗ в shared
                           #   (ai_route -> shared/ai_route + CLI в devtools; _resolve_base -> shared/gitio
                           #   с алиасом в pipeline_git; work_areas -> shared/work_areas). Теперь и
                           #   lifecycle, и engine зовут их ВНИЗ; lifecycle не тянет engine ни одним ребром.
                           #   1 -> 0. Кольцо стало DAG.
                           # ВСЕ ПЯТЬ ПАР РАЗВЯЗАНЫ. Внутри capabilities взаимных пар не осталось.
                           #
                           # ЧТО БЫЛО РАЗВЯЗАНО ПО-НАСТОЯЩЕМУ (переезды в foundation, 2026-08-12) — это
                           # сняло ПЕРЕСЕКАВШИЕ СЛОИ пары, а не эти пять внутри capabilities:
                           #   usage_ledger (252) providers -> shared: снял gates<->providers, engops<->providers.
                           #   gitio (39) engine -> shared: снял engine<->engops.
                           #   budget (68) engine -> shared: снял engine<->providers.
                           #   lifecycle_store (404) lifecycle -> shared: снял gates<->lifecycle.
                           # Правило: модуль, который НИЧЕГО не импортирует из кита и нужен многим, лежит
                           # в foundation. По нему и снята K5: ai_route (317), work_areas и резолвер базы
                           # переехали в shared, и «кто классифицирует» решилось само — workitem зовёт
                           # маршрутизатор ВНИЗ, а не тянет engine вверх.
                           # ПРИМЕЧАНИЕ K5: в engine/ai_route.py оставлен ТОНКИЙ ре-экспорт из
                           # shared/ai_route — для кросс-версионного импорта по старому пути (smoke-
                           # валидатор прошлого тега при апдейте дочки зовёт `from ai_ops_kit.engine
                           # import ai_route`). Пару НЕ восстанавливает: ре-экспорт импортит shared
                           # ВНИЗ, а lifecycle его не трогает — mutual_pairs остаётся 0 (проверено).
  cycles_longer_than_two: 0    # ЧЕСТНОЕ ЧИСЛО. F-03 вскрыл 9 циклов, спрятанных за __import__; снятие
                               # пары K1 (engine<->gates) убрало циклы через это ребро (9 -> 5), а снятие
                               # K2 (context<->engine, 2026-09-10) убрало ОСТАВШИЕСЯ длинные циклы: они все
                               # проходили через ребро context->engine. Стало 0 — но теперь это ПРАВДА
                               # (гейт считает и динамику), а не прежняя слепота анализатора, печатавшая
                               # «кольцо стало DAG» при живых __import__. Взаимных пар длины два тоже не
                               # осталось (K5 сняла последнюю, engine<->lifecycle) — mutual_pairs=0.
                               # Настоящие развязки ПЕРЕСЕКАВШИХ слои циклов
                               # остаются в силе: security<->validation (лента №4), engine/providers/
                               # lifecycle->validation (лента №5).
  internal_imports_by_flat_name: 262   # переход на пакетные имена — отдельный срез
  note: >
    Взаимных пар внутри capabilities НЕ ОСТАЛОСЬ (mutual_pairs=0, 2026-09-10): кольцо стало DAG.
    Все пять исходных пар РАЗВЯЗАНЫ
    ПО-НАСТОЯЩЕМУ: engine<->gates (K1, CLI evidence_collector в devtools),
    engops<->gates (K4, environment_map -> checks), context<->engine (K2, RunPlan приходит в
    compile_bundle извне), delivery<->engine (K3, review_branch — запуск движковых ревью-гейтов —
    переехал в engine, а delivery/pr_open остался актом доставки), engine<->lifecycle (K5, ai_route /
    резолвер базы / work_areas переехали в shared — foundation). Ни одна не спрятана за динамическим
    импортом — проводка перенесена туда, где ей место. До F-03 все пять показывались нулём (слепота
    анализатора к __import__); теперь ноль — факт.
    Пары, ПЕРЕСЕКАВШИЕ слои, сняты по-настоящему: security<->validation (лента №4) и
    engine<->validation (лента №5) — чистую логику валидаторов вынесли вниз в `checks`, а рантайм
    перестал тянуть `validation` (entrypoints) вверх. Разбор этих пяти внутрикольцевых пар — отдельными
    срезами; ратчет держит их как потолок вниз.
  raised_in_3_34: >
    Потолок ПОДНЯТ в том же срезе, где введён: 9 -> 12 пар, 31 -> 210 циклов. Связей в коде при
    этом не прибавилось ни одной. Пока `validation` не был пакетом, шесть пакетов ядра импортировали
    валидаторы по плоскому имени, а валидаторы — модули движка; для графа этих рёбер не
    существовало, потому что не существовало вершины. Перенос дал вершину, и невидимое стало
    считаемым. Число выросло в шесть раз не от ухудшения кода, а от того, что раньше мерили
    вслепую — тот же класс, что и «119 циклов», только там врала методика, а здесь врал охват.
    Развязка перечислена поимённо в known_violations и стоит отдельным срезом.
    Двенадцатая пара (engine<->lifecycle) — единственная НАСТОЯЩАЯ новая связь среза, и она
    честная: `ai_route` лежал среди валидаторов, хотя движком маршрутизации был всегда; после
    переезда в `engine` зависимость `workitem -> ai_route` наконец видна как есть, а не спрятана
    в каталоге, который графу не принадлежал.
  cycles_correction: >
    ЧИСЛО ИСПРАВЛЕНО в 3.34 с 119 на 31, и граф при этом не менялся. 119 считало РОТАЦИИ: обход
    стартовал в каждой вершине и находил один и тот же цикл столько раз, сколько в нём вершин —
    11 троек, 14 четвёрок и 6 пятёрок дали 33+56+30. Различных элементарных циклов 31; проверено,
    что обе методики дают свои числа на неизменном графе 3.31.1, 3.32.0 и текущем. Потолком может
    быть только величина, не зависящая от способа обхода, иначе следующий замер посчитает иначе и
    получит другой ответ на том же коде. Историю (CHANGELOG 3.32.0) не переписываем: там записано,
    что было измерено тогда.
  what_is_enforced_today: >
    Не всё. Запрещено и проверяется: security/ui тянут что-либо выше foundation; shared тянет
    что-либо вообще; любой пакет тянет cli/devtools; продуктовый код тянет devtools (он не едет
    в child). НЕ запрещено: взаимные связи внутри capabilities. Это пол, а не лестница — но пол,
    которого не было.

