# Ратчет размера МОДУЛЯ (файла) в ai_ops_kit/ — заморозить монолиты вниз.
#
# ЗАЧЕМ. func-size (packages/func-size-baseline.yaml) стережёт максимум ФУНКЦИИ, но не размер ФАЙЛА:
# god-функцию можно расщепить на десять мелких, а модуль при этом останется на 1800 строк. Мы дорого
# ужимали крупнейшие модули (ai_ops_run.py -> 1073, execution_pipeline.py -> 664, presenter.py -> 571);
# без замка эти строки тихо отрастают обратно. Здесь размер каждого крупного файла заморожен на
# ТЕКУЩЕМ значении — потолок держит рост, но НЕ мешает усыхать.
#
# Измеряется: validate_module_size.py (число строк `splitlines()` каждого ai_ops_kit/**/*.py).
#
# ПОРОГ 700 строк. Файл на пороге или выше обязан быть в `ceilings` с потолком == текущему размеру.
# Семантика потолка — по «≤»: файл сверх порога краснеет, если ВЫРОС сверх потолка ИЛИ его вовсе нет
# в baseline (новый монолит обязан появиться ОСОЗНАННО — записью в ленте `raises`). Файл ниже порога
# не ограничен. Усыхание (строк < потолка) НЕ краснит прогон; тест module-size лишь просит пере-снять
# baseline, чтобы потолок оставался равен факту (ратчет ходит только вниз).
schema_version: 1
kind: module-size-ratchet
threshold: 700

