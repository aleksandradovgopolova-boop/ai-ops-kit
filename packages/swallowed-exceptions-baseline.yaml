# Ратчет молчаливых глушителей исключений в ai_ops_kit/ (B3) — заморозить их число вниз.
#
# ЗАЧЕМ. `except ...: pass` глушит ошибку молча: код «не смог», но ведёт себя как «всё хорошо» —
# прямо против философии кита «не смог ≠ всё хорошо». Прежде их число ревьюили РАЗОВО (#721,
# `checks-that-run.swallowed_exceptions_reviewed`), но стоячего сторожа не было: новый молчаливый
# глушитель мог просочиться незамеченным. Здесь число заморожено ПОТОЛКОМ на текущем значении.
#
# Измеряется: validate_swallowed_exceptions.py (AST-счёт `except ...:`-обработчиков, чьё тело —
# ровно один `pass`; tests/ и test_*.py исключены — сторож про ЖИВОЙ код, а не про пробы).
#
# ПРАВИЛО (по «≤», как у module-size). Фактическое число краснеет, если ВЫРОСЛО сверх baseline
# (новый глушитель обязан появиться ОСОЗНАННО — обработать ошибку либо осознанно поднять baseline).
# Снижение НЕ краснит прогон; тест swallowed-exceptions лишь просит опустить baseline под факт, чтобы
# освобождённое место не отросло обратно (ратчет ходит только вниз). Идея — «новые глушители называют
# себя», а не «переписать все прямо сейчас».
schema_version: 1
kind: swallowed-exceptions-ratchet

# Замер AST 2026-09-17 (B3). Потолок = текущее фактическое число молчаливых глушителей в ai_ops_kit/.
baseline: 57
