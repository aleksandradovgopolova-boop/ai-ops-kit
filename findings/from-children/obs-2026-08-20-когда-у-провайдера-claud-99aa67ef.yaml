statement: 'Когда у провайдера claude-cli кончается лимит сессии (HTTP 429, ''You''ve
  hit your session limit''), кит не переводит это в человеческую фразу: наружу выходит
  RuntimeError и полный питоновский трейсбек через 5 попыток. Человек не понимает
  ни что случилось, ни что делать — а делать надо всего лишь подождать до указанного
  в ответе времени или взять другого провайдера. Гейт code_review при этом остаётся
  незакрытым, и работа стоит. Ожидание: сообщение вида ''лимит модели кончился, вернусь
  после HH:MM, либо укажи другого провайдера'' и код возврата, а не трейсбек.'
