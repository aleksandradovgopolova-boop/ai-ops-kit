  - id: ep-2026-08-17-short-path-for-described-work
    question: >
      Нужен ли кит первым шагом на уже описанной работе, и если нет — кто решает, по каким
      признакам и с каким потолком траты до первой правки кода?
    decision: >
      ТРИ ОТВЕТА ВЛАДЕЛЬЦА, и они разные по природе.
      (а) РЕШАЕТ КИТ САМ, по признакам, не переспрашивая. Владелец сознательно выбрала это вместо
      предложенного «кит предлагает — решает человек»: лишний вопрос на каждой описанной задаче
      стоит дороже редкой ошибки распознавания, а выход из автоматики остаётся (`--full-process`).
      (б) ПРИЗНАК — ЗАЯВЛЕНИЕ ВЛАДЕЛЬЦА И ПРОВЕРЕННЫЙ КИТОМ МИНИМУМ: чего добиваемся, как поймём
      что готово, где править. Одного заявления НЕ достаточно; одного минимума без заявления —
      тоже (иначе короткий путь включался бы почти всегда).
      (в) ПОТОЛОК на разбор и план ДО первой правки кода — 50 000 токенов, с остановкой и вопросом
      («продолжать разбор или идти делать»), а не молчаливым обрывом.
    reason: >
      ЗАМЕР ПОЛЯ, а не вкус (ИИ-Среда, ~/ii-sreda, 15.08.2026): из ПЯТИ параллельных сессий в одном
      репозитории ДВЕ сожгли по 200+ тысяч токенов на `onboard -> specify -> plan` и встали, не
      написав ни строки кода и не открыв PR, — при том что задача была специфицирована ДО начала.
      Наблюдение той сессии: «когда работа описана, кит нужен для трассируемости, а не как первый
      шаг». 50 000 названы вчетверо меньше замера сознательно.
      ГРАНИЦА, КОТОРУЮ РЕШЕНИЕ НЕ ПЕРЕХОДИТ: короткий путь не понижает уровень спецификации и не
      объявляет разделы неприменимыми. Он заполняет три проверенных раздела из НАЙДЕННОГО источника,
      остальные отклоняет статусом `declined` с обязательным объяснением и пишет
      `features/<wid>/short-path.yaml`. То есть пропуск виден, назван и проверяем — это и есть та
      трассируемость, за которой владелец шла, а не «кит выключен».
    context: >
      Работа плана `kit-as-first-step-or-as-trace` стояла с полем `human_decision` с 15.08.2026:
      где граница между «описано достаточно» и «человеку кажется, что описано» — решение владельца,
      а не вывод из кода. Кит, который сам решает пропускать свои шаги по собственной догадке,
      перестал бы ловить случаи, где спека выглядела полной и не была; поэтому спрашивали.
      Механизмы: `planning/short_path.py`, `engops/process_spend.py`, разводка — `cli/_process_gate`.
    reversibility: two-way
    date: 2026-08-17
    source: чат-сессия 17.08.2026; замер ИИ-Среды 15.08.2026 (planning/plan.yaml)
    supersedes: null

  - id: ep-2026-08-17-capability-freeze-until-second-brownfield
    question: >
      Можно ли принимать новые умения кита, пока не пройден второй реальный чужой проект — то есть
      пока владелец не доходит до проверенного PR, ни разу не починив кит по дороге?
    decision: >
      ВВЕСТИ ПРЕДОХРАНИТЕЛЬ, И ИМЕННО С ОГОВОРКОЙ (решение владельца 17.08.2026).
      ПРАВИЛО: новое умение кита не принимается, пока исход цели `second-real-brownfield`
      (`owner_reaches_verified_pr_without_patching_the_kit`) не стал верным.
      ОГОВОРКА, без которой правило вредит: НЕ считается новым умением работа, которая
      (а) снижает цену процесса для владельца, (б) замыкает обратную связь из поля в кит,
      (в) закрывает найденный полем дефект или доставляет исправление до установленной копии.
      Такая работа — не расширение, а УСЛОВИЕ того самого прогона, ради которого правило и вводится.
    reason: >
      Внешний разбор репозитория (17.08.2026) и собственный замер сошлись в одном: умений уже
      достаточно (49 533 строки, 2380 тестов, 80 валидаторов), а узкое место — недоказанность
      продукта. Последние живые прогоны находят не отсутствие очередной возможности, а РАЗРЫВЫ между
      китом и установленной копией: 17.08 закрыты F-032 и F-033 — механизмы, зелёные в ките и
      отсутствующие у владельца.
      Без такого правила цикл «прогон -> находка -> починка -> новое умение» субъективно ощущается
      развитием при любом результате: число возможностей растёт, расстояние владельца до
      проверенного результата не сокращается.
      ПОЧЕМУ ОГОВОРКА НЕ ЛАЗЕЙКА: правило в лоб заблокировало бы ровно те три работы 17.08, которые
      это расстояние сокращают (короткий путь для описанной работы, канал наблюдений дочка->кит,
      доставка исправлений до дочки). Оговорка называет допустимое узко и проверяемо — по цели, на
      которую работа ссылается, а не по формулировке заявки.
    context: >
      Правило записано, но ПОКА НЕ ИСПОЛНЯЕТСЯ механически: сейчас это решение владельца в реестре,
      а не проверка. Кит требует от других «правило без исполнения — пожелание», поэтому исполнение
      заведено отдельной работой плана `capability-freeze-enforced`; выдавать запись за механизм
      нельзя. Сама заморозка снимается не датой, а исходом второго brownfield.
    reversibility: two-way
    date: 2026-08-17
    source: >
      чат-сессия 17.08.2026 (вопрос владельцу задан по итогам внешнего разбора); цель
      `second-real-brownfield` в planning/plan.yaml
    supersedes: null

  - id: ep-2026-08-17-dev-velocity-first-steps
    question: >
      Ресерч по истории разработки назвал четыре работы и пять развилок. Что берём, в каком порядке,
      и чем платим: менять свой установщик на внешний инструмент, гонять сквозной прогон с живой
      моделью, вводить гейты выпуска строгими сразу?
    decision: >
      ПЯТЬ ОТВЕТОВ ВЛАДЕЛЬЦА 17.08.2026.
      (1) ГЕЙТ ОТСТАВАНИЯ ДОЧКИ — сначала РАЗВЕДКА НА ПОЛДНЯ, решение по замеру, а не по описанию:
      проверить, сохраняются ли правки владельца после обновления внешним шаблонизатором. Замена
      установщика вслепую отвергнута.
      (2) СКВОЗНОЙ ПРОГОН ПУТИ ВЛАДЕЛЬЦА — НАЧАТЬ БЕЗ ЖИВОЙ МОДЕЛИ: прогон должен быть бесплатным и
      повторяемым, чтобы идти на каждую заявку. Живая модель — отдельной ночной проверкой, и только
      после того как стоимость прогона ИЗМЕРЕНА.
      (3) ГЕЙТЫ ВЫПУСКА — СТРОГИЕ СРАЗУ, но только на новые коммиты: 72 из 594 коммитов истории не
      имеют нужного формата, и переписывать историю ради гейта никто не будет.
      (4) РИСК ЗАМОРОЗКИ ВНЕШНЕГО ИНСТРУМЕНТА ЖУРНАЛА ПРИНЯТ (последний релиз 30.08.2025): фрагменты
      журнала — обычные файлы, проверка ~40 строк, замена дешева.
      (5) КЛАСС «ОБРЫВ СЕССИИ» отдельной сущностью НЕ ЗАВОДИТСЯ — измеряется внутри уже открытой
      работы `fixes-between-attempts-measured`.
    reason: >
      ПОВОД — ЗАМЕРЫ РЕСЕРЧА (RR-015, DP-114, 33 записи улик), а не вкус. Главные три:
      CI дал 163 прогона и НОЛЬ падений за 14-17.08, тогда как живые прогоны в те же дни дали 40
      находок; 268 тестовых файлов из 271 лежат в `tests/unit`, а слой, давший ВСЕ 48 находок поля
      (`tests/integration`, `tests/live`, `tests/regression`), содержит только README; самый
      переделываемый файл — `installer/ai_ops.py` (21 исправление из 56 коммитов), то есть шов
      доставки, а не логика.
      Ревью узким местом НЕ является: медиана жизни заявки 0.2 часа, 139 из 141 слито. Поэтому
      ускорение ищется не в согласовании, а в том, чтобы проверки перестали подтверждать уже
      работающее.
      (1) выбрана разведкой потому, что замена установщика — это замена самого дорогого шва: ошибка
      здесь стоит дороже полудня проверки. (2) без живой модели — потому что бесплатный прогон идёт
      на каждую заявку, а платный не пойдёт ни на одну. (3) на новые коммиты — потому что правило,
      требующее переписать историю, не введут никогда.
    context: >
      Крупнейший класс находок оказался НЕ ТЕМ, что предполагалось при постановке: не «исправление не
      доехало до дочки» (8 из 48), а «текст, который кит печатает человеку, сам ничем не проверен»
      (12 из 48) — работа `refusal-paths-say-the-truth`, решений владельца не требует и берётся сразу.
      ЧТО ЯВНО НЕ ИЗМЕРЕНО и названо в ресерче: цена обрывов сессии (`unknown`, а не «не бывает»);
      доля работ плана, расходящихся с `main`; ни один внешний инструмент на этом репозитории не
      запускался, поэтому оценки дней — оценки. Три собственных числа ресерч поймал и исправил до
      слияния, оставив в тексте происхождение ошибки.
    reversibility: two-way
    date: 2026-08-17
    source: >
      чат-сессия 17.08.2026; ресерч RR-015 / DP-114 / EV-1107..EV-1139 (PR #149)
  - id: ep-2026-08-13-session-ceiling-and-context-thresholds
    question: >
      Чем ограничивать сессию, если потолок прогона и учёт вызовов моделей главный источник расхода
      не видят?
    decision: >
      ЗАПИСАНО ЗАДНИМ ЧИСЛОМ 17.08.2026 по решению владельца: числа приняты 13.08.2026, работают в
      коде и до сих пор не были записаны ни одним решением.
      ПОТОЛОК СЕССИИ — 20 000 000 токенов, считается по суммарным токенам ВСЕХ ходов сессии, включая
      кэш-чтения (`session_token_budget`, `engops/session_guardrails.py`).
      ПОРОГИ КОНТЕКСТА — 150k «цель», 250k «пора сжать», 400k «пора в новую сессию».
      ОБА НАБОРА ОБЪЯВЛЕНЫ СТАРТОВЫМИ и подлежат калибровке — 17.08.2026 владелец подтвердила именно
      калибровку замером, а не правку на глаз (`ep-2026-08-17-session-protocol`, п. 1).
    reason: >
      ЗАМЕР ПО ДВУМ НАСТОЯЩИМ ТРАНСКРИПТАМ, а не по ощущению: рабочая сессия на 45 ходов — 3.5M
      токенов; сессия, прожившая с 18.07 по 04.08 с девятью компакциями — 2.9 МЛРД токенов при
      контексте 405k. Второй случай и объясняет, зачем потолок сессии отдельно от порогов контекста:
      после компакции контекст «нормальный», а перечитывание истории уже оплачено на каждом ходе.
      Ни `engine/budget.py` (потолок прогона), ни `gates/economic_preflight`, ни ledger этого не
      видели — они мерят прогон и вызовы моделей, а не жизнь сессии.
    context: >
      Записано, потому что настройка, живущая только в коде, читается следующим человеком как
      случайное число — и «поправляется». Замер 17.08.2026 показал, что потолок превышается вчетверо
      на нормально идущей работе; отсюда работа `session-thresholds-remeasured`.
      ЧТО ЗДЕСЬ НЕ ЗАПИСАНО: цифры автономии подсессий (потолок траты на подсессию и их число)
      названы в разборе 17.08.2026, но в коде я их не нашла — записывать со слов пересказа нельзя.
      Их место — в той же работе о перезамере, вместе с проверкой, существуют ли они вообще.
    reversibility: two-way
    date: 2026-08-13
    source: >
      `ai_ops_kit/engops/session_guardrails.py` (SESSION_ECONOMY_DEFAULTS, замер в комментарии);
      запись оформлена 17.08.2026 по решению владельца
    supersedes: null

  - id: ep-2026-08-17-session-protocol
    question: >
      Сессия как единица работы агента: когда обязательна сдаточная запись (handoff), откуда берутся
      пороги, имеет ли кит право отказаться работать за пределом, переезжает ли handoff между
      машинами и нужна ли отдельная сущность Checkpoint?
    decision: >
      ШЕСТЬ ОТВЕТОВ ВЛАДЕЛЬЦА 17.08.2026, все — в одном пакете, потому что порознь они тянут друг
      друга.
      (1) ПОРОГИ ПЕРЕМЕРИТЬ на живых сессиях и поставить ПО ЗАМЕРУ, а не поднять на глаз. Прежние
      (контекст 150k/250k/400k, потолок сессии 20M) объявлялись стартовыми и подлежащими калибровке.
      (2) HANDOFF ОБЯЗАТЕЛЕН ПРИ ЗАВЕРШЕНИИ РАБОТЫ И ПРИ СМЕНЕ СЕССИИ — не только при смене, как
      было, и не после каждого шага.
      (3) ПРАВО ОТКАЗА КИТУ НЕ ДАЁТСЯ: за пределом он СОВЕТУЕТ, но берёт работу
      (`enforcement=advise` сохранён). Владелец сознательно оставила себе право сказать «знаю,
      продолжай».
      (4) HANDOFF ОСТАЁТСЯ ЛОКАЛЬНЫМ (`.ai/runtime/`, не коммитится): история продукта не
      наполняется служебными файлами каждой сессии.
      (5) CHECKPOINT ОТДЕЛЬНОЙ СУЩНОСТЬЮ НЕ ВВОДИТСЯ — это тот же файл, перезаписанный дважды.
      (6) РЕШЕНИЯ 13.08.2026 (потолок траты подсессии и их число) ЗАПИСАТЬ вместе с замером, из
      которого выведены, — до сих пор они жили только в коде.
    reason: >
      ПОВОД — ЗАМЕР, а не разбор: владелец спросила, почему кит не следит за лимитами сессии. Кит
      следит и точно (на сессии 88c802ae: контекст 427k, 329 ходов, расход 85.2M при потолке 20M,
      рекомендация NEW_SESSION — числа из транскрипта рантайма). Сломано было в другом: совет выходит
      только на путях `do` / `run --execute` и в конце прогона движка, поэтому в обычной рабочей
      сессии кита НЕ СПРАШИВАЛ НИКТО, а когда спрашивали — строка «handoff сохранён» была
      константой при полном отсутствии механизма.
      ПОЧЕМУ (1) ИМЕННО ПЕРЕМЕРИТЬ: та же сессия шла вчетверо выше потолка и работала нормально —
      значит порог либо занижен, либо мерит не то. Порог, который превышается всегда, перестают
      замечать; это хуже его отсутствия.
      ПОЧЕМУ (3) НЕ ОТКАЗ: цена отказа названа владельцем — она теряет право продолжить осознанно.
      Замер того же дня подтверждает: сессия за пределом дала четыре закрытые работы и два выпуска.
      ПОЧЕМУ (2) ШИРЕ, ЧЕМ БЫЛО: в этот же день работа про сессии оборвалась на лимите и не оставила
      после себя ничего, кроме незакрытой заявки, — то есть завершение без записи уже стоило дня.
    context: >
      Механизм handoff построен работой `session-handoff-written-not-declared` (PR #145): SESSION
      COMPLETE с разделами Goal / Done / Decisions / Changed / Tests / Open / Risks / Next,
      `handoff_created` выводится из наличия файла, а не из параметра. Сущность НЕ дублирует
      `RunHandoff` (один прогон движка по одному WorkItem) — предмет разный.
      ЧЕГО ЭТИ ОТВЕТЫ НЕ ЗАКРЫВАЮТ и что заведено работами плана: проактивность (кит по-прежнему
      говорит только когда позван, `session-watch-speaks-unasked`), недостижимость `./ai-ops session`
      в установленной дочке (`session-command-reaches-the-child`), пять мёртвых `check`-контрактов
      сессионных модулей (`session-ritual-validators-are-dead`). Пункты (1) и (6) исполняются работой
      `session-thresholds-remeasured`: пока замера нет, старые пороги остаются как есть — менять их
      на глаз владелец отказалась.
    reversibility: two-way
    date: 2026-08-17
    source: >
      чат-сессия 17.08.2026; замер сессии 88c802ae (`ai-ops session`); PR #145
    supersedes: null

  - id: ep-2026-08-19-session-handoff-scope-narrowed
    question: >
      Обязан ли кит записывать состояние сессии при КАЖДОМ завершении работы — и вправе ли он
      отказаться брать новую работу в сессии, вышедшей за предел?
    decision: >
      ДВА ОТВЕТА ВЛАДЕЛЬЦА 19.08.2026.
      (1) ЗАПИСЬ СОСТОЯНИЯ — ТОЛЬКО КОГДА КИТ САМ СОВЕТУЕТ СМЕНИТЬ СЕССИЮ. Это УЖЕ и есть поведение
      кода; тем самым сужается пункт (2) решения `ep-2026-08-17-session-protocol`, где запись
      объявлялась обязательной и при завершении работы тоже. Названная цена сужения — при внезапном
      обрыве сессии состояния может не быть.
      (2) ПРАВО ОТКАЗА КИТУ НЕ ДАЁТСЯ, `enforcement=advise` сохранён — это ПОДТВЕРЖДЕНИЕ пункта (3)
      того же решения, а не новое правило. Владелец оставляет себе право сказать «знаю, продолжай».
    reason: >
      ПОЧЕМУ СУЖЕНИЕ, А НЕ ОТМЕНА: широкая формулировка 17.08 («обязателен при завершении работы»)
      требовала файла после КАЖДОЙ закрытой работы, включая односложные, — и за два дня, 18–19.08, ни
      одна из семи закрытых работ такого файла не оставила. То есть правило существовало записью и не
      исполнялось ни разу: ровно тот класс «объявлено, но не исполняется», который кит ловит у других.
      Сузить до исполняемого честнее, чем держать неисполняемое.
      ПОЧЕМУ ПОДТВЕРЖДЕНИЕ ОТКАЗА ВАЖНО ЗАПИСАТЬ: 19.08 вопрос был задан заново (моя ошибка — пакет
      17.08 уже отвечал на него), и ответ совпал с прежним. Совпадение зафиксировано, потому что
      «спросили дважды и получили одно и то же» — это данные о устойчивости решения, а не шум.
    context: >
      ПОПУТНАЯ НАХОДКА, из-за которой вопросы и были заданы повторно: работа плана
      `session-protocol-owner-decisions` держала ОТКРЫТЫМИ шесть вопросов, из которых пять были
      решены ещё 17.08 (`ep-2026-08-17-session-protocol`) и записаны в этом же реестре, а шестой
      (запись решений 13.08) закрыт записью `ep-2026-08-13-session-ceiling-and-context-thresholds`.
      План и реестр решений расходились двое суток — тот же класс, что «реестр зовёт готовое
      незакрытым». Работа закрыта по факту, расхождение названо в истории плана.
      ЧТО ОСТАЁТСЯ ОТКРЫТЫМ и где живёт: числа порогов (пункт 1 пакета 17.08) — работа
      `session-thresholds-remeasured`; проактивность кита — `session-watch-speaks-unasked`;
      достижимость команды из установленной копии — `session-command-reaches-the-child`.
    reversibility: two-way
    date: 2026-08-19
    source: >
      чат-сессия 19.08.2026 (вопросы заданы одним пакетом, ответы владельца выбором из вариантов с
      названной ценой каждого); замер: ни одна из семи работ, закрытых 18–19.08, не оставила
      сессионного handoff при действовавшем правиле «обязателен при завершении работы»
    supersedes: ep-2026-08-17-session-protocol

  - id: ep-2026-08-18-team-works-in-parallel
    question: >
      Считать ли конфликты и дубли нормальной ценой параллельной работы — и что должен уметь кит,
      если над продуктом работает КОМАНДА одновременно?
    decision: >
      ТРИ УТВЕРЖДЕНИЯ ВЛАДЕЛЬЦА 18.08.2026, и первое отклоняет вариант, который был предложен как
      допустимый.
      (1) КОНФЛИКТЫ НОРМАЛЬНОЙ ЦЕНОЙ НЕ СЧИТАЕМ. Вариант «оставить как есть и считать конфликты
      ценой параллельной работы» (`derived-state-out-of-tracked-files`, вариант «в») ОТКЛОНЁН.
      (2) ЦЕЛЕВОЙ СЦЕНАРИЙ — КОМАНДА, работающая одновременно, а не несколько сессий одного человека:
      задачи делаются правильно и безопасно параллельно, и конфликтов после не возникает.
      (3) ДВА УСЛОВИЯ, БЕЗ КОТОРЫХ СЦЕНАРИЙ НЕ СЧИТАЕТСЯ ВЫПОЛНЕННЫМ: владелец НЕ думает о том, как
      правильно устроить эту работу, и никто из команды не беспокоится, что делает неважное или
      дублирует чужое.
      Направление заведено целью `team-works-in-parallel` (ROADMAP -> «Сейчас», после
      `qualification-closeout`) с четырьмя проверяемыми исходами.
    reason: >
      ЗАМЕР ПОЛЯ, а не пожелание. Отчёт потребителя 17.08.2026 (заявка #150): за ТРИ ЧАСА в main влито
      девять PR из как минимум четырёх параллельных сессий; PR #526 выброшен как дубль, потому что
      вторая сессия открыла свой на ТУ ЖЕ ветку; слияние #525 произошло «из-под чужих рук», пока
      первая ждала проверок; атрибуция невозможна — токен общий; один и тот же конфликт разрешался
      ПЯТЬ раз за час.
      РЕШАЮЩИЙ ЗАМЕР 18.08.2026, из которого видно, что дело не в дисциплине: реестр «кто что держит»
      `.ai/runtime/active-work.yaml` ЛЕЖИТ В ИГНОРИРУЕМЫХ ФАЙЛАХ — проверено `git check-ignore` и в
      ките (`.gitignore:22`), и в дочке ИИ-Среда (`.gitignore:48`). То есть он локален для одной
      машины: для команды он не координирует НИЧЕГО, каждый видит только себя. Договорённость
      «сливаю после зелёного» в такой схеме невозможно соблюсти в одиночку — это свойство механизма.
      ТОТ ЖЕ ДЕНЬ, ТА ЖЕ СЕССИЯ, СВОИМИ РУКАМИ: я отвела ветку от устаревшей локальной основы, и
      слияние молча откатило бы четыре влитые работы; поймала сверкой числа работ, а не механизмом.
      И дочку ИИ-Среда обновила другая сессия, пока я в ней работала, — узнала я об этом по датам
      файлов.
    context: >
      ЧЕГО СОЗНАТЕЛЬНО НЕ ДЕЛАЕМ: не заводим третье место, где живёт «что идёт» (уже есть план и
      реестр — задача свести их, а не добавить); не вводим `assignee` в план (правило плана: роль, а
      не исполнитель — держателя работы называет реестр рантайма, а не план); не отправляем ничего из
      дочки в сеть без отдельного решения владельца (дочка может быть закрытым продуктом) — поэтому
      носитель общей заявки на работу вынесен отдельным вопросом к владельцу.
      ОТНОШЕНИЕ К ЗАМОРОЗКЕ УМЕНИЙ (`ep-2026-08-17-capability-freeze-until-second-brownfield`):
      бОльшая часть направления попадает в объявленную оговорку — это закрытие найденных ПОЛЕМ
      дефектов и снижение цены процесса, а не новое умение. Части, выходящие за оговорку (работа
      команды из НЕСКОЛЬКИХ ЛЮДЕЙ как таковая: личная атрибуция, общий носитель заявки), названы в
      работах прямо, чтобы заморозку не обходить словами.
      УСЛОВИЕ ПЕРЕСМОТРА: если первый же прогон покажет, что общий носитель заявки требует сети или
      прав, которых у команды нет, — решение о носителе пересматривается отдельно, а не молча
      подменяется локальным файлом.
    reversibility: two-way
    date: 2026-08-18
    source: >
      чат-сессия 18.08.2026; отчёт потребителя #150 (ИИ-Среда, 17.08); замер `git check-ignore` по
      `.ai/runtime/active-work.yaml` в `~/ai-ops-kit` и `~/ii-sreda`
    supersedes: null
  - id: ep-2026-08-18-claim-medium-hybrid
    question: >
      Где живёт общая заявка на работу («кто что держит сейчас»), если реестр обязан быть виден другим
      машинам, но данные дочки нельзя отправлять в сеть без явного решения?
    decision: >
      ГИБРИД: заявка живёт ЛОКАЛЬНО, публикация в общий носитель — ТОЛЬКО ПО ЯВНОМУ ВКЛЮЧЕНИЮ.
      Ответ владельца 18.08.2026 на вопрос, вынесенный `ep-2026-08-18-team-works-in-parallel`.
      Два отклонённых варианта и их цена: (а) отслеживаемый файл заявок в репозитории — работает
      офлайн и виден всем, но сам становится точкой конфликта, то есть лечение воспроизводит болезнь;
      (б) всегда публиковать на стороне GitHub — конфликтов нет, но сеть, права токена и уход имён
      задач в сервис становятся ОБЯЗАТЕЛЬНЫМИ для любого репозитория, включая закрытый.
      ЧТО ЭТО ЗНАЧИТ МЕХАНИЧЕСКИ, и это часть решения, а не деталь: выключенная публикация НЕ ДАЁТ
      права молчать. Пока публикация выключена, кит обязан говорить, что заявка локальная и других
      машин он не видит, — а не предупреждать о пересечениях так, будто видит. Локальное состояние,
      выданное за координацию, — ровно тот ложный green, против которого стоит весь контур.
    reason: >
      РЕШАЮЩИЙ ЗАМЕР 18.08.2026: `.ai/runtime/active-work.yaml` лежит в `.gitignore` и у кита
      (`.gitignore:22`), и у дочки ИИ-Среда (`.gitignore:48`, git его не отслеживает вовсе) — то есть
      «кто что держит» видно только своей машине, и для команды реестр не координирует ничего.
      Гибрид выбран потому, что он единственный не платит ни одной из двух названных цен по умолчанию:
      офлайн-репозиторий продолжает работать без сети, а закрытый продукт не начинает отправлять имена
      своих задач в сервис только потому, что кто-то поставил кит. Право включить остаётся у владельца
      репозитория, а не у автора кита.
    context: >
      ЧЕГО НЕ ДЕЛАЕМ: не публикуем ничего по умолчанию; не делаем один общий файл заявок (он же и есть
      конфликт — только формат «файл на работу»); не вводим `assignee` в план (правило плана: роль, а
      не исполнитель — держателя называет реестр рантайма).
      ЧТО ОБЯЗАНО БЫТЬ НАЗВАНО ПРИ ВКЛЮЧЕНИИ: какие именно поля уезжают (id работы, ветка, машина,
      время, сессия — и НЕ содержимое файлов), потому что включение публикации это и есть то самое
      явное решение об отправке данных, а не галочка.
      УСЛОВИЕ ПЕРЕСМОТРА: если при выключенной публикации команда всё равно наступает на дубли (замер
      на живом прогоне, а не ощущение), решение пересматривается в сторону включения по умолчанию для
      репозиториев, которые владелец объявил открытыми.
    reversibility: two-way
    date: 2026-08-18
    source: >
      чат-сессия 18.08.2026; вопрос вынесен `ep-2026-08-18-team-works-in-parallel`; замер
      `git check-ignore` по `.ai/runtime/active-work.yaml` в `~/ai-ops-kit` и `~/ii-sreda`
    supersedes: null
  - id: ep-2026-08-18-published-carrier-file-per-work
    question: >
      Чем публиковать заявку, когда владелец репозитория включил публикацию? Решение о гибриде
      отклонило «один общий файл» и «всегда-GitHub», но носитель для ОПУБЛИКОВАННОГО случая не назвало.
    decision: >
      ФАЙЛ НА РАБОТУ В GIT. Ответ владельца 18.08.2026. Опубликованная заявка живёт отдельным
      отслеживаемым файлом на каждую пару (машина, работа) — `.ai/claims/<машина>__<работа>.yaml`, —
      и попадает к команде обычным git fetch/pull. Отклонено и почему: сторона GitHub (черновой PR /
      метка / issue) даёт близость к реальному времени и чистую историю репозитория, но требует сети,
      прав токена и отправляет имена задач в сервис — ровно та цена, из-за которой «всегда-GitHub»
      была отклонена родительским решением.
      ЧТО ЭТО ЗНАЧИТ: носитель работает ОФЛАЙН, без токена; заявка видна тому, кто сделал pull;
      конфликтов нет, потому что файл на пару (машина, работа) не пересекается с чужим (в отличие от
      «одного общего файла», который отклонён тем же родительским решением). Уезжают ровно
      объявленные поля — id работы, ветка, машина, время, сессия, статус — и НЕ содержимое файлов.
    reason: >
      Выбор согласован с ценностями родительского решения (ep-2026-08-18-claim-medium-hybrid): офлайн
      без новой внешней зависимости, ничего не уходит в сторонний сервис, право включить у владельца
      репозитория. Цена названа честно: видимость не мгновенная (заявка доезжает с git fetch/pull, а
      не в реальном времени), и заявки попадают в историю репозитория — но это СВОЙ репозиторий
      команды, а публикация включается ею осознанно.
    context: >
      ЧЕГО НЕ ДЕЛАЕМ: не публикуем по умолчанию (это родительское решение, дефолт локальный); не
      кладём заявки в один общий файл (он и есть конфликт); не отправляем содержимое файлов. Сторона
      GitHub остаётся возможным ВТОРЫМ режимом на будущее по отдельному включению — не отвергнута
      навсегда, отложена. УСЛОВИЕ ПЕРЕСМОТРА: если команде нужна видимость БЕЗ git fetch (реальное
      время), вопрос о GitHub-режиме открывается заново замером, а не ощущением.
    reversibility: two-way
    date: 2026-08-18
    source: >
      чат-сессия 18.08.2026; вынесено вопросом из ep-2026-08-18-claim-medium-hybrid; ответ владельца
      «файл на работу в git»
    supersedes: null

  - id: ep-2026-08-19-north-star-accepted
    question: >
      Принимаем ли формулировку центрального обещания кита как критерий отбора умений?
    decision: >
      Да. Формулировка принята: «AI Ops Kit превращает задачу владельца продукта в доказуемое
      изменение продукта, сохраняя связь между намерением, реализацией, проверками и результатом».
      Правило: умение, которое нельзя привязать к цепочке intent → decision → change → evidence →
      outcome, обязано обосновывать своё существование. Зафиксировано как принцип dp-005.
    reason: >
      Ревью предложило конкретную формулировку North Star, которая совпадает с фактическим
      назначением кита и даёт проверяемый критерий отбора новых умений.
    context: Внешнее CTO-level ревью 19.08.2026, §6 п.1.
    reversibility: two-way
    date: 2026-08-19
    source: решение владельца по внешнему ревью 19.08.2026
    supersedes: null

  - id: ep-2026-08-19-brownfield-criterion-unchanged
    question: >
      Ужесточаем ли критерий второго brownfield — требуем НАСТОЯЩЕГО стороннего владельца?
    decision: >
      Нет. Критерий не ужесточается. Текущее условие (owner_reaches_verified_pr_without_patching_the_kit)
      остаётся прежним: прогон ведёт владелец, но не требуется «настоящий сторонний» — автор кита
      тоже считается.
    reason: >
      Ужесточение потребовало бы живого стороннего человека, что делает закрытие цели неконтролируемо
      зависимым от внешнего расписания. Текущий критерий уже достаточно строг: владелец ведёт сам,
      без починки кита по дороге, и verified PR в чужом репозитории.
    context: Внешнее CTO-level ревью 19.08.2026, §6 п.2.
    reversibility: two-way
    date: 2026-08-19
    source: решение владельца по внешнему ревью 19.08.2026
    supersedes: null

  - id: ep-2026-08-19-anti-matryoshka-rule
    question: >
      Фиксируем ли правило против бесконечной матрёшки meta-QA?
    decision: >
      Да. Правило принято: новый уровень проверки проверок появляется, только если ловит класс
      дефектов, недостижимый предыдущим уровнем. Зафиксировано как принцип dp-006 и как проверка
      при добавлении нового уровня.
    reason: >
      Без правила каждый новый уровень мета-проверок увеличивает стоимость процесса, не принося
      пропорциональной надёжности. Принцип называет условие появления нового уровня и предотвращает
      бесконечную рекурсию.
    context: Внешнее CTO-level ревью 19.08.2026, §6 п.3.
    reversibility: two-way
    date: 2026-08-19
    source: решение владельца по внешнему ревью 19.08.2026
    supersedes: null

  - id: ep-2026-08-19-freeze-lifted
    question: >
      Снимать ли заморозку умений (ep-2026-08-17-capability-freeze-until-second-brownfield)
      до достижения исходного условия (verified PR на чужом репо)?
    decision: >
      Да, снять. Заморозка умений поднята решением владельца без достижения исходного условия.
      Владелец решил расширять функциональность параллельно с закрытием P0, не дожидаясь
      verified PR на чужом репозитории. Исход owner_reaches_verified_pr_without_patching_the_kit
      установлен в true в цели second-real-brownfield.
    reason: >
      Владелец устал от инфраструктурной работы и хочет расширять функциональность.
      4 цели с freeze_relation: extension (storybook, cockpit, night-review, outcome-analytics)
      разблокированы для взятия работ.
    context: >
      Сессия 19.08.2026: закрыто 9 работ за сессию, все доступные работы без заморозки исчерпаны.
      Оставшиеся 4 работы — под замороженными целями.
    reversibility: two-way
    date: 2026-08-19
    source: прямое указание владельца «размораживай остальное»
    supersedes: null

