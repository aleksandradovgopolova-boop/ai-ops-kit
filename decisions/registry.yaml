# decisions/registry.yaml — реестр решений: принципы (способ мышления), эпизоды
# (конкретные решения) и исходы. Машинно проверяется validate_decisions.py.
# В child живёт в .ai/project/decisions/. Примеры ниже — реальные решения по киту
# (догфудинг): они же показывают, как извлекать принцип из повторяющихся эпизодов.
schema_version: 1
kind: decisions-registry

principles:
  - id: dp-001
    principle: >
      Внешний материал интегрируем курируемо: берём только недостающую механику,
      дубли уже построенного и структурные reorg'и отклоняем. «Главное — не излишним».
    scope: [package-evolution]
    status: ratified
    confidence: high
    recurrence_count: 4        # research-pack, systems-thinking, session-review, team-os
    counterexamples: []
    review_date: 2026-12-01
    supersedes: null
    derived_from: [ep-2026-07-13-teamos, ep-2026-07-13-systems]

  - id: dp-002
    principle: >
      Новая проверка/гейт вводится non-blocking и становится blocking только после
      обкатки; каждый механизм приносит свой валидатор и селфтест, который видели падающим.
    scope: [quality-gates, package-evolution]
    status: ratified
    confidence: high
    recurrence_count: 5
    counterexamples: []
    review_date: 2026-12-01
    supersedes: null
    derived_from: [ep-2026-07-13-teamos]

  - id: dp-003
    principle: >
      Не декларировать capability, которой нет: оркестратор sequential-only, постоянного
      runtime нет — Robin остаётся спекой, а не «реализованным агентом».
    scope: [honesty, runtime]
    status: ratified
    confidence: medium
    recurrence_count: 2
    counterexamples: []
    review_date: 2026-10-01
    supersedes: null
    derived_from: [ep-2026-07-13-teamos]

episodes:
  - id: ep-2026-07-13-teamos
    question: Как интегрировать team-os-toolkit — целиком или частично?
    decision: >
      Взять только недостающую механику (drift/claims, freshness, governance),
      reorg .ai/ и Robin-бот отклонить; Ф3 сделать, Ф4 оставить спекой.
    reason: >
      ~60% идей уже реализовано под другими именами; ковенант «аддитивно, без breaking
      в 2.x»; нет постоянного runtime под Robin.
    context: Сессия развития кита; предложение GPT взять всё как есть.
    reversibility: two-way
    date: 2026-07-13
    source: чат-сессия; ROADMAP «Интеграция team-os-toolkit»

  - id: ep-2026-07-13-systems
    question: Сколько скиллов systems-thinking брать из шести?
    decision: Два самодостаточных сейчас (constraint, contradiction); leverage — позже; why-tree и stockflow-builder отклонить.
    reason: leverage требует модель на входе; why-tree дублирует deep-research и он multi-agent; stockflow-builder — не дисциплина мышления.
    context: Оценка репозитория systems-thinking-skills.
    reversibility: two-way
    date: 2026-07-13
    source: чат-сессия; CHANGELOG v2.8.0

  - id: ep-2026-07-16-tree-split
    question: Делать ли физический разнос дерева по packages/<name>/ в 3.0?
    decision: >
      Физразнос отложить до 3.1 (раздельная публикация пакетов). В 3.0 оставить только
      аддитивные срезы: границы пакетов + валидатор (срез 0), ai-run канонический вход
      (срез 1), по-пакетная установка через .ai-ops.yaml packages (срез 2).
    reason: >
      Перенос ломает CI-контракт уже установленных child: их ai-ops-update.yml/ai-ops-validate.yml
      хардкодят /tmp/ai-ops-kit/installer/ai_ops.py и .../validation/validate_ai_ops_child.py —
      апдейт сломается на следующем запуске, а починить можно только апдейтом (замкнутый круг).
      Плюс 33 файла с PKG-путями и remap managed_set target. Польза «пакетов» (гранулярная
      установка) уже дана срезами 0–2 без переноса; единственный выигрыш разноса — раздельная
      дистрибуция, а это цель 3.1.
    context: Сессия развития кита; владелец дал go на срез 3, блокер найден при подготовке к переносу.
    reversibility: two-way
    date: 2026-07-16
    source: чат-сессия; docs/3.0-design.md

  - id: ep-2026-07-16-smart-loosening
    question: implementation_verification требует ВСЕ 4 проверки (build+lint+typecheck+tests) — оставить жёстко или ослабить?
    decision: >
      «Умное ослабление»: флаг освобождается, ТОЛЬКО если инструмента нет в ПОДТВЕРЖДЁННОМ
      стеке (build/lint/typecheck). tests — особый случай: по умолчанию тоже освобождаются +
      громкий warn, а policy allow_missing_tests=False эскалирует до блока. Освобождение всегда
      записывается в warnings гейта (видно, не тихо); объявленная-но-упавшая проверка блокирует.
    reason: >
      Требование всех 4 делало гейт НЕДОСТИЖИМЫМ для репо без линтера/тайпчекера -> ложный
      контроль, который приучает обходить гейты (прямое предупреждение аудитора). Нельзя
      требовать доказательство, которого физически нет (инвариант честных деклараций). Защиты
      от халявы: (1) освобождается только то, что ДЕТЕРМИНИРОВАННО отсутствует в манифестах
      стека (project_detector, не слово модели); (2) освобождение записано в warnings гейта;
      (3) объявленная-но-упавшая проверка не освобождается.
      ЧЕСТНО (adversarial-review): в offline-pipeline профиль — ДЕТЕКТИРОВАННЫЙ (status: draft),
      подтверждение человеком РЕКОМЕНДУЕТСЯ (writer≠judge), но НЕ enforced кодом pipeline;
      это защита от фабрикации моделью, а не от неверной детекции.
    context: После вопроса владельца по итогам живого прогона pipeline (гейт заблокировал пустой репо).
    reversibility: two-way
    date: 2026-07-16
    source: чат-сессия; аудит исполнения
    supersedes: null

  - id: ep-2026-07-17-vision-audit
    question: >
      Собственный аудит на соответствие видению нашёл orphan-гейты (spec_synchronization и
      archive_readiness применимы, но не запускались) и non-blocking phase-3 гейты после
      завершённого dogfooding. Что делать?
    decision: >
      (1) OpenSpec-гейты (spec_synchronization, archive_readiness) НЕ пихать в per-task
      quality_gates: они детерминированно enforced OpenSpec CLI + validate_openspec_change.py
      в CI. Зафиксировать это полем gate.enforced_by=openspec-ci-guard; validate_workflow_gates
      стал track-aware и enforced_by-aware, а недостижимый MVP-blocking гейт теперь ERROR
      (orphan-guard), не WARN. (2) intake_completeness ДОБАВИТЬ в ENGINEERING (это per-run гейт,
      реально пропущенный). (3) Phase-3 non-blocking гейты (documentation_updated, release_safety,
      observability_readiness, stakeholder_readiness и knowledge_*/decision_quality) ОСТАВИТЬ
      non-blocking пока: baseline_ready достигнут на ОДНОМ child (ии-среда), а критерий
      промоушена — стабильный зелёный на ≥2 child. Промоушен — отдельным решением по данным.
    reason: >
      Видение требует честных деклараций и отсутствия тихого дрифта. Orphan MVP-blocking гейт
      делал гарантию «8 blocking» ложной (7 из 8 реально исполнимы). enforced_by честно
      фиксирует РЕАЛЬНЫЙ путь исполнения вместо того, чтобы имитировать per-run проверку,
      которую pipeline не может произвести. Промоушен phase-3 в blocking по одному child —
      преждевременно: изменит child-CI и может ломать прогоны там, где практики ещё не улеглись;
      ковенант — ужесточать по данным обкатки, а не по календарю.
    context: >
      Собственный аудит кита против VISION.md/ROADMAP.md (агент-ревьюер + ручная верификация);
      находки P0 orphan-гейт, P1 счётчик gates 26→28, P2 applicability→INCIDENT, форма
      documentation_drift.
    reversibility: two-way
    date: 2026-07-17
    source: чат-сессия; self-audit против видения
    supersedes: null

  - id: ep-2026-07-16-execution-audit
    question: Внешний аудит исполнения — что делать дальше с китом?
    decision: >
      ЗАМОРОЗИТЬ фичи (новые агенты, lifecycle-стадии, Knowledge Graph, Robin, физразнос
      пакетов) и вести один P0-эпик: одна обычная задача на реальном репо проходит через
      кит до проверяемого draft PR. Сразу закрыты contained security/correctness дефекты
      (path traversal, слепая tool-loop); остальное — P0-backlog (единый движок вместо
      двух, установимый CLI с движком в child, sandbox shell, RunPlan-гейты в прогоне,
      условный approval, evidence на точный SHA, reviewer.json от оркестратора).
    reason: >
      Аудит верно показал: компоненты есть, но не собраны в один движок; generic-путь всё ещё
      гоняет doc-оркестратор, а не tool-loop; child не получает сам движок (только контракты);
      Policy не была настоящей security boundary. Польза команде «здесь и сейчас» — 4/10, пока
      нет пути task->PR. Достраивать вокруг исполнения дальше — вредно.
    context: Отчёт аудита исполнения на main 2.50; проверено по коду (дефекты подтверждены).
    reversibility: two-way
    date: 2026-07-16
    source: чат-сессия; аудит исполнения
    supersedes: null

  - id: ep-2026-08-14-product-os
    question: >
      Куда идёт кит после закрытия quality-контура: наращивать инженерные проверки или
      строить продуктовый и дизайнерский цикл?
    decision: >
      Владелец объявил следующий этап — AI Product Operating System через три связанных цикла:
      Product Decision Loop (правильную ли проблему решаем и почему это решение),
      Storybook-based Design Loop (какой опыт получит пользователь и совпала ли реализация
      с решением) и Outcome & Analytics Loop (принесло ли изменение пользу после релиза).
      Порядок закреплён: сначала `qualification-closeout` (реальная задача до verified PR без
      ручной правки кита), затем `plan-as-control-plane`, затем продуктовый и дизайнерский циклы.
      Первый полигон — `ai-ops-cockpit`, и первая работа там — одна вертикальная функция
      (экран активной работы), а не «улучшить дизайн». Новых агентов и документов не плодить:
      существующие шаблоны сворачиваются в четыре объекта — Opportunity Brief, Product Decision
      Record, Outcome Contract, Outcome Readout.
    reason: >
      Замер зрелости владельца: инженерное качество 8/10, продукт 5/10, UX 3–4/10, анализ
      результата 4/10. Кит всё лучше умеет не выдавать незавершённое за готовое, но почти не
      помогает решить, КАКУЮ работу делать и какой опыт создать. Видение (VISION.md) уже описывает
      Product OS, а ближайший roadmap занят qualification/CI/автономией — разрыв между обещанным и
      исполняемым продуктом закрывается не новыми возможностями, а одной настоящей функцией,
      проведённой целиком: от пользовательской проблемы до измеренного результата.
    context: >
      Ревью владельца 14.08.2026 (чат-сессия) поверх состояния v3.36.10 + PR #118.
      ТРИ ПОПРАВКИ ПО ФАКТАМ РЕПОЗИТОРИЯ, принятые в тот же день:
      (1) Storybook-сторона EVIDENCE уже построена — `ui/storybook_adapter.py` собирает
      UIEvidenceBundle (build/interaction/a11y/visual/design_system/state_coverage с required-
      состояниями), `validate_storybook_evidence.py` запрещает выдавать «нет данных» за «чисто».
      Достраивать нужно сторону СОЗДАНИЯ: Experience Contract, из которого required_stories
      выводятся КОДОМ, и варианты дизайна с trade-offs. Этап дешевле, чем в документе;
      (2) требование полевых доказательств на двух дочках для канала `stable` уже enforced
      машинно (`validate_release_claims` + селфтест), вводить его не нужно;
      (3) формулировку «reviewer прикладывает проверяемое основание» пришлось изменить: пять
      кругов свежего ревью на PR #118 показали, что поиск подстроки не может доказывать смысл —
      каждая попытка меняла одну ошибку на обратную. Работающая форма: основание НАЗЫВАЕТ свою
      силу (`absence-proof`/`post-state`/`file`/`removed-line`/`judge-only`), а отчёт несёт
      `quote_verified` и `owner_check_required`. То же правило переносится на дизайн и аналитику:
      `accessibility: passed` без указания, чем подтверждено, — будущий ложный green той же формы.
      ДОБАВЛЕНО В ЭТАП 0 (замер, а не мнение): 36 находок за 5 кругов ревью, ни одной не поймали
      11 джоб CI. Пока контур не ловит этот класс, каждый новый цикл поедет с тем же дефектом
      формы «объявлено — не исполняется», поэтому проверка на этот класс входит в closeout.
    reversibility: two-way
    date: 2026-08-14
    source: чат-сессия 14.08.2026; ROADMAP «Сейчас»; VISION.md
    supersedes: null

  - id: ep-2026-08-14-nightly-review
    question: >
      Нужен ли киту постоянный контур наблюдения за здоровьем продукта — и что он вправе
      исправлять сам?
    decision: >
      Да: пятый постоянный контур «Ночная смена» (Nightly Product Review). Ночью кит смотрит, что
      изменилось, находит расхождения продукта с документацией, тестами, архитектурой, Storybook и
      аналитикой, и утром отдаёт владельцу ОДИН Morning Product Health Brief: что изменилось, что
      система сделала, чего НЕ стала делать и почему, где нужно решение, что важнее всего сегодня.
      Разделение ответственности жёсткое: Research Center наблюдает и собирает evidence, движок
      исполняет только разрешённые классы правок в изолированном worktree, Robin (persistent
      runtime) — планировщик и канал доставки, но НЕ исполнитель кодовых изменений.
      Autofix Policy — четыре класса: A (детерминированное, обратимое, не меняющее поведение) может
      быть исправлено автоматически, но НИКОГДА не в `main` — только worktree -> проверки -> draft PR;
      B кит готовит целиком, но мержит человек; C — только рекомендация и решение владельца;
      D (секрет, сломанный main, отключённый security-гейт) — срочное уведомление, не дожидаясь утра.
      Глубина двухуровневая: ежедневно Delta Review по изменениям с последнего подтверждённого
      обзора, по расписанию — ротационный Deep Review; полного перечитывания продукта каждую ночь НЕ
      делаем (дорого, шумно, повторяет одни находки и плодит бессмысленные PR).
    reason: >
      Первые четыре контура создают изменение, а между изменениями продукт деградирует молча:
      документация расходится с кодом, гейты слабеют, циклы растут, stories отстают, события
      аналитики не доезжают. Ловить это глазами владельца дорого и поздно. Ночь — единственное время,
      когда длинная проверка ничего не блокирует.
      ДВЕ ПОПРАВКИ К ПОРЯДКУ, принятые в том же решении:
      (1) `nightly-product-review-v0` НЕ ставится под «Сейчас»: там уже пять целей, и первая
      (`qualification-closeout`) упирается в живой прогон. Шестая цель означала бы, что не движется
      ни одна; v0 живёт в «Следующем результате» сразу после closeout — у них общий блокер, надёжность
      вердиктов, которую в поле ещё никто не мерил.
      (2) Класс A на старте ПУСТ. Список безопасных правок аккуратен, но замер дня (PR #118: пять
      кругов ревью, 36 находок, трижды правка сама создавала дефект того класса, который чинила)
      говорит: автофикс без измеренного false-positive rate — тот же ложный green, только теперь он
      коммитит. Порядок: v0 наблюдает и предлагает -> точность мерится на реальных находках -> класс A
      открывается по одному пункту.
    context: >
      Ревью владельца 14.08.2026, второй документ дня (после `ep-2026-08-14-product-os`).
      ФАКТЫ РЕПОЗИТОРИЯ, проверенные перед записью: планировщик и канал доставки ГОТОВЫ — Robin
      умеет cron (`runtime/robin/duties.example.yaml`: `trigger: {type: cron, schedule: …}`), а
      инвариант «Robin read-mostly, destination — чат или файл-дайджест» объявлен в шапке того же
      файла и проверяется `validate_duties.py`. UI-инструменты, на которые опирается дизайн-блок
      ночного обзора, тоже есть: `ui/storybook_adapter.py`, `storybook_query.py`,
      `ui_evidence_collect.py`, `ui_readiness.py`.
      А ВОТ WATCHES КАК КОНТРАКТА НЕТ: в `.research/watches/` лежат два ЖУРНАЛА
      (`freshness-log.md`, `novelty-log.md`), схем `WatchDefinition`/`NightReviewRun`/`ReviewFinding`
      не существует. То есть «основа непрерывного наблюдения заложена» — верно про дисциплину и
      неверно про машиночитаемый контракт: его предстоит построить, и это главная часть v0.
    reversibility: two-way
    date: 2026-08-14
    source: чат-сессия 14.08.2026 (второй документ); ROADMAP «Следующий результат»
    supersedes: null

outcomes:
  - decision: ep-2026-07-13-systems
    outcome: Оба скилла выпущены (v2.8), проводка в INSIGHTS/PRODUCT/ENGINEERING; обкатка в ии-среде предстоит.
    reviewed_at: 2026-07-13

  - decision: ep-2026-07-16-tree-split
    outcome: >
      3.0 объявлен additive-complete (v2.46–2.48: границы+валидатор, ai-run канонический,
      по-пакетная установка). Физразнос дерева -> 3.1, когда будет раздельная дистрибуция
      пакетов и миграция child-CI на путь-агностичный вызов.
    reviewed_at: 2026-07-16

  - decision: ep-2026-07-16-execution-audit
    outcome: >
      v2.53: закрыты contained дефекты — path traversal в Tool Broker (decide+execute guard)
      и слепая tool-loop (содержимое read/вывод shell идут в контекст модели). Фичи заморожены;
      P0-эпик task->draft PR открыт (единый движок, установимый CLI, sandbox, RunPlan-гейты в
      прогоне, условный approval, evidence на SHA, reviewer.json). Успех эпика = 2/3 реальных
      задачи доходят до draft PR с зелёным CI и без переписывания ревьюером.
    reviewed_at: 2026-07-16

  - decision: ep-2026-07-16-execution-audit
    outcome: >
      v2.54–2.66: движок собран (execution_pipeline) и подключён к контроллеру
      (ai-ops run --engine pipeline); подтверждён живьём на ограниченном QUICK-сценарии
      (v2.64, ready_for_pr=True). v2.66 «Trust Boundary» по следующему аудиту: P0.1
      (print_human/exit-code/CLI-флаги для pipeline), P0.2-contained (shell timeout + честная
      граница «shell не песочница»), P0.5 (полный SHA + tree-clean + строгий ready_for_pr),
      P1.1 (валидация WorkItem ID + containment worktree-путей). Overclaim'ы понижены до честной
