# Pre-commit hooks for AI Ops Kit (v3.28.0 R16)
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
repos:
  # v3.36.8 (ревизия 2026-08-11): охват был `^(tools|validation|tests)/`. Каталога `validation/`
  # в корне нет с v3.34 (переехал в `ai_ops_kit/validation/`), а `tools/*.py` — семистрочные
  # алиасы. Значит линтовались алиасы и тесты, а пакет `ai_ops_kit/` (40 544 строки продакшна) —
  # ни разу. Набор правил объявлен в `pyproject.toml -> [tool.ruff.lint]` и по нему сейчас ноль,
  # поэтому охват можно расширить, не превращая коммит в правку 912 замечаний.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Одна версия с CI (`package-quality.yml`): расхождение делало «локально чисто»
    # и «чисто в CI» утверждениями про разные линтеры — замер 12.08.2026.
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(ai_ops_kit|installer|tools|tests)/.*\.py$
      # ХУКА ruff-format ЗДЕСЬ БОЛЬШЕ НЕТ (2026-08-12). Он стоял с охватом `^(tools|validation|tests)/`
      # и был НЕПРИМЕНИМ: репозиторий не отформатирован `ruff format` вовсе — замер при
      # line-length=110 (реальная конвенция, p99) даёт 528 файлов из 901 и ~45 000 изменённых
      # строк. Хук работает по staged-файлам, поэтому любой коммит, тронувший один тест, приносил
      # бы вместе с правкой полный переформат этого файла: правку в таком диффе не отревьюить.
      #
      # Отсюда два вывода, и оба записаны, а не забыты:
      #   1. Хук, который нельзя выполнить, — не проверка. Его либо обходят `--no-verify`, либо не
      #      ставят pre-commit вовсе (судя по состоянию дерева, так и было). Мёртвый хук хуже
      #      отсутствующего: он создаёт видимость контроля стиля.
      #   2. Принятие форматтера — отдельное изменение масштаба владельца, а не хук: один коммит
      #      на 45k строк топит `git blame` по всему репозиторию. Решение вынесено в горизонт
      #      «Later» в `ROADMAP.md` вместе с ценой — там оно останется видимым.
      #
      # Стиль при этом не остался без присмотра: `ruff check` с набором класса «поломка» исполняется
      # ниже, в CI и в `scripts/check-full.sh`.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      # v3.36.8 (ревизия 2026-08-11): путь был `validation/validate_python_compat.py` — каталог
      # переехал в `ai_ops_kit/validation/` в v3.34, и хук ПАДАЛ с «can't open file» на любой
      # правке в `tools/`. Сломанный хук — не проверка: он либо блокирует работу, либо его
      # отключают, и тогда совместимость с полом 3.9 не проверяет никто до CI.
      - id: python-compat
        name: Python 3.9 compatibility check
        entry: python3 ai_ops_kit/validation/validate_python_compat.py
        language: system
        files: ^(ai_ops_kit|installer|tools)/.*\.py$
        pass_filenames: false

      - id: selftest-smoke
        name: Critical selftest smoke
        entry: python3 -m pytest tests/contracts/ -q --no-cov --tb=line
        language: system
        files: ^(tools|validation|tests)/
        pass_filenames: false
        stages: [pre-push]

      # v3.36.9 (замер 12.08.2026): `commit_policy.check_commit` живёт с v3.19.0 и НЕ ЗАПУСКАЛСЯ
      # нигде — ни в хуках, ни в CI. На коммите 4a231ae, куда `git add -A` соседней сессии унёс
      # чужой фикс CI-шаблона и research-скан, контракт даёт `broad_scope`: «затронуто 5
      # верхнеуровневых каталогов — похоже на несколько задач в одном коммите». Проверка была права
      # и молчала, потому что её не звали. Протокол — docs/parallel-sessions.md.
      #
      # Стадия commit-msg, а не pre-commit: контракту нужны И файлы, И текст сообщения (правила про
      # заглушки, секреты, ссылку на WorkItem и evidence). На pre-commit сообщения ещё нет, и
      # исполнилась бы половина контракта — а половина проверки хуже отсутствующей: она создаёт
      # видимость полной.
      - id: commit-contract
        name: CommitContract (охват коммита и осмысленность сообщения)
        entry: scripts/commit-contract.sh
        language: system
        pass_filenames: false
        stages: [commit-msg]
