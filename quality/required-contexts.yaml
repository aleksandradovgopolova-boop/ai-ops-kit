# quality/required-contexts.yaml — декларация обязательных статусов защиты ветки.
#
# РАБОТА required-contexts-match-jobs (2026-08-25).
#
# ПОВОД — ЗАМЕР 20.08.2026 (docs/parallel-execution-retro.md §1 п.5): удаление джобы
# python39-compat не убрало её из обязательных контекстов защиты ветки — ВСЕ PR зависли
# BLOCKED навсегда, потребовалось admin-действие владельца.
#
# ЧТО ЗДЕСЬ. Список контекстов, которые ОБЯЗАНЫ быть в защите ветки main. Валидатор
# (validate_required_contexts.py) сверяет этот список с реальными джобами в CI-workflows.
# Если контекст объявлен, но джобы нет — КРАСНОЕ (рассинхрон, который повесит очередь).
# Если джоба есть, но не объявлена — WARNING (не все джобы обязаны быть required).
#
# КАК ОБНОВЛЯТЬ. При добавлении/удалении/переименовании CI-джобы, которая должна блокировать
# мёрж, обновите этот файл. Валидатор ловит рассинхрон в CI и локально.
#
# ФОРМАТ. Каждый элемент — строка вида "<workflow_name> / <job_name>" (как GitHub показывает
# в status checks) или просто "<job_name>" (если workflow один).
schema_version: 1
registry_type: required-contexts

# Обязательные контексты защиты ветки main.
# Имена джоб из .github/workflows/*.yml (job IDs под ключами jobs:).
contexts:
  # pr-smoke.yml
  - pr-smoke / smoke
  # package-quality.yml
  - package-quality / lint
  - package-quality / quality (fast)
  - package-quality / quality (selftests-a)
  - package-quality / quality (selftests-m)
  - package-quality / quality (contracts)
  # coverage снят с обязательных 2026-09-03: держал стену ~10.8 мин на каждом PR, за окно прогонов
  # не поймал ничего. Owner убрал его из branch protection; джоба переехала в nightly-coverage.yml
  # (ночь + push в main + вручную). Здесь его больше нет намеренно — иначе валидатор (верно) краснит
  # «объявлен, но джобы нет». Метрика жива, просто не блокирует PR.
  - package-quality / clean-install
  - package-quality / upgrade-path
  - package-quality / pipeline-e2e (3.12)
  # security-scan — детерминированный скан диффа PR (секреты + зависимости +
  # injection-surface). Возврат 1 = находки/ошибка, поэтому обязателен: красный
  # security-scan (утечка секрета, новая неодобренная зависимость) больше не сливается.
  # Джоба идёт только на событии `pull_request` (ей нужна база `origin/main` для diff) —
  # как и `docs / build`; на push в main предмета сравнения нет. Включение required в
  # branch protection — за владельцем.
  - package-quality / security-scan
  # docs.yml
  - docs / build
