  why: 'P0-2 (аудит 04.09): движок/CI/реестры кита (.github/, ai_ops_kit/, registry/) под owner-approval
    ТОЛЬКО когда прогон идёт над самим китом (self-host). Снять условие (if False) — и на self-host
    движок перестаёт быть protected: модель через sed/echo> правит ai_ops_kit/gates или .github/workflows
    без одобрения, и пост-фактум сторож молчит (ровно дыра, ради которой правило и заведено). Проба
    TestP0SelfHostEngineProtected (write- и shell-канал, откат + запрет) обязана покраснеть.'
- id: self-host-seam-policy-loads-protected-map
  kind: seam
  covers:
  - ai_ops_kit/engine/tool_broker.py
  file: ai_ops_kit/engine/tool_broker.py
  find: '        self.protected = _protected_prefixes(child_root)'
