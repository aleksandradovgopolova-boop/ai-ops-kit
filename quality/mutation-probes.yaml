    держал `bool(outcome[FREEZE_OUTCOME])`, и `true` без единого доказательства снимал её И открывал
    канал stable (класс F-002/F-005: заморозку сняли, не доказав исход). `validate` теперь требует у
    снимающего заморозку исхода полевое доказательство (registry/release-claims.yaml ->
    field_evidence). Мутация снимает требование: `true` снова снимает заморозку самодекларацией, и
    структурно валидный план молча объявляет пройденным то, что не доказано.'
- id: managed-drift-seam-pipeline-warns-before-isolation
