    собственный валидатор кита говорил об этом прямо — снятие охраны поймается, а отключённый
    ВЫЗОВ механизма нет. Цена молчания названа замером B2-27: `update --in-place` оставляет
    managed-файлы в рабочем дереве, прогон изолируется в worktree от HEAD, незакоммиченное туда
    не попадает — прогон идёт на СТАРОМ ките, а doctor говорит «версии ✓». Мутация оставляет
    проверку написанной и отключает её вызов: снаружи всё объявлено, а владелец снова получает
