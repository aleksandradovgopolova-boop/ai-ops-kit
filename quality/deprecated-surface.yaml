# Плоские имена модулей — слой совместимости, объявленный УХОДЯЩИМ.
#
# Уровень поверхности — `deprecated` (см. docs/api/public-surface.md).
#
# ЧТО ЭТО. До v3.30 весь код движка лежал плоско в `tools/`. Код переехал в пакеты
# `ai_ops_kit/*`, а в `tools/` остались тонкие алиасы через подмену `sys.modules` — один объект
# модуля, не копия. Они держат внешние вызовы, которые ещё пишут плоское имя: точки входа
# установщика, документацию, дочку.
#
# ПОЧЕМУ РЕЕСТР. `AGENTS.md` запрещает заводить новые алиасы, но запрет без проверки — это текст.
# Реестр делает его исполняемым: список заперт и ходит ТОЛЬКО ВНИЗ. Новый файл в `tools/`, которого
# здесь нет, краснеет; удалённый обязан уйти отсюда. Модуль, родившийся в пакете, алиаса не
# получает — ему незачем догонять совместимость с тем, чего никогда не было.
#
# Охрана — tests/unit/test_package_surface.py.
#
# ЗАМЕР на момент запирания (19.08.2026): 113 файлов в `tools/`, из них 112 алиасов и один
# настоящий модуль — `_bootstrap.py` (он обязан существовать в каждом каталоге, откуда запускают
# код, потому что кладёт пути ДО того, как станет возможен любой импорт).
schema_version: 1
