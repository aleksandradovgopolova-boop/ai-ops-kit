# quality/pr-budget.yaml — потолок РАЗМЕРА одного PR: одна работа = один малый PR.
#
# ПОВОД ЗАМЕРЕН (docs/parallel-execution-retro.md §1.7, §2). Лента 5 сложила всю Фазу 4 в ОДИН PR
# на +2589 строк — с незарегистрированным пакетом, четырьмя модулями на 0% покрытия и пробитыми
# потолками. Сессия закрылась, и весь долг лёг на координатора серией мелких правок. Durable-fix,
# записанный в ретро, — не «договоримся сдавать малыми PR», а ПРОВЕРКА размера/охвата PR.
#
# ПРАВИЛО. Одна работа = один PR: код своей территории + тесты + newsfragment, green сам по себе.
# «Вся фаза одним PR» ловится этим потолком: малый PR быстрее зеленеет и не копит долг.
#
# ЧТО СЧИТАЕТСЯ. Проверка (`ai_ops_kit/validation/validate_pr_size.py`) берёт дифф PR
# (`git diff --numstat <base>...HEAD`) и складывает изменённые строки и файлы — но ТОЛЬКО по
# неисключённым путям. Исключены (`exempt_*` ниже): newsfragments/ и docs/ (сопроводительные, не
# «код территории») и координационные файлы (их ведёт координатор чистым бухгалтерским PR — тот же
# список, что в registry/coordination-files.yaml). Так честный чистый chore(plan)-PR, переписывающий
# план, не краснеет за размер, а лента-«вся-фаза-одним-PR» — краснеет.
#
# КАК ВЫБРАНЫ ЧИСЛА (замер last-30 merged PR на 2026-08-28:
#   gh pr list --state merged --limit 30 --json additions,deletions,changedFiles). Нормальный
# рабочий размер (без аномалии): диффы 24..500 строк (кластер фич/рефакторингов 200..470),
# изменённых файлов 3..10. Единственная аномалия — тот самый дамп фазы на +2589 строк / 10 файлов.
# Потолок поставлен с ЗАПАСОМ над нормой (~1.6x над крупнейшим здоровым PR ~500 строк) и заведомо
# НИЖЕ аномалии (2589 >> 800): норму пропускает, дамп фазы ловит. Это СТАРТОВЫЙ РАТЧЕТ — как и
# func-size, он ходит вниз: по мере обкатки, когда наберётся статистика здоровых PR, число можно
# опускать. Меняется только это число — валидатор его не хардкодит, читает отсюда.
schema_version: 1
registry_type: pr-budget

metadata:
  work: lane-ships-small-prs
  calibrated_at: '2026-08-28'
  source: docs/parallel-execution-retro.md
  note: >-
    Стартовый ратчет размера PR. Числа откалиброваны замером last-30 merged PR; потолок с запасом
    над нормой (~500 строк) и ниже замеренной аномалии (+2589 строк одним PR). Ходит только вниз.

# Действующие потолки одного PR (по НЕИСКЛЮЧЁННЫМ путям диффа).
ceilings:
  # Сумма изменённых строк (added + deleted) по неисключённым файлам.
  max_diff_lines: 800
  # Число изменённых неисключённых файлов.
  max_changed_files: 15

# Пути, не считающиеся «кодом территории» и потому НЕ входящие в размер PR.
exemptions:
  # Префиксы каталогов: сопроводительное, а не территория работы.
  prefixes:
    - newsfragments/
    - docs/
  # Точные пути: координационные файлы (их ведёт координатор чистым PR; зеркало
  # registry/coordination-files.yaml — стабильный список из 4 имён, меняется вручную вместе с ним).
  paths:
    - planning/plan.yaml
    - history/plan-history.yaml
    - decisions/registry.yaml
    - registry/release-claims.yaml
