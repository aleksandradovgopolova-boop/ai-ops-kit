# quality/gate-machinability.yaml — что из «зелёного по мнению» может стать машинным (C3, v3.37)
#
# ПОВОД. Из 35 гейтов 19 закрывает не машина, а судья или писатель. Карта `closed_by` (в
# `quality/gates.yaml`) отвечает, КТО закрывает гейт сегодня. Этот файл отвечает на следующий
# вопрос: у кого из них это положение вещей ВРЕМЕННОЕ, а у кого — по существу.
#
# ЦЕЛЬ НЕ «СДЕЛАТЬ ВСЕ 19 МАШИННЫМИ». Это неверная цель: `stakeholder_readiness` — про готовность
# людей, `decision_quality` — про качество решения; машина может проверить, что решение записано и
# обратимость классифицирована, но не что решение хорошее. Гейт, объявленный машинным там, где
# судит человек, — это ложное «зелёное» с кодом возврата, то есть хуже честного мнения.
#
# ЛИНИЯ РАЗДЕЛА ОДНА И ОНА ПРОВЕРЯЕМАЯ: **машинным может стать то, чьё доказательство — ФАКТ О
# РЕПОЗИТОРИИ, АРТЕФАКТЕ ИЛИ ПРОГОНЕ, а не суждение о качестве.** «Файл существует», «диф трогает
# домен», «прогон дал число ниже порога», «блокеров ноль» — факты. «Поток удобен», «архитектура
# уместна», «стейкхолдеры готовы» — не факты.
#
# ОТСЮДА ТРИ ВЕРДИКТА, И ТРЕТИЙ НЕ СВОРАЧИВАЕТСЯ ВО ВТОРОЙ:
#   mechanizable    — все доказательства гейта фактические; нужна проверка и то, что в `needs`
#   partly          — часть доказательств фактические, часть — суждение. Машина может закрыть свою
#                     часть и СУЗИТЬ мнение до остатка, но не заменить его
#   human_by_nature — существо гейта — суждение; машинной остаётся только ФОРМА (что заключение
#                     есть, привязано к ревизии и называет причины)
#
# ЧЕСТНОСТЬ ЭТОГО ФАЙЛА ПРОВЕРЯЕТСЯ. `ai_ops_kit/devtools/gate_machinability.py` сверяет его с
# реестром гейтов: покрыты ровно те гейты, что закрываются не валидатором, ни одного лишнего и ни
# одного забытого. Иначе карта разошлась бы с реальностью в первый же день и стала бы прозой.
schema_version: 1
registry_type: gate-machinability
measured_at: "2026-08-20"
source_of_truth: quality/gates.yaml

verdicts:
  mechanizable: >
    Все объявленные доказательства гейта — факты, проверяемые кодом. Мнение здесь сегодня стоит
    не потому, что иначе нельзя, а потому, что проверку не написали.
  partly: >
    Часть доказательств фактические, часть — суждение. Машина закрывает свою часть и сужает
    мнение до остатка; заменить его целиком нельзя.
  human_by_nature: >
    Существо гейта — суждение о качестве. Машинной остаётся форма: заключение есть, привязано к
    ревизии, называет причины. Объявить такой гейт машинным значило бы поставить код возврата под
    вопрос, на который код не отвечает.

gates:

  # ─── уже переведён этим срезом ───────────────────────────────────────────────────────────────
  documentation_updated:
    verdict: mechanizable
    status: done
    reason: >
      Оба доказательства — факты о дифе: документация в изменении затронута (либо её отсутствие
      объявлено явно), и запись для CHANGELOG в ветке добавлена. Ни одно из двух не требует
      мнения: они либо есть в дереве, либо их нет.
    machine_evidence: [docs_updated_or_explicit_none, release_notes_entry]
    judge_evidence: []
    needs: >
      Ничего: механика уже была в репозитории по частям (диф от базы и правило фрагментов
      `newsfragments/`). Переведён в `validator: validate-documentation-updated`
      (`ai_ops_kit/gates/documentation_evidence.py`), доказано прогоном.

  # ─── mechanizable: доказательства фактические, не хватает проверки и названного условия ──────
  release_safety:
    verdict: mechanizable
    reason: >
      Все три доказательства формулируются как «объявлено или отсутствие объяснено»: флаг,
      стратегия отката, план раскатки. Это наличие записи, а не её качество.
    machine_evidence: [feature_flag_or_justified_absence, rollback_strategy, rollout_plan]
    judge_evidence: []
    needs: >
      Половина уже есть: `engops/deploy_readiness` считает `rollback_declared` детерминированно.
      Не хватает объявленного места, где дочка держит флаги и план раскатки, — без него проверка
      сказала бы `unknown`, а не «нет».
    limit: >
      Машина проверит, что стратегия отката ЗАПИСАНА, но не что она сработает. Это разные
      утверждения, и второе останется за прогоном отката, а не за гейтом.

  observability_readiness:
    verdict: mechanizable
    reason: >
      Логи, метрики, алерты и SLO объявляются конфигурацией. «Объявлено» — факт файла.
    machine_evidence: [logging_defined, metrics_defined, alerts_defined, slo_defined]
    judge_evidence: []
    needs: >
      Место объявления в дочке (конфиг наблюдаемости) и его схема. Сегодня кит не знает, где
      смотреть, и потому спрашивает роль.
    limit: >
      «SLO объявлен» != «SLO осмысленный». Второе — суждение, и оно останется у человека.

  analytics_runtime_verification:
    verdict: mechanizable
    reason: >
      Все четыре доказательства — факты о живой системе: события пришли, ПДн в них нет, когорта
      определяется, дашборд получает данные. Каждое проверяется запросом, а не мнением.
    machine_evidence: [events_verified_live, no_pii_in_events, cohort_identification_works,
                       dashboard_receives_data]
    judge_evidence: []
    needs: >
      Доступ к аналитическому бэкенду дочки (ключ, endpoint) и объявленный tracking plan как
      ожидаемое множество событий. Без доступа честный ответ — `unknown`, а не «проверено».

  visual_regression:
    verdict: mechanizable
    reason: >
      Снимки есть, экраны сравнены, непреднамеренных различий нет или они одобрены поимённо — три
      факта прогона. Это классическая машинная проверка, а не суждение.
    machine_evidence: [baseline_snapshots, screens_diffed, unintended_diffs_none_or_approved]
    judge_evidence: []
    needs: >
      Инструмент снимков в стеке дочки и место для baseline. Кит уже умеет определять стек
      (`shared/stack_detect`), но снимки без инструмента не появятся.

  evidence:
    verdict: mechanizable
    reason: >
      «У каждого существенного вывода есть источник» и «статус возможности назван» — ровно то, что
      кит уже делает для собственной документации: `validate_references` резолвит ссылки,
      `validate_claims` сверяет утверждения с кодом.
    machine_evidence: [source_per_claim, capability_status]
    judge_evidence: []
    needs: >
      Разметка утверждений в исследовательском артефакте (как в `knowledge/claims.yaml` у кита).
      Без разметки машина не знает, что считать «выводом».
    limit: >
      Машина проверит, что источник ЕСТЬ и резолвится, но не что он подтверждает вывод. Последнее
      — судейское, и гейт после перевода станет `partly`, а не полностью машинным.

  design_system_usage:
    verdict: mechanizable
    reason: >
      «Компоненты взяты из дизайн-системы» — статический анализ импортов; «новые компоненты
      обоснованы» — наличие записи с причиной. Оба факта.
    machine_evidence: [components_from_design_system, new_components_justified]
    judge_evidence: []
    needs: >
      Реестр компонентов дизайн-системы дочки. Без него множество «своих» компонентов не
      определено, и проверка сравнивала бы с пустотой.
    limit: >
      Наличие обоснования — факт; достаточность обоснования — суждение.

  analytics_design_readiness:
    verdict: mechanizable
    reason: >
      Tracking plan, схема событий, продуктовые метрики и спецификация дашборда — артефакты.
      Их наличие и структурная валидность проверяются схемой.
    machine_evidence: [tracking_plan, event_schema, product_metrics, dashboard_spec]
    judge_evidence: []
    needs: >
      Схемы этих четырёх артефактов в `schemas/` и объявленное место, где дочка их держит. Без
      места проверка искала бы вслепую и говорила «нет» там, где «не знаю».
    limit: >
      Проверяется, что план ЕСТЬ и он валиден по схеме, а не что он измеряет правильное. Второе —
      продуктовое суждение.

  # ─── partly: машина закрывает часть и сужает мнение до остатка ───────────────────────────────
  security:
    verdict: partly
    reason: >
      Два доказательства из трёх фактические и частично уже машинные: секретов нет (сканер),
      зависимости одобрены (аллоулист). Поверхность инъекций — статический анализ плюс суждение о
      том, что считать поверхностью.
    machine_evidence: [no_secrets, deps_approved]
    judge_evidence: [no_injection_surface]
    needs: >
      Аллоулист зависимостей дочки и подключённый SAST. Сканер секретов уже есть
      (`security/security_pack`).
    why_it_matters: >
      Самый дорогой «partly» из девятнадцати. Замер поля 19.08 (BNBM): гейт поднялся на QUICK по
      совпадению содержимого, без единой находки, и закрыть его было НЕЧЕМ — судья на этом уровне
      не поднимается. Машинная часть закрыла бы ровно такие случаи, оставив судью там, где есть
      находки. Развилка заведена работой `security-gate-closable-on-quick`.

  accessibility_review:
    verdict: partly
    reason: >
      Контраст AA и метки для скринридера проверяются инструментом полностью; клавиатурная
      доступность и видимый фокус — в значительной части; «состояние не передаётся одним цветом»
      требует понимания смысла состояния.
    machine_evidence: [contrast_aa, screen_reader_labels, focus_visible]
    judge_evidence: [keyboard_operable, no_color_only_state]
    needs: >
      Автоматический аудит доступности в стеке дочки (axe-подобный) и объявленные точки входа в
      интерфейс, по которым его гонять.
    limit: >
      Инструмент ловит нарушения правил, но не ловит недоступный интерфейс, формально правилам
      соответствующий. Гейт останется `partly` и после перевода машинной части.

  ux_review:
    verdict: partly
    reason: >
      «Матрица устройств объявлена» и «адаптивность проверена» — факты. Поток, состояния экранов и
      тексты — суждение о том, понятно ли человеку.
    machine_evidence: [device_matrix_defined, responsive_checked]
    judge_evidence: [ux_flow, screen_states, copy_reviewed]
    needs: >
      Объявленная матрица устройств в конфигурации дочки и прогон адаптивности по ней. Остальные
      три доказательства машине не отдаются: их проверяет человек или судья.

  discovery_completeness:
    verdict: partly
    reason: >
      Наличие постановки проблемы, аудитории, гипотез и метрик успеха — структурная проверка
      артефакта. Содержательность каждого раздела — суждение продуктового ревьюера.
    machine_evidence: [problem_statement, target_users, hypotheses, success_metrics]
    judge_evidence: []
    needs: >
      Схема discovery-артефакта в `schemas/` — какие разделы обязательны и что считать
      заполненным. Без неё «раздел есть» неотличимо от «раздел назван».
    limit: >
      Именно здесь машинная проверка опаснее всего: раздел с текстом «TBD» пройдёт структурную
      проверку. Перевод без проверки содержательности заменил бы мнение на видимость проверки —
      это ухудшение, а не улучшение, и потому гейт назван `partly`, а не `mechanizable`.

  ai_eval:
    verdict: partly
    reason: >
      Датасет и результаты офлайн-прогона — артефакты; «критерии успеха достигнуты» — сравнение
      чисел с объявленным порогом, тоже факт. Достаточность самого набора кейсов — суждение.
    machine_evidence: [eval_dataset, offline_results, regression_checked]
    judge_evidence: [success_criteria, guardrails]
    needs: >
      Объявленные пороги и eval-раннер. У кита такая механика уже построена дважды: eval-кейсы
      агентов (`evaluations/agents/`) и корпус gate-евалов (`evaluations/gates/`) — переносить
      придётся не идею, а привязку к артефактам дочки.
    why_it_matters: >
      Замер 20.08 (тот же срез): прозаическое «Recommendation: pass» от судьи закрывает ВСЕ пять
      доказательств этого гейта, включая существование датасета, которого судья не видел. Пока
      доказательства не машинные, слово судьи их фабрикует — закреплено
      `tests/unit/test_judge_word_becomes_evidence.py`.

  ai_red_team:
    verdict: partly
    reason: >
      «Сценарии атак прогнаны», «утечка ПДн проверена» — факты прогона. Устойчивость к инъекциям и
      закрытость блокеров зависят от того, достаточен ли набор сценариев, — это суждение.
    machine_evidence: [attack_scenarios_run, pii_leak_checked]
    judge_evidence: [injection_resistance, blockers_closed]
    needs: >
      Набор сценариев атак как версионируемый артефакт и раннер, дающий машиночитаемый результат
      прогона. Достаточность набора остаётся судейской и после этого.

  documentation_drift:
    verdict: partly
    reason: >
      Дрейф ссылок и чисел кит уже ловит машиной у себя (`validate_references`, `validate_claims`,
      `validate_freshness`). Дрейф СМЫСЛА — «документ описывает не то, что делает код» — остаётся
      суждением.
    machine_evidence: []
    judge_evidence: []
    needs: >
      Перенос трёх существующих проверок на документы дочки. Сегодня гейт закрывает сама
      стадия-писатель — слабейшая форма из четырёх.
    why_it_matters: >
      После перевода `documentation_updated` это ЕДИНСТВЕННЫЙ гейт, закрывающий сам себя. Список
      самозаявляющихся гейтов — ратчет, и он ходит вниз.

  # ─── human_by_nature: машинной остаётся только форма ─────────────────────────────────────────
  code_review:
    verdict: human_by_nature
    reason: >
      Существо гейта — независимое суждение о коде: корректность, обработка отказов, уместность
      абстракций. Машина уже проверяет ФОРМУ (заключение привязано к ревизии, блокеры названы) и
      с v3.37 обеспечивает её механизмом провайдера, но вопрос «хорош ли этот код» коду возврата
      не задаётся.
    machine_evidence: [reviewed_revision]
    judge_evidence: [blockers_closed]
    needs: >
      Ничего: линтеры, типы и тесты — это ДРУГИЕ гейты, и они машинные. Этот гейт существует
      именно ради того, чего они не ловят.

  architecture_review:
    verdict: human_by_nature
    reason: >
      Границы модулей, совместимость API и режимы отказа частично проверяются
      (`validate_layering`, `packages/layering.yaml` — и это отдельные машинные проверки).
      Уместность архитектурного решения для задачи — суждение.
    machine_evidence: [reviewed_revision]
    judge_evidence: [architecture_boundaries_ok]
    needs: >
      Ничего сверх уже имеющегося. Машинная часть живёт отдельным контуром (слои, циклы, ратчет),
      а этот гейт — про решение, а не про его следы в графе импортов.

  decision_quality:
    verdict: human_by_nature
    reason: >
      «Рекомендация человеку дана», «обратимость классифицирована» — факты формы, и они уже почти
      машинные. Но гейт называется качеством решения, и качество решения кодом возврата не
      измеряется.
    machine_evidence: [human_recommendation, reversibility_classified]
    judge_evidence: [principles_checked]
    needs: >
      Ничего. Перевод формы в машину возможен и БЕСПОЛЕЗЕН без сути: «рекомендация есть» —
      проверка присутствия текста, а не его качества.

  stakeholder_readiness:
    verdict: human_by_nature
    reason: >
      Единственный из девятнадцати, у которого нет объявленных доказательств вовсе, — и это не
      упущение. Готовность стейкхолдеров это состояние людей, а не репозитория.
    machine_evidence: []
    judge_evidence: []
    needs: >
      Ничего машинного. Осмысленное улучшение здесь — не проверка, а named owner: гейт должен
      называть, ЧЬЯ это готовность.
