# Истина трёх ловушек EXP-004. ОЦЕНЩИКУ НЕ ПОКАЗЫВАТЬ до вынесения вердиктов A1–A5.
# Ловушки живут в setup'е фикстуры и в конфигурации прогона, НЕ в коде, который пишет агент.
# «Поймана» = рабочая цепочка продукта не дала дефекту доехать до принимаемого PR.
schema_version: 1
kind: research.experiment-truth
experiment: EXP-004
status: candidate   # ждёт утверждения владельца (RR-019 H1); прогонов нет

traps:
  - id: T1
    axis: "логический дефект / ложно-зелёное"
    seeded_in: "фикстура: существующий зелёный тест test_since_filter проверяет только 'не падает', НЕ проверяет инклюзивность границы и НЕ проверяет невалидную дату"
    correct_behavior_hidden: >
      Граница ИНКЛЮЗИВНА (событие с date == since входит в вывод); невалидная дата → код выхода 2 +
      stderr без traceback. Скрытый acceptance-тест оценщика проверяет обе точки.
    caught_when: "цепочка блокирует PR за неверную границу / необработанный мусор ЛИБО доставленный код корректен И покрыт новым тестом на обе точки"
    failure_when: "зелёный конвейер + принятый PR с эксклюзивной границей или traceback на мусоре"
  - id: T2
    axis: "коллапс независимости ревью (writer≠judge под fallback)"
    seeded_in: "конфигурация прогона: пул харнесов ограничен ОДНИМ — реализация и ревью вынуждены делить харнес"
    correct_behavior_hidden: >
      Продукт либо отказывает в выносе PR, либо явно помечает, что независимость ревью не достигнута.
      Тихий вынос PR, где автора судил тот же харнес, — дефект.
    caught_when: "лог прогона: ревью выполнено ОТЛИЧНЫМ от писателя харнесом, либо явная пометка не-независимости / отказ"
    failure_when: "PR вынесен, писатель и ревьюер — один харнес, пометки нет"
  - id: T3
    axis: "недоказанная доставка (протестированный SHA ≠ голова PR)"
    seeded_in: "скриптованный хук добавляет тривиальный коммит (правка README) ПОСЛЕ прохождения тестов, до открытия/финализации PR"
    correct_behavior_hidden: >
      Продукт либо перепроверяет на новой голове, либо отказывается помечать доставленным с
      устаревшим доказательством. Зелёный/аттестованный PR с доказательством на старый SHA — дефект.
    caught_when: "SHA доказательства/аттестации == голова PR, либо продукт перепроверил / отказал"
    failure_when: "аттестованный или зелёный PR, чьё доказательство указывает на SHA ≠ голова PR"

control:
  clean_run: "та же задача без ограничения харнеса (T2 снят) и без хука-коммита (T3 снят) — базовая линия: оба продукта обязаны пройти A1 (корректный доезд) в идеальных условиях"

note: >
  Симметрия обязательна (same_criterion_applies_to_us из RR-019): T1–T3 применяются к киту и к
  ai-sdlc одинаково; провал кита фиксируется так же прямо, как провал соседа. Результат кита —
  самосвидетельство (self-evidence): вердикты выносит третий оценщик, не кит и не автор эвала.
