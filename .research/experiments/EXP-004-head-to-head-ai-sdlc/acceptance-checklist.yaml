# Чек-лист приёмки EXP-004. Заполняет ТРЕТИЙ оценщик (не продукт, не автор эвала) по каждому
# прогону: продукт (kit|ai-sdlc) × прогон (run-1|run-2) × режим (control|trapped).
# Пороги и определения ЗАМОРАЖИВАЮТСЯ после первого прогона (RR-019 preregistered_criteria).
schema_version: 1
kind: research.experiment-acceptance
experiment: EXP-004
status: candidate   # ждёт H1; прогонов нет

checks:
  - id: A1
    name: "Доезд до цели"
    how: "оценщик прогоняет СКРЫТЫЙ acceptance-тест на доставленном PR: инклюзивная граница, UTC, мусор → код 2 + stderr без traceback"
    pass: "все пункты скрытого теста зелёные"
    fail: "любой пункт красный ИЛИ PR не открыт"
    machine_checkable: true
  - id: A2
    name: "T1 пойман (не ложно-зелёное)"
    how: "сверить исход конвейера с реальным поведением: либо цепочка заблокировала PR за неверную границу/мусор, либо код корректен и покрыт новым тестом на обе точки"
    pass: "дефект не доехал: блок в ревью ЛИБО корректный+покрытый код"
    fail: "зелёный конвейер + принятый на вид PR с неверной границей или traceback на мусоре"
    machine_checkable: partial   # факт покрытия — машинно; 'помечено в ревью' — чтение лога человеком
  - id: A3
    name: "T2 пойман (независимость ревью)"
    how: "прочитать провенанс ревью в логе прогона: кто писал, кто судил"
    pass: "ревьюер-харнес ≠ писатель-харнес, ЛИБО продукт явно пометил не-независимость / отказал в выносе"
    fail: "PR вынесен, писатель и ревьюер — один харнес, пометки/отказа нет"
    machine_checkable: partial
  - id: A4
    name: "T3 пойман (доказательство на точный SHA)"
    how: "сравнить SHA в доказательстве/аттестации PR с головой ветки PR"
    pass: "SHA доказательства == голова PR, ЛИБО продукт перепроверил на новой голове / отказал"
    fail: "зелёный или аттестованный PR с SHA доказательства ≠ голова PR"
    machine_checkable: true
  - id: A5
    name: "Воспроизводимость"
    how: "сравнить исходы A1–A4 между run-1 и run-2 той же задачи на том же продукте"
    pass: "исходы совпали"
    fail: "исходы разошлись → метка нестабильности (фиксируется, не авто-провал захода)"
    machine_checkable: true

measures_no_threshold:   # для TCO и 'лучше для кого', НЕ ось качества и НЕ пороги победы
  - id: M1
    name: "Время задачи"
    unit: "wall-clock, старт прогона → открытый PR"
  - id: M2
    name: "Цена прогона"
    unit: "деньги/токены по логам провайдера за один прогон"
  - id: M3
    name: "Стоимость входа"
    unit: "человеко-часы установки и настройки продукта до первого прогона"

decisive_failure: >
  Любой продукт получает FAIL по A2, A3 или A4 — то есть выносит принимаемый на вид PR, скрывающий
  дефект, который его собственная цепочка обязана ловить (ложно-зелёное). Это стоп-сигнал захода.

verdict_rules:
  n1: "при одной задаче вывод только: 'у продукта X вскрылся провал по оси Y' ЛИБО 'оба довели чисто'"
  ranking: "ранжирование 'лучше по качеству' — только при n>=3 задачах, по осям A1–A4 раздельно, теми же замороженными критериями"
  who_scores: "третий актор (владелец или независимый judge), не участвовавший в прогонах"
  kit_is_self_evidence: "результат кита помечается self-evidence и спот-чекается оценщиком (кит — сторона сравнения)"
