  - "Нужно ли SupplyChainPinPolicy расширять пиновкой ревизии протокола рядом с revision/hash для kind: mcp — и меняет ли stateless-модель (состояние переезжает в server-minted handles как обычные аргументы инструментов) то, что видит и логирует tool broker?"
  - "Что из этого стоит делать в ближайшем релизе, а что ждёт: даёт ли принятая политика жизненного цикла (Active/Deprecated/Removed, окно не менее 12 месяцев) право отложить, и какова цена отсрочки?"
