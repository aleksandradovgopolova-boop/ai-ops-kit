#   H1. Владелец утверждает ЗАДАЧУ (одна, в зоне пересечения) и чек-лист приёмки — до заморозки.
#   H2. Установка ai-sdlc: TypeScript-монорепо, автономный оркестратор за флагом
#       AI_SDLC_AUTONOMOUS_ORCHESTRATOR=experimental; нужны ревьюер-харнесы (Claude × Codex × …) и
#       ключи провайдера. Замерить стоимость входа (вопрос 6) при этом.
#   H3. Бюджет на живые прогоны обоих продуктов (деньги/токены за 2 прогона × 2 продукта × n задач).
#   H4. Третий оценщик исхода (владелец или независимый judge), не участвующий в прогонах.
#   H5. Целевой репозиторий-фикстура: один и тот же для обоих, с 3 предрегистрированными дефектами.
# Пока H1–H5 не закрыты — эксперимент EXP-004 не заводится; это НЕ провал и НЕ подтверждение,
