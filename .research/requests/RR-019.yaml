# Очная проверка: кит против ai-sdlc на ОДНОЙ реальной задаче, замером, а не мнением.
#
# Повод: RR-017/DP-116 установили, что ai-sdlc воспроизводит цепочку кита по коду и местами шире,
# но «кто лучше» тем прогоном НЕ установлен и не мог быть — мерили ширину (что есть), не глубину
# (как работает), и ни разу не гоняли оба продукта на одной задаче. Этот RR превращает вопрос
# «кто лучше» из вкуса в замер. Саша дала явный сигнал на реальную проверку (снимает ограничение
# [[feedback-synthetic-sufficient-for-center]] в этой точке: очная проверка — «реальная потребность»,
# о которой договаривались).
#
# ГЛАВНЫЙ ПРИНЦИП ЧЕСТНОСТИ — ПРЕДРЕГИСТРАЦИЯ. Критерии, задача, пороги и определение провала
# фиксируются В ЭТОМ ФАЙЛЕ до первого прогона. После прогонов их менять нельзя — только признать
# результат. Иначе «кто лучше» снова станет мнением, подогнанным под исход.
#
# ЧЕСТНОСТЬ СРАВНЕНИЯ (иначе замер недействителен):
#   1. Задача — в ЗОНЕ ПЕРЕСЕЧЕНИЯ contract->shipped: одна хорошо специфицированная инженерная
#      задача, которую оба продукта обязаны провести детерминированно через свою цепочку
#      (гейты + независимое ревью + доказательство на коммит + доставка PR). НЕ брать задачу, где
#      один продукт структурно не играет (напр. «управляй 50 чужими репозиториями» — это наша
#      модель, не их; «встрой каркас в свой монорепо на 3 языках» — их, не наша).
#   2. Субстрат и харнес держатся КОНСТАНТНЫМИ: один и тот же целевой репозиторий-фикстура, один и
#      тот же исполняющий агент-писатель и те же ревьюер-харнесы для обоих, тот же провайдер и лимит.
#      Меняется только продукт-оркестратор (кит vs ai-sdlc). Всё остальное — не переменная.
#   3. Оценивает исход ТРЕТИЙ актор (человек-владелец либо независимый judge), не участвовавший в
#      прогонах и не являющийся ни одним из продуктов — writer≠judge применяется к самому эвалу.
#   4. Малый n даёт СТОП-СИГНАЛ, не доказательство превосходства. Формула «X лучше, потому что
#      прошёл 1 задачу» запрещена (writer-preflight п.8/16). n задач фиксируется ниже; при n=1
#      вывод может быть только «у одного продукта вскрылся решающий провал» либо «оба довели» —
#      ранжирование «лучше по качеству» требует заранее объявленного n>=3 и разбиения по осям.
schema_version: 1
kind: research.request
id: RR-019
title: "Очная проверка кит против ai-sdlc: одна задача, оба продукта вживую, предрегистрированные критерии"
requested_by:
  system: human
  layer: product
decision_to_support:
  description: >
    Решить замером, а не впечатлением: (а) вскрывается ли у одного из продуктов РЕШАЮЩИЙ провал на
    реальной задаче в зоне пересечения (ложно-зелёное, недоезд изменения до цели, коллапс
    независимости ревью, недоказанная доставка); (б) как — по измеренным осям, не по вкусу — кит и
    ai-sdlc соотносятся по способности провести хорошо специфицированную задачу через цепочку до
    принятого человеком PR; (в) какие из «подсмотреть идеей» механизмов DP-116 подтверждаются
    прогоном как реально полезные киту. Итог кормит позиционирование (перестали ли мы говорить
    «лучше» голословно) и приоритет заимствований.
  decision_maker: human
questions:
  # Каждый вопрос ФАЛЬСИФИЦИРУЕМ: назван измеритель и порог/определение провала.
  - "Доезд до цели: доводит ли продукт задачу до PR, который ТРЕТИЙ оценщик принимает как решающий поставленную задачу? Измеритель: принято/не принято оценщиком по чек-листу приёмки, зафиксированному до прогона. Провал: продукт объявил готово (зелёный конвейер), а оценщик задачу не принял (ложно-зелёное)."
  - "Ловит ли цепочка подсаженный дефект? Измеритель: в спецификацию задачи заранее вшиты 3 контролируемых дефекта (1 логический, 1 нарушение независимости ревью, 1 недоказанная доставка); считаем, сколько поймал каждый продукт до PR. Провал: дефект прошёл до принятого PR."
  - "Независимость ревью под нагрузкой: сохраняется ли writer≠judge, когда доступен только один харнес (сценарий fallback)? Измеритель: прогон с намеренно ограниченным пулом харнесов; наблюдаем, коллапсирует ли ревью на исполнителя. Провал: продукт вынес PR, где автора судил тот же харнес, и не пометил это."
  - "Цена прогона: сколько стоит одна задача — время (wall-clock от старта до PR) и деньги/токены? Измеритель: логи провайдера + часы. Порога «победы» здесь нет — это факт для TCO, не ось качества; фиксируется, чтобы «лучше» не куплено скрытой ценой."
  - "Воспроизводимость: даёт ли повтор той же задачи тот же исход (принят/дефекты пойманы), или результат случаен? Измеритель: 2 прогона одной задачи на продукт; расхождение исхода = метка нестабильности."
  - "Стоимость входа: сколько стоит поставить и завести каждый продукт до первого прогона (человеко-часы, предпосылки)? Измеритель: замер при setup. Это часть ответа «кто лучше ДЛЯ КОГО», не побочность."
constraints:
  - evidence_over_reputation
  - one_source_one_evidence
  - negative_claims_qualified
  - self_evidence_flagged          # кит — одна из сторон; его результат = самосвидетельство, спот-чек оценщиком
  - same_criterion_applies_to_us   # чем меряем ai-sdlc, тем же меряем кит; провал кита фиксируется так же честно
  # Собственные ограничения этого замера:
  - preregistered_criteria_frozen_before_runs   # критерии/пороги/задача заморожены до первого прогона
  - task_in_overlap_zone_only                   # задача — в пересечении contract->shipped, не в модельной зоне одного продукта
  - harness_and_substrate_held_constant         # переменная одна: продукт-оркестратор
  - outcome_scored_by_third_actor               # исход оценивает не продукт и не writer эвала
  - small_n_is_stop_signal_not_proof            # n<3 → только «вскрылся провал», не «лучше по качеству»
workflow_hint: deep
memory_check:
  performed: true
  related_requests: [RR-017, RR-008, RR-013, RR-014]
  related_decisions: [DP-116, DP-107, DP-109]
  summary: >
    RR-017/DP-116 (reviewed): ai-sdlc воспроизводит цепочку кита исполняемым кодом (EV-1162), с
    writer≠judge в коде (EV-1163, independence.ts, fallback-aware) и реализованной аттестацией
    (EV-1164); шире по spec/SDK/conformance/комплаенсу (EV-1168); EV-1170 суперсидит EV-673. Judge
    round 1 поймал завышение уникальности кита (EV-1171, RFC-0035 — реализованный движок решений
    соседа). Остаток дифференциации кита узок и на среднем доказательстве (EV-1169). Именно поэтому
    «кто лучше» нельзя закрывать самооценкой — нужен замер с третьим оценщиком. Прошлые EXP-001..003
    дают форму: эксперимент живёт каталогом .research/experiments/ (README + конфиг + данные), RR
    его лишь заказывает. Ограничение синтетики ([[feedback-synthetic-sufficient-for-center]]) здесь
    снято явным сигналом владельца на реальную проверку.
required_confidence: medium
deadline: "2026-11-15"
status: planned
created_at: "2026-09-02"
