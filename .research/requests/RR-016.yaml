schema_version: 1
kind: research.request
id: RR-016
title: "Модель продуктовой разработки как ядро AI Ops: какие сущности канонические, какие связи обязательны, что наследует дочка"
requested_by:
  system: human
  layer: product
created_at: "2026-08-19"
decision_to_support:
  description: >-
    Зафиксировать ли «репозиторий — источник истины продукта, AI Ops — операционная система
    разработки» как фундаментальный принцип кита с машиночитаемой моделью сущностей
    (Research / Decision / Feature / Experiment / Eval / Release / Observation), и если да —
    в каком объёме: какие сущности входят в канон, какие связи между ними обязательны,
    что кит навязывает дочернему проекту, а что дочка вправе переопределить.
  decision_maker: "владелец продукта"
questions:
  - "Что из предложенной модели уже реализовано в ките, а что отсутствует?"
  - "Чего не хватает в первую очередь — словаря сущностей или связей между уже существующими?"
  - "Существует ли внешний стандарт словаря сущностей жизненного цикла, который дешевле принять, чем изобрести?"
  - "Что происходит с сущностью, у которой нет потребителя в коде — есть ли измеримый прецедент?"
  - "Как канон наследуется дочкой и где проходит граница её права спорить с китом?"
  - "Где место словаря типов коммитов: корень модели, производная или уже решённый вопрос?"
constraints:
  - "additive_only: не ломать действующие реестры, схемы и гейты"
  - "no_second_source_of_truth: не создавать вторую структуру описания рядом с product-operating-model"
  - "research_isolation_preserved: не нарушать пять правил изоляции research-контура"
  - "child_can_disagree: любое навязанное правило должно иметь способ отказа на стороне дочки"
workflow_hint: deep
memory_check:
  performed: true
  related_requests: [RR-003, RR-008, RR-013, RR-014]
  related_decisions: [DP-108, DP-113, DP-114]
  summary: >-
    Память проверена до поиска. RR-008/DP-108 закрыли стратегию «control plane + тонкие адаптеры»
    (FL-001, ADR-001). EV-660 («связной цепочки у соседей не обнаружено») суперсидировано EV-673
    после находки multi-agents-control-plane: цепочка воспроизведена соседом, дифференциация
    сместилась к полноте реализации. EV-673 свеж до 2026-11-05 — конкурентный охват заново не
    собирался, повторная разведка соседей в этот прогон НЕ входит. Новое здесь — не «кто ещё
    делает похожее», а «какова собственная модель сущностей и её разрывы».
