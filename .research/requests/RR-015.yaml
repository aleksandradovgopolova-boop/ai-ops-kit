# Заявка владельца 17.08.2026: чем ускорить и улучшить разработку САМОГО кита.
#
# Отличие от RR-008/RR-013/RR-014. Те три смотрели на соседей по ЖАНРУ — воспроизводит ли кто-то
# цепочку кита. Этот запрос смотрит внутрь: сначала измеряется история разработки этого
# репозитория, и только под НАЗВАННЫЕ числами ищется внешний инструмент. Порядок обратный обычному
# обзору технологий, и он выбран намеренно — по принципу dp-004 (сокращать расстояние от намерения
# до проверенного результата, а не проходить стадии).
schema_version: 1
kind: research.request
id: RR-015
title: "Чем ускорить разработку самого кита: инструменты под измеренные узкие места, а не под жанр"
requested_by:
  system: human
  layer: product
decision_to_support:
  description: >
    Решить, какие внешние инструменты, механизмы и практики взять в разработку самого кита,
    какие подсмотреть идеей без зависимости, а какие отвергнуть навсегда — так, чтобы каждый
    выбор отвечал на измеренную боль ИСТОРИИ ЭТОГО репозитория, а не на «так принято».
    Отдельная часть решения: что из предлагаемого у кита УЖЕ ЕСТЬ под другим именем —
    дублирование сущности дороже отсутствия инструмента.
  decision_maker: human
questions:
  - "Где на самом деле уходит время: измерить по git-истории, плану, истории плана, отчётам живых прогонов и истории CI — темпы, доля исправлений своих же правок, повторные правки одного места, цена выпуска."
  - "Какие классы дефектов повторяются и сколько раз каждый: (а) исправление не доезжает до установленной копии; (б) механизм объявлен и не исполняется; (в) тест зелёный, но ничего не сторожит; (г) локально красное ≠ красное в CI; (д) реестр зовёт сделанное активным; (е) работа обрывается на лимите сессии без следа."
  - "Что ловит CI, а что впервые находится в поле на живом прогоне у чужого репозитория — в числах прогонов и находок, не в ощущении."
  - "Мутационная проверка как механизм, а не рукописный реестр: закрывает ли внешний движок (mutmut, cosmic-ray) то, чего не закрывают 25 рукописных проб, и какой ценой прогона."
  - "Доставка в чужой репозиторий: даёт ли шаблонизатор с обновлением (copier, cruft) или пакетная установка (pipx, uv tool) механизм, которого нет у копирования дерева installer'ом."
  - "Контракты и схемы против 76 рукописных валидаторов: сколько из них заменяемо схемой, что при этом теряется, и есть ли готовый исполнитель схем в pre-commit."
  - "Воспроизводимость окружения: существует ли официально описанный способ гарантировать, что подпроцесс pytest видит рабочее дерево, а не editable-установку из другого каталога."
  - "Выпуск и changelog как механизм: что требует от истории коммитов release-please / towncrier / semantic-release и есть ли у них ПРОВЕРКА, а не только генерация."
  - "Надёжное исполнение долгих процессов: что durable-движок (Temporal, DBOS, Restate) даёт СВЕРХ файлового журнала кита (RunHandoff / LifecycleStore / durable_write_json), и стоит ли это внешнего сервера."
  - "Эвалы агентных прогонов и наблюдаемость: есть ли локальный, конфигом-в-репозитории инструмент, оценивающий прогон CLI-агента, и минимальная конфигурация трасс в файл без бэкенда."
constraints:
  - evidence_over_reputation
  - one_source_one_evidence
  - negative_claims_qualified
  - self_evidence_flagged
  - same_criterion_applies_to_us
  # Собственное ограничение этого запроса: инструмент, который стал бы RUNTIME-зависимостью кита,
  # оценивается по другой шкале, чем инструмент разработчика. Правило AGENTS.md:39 —
  # «Никаких новых зависимостей без явного решения: Python-инструменты работают на stdlib + pyyaml».
  # Кит копируется в чужие репозитории; runtime-зависимость едет туда вместе с ним.
  - runtime_dependency_costs_more_than_dev_dependency
workflow_hint: comparison
memory_check:
  performed: true
  related_requests: [RR-008, RR-013, RR-014]
  related_decisions: [DP-105, DP-107, DP-109]
  summary: >
    RR-008/RR-013/RR-014 закрыты и отвечали на ДРУГОЙ вопрос — воспроизводит ли сосед по жанру
    цепочку кита (EV-660 суперсижен EV-673). Инструментов разработки они не касались: ни одна
    запись не про мутационные движки, шаблонизаторы с обновлением, исполнители схем или
    durable-движки. DP-105 (formats-first: форматы держать независимыми от инструмента) и
    dp-001 (внешний материал берём курируемо, дубли построенного отклоняем) — прямые
    ограничения на ответ этого запроса, а не фон.
required_confidence: medium
