# Прямой запрос владельца 22.09.2026: провести через research-контур репозиторий
# unreallabsai/unreal-agent — «исследуй в контексте опсика и ии-среды».
#
# Отличие от линии соседей по жанру (RR-008 -> RR-013 -> RR-014 -> RR-017): это НЕ сосед. Сосед
# по жанру — тот, кто воспроизводит цепочку кита (гейты + независимое ревью + evidence на SHA +
# доставка). unreal-agent живёт СЛОЕМ НИЖЕ: он исполняет агента, а не управляет продуктовым
# циклом. Поэтому вопрос ставится не «кто шире», а «годится ли он киту как ИСПОЛНИТЕЛЬ-писатель»
# — и отдельно проверяется, что вывод EV-673 (позиционирование кита) он не трогает, потому что
# играет на другой оси, а не потому, что слабее.
schema_version: 1
kind: research.request
id: RR-020
title: "unreal-agent как сменный писатель кита: снимает ли он стоящую границу «параллельные писатели»"
requested_by:
  system: human
  layer: technology
decision_to_support:
  description: >
    Решить, что делать с unreallabsai/unreal-agent: (а) брать ли его кандидатом в исполнители-
    писатели рядом с claude-cli, и если да — какой первый шаг; (б) меняет ли он позиционирование
    кита (EV-673) или лежит на другой оси; (в) даёт ли он что-то ии-среде как продукту, или выгода
    доходит до неё только косвенно, через скорость кита. Решение должно опираться на evidence о
    ДВУХ сторонах — и о нём, и о нашей действующей границе, — а не на то, что он выглядит удобно.
  decision_maker: human
questions:
  - "Что unreal-agent делает ПО КОДУ, а не по README: какова архитектура исполнения и чем «async-first» отличается от обычной агентской петли?"
  - "Снимает ли он стоящую границу «параллельные писатели», зафиксированную замером 18.09 (локальный `claude -p` сериализуется машинным замком), — и какой ценой?"
  - "Совместим ли он с нашим контрактом писателя (кит владеет worktree/diff/гейтами/доставкой, писатель только пишет) и с нашим форматом скиллов?"
  - "Чего он НЕ даёт: есть ли в нём хоть что-то из судящей стороны (гейты, evidence, независимое ревью, доставка) — и не растёт ли от более дешёвого писателя риск ложно-зелёного?"
  - "Какие риски принятия: зрелость, управляемость (принимают ли патчи), провайдеры, требования среды?"
  - "Что это даёт ии-среде как продукту (Node/TS + БД + свой CI) — прямо, косвенно или ничего?"
constraints:
  - evidence_over_reputation
  - one_source_one_evidence
  - negative_claims_qualified
  - same_criterion_applies_to_us
  - no_live_run_claimed_without_measurement
workflow_hint: quick
