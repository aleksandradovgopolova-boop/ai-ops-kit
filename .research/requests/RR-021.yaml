# Прямой запрос владельца 22.09.2026 следом за RR-020: разобрать usestrix/strix «для проверки
# безопасности в дочках».
#
# Почему это отдельный RR, а не часть RR-020: там решался вопрос об ИСПОЛНИТЕЛЕ (кто пишет код),
# здесь — о ПРОВЕРКЕ (чем доказывается безопасность продукта дочки). Разные решения, разные
# владельцы риска, разная цена ошибки: ошибка в выборе писателя стоит времени, ошибка в контуре
# безопасности стоит доверия к вердикту кита.
#
# Главная ловушка, которую этот прогон обязан не пропустить: инструмент недетерминирован по
# природе (агент-пентестер), а гейты кита детерминированы. Соблазн «включить как гейт» ведёт к
# гейту, который краснеет через раз; соблазн «раз не гейт — то advisory-шум» теряет единственную
# настоящую ценность инструмента — рабочий PoC. Ответ обязан развести эти два режима по коду, а не
# по намерению.
schema_version: 1
kind: research.request
id: RR-021
title: "Strix как контур проверки безопасности в дочках: чем он может закрывать наш security-гейт, а чем не может"
requested_by:
  system: human
  layer: technology
decision_to_support:
  description: >
    Решить, как (и надо ли) подключать usestrix/strix к проверке безопасности продуктов-дочек:
    блокирующим гейтом, производителем улик для действующего security-гейта, разовым инструментом
    перед релизом — или никак. Решение должно опираться на evidence о ДВУХ сторонах: что инструмент
    реально производит и чего требует НАШ действующий security-контур, — а не на привлекательность
    формулировки «валидированные находки без ложных срабатываний».
  decision_maker: human
questions:
  - "Что Strix производит машиночитаемого: какие артефакты, какие коды возврата, годится ли это как вход гейта?"
  - "Что именно он ДОКАЗЫВАЕТ, а что только предполагает: как его собственная документация трактует пустой результат?"
  - "Чем он дополняет действующий контур кита (детерминированный скан секретов/зависимостей + флаги injection-поверхности + независимый security-reviewer), а где дублирует?"
  - "Можно ли им ЗАКРЫВАТЬ гейт security — то есть переводить его в зелёное, — или только открывать (блокировать)?"
  - "Цена и условия эксплуатации в дочке: время прогона, деньги, Docker, периметр данных, нужна ли авторизация на атакующий трафик?"
  - "Какие риски управления он вносит: недетерминированность, зрелость, зависимость от облака вендора, раздача атакующих возможностей агенту дочки?"
constraints:
  - evidence_over_reputation
  - one_source_one_evidence
  - negative_claims_qualified
  - same_criterion_applies_to_us
  - vendor_claims_typed_as_vendor_claims
  - no_live_run_claimed_without_measurement
