# Прогон центра по прямому запросу владельца 02.09.2026: провести конкретный репозиторий
# ai-sdlc-framework/ai-sdlc через research-контур. Это продолжение линии соседей по жанру
# (RR-008 -> RR-013 -> RR-014): проверить, реплицирует ли ещё один сосед цепочку кита и не
# меняет ли он уточнённый вывод EV-673. Отличие от предыдущих: источник назван человеком поимённо,
# а не найден Watch'ем, поэтому разведка идёт сразу в код первоисточника, минуя маркетинг.
schema_version: 1
kind: research.request
id: RR-017
title: "Сосед по жанру ai-sdlc-framework/ai-sdlc: реплицирует ли он цепочку кита по коду и держится ли ещё вывод EV-673"
requested_by:
  system: human
  layer: product
decision_to_support:
  description: >
    Решить, что взять из ai-sdlc в разработку кита, что подсмотреть идеей без зависимости, а что
    отвергнуть, и — главное для этой линии — остаётся ли верным уточнённый вывод EV-673 («цепочка
    воспроизведена соседом, но кит единственный по совокупности: полная реализация + dogfood +
    research») после того, как в выборку добавлен ai-sdlc. Позиционирование кита относительно
    ai-sdlc должно опираться на evidence о ДВУХ сторонах, а не на то, что умеет кит.
  decision_maker: human
questions:
  - "Что ai-sdlc делает ПО КОДУ, а не по README: реплицирует ли он цепочку кита (детерминированные gates + независимое ревью + evidence на точном SHA + delivery-транзакция + durable lifecycle) исполняемым кодом с тестами — или это инструкции агенту в markdown, как у mestre-yoda?"
  - "Инвариант writer≠judge: заявление README 'reviewer collusion mechanically impossible' подкреплено кодом-механизмом или это обещание? Если механизм есть — сильнее ли он, чем то, что было у multi-agents-control-plane (EV-670)?"
  - "Evidence на SHA: есть ли у ai-sdlc машиночитаемый провенанс изменения, привязанный к коммиту (аттестация), и в каком он статусе зрелости — реализован, одобрен, черновик?"
  - "Что у ai-sdlc есть СВЕРХ кита (оси, где сосед впереди), и что остаётся уникального у кита — по коду и структуре репозитория, с квалификаторами охвата на негативные утверждения?"
  - "Меняет ли добавление ai-sdlc формулировку EV-673 — и если да, до чего сужается честная дифференциация кита?"
constraints:
  - evidence_over_reputation
  - one_source_one_evidence
  - negative_claims_qualified
  - self_evidence_flagged
  - same_criterion_applies_to_us
workflow_hint: comparison
memory_check:
  performed: true
  related_requests: [RR-008, RR-013, RR-014]
  related_decisions: [DP-107, DP-109]
  summary: >
    RR-013 (answered): EV-673 суперсидит EV-660 — «связной цепочки не обнаружено» больше не
    действует, multi-agents-control-plane (EV-670) воспроизвёл её по коду; кит объявлен единственным
    по совокупности «полная реализация + dogfood + research». RR-014 (answered): добавление
    Galileo Agent Control (runtime-guardrails, не delivery-lifecycle) и mestre-yoda (markdown-
    инструкции, не исполняемые проверки) вывод EV-673 не изменило. ai-sdlc в прошлых прогонах НЕ
    рассматривался — ни одна EV-запись его не касается (проверено grep по .research/). Поэтому это
    новый источник, а не переучёт: критерий тот же (реплицирует ли цепочку ПО КОДУ), выборка
    расширяется. DP-107/DP-109 — про позиционирование кита; их формулировка «единственный с цепочкой»
    — ровно то, что этот прогон обязан перепроверить, а не воспроизвести.
required_confidence: medium
