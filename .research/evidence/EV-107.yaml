request_id: RR-001
statement: >
  Kimi K2.6 у ОФИЦИАЛЬНОГО провайдера Moonshot AI (листинг OpenRouter, ре-фетч 2026-09-10):
  $0.95 вход / $4.00 выход / $0.16 чтение кэша за 1M токенов; контекст 262,144 токена,
  максимальный выход 262,144. Цена $0.66/$3.41 из EV-104 у Moonshot больше не наблюдается:
  сегодня в этой полосе стоит сторонний провайдер CoreWeave ($0.65 / $3.41). Самый дешёвый
  маршрут к той же модели на OpenRouter — Chutes ($0.58 / $3.40); Baidu Qianfan и StreamLake
  дают $0.5795 / $2.44 и $0.5985 / $2.52 по скидкам 39% и 37% от базовых $0.95 / $4.00.
  Следствие: официальная цена K2.6 в 1,44 раза выше входа и в 1,17 раза выше выхода, чем
  заложено в EV-104 и в расчёт EV-106.
