statement: >
  Kimi K2.6 на листинге OpenRouter (пересъёмка 2026-09-22): у официального провайдера
  Moonshot AI — $0.95 вход / $4.00 выход / $0.16 cache-read за 1M токенов. Цены $0.66 / $3.41
  (EV-104) на странице больше нет ни у одного из 21 провайдера. В заголовке карточки показана
  цена самого дешёвого провайдера — $0.50 вход / $2.85 выход за 1M (Chutes); контекст
  262,144 токена не изменился.
