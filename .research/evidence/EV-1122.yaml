statement: "mutmut 3.x копирует исходники в каталог ./mutants/ и гоняет тесты оттуда; открытая заявка #486 фиксирует, что это ЛОМАЕТ импорты editable-установки. Кроме того mutmut 3.x не мутирует код вне функций вовсе (README: для этого предлагается mutmut 2 с другой моделью исполнения), и у него нет порога --fail-under и вывода JUnit XML (открытый вопрос #373). У mutmut есть встроенная диагностика на случай, когда тесты импортируют код другим путём: тогда все мутанты молча становятся 'No Tests' — mutmut это ловит и падает с внятным сообщением."
