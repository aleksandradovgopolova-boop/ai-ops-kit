statement: "Механизма синхронизации файлов, которые инструмент записал в репозиторий пользователя, у pipx 1.16.7 и uv 0.12.5 нет по замыслу: у pipx это выведено в явный не-скоуп (он управляет своими окружениями и точками входа, и в не-скоупе прямо перечислено 'tool selection based on the current directory, parent directories, or project metadata'), у uv апгрейд описан исключительно как операция над tool environment ('Tool environments are not intended to be mutated directly'). То есть переход кита на модель пакета решает вопрос 'какая версия движка запускается' и НЕ решает вопрос 'какие правила, валидаторы и точка входа лежат в дочке' — а именно он даёт 8 из 48 находок поля."
