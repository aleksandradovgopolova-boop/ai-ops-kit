statement: >
  Контракт запроса раннера (схема печатается самим бинарником в `-h`, неизвестные поля
  ОТВЕРГАЮТСЯ): messages/prompt, model, max_attempts, system_prompt (полная замена системного
  промпта), thinking_level (low|medium|high|xhigh|max, по умолчанию high), session_id (создать или
  ВОЗОБНОВИТЬ персистентную сессию), disallowed_tools (исключение инструментов из контекста и
  исполнения). Поля extra_allowed_tools и include_partial_messages принимаются и игнорируются —
  то есть схема намеренно повторяет форму запроса Claude Agent SDK, что делает замену исполнителя
  дешёвой по интерфейсу.
