statement: >
  Замер зрелости кодовой базы на коммите b7c9bf1: ~61.8 тыс. строк Go, из них ~30.9 тыс. — тесты
  (половина). CI гоняет на ubuntu-24.04 и macos-15 связку `make test check build` (go test -race,
  go vet, проверка gofmt), отдельной матрицей — четыре fuzz-цели (отказы координатора, соответствие
  журнала исполнению у координатора и у раннера, подготовка ViewImage) и отдельной джобой — сборку
  бенчмарк-бандла Harbor, smoke-тест на локальной тест-модели и сборку Docker-образа. История в
  клоне (глубина 50) уходит минимум в 10.09.2026 с ежедневными коммитами шести авторов
  @unreallabs.ai — значит публикация 21.09 не равна началу разработки.
