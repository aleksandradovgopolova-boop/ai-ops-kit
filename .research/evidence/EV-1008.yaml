statement: 'Подтверждение того же пробела по второму источнику: в CHANGELOG Claude Code
  (проверен целиком на 2026-07-30) нет ни одного упоминания ревизии протокола MCP —
  ни 2026-07-28, ни 2025-11-25, ни «protocol version», ни «stateless», ни «server/discover»,
  ни «Mcp-Session-Id». При этом MCP-изменения в релизах недели есть и они операционные,
  не протокольные: в 2.1.219 добавлены HTTP-статус и текст ошибки в claude mcp list
  и /mcp при неудачном подключении сервера плюс предупреждение о скрытых пробелах в
  значениях MCP-конфига, а в headless-событие init добавлен mcp_server_errors со списком
  записей --mcp-config, отброшенных валидацией. Вывод: раннтайм версионирование протокола
  наружу не публикует — значит декларация кита о MCP не может быть проверена по документации
  поставщика.'
