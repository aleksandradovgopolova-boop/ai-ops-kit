statement: >
  ЗАЯВЛЕНИЕ ВЕНДОРА (не проверенный нами факт): Strix позиционируется как автономные
  AI-пентестеры, которые запускают код динамически, находят уязвимости и ВАЛИДИРУЮТ их рабочими
  proof-of-concept, — в противопоставление «ложным срабатываниям инструментов статического
  анализа». Заявленный охват: OWASP Top 10 и шире (нарушение контроля доступа, инъекции, SSRF/XXE/
  RCE, XSS/CSRF, гонки и обход бизнес-логики, JWT/сессии, инфраструктура и облако, API). Заявлены
  также многоагентная оркестрация, автопочинка с патчами и отчёты под комплаенс. Ключевое для нас
  утверждение — «working PoCs, not false positives» — нами НЕ проверялось ни одним прогоном.
