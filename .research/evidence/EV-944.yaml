statement: 'kubernetes-sigs/agent-sandbox — Apache-2.0, API в статусе v1beta1 (не
  stable). Абстракция Sandbox даёт ровно то, что перечисляло входящее: стабильную
  сетевую идентичность и hostname, постоянное хранилище, переживающее рестарты, управление
  жизненным циклом с паузой и возобновлением, SandboxWarmPool с преднагретыми окружениями
  и делегирование изоляции в gVisor/Kata через RuntimeClass. Цена входа зафиксирована:
  это CRD и контроллер Kubernetes, то есть требуется кластер — для кита сегодня это
  исследовательский горизонт, а не внедрение.'
