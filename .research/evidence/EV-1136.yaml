statement: "Развилка документирована и она бинарная: либо тесты гоняются против УСТАНОВЛЕННОГО пакета — pytest: 'It will run tests against the installed package and not against your source code checkout, helping to detect packaging glitches', для чего нужен не-editable (tox package = wheel или sdist-wheel; uv --no-editable), — либо против ДЕРЕВА: без editable, src-layout и PYTHONPATH=src. Смешивать нельзя. Критично для кита: ini-опция pytest pythonpath правит sys.path внутри процесса pytest и НА ПОДПРОЦЕСС НЕ НАСЛЕДУЕТСЯ — на подпроцессы влияет только переменная окружения. Ещё: 'pytest' и 'python -m pytest' не эквивалентны — второй добавляет текущий каталог в sys.path. Режим --import-mode=importlib рекомендован для новых проектов, потому что тогда 'pytest will not change sys.path at all'."
