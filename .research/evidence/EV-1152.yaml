statement: >-
  Продуктовая сторона (discovery) имеет собственный устоявшийся словарь, отличный от инженерного:
  opportunity solution tree Терезы Торрес (2016, Continuous Discovery Habits) — четыре уровня:
  Desired Outcome (корень), Opportunity Space (потребности и боли пользователей), Solution Space
  (решения-кандидаты), Assumption Tests (проверки допущений). Значение для решения: между «целью»
  и «фичей» отраслевая практика ставит ДВА промежуточных уровня — возможность и проверяемое
  допущение, — и именно они отвечают на вопрос «почему мы это построили». В словаре кита
  (registry/entities.yaml) есть goal, feature, experiment и insight, но нет узла «возможность»
  и нет узла «допущение».
