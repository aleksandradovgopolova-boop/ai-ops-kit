statement: 'Официальные митигации (сжато, по разделам Prevention and Mitigation Guidelines):
  сквозной паттерн — Least Agency (не давать автономию без нужды), HITL для high-impact
  действий, short-lived scoped credentials, sandbox + egress-контроль, подписанные
  артефакты/provenance; по рискам: ASI02 — per-tool профили + Intent Gate middleware;
  ASI03 — task-scoped токены + per-agent identity + policy engine; ASI04 — подписанные
  manifests + SBOM/AIBOM + pinning по content hash + kill switch; ASI06 — валидация
  memory writes + сегментация + provenance/trust scores + expiry + запрет re-ingestion
  собственных выводов; ASI08 — zero-trust + blast-radius guardrails (quotas, circuit
  breakers); ASI10 — immutable signed audit + watchdog agents + kill-switches.'
