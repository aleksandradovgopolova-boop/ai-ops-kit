request_id: RR-021
statement: >
  ВЫВОД (не измерение), центральный для решения: Strix может ОТКРЫВАТЬ наш гейт security, но не
  может его ЗАКРЫВАТЬ — и это свойство не настройки, а логики. Подтверждённая эксплуатацией находка
  (если заявленная валидация PoC работает, EV-1188) есть положительное доказательство: уязвимость
  существует, значит улика no_injection_surface не выполнена, значит гейт обязан блокировать —
  и это ровно тот вход «флаги для судьи», который контур кита уже предусматривает (EV-1196).
  Обратное неверно: пустой результат прогона не доказывает отсутствия уязвимостей, и этого не
  утверждает даже сам вендор — он прямо оговаривает, что ноль покрывает лишь проанализированное
  (EV-1189). Отсюда следствие для конструкции: включать Strix «гейтом, который должен пройти»
  нельзя — такой гейт выдавал бы зелёное за неисследованное, то есть производил бы ровно тот
  ложно-зелёный, против которого построен кит. Допустимая конструкция одна: производитель улик,
  чья находка блокирует, а чьё молчание не значит ничего.
