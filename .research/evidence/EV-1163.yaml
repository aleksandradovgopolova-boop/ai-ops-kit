id: EV-1163
request_id: RR-017
statement: >
  Инвариант writer≠judge у ai-sdlc подкреплён кодом-механизмом, а не только обещанием. Файл
  orchestrator/src/harness/independence.ts (+ independence.test.ts) реализует enforceIndependence():
  когда стадия объявляет requiresIndependentHarnessFrom, оркестратор фильтрует её цепочку harness'ей,
  исключая тот harness, который ФАКТИЧЕСКИ прогнал названные вышестоящие стадии (а не тот, что
  объявлен, — важно при fallback); если после фильтра цепочка пуста, функция возвращает
  violated=true, и onFailure применяет вызывающий код (сам модуль onFailure не вызывает —
  уточнение judge round 1). Отдельная validateIndependenceGraph() требует, чтобы ссылки указывали строго
  вверх по конвейеру (иначе CyclicIndependenceConstraintError). Собственный docstring называет это
  «load-bearing safety property for cross-harness review». Значение: это ровно инвариант кита
  (автор изменения не может быть его судьёй), и он сильнее общего заявления EV-670 у
  multi-agents-control-plane — здесь закрыт конкретный класс обхода (тихий коллапс ревью на harness
  исполнителя через fallback).
