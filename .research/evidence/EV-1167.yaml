statement: >
  Каталог research/ у ai-sdlc — это авторские отчёты, а НЕ операционный контур «запрос -> evidence
  -> пакет решения», как research-модуль кита. В research/ ровно три markdown-файла:
  ai-sdlc-foundation-research.md, ai-sdlc-framework-prd.md, ai-sdlc-v0.1-PRD-report.md — то есть
  документы-исследования и PRD, а не versioned-схемы ResearchRequest/Evidence/DecisionPackage,
  не накапливаемые EV-записи с provenance и freshness, не memory-first проверка и не writer≠judge
  на выводах. Квалификатор охвата: проверено содержимое каталога research/ в публичном репо на
  2026-09-02; отдельного пакета/сервиса «research-as-decision-evidence» под другим именем в
  верхнеуровневых каталогах не обнаружено, но исчерпывающий поиск по всему дереву не проводился,
  поэтому reliability не выше medium. Значение для кита: третья ось EV-673 («research») у ai-sdlc
  как ОПЕРАЦИОННЫЙ контракт не закрыта — это остаётся кандидатом в уникальность кита.
