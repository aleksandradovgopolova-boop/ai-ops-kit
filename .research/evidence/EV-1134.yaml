# Что у pipx стоит подсмотреть ИДЕЕЙ, не беря зависимость: файл состояния установки.
schema_version: 1
kind: research.evidence
id: EV-1134
request_id: RR-015
statement: "pipx хранит состояние каждой установки в $PIPX_HOME/venvs/<env>/pipx_metadata.json с полем pipx_metadata_version (сейчас '0.12'): по докам pipx пишет его после каждой операции и читает, чтобы обслуживать list/upgrade/reinstall/uninstall, файл считается принадлежащим pipx, перезаписывается атомарно и вправе менять форму между версиями. Это готовый образец того, чего киту не хватает в дочке: версия ПРИМЕНЁННОГО состояния отдельно от версии пакета, со своей версией формата. Ту же идею copier реализует иначе — в answers-файл автоматически пишутся _commit (git describe) и _src_path."
