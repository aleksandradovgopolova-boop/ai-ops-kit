statement: 'Ревизия MCP 2026-07-28 ломающая на уровне протокола: (1) удалены протокольные
  сессии и заголовок Mcp-Session-Id из Streamable HTTP, списочные эндпоинты (tools/list,
  resources/list, prompts/list) больше не варьируются по соединению, состояние переезжает
  в server-minted handles, передаваемые как обычные аргументы инструментов; (2) удалён
  handshake initialize/notifications-initialized, версия протокола и capabilities клиента
  переезжают в _meta каждого запроса; (3) добавлен обязательный для сервера RPC server/discover;
  (5) удалены ping, logging/setLevel, notifications/roots/list_changed; (8) во всех результатах
  обязательное поле resultType; (9) убрана resumability SSE-потока (Last-Event-ID) — оборванный
  поток теряет запрос, клиент ОБЯЗАН пересоздать его с новым request ID.'
