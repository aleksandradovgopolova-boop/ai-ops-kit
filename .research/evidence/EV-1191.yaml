statement: >
  Встраивание в конвейер предусмотрено штатно и узко-прицельно: headless `-n`, а для прогонов в
  духе pull request quick-скан АВТОМАТИЧЕСКИ сужается до изменённых файлов, и это поведение можно
  задать явно — `--scope-mode diff --diff-base origin/main`. Приведены готовые рецепты для GitLab
  CI, Jenkins и CircleCI (везде — установка скриптом с сайта вендора плюс запуск), и повторена
  таблица кодов возврата 0/1/2. То есть механика «проверять только дельту PR» у инструмента есть
  из коробки, а не достигается обвязкой.
