statement: "Полный локальный прогон на origin/main (e1004e1) в чистом worktree даёт 5 failed, 2405 passed, 10 skipped за 8 минут; тот же коммит в CI зелёный. Красные — test_evidence_scope::test_script_announces_the_scope_it_actually_gives, test_validator_bootstrap::test_missing_bootstrap_is_caught, test_validator_runtime_contract::test_standalone_validator_is_green_from_a_copy[validate_context_qualification] и ::test_corrupted_source_of_truth_is_caught[registry/providers.yaml, registry/workflows.yaml]. Причина названа в плане кита (local-run-must-mirror-ci): editable-установка в рабочем venv отдаёт пакет из ~/ai-ops-kit любому подпроцессу, поэтому проба, копирующая валидатор в отдельный каталог и портящая там источник правды, читает не свою копию. Цена: на машине владельца пять проверок не дают сигнала НИКОГДА, и 17.08.2026 в эту пятёрку попал настоящий красный тест новой работы — отличать пришлось отдельным прогоном по origin/main."
