statement: >
  В харнесе штатно заложено ИСПОЛНЕНИЕ ОПЕРАЦИЙ СНАРУЖИ процесса: тип операции remote_job (версия 2)
  с интерфейсом RemoteJobHandler (план, дескриптор, подписка, отложенная инспекция, терминальный
  результат/ошибка с отметками усечения) — то есть модель контракта «работа описана сериализуемо,
  где она исполняется — деталь реализации». Инструментов при этом ровно три: Bash, ViewImage,
  SkillUse; MCP из открытого раннера намеренно вынесен отдельным коммитом («Isolate MCP and add a
  slim unreal-agent runner»).
