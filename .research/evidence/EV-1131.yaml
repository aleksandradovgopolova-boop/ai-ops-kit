statement: "copier берёт ПОСЛЕДНИЙ ТЕГ шаблона, а не HEAD: при грязном локальном шаблоне с тегами v1/v2 команда copier copy ./src ./dst молча возьмёт v2.0.0, для HEAD нужен явный -r HEAD (это описано в FAQ докaв как отдельный вопрос). Для кита это в точности воспроизведённая старая ошибка: локальный источник ~/ai-ops-kit стоял на неслитой ветке, и установка молча поставила её состояние. То есть переход на copier не устраняет класс 'источник установки не тот, что думает владелец', а МЕНЯЕТ его форму — с ветки на тег. Кроме того _migrations и tasks требуют --trust или записи trust: в ~/.config/copier/settings.yml, иначе выход с кодом 4; для кита, вся ценность которого в миграциях, это обязательный шаг онбординга у каждой дочки."
