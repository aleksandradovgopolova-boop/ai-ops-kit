statement: >
  По нескольким осям ai-sdlc ОПЕРЕЖАЕТ кит. (1) Спек-зрелость: формальный SPEC с Kubernetes-style
  версионированием (v1alpha1) и 40+ RFC (RFC-0001..RFC-0044) с фронтматтером статуса/lifecycle и
  списком реализующих задач; каталог conformance/ с runner и tests — исполняемый conformance-набор
  на спецификацию. (2) Мультиязычная поверхность для adopter'ов: SDK на трёх языках (sdk-go,
  sdk-python, sdk-typescript), Claude-плагин (ai-sdlc-plugin) и mcp-advisor. (3) Комплаенс как
  первоклассный слой: compliance-clearance.ts + RFC-0022 выводят посадку на EU AI Act / NIST AI RMF
  / ISO 42001; cost-governance.ts + RFC-0004 — управление стоимостью; RFC-0006 — governance
  дизайн-системы. Значение для кита: заявление EV-673 «кит единственный с ПОЛНОЙ реализацией» надо
  ослабить — по формальной спецификации, conformance, мультиязычным SDK и комплаенсу ai-sdlc
  представлен шире кита (у кита — Python stdlib+pyyaml, установка копированием, без публичного SDK
  и без формального conformance-набора на схему).
