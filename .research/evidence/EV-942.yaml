statement: 'RepoPrompt CE — Apache-2.0 и ТОЛЬКО macOS 26+ (требует Xcode 26 / Command
  Line Tools с macOS 26 SDK), то есть как исполняемая зависимость киту не подходит
  в принципе. Механики подтверждены и совпадают с описанием входящего: сборка контекста
  из дерева файлов, содержимого выбранных файлов, СРЕЗОВ СТРОК, CodeMaps и git-диффов;
  multi-root workspaces для связанных репозиториев; курирование контекста в пределах
  token budget; reviewable handoffs — предпросмотр и правка отобранного контекста
  ДО отправки другой модели или агенту; интерфейс — MCP-сервер плюс CLI.'
