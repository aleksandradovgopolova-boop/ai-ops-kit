request_id: RR-015
statement: "Ни один из четырёх рассмотренных архитектурных инструментов (import-linter, pytest-archon, PyTestArch, deptry) не умеет выразить правило 'модуль X не должен ЧИТАТЬ файл Y' — все четыре работают исключительно с графом импортов; PyTestArch говорит это в докax прямо ('extracts only the information about module imports from the AST'). Для кита это существенно: его собственные инварианты чаще про доступ к артефактам (кто вправе писать в .ai/managed, кто читает реестр), а не про импорты. Такую проверку придётся держать своей — как AST-тест на open/Path.read_text/yaml.safe_load либо как рантайм-перехват в conftest."
