statement: 'MCP принял формальную политику жизненного цикла фич (SEP-2596) — три состояния
  Active/Deprecated/Removed с окном не менее двенадцати месяцев, отсчитываемым ОТ ВЫПУСКА
  ревизии, в которой фича впервые помечена Deprecated (не от даты Final самого SEP);
  eligible for removal — первая ревизия, выпущенная как Current после истечения окна.
  Сокращение окна возможно только при активном security-риске (опубликованный advisory
  или документированная эксплуатация) и не короче девяноста дней. Два факта, снижающих
  давление на потребителя: (1) «Removal from the specification does not oblige an SDK
  to drop the feature from releases» — срок жизни фичи в SDK определяет политика самого
  SDK; (2) фичи МОГУТ оставаться Deprecated много дольше минимального окна. Ожидание
  от реализаций Deprecated-фич сформулировано как SHOULD, не MUST: новым реализациям
  не внедрять, существующим — миграция до earliest removal.'
