statement: 'КЛЮЧЕВОЕ ДЛЯ РЕШЕНИЯ по наблюдаемости: семантические конвенции OpenTelemetry
  для GenAI имеют статус Development (документ помечен «Status: Development»), лицензия
  Apache-2.0. В наборе есть отдельные документы для событий, метрик, model spans и
  AGENT spans (Generative AI agent operations), но отдельной декларации стабильности
  у агентных конвенций нет — они наследуют общий статус Development. То есть строить
  на них формат событий сегодня можно только как на движущейся мишени: заимствовать
  имена атрибутов, не привязываясь к их неизменности.'
