statement: >
  usestrix/strix — открытый проект под Apache-2.0 на Python, описанный как "Open-source AI
  penetration testing tool to find and fix your app's vulnerabilities". На 22.09.2026: 64 183
  звезды, 7 019 форков, 407 ОТКРЫТЫХ issue, создан 05.08.2025, последний push 22.09.2026,
  версия пакета strix-agent 1.6.2, требуется Python >= 3.12. То есть это не новорождённый проект,
  а зрелый по возрасту и вниманию; число открытых issue при этом велико и само по себе сигнал о
  нагрузке на сопровождение, а не о качестве.
