statement: >-
  Conventional Commits v1.0.0 — самый распространённый словарь типов коммитов — обязывает ровно
  ДВА типа: feat и fix; всё остальное (build, chore, ci, docs, style, refactor, perf, test)
  объявлено необязательным и вынесено в конфигурацию commitlint. Типа для решения, исследования
  или наблюдения спецификация не содержит вовсе. Значение для решения: коммит в общепринятой
  практике классифицирует ИЗМЕНЕНИЕ КОДА, а не продуктовое событие; расширение этого словаря
  типами decision/research — выход за пределы того, для чего механизм создан.
