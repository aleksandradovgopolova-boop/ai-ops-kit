statement: 'SELF-EVIDENCE (требует спот-чека judge). Два места кита, где MCP уже несёт
  инвариант, и оба не знают о версии протокола: (1) schemas/supply-chain-pin.schema.json
  — SupplyChainPinPolicy требует, чтобы любая внешняя зависимость движка (model/skill/mcp)
  ставилась только по зафиксированному revision/hash, для исполняемого кода (skill/mcp)
  обязательна install-верификация hash или signature; но pinned.type ограничен enum
  [revision, hash, digest, tag-immutable], поля для ревизии ПРОТОКОЛА нет, а сама схема
  объявлена additionalProperties: false — то есть добавление такого измерения = правка
  схемы (аддитивная, но всё же правка), а не запись в данных. (2) governance/security-posture.yaml,
  область tool-mcp-connection «Безопасное подключение внешних инструментов и MCP» —
  status declared, severity high, evidence [governance/security-policies.md, registry/tools.yaml],
  note прямо говорит: политика подключения есть, enforcement — roadmap. Следствие: пиновка
  MCP-серверов по хешу артефакта и честно declared-постура вместе означают, что смена
  ревизии протокола у сервера, установленного по зафиксированному хешу, китом не отслеживается
  ни данными, ни enforcement-ом.'
