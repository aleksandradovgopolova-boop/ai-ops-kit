statement: >
  Набор LLM-клиентов ограничен пятью: openai, openaicodex, openrouter, fireworks, ollama.
  СОБСТВЕННОГО клиента Anthropic в открытой части нет. Квалификатор охвата: проверено полным
  перечислением каталога harness/llm/clients/ и grep по `anthropic` во всех .go и .md файлах клона
  на коммите b7c9bf1 — слово встречается только в клиенте openrouter, в тесте запроса и в README
  бенчмарка, то есть Anthropic достижим ТОЛЬКО через OpenRouter как посредника. Это утверждение об
  открытом репозитории; во внутренней кодовой базе Unreal Labs (из которой репозиторий — выборка,
  EV-1181) может быть иначе, и это не проверялось.
