statement: >
  НАША сторона, контракт гейта: гейт security в ките блокирующий, закрывается судьёй и требует трёх
  улик — no_secrets, no_injection_surface, deps_approved. Детерминированный сканер кита
  (ai_ops_kit/security/security_scan.py) честно делит их на две части: он МОЖЕТ доказать отсутствие
  известных секретов и отсутствие новых зависимостей и закрыть no_secrets/deps_approved, а
  no_injection_surface объявлен СУЖДЕНИЕМ — эвристика лишь флагит места (eval/exec, shell=True,
  pickle, yaml.load, SQL через f-строку, dangerouslySetInnerHTML, child_process), и закрывает его
  независимый security-reviewer или человек, потому что writer не судит себя. Надстройка
  security_pack добавляет то же правило на уровне доменов: домен нельзя закрыть фразой
  «уязвимостей нет», авто-закрытие возможно только там, где улики целиком покрыты пройденными
  детерминированными проверками. То есть в ките УЖЕ есть место для чужих находок — и уже есть
  запрет закрывать проверку отсутствием находок.
