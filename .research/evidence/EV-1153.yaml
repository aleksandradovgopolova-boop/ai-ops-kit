statement: >-
  Для AI-специфичной части предложения (типы prompt и model) в индустрии сложилась форма не
  «тип коммита», а ВЕРСИОНИРУЕМЫЙ РЕЕСТР АРТЕФАКТОВ: MLflow Prompt Registry описывает себя как
  централизованное хранилище шаблонов промптов, где каждое изменение получает версию с сообщением
  коммита, метаданными и временем, версия помечается алиасом окружения (production / staging) и
  продвигается через evaluation. Аналогично устроен Langfuse. Значение для решения: изменение
  промпта или модели уместно фиксировать как новую версию именованной сущности, привязанную к
  оценке, а не как префикс сообщения коммита — иначе теряется главное, ЧТО показала оценка этой
  версии.
