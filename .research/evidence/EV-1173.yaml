statement: >
  Архитектура харнеса по README первоисточника: вход с глобально уникальным ID -> сессионный inbox
  (идемпотентность) -> координатор (ходы LLM, диспетчеризация) -> реестр инструментов и
  translator'ы, которые ЧИСТО (без I/O) переводят вызов инструмента в ОПЕРАЦИЮ -> менеджер операций
  (актор-рантайм, сменный) -> session store (append-only история с возобновлением и форком).
  README прямо объявляет инварианты расширяемости: элементы session store сериализуемы, формат
  версионирован, операции версионированы и всегда сериализуемы; несовместимая версия сессии даёт
  явную ошибку на resume, а не молчаливую деградацию. Там же назван мотив такого дизайна: прокси-
  менеджер операций может отправлять сериализованные операции в менеджер внутри удалённой песочницы,
  чтобы инструменты исполнялись ТАМ.
