statement: "pytest-archon 0.0.7 (19.09.2025, Apache-2.0, 89 звёзд) выражает архитектурные правила как обычные pytest-тесты и даёт то, чего нет у import-linter: произвольный предикат .should(fn), где fn получает модуль и карты прямых и транзитивных импортов. Для кита это означает, что новое архитектурное правило попадает в существующий прогон само, без новой джобы. Цена: версия 0.0.x, 89 звёзд, последний коммит — дата релиза (19.09.2025), то есть год без изменений; для проверки, которая должна блокировать, это риск владельца, а не техническая деталь."
