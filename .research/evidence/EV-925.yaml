statement: 'Адаптеров окружения в mini-swe-agent v2.4.6 семь файлов: local.py (subprocess),
  docker.py (docker/podman), singularity.py (singularity/apptainer), extra/bubblewrap.py,
  extra/contree.py, extra/swerex_docker.py, extra/swerex_modal.py. Документация каталога
  перечисляет шесть — contree в environments/README.md отсутствует (описан отдельно
  в docs/reference/environments/contree.md). Т.е. переносимость между local/контейнером/облаком
  у них подтверждена практикой, а не декларацией.'
