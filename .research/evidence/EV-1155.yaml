statement: >-
  НЕЗАВИСИМЫЙ ПЕРЕСЧЁТ (сессия-судья RR-016, 19.08.2026) — фактически исполненный первый шаг
  предложенной валидации. Судья взял четыре вида основания из самого пакета (решение ep-*/DP-*,
  исследование RR-*, ADR-*, находка поля F-*, отчёт qualification/*, audit-report.md) и считал
  прозу каждой работы вместе с полями: основание восстанавливается у 26 из 42 закрытых работ
  (62%) и у 21 из 28 активных (75%). Отдельно: упоминание решения или исследования в ПРОЗЕ
  активных работ — 11 из 28, тогда как в полях — 1 из 28, то есть основание существует, но
  живёт вне машиночитаемой части. Пересчёт также подтвердил все числа писателя по полям
  (42/42, 24/13/12, 5/42, 7/28, 748/1182, 906/1923) и исправил два: связей в реестре сущностей
  20, а не 21. Значение для решения: порог продолжения «≥35 из 42», заданный писателем вслепую,
  фактическими данными НЕ проходит, а порог провала «<28» — не срабатывает; шкалу порогов
  придётся строить на измеренной базе 26/42, а не на догадке.
