statement: >
  ВЫВОД (не измерение): unreal-agent-runner структурно снимает ровно ту границу, что зафиксирована
  в EV-1183. Граница возникает из-за того, что несколько локальных `claude -p` делят один машинный
  замок; раннер же — обычный самостоятельный процесс с собственной персистентной сессией, без
  привязки к локальному Клоду (EV-1175, EV-1176), и подключается по уже существующему контракту
  «кит владеет worktree/гейтами/доставкой, писатель только пишет» (EV-1184). Следовательно потолок
  параллельности смещается с «один писатель на машину» на лимиты ключа и провайдера — что совпадает
  с первым из трёх выходов, которые сам замер назвал допустимыми (API-ключ). ОГРАНИЧЕНИЕ ВЫВОДА:
  это рассуждение по устройству, а не замер; ни одного прогона раннера не проводилось, ни одной
  цифры параллельности не получено, и «структурно может» не равно «работает на нашей задаче».
