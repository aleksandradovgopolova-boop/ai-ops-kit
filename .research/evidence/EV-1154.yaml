statement: >-
  СИНТЕЗ RR-016 (вторая редакция, после независимого ревью). Первая редакция выводила правило
  «обратная связь дешевле, потому что связь вперёд гниёт»; судья показал, что данные его не
  поддерживают: направление связи в замере полностью совпадает с наличием валидатора. Правило,
  которое данные ПОДДЕРЖИВАЮТ, звучит иначе и сильнее: ЗАПОЛНЯЕТСЯ РОВНО ТО, ЧТО ПРОВЕРЯЕТСЯ.
  Обязательные и проверяемые связи заполнены полностью (goal 42/42 и 28/28, affects 28/28, место
  перепроверки 42/42); объявленные, но никем не требуемые поля decision и finding пусты 0/42 —
  притом что механика резолвинга ссылки для них уже написана (EV-1143). Второе правило
  выдерживает проверку в ослабленном виде: тип сущности живёт ровно настолько, насколько его
  читают. Knowledge Graph читается необязательным флагом отчёта и не требуется ни одним гейтом —
  и в единственной дочке с графом он простоял 645 коммитов без изменения (EV-1141, EV-1142),
  тогда как модель контуров, у которой есть исполняемый гейт, живёт (EV-1140). Отсюда первый шаг
  — не новая сущность и не новое поле, а включение проверки у того, что уже объявлено.
