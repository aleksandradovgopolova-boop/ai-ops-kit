statement: >-
  СИНТЕЗ RR-016. Разрыв предложенной модели — не в словаре, а в двух других местах. Первое:
  сущности у кита в основном ЕСТЬ (восемь контуров EV-1140, пятнадцать типов узлов EV-1141,
  research-контур EV-1145, FeatureLearning EV-1144), а обязательных СВЯЗЕЙ между ними нет —
  замер даёт 42/42 работ со связью вперёд (цель, результат, место проверки) и 5/42 с любым
  упоминанием основания назад (EV-1143). Второе: сущность без потребителя в коде умирает
  измеримо — граф ИИ-Среды простоял 667 коммитов без изменения (EV-1142), тогда как контурная
  модель, у которой потребитель есть (гейт в execution_pipeline), живёт. Отсюда два правила
  проектирования, которые сильнее любого списка типов: (а) обязательной делать обратную связь
  («на каком основании»), потому что её можно потребовать в момент создания, тогда как связь
  вперёд требует возврата к записи и потому гниёт; (б) новый тип сущности вводить только вместе
  с названным потребителем — гейтом, ответом next или проверкой doctor.
