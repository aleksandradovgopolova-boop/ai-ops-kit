statement: >-
  Измерено, что происходит с сущностью без потребителя. Единственная дочка, где knowledge/graph.yaml
  вообще заведён, — ИИ-Среда (~/ii-sreda). Последнее изменение файла — 30.07.2026; с того дня в
  репозитории 667 коммитов, и ни один графа не коснулся. В графе 13 узлов типа feature при 31
  каталоге в features/, а 86 ADR из docs/architecture/decisions/ в нём не представлены вовсе.
  То есть граф не «отстал» — он перестал быть моделью и стал архивом одного дня. Это ровно тот
  исход, о котором предупреждает сам product-operating-model: разрыв превращает модель в
  документацию.
