statement: "check-jsonschema 0.38.0 (09.08.2026, организация python-jsonschema — та же, что у самой библиотеки jsonschema) поставляет 29 готовых pre-commit хуков, включая универсальный check-jsonschema. Несколько схем на разные семейства файлов поддержаны штатно — несколькими инстансами хука с разными files: и --schemafile. Инстансы могут быть YAML, JSON, JSON5, TOML; вывод -o TEXT|JSON; удалённые схемы кэшируются. Это dev-инструмент: он живёт в .pre-commit-config.yaml и в CI, а не в поставке кита, поэтому правило AGENTS.md:39 про зависимости он не нарушает."
