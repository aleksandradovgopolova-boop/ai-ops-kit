statement: >
  Харнес читает навыки с диска в формате, совпадающем с нашим: `DiscoverSkills` ищет
  `<каталог>/*/SKILL.md` и разбирает YAML-фронтматтер с полями name и description; раннер зовёт её
  на `<workspace>/.harness/skills`, регистрирует найденное и включает инструмент SkillUse ТОЛЬКО
  когда навыки есть. Найденные навыки подаются модели XML-блоком available_skills (имя, описание,
  путь), а не текстом файла — то есть прогрессивное раскрытие, как у нас: описание в контексте,
  тело по запросу.
