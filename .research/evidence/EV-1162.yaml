statement: >
  Цепочка кита воспроизведена у ai-sdlc ИСПОЛНЯЕМЫМ КОДОМ, а не инструкциями агенту. Каталог
  orchestrator/src содержит ~90 модулей TypeScript, у большинства парный *.test.ts: admission*.ts
  (фильтры допуска: blocked / in-flight / DoR / dispatchability), progressive-gates.ts (гейты
  advisory -> soft-mandatory -> hard-mandatory), execute.ts (64 КБ — dispatch в изолированный git
  worktree, конвейер Step 0-13: dev-агент -> 3 ревьюера -> подпись аттестации -> открытие PR),
  review.ts / review-meta.ts / runners/review-agent.ts (ревью-стадии), provenance.ts, audit-*.ts
  (журнал), compliance-clearance.ts, cost-governance.ts. Это тот же контур, что у кита (execution +
  детерминированные gates + ревью + delivery-транзакция), выраженный кодом с тестами. Отличие от
  mestre-yoda (EV прошлого прогона RR-014): там были markdown-инструкции, здесь — TypeScript-модули
  и vitest-тесты в одном репозитории.
