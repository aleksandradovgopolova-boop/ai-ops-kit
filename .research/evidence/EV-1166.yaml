statement: >
  ai-sdlc делает dogfood — применяет собственную рамку к своей разработке. В репозитории есть
  каталог dogfood/ (src, scripts, backlog, package.json, vitest.config.ts) и команда
  `/ai-sdlc execute <task-id>` для прогона задач собственного backlog через конвейер; README и
  dogfood/README описывают внутренний dogfood по backlog-задачам. Плюс каталог backlog/ верхнего
  уровня и .backlog-drift.yml. Значение для кита: тот же принцип, что у кита (рамка ведёт свою
  собственную разработку), реализован у соседа — это была одна из трёх осей, которыми EV-673
  отличал кит («полная реализация + dogfood + research»); ось dogfood у ai-sdlc закрыта.
