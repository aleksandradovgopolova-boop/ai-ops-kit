statement: >-
  Связи между сущностями отсутствуют не по недосмотру, а по устройству схем. schemas/workitem.schema.json
  (сущность ПРОГОНА, не запись плана — их не следует смешивать) не имеет ни одного поля-ссылки
  на решение или исследование (schema_version, kind, id, task, workflow, route_reasons,
  human_approval_required, paths, status, lifecycle_intent); поля-связки записи ПЛАНА живут не в
  схеме, а в delivery_plan.py (см. EV-1143). В decisions-registry
  эпизод решения обязан иметь question/decision/reason/reversibility/date, а связь с работой —
  только необязательное свободнотекстовое `source`. В feature-blueprint блок links допускает
  goal/initiative/epic/stories/experiments — решения и исследования там нет. ЕДИНСТВЕННЫЙ сомкнутый
  мост в ките — FeatureLearning: schemas/feature-learning.schema.json несёт feature,
  decision_package, decision, reused_evidence, research_gap одновременно, и FL-001 фактически
  связывает DP-108 → стратегию → ADR-001. То есть цепочка, которую предлагает владелец,
  реализована ровно в одной сущности из девяти.
