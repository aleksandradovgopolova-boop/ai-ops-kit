statement: >
  Управляемость проекта ограничена его же правилами: CONTRIBUTING объявляет репозиторий ВЫБОРКОЙ
  компонентов из большей внутренней кодовой базы, обещает делиться дальше по мере оценки
  надёжности, приглашает issue с вопросами и багами — и прямо отказывается принимать pull request'ы
  из-за нехватки ресурса на ревью. Практическое следствие для потребителя: на найденный дефект
  доступны issue или форк, но не патч в upstream.
