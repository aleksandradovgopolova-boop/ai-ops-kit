statement: >
  Исполнение идёт внутри Docker-контейнера на базе Kali Linux с предустановленным НАСТУПАТЕЛЬНЫМ
  инструментарием, доступным агенту через терминал: разведка (Subfinder, Naabu, httpx, Katana,
  ffuf, Nmap), веб-тестирование (Arjun, Dirsearch, wafw00f, GoSpider), автоматические сканеры
  (Nuclei, SQLMap, Wapiti, OWASP ZAP), анализ JavaScript, а также source-aware слой (Semgrep,
  ast-grep, Tree-sitter с преднастроенными грамматиками Java/JS/TS/Python/Go/Bash/JSON/YAML,
  Bandit) и детекторы секретов. Практическое следствие: прогон против живой цели порождает
  РЕАЛЬНЫЙ атакующий трафик, а не только чтение кода.
