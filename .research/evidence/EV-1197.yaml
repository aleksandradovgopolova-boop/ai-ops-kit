statement: >
  НАША сторона, пробел: динамической проверки — запуска продукта и попытки его эксплуатировать — в
  ките нет вовсе. Квалификатор охвата: проверено grep по всему репозиторию кита на «DAST», «pentest»
  и «пентест» во всех .md, .yaml и .py — совпадения нашлись ровно в двух местах, и ни одно не
  является механизмом: тест диагностики конвейера и research-пакет DP-110 (сверка кита с OWASP
  Agentic AI Top 10). Ни в quality/gates.yaml, ни в ai_ops_kit/security/ нет ни одного
  производителя улик, который исполняет код продукта и подтверждает уязвимость эксплуатацией.
  Значит ось «доказано эксплуатацией» у кита пустая, а не слабая.
