statement: >-
  Backstage Software Catalog — самый массовый живой пример каталога сущностей разработки — держит
  НАМЕРЕННО МАЛЫЙ канон: Component, API, Resource как ядро плюс System и Domain для группировки и
  User/Group для людей; связи выражаются глаголами provide / consume / depend on. Существенно для
  решения не число типов, а причина их жизни: каждая сущность каталога существует потому, что её
  ЧИТАЮТ плагины (страница сервиса, TechDocs, scaffolder), то есть у типа есть потребитель по
  построению. Каталог без потребителя в этой архитектуре не предусмотрен.
