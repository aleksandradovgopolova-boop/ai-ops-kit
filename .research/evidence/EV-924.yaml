statement: 'Разделение model / environment / agent в mini-swe-agent сделано через
  три Python-Protocol в src/minisweagent/__init__.py, а не через наследование: Model
  (query, format_message, format_observation_messages, get_template_vars, serialize),
  Environment (execute, get_template_vars, serialize), Agent (run, save). Агент принимает
  model и env в конструкторе и не знает их конкретных типов. Это ровно тот контракт,
  который входящее предлагает завести киту как EnvironmentAdapter/ModelAdapter — и
  он минимален: у окружения ВСЕГО ТРИ метода, без snapshot/restore.'
