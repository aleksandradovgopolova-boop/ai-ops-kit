statement: >
  Пересчёт стоимости генерации одной книги на 2026-09-22 (то же допущение: ~100K токенов выхода
  + ~200K токенов входа без учёта кэша): deepseek-v4-flash ≈ $0.06; deepseek-v4-pro ≈ $0.17;
  kimi-k2.6 ≈ $0.59 у официального провайдера Moonshot (≈ $0.39 у самого дешёвого провайдера
  листинга); kimi-k3 ≈ $2.10. Против EV-106 изменилась только строка kimi-k2.6 ($0.47 → $0.59,
  +26%): цены DeepSeek и K3 на дату пересчёта прежние. Разброс между дешёвым и качественным
  вариантом остался ~35x; кэширование промптов снижает входную часть у всех.
