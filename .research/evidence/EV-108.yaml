statement: >
  Пересчёт стоимости генерации одной книги на ценах 2026-09-10 (допущение прежнее: ~100K
  токенов выхода + ~200K токенов входа без учёта кэша): deepseek-v4-flash ≈ $0.06;
  deepseek-v4-pro ≈ $0.17; kimi-k2.6 ≈ $0.59 у официального Moonshot (≈ $0.46, если брать
  самый дешёвый маршрут OpenRouter — Chutes); kimi-k3 ≈ $2.10. Разброс между дешёвым и
  качественным вариантом ~37x (было ~35x). Единственное изменение против EV-106 — цена
  kimi-k2.6: $0.47 -> $0.59 (+25%) из-за официальной цены $0.95/$4.00 вместо $0.66/$3.41
  (EV-107). Цифры deepseek и kimi-k3 не изменились: EV-101 и EV-103 действительны до
  2026-10-22. Кэширование промптов снижает входную часть у всех.
