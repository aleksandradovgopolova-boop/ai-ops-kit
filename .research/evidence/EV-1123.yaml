statement: "cosmic-ray 8.7.0 (09.08.2026, MIT, живой) имеет штатный диф-фильтр cr-filter-git ('looks for edited or new lines from the given git branch') — единственный такой из четырёх рассмотренных движков, — но у него НЕТ отбора тестов под мутанта: test-command это одна строка, которая гоняется целиком на каждого мутанта (заявка #498 'Reduce runtime by running only module related tests' открыта с 2020 года, #85 про интеграцию с coverage тоже открыта), а локальный дистрибьютор идёт последовательно без параллелизма. На наборе кита (2410 тестов, полный прогон 8 минут) это делает полный мутационный прогон неприменимым. Вдобавок сам диф-режим сейчас с открытым баг-репортом #567 'cr-filter-git doesn't catch diff fills, skips all mutations'."
