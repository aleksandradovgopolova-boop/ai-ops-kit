statement: 'Закрытие лазеек у Superpowers — процедура, а не призыв: каждая новая рационализация
  фиксируется дословно (перечислены семь типовых, включая «I''m following the spirit
  not the letter» и «I already manually tested it»), и на каждую добавляются четыре
  элемента — явное отрицание в правилах, строка в таблице рационализаций, запись в
  Red Flags и обновление description симптомами «вот-вот нарушу». Отдельно описано
  мета-тестирование: если агент прочитал навык и всё равно нарушил, ответ «навык был
  ясен, я решил его проигнорировать» трактуется НЕ как дефект документации, а как
  нехватку фундаментального принципа.'
