statement: >
  mestre-yoda (MIT, TypeScript) держит заявленное КОНТРАКТАМИ, а не инструкциями агенту, но
  продуктом ещё не является. Проверено на клоне HEAD e3ae471 (2026-08-13). Что реально есть:
  JSON-Schema + сгенерированные типы, где `Evidence = {kind: artifact|event|approval|test|
  observation, ref, sha256?}`; `ApprovalV1` («content-bound approval») ТРЕБУЕТ по схеме
  prdDigest, specDigest и challenge — все sha256, плюс policyVersion, approver, decision
  (approved|rejected), runId и gate; универсальный результат операции — размеченное объединение
  success|failure|blocked с exitCode, reasonCode, why[], evidence[], stateChanged, retryable,
  recovery; транзакции файловых мутаций с `PathFingerprint` (kind file/directory/missing + size +
  sha256), фазовыми переходами (`assertPhaseTransition`) и решением о восстановлении; девять
  state-схем (approval, event, evidence, lock, migration, project-config, snapshot,
  transaction-manifest, transaction-progress). Дисциплина видна и в мелочах: git-раннер гасит
  пользовательский gitconfig, потому что чужой `status.showUntrackedFiles=no` «молча изменил бы
  набор изменений, который оценивает гейт». 97 тестовых файлов.
  ЧЕГО НЕТ (границы, важные для сравнения): проект сам объявляет себя Experimental и «not
  installable» — промоушен по evidence, не по датам; пакет adapters — файл в 3 строки, то есть
  интеграций с харнессами нет; у CLI разобраны только help/version, списка команд нет; git
  используется на чтение (наблюдение статуса), создания веток, коммитов и PR в коде не найдено;
  каталога гейтов нет — `gate` присутствует как идентификатор в одобрении, а не как реестр.
