statement: 'Тестирование на давлении у Superpowers формализовано до чек-листа: требуется
  комбинировать не менее трёх давлений одновременно («Best tests combine 3+ pressures»),
  типов давления семь — Time, Sunk cost, Authority, Economic, Exhaustion, Social,
  Pragmatic; сценарий обязан принуждать к конкретному выбору A/B/C с реальными путями
  файлов и без возможности уйти в «я бы спросил человека».'
