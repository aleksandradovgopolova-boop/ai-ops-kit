statement: >-
  Внешний стандарт словаря сущностей жизненного цикла существует и живёт с 2009 года: OSLC (Open
  Services for Lifecycle Collaboration), с 2013 под управлением OASIS. Он делит жизненный цикл на
  доменные спецификации — Requirements Management 2.1, Change Management 3.0, Quality Management
  2.1, Architecture Management 3.0, Asset Management 2.0, Automation 2.0, Performance Monitoring
  2.0 — и строится на REST + RDF + Linked Data, связывая артефакты РАЗНЫХ инструментов ссылками
  без дублирования данных. Значение для решения: разбиение «требование / изменение / проверка /
  архитектура» с обязательной трассируемостью — не изобретение, а зрелый отраслевой словарь; при
  этом OSLC решает задачу связывания ИНСТРУМЕНТОВ между собой, а не хранения истины в репозитории.
