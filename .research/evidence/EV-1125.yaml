statement: "import-linter 2.13 (03.07.2026, BSD-2-Clause, 1139 звёзд, коммит 11.08.2026) даёт типы контрактов, которых у собственного validate_layering кита нет: protected (модуль нельзя импортировать никому, кроме списка разрешённых) и acyclic_siblings (запрет циклов между соседями с параметром глубины), плюс exhaustive-проверку 'все слои объявлены'. Но: pytest-интеграции у него НЕТ (это CLI), JSON-вывода нет (открытая #291), программного API нет (#246), а кэш графа — по докам 'Caching isn't currently concurrency-safe'. Последнее прямо конфликтует с практикой этого репозитория: несколько сессий работают в одном дереве и параллельных worktree."
