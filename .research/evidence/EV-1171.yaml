id: EV-1171
request_id: RR-017
statement: >
  ЛОВ АДВЕРСАРИАЛЬНОГО JUDGE (round 1 RR-017): у ai-sdlc ЕСТЬ операционный контур принятия решений
  под другим именем — RFC-0035 «Decision Catalog / operator routing», status Draft, но
  lifecycle: Implemented (implementedBy AISDLC-285..295, 11 фаз). Он определяет ресурс Decision со
  схемой и каталогом-источником-истины, жизненный цикл proposed->open->deferred->answered->
  superseded->archived (то есть с суперсессией, как DP кита), скоринг Stage-A/B/C с учётом
  полноты evidence и корпусом примеров (decision-exemplars.yaml), НЕЗАВИСИМО порождаемую
  рекомендацию рамки с confidence, rationale и стил-мэн контр-аргументами (каталог не получает
  право выбора — он рекомендует), on-demand research-субагента, кладущего находки в вид решения, и
  калибровочную петлю по override'ам. Значение для кита: это ФАЛЬСИФИЦИРУЕТ широкое утверждение
  EV-1169/EV-1170, что «research-как-контракт-решений» — чистая уникальность кита. Осью различия
  остаётся лишь узкое: у кита накопление EV между прогонами с provenance/freshness/memory-first и
  writer≠judge НА САМИХ выводах исследования (RR->EV->DP как персистентная память фактов), тогда как
  RFC-0035 — движок routing'а и приоритизации решений; но «у соседа нет контура решений» — неверно.
