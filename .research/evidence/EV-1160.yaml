  ai-sdlc-framework/ai-sdlc существует как публичный репозиторий под Apache-2.0: основной язык
  TypeScript, описание «Declarative governance framework for AI-augmented software development
  lifecycles», создан 2026-02-07, последний push 2026-08-24, 99 звёзд, 1264 коммита на main,
  spec-версия v1alpha1. Монорепо (pnpm-workspace) с каталогами верхнего уровня: orchestrator,
  pipeline-cli, conformance, dogfood, research, spec, sdk-go, sdk-python, sdk-typescript,
  mcp-advisor, dashboard, ai-sdlc-plugin. Значение для кита: это прямой сосед по жанру, названный
  владельцем поимённо; ось пересечения с китом определяется дальше по коду, не по описанию.
