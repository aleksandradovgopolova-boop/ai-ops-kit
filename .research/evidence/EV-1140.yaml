statement: >-
  Модель продуктового репозитория у кита УЖЕ машиночитаема и УЖЕ замкнута в цикл:
  registry/product-operating-model.yaml (444 строки) объявляет восемь контуров
  (product_strategy, research_decisions, planning_execution, system_architecture, data_contracts,
  engineering_quality_security, delivery_operations, analytics_learning), у каждого — вопрос, на
  который он обязан отвечать, источник истины путями, сигналы изменения и роль-владелец; цикл
  замыкается обратно в product_strategy. Семь состояний артефакта (verified / user_confirmed /
  inferred / partial / stale / missing / unknown) отделяют «увидел» от «предположил» и от «не умею
  видеть». Модель имеет потребителей в коде: ai_ops_kit/planning/{contours,roadmap,repo_audit,
  delivery_plan}.py, validation/{validate_product_model,validate_own_medicine}.py, а гейт
  contour_consistency ИСПОЛНЯЕТСЯ в engine/execution_pipeline.py:914. То есть предложенный
  владельцем слой «репозиторий описывает не только код» реализован не как проза, а как реестр.
