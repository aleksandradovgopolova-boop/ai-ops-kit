statement: 'Маппинг ASI01–ASI10 на security-контур кита (self-evidence по файлам репозитория, 2026-07-25): СИЛЬНОЕ
  ПОКРЫТИЕ — ASI02 Tool Misuse: tool_broker + policy engine, 6 уровней permission-levels с кумулятивными правами
  и human approval, PackageCapabilityScope least-privilege (v3.4); ASI05 RCE: containers/ P0.2 jail, уровень execution
  с запретом destructive, разделение генерации и исполнения через gates; ASI08 Cascading Failures: fail-closed gates,
  lifecycle commit barrier, budget contracts, loop policy с no-progress detection, concurrency preflight, fix-loop
  caps; ASI09 Human-Agent Trust: writer≠judge как валидируемый инвариант, правило «домен нельзя закрыть фразой модели»,
  anti-rubber-stamp (v3.0.11), HITL conditions в доменах, честные capability-декларации. ЧАСТИЧНОЕ — ASI01 Goal
  Hijack: prompt-injection posture=implemented + контракты workflow, но нет intent-capsule/goal-integrity механизма;
  ASI06 Memory Poisoning: у research-модуля provenance/quote-verify/expiry/supersession реализованы с enforcement;
  у памяти кита конвенция ОБЪЯВЛЕНА (memory/README.md: источник/owner/дата проверки/условие устаревания), merge_memory.py
  эти поля пишет, validate_freshness.py даёт opt-in expiry — но ENFORCEMENT отсутствует: запись без provenance не
  отклоняется, freshness к memory/ не подключён, нет trust-scores и запрета re-ingestion своих выводов; ASI10 Rogue
  Agents: registry как источник истины (агент без записи = ошибка) + обязательные evals, но audit-log=partial и
  incident-killswitch=partial, watchdog-агентов нет. СЛАБОЕ/GAP — ASI03 Identity & Privilege: permission-levels
  есть, но нет per-agent identity и short-lived scoped credentials (secrets=implemented относится к хранению, не
  к TTL/ротации per-task); ASI04 Supply Chain: integrity-контроль managed-слоя УЖЕ есть (installer .checksums.json,
  sha256, блокировка drift), НО для ВНЕШНИХ артефактов его нет: pinned_revision (DP-106) никаким кодом не заполняется/не
  проверяется, внешние скиллы skills-catalog ставятся вручную на уровне child (installer их не касается), MCP=declared
  — пути верифицированной установки внешних деклараций не существует (posture: tool-mcp-connection=declared, supplier-control=partial);
  ASI07 Inter-Agent Comm: RunHandoff-контракты со схемами дают семантическую валидацию, но подписи/mTLS нет — смягчено
  локальной однохостовой моделью (применимость ограничена, станет актуальным при федерации).'
