statement: >
  Три режима глубины с разной ценой по времени: quick — минуты, для CI и проверки pull request;
  standard — 30-60 минут, для регулярных обзоров; deep — 1-4 часа в зависимости от сложности цели,
  и именно deep является режимом ПО УМОЛЧАНИЮ. В белоящичном варианте standard использует
  source-aware разметку и статическую триагу для приоритизации динамической валидации, а deep
  дополнительно гоняет широкую статическую триагу (semgrep, структурный поиск по AST, секреты,
  проверки цепочки поставок) и затем систематически проверяет кандидатов динамически. Рекомендация
  самих авторов по частоте: quick на каждый PR, standard еженедельно, deep перед крупным релизом.
