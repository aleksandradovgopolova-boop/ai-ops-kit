statement: 'УТОЧНЕНИЕ порядка процесса против входящего: цепочка Superpowers — семь
  шагов, и worktree идёт ТРЕТЬИМ по счёту, ДО написания плана: 1) brainstorming, 2)
  using-git-worktrees, 3) writing-plans, 4) subagent-driven-development или executing-plans,
  5) test-driven-development, 6) requesting-code-review, 7) finishing-a-development-branch.
  Отдельного шага «verification» в цепочке нет — контроль несёт requesting-code-review;
  навык verification-before-completion существует в библиотеке, но в семишаговый список
  не входит.'
