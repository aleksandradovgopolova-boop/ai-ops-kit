statement: >-
  Словарь сущностей и связей у кита ТОЖЕ уже есть — registry/entities.yaml объявляет 15 типов
  узлов (goal, initiative, epic, feature, story, design, api, analytics, dashboard, documentation,
  release, metric, incident, experiment, insight) и 21 допустимую связь (contains, specified-by,
  measured-by, delivered-by, observed-by, caused, affects, validates, derived-from, feeds и др.),
  а schemas/knowledge-graph.schema.json задаёт форму графа. НО у этого словаря нет ни одного
  потребителя в продуктовом пути: в проверенном охвате (.github/workflows/, quality/gates.yaml,
  registry/workflows.yaml, весь ai_ops_kit/) validate_knowledge_graph.py не вызывается ниоткуда —
  ссылки на него есть только в tests/unit/, docs/QUICKSTART.md, FILE_INDEX.md и CHANGELOG.
  Ни один workflow не перечисляет граф в quality_gates, ни один гейт не называет его валидатором.
  Оговорка охвата: утверждение отрицательное, проверено grep'ом по перечисленным путям 19.08.2026;
  «не найдено» здесь означает «не найдено в этих путях», а не «невозможно».
