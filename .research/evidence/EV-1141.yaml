statement: >-
  Словарь сущностей и связей у кита есть — registry/entities.yaml объявляет 15 типов узлов и
  20 допустимых связей, schemas/knowledge-graph.schema.json задаёт форму графа. Потребитель у
  графа СУЩЕСТВУЕТ, но необязательный: ai_ops_kit/lifecycle/run_report.py:54 (graph_findings)
  читает knowledge/graph.yaml и добавляет находки в отчёт прогона, причём граф подаётся
  необязательным флагом --graph; registry/workflows.yaml:215 и :277 называют граф в
  archive_criteria. Чего у графа НЕТ — обязательности: валидатор validate_knowledge_graph.py
  в проверенном охвате (.github/workflows/, quality/gates.yaml, registry/workflows.yaml,
  ai_ops_kit/) не вызывается ниоткуда, кроме тестов и документации, и ни один гейт не называет
  граф своим источником истины. Первая редакция этого доказательства утверждала «нет ни одного
  потребителя» — утверждение опровергнуто независимым судьёй и здесь исправлено.
