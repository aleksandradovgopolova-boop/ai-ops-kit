statement: 'КЛЮЧЕВОЙ ФАКТ для оценки срочности: новая модель согласования версий НЕ
  требует одномоментной миграции экосистемы. Версия объявляется в каждом запросе (ключ
  io.modelcontextprotocol/protocolVersion в _meta, на Streamable HTTP дублируется заголовком
  MCP-Protocol-Version), сервер принимает или отклоняет каждый запрос независимо; клиенты
  и серверы МОГУТ поддерживать несколько версий протокола одновременно; при неподдерживаемой
  версии сервер отвечает UnsupportedProtocolVersionError со списком поддерживаемых, и
  клиент повторяет запрос совместимой версией. Вызов server/discover для клиента ОПЦИОНАЛЕН
  (обязателен он для сервера — как реализация RPC). Для ревизий 2025-11-25 и ранее спека
  отдельно документирует обратную совместимость с handshake-моделью. Версии — строки YYYY-MM-DD,
  инкрементируются только при обратно НЕсовместимых изменениях; текущая Current — 2026-07-28.'
