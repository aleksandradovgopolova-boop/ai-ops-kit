statement: >
  Поставляется headless-раннер `unreal-agent-runner`: принимает JSON-запрос (аргументом, из stdin
  или `-p 'промпт'`), пишет события в stdout как JSONL и завершается по окончании задачи. Ставится
  `go install` либо запускается образом `unrea1labs/unreal-agent` (Linux amd64/arm64) с
  примонтированным рабочим каталогом; релизы публикуют git-тег для пиннинга версии. Провайдер
  выбирается переменной `UNREAL_HARNESS_LLM_PROVIDER` из набора openai, openai-codex, openrouter,
  fireworks, ollama; модель — `UNREAL_HARNESS_LLM_MODEL`. Рабочий каталог задаётся `-workspace`.
