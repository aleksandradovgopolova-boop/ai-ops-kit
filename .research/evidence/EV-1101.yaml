statement: >
  У Galileo Agent Control ЕСТЬ публичный исходный код, доступный для чтения и заимствования:
  репозиторий agentcontrol/agent-control под Apache-2.0 (организация agentcontrol, не rungalileo),
  создан 2026-01-30, 289 звёзд, 44 форка, последний релиз v8.4.0 от 2026-07-27, push 2026-08-11.
  Самоописание — «Centralized agent control plane for governing runtime agent behavior at scale.
  Configurable, extensible, and production-ready», топики guardrails / runtime-guardrails / ai-safety.
  В той же организации ещё два репозитория: openclaw-plugin (Apache-2.0, 32★) и docs-agent-control.
  Значение для кита: сосед, о котором раньше судили по маркетинговой странице (EV-663, пункт 2),
  теперь читается кодом; ось пересечения (runtime-guardrails или delivery-lifecycle) НЕ определена —
  это вопрос RR-014, а не вывод этого evidence.
