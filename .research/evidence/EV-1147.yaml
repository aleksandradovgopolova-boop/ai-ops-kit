statement: >-
  Закон наследования у кита уже выведен полем и оплачен дважды, обе цены названы в самом реестре.
  (1) Кит объявлял `**/entities/**` сигналом модели данных; в проекте на Feature-Sliced Design
  (обкатка niti) `entities` — слой интерфейса, и это дало 6 ложных находок из 9. Лечение — не
  правка кита, а право дочки спорить: change_signals_remove и change_signals_replace в
  .ai-ops.yaml (v3.35.2). (2) Кит объявлял decisions/registry.yaml источником истины контура
  решений; в ИИ-Среде решения лежат в docs/architecture/decisions/, объявленного китом файла нет —
  и находка «истина не обновлена» срабатывала вечно: 12 находок из 41. Лечение — право дочки
  объявить СВОЙ source_of_truth. Общее правило, подтверждённое двумя замерами: baseline, который
  нельзя переопределить, производит не дисциплину, а ложные срабатывания.
