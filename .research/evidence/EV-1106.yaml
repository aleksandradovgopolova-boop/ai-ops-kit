statement: >
  Ответ на вопрос RR-014: вывод EV-673 ОСТАЁТСЯ В СИЛЕ, но его формулировку нужно сузить в двух
  местах — не потому, что появился более сильный конкурент, а потому что выборка была собрана
  по слову «control plane», а не по оси.
  (1) Galileo Agent Control из конкурентной выборки следует ИСКЛЮЧИТЬ: по коду он про рантайм-
  ограничение шагов агента (deny/steer/observe), а не про жизненный цикл доставки (EV-1103).
  Совпадает только имя жанра. Это меняет смысл EV-1101: публичный код у Galileo есть, но он не
  делает его соседом кита по существу.
  (2) mestre-yoda (EV-1104) — самый близкий по КОНТРАКТАМ из всех виденных: evidence с sha256,
  безусловно content-bound одобрение, транзакция мутаций с отпечатками путей. Но продуктом он не
  является по собственному объявлению («Experimental», «not installable»), интеграций с
  харнессами нет (adapters — 3 строки), каталога гейтов нет, доставки в git (ветка/коммит/PR) в
  коде нет. Поэтому он не опровергает «кит — единственный с полной реализацией», а показывает,
  что контрактный слой цепочки воспроизводим независимо и уже воспроизведён дважды
  (multi-agents-control-plane, EV-670; теперь mestre-yoda).
  Практическое следствие для дифференциации: защищает кит не идея цепочки — она повторяется — а
  то, что у него работает end-to-end и проверено на себе. Это ровно то, что EV-673 и утверждает,
  поэтому суперсидить его не нужно; достаточно этой записи как уточнения охвата.
