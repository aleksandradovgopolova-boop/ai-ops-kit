statement: 'Minimal Agent Runner в ките СУЩЕСТВУЕТ: tools/tool_loop.py реализует петлю
  «модель предлагает действие → Policy решает → Broker исполняет → Evidence в контекст»
  с потолками budget/max_steps, а запрещённое действие возвращается модели как DENIED.
  Ключевое отличие от эталона mini-swe-agent — не наличие петли, а то, что решение
  о допустимости действия принимает не модель.'
