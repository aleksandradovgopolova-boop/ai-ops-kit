statement: >
  ai-sdlc позиционирует себя как «Decision Engine для spec-driven AI workflows» — половину
  execution-and-governance спек-ориентированного стека. Тезис — cost asymmetry: решения оператора,
  принятые заранее с полным контекстом, дёшевы и в основном верны, а решения ИИ в исполнении под
  неопределённостью дороги и часто ошибочны; ценность рамки не «ИИ пишет код», а «ИИ детерминированно
  исполняет хорошо специфицированные контракты». Роль оператора смещается к «decision steward»:
  сформулировать открытые вопросы, разрешить их, подписать, наблюдать конвейер. ai-sdlc покрывает
  половину contract -> shipped; фронт idea -> contract закрывает GitHub Spec Kit, стык — по
  RFC-0036. Значение для кита: это НЕ code-generator-сосед; заявленная ось — governance доставки,
  ровно поле кита.
