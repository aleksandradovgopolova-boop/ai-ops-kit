statement: "Из четырёх мутационных инструментов для Python два мертвы: mutatest 3.1.0 — последний релиз 20.02.2022, последний коммит 17.02.2023; pytest-mutagen 1.3 — последний релиз и коммит 24.07.2020, 5 звёзд. При этом модель pytest-mutagen — ближайшая к тому, что нужно киту: мутант объявляется явно и адресно (@mg.mutant_of), к нему привязаны тесты, а --mutagen-stats показывает, СКОЛЬКО тестов поймало каждого мутанта. То есть нужную модель придётся держать своей — реестр проб кита её уже реализует."
