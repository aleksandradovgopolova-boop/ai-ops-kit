statement: 'Copilot в Power BI требовал ёмкость Fabric F64 (~$5,250/мес) или Premium
  Per User; с 30.04.2026 Microsoft открывает Copilot/AI для всех платных SKU от F2
  — порог входа в text-to-dashboard резко снижается. Для триады важно: полноценный
  дашборд-Copilot лицензируется ОТДЕЛЬНО от M365 Copilot.'
