statement: 'Переносимость навыков Superpowers обеспечена не единым форматом, а установкой
  ПОД КАЖДЫЙ харнесс отдельно: README перечисляет 11 поддерживаемых (Claude Code,
  Antigravity, Codex App, Codex CLI, Cursor, Factory Droid, Gemini CLI, GitHub Copilot
  CLI, Kimi Code, OpenCode, Pi) и прямо предупреждает, что при использовании нескольких
  надо ставить отдельно для каждого. Версионирование — на уровне всего плагина (6.2.0
  на 2026-07-29 в package.json, plugin.json и RELEASE-NOTES), собственных версий у
  отдельных навыков нет.'
