statement: >
  ratchet (0xwilliamortiz, MIT, создан 2026-07-31, 431★) — механизм in-session gate,
  которого у кита нет. Хук PostToolUse срабатывает после каждого действия агента (Edit,
  MultiEdit, Write), анализирует diff, измеряет метрики (строки, файлы, зависимости,
  дубликаты символов, stdlib vs самописное, wrapper, yagni) и возвращает вердикт в сессию.
  Вердикты: certain (точный парсинг, блокировка в strict), likely (структурный анализ),
  heuristic (regex). Детекторы: dep, exists, stdlib, native, wrapper, yagni, validation,
  budget. Не конкурент киту, а дополнение: замыкание петли на соблюдение правил в момент
  правки, а не на ревью.
