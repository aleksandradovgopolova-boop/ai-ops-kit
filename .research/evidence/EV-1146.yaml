statement: >-
  Словаря типов коммитов в ките нет вообще: grep по rules/, docs/, registry/, templates/ на
  'conventional commit', 'commit_type', 'тип коммита' 19.08.2026 не дал ни одного совпадения.
  То есть предложение владельца пересобрать список префиксов не конкурирует с действующим
  правилом — правила нет; при этом сама работа кита уже размечается по контурам, ролям и целям,
  и именно там живёт классификация изменений. Оговорка охвата: проверены четыре названных дерева
  на текущей версии 3.36.12; в шаблонах CI дочек отдельная проверка не проводилась.
