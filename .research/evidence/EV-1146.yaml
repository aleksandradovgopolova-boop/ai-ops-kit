statement: >-
  Словарь типов коммитов в ките УЖЕ ПРИНЯТ и уже исполняется, причём за день до этого
  исследования. pyproject.toml:206 объявляет [tool.commitizen] name = "cz_conventional_commits";
  секция [tool.ai_ops.release_gates] задаёт точку включения commit_format_enforced_after =
  "62cefc1", дата 2026-08-18; CI кита (.github/workflows/package-quality.yml:110-126) исполняет
  `cz check --rev-range` от этой точки, считая код 3 («в диапазоне нет коммитов») законным
  результатом. Решение владельца 17.08.2026 ограничило правило только НОВЫМИ коммитами: в истории
  72 коммита без conventional-префикса из 594, и правило, требующее переписать историю, не введут
  никогда. В дочерние репозитории этот инструмент не едет — DP-114 фиксирует, что commitizen
  живёт в CI родителя. Первая редакция утверждала «словаря типов коммитов в ките нет вовсе»;
  утверждение опровергнуто независимым судьёй — grep писателя покрывал rules/docs/registry/
  templates/ и не мог увидеть pyproject.toml.
