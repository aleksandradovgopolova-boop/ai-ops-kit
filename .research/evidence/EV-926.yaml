statement: 'РАСХОЖДЕНИЕ С ВХОДЯЩИМ по формату траектории: mini-swe-agent пишет НЕ
  список шаговых записей {step, model_response, action, observation, cost, duration_ms},
  а единый .traj.json — {info: {model_stats: {instance_cost, api_calls}, config, mini_version,
  exit_status, submission}, messages: [...], trajectory_format: "mini-swe-agent-1.1"},
  где messages — линейная история в OpenAI chat format. Пошаговые данные лежат в поле
  extra конкретного сообщения: у assistant — actions, cost, timestamp, response; у
  наблюдения — returncode, timestamp. Поля duration в записи шага нет.'
