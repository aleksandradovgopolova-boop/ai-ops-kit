statement: 'Beads — MIT, но НЕ «git-ориентированный трекер» в смысле файлов в репозитории:
  источник истины — база Dolt (версионируемая SQL-БД с cell-level merge и ветвлением),
  а .beads/issues.jsonl объявлен экспортом для просмотра и обмена, не источником истины
  и не бэкапом. Механики ledger подтверждены: атомарный захват задачи (bd update --claim
  ставит assignee + in_progress), типы связей (relates-to, duplicates, supersedes,
  replies-to), иерархические id (эпик → задача → подзадача), блокировки по зависимостям.
  Отдельный демон не нужен во встроенном режиме, но встроенный Dolt всё равно тянется
  как зависимость — это подтверждает опасение входящего про «движение в сторону платформы
  хранения».'
