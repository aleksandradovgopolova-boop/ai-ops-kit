statement: >
  НАША сторона, граница: замером 18.09.2026 установлено, что оркестрация, git и клоны у кита идут
  параллельно, но шаг ПИСАТЕЛЯ — вложенный `claude -p` без API-ключа — упирается в один локальный
  writer на машине (машинный замок сериализации: параллельные `claude -p` на одном локальном Клоде
  деадлочат), поэтому само написание кода в пакетах сериализуется, даже когда клоны и гейты
  параллельны. Замер прямо называет это стоящей границей раздела ROADMAP «Later» («параллельные
  писатели») и перечисляет ЕДИНСТВЕННЫЕ выходы: API-ключ, субагентный фан-аут (отдельные инстансы)
  либо несколько машин — а НЕ дополнительная постройка в ките.
