statement: >
  Galileo Agent Control (agentcontrol/agent-control, Apache-2.0) по КОДУ работает на другой оси,
  чем кит: его единица контроля — вызов шага агента в рантайме, а не артефакт доставки.
  Проверено на клоне HEAD 45dea6d (2026-08-11): `Step` объявлен как «Runtime payload for an agent
  step invocation» с полями type ('tool'|'llm'), name, input, output, context; решение по шагу —
  `ActionDecision = Literal["deny", "steer", "observe"]`; встроенные оценщики — json, list, regex,
  sql (сопоставление содержимого). Понятий репозитория, коммита, ветки, PR, расписки и evidence
  в коде нет: 'repository' и 'pull request' — 0 файлов, 15 совпадений 'commit' — это
  `autocommit_block` миграций Alembic, 4 совпадения sha256 — хеширование api-ключа и подпись
  HMAC. Слово 'gate' в 46 файлах оказалось подстрокой 'aggregated'; как понятие оно не заведено.
