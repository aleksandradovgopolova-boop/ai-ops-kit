id: EV-1189
request_id: RR-021
statement: >
  Машинный контракт прогона (из руководства для агентов, написанного самими авторами): headless-
  режим `strix -n`, коды возврата 0 — чисто, 1 — фатальная ошибка, 2 — уязвимости найдены.
  Артефакты в `strix_runs/<run-name>/`: penetration_test_report.md, vulnerabilities/*.md,
  vulnerabilities.json, findings.sarif (SARIF 2.1.0) и run.json со статусом и llm_usage.cost.
  Есть бюджет прогона (`--max-budget`). КРИТИЧЕСКИ ВАЖНОЕ для нас место — авторы сами
  ограничивают смысл нуля: ноль покрывает только то, что было проанализировано, и прежде чем
  называть прогон чистым, следует проверить run.json (статус и израсходованный бюджет против
  лимита). То есть инструмент штатно различает «чисто» и «не дошли» и не выдаёт второе за первое.
