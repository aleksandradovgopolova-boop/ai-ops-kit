statement: "copier 9.17.1 (тег 04.08.2026, MIT, 3.5k звёзд, push 14.08.2026) закрывает все три части боли доставки: (1) copier update снимает диф фактического состояния дочки, обновляет до новой версии шаблона и переналагает диф, конфликты — маркерами как у git merge или .rej-файлами; (2) _migrations в copier.yml — команды с диапазоном версий PEP 440, срабатывают при new >= declared > old (то есть при прыжке через версии проходят ВСЕ промежуточные), только при update и никогда при первом copy, с $STAGE/$VERSION_FROM/$VERSION_TO в окружении; (3) copier check-update --quiet отдаёт exit 0 если актуально и exit 2 если дочка отстала — это готовый гейт в CI дочки. Гейт появился недавно: v9.13.0 от 05.03.2026. Существующие дочки принимаются без пересоздания (copier copy поверх готового git-проекта), и answers-файл можно вынести в .ai/, чтобы не конфликтовать с шаблонами самой дочки."
