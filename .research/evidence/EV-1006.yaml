statement: 'Второй задекларированный сервер — huggingface/hf-mcp-server (MIT, 269 звёзд,
  создан 2025-05-06, push 2026-07-30, 13 открытых issues) — активно шевелился ровно
  вокруг даты ревизии: v0.4.0 и v0.4.1 (2026-07-27), v0.4.2 (2026-07-28), v0.4.3 и v0.4.4
  (2026-07-30), причём формулировки согласуются с новой моделью подписок и метрик протокола
  («align MCP settings and improve protocol metrics», «chart exact MCP protocol adoption»,
  «reject persistent subscription listeners», «align progress handling with modern SDK»).
  НЕГАТИВНОЕ УТВЕРЖДЕНИЕ с квалификатором: в release notes v0.4.0-v0.4.4 целевая ревизия
  протокола ЯВНО НЕ НАЗВАНА — «не заявлено в release notes» не значит «не поддерживается»;
  проверялись только тела релизов, не код, не CHANGELOG-файл и не capability-ответы сервера.'
