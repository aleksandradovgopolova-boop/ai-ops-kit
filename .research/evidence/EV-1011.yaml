statement: 'ВЫВОД О РАСПРЕДЕЛЕНИИ ЛОМКИ (главный ответ на вопрос 1 RR-012): протокольные
  изменения ревизии 2026-07-28 несут реализаторы MCP-клиента (раннтайм) и MCP-сервера,
  а не кит. Роль кита в MCP-контуре — декларант и потребитель: он объявляет протокол
  и два сервера в реестрах, назначает им permission_level и пиновку, но не реализует
  ни клиент, ни сервер (EV-1009, EV-1010). Механика per-request согласования версий с
  правом обеих сторон поддерживать несколько версий одновременно и с документированной
  обратной совместимостью с handshake-ревизиями (EV-1002) означает, что одномоментной
  миграции экосистемы не требуется; окно не менее 12 месяцев до earliest removal 2027-07-28
  для Roots/Sampling/Logging/DCR (EV-1003, EV-1004) снимает срочность. Практически:
  один из двух задекларированных серверов уже на новой ревизии (EV-1005), второй активен
  и, судя по формулировкам релизов, движется туда же, но явного заявления не дал (EV-1006).
  ЧТО ОСТАЁТСЯ РЕАЛЬНЫМ ДЕФЕКТОМ КИТА, а не экосистемы: (а) декларации MCP булевы —
  «mcp: true» у шести раннтаймов и status: documented у протокола не выражают, о какой
  ревизии речь, то есть капабилити объявлена без измерения, которое теперь определяет
  совместимость; (б) проверить эту декларацию по документации поставщика нельзя — раннтайм
  реализуемую ревизию не публикует ни в доке, ни в CHANGELOG (EV-1007, EV-1008), значит
  status: documented для mcp сейчас опирается на факт наличия функции, а не на проверяемую
  версию; (в) SupplyChainPinPolicy пинует идентичность артефакта, но не ревизию протокола,
  и расширение требует правки схемы с additionalProperties: false (EV-1010); (г) единственный
  срок, который может наступить раньше окна 2027-07-28, — снятие транспорта HTTP+SSE
  («через три месяца после Final у SEP-2596», EV-1003), а SSE у нас нигде не зафиксирован
  как выбранный транспорт: в реестрах транспорт вообще не декларируется, дока раннтайма
  его уже отговаривает (EV-1007) — то есть риск есть, но он не в наших данных, а в конфигурации
  child-репозиториев, которую мы не видим.'
