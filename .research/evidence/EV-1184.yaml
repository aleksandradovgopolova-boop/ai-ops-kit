statement: >
  НАША сторона, контракт исполнителя: в реестре рантаймов у claude-code записан путь
  kit_driven_executing со статусом verified — кит сам оркестрирует внешнего писателя через
  локальный `claude -p`, писатель только ПРЕДЛАГАЕТ действия текстом, а worktree, diff, evidence,
  гейты и доставка остаются за китом (писатель не пушит, не создаёт PR, не меняет основной
  checkout, не закрывает собственное ревью и не владеет жизненным циклом). Там же назван общий
  контракт: «AI Ops = control plane; Claude Code = сильный заменяемый исполнитель». То есть точка
  подключения ЛЮБОГО стороннего писателя в ките уже существует и описана, а не проектируется.
