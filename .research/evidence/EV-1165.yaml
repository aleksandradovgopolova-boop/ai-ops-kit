statement: >
  Delivery-транзакция и durable lifecycle у ai-sdlc есть по коду, но автономный оркестратор
  помечен экспериментальным. `cli-orchestrator tick` обходит граф зависимостей, прогоняет фильтры
  допуска, диспатчит задачи в изолированные git-worktree, гоняет конвейер Step 0-13, «карантинит»
  провалы и возобновляется с checkpoint-коммитов при прерывании; PR «открываются сами». Полный
  автономный режим включается флагом AI_SDLC_AUTONOMOUS_ORCHESTRATOR=experimental — то есть
  механизм реализован (execute.ts 64 КБ, состояние в orchestrator/src/state, execute.head-restore
  и execute.push-rebase тесты), но по собственной пометке автора ещё не в общем доступе. Значение
  для кита: delivery-транзакция и возобновляемость воспроизведены, зрелость автономного контура —
  экспериментальная, что снижает силу вывода «реплицировано в проде», не отменяя «реплицировано
  кодом».
