statement: 'Полный список ASI01–ASI10: ASI01 Agent Goal Hijack (манипуляция целями/задачами/decision
  pathways); ASI02 Tool Misuse and Exploitation (небезопасное применение легитимных
  инструментов в рамках полномочий); ASI03 Identity and Privilege Abuse (эксплуатация
  делегирования/ролей/кэшированных кредов); ASI04 Agentic Supply Chain (скомпрометированные
  компоненты, вкл. runtime MCP/A2A и реестры); ASI05 Unexpected Code Execution/RCE
  (код-генерация → побег из sandbox); ASI06 Memory & Context Poisoning (отравление
  памяти/embeddings/RAG между сессиями); ASI07 Insecure Inter-Agent Communication
  (перехват/спуфинг межагентных сообщений); ASI08 Cascading Failures (единичный сбой
  → системный ущерб по автономным агентам); ASI09 Human-Agent Trust Exploitation (эксплуатация
  чрезмерного доверия человека агенту); ASI10 Rogue Agents (вредоносные/сошедшие со
  скоупа агенты).'
