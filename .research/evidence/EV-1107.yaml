statement: "CI кита за всю историю: 1208 прогонов, 67 падений (5.5%). 44 из 67 падений (66%) пришлись на трёхдневное окно 05-07.08.2026 — дни, когда контур ЧИНИЛИ (включение линтера, правка тестов-пустышек). За 14-17.08.2026 — 163 прогона и НОЛЬ падений; в те же четыре дня живые прогоны на чужих репозиториях дали 34 находки (BNBM 14 + пере-прогон BNBM 14 + Окошко 6), плюс 6 находок 15.08 (F-030..F-035). Вывод замера: CI не является фильтром для того класса дефектов, который стоит денег — он краснеет почти исключительно на своей собственной настройке."
