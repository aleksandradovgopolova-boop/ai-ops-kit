statement: >
  САМО-EVIDENCE (о собственном коде кита — помечено для спот-чека судьи). Прямое сравнение по
  одному механизму, где сосед сильнее: привязка человеческого одобрения к содержимому.
  У кита `ApprovalRecord` (ai_ops_kit/gates/approvals.py) хранит approval-домен, approved_by,
  scope, reason, created_at и поддерживает `binds_to` (хеш плана/спеки), `expires_at`, `risk` и
  `source` из доверенного контекста. Но полнота связывания УСЛОВНА: `binds_to`/`expires_at`/`risk`
  обязательны только при strict=True, то есть для доменов с severity high/critical и для
  destructive; для остальных доменов они «проверяются при наличии поля», а CLI-запись по
  умолчанию ставит revision='-'. У mestre-yoda (EV-1104) связывание БЕЗУСЛОВНО: prdDigest,
  specDigest и challenge — required-поля схемы для любого одобрения.
  Обратное тоже верно и в пользу кита: у него есть срок годности одобрения (`expires_at`),
  ранжирование по риску и требование, чтобы identity приходил из доверенного источника, а не
  из произвольной строки модели, — ничего из этого в схеме соседа нет (approver там просто id).
  То есть ни одна сторона не доминирует; заимствуемая идея одна и конкретная — сделать привязку
  к содержимому безусловной, а не привилегией high-risk доменов.
