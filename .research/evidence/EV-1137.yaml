statement: "Из шести рассмотренных инструментов выпуска официальный гейт 'в этой ветке добавлена запись для changelog' есть ТОЛЬКО у towncrier: towncrier check берёт git diff --name-only относительно базовой ветки (по умолчанию origin/main, переопределяется --compare-with, --staged добавляет staged), при отсутствии фрагментов печатает 'No new newsfragments found on this branch' и выходит с кодом 1; падает и на невалидном имени фрагмента; изменение самого news-файла считается за проверку и даёт exit 0. Модель фрагментов решает проблему 364 КБ файла структурно: правки идут в разные новые файлы, а не в одну строку общего, и ретро-миграция старого файла НЕ нужна — он остаётся как есть. Цена: towncrier 25.8.0 выпущен 30.08.2025, релизов почти год не было при живом trunk (коммит 15.08.2026); версию он не считает и файлы версий не бампает."
