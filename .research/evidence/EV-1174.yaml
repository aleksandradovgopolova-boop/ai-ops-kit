statement: >
  «Async-first» — не маркетинговое слово, а наблюдаемая семантика, закреплённая в системном
  преамбуле, который харнес вшивает в контекст модели: вызовы инструментов стартуют немедленно и
  идут в фоне, ни один не блокирует модель; по завершении результат дописывается и БУДИТ новый ход;
  результаты, пришедшие вместе, приходят одним ходом; ход без вызовов при активных вызовах = сон до
  первого результата, ход без вызовов при пустой очереди = конец сессии. Отдельно заведён heartbeat:
  если вызовы активны и десять минут ничего не происходит, модель будят проверить состояние.
  Модели прямо предписано идти ВШИРЬ: независимые команды — одним ходом, а не цепочкой ходов.
