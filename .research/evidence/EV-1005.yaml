statement: 'Первый из двух задекларированных китом MCP-серверов уже на новой ревизии
  и опередил нас: github/github-mcp-server (MIT, 31.9k звёзд, push 2026-07-30, не архивирован)
  в релизе v1.7.0 от 2026-07-23 — то есть ДО публикации финальной ревизии — заявил включение
  изменений спеки 2026-07-28 через обновление go-sdk до 1.7.0-pre.3; предыдущий v1.6.0
  (2026-06-27) содержал «upgrade go-sdk to v1.7.0-pre.1 (new MCP spec)». В release notes
  v1.5.0-v1.8.0 упоминаний sampling/roots/logging нет. Вывод для кита: по записи github-mcp
  в registry/tools.yaml миграционного действия не требуется — поставщик несёт протокол
  сам.'
