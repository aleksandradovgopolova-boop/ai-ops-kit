statement: >
  Источник EV-672 исчез: репозиторий 0xwilliamortiz/ratchet и ВЕСЬ аккаунт владельца
  недоступны — GitHub API отдаёт 404 и на /repos/0xwilliamortiz/ratchet, и на
  /users/0xwilliamortiz; прямой HTTP по обоим адресам — 404; второй репозиторий того же
  владельца (openclaw-improved), видимый в поисковой выдаче, тоже 404. Поиск по дословной
  формулировке описания («Your agent reads the rules» в in:description) даёт 0 результатов —
  переименованного репозитория или форка-наследника под тем же описанием нет; одноимённые
  проекты в выдаче (Neerav-Gupta/Ratchet, пакет npm ratchet-cc) — другие продукты с другим
  описанием. На 2026-08-05 репозиторий имел 431 звезду и был верифицирован чтением кода.
  Следствие: механизм in-session gate из EV-672 больше не воспроизводим по первоисточнику.
