statement: "Кросс-файловые инварианты и ссылочная целостность схемой JSON Schema не выражаются в принципе: $ref черновика 2020-12 композирует СХЕМЫ, а не данные, а check-jsonschema валидирует каждый файл независимо. Yamale тоже нет — его include это переиспользование схемы. То есть правила вида 'id уникальны по каталогу', 'write_scope указывает на живой путь', 'ссылка из плана существует в реестре' останутся кодом при любом переходе на схемы. Отдельно официальные доки jsonschema сами признают слабость сообщений на union-типах: для anyOf/oneOf 'The error messages in this situation are not very helpful on their own' — читаемость придётся дожимать через context и best_match."
