statement: 'LocalEnvironment выполняет каждое действие как НЕЗАВИСИМЫЙ bash-вызов
  без сохранения состояния оболочки: subprocess.Popen(shell=True) со start_new_session
  на posix, stderr сливается в stdout, по таймауту убивается вся группа процессов;
  возвращается dict {output, returncode, exception_info}. Это подтверждает декларацию
  «every action is completely independent» — свойство, которое и делает перенос цикла
  между окружениями дешёвым.'
