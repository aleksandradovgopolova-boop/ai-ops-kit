statement: >-
  ЗАМЕР СВЯЗЕЙ на собственном плане кита (dogfood, 19.08.2026) и ЕГО ПРАВИЛЬНОЕ ПРОЧТЕНИЕ.
  Из 42 закрытых работ (history/plan-history.yaml): 42 имеют цель (goal), 42 — названный результат,
  42 — место перепроверки (pr 24 / evidence 13 / commit 12, объединение 42/42). Поля-связки
  decision и finding заполнены 0 раз из 42. Среди 28 активных: goal 28/28, affects 28/28,
  evidence 7/28. РЕШАЮЩЕЕ НАБЛЮДЕНИЕ, без которого числа читаются неверно: полнота заполнения
  совпадает не с направлением связи, а с наличием проверки. ai_ops_kit/planning/delivery_plan.py
  требует ошибкой goal (:389-395), result и место перепроверки у закрытой работы (:196-207),
  существование контура в affects (:400-402) и резолвимость пути в evidence/finding (:375-379).
  Поля decision и finding ОБЪЯВЛЕНЫ в том же файле (:58 LINK_KEYS) и не требуются ничем — и они
  пусты. То есть заполняется ровно то, что проверяется. Первая редакция утверждала, что поля для
  основания в схеме работы нет вовсе; это опровергнуто судьёй и здесь исправлено.
