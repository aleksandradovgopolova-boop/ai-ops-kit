statement: >-
  ЗАМЕР СВЯЗЕЙ на собственном плане кита (dogfood, 19.08.2026): вперёд цепочка сомкнута, назад —
  почти нет. Из 42 закрытых работ (history/plan-history.yaml) 42 имеют цель (goal), 42 — названный
  результат (result), 42 — проверяемое место исхода (pr 24 / evidence 13 / commit 12, объединение
  42/42). Обратную связь «на каком основании это взято» машиночитаемо не несёт НИ ОДНА: поля
  because_of / decision / research в схеме работы нет, а решение или исследование (ep-*, DP-*,
  RR-*, ADR-*) упоминается хоть в каком-нибудь ПОЛЕ лишь у 5 из 42 закрытых и у 1 из 28 активных
  работ. При этом основание в файлах ЕСТЬ — прозой в комментариях: 748 комментариев из 1182 строк
  активного плана и 906 из 1923 строк истории. Вывод замера: кит уже пишет «почему», но пишет это
  в форме, которую его собственный код прочитать не может.
