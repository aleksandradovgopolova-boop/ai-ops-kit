statement: >
  super-simple-software-factory (disler, MIT, создан 2026-07-31, 410★) воспроизводит
  ключевую мысль кита: детерминированный Python владеет последовательностью и приёмкой.
  Типизированные envelope (EnvelopeBase) на стыках фаз — JSON-объект парсится и сохраняется
  как envelope.json, внедряется в промпт следующего агента. SQLite-трейс (sssf.db) — все
  события записываются в реальном времени через WAL. Gates as DoD — функции проверки после
  работы агента, но до завершения фазы; фаза успешна только если все гейты зелёные.
  Распространяется как Claude Code Skill (.claude/skills/sssf/).
