statement: >
  У продукта есть управляемый облачный путь (app.strix.ai), в котором исходный код рабочего дерева
  ЗАГРУЖАЕТСЯ к вендору: «отправьте локальное рабочее дерево в управляемый белоящичный сканер».
  Загрузка устроена аккуратно — двухшаговое подтверждение по sha256 (сначала `--dry-run
  --show-files --json`, человек сверяет манифест и фиксирует хэш, затем повторный запуск с
  `--approve-sha256`; изменившийся снимок отвергается), по умолчанию исключаются .git, скрытые
  файлы, симлинки, сборочные артефакты, файлы с секретоподобными именами и вложенные архивы, есть
  .strixignore и лимиты (20 000 файлов, 25 МиБ на файл, 250 МиБ в распакованном виде). Но факт
  остаётся фактом: в облачном режиме код дочки покидает периметр владельца, и это решение
  владельца, а не кита.
