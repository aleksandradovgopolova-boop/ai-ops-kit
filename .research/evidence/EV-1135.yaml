statement: "Официально документированного механизма, который ГАРАНТИРУЕТ, что подпроцесс pytest увидит текущее рабочее дерево, а не editable-установку из другого каталога, не существует: setuptools в разделе Limitations режима разработки говорит прямо противоположное — 'There is no guarantee that the editable installation will be performed using a specific technique', 'File system entries in the current working directory whose names coincidentally match installed packages may take precedence in Python's import system' и 'If you have a particular order in sys.path or some specific import precedence that needs to be respected, the editable installation as supported by Setuptools might not be able to fulfil this requirement'. Причина техническая: одна из трёх допустимых техник editable — динамический .pth, ставящий собственный MetaPathFinder, а sys.meta_path опрашивается ДО просмотра sys.path. Значит никакой PYTHONPATH и никакая ini-опция достаточной гарантией быть не могут."
