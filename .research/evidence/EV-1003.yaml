statement: 'Реестр Deprecated-фич даёт точные даты, а не «когда-нибудь»: Roots, Sampling,
  Logging и OAuth Dynamic Client Registration помечены Deprecated в ревизии 2026-07-28,
  и у всех четырёх earliest removal — «первая ревизия, выпущенная 2027-07-28 или позже»;
  значения includeContext thisServer/allServers следуют за Sampling; транспорт HTTP+SSE
  (Deprecated с 2025-03-26) получает earliest removal «через три месяца после того,
  как SEP-2596 достигнет Final» — то есть это самый ранний из сроков. Раздел Removed
  пуст: ни одна фича по этой политике ещё не удалена. Миграционные пути документированы
  для каждой: вместо Roots — передача файлов/каталогов через параметры инструментов,
  resource URI или конфигурацию сервера; вместо Sampling — прямая интеграция с API
  LLM-провайдера; вместо Logging — stderr (stdio) или OpenTelemetry; вместо DCR — Client
  ID Metadata Documents.'
