statement: >
  У ai-sdlc есть машиночитаемый провенанс изменения, привязанный к коммиту, и он в статусе
  реализованного. RFC-0042 «Proof-of-Execution Attestation via In-Repo Merkle Transcripts»
  во фронтматтере помечен status: Approved, lifecycle: Implemented, targetSpecVersion v1alpha1;
  реализован цепочкой задач AISDLC-383.* + 409 (v6 default-on cutover, 2026-05-23): захват
  транскриптов в ревьюер-субагентах, вычисление Merkle-корня, DSSE v6 envelope + signer + verifier
  в workflow verify-attestation, а также валидация head-sha и защита от path-traversal (AISDLC-391).
  README: аттестация требуется на main. Значение для кита: это реплика инварианта «evidence на
  точном SHA» — изменение доставляется с криптографически проверяемым свидетельством исполнения,
  привязанным к голове коммита.
