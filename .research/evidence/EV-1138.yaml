# Второй нужный гейт выпуска — согласованность версии по всем местам, где она штампуется.
#       У кита версия живёт минимум в VERSION, манифесте и managed-копии дочки.
schema_version: 1
kind: research.evidence
id: EV-1138
request_id: RR-015
statement: "commitizen 4.17.1 (17.08.2026, MIT) даёт гейт согласованности версии: cz bump --check-consistency проверяет, что версия во всех перечисленных version_files совпадает с конфигом, и при расхождении отдаёт код выхода 17 ('Current version cannot be found in version_files'). Отдельно cz bump --get-next отдаёт код 21, если подходящих для бампа коммитов нет. Поставляемые pre-commit хуки: commitizen (cz check на стадии commit-msg) и commitizen-branch (cz check --rev-range на стадии pre-push). Для сравнения: у release-please гейта нет вообще (--dry-run только печатает план), а у python-semantic-release strict-режим отвечает на вопрос 'есть ли что релизить', а не 'обновлён ли changelog'."
