statement: 'Execution Environment в ките реализован как КОНКРЕТНАЯ изоляция, но не
  как абстрактный контракт: containers/run-sandboxed.sh запускает движок в контейнере
  с read-only rootfs, tmpfs, cap-drop=ALL, no-new-privileges, non-root пользователем
  и лимитами memory/cpus/pids, монтируя ОДНОРАЗОВЫЙ клон вместо основного репозитория;
  tool_broker.sandbox_policy даёт shell по allowlist с block_push и сам называет себя
  enforceable-подмножеством. Интерфейса вида create/execute/read_file/write_file/snapshot/restore/destroy
  с более чем одной реализацией не обнаружено — именно сюда ложится предложение входящего
  про Runtime API OpenHands.'
