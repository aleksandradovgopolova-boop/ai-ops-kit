statement: >
  Периметр данных: официальная документация прямо противопоставляет локальные модели («данные
  остаются локально», пригодно для чувствительных внутренних сетей и изолированных сред) и
  облачные («данные отправляются провайдеру»). Там же — ПРЕДУПРЕЖДЕНИЕ САМОГО ВЕНДОРА против
  локального пути по существу: Strix опирается на продвинутые агентские способности (использование
  инструментов, многошаговое планирование, самокоррекция), большинство локальных моделей, особенно
  меньше 70B, с этим не справляются, и для ответственных проверок авторы настоятельно рекомендуют
  сильные облачные модели, а локальные — только когда приватность абсолютный приоритет.
  Практическое следствие: «приватно» и «работает хорошо» здесь — выбор одного из двух, по словам
  самого производителя.
