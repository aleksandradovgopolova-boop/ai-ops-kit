  rationale: "Механический замер. Метод оценки времени назван и ограничен: рабочее время восстановлено по интервалам между коммитами с обрезкой разрыва в 90 минут — это НИЖНЯЯ граница (работа без коммитов не видна) и она не различает думание от печатания. Завышенная альтернативная оценка приведена и отвергнута в самом statement, чтобы 29% не всплыло позже как факт."
