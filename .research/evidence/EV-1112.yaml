statement: "За 40 календарных дней кит выпустил 236 версий (196 коммитов с префиксом release) — примерно один выпуск на каждые 45 минут измеримого рабочего времени. Служебные файлы выпуска занимают верхние строки churn'а: CHANGELOG.md правлен 401 раз, манифест 270, VERSION 260, тогда как самый правленый файл кода — tools/execution_pipeline.py, 89 раз (в 4.5 раза меньше). На восемь служебных файлов пришлось 25% ВСЕХ касаний файлов в истории. При этом честная цена времени НИЖЕ, чем кажется: коммитов, трогающих только служебные файлы, — 39 из 593 (7%), а рабочего времени в интервалах, заканчивающихся таким коммитом, — 19 часов из 183 (10%). Первая оценка этого замера дала 29% и была ОТВЕРГНУТА: она относила к выпуску весь интервал перед release-коммитом, то есть саму выпускаемую работу."
