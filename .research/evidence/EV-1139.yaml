id: EV-1139
request_id: RR-015
statement: "Django (6.1, 05.08.2026, BSD-3-Clause) даёт два разных официальных гейта миграций, и разделение прямо применимо к киту: makemigrations --check — 'Makes makemigrations exit with a non-zero status when model changes without migrations are detected. Implies --dry-run' (это гейт в CI РОДИТЕЛЯ: формат конфига поменяли, миграцию не написали), и migrate --check — 'Makes migrate exit with a non-zero status when unapplied migrations are detected' (гейт в CI ДОЧКИ: состояние отстало от версии инструмента). У alembic (1.19.1, 08.08.2026, MIT) полезны две другие идеи: версия применённого состояния хранится В ЦЕЛИ, а не в пакете, и есть команда 'принять текущее состояние как применённое, ничего не выполняя' (alembic stamp; у Django это migrate --fake) — без неё существующие дочки с уже накопированным деревом не подхватить. Прямо релевантное ограничение: автогенерация alembic НЕ детектирует переименования (видит их как add+drop) — значит переименования ключей в YAML придётся писать руками явной операцией rename, иначе значения владельца потеряются."
