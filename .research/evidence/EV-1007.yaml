statement: 'Раннтайм, который для кита и есть MCP-клиент (Claude Code), в своей MCP-документации
  НЕ называет реализуемую ревизию протокола: страница описывает транспорты (stdio, http,
  sse, ws), таймауты, реконнекты, скоупы конфигурации — но ни строки вида 2026-07-28
  или 2025-11-25, ни server/discover, ни Mcp-Session-Id, ни «stateless» в тексте нет.
  Отдельно зафиксировано: их дока сама объявляет SSE устаревшим («The SSE (Server-Sent
  Events) transport is deprecated. Use HTTP servers instead, where available») — совпадает
  с реестром Deprecated спеки (EV-1003); при этом поддерживается транспорт ws (WebSocket),
  которого в транспортах спеки нет. Квалификатор: проверялась публичная страница /docs/en/mcp
  на 2026-07-30 — «не указано в доке» не равно «не поддерживается».'
