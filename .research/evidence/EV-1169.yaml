statement: >
  САМОСВИДЕТЕЛЬСТВО (флаг self-evidence, требует спот-чека judge). После закрытия осей chain,
  dogfood и «полнота реализации» соседом ai-sdlc, у кита остаются два кандидата в уникальность,
  оба уже нельзя формулировать как «единственный с цепочкой»: (1) research как ОПЕРАЦИОННЫЙ контракт
  принятия решений — versioned-схемы RR->EV->DP, накопление EV между прогонами с provenance и
  freshness, обязательная проверка памяти до поиска, writer≠judge на самих выводах исследования
  (этот прогон RR-017 — сам экземпляр механизма); у ai-sdlc research/ — авторские отчёты (EV-1167),
  не такой контракт. (2) Модель дистрибуции «установка В чужой репозиторий + governance НАД дочкой +
  живая квалификация произвольного child-репо»: кит копируется установщиком в дочку и оценивает её
  прогонами; ai-sdlc устроен как adopter-фреймворк с точками расширения (RFC-0037/0038/0039:
  наследование контекста adopter'а, adopter-defined reviewer и pipeline-gate) — оператор внедряет
  рамку У СЕБЯ, а не рамка ведёт чужой репозиторий извне. Обе оси — контестабельны: это разные
  модели, а не превосходство, и «уникальность» здесь означает «другой выбор», не «лучше».
  ПОПРАВКА ПО ЛОВУ JUDGE (round 1, EV-1171): ось (1) СУЖЕНА. Утверждение «у ai-sdlc нет контура
  решений, только отчёты» — НЕВЕРНО: RFC-0035 (lifecycle Implemented) — движок Decision-каталога с
  суперсессией, скорингом полноты evidence, независимой рекомендацией и research-субагентом. Узким
  различием остаётся не «есть контур / нет контура», а форма: у кита research — персистентная память
  ФАКТОВ (RR->EV->DP с provenance, freshness, memory-first, writer≠judge на самих выводах, накопление
  EV между прогонами), у ai-sdlc RFC-0035 — routing и приоритизация РЕШЕНИЙ оператора. Контуры
  смежные, не тождественные; ось (1) держится только в этой узкой формулировке, reliability medium.
