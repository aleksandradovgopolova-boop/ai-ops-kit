statement: >
  Суперсидит EV-673. Уточнённый вывод «цепочка воспроизведена соседом, но кит единственный по
  совокупности: полная реализация + dogfood + research» БОЛЬШЕ НЕ ДЕЙСТВУЕТ в прежней формулировке.
  ai-sdlc-framework/ai-sdlc воспроизводит цепочку кита исполняемым кодом (EV-1162), с механизмом
  writer≠judge в коде, закрывающим fallback-обход (EV-1163) — сильнее общего заявления EV-670 у
  multi-agents-control-plane, — с реализованной аттестацией evidence на SHA (EV-1164), delivery-
  транзакцией и возобновляемостью (EV-1165, автономный режим experimental) и dogfood (EV-1166).
  По формальной спецификации, conformance-набору, мультиязычным SDK и комплаенсу ai-sdlc ШИРЕ кита
  (EV-1168). Таким образом две из трёх осей EV-673 (chain, dogfood) у соседа закрыты, а «полнота
  реализации» у него местами превосходит кит. Честная дифференциация кита сужается до двух
  контестабельных осей (EV-1169, с поправкой EV-1171): research как ПЕРСИСТЕНТНАЯ ПАМЯТЬ ФАКТОВ
  RR->EV->DP с provenance/freshness/memory-first — узкое отличие от Decision-каталога RFC-0035
  ai-sdlc (тот реализован, EV-1171: движок routing'а решений с суперсессией и research-субагентом,
  поэтому «у соседа нет контура решений» НЕВЕРНО); и модель «установка+governance над дочкой+живая
  квалификация» против adopter-фреймворка с точками расширения. Вывод для позиционирования: перестать говорить
  «единственный с цепочкой»; ai-sdlc — сильнейший найденный сосед по жанру на сегодня.
