statement: 'ГЛАВНАЯ переносимая механика — Skill TDD: файл skills/writing-skills/testing-skills-with-subagents.md
  (385 строк) переносит RED-GREEN-REFACTOR на документацию процессов шестью фазами:
  RED (прогон сценария БЕЗ навыка — наблюдать провал), Verify RED (зафиксировать рационализации
  дословно), GREEN (написать навык под наблюдённые провалы), Verify GREEN (pressure
  test с навыком), REFACTOR (закрыть новые лазейки), Stay GREEN (повторная верификация).
  Базовый принцип: не видел провала без навыка — не знаешь, что навык предотвращает.'
