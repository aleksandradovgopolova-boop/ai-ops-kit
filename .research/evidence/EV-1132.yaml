statement: "cruft 2.16.0 умеет то, что нужно (cruft check отдаёт код 1, если проект отстал от шаблона; cruft diff --exit-code; cruft link для привязки существующего проекта), но заморожен: последний релиз и последний коммит — 25.12.2024, 94 открытых заявки, в classifiers PyPI нет ни одной строки о поддержке версий Python 3.x, зависимость cookiecutter>=1.7 без верхней границы. Миграций между версиями шаблона у него нет вовсе, а механизм наложения правок в документации не описан. Отдельно: cookiecutter 2.7.1 обновлять существующие проекты не умеет и не планирует — это подтверждено и со стороны copier, где в официальной таблице сравнения у Cookiecutter 'Can update projects' = нет."
