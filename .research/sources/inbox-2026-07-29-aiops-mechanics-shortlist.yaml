notes:
  - "Сильная сторона входящего: сформулировано механиками, а не «поставить фреймворк» — совпадает с линией DP-102/DP-108 (заимствуем формат и паттерн, не зависимость)."
  - "Главный риск входящего: восемь целевых компонентов предложены как ОТСУТСТВУЮЩИЕ, но у кита уже есть tools/context_compiler.py (ContextBundle), tools/tool_loop.py (петля model→policy→broker→evidence), validate_loop_trace.py (траектории), tools/run_handoff.py (передача между сессиями), gate_executor + quality/gates.yaml, registry/skills-catalog.yaml, evaluations/. Прежде чем заимствовать — честный маппинг «что уже есть / частично / нет»."
  - "Явно отклонено автором (не тратить время): LangGraph как оркестратор, CrewAI/AutoGen, Letta/Mem0, Graphiti, Temporal, собственный K8s-кластер, полное внедрение OpenHands."
  - "Приоритет автора для первых прогонов: mini-swe-agent → Superpowers → gstack → RepoPrompt CE."
  - "Не проверено: метрики зрелости и живости всех 10 репозиториев, лицензии (особенно Superpowers, RepoPrompt CE, Beads, agent-sandbox), статус OTel GenAI agent-conventions (в тексте — «продолжают развиваться»), идентичность репозитория OpenCode (anomalyco/opencode)."
