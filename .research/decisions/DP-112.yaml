# DecisionPackage по RR-012 (влияние ревизии MCP 2026-07-28 на MCP-контур кита).
# Прогон quick: разведка и writer — inline, БЕЗ субагентов (субагенты в этой сессии не запрашивались),
# поэтому независимого judge не было: блок review пуст, status draft. Спот-чек self-evidence
# (EV-1009, EV-1010) судьёй ОБЯЗАТЕЛЕН по конвенции research-модуля и НЕ выполнен.
schema_version: 1
kind: research.decision-package
id: DP-112
request_id: RR-012
decision:
  question: Что менять в MCP-контуре кита из-за ревизии MCP 2026-07-28, что отложить, и нужна ли ревизия протокола как отдельное измерение декларации?
decision_brief: 'Протокольная ломка ревизии 2026-07-28 (stateless, снятие сессий и handshake, удаление ping/logging-setLevel,
  обязательный resultType) на кит НЕ падает: кит MCP не реализует — он декларирует протокол и два сервера,
  а клиент реализует раннтайм, сервер — поставщик (EV-1009, EV-1011). Срочности нет и по срокам: версия
  согласуется в каждом запросе, обе стороны могут держать несколько версий одновременно, обратная совместимость
  с handshake-ревизиями документирована (EV-1002), а earliest removal у Roots/Sampling/Logging/DCR — не раньше
  первой ревизии после 2027-07-28 (EV-1003, EV-1004). Из двух наших серверов github-mcp уже на новой ревизии
  (EV-1005), hf-mcp-server активен но ревизию не назвал (EV-1006). Реальный дефект — свой: декларации MCP булевы
  («mcp: true» у шести раннтаймов), измерения ревизии в них нет, а проверить его по документации раннтайма нельзя
  — он реализуемую ревизию не публикует ни в доке, ни в CHANGELOG (EV-1007, EV-1008). Рекомендация: добавить
  ревизию (и транспорт) как явное поле деклараций с честным unknown там, где поставщик молчит, поставить реестр
  Deprecated-фич на watch, а правку схемы SupplyChainPinPolicy отложить до триггера. Цена — часы, не дни. Топ-риск
  — завести поле, которое никто не читает: поэтому в validation зашита RED/GREEN-проверка валидатором, и без неё
  шаг не считается выполненным. Следующий шаг: правка двух реестров + проверка в CI (2-4 часа).'
cost_of_recommendation:
  one_time: '2-4 часа: поля spec_revision/transport в registry/tools.yaml (2 записи + tool_protocols.mcp) и в
    registry/runtimes.yaml (6 раннтаймов с capability mcp), проверка в валидаторе + фикстура на RED/GREEN. Оценка
    writer''а по объёму правок, не замер.'
  recurring: 'Одна строка в watch-списке (реестр Deprecated MCP, https://modelcontextprotocol.io/specification/2026-07-28/deprecated)
    — сверка раз в квартал плюс автоматически на еженедельном novelty-прогоне; ревизия протокола у двух серверов
    перепроверяется тем же квартальным циклом (freshness EV-1005/EV-1006 истекает 2026-10-30).'
  owner_required: 'Sasha/команда кита — решение и правка реестров (это изменение данных кита, research его не
    вносит); research-модуль — только watch и перепроверка фактов.'
  note: 'Отложенная часть (расширение схемы SupplyChainPinPolicy) не оценивалась — цена считается при наступлении
    триггера, вместе с решением о write-capable MCP.'
recommendation:
  preferred_option: 'declare-revision-and-watch: (1) сейчас — ревизия протокола и транспорт становятся явными
    полями деклараций MCP в registry/tools.yaml и registry/runtimes.yaml, со значением 2026-07-28 там, где поставщик
    его заявил (github-mcp), и честным unknown там, где не заявил (hf-mcp-server, capability mcp у раннтаймов);
    (2) сейчас — реестр Deprecated-фич MCP ставится на watch с зафиксированными датами; (3) отложить до триггера
    — расширение схемы SupplyChainPinPolicy пиновкой ревизии протокола; (4) не делать ничего в коде кита по поводу
    statelessness'
  confidence: medium
  confidence_rationale: 'РАЗДЕЛЬНАЯ калибровка. Фактическая часть (что изменилось, кто несёт ломку, какие сроки)
    — уверенный medium с опорой на high-записи первоисточников спеки с дословными цитатами (EV-1001…EV-1004) и
    метаданные релизов (EV-1005). Часть про наш контур опирается на self-evidence (EV-1009, EV-1010), у которой
    по конвенции ОБЯЗАТЕЛЕН спот-чек judge — он НЕ выполнен (прогон без субагентов), это главный ограничитель
    уверенности. Два звена вывода негативные и потому medium: ревизия, реализуемая раннтаймом, не опубликована
    (EV-1007, EV-1008) — «не указано» не равно «не поддерживается». Наличие/отсутствие SSE-транспорта в child-репозиториях
    этим прогоном НЕ проверялось (EV-1011, п. г) — поэтому high недостижим, и writer его себе не ставит.'
rationale:
- 'Ответ на вопрос 1 RR (что ломается именно для нас): ничего в коде кита. Ревизия ломает контракт между MCP-клиентом
  и MCP-сервером — снятие протокольных сессий и Mcp-Session-Id, снятие handshake initialize, обязательный server/discover
  на сервере, удаление ping/logging-setLevel, обязательный resultType, потеря resumability SSE (EV-1001). Кит
  ни клиентом, ни сервером не является: его роль — декларация протокола и двух серверов в реестрах плюс назначение
  им permission_level и пиновки (EV-1009, EV-1010), поэтому ломка адресована раннтайму и поставщикам серверов
  (EV-1011).'
- 'Ответ на вопрос 5 (срочность и право отложить): отложить можно, и это не гадание. Согласование версии стало
  per-request (io.modelcontextprotocol/protocolVersion в _meta, на Streamable HTTP — заголовок MCP-Protocol-Version),
  сервер решает по каждому запросу, обе стороны МОГУТ поддерживать несколько версий одновременно, а при несовпадении
  сервер возвращает UnsupportedProtocolVersionError со списком поддерживаемых; для ревизий 2025-11-25 и ранее
  документирована обратная совместимость с handshake-моделью (EV-1002). Плюс формальная политика: окно не менее
  двенадцати месяцев от выпуска ревизии, expedited-removal не короче девяноста дней и только при опубликованном
  security-advisory, а удаление из спеки НЕ обязывает SDK выкинуть фичу (EV-1004). Конкретные даты: Roots, Sampling,
  Logging и OAuth DCR — earliest removal «первая ревизия, выпущенная 2027-07-28 или позже»; раздел Removed пуст
  (EV-1003).'
- 'Ответ на вопрос 3 (задевают ли депрекации наши два сервера): по github-mcp — нет, поставщик уже впереди нас:
  v1.7.0 от 2026-07-23 заявляет включение изменений спеки 2026-07-28 через go-sdk 1.7.0-pre.3, упоминаний sampling/roots/logging
  в release notes v1.5.0-v1.8.0 нет (EV-1005). Оговорка EV-1005 переносится сюда целиком: это ЗАЯВЛЕНО в release
  notes, полнота реализации по коду не проверялась. По hf-mcp-server — не установлено: пять релизов 27-30 июля
  с формулировками, согласующимися с новой моделью подписок и метрик протокола, но целевая ревизия явно не названа;
  проверялись только тела релизов, не код и не capability-ответы сервера (EV-1006).'
- 'Ответ на вопрос 2 (какие артефакты кодируют устаревшие утверждения) — и это единственный настоящий дефект
  на нашей стороне: декларации MCP булевы. tool_protocols.mcp имеет status documented и список supported_runtimes,
  но поля ревизии нет; из 9 раннтаймов capability mcp объявлена у шести (пять как {status: documented, value:
  true}, generic-orchestrator как {status: degraded, value: optional}) — тоже без измерения ревизии; permission-уровень
  network разрешает mcp_tools как неделимое разрешение (EV-1009). После того как совместимость стала зависеть
  от строки YYYY-MM-DD (EV-1002), булева форма перестала выражать то, что теперь определяет совместимость. Отдельно
  — проверяемость: раннтайм, который для кита и есть MCP-клиент, реализуемую ревизию не публикует ни в MCP-доке
  (где, впрочем, сам объявляет SSE устаревшим и поддерживает не-спековый транспорт ws), ни в CHANGELOG (EV-1007,
  EV-1008). Поэтому предлагаемое поле обязано допускать значение unknown: иначе мы заменим отсутствующую точность
  на ложную, а инвариант честных деклараций кита это запрещает.'
- 'Ответ на вопрос 4 (SupplyChainPinPolicy и tool broker), часть первая: пиновка. SCP требует ставить любую внешнюю
  зависимость движка (model/skill/mcp) только по зафиксированному revision/hash с install-верификацией для исполняемого
  кода, но pinned.type ограничен enum [revision, hash, digest, tag-immutable], измерения «ревизия протокола»
  нет, и схема объявлена additionalProperties: false — то есть расширение это правка схемы, а не запись в данных
  (EV-1010). Практический вывод: пиновка по хешу артефакта и смена ревизии протокола — ортогональные оси, сервер
  на зафиксированном хеше может говорить на другой ревизии, и кит этого не увидит. Но цена закрытия (правка схемы
  + миграция + согласование с additive_only) сейчас выше пользы: write-capable MCP у нас не в поставке, hf-mcp-server
  честно declared, а не documented (EV-1009), postура tool-mcp-connection честно declared с enforcement в roadmap
  (EV-1010). Отсюда — отложить до триггера, а не «сделать на будущее».'
- 'Ответ на вопрос 4, часть вторая: tool broker. Statelessness переносит состояние в server-minted handles, передаваемые
  как ОБЫЧНЫЕ аргументы инструментов (EV-1001) — то есть то, что раньше было протокольной сессией вне поля зрения
  брокера, теперь проходит через тот же путь, что и остальные аргументы. Для нас это скорее плюс наблюдаемости,
  но утверждать это как факт нельзя: у кита нет ни write-capable MCP в поставке, ни enforcement-а подключения
  (EV-1010), а поведение брокера на живом сервере этот прогон не наблюдал — вынесено в unknowns и в отложенную
  часть validation, а не в рекомендацию.'
- 'Про единственный близкий срок и про то, чего мы о себе не знаем: раньше всех умрёт не Roots/Sampling/Logging,
  а транспорт HTTP+SSE — earliest removal «через три месяца после того, как SEP-2596 достигнет Final» (EV-1003),
  и дока раннтайма уже отговаривает от SSE (EV-1007). При этом транспорт в реестрах кита не декларируется вообще
  (EV-1009): риск живёт в конфигурации child-репозиториев, которую этот прогон не смотрел (EV-1011, п. г). Поэтому
  транспорт добавляется в декларацию тем же дешёвым шагом — не ради красоты схемы, а чтобы вопрос «у кого SSE»
  имел адресата в данных.'
alternatives:
- option: 'do-nothing-until-removal: не менять ничего, вернуться к вопросу при первом реальном удалении фичи'
  appropriate_when: 'Если принимается, что декларации MCP описывают факт наличия функции, а не совместимость,
    и никто (ни валидатор, ни capability self-test, ни child) на них при выборе сервера не опирается. Формально
    защищено окном до 2027-07-28 (EV-1003, EV-1004) и per-request-согласованием (EV-1002); цена — ноль. Отклонено
    не из-за риска сбоя, а потому что оставляет декларацию непроверяемой при живом инварианте честных статусов.'
- option: 'full-migration-now: аудит обоих серверов по коду, расширение схемы SCP пиновкой ревизии, enforcement
    подключения MCP из roadmap в поставку'
  appropriate_when: 'Когда write-capable MCP-сервер входит в delivery-путь кита или hf-mcp-server повышается из
    declared в documented — тогда ортогональность «хеш артефакта против ревизии протокола» (EV-1010) перестаёт
    быть теоретической. Сейчас отклонено как работа без потребителя.'
- option: 'declare-unknown-only: добавить поле ревизии, но не заводить watch и не трогать транспорт'
  appropriate_when: 'Если watch-бюджет исчерпан и квартальная сверка реестра Deprecated некому достаться. Отклонено:
    именно даты (EV-1003) — самая дешёвая часть пользы, а реестр Deprecated по политике и есть канонический ответ
    на «что уходит и когда» (EV-1004).'
constraints_addressed:
  evidence_over_reputation: 'Соблюдён: все внешние утверждения — с первоисточников (спека, её changelog, реестр
    Deprecated, политика жизненного цикла, GitHub API релизов, дока и CHANGELOG раннтайма), каждое с дословной
    цитатой и локатором; обзоров и блог-пересказов в evidence нет. Найденный на novelty-прогоне блог-пересказ
    про MCP в источники не пошёл.'
  registry_is_single_source_of_truth: 'Соблюдён: ревизия и транспорт добавляются В существующие записи registry/tools.yaml
    и registry/runtimes.yaml; нового файла, второго реестра MCP-серверов и параллельной политики не создаётся.'
  fits_kit_declared_pattern: 'Соблюдён: MCP-серверы остаются декларациями со статусами documented/declared, зависимостями
    ядра не становятся; degradation_rule и контракт «workflow не должен ломаться при отсутствии mcp» (EV-1009)
    рекомендацией не затрагиваются.'
  honest_statuses: 'Соблюдён и является причиной ключевой детали рекомендации: поле ревизии обязано допускать
    unknown, потому что у раннтайма и у hf-mcp-server ревизия не заявлена (EV-1006, EV-1007, EV-1008); статусы
    documented/declared по MCP не повышаются, tool-mcp-connection остаётся declared.'
  additive_only: 'Соблюдён в части реестров (добавление необязательных полей в YAML-данные — аддитивно) и ЯВНО
    ОСЛАБЛЕН обходом в части схем: расширение SupplyChainPinPolicy потребовало бы правки схемы с additionalProperties:
    false (EV-1010), поэтому оно не входит в рекомендацию сейчас, а отложено до триггера — вместе с решением о
    версии схемы.'
assumptions:
- 'Роль кита в MCP-контуре не меняется в горизонте решения: он декларирует и потребляет, но не реализует ни клиент,
  ни сервер. Если кит начнёт поставлять собственный MCP-сервер, вывод EV-1011 перестаёт действовать и RR надо
  открывать заново.'
- 'Раннтайм (MCP-клиент) сам держит совместимость с серверами разных ревизий, опираясь на per-request согласование
  и документированную обратную совместимость (EV-1002). Прямого подтверждения от поставщика раннтайма нет — это
  допущение, а не факт (EV-1007, EV-1008).'
- 'Заявление github-mcp-server о включении изменений спеки соответствует действительности (EV-1005 фиксирует
  заявление, не проверку кода).'
risks:
- 'Мёртвые метаданные: поле spec_revision, которое никто не читает, превращает реестр в декорацию и дискредитирует
  сам приём. Митигация вынесена в validation как условие приёмки — без проверки валидатором (RED/GREEN на фикстуре)
  шаг не считается выполненным.'
- 'Ложная точность: заполнить ревизию «по смыслу» там, где поставщик молчит. Митигация — обязательное значение
  unknown и запрет выводить ревизию из активности релизов (именно этот соблазн создаёт EV-1006).'
- 'Слепое пятно child-репозиториев: транспорт SSE может стоять в конфигурации child, а его earliest removal —
  самый близкий из всех (EV-1003). Декларация транспорта в реестре кита сама по себе child не проверяет; охват
  этой проверки остаётся дырой до отдельного шага.'
- 'Протухание: записи о ревизиях серверов и реестр Deprecated volatile (freshness до 2026-10-30 у EV-1005/EV-1006).
  Без квартальной сверки решение станет неверным тихо.'
- 'Процессный риск этого DP: self-evidence о собственном контуре (EV-1009, EV-1010) не прошла спот-чек независимого
  судьи — если в инвентаризации есть ошибка, она попала и в рекомендацию.'
unknowns:
- 'Какую ревизию MCP реализует клиент Claude Code — не опубликовано ни в доке, ни в CHANGELOG (EV-1007, EV-1008);
  без этого поле ревизии у capability mcp раннтаймов может остаться unknown надолго.'
- 'На какую ревизию нацелен hf-mcp-server (EV-1006) — тела релизов не говорят; ответ добывается чтением кода/CHANGELOG
  репозитория или capability-ответом живого сервера.'
- 'Использует ли какой-либо child-репозиторий транспорт SSE — не проверялось этим прогоном (EV-1011, п. г).'
- 'Как statelessness и server-minted handles реально выглядят в журнале tool_broker — не наблюдалось на живом
  сервере; предположение о выигрыше наблюдаемости не подтверждено.'
- 'Затронут ли обход для провайдеров без нативного MCP (tool gateway для GigaChat, EV-1009) — вне скоупа этого
  прогона, не проверялось.'
proposed_validation:
  experiment: 'Две фальсифицируемые проверки на правку реестров, обе выполняются на dev-машине без внешних зависимостей.
    ПРОВЕРКА A (поле читается машиной, RED/GREEN): в валидатор кита добавляется правило «запись tools с protocol:
    mcp обязана иметь spec_revision (значение — строка YYYY-MM-DD или unknown)»; на фикстуре с намеренно отсутствующим
    полем CI обязан упасть, после добавления поля — пройти. Критерий прохождения: 1/1 фикстура падает на RED и
    проходит на GREEN. Критерий провала: правило невозможно выразить в существующем валидаторе без новых зависимостей
    (ограничение implementable_stdlib_pyyaml) — тогда шаг 1 сокращается до данных без проверки, и поле честно
    помечается как справочное, а не инвариантное. ПРОВЕРКА B (значения не выдуманы): для каждого из 2 задекларированных
    MCP-серверов ревизия подтверждается первичным заявлением поставщика (release notes, CHANGELOG или ответ server/discover).
    Пороги: 2/2 подтверждено — поля заполняются датами; 1/2 (ожидаемый исход по EV-1005/EV-1006) — заполняется
    одно, второе остаётся unknown, и это НЕ считается провалом; 0/2 — рекомендация теряет смысл в части значений
    и сокращается до watch. ОТЛОЖЕНО ЯВНО: поведение tool_broker при stateless-серверах не валидируется — нужен
    живой write-capable MCP-сервер, которого в поставке нет; проверка охвата child-репозиториев по транспорту —
    отдельный шаг, в этот пилот не входит. Триггеры пересмотра отложенной части (схема SCP): повышение hf-mcp-server
    из declared в documented, появление write-capable MCP в delivery-пути, или первая запись в разделе Removed
