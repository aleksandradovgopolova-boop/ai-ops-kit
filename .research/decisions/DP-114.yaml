# DecisionPackage по RR-015 — чем ускорить и улучшить разработку САМОГО кита.
#
# ПОРЯДОК РАБОТЫ БЫЛ ОБРАТНЫМ ОБЫЧНОМУ. Сначала измерена история этого репозитория (EV-1107..EV-1120),
# и только под названные числа искался внешний инструмент (EV-1121..EV-1139). Поэтому здесь нет
# пункта «взять X, потому что так принято»: у каждого пункта есть замер, который он лечит, и если
# замера нет — пункт лежит в «отвергнуть» или в «подсмотреть идеей».
#
# ГЛАВНЫЙ ВЫВОД ЗАМЕРА, И ОН НЕ ПРО ИНСТРУМЕНТЫ. Скорость теряется не в ревью (медиана жизни
# заявки 12 минут, EV-1116) и не в выпуске (10% времени, EV-1112), а в том, что ПРОВЕРКА СТОИТ НЕ
# ТАМ, ГДЕ ДЕФЕКТЫ. 163 прогона CI за 14-17.08 дали ноль падений, и в те же дни поле дало 40 находок
# (EV-1107); 99% тестов лежат в слое, где находок поля не было (EV-1109). Поэтому первые два пункта
# «взять» — не про новый инструмент, а про перенос проверки в слой, где дефекты живут.
schema_version: 1
kind: research.decision-package
id: DP-114
request_id: RR-015
decision:
  question: "Какие внешние инструменты и практики взять в разработку самого кита, какие подсмотреть идеей без зависимости, а какие отвергнуть — под измеренные узкие места, а не под жанр?"
decision_brief: >
  ВЗЯТЬ четыре вещи, в этом порядке: (1) тест пути владельца в чужом репозитории — своими руками, без
  внешней зависимости, потому что именно этот слой даёт 48 находок поля из 48 и в нём нет ни одного
  теста; (2) проверку печатаемого текста — самый крупный класс находок (12 из 48) и он проверяется
  тем же прогоном; (3) copier как механизм доставки И гейт отставания дочки (единственный инструмент
  с обновлением, миграциями и `check-update` с кодом 2) — но только после решения владельца, потому
  что это замена собственного установщика, самого переделываемого файла кита; (4) towncrier check +
  cz bump --check-consistency — два гейта выпуска, которых у кита нет ни одного. ПОДСМОТРЕТЬ ИДЕЕЙ,
  без зависимости, шесть пунктов: два гейта миграций вместо одного (Django), файл состояния применённой
  версии в дочке со своей версией формата (pipx_metadata_version), «принять текущее состояние как
  применённое» (alembic stamp), контракты protected и acyclic_siblings дописать в свой validate_layering
  (import-linter), архитектурное правило как pytest-тест с произвольным предикатом (pytest-archon),
  мутант как именованный объект со счётчиком поймавших тестов (pytest-mutagen). ОТВЕРГНУТЬ шесть:
  mutmut и cosmic-ray как замену реестру проб, cruft, pipx/uv tool как ответ на доставку, pydantic/jsonschema как runtime-замену
  валидаторам, durable-движки. Цена всего пакета «взять»: 4-7 дней инженера, из них 3-5 на пункт 3;
  денежных расходов нет — все четыре инструмента dev-only и бесплатны.
cost_of_recommendation:
  one_time: >
    Пункт 1 (тест пути владельца в одноразовом репозитории): 1-2 дня инженера. Пункт 2 (печатаемый
    текст проверяется прогоном): 0.5-1 день. Пункт 3 (переход доставки на copier): 3-5 дней плюс
    обкатка на одной дочке — и это ОЦЕНКА, а не замер: миграция установщика на 2518 строк с 56
    коммитами истории может оказаться дороже, поэтому пункт разбит на разведку (0.5 дня, проверить
    copier на одной дочке) и решение по её результату. Пункт 4 (два гейта выпуска): 0.5-1 день.
  recurring: >
    Время прогона: пункт 1 добавляет к CI один e2e-прогон в одноразовом репозитории (оценка 1-3
    минуты, НЕ измерено — зависит от того, идёт ли он с живым провайдером или на заглушке; при живом
    провайдере появляется и денежная стоимость прогона, её тоже надо мерить). Пункты 2 и 4 — секунды.
    Пункт 3 добавляет обслуживание шаблона: каждое изменение формата конфига дочки требует написать
    миграцию (это и есть выигрыш, но это работа). Содержание четырёх dev-зависимостей — обновление
    версий в pre-commit и CI, порядка часа в квартал.
  owner_required: >
    Решение владельца обязательно по пункту 3 (заменять ли свой установщик внешним инструментом) и
    по денежной стороне пункта 1 (гонять ли e2e с живым провайдером и на какой бюджет). Пункты 2 и 4
    решения не требуют — это перенос уже объявленных правил в исполняемую форму.
  note: >
    Денежная цена пакета — ноль: copier (MIT), towncrier (MIT), commitizen (MIT), check-jsonschema —
    бесплатные dev-инструменты. Все четыре НЕ становятся runtime-зависимостью кита и потому не
    нарушают AGENTS.md:39. Цена в днях — оценка инженера, кроме пункта 3, где она явно помечена
    неизмеренной.
recommendation:
  preferred_option: >
    Четыре пункта «взять» в названном порядке (тест пути владельца -> проверка печатаемого текста ->
    разведка copier и решение владельца -> два гейта выпуска); шесть пунктов «подсмотреть идеей» без
    зависимости; шесть пунктов «отвергнуть» с записанной причиной. Порядок не по цене и не по
    привлекательности, а по размеру класса дефектов, который пункт закрывает: 48 находок из 48 в
    слое, где тестов нет (пункт 1), 12 из 48 (пункт 2), 8 из 48 (пункт 3), 0 находок поля но 236
    версий за 40 дней без единого гейта (пункт 4).
  confidence: medium
  confidence_rationale: >
    Замеры истории — первичные и механические (git, GitHub API, полный прогон, чтение дерева), им
    доверия много. Внешние факты сняты с официальной документации с дословными цитатами. Но НИ ОДИН
    инструмент не запускался на этом репозитории: copier на дочке не пробован, towncrier check на
    этой истории не гонялся, e2e-прогон пути владельца не написан. Поэтому confidence не high:
    оценка сроков пункта 3 может оказаться вдвое неверной, а mutmut, отвергнутый по заявке #486
    (копирование в temp ломает editable-импорты), отвергнут по документации, а не по прогону.
rationale:
  - "Порядок пунктов определён замером EV-1107, а не вкусом: 163 прогона CI за 14-17.08.2026 с нулём падений против 40 находок поля в те же дни означает, что добавлять проверки в существующий слой бессмысленно — там уже всё зелёное. Первым идёт то, что переносит проверку в слой находок."
  - "Пункт 1 (e2e путь владельца) опирается на EV-1109: 268 из 271 тестового файла лежат в tests/unit, а каталоги tests/integration, tests/live и tests/regression содержат только README.md. Слой, давший 48 находок из 48 (EV-1108), не покрыт ничем. Это единственный пункт, где внешнего инструмента НЕ нужно вовсе — нужен репозиторий-одноразовик и прогон установки в него."
  - "Пункт 2 (печатаемый текст) опирается на EV-1110: 12 находок из 48 (25%) — напечатанная команда, которая не исполняется, названный флаг, которого нет в CLI, сырой traceback вместо сообщения. Отчёт репозитория сам называет причину — такие строки живут в ветках отказа, куда тесты не ходят. Механизм исполнения дешёвый: тест, который берёт каждую печатаемую строку с командой и проверяет её разбором CLI. Работа `printed-commands-are-runnable` в плане уже открыта — пункт её РАСШИРЯЕТ на флаги и причины отказа, а не заводит второй раз."
  - "Пункт 3 (copier) опирается на EV-1110 (8 находок из 48 — исправление не доехало до дочки) и на EV-1130: copier единственный из трёх шаблонизаторов, у кого есть и `update` со smart-diff, и `_migrations` с диапазонами версий PEP 440, и `check-update --quiet` с кодом выхода 2 как готовый гейт отставания в CI дочки. Именно гейта у кита нет: F-032 показал, что точка входа в дочке устаревает молча."
  - "Против пункта 3 есть сильный контрдовод, и он записан в EV-1131: copier берёт последний ТЕГ, а не HEAD, и при грязном локальном шаблоне молча ставит старое состояние. У этого репозитория такая ошибка уже была (локальный источник стоял на неслитой ветке). Переход на copier не устраняет класс «источник установки не тот, что думает владелец», а меняет его форму — поэтому пункт разбит на разведку и решение владельца, а не на прямое внедрение."
  - "Пункт 4 (два гейта выпуска) опирается на EV-1112 (236 версий за 40 дней, CHANGELOG.md правлен 401 раз — больше любого файла кода в 4.5 раза) и на EV-1137/EV-1138: `towncrier check` — единственный из шести инструментов, у кого есть гейт «запись в changelog добавлена», а `cz bump --check-consistency` (код 17) — гейт согласованности версии по всем местам, куда она штампуется. Ретро-миграция 364 КБ не нужна: модель фрагментов оставляет старый файл как есть."
  - "Мутационные движки ОТВЕРГНУТЫ не из-за незрелости, а потому что отвечают на другой вопрос. EV-1121: mutmut не умеет сказать, какой тест убил мутанта (заявка #392 открыта) — а реестр проб кита именно это и делает, называя тесты, обязанные покраснеть. EV-1123: у cosmic-ray нет отбора тестов под мутанта (заявка #498 открыта с 2020), то есть каждый мутант гонит все 2410 тестов. Собственный механизм кита (EV-1113) уже исполняется в CI как slow-тест; его проблема — охват 12 файлов из 207, и она решается написанием проб, а не сменой движка."
  - "EV-1122 добавляет к отказу от mutmut довод, специфический для этого репозитория: mutmut 3.x копирует исходники в ./mutants/ и гоняет тесты оттуда, а открытая заявка #486 фиксирует, что это ломает импорты editable-установки — то есть инструмент воспроизвёл бы ровно тот дефект, который у кита уже держит пять тестов вечно красными (EV-1117)."
  - "Схемы дают меньше, чем кажется, и предел принципиальный. EV-1114: у кита уже 50 файлов JSON Schema и ДВА собственных исполнителя их подмножества (233 и 105 строк) — писать третий не нужно, нужен внешний исполнитель. EV-1128: `check-jsonschema` даёт его как pre-commit хук, dev-only. Но EV-1129: кросс-файловые инварианты схемой не выражаются в принципе, а EV-1115 показывает верхнюю границу выигрыша — не более 52 валидаторов из 76 в принципе заменяемы, и это ВЕРХНЯЯ оценка по грубому признаку."
  - "Durable-движки ОТВЕРГНУТЫ по EV-1118: возобновляемость у кита уже реализована и названа своими словами (RunHandoff, LifecycleStore, durable_write_json с атомарной записью, resume_preflight с fail-closed на битом чтении, чекпоинт на пакет), и реестр рантаймов объявляет её проверенной живым прогоном. Внешний движок с сервером здесь дублировал бы построенное — прямое нарушение dp-001."
  - "Миграции ОТВЕРГНУТЫ как внешняя зависимость по EV-1119: каталог migrations/ с парами up/down и цепочкой в package_migrations у кита есть с 17.08.2026, модель alembic уже воспроизведена. Но идея из EV-1139 берётся: у Django ДВА гейта миграций (`makemigrations --check` в родителе — формат поменяли, миграцию не написали; `migrate --check` в дочке — состояние отстало), а у кита сейчас нет ни одного."
  - "hypothesis не заводится заново: EV-1120 показывает, что он уже стоит и реально используется (41 декоратор @given), но в двух файлах из 271 и не в том слое, где находки. Это не «взять инструмент», а «применить имеющийся» — поэтому пункт лежит внутри пункта 2, а не отдельной строкой."
constraints_addressed:
  evidence_over_reputation: >
    Каждый пункт вердикта сослан на EV-запись; пункты без замера не попали в «взять». Отвергнутое
    отвергнуто с процитированным ограничением первоисточника, а не по впечатлению о зрелости.
  one_source_one_evidence: >
    19 внешних EV — по одному источнику на запись; дословные цитаты сняты там, где в источнике есть
    проза, и отсутствие цитаты названо в rationale там, где источник структурный (PyPI JSON, API).
  negative_claims_qualified: >
    Отрицательные утверждения ограничены способом проверки: «только у towncrier есть гейт» ограничено
    рассмотренной шестёркой инструментов (EV-1137); «ни один архитектурный инструмент не умеет
    X не читает Y» — получено чтением перечней возможностей, а не исчерпывающим поиском (EV-1127).
  self_evidence_flagged: >
    14 записей из 33 — замеры ПО СЕБЕ (internal_data): это самосвидетельство, и оно помечено типом
    источника. Завышенная оценка цены выпуска (29%) отвергнута собственной перепроверкой и оставлена
    в тексте EV-1112, чтобы к ней не возвращались.
  same_criterion_applies_to_us: >
    Критерий, которым отвергнуты внешние инструменты («механизм без исполнения — пожелание»),
    применён и к своим: EV-1113 проверил, исполняется ли мутационный механизм КИТА, и первая версия
    записи утверждала, что нет, — проверка по .github/ci-groups/ это опровергла, и утверждение снято
    до публикации.
  runtime_dependency_costs_more_than_dev_dependency: >
    Все четыре пункта «взять» — dev-only: copier вызывается установщиком кита у себя, towncrier и
    commitizen живут в CI родителя, check-jsonschema — в pre-commit. Ни один не едет в дочку как
    зависимость. pydantic и jsonschema отвергнуты именно по этому критерию: они стали бы runtime-
    зависимостью кита, потому что валидаторы исполняются В ДОЧКЕ.
alternatives:
  - option: "Ничего не брать: закрыть охват своими силами — писать пробы (EV-1113: 12 файлов из 207) и e2e-тесты, оставив выпуск и доставку как есть"
    appropriate_when: >
      Если приоритет — второй живой brownfield, а не контур. Пункты 1 и 2 в этом варианте сохраняются
      (они и так свои), пункты 3 и 4 отпадают. Цена: 2-3 дня вместо 4-7; риск: класс «исправление не
      доехало» (8 находок из 48) остаётся неохраняемым, и гейта отставания дочки по-прежнему нет.
  - option: "Взять только пункт 4 (два гейта выпуска) — самое дешёвое и без решения владельца"
    appropriate_when: >
      Если времени меньше дня. Закрывает наименьший класс (0 находок поля), но снимает риск, который
      замером ещё не проявился: 236 версий за 40 дней без единой проверки «changelog обновлён,
      версия согласована» — это отсутствие механизма, а не отсутствие проблемы.
  - option: "Оставить копирование дерева, но добавить СВОЙ гейт отставания дочки (сверка контрольных сумм managed против версии кита) вместо перехода на copier"
    appropriate_when: >
      Если разведка copier покажет, что миграция установщика дороже оценки, или если ловушка с тегами
      (EV-1131) окажется неустранимой в рабочем процессе владельца. У кита уже есть
      ai_managed_checksums.py для дрейфа managed-слоя — гейт «отстал от версии кита» пристраивается
      к нему дешевле, чем меняется вся модель доставки.
assumptions:
  - "Живые прогоны на чужих репозиториях продолжатся: вся приоритизация построена на том, что находки поля — главный источник дефектов, а он существует только пока прогоны идут."
  - "Одноразовый репозиторий для e2e-прогона можно создавать в CI без денежных затрат (публичный репозиторий-фикстура или локальный git init) — вариант с живым провайдером денег стоит и в оценку не включён."
  - "Формат конфигов дочки будет продолжать меняться: без этого допущения ценность миграций и гейта отставания падает, а пункт 3 теряет смысл."
  - "Оценка 3-5 дней на пункт 3 предполагает, что installer/ai_ops.py заменяется ЧАСТИЧНО (copier как библиотека под существующей командой ./ai-ops update), а не переписывается целиком."
risks:
  - "Пункт 3 меняет самое переделываемое место кита (EV-1111: installer/ai_ops.py, 21 исправление из 56 коммитов, 38%). Риск не в copier, а в том, что этот файл уже нестабилен, и замена механизма под ним даст новый всплеск исправлений. Митигация: разведка на ОДНОЙ дочке до решения, и вариант «свой гейт вместо copier» в альтернативах."
  - "Ловушка тегов copier (EV-1131) воспроизводит уже случавшуюся у этого репозитория ошибку в новой форме. Митигация: если пункт 3 берётся, гейт «источник установки — выпуск, а не ветка/грязный шаблон» пишется В ТОТ ЖЕ ДЕНЬ, иначе класс просто переедет."
  - "towncrier выпускался последний раз 30.08.2025 (EV-1137) — почти год без релиза при живом trunk. Для инструмента, который станет блокирующим гейтом, это риск владельца. Митигация: механизм фрагментов не зависит от инструмента (это просто файлы в каталоге), а `check` — 40 строк логики, воспроизводимой своими силами при заморозке проекта."
  - "pytest-archon 0.0.7 (EV-1126) — версия 0.0.x, 89 звёзд, год без изменений. Поэтому он НЕ в «взять», а в «подсмотреть идеей»: свой validate_layering уже есть, а нужные контракты (protected, acyclic_siblings) дешевле дописать в него, чем взять зависимость 0.0.x под блокирующую проверку."
  - "Все четыре пункта «взять» добавляют механизмы, и по правилу dp-002 каждый вводится non-blocking до обкатки. Риск обратный обычному: механизм, введённый как advisory и забытый, — это ровно класс (б) из замеров кита. У кита уже 14 advisory-гейтов из 35 и цель их обкатки ПРИОСТАНОВЛЕНА. Митигация: у каждого нового пункта названа дата перехода в blocking, иначе пункт не берётся."
unknowns:
  - "Сколько времени и денег стоит один e2e-прогон пути владельца в CI — не измерено; зависит от того, идёт ли прогон с живым провайдером."
  - "Действительно ли copier update корректно переналожит правки на managed-дерево кита (5 семейств файлов, checksummed каталог, protected_paths владельца) — не пробовано ни на одной дочке."
  - "Сработает ли `towncrier check` на истории этого репозитория без правки формата коммитов — не гонялось; commitizen требует conventional commits, а у кита 21 коммит с русскими заголовками без префикса и 20 старых с форматом 'vX.Y.Z — Название'."
  - "Сколько из 52 валидаторов-кандидатов (EV-1115) действительно сводятся к схеме — признак грубый, чтением файл за файлом не проверялось."
  - "Класс (е) из вопроса владельца — «работа обрывается на лимите сессии и не оставляет следа» — ЧИСЛОМ не измерен: в репозитории есть механизм (EV-1118) и работа `session-handoff-written-not-declared`, но сколько раз обрыв реально случился и сколько работы потерял, из артефактов не восстанавливается. Это не «такого не происходит», это unknown."
  - "Класс (д) — «реестр зовёт сделанное активным» — измерен только косвенно (OK-05, F-030): доля работ плана, статус которых расходится с состоянием main, не считалась."
proposed_validation:
  experiment: >
    Разведка на одной дочке, полдня, до любых необратимых шагов и до решения владельца по пункту 3:
    (1) поставить copier локально (uv tool install copier), объявить в ките `copier.yml` для ОДНОГО
    семейства managed-файлов (rules/**), проставить киту git-тег текущей версии; (2) применить
    `copier copy` поверх существующей дочки (Окошко или niti) в отдельном worktree, поверх уже
    накопированного managed-дерева; (3) поднять версию тега, изменить один файл правил, выполнить
    `copier update` и посмотреть на РЕЗУЛЬТАТ: сохранились ли правки владельца, где легли маркеры
    конфликта; (4) выполнить `copier check-update --quiet` на не обновлённой копии и проверить, что
    код выхода 2 — то есть гейт отставания реально работает; (5) проверить ловушку тегов: сделать
    шаблон грязным и убедиться, что без `-r HEAD` берётся тег. Замер, который решает: сохранились ли
    правки владельца и отдал ли гейт код 2. Если хотя бы одно нет — пункт 3 заменяется альтернативой
    «свой гейт поверх ai_managed_checksums».
