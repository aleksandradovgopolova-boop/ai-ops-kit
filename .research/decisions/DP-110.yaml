# DecisionPackage по RR-010 (OWASP ASI гэп-чек кита). Quick-роутинг: судья — перед accept.
schema_version: 1
kind: research.decision-package
id: DP-110
request_id: RR-010
decision:
  question: Какие дыры security-контура кита относительно OWASP ASI01–ASI10 закрывать первыми?
decision_brief: 'Хорошая новость: по свежему канону OWASP (ASI01–ASI10, декабрь 2025) кит силён ровно там, где падают
  агентные системы — злоупотребление инструментами (ASI02), выполнение кода (ASI05), каскадные сбои (ASI08) и эксплуатация
  доверия человека (ASI09) покрыты реализованными механизмами. Честный итог маппинга: 4 сильных, 3 частичных, 3
  слабых. Топ-3 дыры по соотношению риск/стоимость: (1) supply chain (ASI04): integrity-контроль managed-слоя у
  installer УЖЕ есть (checksums), но для внешних артефактов (веса моделей по pinned_revision, скиллы skills-catalog,
  MCP) пути верифицированной установки НЕТ — создать его, переиспользуя механику checksums, ~1-2 дня; (2) отравление
  памяти (ASI06): у памяти кита конвенция provenance/expiry уже объявлена (memory/README.md) и частично инструментирована
  (merge_memory.py, validate_freshness.py opt-in), но НЕ enforced — включить enforcement (валидатор записи + подключить
  freshness + no-self-ingestion), ~день-два, синергия с FeatureLearning; (3) идентичность агентов (ASI03): короткоживущих
  per-agent кредов нет — минимум: честно записать ограничение в постуру и политику TTL для ключей, полноценное решение
  дороже и может подождать. Для сравнения: Microsoft у себя насчитал 7 полных + 3 частичных. Следующий шаг: принять
  топ-2 в ближайшие доработки кита; DP пойдёт судье перед accept (quick-роутинг).'
cost_of_recommendation:
  one_time: 'Дыра 1 (ASI04): hash-verification + enforced pinned_revision в installer — ~1 день (installer и конвенция
    уже есть). Дыра 2 (ASI06): перенос правил research-памяти (provenance/expiry/no-self-ingestion) на memory/lessons-learned
    кита — ~1-2 дня, естественно ложится в мост FeatureLearning. Дыра 3 (ASI03): документирование ограничения +
    TTL-политика — часы; полноценные per-agent short-lived креды — недели, отложить.'
  recurring: Пересверка с ASI-каноном — в квартальный re-scan (документ версии 2026, обновится не раньше конца 2026).
  owner_required: Инженер кита (дыры 1-2 — при ближайших доработках); Sasha — приоритизация.
  note: Оценки writer'а; сильная сторона — постура кита уже честная (partial/declared не завышены), маппинг это
    сохранил.
recommendation:
  preferred_option: 'close-top2-document-third: закрыть ASI04 (enforced пиновка+hash в installer) и ASI06 (перенос
    research-правил памяти на память кита) в ближайших доработках; по ASI03 — честная запись ограничения + TTL-политика,
    полноценное решение отложить; ASI07 пометить «применимо при федерации»; покрытие ASI02/05/08/09 задокументировать
    как сильную сторону (материал для позиционирования)'
  confidence: medium
  confidence_rationale: 'Канон и митигации — первичный PDF OWASP с verbatim (EV-801…EV-803); маппинг — self-evidence
    по файлам кита с честными статусами постуры (EV-805), но интерпретация риск↔механизм — суждение writer''а без
    независимой проверки: спот-чек судьи обязателен перед accept (quick-роутинг). Приоритизация топ-3 — оценка стоимости
    writer''ом.'
rationale:
- 'Канон установлен: ASI01–ASI10 (Version 2026, релиз 2025-12-09, peer review NIST/EC/Turing — EV-801, EV-802);
  сверка ведётся против него, а не против устаревших списков.'
- 'Сильное покрытие — 4 риска реализованными механизмами (EV-805): ASI02 (tool_broker+policy, 6 permission-уровней,
  capability-scope v3.4), ASI05 (jail, разделение генерации/исполнения), ASI08 (fail-closed gates, commit barrier,
  budget/loop-политики), ASI09 (writer≠judge, анти-штамповка, evidence-правило доменов) — это совпадает со сквозными
  принципами OWASP (Least Agency, HITL, sandbox — EV-803) и является материалом для позиционирования кита.'
- 'Дыра №1 — ASI04 supply chain: OWASP требует pinning по content hash и подписанные манифесты (EV-803). У кита
  integrity managed-слоя УЖЕ есть (installer .checksums.json, sha256, блокировка drift), но для ВНЕШНИХ артефактов
  пути нет: pinned_revision (DP-106) не заполняется/не проверяется кодом, скиллы skills-catalog ставятся вручную
  на child без integrity, MCP=declared (EV-805). Фикс = СОЗДАТЬ путь верифицированной установки/проверки внешних
  деклараций (новый подкоманд installer или расширение), переиспользуя существующую механику checksums — не «добавить
  проверку в существующую установку».'
- 'Дыра №2 — ASI06 memory poisoning: OWASP требует валидацию memory writes, provenance, expiry, запрет re-ingestion
  своих выводов (EV-803). У кита конвенция уже ОБЪЯВЛЕНА (memory/README.md), merge_memory.py пишет provenance-поля,
  validate_freshness.py даёт opt-in expiry — но ENFORCEMENT отсутствует (запись без provenance не отклоняется, freshness
  к memory/ не подключён, нет trust-scores/no-self-ingestion) (EV-805). Фикс = включить enforcement поверх готовых
  механизмов (укрепляет оценку 1-2 дня); прямая синергия с мостом FeatureLearning (v3.3).'
assumptions:
- Однохостовая локальная модель кита сохраняется на горизонте решения (иначе ASI03/ASI07 поднимаются в приоритете).
- 'Оценки стоимости: дыра 2 (~1-2 дня) укреплена — переиспользуются готовые memory/README-конвенция, merge_memory.py,
  validate_freshness.py; дыра 1 (~1-2 дня, пересмотрено с ~1) — путь создаётся заново, но механика checksums managed-слоя
  переиспользуется.'
constraints_addressed:
  evidence_over_reputation: 'Соблюдён: канон и митигации — первичный PDF (не пересказы), маппинг — по файлам кита
    с locator''ами; кейс Microsoft (маркетинговое ''all 10'' = 7+3 в их же доке, EV-804) использован как предостережение,
    его структура таблицы — как референс.'
  honest_statuses: 'Соблюдён: итог 4/3/3 не приукрашен (сравн.: Microsoft self-assessment 7/3/0); частичные и слабые
    названы прямо, включая неудобное про ASI03.'
risks:
- 'Маппинг — суждение writer''а по документации/валидаторам, не пентест: реальная стойкость механизмов не проверялась
  атаками (red-team-checklist кита существует, но его прогон вне скоупа RR).'
- ASI-канон свежий (v2026) — интерпретации сообщества могут уточняться; пересверка в квартальном re-scan.
- Закрытие ASI06 переносом правил не должно раздуть память кита процессами research-центра — переносить правила
  записи, не весь конвейер.
unknowns:
- Реальная стойкость покрытий ASI02/05/08/09 под атакой (нужен red-team прогон — отдельное решение).
- Точная стоимость создания пути верифицированной установки внешних деклараций (managed-слой уже имеет checksums
  для переиспользования, но точки установки внешних скиллов/весов в installer нет — путь создаётся, не расширяется).
proposed_validation:
  experiment: 'По принятии: (1) дыра 1 подтверждается негативным тестом СОЗДАННОГО пути: установка/проверка внешней
    декларации (вес модели по pinned_revision или скилл каталога) с изменённым содержимым при зафиксированном hash
    ОБЯЗАНА падать (тест в CI); (2) дыра 2 — фальсифицируемо через validate_freshness.py --strict по memory/: запись
    без обязательного provenance/stability-frontmatter = ошибка, просроченная запись = ошибка при --strict (retrieval-критерий
    НЕ используется — память кита в retrieval не индексируется); (3) записи постуры по ASI03/ASI07 проходят validate_security_posture
    с новыми честными статусами. Спот-чек EV-805 судьёй выполнен ДО accept.'
