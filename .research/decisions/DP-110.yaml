# DecisionPackage по RR-010 (OWASP ASI гэп-чек кита). Quick-роутинг: судья — перед accept.
schema_version: 1
kind: research.decision-package
id: DP-110
request_id: RR-010
decision:
  question: "Какие дыры security-контура кита относительно OWASP ASI01–ASI10 закрывать первыми?"
decision_brief: "Хорошая новость: по свежему канону OWASP (ASI01–ASI10, декабрь 2025) кит силён ровно там, где падают агентные системы — злоупотребление инструментами (ASI02), выполнение кода (ASI05), каскадные сбои (ASI08) и эксплуатация доверия человека (ASI09) покрыты реализованными механизмами. Честный итог маппинга: 4 сильных, 3 частичных, 3 слабых. Топ-3 дыры по соотношению риск/стоимость: (1) supply chain (ASI04): конвенция пиновки версий есть, но установка её НЕ проверяет — добавить hash-verification в installer, ~день; (2) отравление памяти (ASI06): у research-центра защита уже построена (provenance, проверка цитат, сроки годности) — перенести те же правила на память кита, ~день-два, синергия с твоим FeatureLearning; (3) идентичность агентов (ASI03): короткоживущих per-agent кредов нет — минимум: честно записать ограничение в постуру и политику TTL для ключей, полноценное решение дороже и может подождать. Для сравнения: Microsoft у себя насчитал 7 полных + 3 частичных. Следующий шаг: принять топ-2 в ближайшие доработки кита; DP пойдёт судье перед accept (quick-роутинг)."
cost_of_recommendation:
  one_time: "Дыра 1 (ASI04): hash-verification + enforced pinned_revision в installer — ~1 день (installer и конвенция уже есть). Дыра 2 (ASI06): перенос правил research-памяти (provenance/expiry/no-self-ingestion) на memory/lessons-learned кита — ~1-2 дня, естественно ложится в мост FeatureLearning. Дыра 3 (ASI03): документирование ограничения + TTL-политика — часы; полноценные per-agent short-lived креды — недели, отложить."
  recurring: "Пересверка с ASI-каноном — в квартальный re-scan (документ версии 2026, обновится не раньше конца 2026)."
  owner_required: "Инженер кита (дыры 1-2 — при ближайших доработках); Sasha — приоритизация."
  note: "Оценки writer'а; сильная сторона — постура кита уже честная (partial/declared не завышены), маппинг это сохранил."
recommendation:
  preferred_option: "close-top2-document-third: закрыть ASI04 (enforced пиновка+hash в installer) и ASI06 (перенос research-правил памяти на память кита) в ближайших доработках; по ASI03 — честная запись ограничения + TTL-политика, полноценное решение отложить; ASI07 пометить «применимо при федерации»; покрытие ASI02/05/08/09 задокументировать как сильную сторону (материал для позиционирования)"
  confidence: medium
  confidence_rationale: "Канон и митигации — первичный PDF OWASP с verbatim (EV-801…EV-803); маппинг — self-evidence по файлам кита с честными статусами постуры (EV-805), но интерпретация риск↔механизм — суждение writer'а без независимой проверки: спот-чек судьи обязателен перед accept (quick-роутинг). Приоритизация топ-3 — оценка стоимости writer'ом."
rationale:
  - "Канон установлен: ASI01–ASI10 (Version 2026, релиз 2025-12-09, peer review NIST/EC/Turing — EV-801, EV-802); сверка ведётся против него, а не против устаревших списков."
  - "Сильное покрытие — 4 риска реализованными механизмами (EV-805): ASI02 (tool_broker+policy, 6 permission-уровней, capability-scope), ASI05 (jail, разделение генерации/исполнения), ASI08 (fail-closed gates, commit barrier, budget/loop-политики), ASI09 (writer≠judge, анти-штамповка, evidence-правило доменов) — это совпадает со сквозными принципами OWASP (Least Agency, HITL, sandbox — EV-803) и является материалом для позиционирования кита."
  - "Дыра №1 — ASI04 supply chain: OWASP требует pinning по content hash и подписанные манифесты (EV-803); у кита конвенция pinned_revision принята (DP-106), но installer её не enforce'ит, hash-verification нет, tool-mcp-connection=declared (EV-805). Закрытие дёшево: механика installer+checksums уже существует для managed-слоя."
  - "Дыра №2 — ASI06 memory poisoning: OWASP требует валидацию memory writes, provenance, expiry, запрет re-ingestion своих выводов (EV-803) — всё это у research-центра УЖЕ реализовано (quote-verify, freshness, supersession, спот-чек self-evidence), но на память самого кита (memory/lessons-learned, learnings из merge_memory) не перенесено (EV-805). Перенос конвенций — прямая синергия с мостом FeatureLearning (v3.3)."
  - "Дыра №3 — ASI03 identity: short-lived task-scoped креды и per-agent identity (EV-803) в локальной модели кита отсутствуют — ключи живут в env без TTL (EV-805). Честный минимум сейчас — записать ограничение в постуру (кит и так ведёт честные статусы) и политику ротации; полная реализация — при выходе за однохостовую модель, вместе с ASI07 (межагентные подписи — «применимо при федерации»)."
assumptions:
  - "Однохостовая локальная модель кита сохраняется на горизонте решения (иначе ASI03/ASI07 поднимаются в приоритете)."
  - "Оценки стоимости дыр 1-2 (~1-2 дня) корректны, т.к. опираются на существующие механики (installer/checksums, правила research-памяти) — проверяется при реализации."
constraints_addressed:
  evidence_over_reputation: "Соблюдён: канон и митигации — первичный PDF (не пересказы), маппинг — по файлам кита с locator'ами; кейс Microsoft (маркетинговое 'all 10' = 7+3 в их же доке, EV-804) использован как предостережение, его структура таблицы — как референс."
  honest_statuses: "Соблюдён: итог 4/3/3 не приукрашен (сравн.: Microsoft self-assessment 7/3/0); частичные и слабые названы прямо, включая неудобное про ASI03."
risks:
  - "Маппинг — суждение writer'а по документации/валидаторам, не пентест: реальная стойкость механизмов не проверялась атаками (red-team-checklist кита существует, но его прогон вне скоупа RR)."
  - "ASI-канон свежий (v2026) — интерпретации сообщества могут уточняться; пересверка в квартальном re-scan."
  - "Закрытие ASI06 переносом правил не должно раздуть память кита процессами research-центра — переносить правила записи, не весь конвейер."
unknowns:
  - "Реальная стойкость покрытий ASI02/05/08/09 под атакой (нужен red-team прогон — отдельное решение)."
  - "Точная стоимость enforced-пиновки в installer (зависит от текущего кода установки деклараций)."
proposed_validation:
  experiment: "По принятии: (1) реализация дыры 1 подтверждается негативным тестом — установка декларации с изменённым содержимым при зафиксированном hash ОБЯЗАНА падать (тест в CI); (2) дыра 2 — правила памяти кита проверяются тем же классом тестов, что у research (запись без provenance отклоняется; просроченная запись не участвует в retrieval); (3) записи постуры по ASI03/ASI07 проходят validate_security_posture с новыми честными статусами. Судья (quick-роутинг) выполняет спот-чек EV-805 по файлам ДО accept."
