schema_version: 1
kind: research.decision-package
id: DP-115
request_id: RR-016
created_at: "2026-08-19"
author: "claude (writer, RR-016)"

decision:
  question: >-
    Фиксировать ли «репозиторий — источник истины продукта, AI Ops — операционная система
    разработки» как фундаментальный принцип кита с машиночитаемой моделью сущностей, и в каком
    объёме: что входит в канон, какие связи обязательны, что наследует дочка, где место словаря
    типов коммитов.

decision_brief: >-
  Принцип фиксировать — да, но не как новый словарь. Замер показал: сущности у кита уже есть
  (восемь контуров, пятнадцать типов узлов, research-контур, FeatureLearning), а обязательных
  связей между ними нет: из 42 закрытых работ 42 имеют цель, результат и место проверки, и лишь
  5 упоминают решение или исследование, на основании которых взяты. «Почему» при этом написано —
  прозой в комментариях (748 строк из 1182 в плане), то есть в форме, которую код кита прочитать
  не может. Рекомендация: ввести ОДНУ обязательную связь — обратную («на каком основании эта
  работа»), закрыть её списком допустимых оснований с резолвимым идентификатором, и принять
  правило «новый тип сущности вводится только вместе с названным потребителем». Цена: одно поле
  в схеме работы, валидатор, разбор 28 активных работ; типы коммитов — последним шагом и как
  производная от контуров, не как корень. Топ-риск: поле выродится в отписку. Следующий шаг —
  дешёвая проверка на уже закрытых 42 работах ДО правки схемы: восстанавливается ли основание из
  прозы. Реализация упирается в действующую заморозку умений — решение можно принять сейчас,
  строить придётся после второго brownfield-прогона.

cost_of_recommendation:
  one_time: >-
    Поле `basis` в схеме работы + проверка в delivery_plan.validate + описание правила входа
    сущности в реестре модели: работа уровня одной инженерной задачи кита. Отдельно — разбор
    оснований для 28 активных и 42 закрытых работ; по замеру прозы (748 и 906 строк комментариев)
    основание в большинстве случаев уже написано и требует переноса, а не восстановления.
  recurring: >-
    Одно дополнительное поле при заведении работы. Постоянная цена не в наборе текста, а в
    дисциплине: основание должно быть резолвимым идентификатором, иначе проверка выродится в
    формальность. Плюс поддержание списка допустимых видов основания при появлении новых
    источников работы.
  owner_required: >-
    Три решения владельца: (1) блокирует ли отсутствие основания закрытие работы или остаётся
    предупреждением; (2) что делать с Knowledge Graph — дать потребителя или вывести из канона
    (сегодня он объявлен и мёртв, что противоречит собственному правилу кита «правило без
    исполнения не правило»); (3) считается ли эта работа новым умением по действующей заморозке
    или попадает в оговорку «снижает цену процесса».

recommendation:
  preferred_option: >-
    Зафиксировать принцип и модель в реестре, но обязательной сделать ОДНУ связь — обратную
    («на каком основании»), с закрытым списком видов основания; ввести правило «тип сущности
    входит в канон только с названным потребителем»; наследование дочкой строить как baseline с
    правом переопределения источника истины и сигналов; словарь типов коммитов вводить последним
    и выводить из контуров, а не из вкуса.
  confidence: medium
  confidence_rationale: >-
    Внутренняя часть опирается на прямые замеры собственного репозитория и трёх дочек, внешняя —
    на первоисточники (OSLC, Conventional Commits, Backstage, Product Talk, MLflow). Не high по
    двум причинам: правило «сущность без потребителя умирает» обобщено с двух наблюдений, а
    ключевой механизм (обратная связь как обязательное поле) на живом потоке работ ещё не
    проверялся — предложенная валидация как раз это и меряет. Стороннего ревью пакет не проходил.

rationale:
  - "Словарь сущностей уже существует и уже машиночитаем: восемь контуров с источниками истины, сигналами и ролями, замкнутых в цикл, с семью состояниями артефакта (EV-1140). Предлагать «спроектировать модель» как отсутствующую — значит строить вторую рядом с действующей."
  - "Второй словарь — типы и связи Knowledge Graph — тоже есть (15 типов, 21 связь), но не имеет ни одного потребителя в продуктовом пути: валидатор зовут только тесты и документация (EV-1141)."
  - "Цена сущности без потребителя измерена: в единственной дочке с графом он не менялся 667 коммитов, содержит 13 узлов feature при 31 каталоге фич и не знает ни одного из 86 ADR (EV-1142). Это тот же исход, о котором предупреждает сам реестр модели."
  - "Разрыв цепочки локализован замером: 42 из 42 закрытых работ имеют связь вперёд (цель, названный результат, место проверки), 5 из 42 — любое упоминание решения или исследования назад, 1 из 28 среди активных (EV-1143). Значит не хватает именно обратной связи, а не сущностей."
  - "Основание при этом фактически пишется — прозой в комментариях (748 из 1182 строк активного плана, 906 из 1923 строк истории, EV-1143). Задача не «заставить объяснять», а дать объяснению место, читаемое кодом."
  - "Связей нет по устройству схем, а не по недосмотру: у WorkItem нет ни одного поля-ссылки на решение или исследование, у эпизода решения — только свободнотекстовый source, а единственный сомкнутый мост в ките — FeatureLearning, где feature, decision_package и evidence лежат рядом (EV-1144). Мост уже спроектирован — его нужно распространить, а не изобрести."
  - "Обратную связь можно потребовать в момент создания записи, связь вперёд требует возврата к записи позже — и потому гниёт первой; ровно это и видно в графе ИИ-Среды (EV-1142, EV-1154)."
  - "Отраслевой словарь для этого существует и делит жизненный цикл на требования, изменения, проверки и архитектуру со ссылочной трассируемостью (OSLC, OASIS, EV-1149) — но решает задачу связывания РАЗНЫХ инструментов, а не хранения истины в репозитории; поэтому его уместно брать как проверку полноты словаря, а не как формат."
  - "Массовый живой каталог сущностей (Backstage) держит канон малым и существует потому, что его читают плагины (EV-1151) — прямое подтверждение правила «тип с потребителем»."
  - "Типы коммитов не годятся на роль корня модели: общепринятая спецификация обязывает ровно два типа (feat, fix) и не содержит типов для решения или исследования, потому что коммит классифицирует изменение кода, а не продуктовое событие (EV-1150). В ките при этом словаря коммитов нет вовсе (EV-1146) — вводить его можно позже и как производную от контуров."
  - "AI-специфичные типы prompt и model в индустрии решены не префиксом коммита, а версионируемым реестром артефактов с привязкой версии к оценке (EV-1153): префикс потерял бы главное — что показала оценка этой версии."
  - "Наследование дочкой обязано включать право спорить: два измеренных случая дали 6 ложных находок из 9 (niti, слой FSD) и 12 из 41 (ИИ-Среда, ADR не по объявленному пути), и оба лечились не правкой кита, а правом дочки заменить сигнал и объявить свой источник истины (EV-1147)."
  - "Наследуется сегодня план и направление, но не память: decisions/registry.yaml нет ни в одной из трёх дочек при required: true в модели, product-learning и .research — ни в одной (EV-1148). Значит «дочка получает baseline» в части знания сейчас не выполняется, и это первое, что делает цепочку невоспроизводимой у дочки."
  - "Research-контур изолирован намеренно: доменные сущности не импортируются, ссылки только строковые, установка .research/ в дочку отложена до v0.3 (EV-1145). Поэтому связь Research → Decision в каноне должна быть объявлена как строковая ссылка, а не как объектная — иначе канон вступит в конфликт с действующим инвариантом."

alternatives:
  - option: "Ввести полный канон сущностей сразу (Research, Insight, Decision, Plan, Feature, Implementation, Eval, Release, Observation) с деревьями /product, /project, /architecture, /ai"
    appropriate_when: "Продукт стартует с нуля и действующей модели контуров ещё нет; тогда единая структура дешевле, чем согласование с существующей. В ките это создало бы вторую истину рядом с product-operating-model."
  - option: "Начать со словаря типов коммитов и commitlint"
    appropriate_when: "Нужен быстрый видимый порядок в истории и нет цели отвечать на вопрос «почему построили»; даёт классификацию изменений кода, но не связывает сущности."
  - option: "Дать Knowledge Graph потребителя и строить цепочку на нём"
    appropriate_when: "Есть готовность оплатить поддержание графа как отдельного артефакта; тогда 15 типов и 21 связь уже описаны. Отвергнуто как первый шаг: граф требует ручного ведения параллельно плану, и именно на этом он умер в ИИ-Среде."
  - option: "Принять OSLC как формат"
    appropriate_when: "Нужна интеграция с промышленными ALM/PLM-инструментами (DOORS, Jama, Polarion); для репозитория как источника истины несёт цену RDF-стека без выигрыша."

assumptions:
  - "Основание работы в большинстве случаев уже известно в момент её заведения — подтверждается объёмом прозы в комментариях, но не проверено на потоке новых работ."
  - "Владелец согласна отвечать «на каком основании» одной строкой при постановке задачи; при отказе механизм вырождается в поле, которое заполняет агент задним числом."
  - "Заморозка умений будет снята после второго brownfield-прогона в обозримый срок; иначе решение остаётся принятым, но нереализованным."

constraints_addressed:
  additive_only: "Соблюдён: рекомендация добавляет одно поле и одно правило, не меняет действующие схемы, реестры и гейты; предложенное вводится в существующие файлы, новых деревьев не создаётся."
  no_second_source_of_truth: "Соблюдён и является главным доводом против исходного предложения о деревьях /product, /project, /architecture, /ai — они дублировали бы product-operating-model."
  research_isolation_preserved: "Соблюдён: связь Research → Decision объявляется строковой ссылкой, .research/ в дочку не устанавливается, пять правил изоляции не затрагиваются (EV-1145)."
  child_can_disagree: "Соблюдён явно: канон наследуется как baseline, дочка вправе объявить свой источник истины, снять или заменить сигналы и добавить собственные типы в своём пространстве имён; переопределять канонические типы и состояния не вправе (EV-1147)."

risks:
  - "Основание выродится в отписку («обращение владельца») — тогда поле создаст видимость связности при её отсутствии. Смягчение: закрытый список видов основания, из которых два требуют резолвимого идентификатора, и замер доли отписок в валидации."
  - "Правило «тип только с потребителем» задним числом делает Knowledge Graph нарушителем собственного канона: придётся либо дать ему потребителя, либо вывести из реестра. Молчаливое сохранение статус-кво противоречит принципу кита о правилах без исполнения."
  - "Работа попадает под действующую заморозку умений (ep-2026-08-17-capability-freeze-until-second-brownfield). Оговорка про «снижение цены процесса» применима не очевидно: обязательное поле цену процесса скорее повышает. Риск — принять решение и начать строить в обход собственного предохранителя."
  - "Дочка получит требование, для которого у неё нет артефактов: решений и исследований в дочках нет (EV-1148). Требовать основание раньше, чем дочка получит место для решений, — воспроизвести случай ИИ-Среды с вечной находкой на 12 из 41."
  - "Замер обратной связи сделан на репозитории самого кита, который ведёт одна команда с высокой дисциплиной; перенос доли 5/42 на дочек не обоснован."

unknowns:
  - "Нужны ли в каноне узлы «возможность» и «допущение», которые отраслевая практика discovery ставит между целью и фичей (EV-1152); у кита их нет, и неизвестно, отвечает ли на этот вопрос ROADMAP или это реальный пробел."
  - "Какой механизм связывает коммит с сущностью дешевле — трейлер в сообщении коммита, ссылка в записи работы или оба; ни один не проверялся."
  - "Выдерживает ли требование основания темп чужого проекта: замеров на дочке нет вовсе."
  - "Что делать с работами, основание которых — «так решили в разговоре»: сегодня такие есть, и честного идентификатора у них не существует."
  - "Останется ли Knowledge Graph в каноне после применения правила о потребителе — это решение владельца, а не вывод исследования."

proposed_validation:
  experiment: >-
    ДВА ШАГА, дешёвый перед необратимым.
    ШАГ 1 (до любой правки схемы, ~1 час): взять все 42 закрытые работы и попытаться восстановить
    основание каждой ИЗ УЖЕ НАПИСАННОЙ ПРОЗЫ, записав результат в один из четырёх видов
    (решение с id / исследование с id / находка поля с id / обращение владельца без id).
    Порог продолжения: восстановлено ≥35 из 42 (83%), из них с резолвимым идентификатором ≥25.
    Порог провала: восстановлено <28 из 42 или доля «обращение владельца без id» >40% — тогда
    информации в репозитории нет, поле её не создаст, и рекомендация отклоняется целиком.
    ШАГ 2 (после введения поля, на следующих 10 закрываемых работах): доля работ с резолвимым
    основанием ≥9 из 10; ответ на вопрос «почему это построили» собирается по артефактам без
    обращения к человеку не менее чем в 8 случаях из 10 и укладывается в 2 минуты; доля отписок
    («обращение владельца» без идентификатора при существующем решении по теме) ≤3 из 10.
    Порог отката: отписок ≥4 из 10 либо ответ требует человека чаще, чем в 2 случаях из 10.
    КОНФАУНДЕР, который нужно развести в учёте: часть работ второго шага будут заведены той же
    сессией, что и меряет, — их долю зафиксировать отдельно, выводы делать по работам, заведённым
    в другой сессии. Замер n=10 отсеивает провал, но не доказывает превосходство: при прохождении
    порогов решение остаётся обратимым (two-way), поле — необязательным для дочек до отдельного
    прогона на живой дочке.

