created_at: "2026-08-19"
author: "claude (writer, RR-016; вторая редакция после независимого ревью)"

decision:
  question: >-
    Фиксировать ли «репозиторий — источник истины продукта, AI Ops — операционная система
    разработки» как фундаментальный принцип кита с машиночитаемой моделью сущностей, и в каком
    объёме: что входит в канон, какие связи обязательны, что наследует дочка, где место словаря
    типов коммитов.

decision_brief: >-
  Принцип фиксировать — да, но строить почти нечего: модель уже есть, и первый шаг дешевле, чем
  казалось. Восемь контуров с источниками истины работают и проверяются гейтом; поля-связки
  работы `decision` и `finding` УЖЕ объявлены в коде плана, механика резолвимости ссылки для них
  написана — но их не требует никто, и они пусты 0 из 42. Проверяемые связи при этом заполнены
  полностью: цель 42/42, затронутые контуры 28/28, место перепроверки 42/42. Правило, которое из
  этого следует: заполняется ровно то, что проверяется. Рекомендация: не вводить новую сущность и
  не заводить новое поле, а включить проверку уже объявленного — потребовать у работы хотя бы одно
  основание (решение, исследование или находка поля) с резолвимой ссылкой. Словарь типов коммитов
  вводить не нужно: он принят 18.08.2026 и исполняется воротами; открыт лишь вопрос, добавлять ли
  к коммиту ссылку на решение и ехать ли этому правилу в дочку. Топ-риск: потребность владельца в
  ответе «почему это построили» нигде не доказана, а обязательное поле цену процесса повышает —
  поэтому первый шаг валидации проверяет потребность, а не механизм.

cost_of_recommendation:
  one_time: >-
    Не новое поле, а включение проверки существующих: в `ai_ops_kit/planning/delivery_plan.py`
    поля `decision`/`finding` уже объявлены в LINK_KEYS, а резолвимость пути уже проверяется для
    `evidence`/`finding` — требуется правило «у закрываемой работы есть хотя бы одно основание» и
    резолвинг идентификатора решения по реестру. Это правка порядка десятков строк плюс тесты,
    а не новая сущность. Отдельно — разбор оснований для уже существующих работ: по независимому
    замеру основание восстанавливается из прозы у 26 из 42 закрытых и 21 из 28 активных.
  recurring: >-
    Одна строка при заведении работы. Постоянная цена — дисциплина: основание должно быть
    резолвимым, иначе проверка выродится в формальность. Плюс поддержание списка видов основания.
  owner_required: >-
    Три вопроса, и все три действительно открыты. (1) Остаётся ли Knowledge Graph в обязательной
    части: сегодня его читает необязательный флаг отчёта, ни один гейт его не требует, и в
    единственной дочке с ним он простоял 645 коммитов без изменения — либо дать ему требующего
    потребителя, либо снять с обязательных. (2) Едет ли в дочку то, что у кита уже работает:
    формат коммитов живёт в воротах родителя и в дочку не поставляется. (3) Подтверждается ли
    сама потребность — нужен ли ответ «почему это построили» и в каких ситуациях он нужен
    (ответ владельца заменяет первый шаг валидации).

recommendation:
  preferred_option: >-
    Зафиксировать принцип, но первым шагом ВКЛЮЧИТЬ ПРОВЕРКУ УЖЕ ОБЪЯВЛЕННОГО: потребовать у
    работы хотя бы одно основание (`decision` / `finding` / ссылка на исследование) с резолвимой
    ссылкой — новых сущностей, полей и деревьев не создавать. Принять правило «тип живёт ровно
    настолько, насколько его читают» и применить его к Knowledge Graph. Наследование дочкой
    строить как baseline с правом объявить свой источник истины и снять чужой сигнал. Словарь
    типов коммитов не вводить — он принят; обсуждать только ссылку на решение в коммите и
    доставку этого правила до дочки.
  confidence: medium
  confidence_rationale: >-
    Внутренние числа независимо пересчитаны судьёй и совпали, а три ошибочных утверждения первой
    редакции исправлены по коду. Не high по трём причинам: правило «заполняется то, что
    проверяется» проверено на одном репозитории с одной командой; потребность владельца не
    эвидентна и заведена как гипотеза; второй судейский раунд после правок не проводился.

rationale:
  - "Модель контуров уже машиночитаема, замкнута в цикл, имеет источники истины и исполняемый гейт (EV-1140) — поэтому предлагать её проектирование заново значило бы строить вторую истину рядом с действующей."
  - "Обязательные связи между сущностями УЖЕ ЕСТЬ и заполнены полностью: цель 42/42 закрытых и 28/28 активных, затронутые контуры 28/28, место перепроверки результата 42/42 (EV-1143). Утверждение «связей нет» неверно; не запрошена ровно одна связь — с решением или исследованием."
  - "Поля для этой связи тоже уже объявлены: `decision` и `finding` перечислены как поля-связки в коде плана, а резолвимость ссылки для `evidence`/`finding` уже проверяется ошибкой — и при этом `decision` и `finding` заполнены 0 раз из 42 (EV-1143). Строить нечего: нужно потребовать."
  - "Правило, которое поддерживают данные, — не «обратная связь дешевле», а «заполняется ровно то, что проверяется»: полнота полей совпадает не с направлением связи, а с наличием валидатора (EV-1154). Первая редакция вывела отсюда правило о направлении; независимое ревью показало, что направление в этом наборе данных неотделимо от принуждения."
  - "Основание при этом фактически пишется — прозой: 748 из 1182 строк активного плана и 906 из 1923 строк истории комментарии, а по независимому замеру основание восстанавливается у 26 из 42 закрытых и 21 из 28 активных работ (EV-1143, EV-1155). Задача не «заставить объяснять», а дать объяснению машиночитаемое место."
  - "Тип сущности живёт настолько, насколько его читают: Knowledge Graph читается необязательным флагом отчёта прогона и не требуется ни одним гейтом — и в единственной дочке с ним он простоял 645 коммитов без изменения, содержит 13 узлов-фич при 31 каталоге и не знает ни одного из 86 принятых там решений (EV-1141, EV-1142). Модель контуров, у которой потребитель обязателен, живёт (EV-1140)."
  - "Массовый внешний каталог сущностей держит канон малым, и каждый тип существует потому, что его читают плагины (EV-1151) — независимое подтверждение того же правила в чужой архитектуре."
  - "Словарь типов коммитов у кита уже принят и исполняется воротами с 18.08.2026, только для новых коммитов, решением владельца от 17.08 (EV-1146). Вопрос «вводить ли» закрыт до этого исследования; открыт вопрос «расширять ли и чем»."
  - "Расширять его типами `decision` и `research` не следует: общепринятая спецификация обязывает ровно два типа и не содержит таких, потому что коммит классифицирует изменение кода, а не продуктовое событие (EV-1150). Связь коммита с решением уместнее нести ссылкой, читаемой в обе стороны, чем префиксом, читаемым в одну."
  - "AI-специфичные prompt и model в индустрии решены версионируемым реестром артефактов с привязкой версии к оценке (EV-1153): префикс потерял бы главное — что показала оценка этой версии."
  - "Отраслевой словарь жизненного цикла существует и делит его на требования, изменения, проверки и архитектуру со ссылочной трассируемостью (OSLC, EV-1149), но связывает РАЗНЫЕ инструменты, а не хранит истину в репозитории — поэтому уместен как проверка полноты словаря, а не как формат."
  - "Наследование обязано включать право спорить: два измеренных случая дали 6 ложных находок из 9 и 12 из 41, и оба лечились не правкой кита, а правом дочки заменить сигнал и объявить свой источник истины (EV-1147)."
  - "Дочка сегодня наследует план и направление, но не память: файла решений, выученного и исследовательского контура нет ни в одной из трёх (EV-1148). При этом решения у дочки ЕСТЬ — 86 записей по собственному адресу (EV-1142): требование основания упрётся не в отсутствие решений, а в чужое пространство идентификаторов."
  - "Research-контур изолирован намеренно, ссылки только строковые, установка в дочку отложена до v0.3 (EV-1145) — поэтому связь Research → Decision в каноне объявляется строкой, иначе канон вступит в конфликт с действующим инвариантом."

alternatives:
  - option: "Ввести полный канон сущностей и деревья /product, /project, /architecture, /ai"
    appropriate_when: "Продукт стартует с нуля и модели контуров ещё нет; в ките создало бы вторую истину рядом с действующей."
  - option: "Ввести отдельное новое поле `basis` вместо включения `decision`/`finding`"
    appropriate_when: "Если бы полей-связок не существовало; сегодня это ровно вторая правда об одном и том же — вариант отклонён по находке ревью."
  - option: "Дать Knowledge Graph обязательного потребителя и строить цепочку на нём"
    appropriate_when: "Есть готовность вести граф параллельно плану; необязательный потребитель у него уже есть, а измеренная смерть в дочке показывает цену ручного ведения."
  - option: "Принять OSLC как формат"
    appropriate_when: "Нужна интеграция с промышленными ALM/PLM-инструментами; для репозитория как источника истины несёт цену без выигрыша."

assumptions:
  - "Основание работы известно в момент её заведения — поддержано замером восстановимости 26/42 и 21/28, но не проверено на потоке новых работ."
  - "Владелец согласна называть основание одной строкой; при отказе поле заполняет агент задним числом, и проверка становится формальностью."
  - "Резолвинг идентификатора решения можно сделать терпимым к чужому адресу (у дочки решения лежат по своему пути) — иначе правило воспроизведёт случай с вечной ложной находкой."

constraints_addressed:
  additive_only: "Соблюдён и усилен после ревью: новых полей, сущностей и деревьев не создаётся — включается проверка уже объявленных полей."
  no_second_source_of_truth: "Соблюдён: первая редакция предлагала поле `basis` рядом с существующими `decision`/`finding` — это и было нарушением, найденным ревью и устранённым."
  research_isolation_preserved: "Соблюдён: связь Research → Decision объявляется строковой ссылкой, .research/ в дочку не устанавливается."
  child_can_disagree: "Соблюдён: канон наследуется как baseline, дочка вправе объявить свой источник истины, снять или заменить сигнал и добавить свои типы в своём пространстве имён."

risks:
  - "Основание выродится в отписку. Смягчение: закрытый список видов, из которых два требуют резолвимой ссылки, и отдельный учёт доли отписок в замере."
  - "Правило «тип живёт, пока его читают» задним числом ставит вопрос о Knowledge Graph: необязательный потребитель у него есть, обязательного нет. Сохранение статус-кво молча противоречит принципу кита о правилах без исполнения."
  - "Требование основания упрётся в чужое пространство идентификаторов у дочки: решения там есть, но по своему адресу (86 записей в ИИ-Среде). Без терпимости к чужому адресу правило воспроизведёт ложную находку 12 из 41."
  - "Потребность не доказана: ни одно доказательство пакета не показывает, что владельцу нужен ответ «почему это построили», а действующий принцип dp-004 требует сокращать расстояние от намерения до проверенного результата — обязательное поле его скорее удлиняет. Поэтому потребность заведена как гипотеза и проверяется первой."
  - "Замер сделан на репозитории кита, который ведёт одна команда с высокой дисциплиной; перенос долей на дочку не обоснован."
  - "Дефект метода первой редакции повторим: три несущих отрицания были опровергнуты чтением кода, которого писатель не открыл. Перед введением правила нужно перечитать те места, где оно, возможно, уже частично реализовано."

unknowns:
  - "ГИПОТЕЗА, а не факт: нужен ли владельцу ответ «почему это построили» и в каких ситуациях. Проверяется первым шагом валидации."
  - "Нужны ли в каноне узлы «возможность» и «допущение», которые отраслевая практика discovery ставит между целью и фичей (EV-1152)."
  - "Едет ли формат коммитов и ссылка на решение в дочку — сегодня инструменты живут в воротах родителя."
  - "Что делать с работами, основание которых — «так решили в разговоре»: честного идентификатора у них не существует."
  - "Остаётся ли Knowledge Graph в каноне после применения правила о потребителе — решение владельца, не вывод исследования."
  - "Не проверяются этим исследованием и осознанно отложены: правило «тип живёт, пока его читают» как общий закон и модель наследования дочкой — для обоих нужен прогон на живой дочке, которого не было."

proposed_validation:
  experiment: >-
    ТРИ ШАГА, от самого дешёвого и обратимого.
    ШАГ 0 — ПОТРЕБНОСТЬ (разговор, 10 минут): задать владельцу вопрос на её материале — взять три
    закрытые работы кита и спросить, нужен ли ей ответ «почему это построили» и в каких ситуациях
    он возникает. Порог провала: если такой вопрос у неё не возникает или разрешается быстрее
    чтением истории — рекомендация отклоняется целиком, независимо от красоты модели.
    ШАГ 1 — БАЗА: фактически исполнен независимым судьёй (EV-1155): основание восстанавливается у
    26 из 42 закрытых (62%) и 21 из 28 активных (75%). Заданный первой редакцией порог «≥35 из 42»
    данными НЕ проходит и заменён измеренной базой: дальнейшие пороги строятся от 62%.
    ШАГ 2 — МЕХАНИЗМ (после включения проверки, на следующих 10 закрываемых работах): доля работ с
    резолвимым основанием должна вырасти с базы 62% до ≥90%; ответ на вопрос «почему это
    построили» собирается по артефактам без обращения к человеку не менее чем в 8 случаях из 10;
    доля отписок — «обращение владельца» без ссылки при существующем решении по теме — ≤3 из 10.
    Порог отката: отписок ≥4 из 10 либо ответ требует человека чаще, чем в 2 случаях из 10.
    КТО СУДИТ ОТПИСКУ: не писатель работы, а отдельная сессия по правилу «существует ли по этой
    теме решение в реестре, на которое ссылки нет».
    КОНФАУНДЕР: часть работ будет заведена той же сессией, что и меряет; их долю фиксировать
    отдельно, выводы делать по работам, заведённым другой сессией. n=10 отсеивает провал, но не
    доказывает превосходство — решение остаётся обратимым, для дочек правило не включается до
    отдельного прогона.
    ОТЛОЖЕНО ЯВНО: правило «тип живёт, пока его читают» и модель наследования дочкой этой
    валидацией не проверяются.

evidence_ids: [EV-1140, EV-1141, EV-1142, EV-1143, EV-1144, EV-1145, EV-1146, EV-1147, EV-1148, EV-1149, EV-1150, EV-1151, EV-1152, EV-1153, EV-1154, EV-1155]

review:
  reviewed_by: "независимая сессия-судья (read-only), раунд 1, 19.08.2026"
  verdict: needs_work
  notes: >-
    Вердикт раунда 1 — needs_work при сохранённом направлении рекомендации. Девять major-находок.
    Три несущих отрицания опровергнуты кодом того же репозитория: поля-связки `decision`/`finding`
    уже объявлены (delivery_plan.py:58), словарь типов коммитов уже принят и исполняется воротами
    с 18.08.2026 (pyproject.toml:206), у Knowledge Graph есть необязательный потребитель
    (run_report.py:54). Методологический дефект: правило «связь вперёд гниёт» снято с набора
    данных, где направление связи неотделимо от наличия валидатора. Два из трёх вопросов к
    владельцу оказались уже решёнными (принцип dp-002 о non-blocking вводе проверок; заморозка
    умений морозит только цели с freeze_relation: extension). Потребность владельца не эвидентна
    и не помечена гипотезой при действующем принципе dp-004. Порог шага 1 задан вслепую: судья
    пересчитал и получил 26/42 и 21/28. Minor: связей 20, а не 21; счёт коммитов 667 не
    воспроизводится (645 при привязке к коммиту); локатор EV-1144 не указывал на источник цитаты;
    склейка источников в четырёх EV; два отрицательных утверждения с reliability high.
    ЧТО ИСПРАВЛЕНО ВО ВТОРОЙ РЕДАКЦИИ: переписаны EV-1141, EV-1143, EV-1146, EV-1154; уточнены
    EV-1142 и EV-1144; добавлен EV-1155 с независимым пересчётом; рекомендация переведена с
    «ввести поле basis» на «включить проверку уже объявленных полей»; вопрос о коммитах
    переформулирован; из owner_required убраны решённые вопросы; потребность заведена гипотезой и
    поставлена первым шагом валидации; отложенное помечено явно. Второй судейский раунд НЕ
    проводился — поэтому статус пакета остаётся draft.
