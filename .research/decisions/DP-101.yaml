# Живой DecisionPackage первого боевого прогона (RR-001).
schema_version: 1
kind: research.decision-package
id: DP-101
request_id: RR-001
decision:
  question: "Какую модель использовать как основную для генерации Personal Cosmic Book (длинный русскоязычный текст)?"
recommendation:
  preferred_option: deepseek-v4-flash
  confidence: medium
  confidence_rationale: "Стоимость, контекст и ограничения API подтверждены первичными источниками; решающий фактор — качество длинной русской прозы — ни одним источником не измерен, поэтому выше medium подняться нельзя до собственного eval."
rationale:
  - "Единственная опция, закрывающая все три constraint запроса: ≈$0.06/книга (EV-108), контекст 1M и выход до 384K токенов — книга генерируется одним вызовом без склейки глав (EV-101)."
  - "Ценовой разрыв с качественным флагманом Kimi K3 ~37x (EV-108): при неизвестной разнице качества на русском дешёвый вариант — правильная точка старта для эксперимента, а не для капитуляции по качеству."
  - "Прежние имена моделей deepseek-chat/reasoner отключаются 24.07.2026 — пайплайн сразу строится на именах V4 (EV-102)."
alternatives:
  - option: kimi-k3
    appropriate_when: "Слепой eval покажет заметно лучшее качество русской прозы И юнит-экономика книги выдерживает ~$2.10/книга (EV-103, EV-105, EV-108). Кандидат на роль премиум-тира."
  - option: deepseek-v4-pro
    appropriate_when: "V4-flash провалит eval по качеству, а K3 не пройдёт по экономике: середина по цене (≈$0.17/книга) в той же линейке API (EV-101, EV-108)."
  - option: kimi-k2.6
    appropriate_when: "Доминируемая опция, и после ре-фетча цен 2026-09-10 сильнее прежнего: официальная цена Moonshot $0.95/$4.00 за 1M даёт ≈$0.59/книга (EV-107, EV-108) — это дороже v4-pro в 3,4 раза, при меньшем контексте (262K) и выше потолка ~$0.5/книга из допущений ниже. Рассматривать только если eval покажет неожиданное преимущество на русском, и тогда не через официальный API, а через дешёвый маршрут OpenRouter (≈$0.46/книга, EV-108) — что добавляет зависимость от стороннего провайдера."
assumptions:
  - "Профиль книги: ~100K токенов выхода и ~200K входа за генерацию, кэш не учтён (проверяется экспериментом)."
  - "Превосходство Kimi K3 на англоязычном EQ-Bench переносится на русскую прозу лишь частично или не переносится (проверяется слепым ревью)."
  - "Юнит-экономика книги допускает не более ~$0.5/книга для основной модели массового тира."
risks:
  - "Цены volatile. Пересчёт по этому риску уже отработан свипом 2026-09-10: истекавшие 2026-09-22 ценовые данные по K2.6 и расчёт стоимости книги заменены на EV-107/EV-108 (freshness до 2026-11-11); EV-101/EV-103 годны до 2026-10-22 и в тот прогон живым re-fetch НЕ перепроверялись, то есть цифры deepseek и K3 в этом пакете держатся на сроке годности, а не на свежем замере. Следующая точка пересчёта — 2026-10-22."
  - "EQ-Bench англоязычный: экстраполяция превосходства K3 на русскую прозу может не подтвердиться (EV-105)."
  - "Цена K2.6 по-прежнему из агрегатора, а не с первичной страницы платформы Kimi, но теперь снята со строки официального провайдера дословной цитатой и совпала с одним из ранее противоречивших обзоров ($0.95/$4.00); второе расхождение ($0.60/$2.50) осталось неразрешённым (EV-107)."
  - "Расхождение цены K2.6 с июльским замером ($0.66/$3.41) не объяснено: подорожание за два месяца или изначально приписанная Moonshot чужая строка таблицы (сегодня пара $0.65/$3.41 принадлежит стороннему CoreWeave) — задним числом по внешним данным не различить (EV-107). Для решения это не критично, но снижает доверие к ценам K2.6 как таковым."
unknowns:
  - "Качество художественного русского текста 50K+ токенов не сравнивалось напрямую ни одним доступным бенчмарком — главный пробел."
  - "Официальная цена K2.6 с первичной страницы платформы Kimi так и не получена: $0.95/$4.00 — строка официального провайдера в листинге OpenRouter (вторичный источник), а не публикация вендора (EV-107)."
  - "Деградация качества к финальным главам (longform-метрика) для конкретных кандидатов не извлечена."
  - "Фактический профиль токенов пайплайна книги (вход/выход/кэш) — допущение, не измерение."
proposed_validation:
  experiment: "Сгенерировать 20 одинаковых глав (русский, ~4K токенов каждая, единый промпт) на deepseek-v4-flash, deepseek-v4-pro и kimi-k3; слепое ревью качества + замер деградации к последним главам и фактической стоимости. По результату — подтвердить основную модель и решить, нужен ли премиум-тир на K3."
