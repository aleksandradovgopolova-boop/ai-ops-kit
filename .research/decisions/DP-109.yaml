# DecisionPackage по RR-009 (ECC + ruflo: что взять в кит).
# v2 по итогам judge-ревью (major: «ECC = upstream Hermes Sasha» — совпадение имён, опровергнуто локальной
# проверкой (~/.hermes = Nous Research Hermes Agent); пороги пилота n=3 как подтверждение; селективная
# свежесть аудита ruflo; + alternatives, tool-theater-смоук для ECC, quote-фиксы EV-703/708/731/734).
schema_version: 1
kind: research.decision-package
id: DP-109
request_id: RR-009
decision:
  question: Что взять в кит из ECC (everything-claude-code) и ruflo, и чем они являются для кита?
decision_brief: 'Два репо оказались разного сорта. ECC (бывший everything-claude-code, 232.9k звёзд, MIT) — карьер
  компонентов с документированным авторским ядром и неоднородным хвостом: рекомендуем задекларировать 5 позиций
  в skills-catalog (gateguard, eval-harness+self-evaluation, continuous-learning-v2, context-budget, skill-scout/stocktake)
  после вычитки с tool-theater-смоуком, и взять идею «декларативный гейт + PreToolUse-enforcement в сессии» в пилот;
  агентов целиком не брать (жанровые дубли; поимённая сверка — в вычитке). Важная поправка проверки: «Hermes» в
  ECC — стек автора ECC; твой локальный Hermes — Hermes Agent от Nous Research, ДРУГОЙ проект (совпадение имён,
  личной релевантности нет). ruflo (переименованный claude-flow, 65.8k звёзд, MIT) — НЕ декларировать: задокументирована
  фабрикация в прошлой версии (Math.random-метрики, verifySignature≡true при ~10 работающих инструментах из 300+);
  статус watch, забрать два паттерна (hooks-модель; HNSW-память — референс по прочтении кода ТЕКУЩЕЙ версии) и анти-урок
  «tool-theater check» для гейтов. Цена: вычитка+декларации ~1-2 дня, пилот ~2-3 дня. Топ-риск: коммерциализация
  ECC (Pro $19/seat). Следующий шаг: вычитка 5 позиций + пилот gateguard-гибрида.'
cost_of_recommendation:
  one_time: 'Вычитка 5 ECC-позиций per-skill (LICENSE наследуется от корня MIT, но происхождение community-скиллов
    проверять) + декларации в skills-catalog: ~1-2 дня. Пилот gateguard-гибрида (PreToolUse-хук поверх декларативного
    гейта кита): ~2-3 дня. ruflo: 0 (watch).'
  recurring: 'ECC в квартальный re-scan (октябрь, вместе с DP-108-ландшафтом): движение Pro-границы и конвенций;
    ruflo — там же (перепроверка аудита на текущей версии).'
  owner_required: Sasha — решение о декларациях; инженер кита — пилот gateguard.
  note: Оценки writer'а; вычитка может отсеять позиции.
recommendation:
  preferred_option: ECC = quarry+reference (5 деклараций в skills-catalog + пилот gateguard-гибрида; агентов не
    импортировать); ruflo = watch-only (не декларировать до независимого подтверждения зрелости; забрать 2 паттерна
    и анти-урок для гейтов)
  confidence: medium
  confidence_rationale: 'Факты обоих репо — первоисточники с verbatim (клон ECC на pinned commit, GitHub API, LICENSE-файлы);
    слабости: боевое качество ECC-скиллов не проверялось (декларации это допускают — status: declared по конвенции
    кита), аудит ruflo датирован v3.5.51 при текущей v3.32.x (направление согласуется с self-reported бенчмарками
    «1.3×–1953×», но числа аудита могли устареть), заявление ECC «+2.25 балла» — self-reported.'
rationale:
- 'ECC идентифицирован и масштабен: переименован из everything-claude-code, MIT файлом, 232.9k звёзд, очень активен,
  распространяется как Claude Code plugin с явным разрешением покомпонентного копирования (EV-701, EV-702). Жанр
  — гибрид: MIT-каталог по факту, система по амбиции с коммерческой надстройкой Pro (EV-701, EV-702); для кита это
  карьер + конкурент по конвенциям одновременно.'
- 'Проверка «личной релевантности» дала ОБРАТНЫЙ результат (улов judge, проверено локально 2026-07-25): «Hermes»
  из ECC — операторский стек автора ECC (EV-703), а локальный Hermes Sasha — Hermes Agent от Nous Research (~/.hermes/SOUL.md)
  — другой проект, совпадение имён. Пункт о совместимости с личным стеком снят; ценность ECC для кита от этого не
  зависит.'
- 'Пять позиций в skills-catalog (все с путями, ядро авторское и документированное — EV-708): gateguard (EV-704),
  eval-harness + agent-self-evaluation (EV-705), continuous-learning-v2 (EV-706 — паттерн релевантен и Product Learning
  v0.3 research-модуля), context-budget/strategic-compact и skill-scout/skill-stocktake (EV-707 — готовый процесс-прецедент
  пополнения каталога кита). Агентов ECC целиком не импортировать: 67 против 51 кита — жанровые дубли (EV-708).'
- 'Главная заимствуемая ИДЕЯ из ECC — точка enforcement''а: гейты кита УЖЕ исполняемы (gates.yaml → tools/gate_executor.py,
  enforced_by-механика — EV-214-контекст), но enforcement происходит на уровне прогона/CI; ECC ставит его В СЕССИЮ
  — PreToolUse-хук блокирует инструмент до предъявления фактов (EV-704). Гибрид «декларация в gates.yaml → генерируемый
  session-хук» добавляет раннюю точку enforcement''а без второго источника истины; отношение хука к gate_executor
  — явный критерий пилота, не unknown. Цифру «+2.25» не переносим (self-reported).'
- 'ruflo идентифицирован однозначно: переименованный claude-flow (ruvnet), MIT, 65.8k звёзд, активен с реальным
  ядром (EV-731, EV-734). НЕ декларировать в каталог: по EV-735 задокументирована фабрикация в v3.5.51 (Math.random-метрики,
  verifySignature()≡true, ~10 из 300+ инструментов), и хотя числа аудита могли устареть (оговорка версии), позитивного
  свидетельства исправления нет, а README продолжает нести бенчмарки «1.3×–1953×» (EV-733) — каталог кита не должен
  вводить пользователей в заблуждение декларацией непроверенного инструмента. Забрать: (а) hooks-модель «init и
  работай как обычно» (EV-732); (б) HNSW-память с локальными embeddings — С ТОЙ ЖЕ версионной оговоркой, что и негативы
  аудита: как референс только по прочтении кода текущей версии (EV-735); (в) анти-урок: методология аудита — чеклист
  для потенциального гейта «tool-theater check» (инструмент реально исполняет vs JSON-заглушка).'
assumptions:
- MIT корня ECC покрывает вычитываемые скиллы (community-скиллы наследуют — проверяется вычиткой per-skill).
- Гибрид гейт+хук реализуем генерацией хука из gates.yaml без второго источника истины (проверяется пилотом).
- 'Аудит ruflo (v3.5.51) остаётся направленно верным для v3.32.x — единственная опора: перепроверка 3-5 указателей
  аудита в октябрьском re-scan; до неё выводы о текущей версии не делаются.'
constraints_addressed:
  license_compatible_commercial: ECC — MIT файлом (EV-701); ruflo — MIT файлом (EV-734); коммерческие надстройки
    (ECC Pro, Cognitum.One у ruflo) не затрагивают открытые части, но векторы relicensing — в risks.
  fits_kit_declared_pattern: 'Соблюдён: ECC-позиции — декларации status: declared в skills-catalog (не зависимости);
    ruflo не декларируется вовсе; гибрид-хук — генерируется из существующего реестра.'
  evidence_over_reputation: 'Соблюдён: оба репо верифицированы первоисточниками (клон ECC на pinned commit; GitHub
    API + LICENSE + независимый аудит для ruflo); self-reported цифры обоих (+2.25, 1.3×–1953×) помечены и не переносятся.'
risks:
- 'ECC коммерциализируется (Pro $19/seat, GitHub App): граница MIT/Pro может сдвигаться — при вычитке фиксировать
  commit-pin, в re-scan следить за перемещением ядровых скиллов в Pro.'
- 'Хвост каталога ECC — свалка нишевых доменов (EV-708): декларировать только вычитанные позиции, не плагин целиком.'
- 'ruflo: экстремальный churn (v3.8→v3.32 за недели), 828 issues, вектор коммерциализации Cognitum.One — даже паттерны
  заимствовать по прочитанному коду, не по README.'
- 'Аудит ruflo — один автор и устаревшая версия: не использовать его цифры как факт о текущей версии (в DP они с
  оговоркой), только как основание для watch-статуса.'
- 'Гибрид гейт+хук может создать иллюзию двойного enforcement: пилот должен показать, что хук строго производен
  от gates.yaml.'
- Поимённая сверка агентов 67↔51 не проводилась на этапе скана — риск пропуска недублирующихся ценных агентов ECC
  принят и закрывается в вычитке (дешёвый diff по назначению).
unknowns:
- Боевое качество 5 ECC-позиций (вычитка+пилот).
- Состояние ruflo v3.32.x против аудита v3.5.51.
- Совместимость PreToolUse-хуков с gate_executor кита.
proposed_validation:
  experiment: 'Две части: (1) ECC: вычитка 5 позиций per-skill — происхождение (origin), лицензионная чистота community-вкладов,
    структура, И tool-theater-смоук (скрипты/хуки позиции реально исполняются, а не заглушки — тот же стандарт,
    что предъявлен ruflo) И дешёвая поимённая сверка агентов 67↔51 (diff по назначению; находки ≥3 ценных недублей
    — отдельным дополнением к DP) → декларации в skills-catalog с commit-pin; затем пилот gateguard-гибрида на одном
    child: генерация PreToolUse-хука из одного гейта gates.yaml; ПОРОГИ (стоп-сигнальная семантика): 6 сценариев
    (3 «должен блокировать» + 3 нормальных, отбор: 2 из них adversarial, составляет не автор генератора) — ЛЮБОЙ
    провал = стоп; полное прохождение = только допуск к расширенному прогону (n>=20 сценариев, протокол фиксируется
    тогда), НЕ подтверждение качества гибрида; отдельный критерий: хук строго производен от gates.yaml и не конфликтует
    с gate_executor (двойной enforcement = fail); (2) ruflo: пилот НЕ проводится (watch); октябрьский re-scan —
    перепроверка 3-5 указателей аудита на текущей версии и чтение кода HNSW-модуля перед использованием как референса.'
