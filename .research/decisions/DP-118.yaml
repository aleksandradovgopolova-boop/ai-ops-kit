schema_version: 1
kind: research.decision-package
id: DP-118
request_id: RR-020
decision:
  question: >
    Брать ли unreallabsai/unreal-agent кандидатом в исполнители-писатели кита рядом с claude-cli,
    каким первым шагом, и меняет ли он позиционирование кита и что-либо для ии-среды?
decision_brief: >
  Рекомендация: взять КАНДИДАТОМ и поставить один замер, не начинать интеграцию. Он не конкурент —
  это слой исполнения под нашим слоем управления, и он структурно снимает единственный остаток
  замера 18.09: локальный писатель сериализуется машинным замком, а отдельный процесс его не делит
  (EV-1183, EV-1186). Цена пробы — часы, не направление: контракт подключения писателя у нас уже
  есть (EV-1184), раннер headless и говорит JSONL (EV-1175). Топ-риски: проекту вторые сутки
  публично и PR они не принимают (EV-1172, EV-1181); своего клиента Anthropic нет, наш сильный
  писатель сегодня Claude (EV-1177); вывод о параллельности не измерен (EV-1186). Следующий шаг —
  замер из proposed_validation; до него в реестр рантаймов ничего не пишем.
cost_of_recommendation:
  one_time: >
    Замер: ~4-8 часов (поднять образ, прогнать три пакета двумя писателями, свести числа). Если
    замер зелёный, интеграция провайдера по образцу claude-cli — ещё ~1-2 дня вместе с тестами.
  recurring: >
    Токены стороннего провайдера (OpenAI/OpenRouter) на каждый прогон писателя — статья расходов,
    которой у локального `claude -p` не было. Плюс сопровождение адаптера к чужому проекту, который
    патчей не принимает: любое расхождение чинится у нас или обходится, ~несколько часов на релиз
    чужой версии.
  owner_required: >
    Владелец — на решение о ключе и бюджете провайдера (это его деньги и его периметр данных) и на
    засчёт замера. Инженерную часть кит делает сам.
  note: >
    Отдельная неучтённая статья: более дешёвый и быстрый писатель увеличивает поток изменений на
    судящую сторону кита. Стоимость этого — не деньги, а риск, и она названа в risks.
recommendation:
  preferred_option: >
    Принять как КАНДИДАТА в сменные писатели (полка, не внедрение) и провести один
    предрегистрированный замер параллельности против текущего пути. Ничего не менять в
    registry/runtimes.yaml, в маршрутизации и в дефолтах до результата замера.
  confidence: medium
  confidence_rationale: >
    Все посылки о чужой стороне сняты с первоисточника-кода, а не с README, и наша сторона
    задокументирована собственным замером — поэтому не low. Но центральное утверждение
    («снимает границу параллельных писателей») остаётся выводом по устройству без единого прогона
    (EV-1186), а зрелость источника — вторые сутки публично (EV-1172) — поэтому не high.
rationale:
  - >
    Это не сосед по жанру и не конкурент: харнес отвечает за исполнение одного агента — inbox,
    ходы, операции, сессия с форком (EV-1173) — и не содержит ни гейтов, ни независимого ревью, ни
    доставки. Перечисление инструментов подтверждает узость намеренно: Bash, ViewImage, SkillUse, и
    MCP вынесен из открытого раннера отдельным коммитом (EV-1180). Поэтому формулировку EV-673 о
    позиционировании кита этот источник не затрагивает — он играет на другой оси, и это вывод по
    составу его кода, а не отговорка.
  - >
    Главная ценность адресная: наш остаток после замера 18.09 — не код, а среда, и назван он был
    точно: локальные `claude -p` делят машинный замок, выходы — ключ, фан-аут или машины (EV-1183).
    Headless-процесс с собственной сессией (EV-1175, EV-1176) — это ровно первый из названных
    выходов, доведённый до готового бинарника (EV-1186).
  - >
    Стоимость подключения низкая, потому что контракт уже написан не под него: «кит владеет
    worktree, diff, гейтами и доставкой, писатель только предлагает изменения» (EV-1184), а форма
    запроса раннера намеренно повторяет Claude Agent SDK, включая принимаемые-но-игнорируемые поля
    (EV-1176). Меняется бинарник, не контракт.
  - >
    Дисциплина проекта проверяема и высокая: половина кодовой базы — тесты, CI гоняет гонки, vet,
    gofmt, четыре fuzz-цели и сборку бенчмарк-бандла на двух ОС (EV-1179). Это снижает — но не
    снимает — риск незрелости, потому что ни один из этих тестов мы не запускали сами.
  - >
    Побочная находка, ценная отдельно от основного решения: навыки читаются как `*/SKILL.md` с
    фронтматтером name/description и подаются модели описанием, а тело — по запросу (EV-1178). То
    есть наш скилл кладётся в чужой раннер без переписывания, и заявление «роль, а не исполнитель»
    получает третий настоящий рантайм дёшево.
  - >
    Для ии-среды прямой выгоды нет: это Node/TS-продукт с базой и своим CI, которому собственный
    агентский харнес как функция не требовался ни в одном известном прогоне (EV-1185). Выгода
    дошла бы туда только косвенно — кит пишет для неё быстрее. Называть это «ценностью для
    ии-среды» было бы подменой: tech-push вместо продуктовой потребности.
alternatives:
  - option: "Ничего не делать; ждать API-ключ для `--provider anthropic` и параллелить существующим движком"
    appropriate_when: >
      Владелец готов оплатить ключ Anthropic в ближайшем цикле. Тогда граница снимается без новой
      зависимости и без второго провайдера в периметре — это ДЕШЕВЛЕ по совокупности, и замер из
      proposed_validation обязан это учесть как базовую линию сравнения.
  - option: "Взять только формат скиллов как подтверждение совместимости, сам раннер не трогать"
    appropriate_when: >
      Если замер параллельности покажет, что выигрыша нет или качество писателя заметно ниже: тогда
      из находки остаётся полезным лишь EV-1178, и она ничего не стоит.
  - option: "Внедрять сразу как второй writer-провайдер, без замера"
    appropriate_when: >
      Не рекомендуется ни при каких известных условиях: центральное утверждение не измерено
      (EV-1186), а внедрение до замера превращает предположение в зависимость.
constraints_addressed:
  evidence_over_reputation: >
    Соблюдён: ни одно утверждение о чужом проекте не взято из README без сверки с кодом; звёзды и
    активность зафиксированы как метаданные (EV-1172), а не как аргумент качества.
  one_source_one_evidence: >
    Соблюдён: каждый файл-первоисточник получил свою запись (README, преамбула, README раннера,
    usage.go, каталог клиентов, registry.go, remote_job.go, CI+Makefile, CONTRIBUTING, go.mod).
  negative_claims_qualified: >
    Соблюдён: «клиента Anthropic нет» (EV-1177) и «агентский харнес ии-среде не требовался»
    (EV-1185) даны с охватом проверки и reliability не выше medium.
  same_criterion_applies_to_us: >
    Соблюдён: наша сторона подана такими же evidence (EV-1183, EV-1184, EV-1185) и помечена как
    self-evidence для спот-чека судьи; наша граница названа до того, как названо чужое достоинство.
  no_live_run_claimed_without_measurement: >
    Соблюдён: ни раннер, ни его тесты не запускались, и это сказано в EV-1175, EV-1179 и EV-1186;
    центральный вывод помечен как inference и вынесен в валидацию.
assumptions:
  - >
    Владелец готов пустить второго внешнего провайдера (OpenAI или OpenRouter) в контур писателя.
    Если нет — рекомендация теряет смысл целиком, потому что своего клиента Anthropic там нет
    (EV-1177), а через OpenRouter это другой периметр данных и другая экономика.
  - >
    Задачи, на которых мерим, останутся теми же по сложности, что в замере 18.09 — иначе числа
    параллельности будут несопоставимы с базовой линией.
risks:
  - >
    Зрелость: публично проекту вторые сутки (EV-1172), версия нулевая. Ранний срез чужой внутренней
    кодовой базы может ломаться между тегами.
  - >
    Управляемость: PR не принимаются (EV-1181) — на дефект у нас есть issue или форк, но не патч в
    upstream. Для зависимости в горячем пути писателя это существеннее, чем звучит.
  - >
    Провайдерский разрыв: наш сильный писатель сегодня Claude, а нативного клиента Anthropic там
    нет (EV-1177). Сравнение «быстрее» рискует оказаться сравнением разных моделей, а не разных
    харнесов — замер обязан развести эти конфаундеры.
  - >
    Среда: требуется Go 1.27 и свежая стандартная библиотека (EV-1182); на машине владельца Go нет.
    Значит путь — опубликованный образ, а это ещё одна доверенная внешняя артефактная цепочка.
  - >
    Системный, а не технический: более дешёвый и быстрый писатель увеличивает поток изменений в
    судящую часть кита. Риск ложно-зелёного он не снижает НИКАК — в нём нет ни гейтов, ни ревью,
    ни доставки (EV-1173, EV-1180). Если пропускная способность судьи не растёт вместе с писателем,
    выигрыш скорости обернётся ростом недопроверенного.
unknowns:
  - >
    Качество писателя на НАШИХ задачах: ни одного прогона не было, сравнения с claude-cli по доле
    доведённых до зелёного задач нет.
  - >
    Реальный потолок параллельности: EV-1186 — рассуждение по устройству, не замер. Сколько
    писателей поедет на одном ключе до упора в rate-limit, неизвестно.
  - >
    Терминал-бенч и прочие числа производительности в репозитории не опубликованы; мы их не видели
    и не воспроизводили.
  - >
    Поведение при исполнении инструментов в удалённой песочнице: контракт remote_job есть, готовой
    реализации в открытой части нет (EV-1180) — значит изоляция писателя средой остаётся нашей
    работой, а не их поставкой.
  - >
    Отработает ли наш скилл ai-ops под их моделью и преамбулой: совместим ФОРМАТ (EV-1178),
    про содержание не проверено ничего.
proposed_validation:
  experiment: >
    Предрегистрированный замер до любого внедрения; критерии фиксируются здесь и после прогонов не
    меняются. УСТАНОВКА: три независимых пакета в РАЗНЫХ каталогах одного фикстурного репозитория
    (та же схема, что в замере 18.09, иначе числа несопоставимы). Три руки: (A) текущий путь —
    локальный `claude -p`; (B) unreal-agent-runner из опубликованного образа, три процесса
    одновременно; (C) базовая линия-альтернатива — `--provider anthropic` по ключу, если ключ есть.
    Субстрат, задачи, гейты и ревьюер держатся константными; меняется только писатель.
    ЧТО МЕРИМ: (1) wall-clock от старта первого пакета до зелёного последнего; (2) фактическая
    одновременность — число писателей, писавших в перекрывающиеся интервалы (из таймстемпов, а не
    со слов); (3) доля пакетов, доведённых до зелёного без вмешательства; (4) число ложно-зелёных,
    пойманных независимым ревьюером; (5) стоимость прогона в токенах и деньгах.
    ПОРОГИ (фальсифицируемые): рука B засчитывается ТОЛЬКО если фактическая одновременность >= 2
    писателей (то есть машинный замок действительно не воспроизводится) И wall-clock меньше руки A
    не менее чем на 30% И доля доведённых до зелёного не ниже руки A более чем на 10 процентных
    пунктов И ложно-зелёных ноль. ПРОВАЛ объявляется, если одновременность = 1 (замок
    воспроизвёлся в другой форме), либо появился хотя бы один ложно-зелёный, либо доля доведённых
    упала больше чем на 10 п.п.
    ЧЕГО ЗАМЕР НЕ ДОКАЗЫВАЕТ И ЧТО ОТЛОЖЕНО: n=3 пакета — это стоп-сигнал, а не доказательство
    превосходства; формулировка «B лучше A» по такому n запрещена, допустимы только «у B
    воспроизвёлся решающий провал» либо «B прошёл и достоин второго, более широкого замера».
    Качество писателя по существу (архитектурные решения, читаемость) этим замером НЕ измеряется и
    отложено явно. Конфаундер «разные модели» разводится так: рука B гоняется дважды — на модели
    провайдера по умолчанию и на Claude через OpenRouter; если разрыв между этими двумя прогонами
    больше разрыва B против A, замер признаётся измерившим модель, а не харнес, и не засчитывается.
    Судит исход третий актор — владелец либо независимый judge, не писавший ни одной руки.
evidence_ids: [EV-673, EV-1172, EV-1173, EV-1174, EV-1175, EV-1176, EV-1177, EV-1178, EV-1179, EV-1180, EV-1181, EV-1182, EV-1183, EV-1184, EV-1185, EV-1186]
