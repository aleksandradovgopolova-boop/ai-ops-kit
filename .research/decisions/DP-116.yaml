# DecisionPackage по RR-017 — прогон соседа ai-sdlc-framework/ai-sdlc через research-контур.
#
# Линия соседей по жанру: RR-008 (EV-660 «цепочки не обнаружено») -> RR-013 (EV-673 суперсидит:
# цепочка воспроизведена, но кит единственный по совокупности) -> RR-014 (EV-673 удержался) ->
# RR-017 (этот). Главный результат — не список инструментов, а обновление вывода EV-673:
# EV-1170 его суперсидит. ai-sdlc — сильнейший найденный сосед; две из трёх осей уникальности кита
# у него закрыты, а по spec/SDK/комплаенсу он шире. Разведка шла по КОДУ первоисточника, не по
# README (урок RR-014 про Galileo: маркетинг ≠ код).
schema_version: 1
kind: research.decision-package
id: DP-116
request_id: RR-017
decision:
  question: "Что взять/подсмотреть/отвергнуть из ai-sdlc и держится ли вывод EV-673 о единственности кита по совокупности?"
decision_brief: >
  ГЛАВНОЕ: вывод EV-673 не держится — EV-1170 его суперсидит. ai-sdlc реплицирует цепочку кита
  ИСПОЛНЯЕМЫМ кодом (EV-1162), с writer≠judge в коде, закрывающим fallback-коллапс ревью на
  исполнителя (EV-1163) — сильнее, чем было у multi-agents-control-plane; с реализованной
  аттестацией evidence-на-SHA (EV-1164), delivery-транзакцией (EV-1165, автономия experimental) и
  dogfood (EV-1166); по спецификации, conformance, трём SDK и комплаенсу — шире кита (EV-1168).
  РЕКОМЕНДАЦИЯ: (1) для позиционирования — перестать говорить «единственный с цепочкой»; честная
  дифференциация сузилась до двух УЗКИХ осей (после лова judge, EV-1171): research как персистентная
  память ФАКТОВ RR->EV->DP с provenance/freshness/memory-first — НЕ «у соседа нет контура решений»
  (у ai-sdlc есть реализованный Decision-каталог RFC-0035, EV-1171; отличие лишь в форме) — и модель
  «установка+governance над дочкой+живая квалификация» против adopter-фреймворка (EV-1169). ПОДСМОТРЕТЬ ИДЕЕЙ, без зависимости: механизм
  independence.ts (декларативное requiresIndependentHarnessFrom + защита от fallback-коллапса) как
  проверку зрелости собственного writer≠judge; conformance-набор на СВОИ схемы как исполняемый тест
  спецификации; DSSE/Merkle-аттестацию как эталон «evidence на SHA». ОТВЕРГНУТЬ как заимствование:
  переход на TypeScript-монорепо, публичные SDK, автономный оркестратор — это другая модель
  дистрибуции, не узкое место кита. ЦЕНА: нулевая денежно (всё — идеи, не зависимости); риск —
  устаревание (ландшафт подвижен, EV volatile до 2026-12-02). СЛЕДУЮЩИЙ ШАГ: решение владельца по
  формулировке позиционирования; DP идёт к accept -> требуется раунд judge (writer≠judge).
cost_of_recommendation:
  one_time: >
    Позиционирование: правка формулировок в VISION/README/DP-107/DP-109, где кит назван
    «единственным с цепочкой» — 0.5-1 день редактуры, решение владельца. «Подсмотреть идеей» —
    это не разовая стоимость внедрения, а вход в бэклог как гипотезы (по одной работе на ось,
    оценка при заведении). Заимствований кода нет, поэтому разовой инженерной цены пакета нет.
  recurring: >
    Ноль постоянной стоимости: ни одна рекомендация не вводит зависимость и не едет в дочку.
    Единственное повторяющееся обязательство — освежать этот охват: EV volatile истекают
    2026-12-02, до accept любого продуктового решения на их основе нужен мини-скан (правило центра).
  owner_required: >
    Решение владельца обязательно по пункту позиционирования (как теперь называть дифференциацию
    кита, когда «единственный с цепочкой» опровергнут). Пункты «подсмотреть идеей» решения не
    требуют — они заводятся гипотезами в план и проверяются там; «отвергнуть» решения не требует.
  note: >
    Денежная цена — ноль. Это competitive-intelligence-пакет, а не набор к внедрению: его ценность
    в исправленном самопозиционировании и трёх откалиброванных идеях, не в новом коде кита.
recommendation:
  preferred_option: >
    Принять обновление вывода (EV-1170 суперсидит EV-673) и переписать позиционирование кита:
    дифференциация — не «единственный с цепочкой» (опровергнуто ai-sdlc), а две узкие оси —
    research-как-контракт-решений и модель установки-с-governance-над-дочкой, обе поданные как
    «другой выбор модели», не «превосходство». Три идеи (independence-декларации, conformance на
    свои схемы, DSSE-аттестация как эталон) завести гипотезами в план, без зависимостей. Смену
    языка/дистрибуции ai-sdlc отвергнуть как нерелевантную узким местам кита.
  confidence: medium
  confidence_rationale: >
    Ядро вывода — high: цепочка воспроизведена, механизм writer≠judge, аттестация и ширина по
    spec/SDK/комплаенсу прочитаны построчно в коде и RFC первоисточника (EV-1162..1164, 1168).
    Но часть про СУЖЕНИЕ дифференциации кита опирается на medium-записи: EV-1167 — негатив по
    охвату (смотрелся каталог research/ и верх дерева, не каждый модуль), EV-1169 — самосвидетельство
    о ките. Живой прогон оркестратора и верификатора аттестаций ai-sdlc не наблюдался; автономный
    режим у соседа помечен experimental. Поэтому не high: «реплицировано кодом» доказано, «работает
    в проде у соседа» — нет.
rationale:
  - "Вывод EV-673 обязан был обновиться, а не воспроизвестись: критерий линии соседей — «реплицирует ли цепочку ПО КОДУ». EV-1162 показывает orchestrator/src как ~90 модулей TypeScript с парными vitest-тестами (admission*, progressive-gates, execute.ts 64 КБ, review*, provenance, audit-*), то есть исполняемый контур execution+gates+review+delivery, а не markdown-инструкции агенту (чем оказался mestre-yoda в RR-014)."
  - "Инвариант кита writer≠judge воспроизведён СИЛЬНЕЕ, чем у прежнего эталона EV-670: EV-1163 — orchestrator/src/harness/independence.ts фильтрует цепочку harness'ей ревью, исключая тот, что фактически прогнал исполнителя (не объявленный — важно при fallback), и валит стадию, если после фильтра пусто. Docstring называет это load-bearing safety property. Это конкретный закрытый класс обхода, а не общее обещание из README."
  - "Evidence-на-SHA у кита имеет реплику: EV-1164 — RFC-0042 (status Approved, lifecycle Implemented) даёт DSSE v6 + Merkle-транскрипты с валидацией head-sha; аттестация требуется на main. Это ровно инвариант кита «evidence на точном SHA», у соседа доведённый до реализованного статуса."
  - "Ось dogfood EV-673 у соседа закрыта: EV-1166 — каталог dogfood/ с кодом и backlog, команда /ai-sdlc execute <task-id>. Значит из трёх осей EV-673 (chain+dogfood+research) две (chain, dogfood) больше не отличают кит."
  - "«Полнота реализации» EV-673 не выдержала: EV-1168 — по формальной спецификации (v1alpha1, 40+ RFC со статусами), conformance-набору, трём SDK (go/python/ts) и комплаенсу (EU AI Act/NIST/ISO через compliance-clearance.ts, RFC-0022) ai-sdlc представлен ШИРЕ кита (Python stdlib+pyyaml, установка копированием, без публичного SDK и conformance). Применяя единый критерий к себе: если чужих кандидатов отсекали за узость реализации, здесь узость на стороне кита."
  - "Что осталось у кита — сформулировано как ДРУГОЙ ВЫБОР, не превосходство (EV-1169, самосвидетельство под спот-чек judge), и СУЖЕНО по лову judge round 1 (EV-1171): (а) НЕ «у ai-sdlc нет контура решений» — у него есть реализованный Decision-каталог RFC-0035 (lifecycle Implemented: суперсессия решений, скоринг полноты evidence, независимая рекомендация, research-субагент). Узкое отличие кита — форма research: персистентная память ФАКТОВ RR->EV->DP с provenance/freshness/memory-first и writer≠judge на самих выводах (сам прогон RR-017 — его экземпляр), тогда как RFC-0035 — routing и приоритизация РЕШЕНИЙ; контуры смежные, не тождественные; (б) модель «установка В дочку + governance НАД дочкой + живая квалификация произвольного репо» против adopter-фреймворка с точками расширения (RFC-0037/0038/0039). Именно каталог research/ у ai-sdlc — три markdown-отчёта (EV-1167), но это НЕ весь контур решений соседа."
  - "Три идеи «подсмотреть», а не «взять»: они не лечат измеренное узкое место кита (в отличие от DP-114, где каждый пункт «взять» имел замер боли), поэтому идут гипотезами в план, а не во внедрение. independence-декларации — как проверка, что свой writer≠judge не коллапсирует на fallback; conformance на свои схемы — как исполняемый тест спецификации поверх 76 рукописных валидаторов; DSSE/Merkle — как эталон формата провенанса, не как зависимость."
  - "Смена языка и дистрибуции ОТВЕРГНУТА по тому же принципу, что durable-движки в DP-114: это не ответ на боль кита. Кит намеренно stdlib+pyyaml и копируется в дочку (AGENTS.md:39); TypeScript-монорепо, публичные SDK и автономный оркестратор — атрибуты другой модели продукта, а не инструмент под узкое место этого репозитория."
constraints_addressed:
  evidence_over_reputation: >
    Каждый пункт вердикта сослан на EV; ключевые (цепочка, writer≠judge, аттестация) — на
    построчное чтение кода/RFC первоисточника, а не на README. README-заявления («reviewer collusion
    mechanically impossible») приняты только там, где подтверждены кодом (EV-1163).
  one_source_one_evidence: >
    11 EV — по одному источнику на запись (repos API, git tree, README, independence.ts, RFC-0042,
    каталоги research/dogfood/conformance/sdk). Синтез (EV-1170) и самосвидетельство (EV-1169) —
    отдельные inference-записи с derived_from, не склеены с фактами.
  negative_claims_qualified: >
    «research у ai-sdlc — не контур» (EV-1167) ограничено охватом (смотрелся каталог research/ и
    верх дерева, не всё дерево) и получило reliability medium. «Кит единственный по осям X»
    переформулировано в «другой выбор модели», а не абсолют.
  self_evidence_flagged: >
    EV-1169 (уникальность кита) помечена self-evidence и type internal_data, reliability capped
    medium, требует спот-чека judge. Вывод EV-1170 в части сужения дифференциации явно наследует
    medium от этой записи.
  same_criterion_applies_to_us: >
    Критерий «реплицирует ли цепочку по коду» применён к ai-sdlc и дал «да, и шире»; тот же критерий
    «полнота реализации», которым прежде отсекали чужих, применён к киту и показал, что по
    spec/SDK/conformance/комплаенсу узок кит, а не сосед (EV-1168).
alternatives:
  - option: "Оставить EV-673 в силе, ai-sdlc записать как ещё один сосед без пересмотра вывода"
    appropriate_when: >
      Не подходит: это нарушило бы same_criterion_applies_to_us. ai-sdlc проходит критерий цепочки
      строго сильнее, чем прошлые соседи; отказ обновить вывод был бы удержанием удобной формулировки
      вопреки коду. Вариант оставлен только чтобы явно его отклонить.
  - option: "Признать ai-sdlc превосходящим кит целиком и пересмотреть стратегию продукта"
    appropriate_when: >
      Преждевременно. ai-sdlc шире по spec/SDK/комплаенсу, но: автономный режим experimental
      (EV-1165), глубина conformance/SDK построчно не оценена (EV-1168 фиксирует ширину, не глубину),
      а две оси кита (research-контракт, governance-над-дочкой) у соседа не закрыты. «Шире по осям» ≠
      «лучше как продукт»; для такого вывода нужен отдельный RR с оценкой глубины, не ширины.
  - option: "Взять independence.ts / conformance / DSSE как прямые заимствования кода"
    appropriate_when: >
      Если появится измеренная боль кита по этим осям (например, живой прогон покажет, что свой
      writer≠judge коллапсирует на fallback). Пока замера нет — это идеи-гипотезы, не пункты «взять»
      (правило DP-114: без замера боли — не во внедрение). Apache-2.0 заимствование допускает.
assumptions:
  - "Линия соседей по жанру продолжает быть ценной: смысл прогона — держать самопозиционирование кита честным относительно живого ландшафта, а не выбрать инструмент. Без этого допущения ценность пакета (исправленная формулировка дифференциации) не реализуется."
  - "Публичный main ai-sdlc на 2026-09-02 отражает реальное состояние проекта, а не витрину: статусы RFC (Approved/Implemented) и наличие кода с тестами приняты за отражение реализации, хотя живой прогон не наблюдался."
  - "Формулировки кита «единственный с цепочкой» действительно присутствуют в артефактах позиционирования (VISION/DP-107/DP-109) и подлежат правке — это надо подтвердить grep'ом перед редактурой, здесь принято по памяти DP-107/DP-109."
risks:
  - "Устаревание охвата. EV volatile до 2026-12-02: ai-sdlc активен (1264 коммита, push 2026-08-24), автономный режим может выйти из experimental, conformance/SDK — углубиться. Митигация: перед любым accept продуктового решения на этих EV — обязательный мини-скан (правило центра); novelty-Watch держит ai-sdlc в поле зрения."
  - "Ширина принята за глубину. EV-1168 фиксирует наличие трёх SDK, conformance и комплаенса, но не их качество построчно. Риск переоценить соседа. Митигация: вывод EV-1170 говорит «шире», не «глубже»; альтернатива №2 явно требует отдельного RR для оценки глубины."
  - "Самопозиционирование правится на medium-основании. Часть про сужение дифференциации опирается на негатив с ограниченным охватом (EV-1167) и самосвидетельство (EV-1169). Риск: переписать позиционирование сильнее, чем позволяет evidence. Митигация: confidence medium, DP идёт к judge (writer≠judge) до accept; формулировки — «другой выбор», не абсолют."
  - "Соблазн ответной постройки (tech-push). Впечатление от ширины ai-sdlc может толкнуть кит строить SDK/conformance/автономию без измеренной боли — ровно класс, который DP-114 отвергал. Митигация: три идеи явно помечены «подсмотреть гипотезой», смена языка/дистрибуции явно отвергнута."
unknowns:
  - "Глубина и реальная работоспособность conformance-набора, трёх SDK и автономного оркестратора ai-sdlc — построчно/прогоном не проверялись; EV-1168/EV-1165 фиксируют наличие и статус, не поведение."
  - "Проходит ли independence.ts в рантайме на КАЖДОЙ ревью-стадии, или механизм есть, но зовётся не везде — прочитан модуль и тест, не все пути оркестратора (EV-1163)."
  - "РАЗРЕШЁН judge'ем round 1 (EV-1171): контур решений у ai-sdlc под другим именем ЕСТЬ — RFC-0035 в spec/rfcs (не в orchestrator/src, куда изначально смотрел этот unknown). Остаётся не проверенным построчно, насколько глубоко RFC-0035 реализован в коде против фронтматтера lifecycle: Implemented."
  - "Насколько интенсивен dogfood ai-sdlc (доля разработки через собственный конвейер) — каталог есть, доля не измерена (EV-1166); у кита это подтверждалось живыми прогонами."
proposed_validation:
  experiment: >
    Два фальсифицируемых шага до accept. (1) Grep-проверка assumption про позиционирование: найти в
    VISION.md/README.md/DP-107/DP-109 кита все формулировки «единственный/only с цепочкой/chain»;
    критерий — если таких формулировок 0, пункт позиционирования снимается как беспредметный, если
    >=1, они переписываются по EV-1170. (2) Раунд адверсариального judge над этим DP (writer≠judge,
    обязателен раз DP идёт к accept): judge проверяет спот-чеком самосвидетельство EV-1169 и негатив
    EV-1167 (открыть independence.ts и research/ соседа независимо), и выносит вердикт reviewed/
    needs_work. Провал: judge находит, что «research у ai-sdlc — только отчёты» опровергается кодом,
    ЛИБО что писатель завысил уникальность кита — тогда EV-1170 переводится в needs_work и вывод
    ослабляется. Мини-скан свежести ai-sdlc обязателен, если accept откладывается за 2026-12-02.
