# DecisionPackage по RR-013 (конкурентный охват август 2026).
# Прогон quick: разведка через web_fetch, writer inline, без субагентов.
# Спот-чек self-evidence судьёй ОБЯЗАТЕЛЕН по конвенции и НЕ выполнен.
schema_version: 1
kind: research.decision-package
id: DP-113
request_id: RR-013
decision:
  question: >
    Остаётся ли «связная цепочка execution→gates→evidence-on-SHA→delivery→governance»
    работающей дифференциацией кита, или её надо переформулировать?
decision_brief: >
  За неделю 2026-07-30…08-05 появились три проекта, воспроизводящих части цепочки кита
  под permissive-лицензиями. multi-agents-control-plane (EV-670) воспроизводит ВСЮ цепочку:
  gates + receipts + evidence + writer≠judge — это первое полное воспроизведение тезиса
  кита. super-simple-software-factory (EV-671) имеет реальную аудиторию (410★) и канал
  распространения (Claude Code skill). ratchet (EV-672) — механизм in-session gate, которого
  у кита нет. Вывод EV-660 («связной цепочки не обнаружено») больше не действует: обнаружена.
  Но кит остаётся единственным с полной реализацией: реестры, delivery lifecycle, research-контур,
  qualification framework, dogfood. Рекомендация: суперсидить EV-660, оценить заимствование
  envelope-механизма и in-session gate.
cost_of_recommendation:
  one_time: "2-4 часа: суперсидинг EV-660, обновление NOTICE.md при заимствовании"
  recurring: "Квартальная сверка конкурентного ландшафта через novelty-watch"
  owner_required: "Sasha/команда кита — решение о заимствовании механизмов"
  note: "Заимствование требует анализа совместимости с существующими контрактами"
recommendation:
  preferred_option: >
    supercede-ev660-and-evaluate-adoption: (1) суперсидить EV-660 новым evidence с расширенным
    охватом (EV-670, EV-671, EV-672); (2) оценить заимствование envelope-механизма из
    super-simple-software-factory (EnvelopeBase как типизированный контракт между фазами);
    (3) оценить заимствование in-session gate из ratchet (PostToolUse hook для минимализма/YAGNI);
    (4) обновить NOTICE.md при любом заимствовании (Apache-2.0/MIT требуют attribution).
  confidence: medium
  confidence_rationale: >
    Фактическая часть (что появилось у соседей) — high с опорой на верифицированный код.
    Часть про отличия кита опирается на self-evidence, у которой по конвенции ОБЯЗАТЕЛЕН
    спот-чек judge — он НЕ выполнен (прогон без субагентов), это главный ограничитель уверенности.
rationale:
  - "multi-agents-control-plane воспроизводит всю цепочку кита (EV-670): gates, receipts, evidence, writer≠judge. Но масштаб крошечный (5★), схемы нестабильны (v0.2.2), нет реестров, research-контура, qualification framework."
  - "super-simple-software-factory имеет реальную аудиторию (410★) и канал распространения (EV-671). Envelope-механизм и SQLite-трейс — потенциально заимствуемы. Но нет delivery lifecycle, реестров."
  - "ratchet закрывает реальный разрыв: in-session gate vs phase-boundary gate (EV-672). У кита проверка на границе стадии, ratchet — в момент правки. Ортогональные классы, можно комбинировать."
  - "Все три проекта под permissive-лицензиями (Apache-2.0, MIT). Заимствование возможно с attribution."
  - "Вывод EV-660 больше не действует: связная цепочка обнаружена. Но кит остаётся единственным с полной реализацией + dogfood + research-контуром."
alternatives:
  - option: "do-nothing: не суперсидить EV-660, оставить как есть"
    appropriate_when: "Если считается, что масштаб соседей слишком мал для угрозы. Отклонено: EV-660 — негативное утверждение, которое теперь ложно."
  - option: "full-adoption: заимствовать все три механизма целиком"
    appropriate_when: "Если кит нуждается в быстром расширении. Отклонено: требует анализа совместимости, может сломать существующие контракты."
constraints_addressed:
  evidence_over_reputation: "Соблюдён: все утверждения — из верифицированного кода через web_fetch."
  registry_is_single_source_of_truth: "Соблюдён: заимствованные механизмы появляются в registry, не параллельной декларацией."
  honest_statuses: "Соблюдён: статусы соседей не завышаются."
assumptions:
  - "Код на GitHub актуален и соответствует описанию в README."
  - "Лицензии (Apache-2.0, MIT) позволяют заимствование с attribution."
risks:
  - "Заимствование без анализа может сломать существующие контракты."
  - "Если не суперсидить EV-660, кит будет позиционироваться на устаревшем утверждении."
unknowns:
  - "Качество реализации соседей vs кит не сравнивалось глубоко."
  - "Совместимость envelope-механизма с контрактами кита не проверена."
proposed_validation:
  experiment: "Клонировать репозитории соседей, проанализировать структуру, сравнить с контрактами кита."
evidence_ids: [EV-670, EV-671, EV-672, EV-660, EV-663]
author: "research-модуль, прогон RR-013 (writer inline, разведка через web_fetch; субагенты не использовались)"
review: null
status: accepted
created_at: "2026-08-05"
