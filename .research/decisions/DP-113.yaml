summary: |
  За неделю 2026-07-30…08-05 появились три проекта, воспроизводящих части цепочки кита:
  
  1. **multi-agents-control-plane** (Apache-2.0, 5★) — воспроизводит ВСЮ цепочку:
     gates + receipts + evidence + writer≠judge. Это первое полное воспроизведение
     тезиса кита под permissive-лицензией. Масштаб крошечный, схемы нестабильны.
  
  2. **super-simple-software-factory** (MIT, 410★) — воспроизводит ключевую мысль:
     детерминированный код владеет последовательностью, gates as DoD, envelope-контракты.
     Реальная аудитория и канал распространения (Claude Code skill).
  
  3. **ratchet** (MIT, 431★) — НЕ конкурент, а механизм, которого у кита нет:
     in-session gate через PostToolUse hook, измеряет каждую правку в момент правки.
  
  Вывод EV-660 («связной цепочки не обнаружено») больше не действует: обнаружена.
  Но кит остаётся единственным с полной реализацией: реестры, delivery lifecycle,
  research-контур, qualification framework, dogfood.

