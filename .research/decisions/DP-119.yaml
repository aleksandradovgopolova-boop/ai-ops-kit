schema_version: 1
kind: research.decision-package
id: DP-119
request_id: RR-021
decision:
  question: >
    Как подключать usestrix/strix к проверке безопасности продуктов-дочек: блокирующим гейтом,
    производителем улик для действующего security-гейта, разовым инструментом перед релизом — или
    никак?
decision_brief: >
  Рекомендация: подключать ПРОИЗВОДИТЕЛЕМ УЛИК для действующего гейта security, и никогда —
  гейтом, который «должен пройти». Причина одна и она не про качество продукта: подтверждённая
  эксплуатацией находка доказывает наличие уязвимости, а пустой прогон не доказывает её отсутствия,
  и этого не утверждает даже вендор (EV-1189, EV-1198). Ценность при этом реальная и адресная: ось
  «доказано эксплуатацией» у кита пустая целиком (EV-1197), а именно она превращает наше суждение
  no_injection_surface в улику (EV-1196). Цена: Docker, токены, от минут до четырёх часов на прогон
  (EV-1190), и код дочки уезжает провайдеру модели — а в облачном режиме и вендору (EV-1194,
  EV-1195). Топ-риски: недетерминированность агента против детерминированности наших гейтов;
  реальный атакующий трафик из Kali-контейнера (EV-1193); раздача наступательных навыков агенту
  дочки (EV-1192). Следующий шаг — один контролируемый прогон на тестовом стенде ии-среды по
  предрегистрированным критериям; до него в quality/gates.yaml и в CI дочек ничего не менять.
cost_of_recommendation:
  one_time: >
    Контролируемый прогон-замер: ~1 день (стенд, авторизация владельца, quick и deep на одной
    ветке, разбор находок вручную). Если замер зелёный — адаптер «SARIF/vulnerabilities.json ->
    находки security-гейта» в ките: ~2-3 дня вместе с тестами и честной обработкой случая «скан не
    выполнен» (у нас для этого уже есть код возврата 2 в security_pack).
  recurring: >
    Токены на каждый прогон (bounded через --max-budget, но это статья расходов дочки, а не кита);
    время CI: quick — минуты на PR, deep — часы, значит deep только по расписанию или перед
    релизом. Плюс разбор находок человеком: агентный пентестер выдаёт находки в прозе и SARIF, и
    кто-то обязан их судить — эта роль у нас есть (security-reviewer), её загрузка вырастет.
  owner_required: >
    Владелец — на три решения, которые кит принимать не вправе: (1) авторизация на атакующий
    трафик против конкретного стенда; (2) согласие, что код дочки уходит провайдеру модели, и
    отдельно — согласие или отказ по облачному пути вендора; (3) бюджет токенов. Инженерную часть
    и адаптер кит делает сам.
  note: >
    Неденежная статья, которую легко упустить: каждый прогон добавляет поток находок, требующих
    суждения. Инструмент, который находит больше, чем команда успевает разобрать, превращается в
    фоновый шум и обесценивает гейт — это издержка эксплуатации, а не внедрения.
recommendation:
  preferred_option: >
    Подключать как ADVISORY-производителя улик для гейта security в двух режимах: (а) quick со
    сужением до дельты PR (EV-1191) — на изменениях, затрагивающих поверхность риска; (б) deep —
    перед релизом или по расписанию, не в PR. Находка с подтверждённым PoC = блокирующая находка
    гейта; ПУСТОЙ результат не закрывает ни одной улики и записывается как «не наблюдалось», а при
    незавершённом прогоне (run.json) — как «скан не выполнен». Самохостинг CLI, облачный путь
    вендора — только по отдельному решению владельца. До замера — ничего не менять в
    quality/gates.yaml и не ставить в CI дочек.
  confidence: medium
  confidence_rationale: >
    Конструктивный вывод (только открывать, не закрывать) не зависит от качества инструмента и
    опирается на оговорку самого вендора плюс на уже действующее правило кита — он прочный.
    Но ВСЁ остальное — полезность находок, доля ложных срабатываний, реальная длительность и
    стоимость — держится на заявлениях вендора (EV-1188, тип vendor_claim) и ни одним нашим
    прогоном не проверено. Поэтому medium, а не high.
rationale:
  - >
    Контур кита уже устроен так, чтобы принять такого поставщика: гейт security требует
    no_secrets, no_injection_surface и deps_approved; детерминированный сканер закрывает первое и
    третье, а no_injection_surface прямо назван суждением, которое закрывает независимый судья, —
    сканер лишь поставляет флаги (EV-1196). Strix встаёт ровно на место поставщика флагов, но
    более сильных: не «здесь есть eval», а «вот рабочий PoC».
  - >
    Пробел, который он закрывает, у нас пустой, а не слабый: механической проверкой по трём
    терминам и трём типам файлов в репозитории кита не нашлось ни одного производителя улик,
    который исполняет продукт и подтверждает уязвимость эксплуатацией (EV-1197). Это единственная
    ось, где сторонний инструмент даёт нам не «ещё один линтер», а новый КЛАСС доказательства.
  - >
    Ограничение конструкции выведено, а не выбрано по вкусу: доказать наличие эксплуатацией можно,
    доказать отсутствие — нельзя, и авторы сами ограничивают смысл нулевого кода возврата словами
    «ноль покрывает только проанализированное» (EV-1189). Гейт, который зеленеет от пустого
    прогона, производил бы ложно-зелёное — то, против чего построен весь кит (EV-1198).
  - >
    Встраивание технически дёшево и не требует от нас изобретений: headless-режим, коды возврата
    0/1/2, SARIF 2.1.0, vulnerabilities.json и run.json с фактической стоимостью прогона
    (EV-1189), плюс штатное сужение quick-скана до дельты PR (EV-1191). Нам нужен адаптер формата,
    а не новый механизм.
  - >
    Зрелость источника на порядок выше, чем у предмета RR-020: проект живёт с августа 2025, Apache-
    2.0, десятки тысяч звёзд, активные пуши (EV-1187). Это снижает риск «исчезнет через месяц», но
    не заменяет проверку полезности: 407 открытых issue — сигнал нагрузки на сопровождение, а не
    качества.
  - >
    Ограничения эксплуатации названы самим вендором и должны ехать в решение, а не остаться в
    evidence: приватный путь через локальные модели он же и отговаривает использовать для
    ответственных проверок (EV-1194), а исполнение идёт в Kali-контейнере с SQLMap, Nuclei и ffuf,
    то есть прогон против живой цели — настоящая атака (EV-1193). Отсюда требование авторизации
    владельца и запрет на прод.
alternatives:
  - option: "Не подключать; оставить действующий детерминированный контур плюс независимого security-reviewer"
    appropriate_when: >
      Если владелец не готов ни на токены, ни на выход кода дочки к провайдеру модели. Тогда ось
      «доказано эксплуатацией» остаётся пустой — и это должно быть записано как известный пробел
      постуры, а не замолчано.
  - option: "Разовый deep-прогон перед крупным релизом, без всякой автоматизации"
    appropriate_when: >
      Самый дешёвый честный вариант, если замер покажет полезные находки, но цена или шум делают
      регулярность неоправданной. Deep — режим по умолчанию у самого инструмента (EV-1190), значит
      этот сценарий для него родной.
  - option: "Облачный путь app.strix.ai с интеграцией в PR"
    appropriate_when: >
      Только по отдельному решению владельца о периметре: код рабочего дерева уезжает вендору
      (EV-1195). Процедура загрузки аккуратная (подтверждение по sha256, исключения, лимиты), но
      это смена периметра, а такие решения кит не принимает за владельца.
  - option: "Включить блокирующим гейтом, который обязан пройти"
    appropriate_when: >
      Не рекомендуется никогда: конструкция противоречит EV-1198 и произвела бы зелёное из
      непроверенного. Вариант назван явно, чтобы он был отвергнут решением, а не забыт.
constraints_addressed:
  evidence_over_reputation: >
    Соблюдён: 64 тысячи звёзд зафиксированы как метаданные (EV-1187) и ни в одном пункте rationale
    не работают аргументом; выводы строятся на контракте прогона и документации, а не на популярности.
  one_source_one_evidence: >
    Соблюдён: README, AGENTS.md, scan-modes, ci-cd, каталог skills, sandbox, local-провайдеры и
    cloud-overview разнесены по отдельным записям; наши две стороны — тоже отдельно.
  negative_claims_qualified: >
    Соблюдён: «у кита нет динамической проверки» (EV-1197) дано с названным охватом проверки
    (три термина, три типа файлов, одно рабочее дерево) и reliability medium.
  same_criterion_applies_to_us: >
    Соблюдён: наш контур подан такими же evidence (EV-1196, EV-1197) и помечен как self-evidence;
    требование «не закрывать проверку отсутствием находок» применено к чужому инструменту ровно в
    той же формулировке, в какой оно уже записано в нашем коде.
  vendor_claims_typed_as_vendor_claims: >
    Соблюдён: центральное рекламное утверждение «валидированные PoC, а не ложные срабатывания»
    заведено как EV-1188 с типом vendor_claim и reliability low, и в rationale используется только
    как гипотеза, проверяемая в proposed_validation.
  no_live_run_claimed_without_measurement: >
    Соблюдён: ни одного прогона Strix не проводилось; все длительности, стоимости и качество
    находок названы оценками вендора (EV-1190) и вынесены в unknowns.
assumptions:
  - >
    У дочки есть тестовый стенд, который не жалко атаковать, и он отделим от продакшена. Без этого
    рекомендация неприменима: атаковать прод нельзя, а проверять только исходный код — это уже
    почти то, что делает наш детерминированный сканер плюс semgrep.
  - >
    Владелец готов пустить код дочки к провайдеру модели. Локальная альтернатива формально есть,
    но вендор сам предупреждает, что для ответственных проверок она слаба (EV-1194).
risks:
  - >
    Недетерминированность против детерминированности: агентный пентестер на одном и том же коде
    может дать разный результат между прогонами. Наши гейты детерминированы намеренно; гейт,
    краснеющий через раз, хуже отсутствия гейта, потому что обучает команду игнорировать красное.
    Рекомендуемая конструкция (находка блокирует, молчание не значит ничего) этот риск не
    устраняет, а лишь удерживает в безопасную сторону.
  - >
    Реальный атакующий трафик: исполнение идёт в Kali-контейнере с SQLMap, Nuclei, ffuf и Nmap
    (EV-1193). Ошибка в цели — это не ложное срабатывание, а инцидент. Требуется явная авторизация
    владельца на конкретный стенд и техническая невозможность указать прод.
  - >
    Раздача наступательных возможностей: девять навыков ставятся в агента дочки одной командой
    (EV-1192). Это означает, что агент дочки получает способность запускать пентест — вопрос
    governance (кто и на что имеет право), а не удобства, и он должен решаться политикой
    возможностей кита, а не установкой пакета.
  - >
    Периметр данных: в облачном режиме рабочее дерево уезжает вендору (EV-1195), в любом режиме —
    провайдеру модели (EV-1194). Для дочек с чувствительными данными это может быть стоп-фактором
    независимо от полезности инструмента.
  - >
    Доставка: все рецепты CI устанавливают инструмент скриптом с сайта вендора (EV-1191). В наш
    периметр это въезжает как ещё одна доверенная внешняя цепочка — и это ровно та дыра
    (verified install внешних артефактов), которую DP-110 уже называл топ-приоритетом. Значит
    подключать следует пиннингом версии и проверкой целостности, а не `curl | bash`.
  - >
    Перегрузка судящей стороны: находок может стать больше, чем команда способна разобрать
    (см. note в cost_of_recommendation).
unknowns:
  - >
    Полезность находок на НАШИХ дочках: сколько из них реальны, сколько шум — ни одного прогона не
    было, утверждение вендора о «валидированных PoC без ложных срабатываний» не проверено
    (EV-1188).
  - >
    Фактические длительность и стоимость: цифры «минуты / 30-60 минут / 1-4 часа» — оценки
    документации (EV-1190), не наши замеры.
  - >
    Устойчивость результата между прогонами: повторяемость на одном и том же коммите неизвестна, а
    именно она решает, годится ли инструмент для регулярного, а не разового применения.
  - >
    Качество SARIF на практике: формат заявлен (EV-1189), но насколько находки в нём пригодны для
    машинного связывания с нашими уликами гейта, проверке не подвергалось.
  - >
    Поведение на Node/TS-продукте с базой (профиль ии-среды): предустановленный инструментарий это
    покрывает по составу (EV-1193), но эмпирики у нас нет.
proposed_validation:
  experiment: >
    Один контролируемый прогон-замер ДО любых изменений в гейтах и CI; критерии фиксируются здесь и
    после прогона не меняются. УСТАНОВКА: тестовый стенд ии-среды (не прод), письменная авторизация
    владельца на атакующий трафик против этого стенда, самохостинг CLI с пиннингом версии, бюджет
    задан через --max-budget. ДВЕ РУКИ на одном и том же коммите: (A) quick со сужением до дельты
    PR; (B) deep по всему продукту. Плюс КОНТРОЛЬНЫЙ ПРОГОН: рука A повторяется на том же коммите
    второй раз, без изменений.
    ЧТО МЕРИМ: (1) число находок и сколько из них с воспроизводимым PoC, подтверждённым руками
    человека; (2) сколько находок остались после разбора признаны реальными — доля ложных;
    (3) wall-clock и фактическая стоимость из run.json; (4) ПОВТОРЯЕМОСТЬ: доля находок,
    совпавших между первым и контрольным прогоном руки A; (5) сколько из реальных находок наш
    действующий детерминированный контур уже ловил сам (то есть какая часть — новая ценность, а
    какая — дубль).
    ПОРОГИ (фальсифицируемые): подключение признаётся оправданным, только если на реальном продукте
    найдена хотя бы ОДНА подтверждённая человеком уязвимость, которую действующий контур кита НЕ
    ловит, И доля ложных среди находок не выше 50%, И повторяемость руки A не ниже 70%, И стоимость
    quick-прогона укладывается в бюджет, заданный владельцем. ПРОВАЛ объявляется, если новых
    подтверждённых находок ноль, либо доля ложных выше 50%, либо повторяемость ниже 70% (тогда
    инструмент годится максимум для разового аудита, но не для регулярного контура).
    ЧЕГО ЗАМЕР НЕ ДОКАЗЫВАЕТ И ЧТО ОТЛОЖЕНО: n=1 продукт и n=2 прогона — это стоп-сигнал, а не
    доказательство пригодности; формулировка «Strix работает» по такому n запрещена, допустимы
    только «на нашем профиле продукта он дал новую подтверждённую находку — стоит второго, более
    широкого замера» либо «не дал». Сравнение Strix с другими пентест-инструментами этим замером НЕ
    производится и отложено явно. Судит находки третий актор — владелец либо независимый
    security-reviewer, не запускавший прогон (writer != judge применяется и к замеру).
    ОТДЕЛЬНОЕ УСЛОВИЕ ЧЕСТНОСТИ: если прогон завершился незавершённым (run.json это показывает),
    результат записывается как «скан не выполнен» и в числитель порогов не идёт — пустой результат
    не считается чистым ни при каких обстоятельствах.
evidence_ids: [EV-1187, EV-1188, EV-1189, EV-1190, EV-1191, EV-1192, EV-1193, EV-1194, EV-1195, EV-1196, EV-1197, EV-1198]
author: "AI Ops research (Claude), прогон RR-021"
review: null
status: draft
created_at: "2026-09-22"
