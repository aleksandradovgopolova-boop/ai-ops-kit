# DecisionPackage по RR-011 (механики мета-harness: что брать, чего в ките нет).
# Особенность прогона: два из трёх разведчиков оборваны лимитом расходов аккаунта —
# часть шортлиста осталась непроверенной, это отражено в unknowns и в confidence.
schema_version: 1
kind: research.decision-package
id: DP-111
request_id: RR-011
decision:
  question: "Какие из восьми предложенных компонентов мета-harness в ките реально отсутствуют, какие механики каких источников под них заимствовать и в каком порядке?"
decision_brief: >-
  Главный результат прогона — не список заимствований, а калибровка: половина предложенного
  входящим уже работает. Task Contract, Context Pack, Runner-петля и Verification Gates в ките
  реализованы (EV-901, EV-902, EV-903, EV-904); Skill Registry и Skill Evals частичны (EV-905,
  EV-906); настоящих дыр две — пошаговая траектория (EV-907, EV-908) и формат событий
  наблюдаемости (EV-909). Рекомендация: три работы сейчас — (1) перенести методику Skill TDD
  из Superpowers в evaluations/ кита (baseline «без навыка» + сценарии давления, MIT, EV-934,
  EV-935, EV-936); (2) расширить существующий lifecycle-journal записью ШАГА (действие,
  наблюдение, стоимость, отметка времени) по образцу поля extra у mini-swe-agent, не заводя
  второй формат (EV-926, EV-908); (3) имена атрибутов брать из OTel GenAI как словарь, но без
  привязки — весь набор в статусе Development (EV-943). Спроектировать без реализации:
  контракт ExecutionEnvironment по минимальному образцу (у mini-swe-agent в окружении ТРИ
  метода, а не семь из входящего — EV-924) и поля операционного урока, перенесённые из
  research-модуля в память кита (EV-911). Не трогать как код: RepoPrompt CE (macOS-only,
  EV-942), Beads (тянет Dolt как источник истины, EV-941), agent-sandbox (нужен кластер,
  v1beta1, EV-944). Цена первых трёх работ — дни, не недели; главный риск — что мы примем
  самоотчёт Superpowers об эффективности за измеренный результат (EV-937).
cost_of_recommendation:
  one_time: >-
    (1) Skill TDD в evaluations/: 2-3 дня — формат кейса уже есть (Expected/Forbidden/Scoring),
    добавляются класс pressure-сценариев и обязательный baseline-прогон без навыка.
    (2) Запись шага в lifecycle-journal: 1-2 дня — журнал и durable-запись существуют
    (lifecycle_store), добавляется событие step с полями action/observation/cost/timestamp.
    (3) Словарь имён OTel: часы — это соглашение об именовании, не интеграция.
    Проектные наброски (ExecutionEnvironment-контракт, поля операционного урока) — по 0.5 дня
    каждый, без реализации. Разведка по источникам уже оплачена этим прогоном.
  recurring: >-
    Pressure-сценарии живут вместе с навыками и требуют повторного прогона при каждом
    значимом изменении навыка (дисциплина Superpowers: before/after эвал в PR — EV-938).
    Словарь атрибутов OTel пересматривается при смене статуса конвенций с Development.
  owner_required: "Sasha — решение об очерёдности; команда кита — исполнение; центр — повторная сверка OTel-статуса при следующем скане."
  note: "Оценки writer'а по объёму уже существующих файлов; фактическую цену покажет первая работа."
recommendation:
  preferred_option: >-
    targeted-borrowing: заимствовать ТРИ механики сейчас (Skill TDD как методику тестирования
    навыков; пошаговую запись траектории как расширение существующего журнала; имена атрибутов
    OTel GenAI как словарь), спроектировать ДВЕ (минимальный контракт ExecutionEnvironment,
    поля операционного урока), остальное держать как референсы без кода и без зависимостей
  confidence: medium
  confidence_rationale: >-
    РАЗДЕЛЬНАЯ калибровка. Часть «чего в ките нет» — уверенный medium-to-high: маппинг снят
    по файлам с дословными цитатами (EV-901…EV-911), воспроизводим повторным чтением, но это
    self-evidence и он ещё не прошёл независимый спот-чек. Часть «что берём у mini-swe-agent
    и Superpowers» — medium: оба проекта проверены глубоко (клоны основных веток, GitHub API,
    дословные цитаты, два расхождения с входящим найдены — EV-923, EV-926, EV-932), лицензии
    MIT подтверждены файлами. Часть «что не берём» — low-to-medium: Beads, RepoPrompt CE, OTel
    и agent-sandbox проверены одностраничным чтением README/документации без клонов (EV-941…
    EV-944), а три объекта шортлиста (спецификация Anthropic Agent Skills, иерархия AGENTS.md,
    OpenCode) не проверены вовсе. Выше medium не поднимается ещё и потому, что DP не проходил
    независимое ревью: по инварианту кита автор не назначает себе confidence high.
rationale:
  - >-
    Входящее переоценило новизну ровно вдвое: из восьми предложенных к созданию компонентов
    четыре в ките уже работают — машиночитаемый WorkItem-контракт (EV-901), ContextBundle с
    обоснованием выбора фрагментов и token budget (EV-902), петля «модель предлагает → Policy
    решает → Broker исполняет → Evidence» (EV-903) и реестр из 29 гейтов, где 18 блокирующие,
    а у 20 проверяющая роль read-only (EV-904). Поэтому первым выводом идёт не заимствование,
    а отказ от него: строить Runner и Context Pack «с нуля по образцу» означало бы дублировать
    работающее.
  - >-
    Дыра №1 — пошаговая траектория. loop-trace фиксирует только прогресс петли (n,
    progress_value, outcome, signature — EV-907), а lifecycle-journal пишет события уровня
    прогона, где стоимость агрегирована за прогон целиком (EV-908). Восстановить «что модель
    предложила, что вернулось и сколько это стоило» на конкретном шаге сегодня нельзя.
    У mini-swe-agent эта информация лежит в поле extra конкретного сообщения: actions, cost,
    timestamp, response (EV-926) — механика дешёвая и переносимая без кода.
  - >-
    ВАЖНОЕ РАСХОЖДЕНИЕ с входящим: предложенная в нём JSON-запись шага
    {step, model_response, action, observation, cost, duration_ms} в проверенном источнике
    НЕ существует. mini-swe-agent пишет единый .traj.json — chat-историю сообщений с полем
    extra, и поля duration в записи шага нет вовсе (EV-926). Заимствуем идею (шаг восстановим
    по записи), а не выдуманную схему.
  - >-
    Дыра №2 — формат событий. OpenTelemetry в исполняемом коде кита не используется вовсе:
    упоминания есть только в VISION.md как ориентир и в EvalTooling.md/registry как инструмент
    для AI-фич ПРОДУКТА, а не для трассировки самого кита (EV-909). Но и брать OTel как основу
    сегодня нельзя буквально: набор GenAI-конвенций, включая agent spans, имеет статус
    Development без отдельной декларации стабильности для агентной части (EV-943). Отсюда
    промежуточное решение — словарь имён атрибутов, а не привязка к спецификации.
  - >-
    Skill Evals — самая выгодная работа по соотношению дельта/стоимость. В ките уже есть
    51 eval-кейс агентов с формализованным запрещённым поведением и рубрикой (EV-906), то есть
    половина конструкции Superpowers на месте. Отсутствует ровно то, что составляет суть их
    методики: прогон сценария БЕЗ навыка как обязательный baseline и сценарии давления.
    Методика подтверждена первоисточником дословно — шесть фаз RED/GREEN/REFACTOR (EV-934),
    семь типов давления с требованием комбинировать не менее трёх (EV-935), процедура закрытия
    лазеек с фиксацией рационализаций дословно (EV-936). Лицензия MIT (EV-929) заимствование
    методики не ограничивает.
  - >-
    При этом эффективность Superpowers мы НЕ считаем доказанной: «100% compliance under
    maximum pressure» — самоотчёт авторов без публикации сырых данных, помечен как vendor_claim
    (EV-937). Берём процедуру, а не обещанный ею результат; проверяем на себе (см. validation).
  - >-
    Обязательность процесса у Superpowers подтверждена дословно («Mandatory workflows, not
    suggestions» — EV-931; bootstrap-навык, прямо запрещающий рационализировать обход —
    EV-933), но переносить её как ЦЕЛОЕ киту не нужно: у кита своя система принуждения — 29
    гейтов с блокировкой и разделением ролей (EV-904). Уточнение против входящего: их цепочка
    из семи шагов ставит worktree ТРЕТЬИМ, до написания плана, и отдельного шага verification
    в ней нет (EV-932) — то есть описание процесса во входящем неточно.
  - >-
    Заимствовать код mini-swe-agent не нужно, а вот его границу — стоит: разделение
    model/environment/agent сделано тремя Python-Protocol, причём у окружения ВСЕГО ТРИ метода
    (execute, get_template_vars, serialize) — EV-924, и на этом минимуме держится семь
    адаптеров: local, docker/podman, singularity/apptainer, bubblewrap, contree и два swerex
    (EV-925). Это прямой аргумент против семиметодного контракта из входящего: snapshot/restore
    в проверенном источнике в контракт окружения не входят. Кит же сегодня имеет конкретную
    изоляцию (контейнер с read-only rootfs, cap-drop, лимитами и одноразовым клоном) без
    абстракции над ней (EV-910) — значит проектируем минимальный контракт, а не максимальный.
  - >-
    Три кандидата отклоняются как код по проверенным причинам, а не по вкусу: RepoPrompt CE —
    Apache-2.0, но требует macOS 26+ (EV-942), то есть исполняемой зависимостью киту быть не
    может; его механики (срезы строк, CodeMaps, multi-root, reviewable handoff) остаются
    списком идей для ContextBundle. Beads — MIT, но источник истины у него база Dolt, а
    .beads/issues.jsonl объявлен экспортом, «не источником истины и не бэкапом» (EV-941): это
    противоречит инварианту кита о единственном источнике истины в registry и добавляет
    встроенную СУБД в зависимости. agent-sandbox — Apache-2.0, v1beta1 и требует кластера
    Kubernetes (EV-944): исследовательский горизонт, а не внедрение.
  - >-
    Дублирование с прошлыми решениями подтверждено и повторно не исследовалось: gstack разобран
    в DP-103, OpenHands/SWE-ReX/Goose — в DP-108 с решением «адаптеры по потребности», Langfuse
    — в DP-105. Из шортлиста реально новыми для памяти центра были mini-swe-agent, Superpowers,
    RepoPrompt CE, Beads, agent-sandbox и OTel-конвенции; ими прогон и занимался.
alternatives:
  - option: "Взять mini-swe-agent как зависимость или форк и построить Runner на нём"
    appropriate_when: >-
      Было бы уместно, если бы собственной петли не существовало или она не давала контроля
      над действиями. У кита петля есть и устроена принципиально иначе: допустимость действия
      решает Policy, а не модель (EV-903). Отклонено: форк дал бы минимализм ценой потери
      контроля и внешней кодовой базы, не закрывая ни одной из двух реальных дыр.
  - option: "Установить Superpowers как плагин и принять их обязательный процесс целиком"
    appropriate_when: >-
      Было бы уместно для команды на одном харнессе без собственного контура принуждения.
      У кита 29 гейтов с блокировкой и разделением ролей (EV-904), а установка Superpowers
      харнесс-специфична — отдельно под каждый из 11 (EV-939), версия одна на всю библиотеку.
      Отклонено: берём методику тестирования навыков, не дистрибутив и не чужой процесс.
  - option: "Дождаться стабилизации OTel GenAI и только потом трогать наблюдаемость"
    appropriate_when: >-
      Было бы уместно, если бы дыра сводилась к формату событий. Но пошаговой записи нет вне
      зависимости от статуса конвенций (EV-907, EV-908), а ожидание стабильного статуса не
      имеет предсказуемого срока. Отклонено частично: имена атрибутов принимаем сейчас как
      обратимое соглашение, привязку к спецификации в статусе Development (EV-943) откладываем.
  - option: "Сделать все восемь компонентов, как предлагает входящее"
    appropriate_when: >-
      Было бы уместно на пустом месте — например, в новом child-продукте без своего движка.
      В самом ките четыре из восьми уже реализованы (EV-901…EV-904). Отклонено: работа свелась
      бы к переписыванию работающего под чужие названия с риском завести второй источник истины.
constraints_addressed:
  evidence_over_reputation: >-
    Соблюдён: все утверждения о внешних проектах сняты с первоисточников с дословными цитатами;
    два заявления входящего опровергнуты замером и чтением (EV-923, EV-926), одно уточнено
    (EV-932). Аномальная метрика (262.9k звёзд Superpowers) перепроверена вторым чтением
    (EV-930).
  license_compatible_commercial: >-
    Соблюдён: MIT подтверждён файлами лицензий у mini-swe-agent (EV-921) и Superpowers
    (EV-929); Apache-2.0 — у RepoPrompt CE (EV-942), agent-sandbox (EV-944) и OTel-конвенций
    (EV-943); MIT у Beads (EV-941). Ни один кандидат не отклонён по лицензии — отклонения
    по платформе и по весу зависимостей.
  registry_is_single_source_of_truth: >-
    Соблюдён и стал причиной двух решений: запись шага расширяет СУЩЕСТВУЮЩИЙ lifecycle-journal,
    а не заводит параллельный формат траекторий; Beads отклонён в том числе потому, что его
    модель хранения делает источником истины внешнюю БД (EV-941).
  no_new_runtime_dependencies_without_need: >-
    Соблюдён: ни одна из трёх работ не добавляет зависимостей — методика, поле в журнале и
    соглашение об именах. Все кандидаты, требующие рантайма (Dolt, macOS-приложение,
    кластер K8s), отложены или отклонены.
  honest_statuses: >-
    Соблюдён: маппинг покрытия разделён на implemented / partial / gap, а не «всё есть»;
    частичные компоненты (EV-905, EV-906) названы частичными, дыры (EV-907, EV-909) — дырами.
  fits_kit_declared_pattern: >-
    Соблюдён: заимствуются формат и методика, кит остаётся control plane — линия DP-108
    не меняется.
assumptions:
  - "Дыра в пошаговой траектории мешает на практике (отладка, разбор провалов), а не только теоретически — это ДОПУЩЕНИЕ writer'а: инцидентов, где не хватило записи шага, в памяти кита не зафиксировано."
  - "Методика Skill TDD применима к навыкам кита без переписывания формата eval-кейсов — проверяется первой же работой."
  - "Имена атрибутов OTel GenAI в статусе Development меняются медленнее, чем идёт наша разработка; при смене статуса словарь пересматривается."
risks:
  - "Принять самоотчёт Superpowers (EV-937) за измеренный эффект и вложиться в pressure-сценарии больше, чем они возвращают. Митигация — фальсифицируемый порог в validation и остановка при провале baseline."
  - "Расползание записи шага: событие step рискует превратиться в дубль всей траектории модели и раздуть журнал. Митигация — фиксированный набор полей и хвост наблюдения, а не полный вывод."
  - "Проектные наброски (ExecutionEnvironment, поля урока) останутся набросками. Митигация — они и заявлены как проект, в план работ не попадают до появления потребности (линия DP-108)."
  - "Часть шортлиста осталась непроверенной (см. unknowns) — решение по ней не выносится вовсе, чтобы не выдать пробел за вывод."
unknowns:
  - "Спецификация Anthropic Agent Skills (структура SKILL.md, обязательные поля, валидация/версионирование) — НЕ проверена в этом прогоне: разведчик оборван лимитом расходов аккаунта. Вопрос RR-011 №5 закрыт частично."
  - "Иерархия и правило переопределения AGENTS.md (docs Codex) — не проверены; решение о принятии внешнего формата инструкций не выносится."
  - "OpenCode (включая заявленное отсутствие настоящего sandbox и поведение deny-permissions) — не проверен; урок «ограничение в промпте — не безопасность» и без того зафиксирован в ките (см. containers/ и tool_broker)."
  - "cross-model review и skill routing gstack повторно не верифицировались — опора на DP-103; при следующем скане стоит проверить, изменилось ли."
  - "Beads, RepoPrompt CE, agent-sandbox и OTel проверены одностраничным чтением без клонов — уровень ниже, чем у mini-swe-agent и Superpowers в этом же прогоне."
proposed_validation:
  experiment: >-
    Работа 1 (Skill TDD). Взять ДВА существующих навыка кита и по каждому собрать 5 сценариев,
    комбинирующих не менее трёх давлений (по типологии EV-935). Прогон А — без навыка, прогон Б
    — с навыком, на одной и той же модели и с одинаковым контекстом.
    Порог провала МЕТОДИКИ: если в прогоне А нарушений нет ни в одном из 5 сценариев — сценарии
    не давят (переписать сценарии), вывод «навык не нужен» из этого НЕ следует.
    Порог полезности: не менее 3 из 5 сценариев дают воспроизводимое нарушение в А, и после
    правки навыка те же сценарии дают соблюдение в Б. n=5 мал: результат считается стоп-сигналом
    и основанием продолжить, но НЕ доказательством превосходства методики.
    Работа 2 (запись шага). На 3 реальных прогонах кита проверить восстановимость: по записи
    шага восстанавливаются предложенное действие, результат и стоимость шага. Порог провала:
    хотя бы один шаг не восстанавливается или стоимость шага не определена.
    Работа 3 (словарь OTel) валидации не требует — обратимое соглашение об именовании; ревизия
    при смене статуса конвенций с Development (EV-943).
    ОТЛОЖЕНО явно: сравнение TCO собственного контракта окружения против внешних решений —
    до появления потребности во второй реализации окружения.
