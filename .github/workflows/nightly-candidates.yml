# Ночная материализация задач-кандидатов в трекер: непокрытые направления роадмапа + открытые
# находки из прогонов дочек заводятся ISSUE-ПРЕДЛОЖЕНИЯМИ (метка `task-candidate`). Устаревшие
# закрываются. Предохранитель ЦЕЛ: план НЕ трогается — issue лишь предложение, приём в plan.yaml
# остаётся явным действием владельца `candidates accept`. Дедуп с nightly-roadmap-sync: по умолчанию
# заводятся только находки дочек (направления уже получают эпик от roadmap-sync).
# Команда: `candidates sync-issues --apply` (ядро — ai_ops_kit/planning/candidate_issue_sync.py).
name: nightly-candidates
on:
  schedule:
    - cron: "45 3 * * *"   # после nightly-roadmap-sync (30 3), чтобы не пересекаться
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write            # заводит/обновляет/закрывает issue-предложения через gh (план не пишется)
jobs:
  candidates:
    runs-on: ubuntu-latest
    if: github.repository == 'aleksandradovgopolova-boop/ai-ops-kit'   # не на форках
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # роадмап читает историю плана
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Завести задачи-кандидаты в трекер (issue — предложение, план не пишется)
        env:
          PYTHONPATH: "."
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh авторизуется этим токеном
        run: |
          python -m ai_ops_kit.cli.ai_ops_cli candidates sync-issues --apply \
            | tee -a "$GITHUB_STEP_SUMMARY"
