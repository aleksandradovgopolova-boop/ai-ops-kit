# Пилот uv только для parent: отдельный advisory workflow; required checks неизменны.
# Замер и границы: docs/change-briefs/1414-uv-pilot.md.
name: uv-pilot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  smoke-uv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version-file: .python-version}
      - run: pip install uv==0.13.7
      - name: "uv sync --locked — воспроизводимое окружение из uv.lock (краснеет на дрейфе lock)"
        run: |
          # --locked: отказ, если uv.lock разошёлся с pyproject.toml — дрейф виден здесь, а не у разработчика.
          time uv sync --locked --extra dev
          uv run --no-sync python -c "import hypothesis"
      - name: "критический путь на окружении, собранном uv (advisory)"
        run: uv run --no-sync python -m pytest tests/contracts/ -m critical_path --tb=short -q
