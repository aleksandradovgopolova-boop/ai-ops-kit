name: nightly-coverage
# 2026-09-03 (замер CI): покрытие снято с пути каждого PR (держало стену ~10.8 мин, за окно прогонов
# не поймало ни одного падения, тесты и так гоняются в группах quality). Owner убрал `coverage` из
# обязательных проверок branch protection; здесь покрытие считается ВНЕ критического пути PR:
#   - ночью (heartbeat), чтобы дрейф покрытия не копился незамеченным;
#   - на каждый push в main (сразу после слияния — таймернее ночного);
#   - вручную перед релизом (workflow_dispatch).
# Охват покрытия — обычные fast/slow/contracts, без nightly и release_gate. Actual mutation и
# агрегатный bench остаются в nightly-quality (cron/push/manual); release сам гоняет mutation до тега.
# Пол покрытия остаётся 70% для ai_ops_kit + installer. Исторический замер полного набора (71%)
# не является замером этого охвата. Ошибка теста, отсутствие данных или результат ниже пола — FAIL.
# Падение здесь — сигнал на main/ночью, а НЕ блок PR.
on:
  schedule:
    - cron: "17 3 * * *"   # ежедневно ~03:17 UTC
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - run: pip install 'pyyaml==6.*' 'pytest==9.*' 'pytest-cov==7.*' 'pytest-xdist==3.*' 'hypothesis==6.*'
      - name: "Покрытие обычного набора без nightly/release_gate (пол 70%)"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # sysmon переводит coverage.py на sys.monitoring (CPython 3.12+) вместо трассировки каждой
          # строки; джоба закреплена на 3.12. Неподдержанное значение -> джоба упадёт громко, а не
          # станет тихо считать медленно.
          COVERAGE_CORE: sysmon
        run: |
          python3 -m pytest tests/ -q -n auto --dist loadfile -m "not nightly and not release_gate" \
            --cov=ai_ops_kit --cov=installer \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=70
