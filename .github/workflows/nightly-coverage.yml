name: nightly-coverage
# 2026-09-03 (замер CI): покрытие снято с пути каждого PR (держало стену ~10.8 мин, за окно прогонов
# не поймало ни одного падения, тесты и так гоняются в группах quality). Owner убрал `coverage` из
# обязательных проверок branch protection; здесь покрытие считается ВНЕ критического пути PR:
#   - ночью (heartbeat), чтобы дрейф покрытия не копился незамеченным;
#   - на каждый push в main (сразу после слияния — таймернее ночного);
#   - вручную перед релизом (workflow_dispatch).
# Охват покрытия — обычные fast/slow/contracts, без nightly и release_gate. Actual mutation и
# агрегатный bench остаются в nightly-quality (cron/push/manual); release сам гоняет mutation до тега.
# Пол покрытия остаётся 70% для ai_ops_kit + installer. Исторический замер полного набора (71%)
# не является замером этого охвата. Ошибка теста, отсутствие данных или результат ниже пола — FAIL.
# Падение здесь — сигнал на main/ночью, а НЕ блок PR.
on:
  schedule:
    - cron: "17 3 * * *"   # ежедневно ~03:17 UTC
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version-file: .python-version}
      - run: pip install 'pyyaml==6.*' 'pytest==9.*' 'pytest-cov==7.*' 'pytest-xdist==3.*' 'hypothesis==6.*'
      - name: "Отпечаток исходников до замера (#1387: привязка покрытия для CRAP)"
        run: python3 -m ai_ops_kit.devtools.coverage_binding snapshot --out "$RUNNER_TEMP/coverage-inputs.json"
      - name: "Покрытие обычного набора без nightly/release_gate (пол 70%)"
        id: cov
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # sysmon переводит coverage.py на sys.monitoring (CPython 3.12+) вместо трассировки каждой
          # строки; джоба закреплена на 3.12. Неподдержанное значение -> джоба упадёт громко, а не
          # станет тихо считать медленно.
          COVERAGE_CORE: sysmon
        run: |
          set +e
          python3 -m pytest tests/ -q -n auto --dist loadfile -m "not nightly and not release_gate" \
            --cov=ai_ops_kit --cov=installer \
            --cov-report=term-missing:skip-covered \
            --cov-report=json:"$RUNNER_TEMP/coverage.json" \
            --cov-fail-under=70
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
      # Привязка пишется и при красном прогоне — с outcome failed, которую crap_score не примет.
      # Входы изменились за время замера -> привязки нет (код 2), покрытие чужого кода не выдаётся.
      - name: "Привязка покрытия к исходникам (#1387)"
        if: always() && steps.cov.outputs.rc != ''
        env:
          TESTS_EXIT: ${{ steps.cov.outputs.rc }}
        run: >-
          python3 -m ai_ops_kit.devtools.coverage_binding bind
          --inputs "$RUNNER_TEMP/coverage-inputs.json" --report "$RUNNER_TEMP/coverage.json"
          --tests-exit "$TESTS_EXIT" --out "$RUNNER_TEMP/coverage-binding.json"
          --scope "nightly-coverage: tests/ -m 'not nightly and not release_gate', CI ubuntu-latest"
          -- python3 -m pytest tests/ -q -n auto --dist loadfile -m "not nightly and not release_gate"
          --cov=ai_ops_kit --cov=installer --cov-fail-under=70
      # Рекомендательно (#1387): новый и выросший долг виден в сводке прогона, прогон не краснеет.
      # Без этого шага находки копились молча — за пять дней после заморозки их набралось 21.
      - name: "Сложность при слабом покрытии: новый и выросший долг (рекомендательно, #1387)"
        if: always() && steps.cov.outputs.rc == '0'
        run: |
          {
            echo "## Сложность при слабом покрытии (CRAP, рекомендательно)"
            echo '```'
            python3 -m ai_ops_kit.devtools.crap_score --coverage "$RUNNER_TEMP/coverage.json" --coverage-binding "$RUNNER_TEMP/coverage-binding.json" || echo "код $?: 1 — есть новый/выросший долг или неполный замер, 2 — замер не принят"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: "Сохранить покрытие и привязку для CRAP-заморозки"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/coverage.json
            ${{ runner.temp }}/coverage-binding.json
            ${{ runner.temp }}/coverage-inputs.json
          if-no-files-found: warn
          retention-days: 14
