# release.yml — автоматический выпуск: успешный package-quality на main
# создаёт тег vX.Y.Z и GitHub Release с текстом из соответствующего раздела CHANGELOG.
# v3.27.6: stable Release создаётся ТОЛЬКО после успешного package-quality на том же SHA.
# Проверка: package-quality успешен AND VERSION содержит версию AND тег ещё отсутствует.
# Идемпотентен: если тег/Release уже существуют — шаг спокойно завершается.
name: release
on:
  workflow_run:
    workflows: ["package-quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  release:
    # Запускается только если package-quality завершился успешно
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Проверить, нужен ли release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # v3.30: спрашиваем GitHub, а не локальный клон. actions/checkout теги НЕ тянет,
          # поэтому `git rev-parse "$TAG"` всегда говорил «тега нет», и шаг шёл создавать уже
          # существующий релиз -> HTTP 422 «Release.tag_name already exists». Заявленная в шапке
          # идемпотентность не работала: КАЖДЫЙ мерж в main между релизами давал красный release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Release/тег $TAG уже существует — пропуск (идемпотентность)"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Тег $TAG отсутствует — release нужен"
          fi
      - name: Создать тег и Release из CHANGELOG
        if: steps.check_release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check_release.outputs.version }}"
          TAG="${{ steps.check_release.outputs.tag }}"
          # Раздел CHANGELOG для этой версии (от '## [X.Y.Z]' до следующего '## ')
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {on=1}
            on && $0 ~ "^## " && $0 !~ "^## \\[" ver "\\]" {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          # ОТКАЗ, А НЕ КРАТКИЕ ЗАПИСКИ (работа `release-has-a-gate`, 18.08.2026). Здесь стояло
          # «записки будут краткими» и `echo "AI Ops Kit $TAG"` — то есть выпуск выходил С ПУСТОЙ
          # историей, и никто об этом не узнавал. Замер EV-1112: 236 версий за 40 дней и ни одного
          # механизма, проверяющего выпуск; при таком темпе «краткие записки» это не исключение, а
          # способ по умолчанию. Решение владельца 17.08.2026 — гейты строгими сразу.
          # Отказ ДЕШЁВЫЙ и обратимый: тег ещё не создан, релиз не опубликован; чинится одной
          # секцией в CHANGELOG.md и повторным запуском (workflow идемпотентен).
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::в CHANGELOG.md нет раздела [$VERSION] — выпуск не создан. Добавьте раздел '## [$VERSION] — <дата>' и перезапустите release (тег ещё не создан, ничего откатывать не нужно)."
            exit 1
          fi
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac   # SemVer pre-release (rc/alpha/beta)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "AI Ops Kit $TAG" \
            $PRERELEASE \
            --notes-file /tmp/notes.md
          echo "Создан $TAG -> ${{ github.event.workflow_run.head_sha }}"
