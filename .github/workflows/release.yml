# release.yml — автоматический выпуск: успешный package-quality на main с изменением VERSION
# создаёт тег vX.Y.Z и GitHub Release с текстом из соответствующего раздела CHANGELOG.
# v3.27.6: stable Release создаётся ТОЛЬКО после успешного package-quality на том же SHA.
# Идемпотентен: если тег/Release уже существуют — шаг спокойно завершается.
name: release
on:
  workflow_run:
    workflows: ["package-quality"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  release:
    # Запускается только если package-quality завершился успешно И в push был изменён VERSION
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Проверить, что VERSION был изменён в этом push
        id: check_version
        run: |
          # Проверяем, был ли VERSION изменён в последнем коммите
          if git diff HEAD~1 HEAD --name-only | grep -q "^VERSION$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "VERSION не был изменён в этом push — пропуск release"
          fi
      - name: Создать тег и Release из CHANGELOG
        if: steps.check_version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG уже существует — пропуск."; exit 0
          fi
          # Раздел CHANGELOG для этой версии (от '## [X.Y.Z]' до следующего '## ')
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {on=1}
            on && $0 ~ "^## " && $0 !~ "^## \\[" ver "\\]" {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "В CHANGELOG.md нет раздела [$VERSION] — записки будут краткими."
            echo "AI Ops Kit $TAG" > /tmp/notes.md
          fi
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac   # SemVer pre-release (rc/alpha/beta)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "AI Ops Kit $TAG" \
            $PRERELEASE \
            --notes-file /tmp/notes.md
          echo "Создан $TAG -> ${{ github.event.workflow_run.head_sha }}"
