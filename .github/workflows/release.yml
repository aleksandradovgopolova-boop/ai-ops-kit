# release.yml — автоматический выпуск: при merge в main, когда появилась новая версия,
# создаётся тег vX.Y.Z и GitHub Release с текстом из соответствующего раздела CHANGELOG.
# v3.27.6: stable Release создаётся ТОЛЬКО после успешного полного набора на том же SHA.
# 2026-10-26 (#1376): раньше полный обязательный набор гонялся на КАЖДЫЙ merge в main (триггер
# `push: [main]` в package-quality), а release стартовал по его `workflow_run`. Этот дубль снят:
# package-quality на main больше не гоняется на каждый merge. Финальный полный гейт на ТОЧНОМ
# релизном SHA сохранён ЗДЕСЬ: release триггерится на push в main, дешёвой джобой `check` решает,
# нужен ли выпуск (тег для текущей VERSION ещё не существует), и ТОЛЬКО если нужен — джоба
# `full-gate` вызывает package-quality (`workflow_call`) на этом самом SHA. Джоба `release`
# (мутационный гейт, дренаж очереди, слой владельца, создание тега/Release) зависит от `full-gate`
# и выполняется лишь при его успехе. ЖЁСТКИЙ ИНВАРИАНТ: тег/Release не появляются, если полный
# обязательный набор не прошёл на точном итоговом SHA. На обычных merge (без новой версии) полный
# набор НЕ запускается — только дешёвый `check`.
# Идемпотентен: если тег/Release уже существуют — `check` ставит needed=false, выпуск пропускается.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  # Дешёвое решение «нужен ли выпуск»: без тестов, только VERSION + наличие тега. Гоняется на каждый
  # push в main, но стоит секунды. Только при needed=true ниже поднимается полный гейт.
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check_release.outputs.needed }}
      version: ${{ steps.check_release.outputs.version }}
      tag: ${{ steps.check_release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Проверить, нужен ли release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # v3.30: спрашиваем GitHub, а не локальный клон. actions/checkout теги НЕ тянет,
          # поэтому `git rev-parse "$TAG"` всегда говорил «тега нет», и шаг шёл создавать уже
          # существующий релиз -> HTTP 422 «Release.tag_name already exists». Заявленная в шапке
          # идемпотентность не работала: КАЖДЫЙ мерж в main между релизами давал красный release.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> $GITHUB_OUTPUT
            echo "Release/тег $TAG уже существует — пропуск (идемпотентность)"
          else
            echo "needed=true" >> $GITHUB_OUTPUT
            echo "Тег $TAG отсутствует — release нужен"
          fi

  # ФИНАЛЬНЫЙ ПОЛНЫЙ ГЕЙТ НА ТОЧНОМ РЕЛИЗНОМ SHA (#1376/#1321). Вызывает ТОТ ЖЕ package-quality,
  # что отдаёт обязательные контексты на PR, как reusable (`workflow_call`) — поэтому релизный гейт
  # не может разойтись с PR-гейтом (одно определение job'ов). Запускается на github.sha (релизный
  # merge-коммит) и ТОЛЬКО когда выпуск нужен: обычные merge полный набор не платят.
  full-gate:
    needs: check
    if: ${{ needs.check.outputs.needed == 'true' }}
    uses: ./.github/workflows/package-quality.yml

  release:
    # ИНВАРИАНТ: тег/Release создаются, только если выпуск нужен И полный набор ЗЕЛЁНЫЙ на этом SHA.
    # Явная проверка `full-gate.result == 'success'` намеренна: при падении полного набора эта джоба
    # не выполнится и тег не выйдет; при скипе full-gate (needed=false) условие тоже ложно.
    needs: [check, full-gate]
    if: ${{ needs.check.outputs.needed == 'true' && needs.full-gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      # МУТАЦИОННЫЙ ГЕЙТ — ПРЕДУСЛОВИЕ ВЫПУСКА, И ИМЕННО СИНХРОННОЕ (работа `mutation-gate-on-release`).
      # `test_every_declared_probe_of_the_kit_kills_its_mutant` доказывает, что тесты кита ЛОВЯТ
      # регрессии (применяет объявленные мутации и проверяет, что охрана краснеет). Раньше он жил
      # только в nightly-quality.yml — на cron ~03:37 UTC и на push в main, — а выпуск триггерился по
      # `workflow_run` от package-quality и НЕ дожидался его. Итог: тег/Release могли выйти на коммите,
      # для которого этот гейт не прогонялся вовсе (ночь идёт по расписанию и может лечь на ДРУГОЙ
      # SHA). Ждать nightly здесь нельзя: расписание не гарантирует прогон ИМЕННО релизного коммита.
      # Поэтому гейт гонится ЗДЕСЬ, синхронно, на релизном SHA (тот же checkout), тем же маркером
      # `-m nightly`, что и nightly-quality. Падение гейта = падение джобы: тег/Release НЕ создаются.
      - name: Установить Python для мутационного гейта
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Мутационный гейт на релизном коммите (предусловие выпуска)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pip install 'pyyaml==6.*' 'pytest==9.*' 'pytest-xdist==3.*' 'hypothesis==6.*'
          # Тот же маркер, что в nightly-quality.yml; область сужена до самого мутационного гейта,
          # чтобы выпуск ждал ровно доказательство «тесты ловят регрессии», а не агрегатный bench.
          python3 -m pytest tests/unit/test_mutation_probe.py -q -m nightly

      # ГЕЙТ ДРЕНАЖА ОЧЕРЕДИ ЗАЯВЛЕНИЙ (работа `release-drains-the-changelog-queue`, аудит A2).
      # Релиз собирает CHANGELOG из newsfragments/ и очищает очередь (сборка towncrier в release_bump
      # на бампе версии). Здесь — ДОКАЗАТЕЛЬСТВО результата на релизном SHA: если очередь непуста
      # (сборка не выполнялась/не добежала), тег НЕ создаётся. Гейт бежит ЧЕРЕЗ pytest (инвариант
      # PYTEST-ONLY, validate_agents_checklist) — тем же образцом, что мутационный гейт выше: маркер
      # `release_gate` держит тест вне обычного и ночного CI (там очередь непуста и это норма), а
      # здесь он гоняется явно. Стоит ДО создания тега.
      - name: Очередь заявлений пуста на релизе (гейт дренажа newsfragments)
        run: python3 -m pytest tests/unit/test_changelog_queue_release_gate.py -q -m release_gate

      # ГЕЙТ СЛОЯ ВЛАДЕЛЬЦА (#1210). `release_bump` уже проверяет слой A при сборке, но CHANGELOG можно
      # поправить руками после бампа. Здесь — та же строгая проверка (`validate_release_notes`, правила
      # из реестра) на слое выпускаемой версии, на релизном SHA: замечание, нет слоя или нет правил ->
      # тег не создаётся. Через pytest (PYTEST-ONLY) с маркером `release_gate`, как гейт очереди выше.
      - name: Описание выпуска для владельца проходит проверку (гейт слоя A)
        run: python3 -m pytest tests/unit/test_release_owner_layer.py -q -m release_gate

      - name: Создать тег и Release из CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # ТЕЛО RELEASE — СЛОЙ ВЛАДЕЛЬЦА, А НЕ ВЕСЬ ЖУРНАЛ (#1210). Раньше сюда копировался раздел
          # CHANGELOG целиком, вместе со «Служебным» (план, история). Теперь тело — слой A между
          # маркерами `<!-- owner-layer:start/end -->` (что меняется для вас, известные ограничения,
          # что дальше) и ссылка на полный раздел. Раздел без маркеров (выпуски до #1210) — как прежде,
          # целиком. Сборка — функция `release_body` (покрыта tests/unit/test_release_owner_layer.py);
          # это шаг сборки текста, а не проверка. Раздела нет -> пустой вывод, и отказывает строка ниже
          # (`[ ! -s ]`, одна на весь шаг — её держит мутационная проба); код 2 — сбой самой сборки.
          # Значения — только из env, в shell ничего не подставляется выражением.
          if ! python3 -m ai_ops_kit.devtools.release_bump --release-notes "$VERSION" --root . \
               --changelog-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md" > /tmp/notes.md; then
            echo "::error::сборка текста выпуска $TAG упала (причина — строкой выше) — выпуск не создан. Тег ещё не создан, ничего откатывать не нужно."
            exit 2
          fi
          # ОТКАЗ, А НЕ КРАТКИЕ ЗАПИСКИ (работа `release-has-a-gate`, 18.08.2026). Здесь стояло
          # «записки будут краткими» и `echo "AI Ops Kit $TAG"` — то есть выпуск выходил С ПУСТОЙ
          # историей, и никто об этом не узнавал. Замер EV-1112: 236 версий за 40 дней и ни одного
          # механизма, проверяющего выпуск; при таком темпе «краткие записки» это не исключение, а
          # способ по умолчанию. Решение владельца 17.08.2026 — гейты строгими сразу.
          # Отказ ДЕШЁВЫЙ и обратимый: тег ещё не создан, релиз не опубликован; чинится одной
          # секцией в CHANGELOG.md и повторным запуском (workflow идемпотентен).
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::в CHANGELOG.md нет раздела [$VERSION] — выпуск не создан. Добавьте раздел '## [$VERSION] — <дата>' и перезапустите release (тег ещё не создан, ничего откатывать не нужно)."
            exit 1
          fi
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac   # SemVer pre-release (rc/alpha/beta)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "AI Ops Kit $TAG" \
            $PRERELEASE \
            --notes-file /tmp/notes.md
          echo "Создан $TAG -> $HEAD_SHA"
