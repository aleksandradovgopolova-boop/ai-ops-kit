# Ночная сверка issue-трекера с роадмапом: каждое открытое направление всегда имеет эпик, каждая
# незакрытая работа — подзадачу; сделанное закрывается. Держит правило механизмом, а не памятью.
# Команда: `roadmap sync-issues --apply` (ядро — ai_ops_kit/planning/roadmap_issue_sync.py).
name: nightly-roadmap-sync
on:
  schedule:
    - cron: "30 3 * * *"   # после nightly-product-review (0 3), чтобы не пересекаться
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write            # заводит/обновляет/закрывает issue через gh
jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'aleksandradovgopolova-boop/ai-ops-kit'   # не на форках
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # roadmap check читает историю плана
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Свести issue-трекер с роадмапом
        env:
          PYTHONPATH: "."
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh авторизуется этим токеном
        run: |
          python -m ai_ops_kit.cli.ai_ops_cli roadmap sync-issues --apply \
            | tee -a "$GITHUB_STEP_SUMMARY"
