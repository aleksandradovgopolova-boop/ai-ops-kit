name: package-quality
on:
  # v3.25.1: полный CI НЕ на каждый draft PR — только когда PR готов к review/merge
  pull_request:
    # v3.30: добавлен opened. Прежде PR, созданный СРАЗУ как non-draft и смерженный без
    # последующих коммитов, не давал ни ready_for_review, ни synchronize — полный CI не
    # запускался вовсе, а PR показывал зелёный статус по одному pr-smoke. Draft-PR
    # по-прежнему отсекается условием на уровне джоба, так что смысл v3.25.1 сохранён.
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]
  workflow_dispatch: {}  # ручной запуск перед release

# Lane A1: минимальные привилегии — workflow получает только чтение контента.
permissions:
  contents: read

# v3.31: PYTHONPATH здесь БОЛЬШЕ НЕТ. Он ставился (v3.28.x) потому, что валидаторы делали
# `import _bootstrap`, а файл лежал только в tools/ — и заодно прятал этот дефект от CI: с поясом
# `installer --selftest` был зелёным, без пояса падал, то есть в child-репозитории кит не работал,
# а CI об этом молчал. Причина устранена в коде (validation/_bootstrap.py), пояс снят: CI обязан
# видеть ровно то же окружение, что пользователь. Не возвращать — вместо этого чинить импорт.
jobs:
  quality:
    # v3.27.3 WP4: не запускаем полный CI для draft PR даже при synchronize.
    # Условие НЕ сводится к `... == false`: на событиях `push` и `workflow_dispatch` объекта
    # pull_request нет, `null == false` в выражениях Actions ложно — джоба молча скипалась бы и
    # обязательный контекст на push в main не отдавался бы НИКОГДА. Защитная ветка
    # `github.event_name != 'pull_request'` пропускает не-PR события, а draft-фильтр применяется
    # только к самим PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v3.30: группы — разбиение pytest по маркерам, а не рукописные списки команд.
        # Проверка, добавленная как тест, попадает в свою группу сама.
        include:
          - group: fast
            script: .github/ci-groups/fast.sh
          - group: selftests-a
            script: .github/ci-groups/selftests-a.sh
          - group: selftests-m
            script: .github/ci-groups/selftests-m.sh
          - group: contracts
            script: .github/ci-groups/contracts.sh
    env:
      AI_OPS_DIFF_BASE: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # история нужна eval-гейту для diff изменённых агентов
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # 2026-08-12: pytest-cov здесь БОЛЬШЕ НЕ НУЖЕН. Прежде `--cov` стоял в addopts pytest.ini,
      # поэтому любой запуск требовал pytest-cov, а каждый скрипт гасил покрытие через `--no-cov`;
      # джобы, забывшие поставить пакет, падали с «unrecognized arguments: --cov=...» ещё до
      # тестов. Покрытие переехало в отдельную джобу `coverage`, где у него есть порог.
      - run: pip install pyyaml pytest pytest-xdist hypothesis
      - name: "Run ${{ matrix.group }} checks"
        run: bash ${{ matrix.script }}

  # v3.36.8 (ревизия 2026-08-11): ЛИНТЕР ИСПОЛНЯЕТСЯ. Прежде ruff стоял в dev-зависимостях и
  # в `.pre-commit-config.yaml`, но в CI его не было вовсе, а охват хука (`^(tools|validation|tests)/`)
  # не включал пакет `ai_ops_kit/` — 40 544 строки продакшна не линтовались ни разу. Так и жили пять
  # точек входа, падавших с `NameError` при любом запуске (`sys.exit(selftest())` после удаления
  # функции в v3.30), и затенённый тестовый класс, который не исполнялся.
  #
  # Отдельная джоба, а не шаг в группе: линтер не зависит от фикстур и должен давать ответ за
  # секунды, не дожидаясь матрицы. Набор правил — `pyproject.toml -> [tool.ruff.lint]`; он узкий
  # намеренно (класс «поломка», не стиль) и потому исполняется как блокирующий, а не advisory.
  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — не украшение: `towncrier check --compare-with origin/main` сравнивает
      # ветку с базой, и на shallow-клоне базы просто нет (гейт молча не нашёл бы diff).
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # ВЕРСИЯ ПИНУЕТСЯ, и это замер, а не аккуратность. Здесь стояло `pip install ruff`
      # (то есть последний), а `.pre-commit-config.yaml` пинит v0.8.0 — два РАЗНЫХ линтера.
      # 12.08.2026 это дало ровно то, против чего стоит весь набор: локально «чисто», в CI
      # красное. Новый ruff видит `except (Конкретный, Exception)` как BLE001, старый нет —
      # и находка была настоящей (тест мог пройти при полностью сломанном бюджете).
      # Версия здесь и в хуках обязана быть ОДНА; поднимать её — отдельным осознанным шагом,
      # потому что новая версия приносит новые правила и свою уборку.
      - run: pip install 'ruff==0.16.2'
      - name: "ruff — правила класса «поломка» (F821/F811/B023/F841)"
        run: ruff check .
      # Битая директива `# noqa` НЕ ПОДАВЛЯЕТ НИЧЕГО, а ruff сообщает о ней предупреждением в
      # stderr и выходит с кодом 0. То есть подавление объявлено и не работает — тот же класс
      # «объявлено, но не исполняется», ради которого эта джоба и появилась. Предупреждение,
      # которого никто не читает, — не проверка.
      #
      # Триггер замерен, а не угадан (ревизия 2026-08-11): ruff принимает за директиву ЛЮБОЙ
      # комментарий, начинающийся со слова `noqa`, — в том числе пояснительный
      # (`# noqa-решение ЗАПИСАНО: ...`), и тогда ломается разбор. Двоеточие в ТЕКСТЕ после кода
      # (`# noqa: BLE001 — вердикт: пересчитаем`) разбор НЕ ломает: проверено отдельной пробой.
      # Пишите пояснение так, чтобы комментарий не начинался со слова `noqa`.
      - name: "битая директива # noqa ловится как ошибка, а не как предупреждение"
        run: |
          out=$(ruff check . --select ALL 2>&1 || true)
          if printf '%s' "$out" | grep -F 'Invalid `# noqa`'; then
            echo "::error::битая директива # noqa — подавление объявлено, но не работает"
            exit 1
          fi
          echo "битых директив # noqa нет"
      # ВОРОТА ВЫПУСКА (работа `release-has-a-gate`, 18.08.2026). Стоят в ЭТОЙ джобе, а не в новой,
      # осознанно: новая джоба не попадает в обязательные статусы защиты ветки без действия владельца,
      # то есть гейт исполнялся бы «по желанию» — ровно класс «объявлено, но не исполняется». Имя
      # джобы не меняем: оно закреплено в защите ветки.
      # Версии пинуются по той же причине, что и ruff: разные версии инструмента дают разные ответы.
      - run: pip install 'towncrier==25.8.0' 'commitizen==4.17.1'
      - name: "запись для CHANGELOG добавлена в этой ветке (towncrier check)"
        # ЕДИНСТВЕННЫЙ из шести рассмотренных инструментов с таким гейтом (EV-1137). Никогда не
        # зовём `build`: старый CHANGELOG.md остаётся как есть, ретро-миграция не нужна.
        # Сравнение с origin/main требует полной истории — fetch-depth: 0 ниже в шаге checkout.
        run: towncrier check --compare-with origin/main
      - name: "формат новых коммитов (cz check от точки включения)"
        # ТОЛЬКО НОВЫЕ КОММИТЫ — решение владельца 17.08.2026: в истории 72 коммита без
        # conventional-префикса из 594, и правило, требующее переписать историю, не введут никогда.
        # Точка включения читается из pyproject (её же читают тесты), а не вписана здесь строкой.
        # Код 3 = «в диапазоне нет коммитов» (замерено) — это «проверять нечего», а не нарушение:
        # гейт, краснеющий на пустоте, отключают целиком.
        #
        # ДИАПАЗОН СЧИТАЕТСЯ ОТ БАЗЫ PR, А НЕ ОТ ТОЧКИ ВКЛЮЧЕНИЯ (замер 20.08.2026). Прежде здесь
        # стояло `"$FROM"..HEAD`, то есть на PR проверялась ВСЯ история от точки включения — вместе
        # с чужими коммитами, уже лежащими в main. 20.08 это дало прямую цену: PR #211 слили
        # squash'ем, заголовок PR стал сообщением коммита `664c3f0` без conventional-префикса, main
        # покраснел — и красное унаследовал КАЖДЫЙ следующий PR, включая тот, что этот гейт не
        # нарушал. Гейт наказывал следующего пришедшего и не мог быть удовлетворён его правками
        # вовсе: нарушение лежало в предках. Тот же класс, что у потолка поставки («мерим очередь, а
        # не размер»).
        # На PR диапазон — база PR..HEAD: ровно коммиты этого PR, то есть ровно то, за что автор
        # отвечает. Вне PR (push в main, ручной запуск) остаётся точка включения: там HEAD и есть
        # история, и сузить диапазон было бы ослаблением.
        #
        # ВТОРАЯ ПОЛОВИНА ЭТОЙ ДЫРЫ ЗАКРЫТА ОТДЕЛЬНО (#215): текст, который станет коммитом при
        # squash-слиянии, — это ЗАГОЛОВОК PR, и его проверяет джоба `pr-smoke`. Здесь он намеренно
        # НЕ проверяется второй раз: два механизма на одну работу означают, что ни одна проба не
        # может доказать, какой из них работает.
        run: |
          FROM=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['ai_ops']['release_gates']['commit_format_enforced_after'])")
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
            echo "формат обязателен для коммитов ЭТОГО PR (${RANGE})"
          else
            RANGE="$FROM..HEAD"
            echo "формат обязателен для коммитов после $FROM"
          fi
          set +e
          cz check --rev-range "$RANGE"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then
            echo "формат коммитов: проверено (код $rc)"
          else
            echo "::error::формат сообщений коммитов нарушен (код $rc)"
            exit 1
          fi

  # Lane A2: кит гоняет собственный security-scan против диффа PR.
  # Только на PR (не push в main): `--base origin/main` требует наличия базы для сравнения.
  # Сканер детерминированный (секреты + зависимости + флаги injection-surface),
  # возврат 0 = чисто, 1 = находки/ошибка.
  security-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # нужна история для git diff против origin/main
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: "Security scan: секреты, зависимости, injection-surface"
        run: python3 ai_ops_kit/security/security_scan.py --base origin/main

  # Advisory (работа p1-merge-preview-delivered-footprint): объём ДОСТАВЛЯЕМОЙ части ИТОГА слияния —
  # пересечение дерева-итога `git merge-tree origin/main HEAD` с managed_set дочки — против потолка
  # volume_bytes. Меряет то, что реально поедет в дочку из РЕЗУЛЬТАТА слияния, а не ветку PR в одиночку
  # и не всё дерево-итог (это делает merge_preview). НЕ блокирующая: запускается без --strict (всегда
  # exit 0); новый job в обязательные статусы защиты ветки не входит без действия владельца — промоут
  # отдельным решением. Только на PR: --base origin/main требует базы для превью слияния.
  delivered-footprint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # нужен origin/main как база превью слияния
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: "Advisory: footprint доставляемого итога слияния (merge-preview ∩ managed_set)"
        run: python3 installer/delivered_merge_footprint.py --base origin/main --head HEAD


  # 2026-09-03 (замер CI): джоба `coverage` УБРАНА С ПУТИ PR. Замер показал: она занимала ~10.8 мин
  # и держала стену package-quality, при этом за окно прогонов не завалила ничего, а тесты и так
  # гоняются в группах quality. Owner снял `coverage` из обязательных проверок branch protection,
  # после чего покрытие переехало в отдельный workflow `nightly-coverage.yml` (ночью + на push в main
  # + вручную). Порог-ратчет и обоснование 70/71% переехали туда же, дословно. PR больше не платит за
  # покрытие; сама метрика не потеряна, только ушла с критического пути обратной связи.

  # v3.31.1: прогон установки в ЧИСТОМ окружении. Отдельная джоба, а не тест в группе, именно
  # ради окружения: ставится ТОЛЬКО pyyaml — ни pytest, ни hypothesis, ни editable-установки кита.
  # За один день так всплыли четыре дефекта, невидимых зелёному CI: голый import _bootstrap в
  # валидаторах, пояс PYTHONPATH, молчаливый no-op всех 94 точек входа и _bootstrap, не попавший
  # в поставку. Джоба заодно проверяет заявку requirements.txt «нужен только pyyaml».
  clean-install:
    runs-on: ubuntu-latest
    # НЕ матрица осознанно: матрица переименовала бы контекст статуса в `clean-install (3.12)`, а
    # branch protection держит required-контекст `clean-install` по ИМЕНИ — переименование осиротило
    # бы его, и все PR зависли бы BLOCKED (ровно инцидент python39-compat, ради которого заведён
    # required-contexts). Совместимость с 3.13 доказывает `pipeline-e2e (3.13)` — полный прогон
    # набора на 3.13; механика чистой установки (копирование файлов) версие-независима.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml          # РОВНО рантайм-зависимость, ничего сверх
      - name: "Установка в чистый репозиторий без кита рядом"
        run: bash scripts/check-clean-install.sh

  # 19.08.2026 (аудит): ОБНОВЛЕНИЕ — самый частый сценарий дочки, и он не проверялся ничем.
  # `clean-install` смотрит на установку С НУЛЯ, а с нуля дочка ставится один раз; обновляется она
  # каждый день (`ai-ops-update.yml` включён по умолчанию). Именно на этом пути жили самые дорогие
  # находки поля — F-030 (после обновления `next` переставал отвечать), F-032 (точка входа
  # отставала на релиз), гейт отставания (версия и содержимое разошлись на 49 файлов).
  # Отдельная джоба, а не тест в группе, по той же причине, что и clean-install: нужно чистое
  # окружение и настоящая установка, а не имитация.
  upgrade-path:
    runs-on: ubuntu-latest
    # НЕ матрица осознанно (та же причина, что у clean-install): переименование джобы в
    # `upgrade-path (3.12)` осиротило бы required-контекст `upgrade-path` в branch protection.
    # 3.13 покрывает `pipeline-e2e (3.13)`; механика обновления версие-независима.
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}          # нужны ТЕГИ: обновляемся с предыдущего выпуска
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml         # РОВНО рантайм-зависимость, как у пользователя
      - name: "Обновление предыдущий выпуск -> рабочее дерево"
        run: bash scripts/check-upgrade-path.sh

  pipeline-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # compatibility-matrix: пол requires-python = ">=3.12" обещает совместимость с 3.13+,
        # поэтому e2e гоняется на 3.12 И 3.13, а не только на нижней границе — иначе обещанная
        # совместимость объявлена, но не проверена. 3.14 сюда НЕ добавляем: не релизнута/нестабильна
        # на раннерах (у кита на ней локально OOM в xdist), арбитр совместимости — этот CI.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      # 2026-08-12: pytest-cov здесь БОЛЬШЕ НЕ НУЖЕН. Прежде `--cov` стоял в addopts pytest.ini,
      # поэтому любой запуск требовал pytest-cov, а каждый скрипт гасил покрытие через `--no-cov`;
      # джобы, забывшие поставить пакет, падали с «unrecognized arguments: --cov=...» ещё до
      # тестов. Покрытие переехало в отдельную джобу `coverage`, где у него есть порог.
      - run: pip install pyyaml pytest pytest-xdist hypothesis
      - name: "Process Contract Tests: 20 pytest-тестов доказывают инварианты процессов (WP2-WP5)"
        run: python3 -m pytest tests/contracts/ -v --tb=short
