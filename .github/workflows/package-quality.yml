name: package-quality
on:
  # ИНВАРИАНТ: полный CI НЕ на каждый draft PR — только когда PR готов (ready_for_review/synchronize),
  pull_request:
    # плюс `opened` (PR, созданный сразу non-draft и смерженный без коммитов, иначе не давал события —
    # полный CI не запускался, а статус был зелёным по одному pr-smoke). Draft отсекается на уровне
    # джобы (ниже). Хроника: decisions/registry.yaml → ep-2026-08-12-ci-workflow-shape-and-belts.
    types: [opened, ready_for_review, synchronize]
  push:
    branches: [main]
  workflow_dispatch: {}  # ручной запуск перед release

# Lane A1: минимальные привилегии — workflow получает только чтение контента.
permissions:
  contents: read

# ИНВАРИАНТ: PYTHONPATH здесь НЕ ставим — CI обязан видеть ровно то же окружение, что пользователь.
# Пояс прятал дефект (`import _bootstrap` работал с поясом, падал без; в child кит не работал, а CI
# молчал). Причина устранена в validation/_bootstrap.py — чинить импорт, а не возвращать пояс.
# Хроника: decisions/registry.yaml → ep-2026-08-12-ci-workflow-shape-and-belts.
jobs:
  quality:
    # ИНВАРИАНТ: не запускаем полный CI для draft PR. Условие НЕ сводится к `... == false`: на push и
    # workflow_dispatch объекта pull_request нет, `null == false` в Actions ложно — джоба молча
    # скипалась бы и обязательный контекст на push в main не отдавался бы никогда. Защитная ветка
    # `github.event_name != 'pull_request'` пропускает не-PR события; draft-фильтр — только к PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ИНВАРИАНТ: группы — разбиение pytest по маркерам (проверка-тест попадает в свою группу сама).
        # Шард `fast` разбит на `fast-1`/`fast-2`: партиция по `-k` полная и непересекающаяся
        # (fast-2 = `not (набор fast-1)`), подробности — в .github/ci-groups/fast-1.sh.
        # ⚠ ВЛАДЕЛЬЦУ: required-статусы branch protection обновляет человек (см. quality/required-contexts.yaml).
        # Хроника (#465: стена 180 c, разброс раннера ±40 c): decisions/registry.yaml
        #   → ep-2026-08-12-ci-workflow-shape-and-belts.
        include:
          - group: fast-1
            script: .github/ci-groups/fast-1.sh
          - group: fast-2
            script: .github/ci-groups/fast-2.sh
          - group: selftests-a
            script: .github/ci-groups/selftests-a.sh
          - group: selftests-m
            script: .github/ci-groups/selftests-m.sh
          - group: contracts
            script: .github/ci-groups/contracts.sh
    env:
      AI_OPS_DIFF_BASE: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}   # история нужна eval-гейту для diff изменённых агентов
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      # ИНВАРИАНТ: pytest-cov здесь НЕ ставим — покрытие живёт в отдельной джобе с порогом, а не в
      # addopts pytest.ini (иначе любой запуск требовал бы пакет и падал бы до тестов).
      # Хроника: decisions/registry.yaml → ep-2026-08-12-ci-workflow-shape-and-belts.
      - run: pip install 'pyyaml==6.*' 'pytest==9.*' 'pytest-xdist==3.*' 'hypothesis==6.*'
      - name: "Run ${{ matrix.group }} checks"
        run: bash ${{ matrix.script }}

  # ИНВАРИАНТ: линтер ИСПОЛНЯЕТСЯ (блокирующий). Отдельная джоба, а не шаг в группе: он не зависит от
  # фикстур и должен отвечать за секунды. Набор правил — pyproject.toml → [tool.ruff.lint]; он узкий
  # намеренно (класс «поломка», не стиль), потому блокирующий, а не advisory.
  # Хроника (ruff/mypy/ворота выпуска — когда/каким PR введены): decisions/registry.yaml
  #   → ep-2026-08-11-ruff-enforced-class-of-breakage, ep-2026-09-09-mypy-enforced-on-foundation,
  #     ep-2026-08-18-release-has-a-gate.
  lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — не украшение: `towncrier check --compare-with origin/main` сравнивает
      # ветку с базой, и на shallow-клоне базы просто нет (гейт молча не нашёл бы diff).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      # ИНВАРИАНТ: версия ruff здесь и в хуках — ОДНА и пинуется (разные версии = разные правила,
      # даёт «локально чисто, в CI красное»); поднимать её — отдельным осознанным шагом со своей уборкой.
      # Хроника: decisions/registry.yaml → ep-2026-08-12-ruff-set-widened-suppression-ratchet.
      - run: pip install 'ruff==0.16.2'
      - name: "ruff — правила класса «поломка» (F821/F811/B023/F841)"
        run: ruff check .
      # ИНВАРИАНТ: битая директива `# noqa` подавления НЕ делает, а ruff лишь предупреждает и выходит с
      # 0 — ловим как ошибку. ГРАНИЦА для авторов: ruff принимает за директиву любой комментарий,
      # начинающийся со слова `noqa` — пишите пояснение так, чтобы комментарий с него НЕ начинался
      # (двоеточие в тексте после кода разбор не ломает).
      # Хроника: decisions/registry.yaml → ep-2026-08-11-ruff-enforced-class-of-breakage.
      - name: "битая директива # noqa ловится как ошибка, а не как предупреждение"
        run: |
          out=$(ruff check . --select ALL 2>&1 || true)
          if printf '%s' "$out" | grep -F 'Invalid `# noqa`'; then
            echo "::error::битая директива # noqa — подавление объявлено, но не работает"
            exit 1
          fi
          echo "битых директив # noqa нет"
      # ИНВАРИАНТ: mypy ИСПОЛНЯЕТСЯ (блокирующий). Область строгая — фундамент (kernel+shared), см.
      # [tool.mypy] в pyproject; версия пинуется (разные версии = разные ответы); enforcement-inventory
      # ссылается на ЭТОТ шаг как доказательство исполнения.
      # Хроника (F-05): decisions/registry.yaml → ep-2026-09-09-mypy-enforced-on-foundation.
      - run: pip install 'mypy==2.3.1'
      - name: "mypy — фундамент (kernel+shared) типобезопасен"
        run: mypy
      # ВОРОТА ВЫПУСКА (towncrier + cz check). ИНВАРИАНТ: стоят в ЭТОЙ обязательной джобе, а не в новой
      # (новая не попадает в required-статусы защиты ветки без действия владельца — гейт исполнялся бы
      # «по желанию»); имя джобы НЕ меняем (закреплено в защите ветки); версии пинуются.
      # Хроника: decisions/registry.yaml → ep-2026-08-18-release-has-a-gate.
      - run: pip install 'towncrier==25.8.0' 'commitizen==4.17.1'
      - name: "запись для CHANGELOG добавлена в этой ветке (towncrier check)"
        # ИНВАРИАНТ: только `check`, никогда `build` (старый CHANGELOG.md остаётся как есть). Сравнение
        # с origin/main требует полной истории — fetch-depth: 0 в шаге checkout.
        run: towncrier check --compare-with origin/main
      - name: "формат новых коммитов (cz check от точки включения)"
        # ИНВАРИАНТ: только НОВЫЕ коммиты (правило «переписать историю» не введут); точка включения
        # читается из pyproject (её же читают тесты), не вписана строкой; код 3 = «проверять нечего»,
        # а не нарушение. Диапазон на PR — от БАЗЫ PR (ровно коммиты автора; иначе гейт наказывал бы
        # следующего за чужой уже слитый squash-коммит), вне PR — от точки включения. Заголовок PR
        # (будущий squash-коммит) проверяет отдельно джоба `pr-smoke` — здесь НЕ дублируем.
        # Хроника: decisions/registry.yaml → ep-2026-08-18-release-has-a-gate.
        run: |
          FROM=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['ai_ops']['release_gates']['commit_format_enforced_after'])")
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
            echo "формат обязателен для коммитов ЭТОГО PR (${RANGE})"
          else
            RANGE="$FROM..HEAD"
            echo "формат обязателен для коммитов после $FROM"
          fi
          set +e
          cz check --rev-range "$RANGE"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then
            echo "формат коммитов: проверено (код $rc)"
          else
            echo "::error::формат сообщений коммитов нарушен (код $rc)"
            exit 1
          fi
      # CommitContract по коммитам PR (F-13). До этого контракт (commit_policy: охват коммита,
      # заглушки, секреты, ссылка на WorkItem) жил ТОЛЬКО в локальном хуке commit-msg — внешний PR
      # его не проходил, а в CI зеркалились лишь cz check и towncrier. «Половина проверки хуже
      # отсутствующей» — вот та половина. Здесь контракт гоняется по каждому коммиту диапазона PR.
      # Сегодня enforce=advise: rc красит ТОЛЬКО настоящие нарушения (секреты/заглушки); broad_scope
      # и no_workitem печатаются советом. SKIP_CLAIMS=1 — реестра заявок машины в CI нет.
      - if: ${{ github.event_name == 'pull_request' }}
        run: pip install 'pyyaml==6.*'
      - name: "CommitContract по коммитам PR (охват + осмысленность сообщения; advise)"
        if: ${{ github.event_name == 'pull_request' }}
        env:
          COMMIT_CONTRACT_SKIP_CLAIMS: "1"
        run: |
          rc=0
          for sha in $(git rev-list "${{ github.event.pull_request.base.sha }}..HEAD"); do
            msg=$(mktemp); git log -1 --format=%B "$sha" > "$msg"
            files=$(git diff-tree --no-commit-id --name-only -r "$sha" | tr '\n' ' ')
            [ -z "$files" ] && continue
            COMMIT_CONTRACT_FILES="$files" scripts/commit-contract.sh "$msg" || rc=$?
          done
          if [ "$rc" -ne 0 ]; then echo "::error::CommitContract нашёл нарушение в коммите PR"; exit 1; fi
          echo "CommitContract: коммиты PR проверены (советы, если были, — выше)"

  # Lane A2: кит гоняет собственный security-scan против диффа PR.
  # Только на PR (не push в main): `--base origin/main` требует наличия базы для сравнения.
  # Сканер детерминированный (секреты + зависимости + флаги injection-surface),
  # возврат 0 = чисто, 1 = находки/ошибка.
  security-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}   # нужна история для git diff против origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: "Security scan: секреты, зависимости, injection-surface"
        run: python3 ai_ops_kit/security/security_scan.py --base origin/main

  # Advisory (работы p1-merge-preview-delivered-footprint + gate-measures-merge-result): ОБЪЁМ и
  # ЧИСЛО ФАЙЛОВ ДОСТАВЛЯЕМОЙ части ИТОГА слияния — пересечение дерева-итога `git merge-tree
  # origin/main HEAD` с managed_set дочки — против потолков volume_bytes и substantive_files. Меряет
  # то, что реально поедет в дочку из РЕЗУЛЬТАТА слияния, а не ветку PR в одиночку и не всё дерево-итог
  # (это делает merge_preview). Файловая ось закрывает дрейф 490->498 ФАЙЛОВ, который объёмная ось не
  # ловит. НЕ блокирующая: запускается без --strict (всегда exit 0); новый job в обязательные статусы
  # защиты ветки не входит без действия владельца — промоут отдельным решением. Только на PR:
  # --base origin/main требует базы для превью слияния.
  delivered-footprint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}   # нужен origin/main как база превью слияния
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: "Advisory: объём+число файлов доставляемого итога слияния (merge-preview ∩ managed_set)"
        run: python3 installer/delivered_merge_footprint.py --base origin/main --head HEAD


  # ИНВАРИАНТ: покрытие НЕ на пути PR — оно в отдельном workflow nightly-coverage.yml (порог-ратчет и
  # обоснование 70/71% там же). Метрика не потеряна, только ушла с критического пути обратной связи.
  # Хроника: decisions/registry.yaml → ep-2026-08-12-ci-workflow-shape-and-belts.

  # ИНВАРИАНТ: установка в ЧИСТОМ окружении — отдельная джоба, ставится ТОЛЬКО pyyaml (ни pytest, ни
  # hypothesis, ни editable). Так видны дефекты, невидимые зелёному CI (голый import _bootstrap, пояс
  # PYTHONPATH, no-op точек входа); заодно проверяет заявку «нужен только pyyaml».
  # Хроника: decisions/registry.yaml → ep-2026-08-12-ci-workflow-shape-and-belts.
  clean-install:
    runs-on: ubuntu-latest
    # ИНВАРИАНТ: НЕ матрица — она переименовала бы контекст в `clean-install (3.12)` и осиротила бы
    # required-контекст (инцидент python39-compat). Совместимость с 3.13 доказывает `pipeline-e2e
    # (3.13)`; механика чистой установки версие-независима.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml          # РОВНО рантайм-зависимость, ничего сверх
      - name: "Установка в чистый репозиторий без кита рядом"
        run: bash scripts/check-clean-install.sh

  # ИНВАРИАНТ: ОБНОВЛЕНИЕ — самый частый сценарий дочки (каждый день), проверяется отдельной джобой в
  # чистом окружении (не имитация). На этом пути жили самые дорогие находки поля (F-030/F-032, гейт
  # отставания: версия и содержимое разошлись на 49 файлов).
  # Хроника: decisions/registry.yaml → ep-2026-08-12-ci-workflow-shape-and-belts.
  upgrade-path:
    runs-on: ubuntu-latest
    # ИНВАРИАНТ: НЕ матрица (та же причина, что у clean-install: осиротила бы required-контекст).
    # 3.13 покрывает `pipeline-e2e (3.13)`; механика обновления версие-независима.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}          # нужны ТЕГИ: обновляемся с предыдущего выпуска
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml         # РОВНО рантайм-зависимость, как у пользователя
      - name: "Обновление предыдущий выпуск -> рабочее дерево"
        run: bash scripts/check-upgrade-path.sh

  pipeline-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # compatibility-matrix: пол requires-python = ">=3.12" обещает совместимость с 3.13+,
        # поэтому e2e гоняется на 3.12 И 3.13, а не только на нижней границе — иначе обещанная
        # совместимость объявлена, но не проверена. 3.14 сюда НЕ добавляем: не релизнута/нестабильна
        # на раннерах (у кита на ней локально OOM в xdist), арбитр совместимости — этот CI.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "${{ matrix.python-version }}"}
      # ИНВАРИАНТ: pytest-cov здесь НЕ ставим — покрытие живёт в отдельной джобе с порогом, а не в
      # addopts pytest.ini (иначе любой запуск требовал бы пакет и падал бы до тестов).
      # Хроника: decisions/registry.yaml → ep-2026-08-12-ci-workflow-shape-and-belts.
      - run: pip install 'pyyaml==6.*' 'pytest==9.*' 'pytest-xdist==3.*' 'hypothesis==6.*'
      - name: "Process Contract Tests: 20 pytest-тестов доказывают инварианты процессов (WP2-WP5)"
        run: python3 -m pytest tests/contracts/ -v --tb=short

  # macOS advisory (F-10): разработка идёт на macOS, а CI её не видел — платформа владельца не
  # проверялась. Джоба НАБЛЮДАЕТ её на быстром срезе (critical_path), но НЕ блокирует
  # (continue-on-error): реальные отличия macOS/Linux (NFC/NFD имён, case-sensitivity) станут видны,
  # а не спрячутся. НЕ в required-контекстах branch protection — красный здесь PR не держит.
  smoke-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install 'pyyaml==6.*' 'pytest==9.*' 'pytest-xdist==3.*' 'hypothesis==6.*'
      - name: "macOS advisory: critical_path на платформе владельца (не блокирует)"
        run: python3 -m pytest -m critical_path -q
