name: package-quality
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # история нужна eval-гейту для diff изменённых агентов
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Реестр агентов и манифест
        run: python3 validation/validate_ai_first_registry.py
      - name: Workflow-контракты и gates
        run: python3 validation/validate_ai_first_workflows.py
      - name: Конфиги
        run: python3 validation/validate_ai_first_config.py
      - name: Реестры провайдеров/сред + routing
        run: python3 validation/validate_ai_first_providers.py
      - name: Self-test маршрутизации
        run: python3 validation/ai_route.py --selftest
      - name: Capability self-test (offline)
        run: python3 validation/ai_capability_selftest.py
      - name: Stale-gates детектор (selftest)
        run: python3 validation/validate_stale_gates.py --selftest
      - name: Генератор runtime-файлов (selftest)
        run: python3 tools/generate_runtime.py --selftest
      - name: Генератор артефактов по blueprint (selftest)
        run: python3 tools/generate_artifacts.py --selftest
      - name: Отчёт-оценка прогона фичи (selftest)
        run: python3 tools/run_report.py --selftest
      - name: Метрики эффекта по истории (selftest)
        run: python3 tools/effect_metrics.py --selftest
      - name: Sequential-оркестратор (selftest)
        run: python3 tools/orchestrator.py --selftest
      - name: Execution budget — потолок вызовов модели (selftest)
        run: python3 tools/budget.py --selftest
      - name: Tool-calling петля — механика (selftest)
        run: python3 tools/tool_loop.py --selftest
      - name: Единый git-хелпер с таймаутом (selftest)
        run: python3 tools/gitio.py --selftest
      - name: Durable lifecycle store — атомарная запись + fail-closed чтение (selftest)
        run: python3 tools/lifecycle_store.py --selftest
      - name: Единый execution-pipeline — сборка движка (selftest)
        run: python3 tools/execution_pipeline.py --selftest
      - name: Открытие draft PR — механизм (selftest)
        run: python3 tools/pr_open.py --selftest
      - name: Gate executor — исполнение и блокировка гейтов (selftest)
        run: python3 tools/gate_executor.py --selftest
      - name: Structured reviewer-result (selftest)
        run: python3 validation/validate_reviewer_result.py --selftest
      - name: Tool Broker + Policy Engine (selftest)
        run: python3 tools/tool_broker.py --selftest
      - name: Согласованность workflow ↔ gate (applicability)
        run: |
          python3 validation/validate_workflow_gates.py --selftest
          python3 validation/validate_workflow_gates.py
      - name: WorkItem — единая сущность и статус (selftest)
        run: python3 tools/workitem.py --selftest
      - name: RunPlan — base_workflow + tracks (selftest + tracks integrity)
        run: |
          python3 tools/run_plan.py --selftest
          python3 tools/run_plan.py validate
      - name: ai-ops run — единый контроллер задачи (selftest)
        run: python3 tools/ai_ops_run.py --selftest
      - name: Bench Lite — оффлайн golden-корпус решений движка (selftest)
        run: python3 tools/bench_lite.py --selftest
      - name: Gate Policy — риск-калиброванная UI-политика + shadow-diff (selftest)
        run: python3 tools/gate_policy.py --selftest
      - name: GateResult v2 — контракт + адаптер v2->v1 (selftest)
        run: python3 tools/gate_result_v2.py --selftest
      - name: Storybook Evidence Adapter — UIEvidenceBundle из локальных артефактов (selftest)
        run: python3 tools/storybook_adapter.py --selftest
      - name: UIEvidenceBundle — контракт UI-evidence (selftest)
        run: python3 validation/validate_storybook_evidence.py --selftest
      - name: ArchitectureDecision (ADR) — контракт архитектурных решений (selftest)
        run: python3 validation/validate_architecture_decision.py --selftest
      - name: ADR registry — целостность + fitness (selftest + реальный реестр)
        run: |
          python3 validation/validate_adr_registry.py --selftest
          python3 validation/validate_adr_registry.py
      - name: Quality-attributes fitness — профиль + противоречия (selftest + реальный реестр)
        run: |
          python3 validation/validate_quality_attributes.py --selftest
          python3 validation/validate_quality_attributes.py
      - name: Evolution triggers — ADR ↔ Product Health governance-петля (selftest)
        run: python3 tools/evolution_triggers.py --selftest
      - name: FeatureLearning — мост research DecisionPackage -> продукт (selftest + реальный реестр)
        run: |
          python3 validation/validate_feature_learning.py --selftest
          python3 validation/validate_feature_learning.py
      - name: Learning-loop fitness — петля research->learning->architecture (selftest + реальная)
        run: |
          python3 validation/validate_learning_loop.py --selftest
          python3 validation/validate_learning_loop.py
      - name: Operational Architecture Backbone — контракты v3.3.2 (selftests + пример WorkGraph)
        run: |
          python3 validation/validate_context_architecture.py --selftest
          python3 validation/validate_loop_policy.py --selftest
          python3 validation/validate_work_graph.py --selftest
          python3 validation/validate_work_graph.py examples/work-graph-demo
      - name: Budget Contract — экономика scope (selftest + пример budget-demo)
        run: |
          python3 validation/validate_budget_contract.py --selftest
          python3 validation/validate_budget_contract.py examples/budget-demo
      - name: PackageCapabilityScope — least-privilege пакетов (selftest + capability-demo)
        run: |
          python3 validation/validate_capability_scope.py --selftest
          python3 validation/validate_capability_scope.py examples/capability-demo
      - name: AccessFilterPolicy — deny-by-default фильтр до retrieval (selftest + access-filter-demo)
        run: |
          python3 validation/validate_access_filter.py --selftest
          python3 validation/validate_access_filter.py examples/access-filter-demo
      - name: ProviderResidencyPolicy — data-residency/retention (selftest + residency-demo)
        run: |
          python3 validation/validate_provider_residency.py --selftest
          python3 validation/validate_provider_residency.py examples/residency-demo
      - name: Cost accounting — сверка run_cost с BudgetContract (selftest)
        run: python3 tools/cost_account.py --selftest
      - name: Model comparison — safety-first ранжирование моделей (selftest + demo)
        run: |
          python3 tools/model_comparison.py --selftest
          python3 tools/model_comparison.py examples/model-comparison-demo
      - name: Regression corpus — постоянные находки + failure taxonomy (selftest + реальный корпус)
        run: |
          python3 validation/validate_regression_corpus.py --selftest
          python3 validation/validate_regression_corpus.py
      - name: Loop trace — итерации governed-цикла + no-progress detection (selftest + demo)
        run: |
          python3 validation/validate_loop_trace.py --selftest
          python3 validation/validate_loop_trace.py examples/loop-trace-demo
      - name: Integration trace — fan-in + parallel-vs-sequential (selftest + demo)
        run: |
          python3 validation/validate_integration_trace.py --selftest
          python3 validation/validate_integration_trace.py examples/integration-trace-demo
      - name: Post-release readout — доставили->измерили->узнали (selftest + demo)
        run: |
          python3 validation/validate_post_release_readout.py --selftest
          python3 validation/validate_post_release_readout.py examples/readout-demo
      - name: Repository Graph Lite — детерминированный граф репо + impact (selftest, дог-фуд на ките)
        run: python3 tools/repo_graph.py --selftest
      - name: Data classification — авторитетный класс (marker advisory-only) (selftest)
        run: python3 tools/data_classification.py --selftest
      - name: Context retrieval — full-text + budgeted role view + access-filter + cache (selftest)
        run: python3 tools/context_retrieval.py --selftest
      - name: Semantic-lite — TF-IDF fallback без vector-DB (selftest, дог-фуд на ките)
        run: python3 tools/semantic_lite.py --selftest
      - name: Context Engine orchestrator — полная v2-цепочка (mandatory v1 + full-text + graph + semantic + access-filter) (selftest)
        run: python3 tools/context_engine.py --selftest
      - name: Context promotion gate — 5 trust-контрактов перед hybrid (v3.7.0, selftest)
        run: python3 tools/context_promotion_gate.py --selftest
      - name: Context hybrid — mandatory v1 + gated v2-additions (v3.7.0, selftest)
        run: python3 tools/context_hybrid.py --selftest
      - name: Context shadow — ПОЛНАЯ v2-цепочка рядом с боевым v1, child-политики (selftest)
        run: python3 tools/context_shadow.py --selftest
      - name: Retrieval Bench — precision/recall 3 стратегий (selftest)
        run: python3 tools/retrieval_bench.py --selftest
      - name: GateResult v2 runtime — abstain/retry/human-handoff (selftest)
        run: python3 tools/gate_runtime.py --selftest
      - name: Parallel planner — bounded parallel-2 + fan-in решения (selftest + WG-демо)
        run: |
          python3 tools/parallel_planner.py --selftest
          python3 tools/parallel_planner.py examples/work-graph-demo
      - name: Storybook query — минимальный read-only адаптер каталога (selftest)
        run: python3 tools/storybook_query.py --selftest
      - name: UI-evidence collector — реальный UI-CI на точном SHA (v3.7, selftest)
        run: python3 tools/ui_evidence_collect.py --selftest
      - name: Project Detector -> RepositoryProfile (selftest)
        run: python3 tools/project_detector.py --selftest
      - name: Stack-aware evidence collector (selftest)
        run: python3 tools/evidence_collector.py --selftest
      - name: Реестр активных работ + conflict forecast (selftest)
        run: python3 tools/active_work.py --selftest
      - name: Изоляция работы через git worktree (selftest)
        run: python3 tools/worktree.py --selftest
      - name: merge->memory flow (selftest)
        run: python3 tools/merge_memory.py --selftest
      - name: Concurrency preflight — коллизии параллельной работы (selftest)
        run: python3 tools/concurrency_preflight.py --selftest
      - name: Квалификационный прогон-харнесс (selftest, offline)
        run: python3 tools/qual_run.py --selftest
      - name: Python-совместимость (PEP 604 union-аннотации не ломают <3.10)
        run: |
          python3 validation/validate_python_compat.py --selftest
          python3 validation/validate_python_compat.py
      - name: Событийный каталог — согласованность имён (selftest + пример)
        run: |
          python3 validation/validate_event_catalog.py --selftest
          python3 validation/validate_event_catalog.py examples/event-catalog-demo/events.yaml
      - name: Постура безопасности (selftest + evidence-drift)
        run: |
          python3 validation/validate_security_posture.py --selftest
          python3 validation/validate_security_posture.py
      - name: Обязанности постоянного агента (Robin)
        run: |
          python3 validation/validate_duties.py --selftest
          python3 validation/validate_duties.py
      - name: Presets
        run: python3 validation/validate_presets.py
      - name: Eval-кейсы изменённых агентов
        env:
          AI_OPS_DIFF_BASE: ${{ github.event.pull_request.base.sha || '' }}
        run: python3 validation/validate_agent_evals.py
      - name: Eval-кейсы — структура всех + покрытие (selftest + --all)
        run: |
          python3 validation/validate_agent_evals.py --selftest
          python3 validation/validate_agent_evals.py --all
      - name: OpenSpec guard (пример)
        run: python3 validation/validate_openspec_change.py examples/openspec-demo
      - name: Feature Blueprint (selftest + пример)
        run: |
          python3 validation/validate_feature_blueprint.py --selftest
          python3 validation/validate_feature_blueprint.py examples/feature-blueprint-demo/express-checkout
      - name: Кросс-артефактная консистентность (selftest + пример)
        run: |
          python3 validation/validate_cross_artifacts.py --selftest
          python3 validation/validate_cross_artifacts.py examples/feature-blueprint-demo/express-checkout
      - name: Knowledge Graph (selftest + пример)
        run: |
          python3 validation/validate_knowledge_graph.py --selftest
          python3 validation/validate_knowledge_graph.py examples/knowledge-graph-demo/graph.yaml
      - name: Product Health (selftest + пример)
        run: |
          python3 tools/product_health.py --selftest
          python3 tools/product_health.py examples/product-health-demo/input.yaml > /dev/null
      - name: Целостность ссылок пакета (drift-control)
        run: python3 validation/validate_references.py
      - name: Claims (selftest + self-claims кита)
        run: |
          python3 validation/validate_claims.py --selftest
          python3 validation/validate_claims.py
      - name: Свежесть знаний (selftest; context — информационно)
        run: |
          python3 validation/validate_freshness.py --selftest
          python3 validation/validate_freshness.py context > /dev/null
      - name: Реестр решений (selftest + реестр кита)
        run: |
          python3 validation/validate_decisions.py --selftest
          python3 validation/validate_decisions.py
      - name: Синхронность чеклиста AGENTS.md ↔ CI (drift-control)
        run: |
          python3 validation/validate_agents_checklist.py --selftest
          python3 validation/validate_agents_checklist.py
      - name: Границы пакетов 3.0 (selftest + декларации кита)
        run: |
          python3 validation/validate_package_boundaries.py --selftest
          python3 validation/validate_package_boundaries.py
      - name: "Standalone-движок: прогон из .ai/managed без parent-клона (selftest)"
        run: python3 validation/validate_standalone_engine.py --selftest
      - name: "Квалификация: пакет живых сценариев согласован (selftest + декларации)"
        run: |
          python3 validation/validate_qualification.py --selftest
          python3 validation/validate_qualification.py
      - name: "Promotion-квалификация: план v3.6.8 (shadow->hybrid->default, негативы, exit-критерии) (selftest + план)"
        run: |
          python3 validation/validate_promotion_qualification.py --selftest
          python3 validation/validate_promotion_qualification.py
      - name: "Promotion-harness: оффлайн-доказательство матрицы негативов (10/10) + selftest"
        run: |
          python3 tools/promotion_qual.py --selftest
          python3 tools/promotion_qual.py --verify-negatives
      - name: "Стек-квалификация: детект+failure-id на реальных фикстурах python/go (golden+live)"
        run: python3 validation/validate_stack_qualification.py --selftest
      - name: "Product authoring: структурные валидаторы артефактов (selftest)"
        run: |
          python3 validation/validate_requirements_artifact.py --selftest
          python3 validation/validate_plan_artifact.py --selftest
          python3 validation/validate_spec_artifact.py --selftest
      - name: "Container isolation: ассеты jail'а декларируют изоляцию (selftest + проверка)"
        run: |
          python3 validation/validate_container_assets.py --selftest
          python3 validation/validate_container_assets.py
      - name: "Container delivery scope: доставка только ветки текущего прогона (не затирает чужое)"
        run: python3 validation/validate_container_delivery.py
      - name: "Security evidence: детерминированный секрет/dep-скан для гейта security (selftest)"
        run: python3 tools/security_scan.py --selftest
      - name: "Context Compiler: релевантный ContextBundle на WorkItem (selftest + валидатор)"
        run: |
          python3 tools/context_compiler.py --selftest
          python3 validation/validate_context_bundle.py --selftest
      - name: "Adaptive Spec-First: уровень спецификации L0-L3 + SpecCoverage (selftest + валидатор)"
        run: |
          python3 tools/spec_levels.py --selftest
          python3 validation/validate_spec_coverage.py --selftest
      - name: "Context Lifecycle: RunHandoff + resume-preflight (selftest + валидатор)"
        run: |
          python3 tools/run_handoff.py --selftest
          python3 validation/validate_run_handoff.py --selftest
      - name: "Atomic Planning: оценка пакета + декомпозиция по контекстному бюджету (selftest)"
        run: python3 tools/atomic_planner.py --selftest
      - name: "Security Pack: доменный security-вердикт (12 доменов) + валидатор доменов"
        run: |
          python3 tools/security_pack.py --selftest
          python3 validation/validate_security_domains.py --selftest
          python3 validation/validate_security_domains.py
      - name: "Intent-UX: команды намерений + execution preview (selftest)"
        run: python3 tools/ai_ops_cli.py --selftest
      - name: "Context Engineering qualification: Q1-Q10 нового слоя (детерминированно)"
        run: python3 validation/validate_context_qualification.py
      - name: "Product qualification: сквозные гарантии продукта через контроллер (детерминированно)"
        run: python3 validation/validate_product_qualification.py
      - name: "Канонический e2e: ai-ops run --engine pipeline на реальной фикстуре (без модели)"
        run: python3 validation/validate_pipeline_e2e.py --selftest
      - name: "Инсталлер: e2e init + child-валидатор (selftest)"
        run: python3 installer/ai_ops.py --selftest

  # v2.96 Real Qualification: канонический e2e движка на РЕАЛЬНОЙ фикстуре, на нескольких версиях
  # Python (раньше CI гонял только 3.12). Стек-квалификация failure-парсера — тоже здесь.
  pipeline-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install pyyaml
      - name: "Совместимость Python (stdlib + pyyaml)"
        run: python3 validation/validate_python_compat.py
      - name: "Канонический e2e движка (task -> commit -> evidence -> gates, без модели)"
        run: python3 validation/validate_pipeline_e2e.py --selftest
      - name: "Стек-квалификация failure-парсера (golden + live при наличии тулчейна)"
        run: python3 validation/validate_stack_qualification.py --selftest
      - name: "Ядро движка: контроллер + pipeline + broker + security-scan (selftest)"
        run: |
          python3 tools/ai_ops_run.py --selftest
          python3 tools/execution_pipeline.py --selftest
          python3 tools/tool_broker.py --selftest
          python3 tools/security_scan.py --selftest
      - name: "Preflight Truth: проверки до модели + ApprovalRecord (selftest)"
        run: |
          python3 tools/preflight.py --selftest
          python3 tools/approvals.py --selftest
      - name: "Real review intent: read-only ревью ветки (selftest)"
        run: python3 tools/review_branch.py --selftest
      - name: "Sequential WorkPackage Executor: пакет->commit->gates->handoff->следующий (selftest)"
        run: python3 tools/workpackage_executor.py --selftest
      - name: "Research-модуль: схемы, связи RR->EV->DP, freshness, quote-конвенция"
        run: |
          python3 validation/validate_research_artifacts.py --selftest
          python3 validation/validate_research_artifacts.py
          python3 .research/tools/verify_quotes.py --selftest
          python3 .research/tools/freshness_sweep.py --selftest
          python3 .research/tools/ev_scaffold.py --selftest
