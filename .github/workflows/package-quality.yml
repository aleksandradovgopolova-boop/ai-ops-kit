name: package-quality
on:
  # v3.25.1: полный CI НЕ на каждый draft PR — только когда PR готов к review/merge
  pull_request:
    types: [ready_for_review, synchronize]  # ready_for_review = выход из draft; synchronize = новый коммит в non-draft PR
  push:
    branches: [main]
  workflow_dispatch: {}  # ручной запуск перед release

# v3.28.x: команды чеклиста запускаются как `python3 validation/x.py`, и валидаторы делают
# `import _bootstrap` (файл лежит в tools/). На машине разработчика это работает из-за editable-
# установки кита (.pth кладёт tools/ в sys.path ЛЮБОГО процесса) — в чистом окружении CI её нет,
# и валидаторы падали с ModuleNotFoundError. Задаём путь явно, чтобы CI повторял чеклист
# буквально, а не «почти».
env:
  PYTHONPATH: tools:validation

jobs:
  quality:
    # v3.27.3 WP4: не запускаем полный CI для draft PR даже при synchronize
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            script: .github/ci-groups/core.sh
          - group: execution
            script: .github/ci-groups/execution.sh
          - group: quality-product
            script: .github/ci-groups/quality-product.sh
          - group: culture-ops
            script: .github/ci-groups/culture-ops.sh
          - group: context-security
            script: .github/ci-groups/context-security.sh
          - group: validation
            script: .github/ci-groups/validation.sh
          - group: contracts
            script: .github/ci-groups/contracts.sh
    env:
      AI_OPS_DIFF_BASE: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # история нужна eval-гейту для diff изменённых агентов
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # pytest.ini объявляет --cov в addopts: любой запуск pytest без --no-cov требует
      # pytest-cov. Джоб без него падал с «unrecognized arguments: --cov=...» ещё до тестов.
      - run: pip install pyyaml pytest pytest-cov
      - name: "Run ${{ matrix.group }} checks"
        run: bash ${{ matrix.script }}

  # v3.28.0 P3-15: Python 3.9 compatibility — critical path on minimum supported version
  python39-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.9"}
      - run: pip install pyyaml pytest pytest-cov hypothesis
      - name: "Python 3.9 compat check"
        run: python3 validation/validate_python_compat.py
      - name: "Contract tests on 3.9"
        run: python3 -m pytest tests/contracts/ -v --tb=short --no-cov
      - name: "Core selftests on 3.9"
        run: bash .github/ci-groups/core.sh
      - name: "Execution selftests on 3.9"
        run: bash .github/ci-groups/execution.sh

  # v2.96 Real Qualification: канонический e2e движка на РЕАЛЬНОЙ фикстуре, на нескольких версиях
  # Python (раньше CI гонял только 3.12). Стек-квалификация failure-парсера — тоже здесь.
  pipeline-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      # pytest.ini объявляет --cov в addopts: любой запуск pytest без --no-cov требует
      # pytest-cov. Джоб без него падал с «unrecognized arguments: --cov=...» ещё до тестов.
      - run: pip install pyyaml pytest pytest-cov
      - name: "Совместимость Python (stdlib + pyyaml)"
        run: python3 validation/validate_python_compat.py
      - name: "Канонический e2e движка (task -> commit -> evidence -> gates, без модели)"
        run: python3 validation/validate_pipeline_e2e.py --selftest
      - name: "Стек-квалификация failure-парсера (golden + live при наличии тулчейна)"
        run: python3 validation/validate_stack_qualification.py --selftest
      - name: "Ядро движка: контроллер + pipeline + broker + security-scan (selftest)"
        run: |
          python3 tools/ai_ops_run.py --selftest
          python3 tools/execution_pipeline.py --selftest
          python3 tools/tool_broker.py --selftest
          python3 tools/security_scan.py --selftest
      - name: "Preflight Truth: проверки до модели + ApprovalRecord (selftest)"
        run: |
          python3 tools/preflight.py --selftest
          python3 tools/approvals.py --selftest
      - name: "Real review intent: read-only ревью ветки (selftest)"
        run: python3 tools/review_branch.py --selftest
      - name: "Sequential WorkPackage Executor: пакет->commit->gates->handoff->следующий (selftest)"
        run: python3 tools/workpackage_executor.py --selftest
      - name: "Process Contract Tests: 20 pytest-тестов доказывают инварианты процессов (WP2-WP5)"
        run: python3 -m pytest tests/contracts/ -v --tb=short
      - name: "Research-модуль: схемы, связи RR->EV->DP, freshness, quote-конвенция"
        run: |
          python3 validation/validate_research_artifacts.py --selftest
          python3 validation/validate_research_artifacts.py
          python3 .research/tools/verify_quotes.py --selftest
          python3 .research/tools/freshness_sweep.py --selftest
          python3 .research/tools/ev_scaffold.py --selftest
