# Разбор импортов JS/TS синтаксическим деревом (#1408) с УСТАНОВЛЕННОЙ грамматикой. Без этого
# прогона тесты дерева всегда пропускались бы: tree-sitter — опциональный пакет, обычные группы CI
# его не ставят. Признак AI_OPS_JSTS_AST=1 превращает отсутствие грамматики в провал, а не в skip.
# Версии — те, на которых снят замер docs/evidence/1408-jsts-ast/README.md.
# В обязательные проверки ветки не входит: сделать обязательным — решение владельца.
name: jsts-ast
on:
  pull_request:
    paths: ['ai_ops_kit/context/js_imports.py', 'ai_ops_kit/planning/architecture_invariants.py', 'ai_ops_kit/planning/governance_report.py', 'ai_ops_kit/devtools/jsts_import_compare.py', 'tests/unit/test_js_imports.py', 'tests/unit/test_architecture_invariants.py', 'schemas/architecture-invariants.schema.json', '.github/workflows/jsts-ast.yml']
  push:
    branches: [main]
    paths: ['ai_ops_kit/context/js_imports.py', 'ai_ops_kit/planning/architecture_invariants.py', 'ai_ops_kit/planning/governance_report.py', 'ai_ops_kit/devtools/jsts_import_compare.py', 'tests/unit/test_js_imports.py', 'tests/unit/test_architecture_invariants.py', 'schemas/architecture-invariants.schema.json', '.github/workflows/jsts-ast.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: jsts-ast-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  jsts-ast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version-file: .python-version}
      - run: pip install 'pyyaml==6.*' 'pytest==9.*' 'hypothesis==6.*' 'tree-sitter==0.25.2' 'tree-sitter-javascript==0.25.0' 'tree-sitter-typescript==0.23.2'
      - name: Тесты разбора деревом — с грамматикой, без права на skip
        env:
          AI_OPS_JSTS_AST: "1"
        run: python3 -m pytest tests/unit/test_js_imports.py tests/unit/test_architecture_invariants.py -v --tb=short
