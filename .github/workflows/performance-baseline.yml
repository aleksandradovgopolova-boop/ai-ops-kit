# Гейт скорости и памяти кита (#1409), схема принята владельцем 18.11.2026.
#   Время  — парой: база (последний выпуск) и кандидат по очереди на ОДНОЙ машине в ОДНОМ прогоне.
#            Между машинами GitHub то же время различается до 1,73×, сохранённой базе времени верить нельзя.
#   Память — против принятой базы в репозитории, окружение сверяется по устойчивым полям.
#   Порог 1,2 для обеих частей; регрессия или «сравнить нельзя» делает прогон красным.
# Где запускается: вручную и раз в ночь по main. НЕ обязательная проверка PR — обязательность
# решается после нескольких недель без ложных срабатываний.
name: performance-baseline
on:
  schedule:
    - cron: "47 4 * * *"   # ежедневно ~04:47 UTC, со сдвигом от nightly-quality 03:37
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Полный SHA кандидата; пусто — текущий commit ветки запуска'
        required: false
        type: string
      base_sha:
        description: 'Полный SHA базы; пусто — последний выпуск (тег vX.Y.Z), достижимый из кандидата'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: performance-baseline
  cancel-in-progress: false
jobs:
  paired-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
      EVIDENCE: qualification/evidence/performance-baseline-1409
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Выбрать базу и кандидата
        id: pick
        working-directory: candidate
        env:
          INPUT_CANDIDATE: ${{ inputs.candidate_sha }}
          INPUT_BASE: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          candidate="${INPUT_CANDIDATE:-$GITHUB_SHA}"
          if [ -n "$INPUT_BASE" ]; then
            base="$INPUT_BASE"
          else
            # Кандидат сам на теге выпуска — база предыдущий выпуск, а не он сам.
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$candidate^")"
            base="$(git rev-list -n 1 "$tag")"
          fi
          for sha in "$candidate" "$base"; do
            if ! printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
              echo "::error::нужен полный SHA, получено: $sha"; exit 2
            fi
            git cat-file -e "$sha^{commit}"
          done
          [ "$base" != "$candidate" ] || { echo "::error::база совпадает с кандидатом"; exit 2; }
          [ "$(git rev-parse HEAD)" = "$candidate" ] || { echo "::error::checkout не на кандидате"; exit 2; }
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Отдельная рабочая копия базы
        working-directory: candidate
        env:
          BASE_SHA: ${{ steps.pick.outputs.base }}
        run: git worktree add --detach "$GITHUB_WORKSPACE/base" "$BASE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Существующий toolchain CI
        run: pip install 'pyyaml==6.*' 'pytest==9.*' 'pytest-xdist==3.*' 'hypothesis==6.*' 'ruff==0.17.4'
      - name: База и кандидат на одной машине под одной lease
        working-directory: candidate
        env:
          BASE_SHA: ${{ steps.pick.outputs.base }}
          CANDIDATE_SHA: ${{ steps.pick.outputs.candidate }}
        run: |
          python3 -m ai_ops_kit.devtools.host_resource_cli --owner "ci-perf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -- \
            python3 -m ai_ops_kit.devtools.perf_gate pair \
              --suite "$EVIDENCE/suite.json" \
              --memory-baseline "$EVIDENCE/accepted-memory-baseline.json" \
              --base-root "$GITHUB_WORKSPACE/base" --base-sha "$BASE_SHA" \
              --candidate-root . --candidate-sha "$CANDIDATE_SHA" \
              --iterations 3 --warmup 1 --threshold 1.2 --out "$RUNNER_TEMP/performance-gate"
      - name: Сохранить квитанции даже при отказе
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-gate
          if-no-files-found: warn
          retention-days: 14
