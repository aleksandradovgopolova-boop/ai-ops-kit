# Сгенерировано AI Ops (nightly_review.install_schedule). Правьте cron через
# `--install-schedule --cron ...` или .ai-ops.yaml (nightly.schedule).
name: nightly-product-review
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install pyyaml
      - name: Ночной дельта-обзор и бриф владельцу
        env: {PYTHONPATH: "."}
        run: python ai_ops_kit/intelligence/nightly_review.py . --deliver | tee -a "$GITHUB_STEP_SUMMARY"
