# PR Smoke — быстрый CI для pull requests (v3.25.0 Verification Foundation)
# Запускается на каждый PR, проверяет критический путь (~2 мин).
# Полные проверки — в package-quality.yml на main/release.

name: pr-smoke
on:
  pull_request:
    branches: [main]

# v3.28.x: команды чеклиста запускаются как `python3 validation/x.py`, и валидаторы делают
# `import _bootstrap` (файл лежит в tools/). На машине разработчика это работает из-за editable-
# установки кита (.pth кладёт tools/ в sys.path ЛЮБОГО процесса) — в чистом окружении CI её нет,
# и валидаторы падали с ModuleNotFoundError. Задаём путь явно, чтобы CI повторял чеклист
# буквально, а не «почти».
env:
  # Пути АБСОЛЮТНЫЕ: относительный PYTHONPATH разрешается от cwd процесса, а селфтест
  # инсталлятора порождает подпроцессы с cwd в child-репозитории — там нет ни tools/,
  # ни validation/, и `tools:validation` молча перестаёт работать.
  PYTHONPATH: ${{ github.workspace }}/tools:${{ github.workspace }}/validation

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # pytest.ini объявляет --cov в addopts: любой запуск pytest без --no-cov требует
      # pytest-cov. Джоб без него падал с «unrecognized arguments: --cov=...» ещё до тестов.
      - run: pip install pyyaml pytest pytest-cov hypothesis

      - name: Pytest — critical path + contracts
        run: |
          python3 -m pytest tests/contracts/ -v -m critical_path --tb=short

      - name: Pytest — selftest wrappers (critical modules)
        run: |
          # v3.28.x: обёртки селфтестов давно параметризованы — это test_selftest_runs_clean[<файл>],
          # а не test_selftest_<модуль>. Прежний -k не совпадал ни с одним именем: pytest выбирал
          # 0 тестов и отдавал код 5, то есть шаг «проверил» ровно ничего на каждом PR.
          python3 -m pytest tests/ -v --tb=short --no-cov -k "test_selftest_runs_clean and (orchestrator.py or execution_pipeline.py or preflight.py or tool_broker.py or gate_executor.py or ai_ops_run.py or ai_ops_cli.py)"

      - name: Key validators
        run: |
          python3 validation/validate_ai_first_registry.py
          python3 validation/validate_ai_first_workflows.py
          python3 validation/validate_release_claims.py
