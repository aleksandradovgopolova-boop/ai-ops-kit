# PR Smoke — быстрый CI для pull requests (v3.25.0 Verification Foundation)
# Запускается на каждый PR, проверяет критический путь (~2 мин).
# Полные проверки — в package-quality.yml на main/release.

name: pr-smoke
on:
  pull_request:
    branches: [main]
  # v3.38 (merge-queue-not-handrolled): `smoke` — обязательный контекст защиты main; без этого
  # триггера очередь слияния ждала бы его вечно (в merge_group событие pull_request не приходит).
  merge_group:

# Lane A1: минимальные привилегии — workflow получает только чтение контента.
permissions:
  contents: read

# v3.31: PYTHONPATH здесь БОЛЬШЕ НЕТ — см. пояснение в package-quality.yml. Коротко: пояс прятал
# дефект импорта в валидаторах, из-за которого кит не запускался в child-репозитории при зелёном
# CI. Причина устранена в коде (validation/_bootstrap.py); CI видит окружение пользователя.
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # 2026-08-12: pytest-cov здесь больше не нужен — `--cov` ушёл из addopts pytest.ini в
      # отдельную джобу `coverage` (package-quality.yml), где у покрытия есть порог. Прежде
      # addopts требовал пакет от ЛЮБОГО запуска, и джобы падали с «unrecognized arguments».
      - run: pip install pyyaml pytest hypothesis

      # ЗАГОЛОВОК PR — ЭТО ТЕМА БУДУЩЕГО КОММИТА. Замер 20.08.2026: PR #211 влит squash'ем, и его
      # человекочитаемый заголовок стал темой коммита на main. `cz check` в ветке смотрел коммиты
      # ВЕТКИ, где всё было по формату, и о заголовке не знал ничего; после мержа main покраснел, а
      # переписать защищённую ветку нельзя.
      #
      # Проверка идёт ЧЕРЕЗ PYTEST, а не строкой в workflow: инвариант кита — проверка обязана быть
      # запускаемой локально и покрытой пробами. Первая редакция этой правки нарушила его инлайновым
      # python-скриптом, и собственный контур её на этом поймал.
      - name: "заголовок PR — тема будущего коммита, формат обязателен"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_TITLE_CHECK: "1"   # признак «ворота запущены» ставит ТОТ, КТО ЗОВЁТ
        run: python3 -m pytest tests/contracts/test_pr_title_is_conventional.py -q

      - name: Pytest — critical path + contracts
        run: |
          python3 -m pytest tests/contracts/ -v -m critical_path --tb=short

      - name: Pytest — critical modules (granular)
        run: |
          # Прополка (2026-08-25): монолитные `*_selftest` этих модулей заменены гранулярными
          # тестами (одно поведение = один тест). Smoke-слой теперь гоняет сами гранулярные файлы —
          # то же покрытие, но диагностируемое пофайлово и пофункционально. `-m "not slow"` держит
          # smoke быстрым (тяжёлые агрегатные прогоны идут в отдельной slow-джобе selftests-a/m).
          # Прежний `-k` по именам селфтестов после снятия монолитов осиротел бы (0 тестов, код 5).
          python3 -m pytest -v --tb=short -m "not slow" \
            tests/unit/test_orchestrator.py \
            tests/unit/test_execution_pipeline.py \
            tests/unit/test_preflight.py \
            tests/unit/test_tool_broker.py \
            tests/unit/test_gate_executor.py \
            tests/unit/test_ai_ops_run.py \
            tests/unit/test_ai_ops_cli.py

