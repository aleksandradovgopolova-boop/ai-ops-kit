# capabilities.yaml — реестр CAPABILITY UI/UX-системы (данные, не проза).
# Волна 2 (#418). Объявляет, какие СИСТЕМНЫЕ возможности гарантирует стандарт (темизация,
# доступность, клавиатура, полнота состояний, адаптив, движение, локализация). Это ортогонально
# каталогу компонентов/паттернов/шаблонов: capability — сквозное свойство, которое опирается на
# правила Конституции, пространства токенов (tokens.yaml) и конкретные компоненты/паттерны.
# Валидатор сверяет каждую запись:
#   * constitution_refs -> должны быть в rules.yaml (иначе dangling_rule_ref);
#   * token_namespaces  -> должны быть объявлены в tokens.yaml (иначе dangling_namespace);
#   * tokens            -> должны существовать в design/tokens (иначе dangling_token);
#   * backed_by         -> id реального компонента/паттерна/шаблона (иначе dangling_local).
version: '1.0'
kind: capabilities
note: 'Сквозные возможности системы. Каждая опирается на правила Конституции и на токены/компоненты
  по id — заявка проверяема, а не декларативна.'
entries:
- id: cap.tokenized-visuals
  name: Токенизация визуальных решений
  status: guaranteed
  summary: Все визуальные решения собираются из токенов, а не изобретаются (единый источник истины).
  constitution_refs:
  - UI-014
  - UI-012
  - AI-002
  - AI-004
  token_namespaces:
  - spacing
  - radius
  - color
  - text
  - shadow
  - control
  backed_by:
  - comp.button
  - comp.card
  - comp.input
- id: cap.theming
  name: Темизация (light/dark, перекраска бренда)
  status: guaranteed
  summary: Смена темы или бренда переопределяет один semantic-слой цвета; id ролей стабильны.
  constitution_refs:
  - UI-014
  - UI-004
  - UI-013
  token_namespaces:
  - color
  - shadow
  tokens:
  - color.bg.canvas
  - color.text.primary
  backed_by:
  - comp.card
  - comp.button
  - comp.modal
- id: cap.accessibility-aa
  name: Доступность WCAG 2.2 AA
  status: guaranteed
  summary: Контраст и видимость фокуса на базовом уровне; доступность не «улучшение», а норма.
  constitution_refs:
  - UI-025
  - UI-029
  - UI-040
  token_namespaces:
  - color
  tokens:
  - color.focus.ring
  - color.text.primary
  backed_by:
  - comp.input
  - comp.button
  - comp.data-table
- id: cap.keyboard-operable
  name: Клавиатурная управляемость
  status: guaranteed
  summary: Любой интерактивный элемент достижим и управляем с клавиатуры, фокус виден.
  constitution_refs:
  - UI-026
  - UI-029
  token_namespaces:
  - color
  tokens:
  - color.focus.ring
  backed_by:
  - comp.button
  - comp.select
  - comp.modal
- id: cap.non-color-signaling
  name: Сигнал не только цветом
  status: guaranteed
  summary: Состояние/значение передаётся текстом или иконкой, а не одним цветом.
  constitution_refs:
  - UI-027
  token_namespaces:
  - icon
  - text
  backed_by:
  - comp.badge
  - comp.toast
- id: cap.state-completeness
  name: Полнота состояний данных
  status: guaranteed
  summary: Загрузка, пустое, ошибка и наполненное — состояния первого класса, а не happy path.
  constitution_refs:
  - UI-032
  - UI-035
  - UI-036
  - UI-037
  - AI-003
  backed_by:
  - comp.data-table
  - comp.empty-state
  - comp.toast
- id: cap.responsive
  name: Адаптивность и reflow
  status: guaranteed
  summary: Адаптируется опыт, а не только вьюпорт; устойчивость к масштабированию и reflow.
  constitution_refs:
  - UI-033
  - UI-030
  token_namespaces:
  - breakpoint
  - spacing
  backed_by:
  - tpl.dashboard
  - tpl.list
- id: cap.purposeful-motion
  name: Осмысленное движение и reduced-motion
  status: guaranteed
  summary: Движение сообщает изменение; prefers-reduced-motion сводит анимации к мгновенным.
  constitution_refs:
  - UI-034
  token_namespaces:
  - duration
  - ease
  tokens:
  - duration.base
  backed_by:
  - comp.toast
  - comp.modal
- id: cap.localization
  name: Язык интерфейса как часть интерфейса
  status: guaranteed
  summary: Действия названы действиями, без языка реализации; текст проектируется, а не переводится позже.
  constitution_refs:
  - UI-022
  - UI-023
  - UI-024
  token_namespaces:
  - text
  backed_by:
  - comp.button
  - comp.empty-state
- id: cap.destructive-protection
  name: Защита деструктивных действий
  status: guaranteed
  summary: Риск определяет трение; деструктивные действия защищены подтверждением.
  constitution_refs:
  - UI-018
  - UI-039
  backed_by:
  - pat.approval
  - comp.modal
  - comp.button
