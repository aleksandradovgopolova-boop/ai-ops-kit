# registry/release-notes.yaml — релизная проза кита. ОТДЕЛЬНЫЙ файл, и это замер, а не вкус.
#
# ПОВОД (аудит 20.08.2026, работа `release-claims-stays-in-the-kit`). `registry/release-claims.yaml`
# едет в КАЖДЫЙ подключённый репозиторий по шаблону `registry/*.yaml`, и весил 82 214 Б. Разбор по
# ключам: `patch_note` — 61 336 Б, то есть 75% файла одной строкой на 37 080 символов. В дочке этот
# ключ не читает НИКТО: его смотрит только `validate_release_claims`, а он не входит в
# `RUNTIME_VALIDATORS` и в поставку не едет.
#
# ПОЧЕМУ НЕ УБРАЛИ ФАЙЛ ЦЕЛИКОМ. У него есть настоящий потребитель в дочке, и это опровергает
# первоначальный замер («кодом там не читается»): `installer.package_channel` читает
# `release-claims.yaml -> channel` и зовётся из `init`, `update` и `doctor`, чтобы сказать человеку,
# заработал ли пакет тот канал, который просит его репозиторий. Читается ОДИН ключ на 18 байт.
# Поэтому уехал не файл, а его балласт.
#
# ЧТО ОСТАЛОСЬ ПРОВЕРЯЕМЫМ. Правило «заявление о полноте называет охват» (`validate_release_claims`
# -> evidence_scopes) читает `patch_note` ЗДЕСЬ. Версия дублируется намеренно и сверяется тем же
# валидатором: без сверки два файла разъехались бы молча, и проза относилась бы к другому выпуску.
schema_version: 1
registry_type: release-notes
patch_note: '3.39.0 — Судья приёмки: кит сам сверяет met с доставленным файлом (Fix C). Замер шести
  живых прогонов показал: независимый судья выносит корректный вердикт прямо из диффа, но чтение файла
  отдельным шагом не делает — и прежний страж обнулял такой вердикт как рубер-штамп, из-за чего чистая
  авто-приёмка была недостижима. Теперь авторитетное чтение доставленного файла делает сам кит и
  подтверждает цитату по эталону; страж переопределён строже — «выполнено», чья цитата есть в диффе,
  но нет в доставленном файле, больше не проходит. writer≠judge цел: смысловой вердикт остаётся у
  независимого судьи. Снимает последний технический барьер к авто-DeliveryReceipt на пути к stable.
  — Ранее: 3.38.0 — Product Operating System замкнута 5/5. Капстоун `ai-ops replan` (автономное
  перепланирование) и `ai-ops backlog merge` (approval-gated слияние дублей). Все пять целей продуктовой
  ОС достигнуты; остался owner-led второй полевой прогон.
  — Ранее: 3.36.10 — Field Findings. Патч выпущен потому, что у подключённых репозиториев был тег, в
  котором нет ни одной правки, лечащей именно их; все находки пришли ИЗ ПОЛЯ, а не из чтения кода. F-022
  (P1): `parent.update_policy` обязателен по схеме, объявлен `silent_update: forbidden` и обещан владельцу
