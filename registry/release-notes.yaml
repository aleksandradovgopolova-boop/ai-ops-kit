  НА МЕСТЕ посреди продуктовой задачи. Теперь локальный `update` применяет обновление в отдельном worktree
  на ветке `ai-ops/update-v<версия>`, дерево владельца не трогается; CI-путь сохранён явным `--in-place`.
  F-024 (P2): опт-аут `ai-ops-record.yml`, объявленный в шапке файла дословно, не держался — удалённый
  шаблон возвращался на первом же `update`, и кит возвращал владельцу расход (рекордер коммитит на каждый
  push и жжёт общие минуты Actions), от которого тот отказался по инструкции кита; отпечатки теперь различают
  «не ставили» и «удалил владелец». F-025 (P2, issue #19): свой байткод объявлялся правкой владельца,
  и CI ребёнка краснел с «managed-слой изменён вручную» — ложный красный из СВОИХ артефактов; причина
  была в двух реализациях одного вопроса (`detect_drift` исключал, сканер нет), добавлен охранник на расхождение.
  F-021 часть 2: вторая ветка записи ответов онбординга тоже уничтожала данные — первое исправление было
  неполным, это нашла живая квалификация. F-026: числа в документах проверялись только в README, поэтому
  три документа говорили 32 при фактических 34 при зелёном CLAIMS-OK; охват 1 -> 5. F-027: заготовка контекста
  считалась заполненностью (`is_file()`), и собственные ProductStatus/now кита лежали шаблонами при CONTEXT-COMPLETE
  — это F-018 в другой подсистеме; оба документа заполнены замерами, Own Medicine проверяется тестом.
  Доказательство 3.36.10: охват full-current-python (CPython 3.14/darwin) — 1919 passed, 11 skipped; охват
  compatibility-matrix — CI, 11 проверок зелёные на каждом из PR #85-#88. ГРАНИЦА: второй живой brownfield
  до verified PR НЕ пройден. 3.36.9 — Own Medicine. Кит не применял к себе того, что требует от дочек.
  F-020 (P1): `templates/ci/ai-ops-record.yml` коммитил снимок эффекта с `[skip ci]`, и когда этот коммит
  оказывался вершиной ветки, GitHub гасил ВСЕ проверки PR дочки — «no checks reported», то есть ветка
