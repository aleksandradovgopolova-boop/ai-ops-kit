# registry/release-notes.yaml — релизная проза кита. ОТДЕЛЬНЫЙ файл, и это замер, а не вкус.
#
# ПОВОД (аудит 20.08.2026, работа `release-claims-stays-in-the-kit`). `registry/release-claims.yaml`
# едет в КАЖДЫЙ подключённый репозиторий по шаблону `registry/*.yaml`, и весил 82 214 Б. Разбор по
# ключам: `patch_note` — 61 336 Б, то есть 75% файла одной строкой на 37 080 символов. В дочке этот
# ключ не читает НИКТО: его смотрит только `validate_release_claims`, а он не входит в
# `RUNTIME_VALIDATORS` и в поставку не едет.
#
# ПОЧЕМУ НЕ УБРАЛИ ФАЙЛ ЦЕЛИКОМ. У него есть настоящий потребитель в дочке, и это опровергает
# первоначальный замер («кодом там не читается»): `installer.package_channel` читает
# `release-claims.yaml -> channel` и зовётся из `init`, `update` и `doctor`, чтобы сказать человеку,
# заработал ли пакет тот канал, который просит его репозиторий. Читается ОДИН ключ на 18 байт.
# Поэтому уехал не файл, а его балласт.
#
# ЧТО ОСТАЛОСЬ ПРОВЕРЯЕМЫМ. Правило «заявление о полноте называет охват» (`validate_release_claims`
# -> evidence_scopes) читает `patch_note` ЗДЕСЬ. Версия дублируется намеренно и сверяется тем же
# валидатором: без сверки два файла разъехались бы молча, и проза относилась бы к другому выпуску.
schema_version: 1
registry_type: release-notes
patch_note: '4.3.1 — Канал `stable` заработан на минорe 4.3: два полевых подтверждения обкатки на живых дочках (ai-ops-cockpit и ai-ops-live-587) переводят пакет qualification → stable. Функциональных изменений кода нет — это административное объявление заработанного канала.'
version: 4.3.2