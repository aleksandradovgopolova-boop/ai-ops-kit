  проверка поймала настоящее заявление в patch_note 3.33.2. Доказательство 3.34: охват full-current-python
  (CPython 3.9.6/darwin) — 1467 passed, 6 skipped; check-clean-install — 170/170 модулей, child зелёный;
  охват compatibility-matrix — CI. 3.33.3 — 3.33.1 убрал из setup.py запись .pth-пояса в site-packages,
  но пояса, уже написанные на машинах, никуда не делись: файл лежит вне репозитория и вне учёта pip, поэтому
  ни обновление пакета, ни git pull его не касаются. Замерено, что он прятал: test_missing_bootstrap_is_caught
  копирует репозиторий, удаляет там validation/_bootstrap.py и ждёт ModuleNotFoundError — с поясом импорт
  находил _bootstrap в НАСТОЯЩЕМ репозитории, и fail-closed-проверка теряла зубы, оставаясь зелёной; переменной
  среды это не снять, .pth исполняется до первой строки кода. ai-ops doctor получил проверку гигиены путей
  первой строкой и БЛОКИРУЮЩУЮ: если окружение врёт, всё напечатанное ниже ничего не доказывает. Различаются
  два происхождения с разным лечением — path_belt (blocking, писал сам кит, pip его не заберёт: файла
  нет в RECORD) и editable_in_user_site (advisory, снимает pip); editable в venv находкой не считается.
  Пояс отличается от установки ХОЗЯИНОМ файла, а не формой содержимого: editable в режиме editable_mode=compat
  пишет обычную строку пути, ровно как пояс, поэтому файлы из RECORD и названные по схеме setuptools под
  удаление не попадают никогда. Граница проверки объявлена в отчёте (scan_limits), а «ни один каталог
  не просмотрен» даёт статус unknown, а не clean: не знаю не выдаётся за чисто. Подчищать автоматически
  решено НЕ будем и это объявлено границей: pip не может (нет хука uninstall и файла в RECORD), installer
  не должен (молча удалять файлы вне своего окружения — тот же дефект, что молча их писать, именно эта
  вольность пояс и создала); лечение явное — doctor --remove-path-belt. Контуры проверки предупреждают
  о поясе ДО прогона, а check-clean-install доказывает снимком до/после, что установка пояса не пишет.
  3.33.2 — закрыты три долга, до сих пор значившиеся «известно и не запрещено». (1) test_execution_pipeline_selftest
  был зелёным ОТ ВЕРСИИ GIT: он неявно зависел от того, переживёт ли каталог src/ переключение веток,
  а git не хранит пустые каталоги; локально (2.43) исчезал, в CI (2.54) переживал. Крах прятал второе
  падение — реальное: _change_context усекает дифф на 12000 символов, коммит распухал от артефактов прогонов,
  и ТЕЛО правки в контекст ревьюера не попадало. Продуктового дефекта за этим нет: реальный прогон с изоляцией
  коммитит ровно изменённый файл (замерено). (2) Родовые имена tools и validation в site-packages объявлены
  standing boundary с ратчетом на состав top-level имён: убрать их нельзя, пока код зовёт валидаторов
  по плоскому имени, а честное решение — перенос validation/ под ai_ops_kit/ — отдельный срез. (3) Инвариант
  трёх колец СТАЛ проверяемым: аналитика (product_health, effect_metrics, evolution_triggers) вынесена
  в пакет intelligence слоем выше ядра, зависимость вверх запрещена. Перенос безопасен по замеру — эти
  модули не импортировал никто; кольцо соблюдалось де-факто, не хватало границы. Инвариант односторонний:
  intelligence вправе читать ядро, это закреплено отдельным тестом. unverifiable_today пуст, verified_invariants
  не пуст, оба факта проверяются. Полный контур зелёный целиком впервые с 3.30.0. 3.33.1 — ХОТФИКС: заявление
  3.33.0 было доказано ИМИТАЦИЕЙ sys.path, и настоящий pip install тут же показал сломанный модуль и причину,
  по которой такие поломки не видны. setup.py на уровне модуля писал .pth в site-packages ПОЛЬЗОВАТЕЛЯ,
  подкладывая корень, tools/ и validation/ в каждый процесс Python на машине: файл писался даже при установке
  в venv, путь зашивался абсолютный от каталога сборки, а главное — это и есть пояс, прячущий дефекты,
  который репозиторий весь август чинил в других местах и ставил себе сам на любом pip install. Убрано;
  пути кит находит в рантайме по маркеру VERSION, проверено установкой в venv (95 модулей из 95). Девять
  модулей звали валидаторов по плоскому имени, не положив пути, — восемь работали случайно, за счёт соседа.
  Проверка 3.33.0 имела ту же дыру, что и код: импортировала все 95 модулей в ОДНОМ процессе, и первый
  же чинил sys.path за остальных; теперь процесс на модуль. В clean-install добавлен шаг с настоящим pip
  install — прежде дистрибутив не проверялся вовсе. 3.33.0 — вторая половина переезда: 257 внутренних
  импортов переведены с плоских имён на пакетные, и по дороге выяснилось, что пакет не импортировался
  КАК ПАКЕТ: с одним корнем на sys.path (то есть после pip install) любой модуль падал с ModuleNotFoundError
  по _bootstrap, потому что shared/_bootstrap был алиасом и искал плоский модуль в tools/. Теперь ищет
  корень маркером VERSION; проверка ставит sys.path в состояние пользователя, выбрасывая всё внутри репозитория.
  Формы импорта сохранены буквально (import X -> from ai_ops_kit.<пакет> import X): при 119 циклах форма
  from ... import name требует полностью инициализированного модуля. Две проверки ослепли на новой форме
  и это поймано: validate_layering видел 4 ребра из 49, repo_graph снова терял импортёров в --impact.
  3.32.0 — границы 12 пакетов перестали быть только именами: validate_layering считает граф импортов по
  коду (плоские и пакетные имена) и сверяет с packages/layering.yaml. Слои: foundation (shared) -> primitives
  (security, ui) -> capabilities (ядро) -> entrypoints (cli, devtools). Честная граница первого шага:
  запрещено то, что сегодня не нарушено и должно таким остаться (security/ui выше фундамента, зависимости
  у shared, импорт cli/devtools, продуктовый код -> devtools); взаимные связи ВНУТРИ ядра не запрещены
  — замер 9 взаимных пар и 119 циклов, строгий DAG покраснел бы на всём сразу и его бы выключили. Реестр
  исключений вправе только сокращаться: протухшее разрешение ловится тестом. Инвариант трёх колец объявлен
  НЕПРОВЕРЯЕМЫМ сегодня и записан как таковой: lifecycle держит и ядро, и аналитику. 3.31.1 — ХОТФИКС
  к 3.31.0: переезд в пакеты сделал молчаливым no-op ВСЕ 94 точки входа. Алиас делал sys.modules[__name__]
  = _target, то есть при запуске скриптом подменял собой __main__ — main-guard в цели не срабатывал, скрипт
  не делал ничего и возвращал 0. Под ударом весь командный слой child-репозитория (/ai-start-task гоняет
  tools/run_plan.py, workitem.py, worktree.py, active_work.py). Запуск скриптом идёт через runpy, критерий
  проверки — непустой вывод, а НЕ rc=0: именно ноль дефект и пережил. Вторым закрыт разрыв поставки: validation/_bootstrap.py
  из 3.31.0 не попадал в child (белый список перечисляет валидаторы, а это их загрузчик) — уехавшие валидаторы
  падали на первой строке. Добавлен прогон установки в чистом окружении (scripts/check-clean-install.sh
  + джоба CI, где стоит только pyyaml): кит проверяется там, где нет ни кита, ни pytest, ни PYTHONPATH.
  3.31.0 — код движка переехал в ai_ops_kit/* (95 модулей, 12 пакетов); плоские имена остались алиасами
  через sys.modules — ОДИН объект модуля, поэтому 661 импорт и входные точки doctor не тронуты. Вынос
  selftest из продакшн-модулей ЗАВЕРШЁН (в 3.30.0 был пилот): 26% -> 0, продакшн 49 227 -> 24 669 строк,
  поставка 3.01 -> 2.52 МиБ. Контур проверки сведён к одной команде ./scripts/check-full.sh: чеклист 205
  -> 0 команд, группы CI 7 -> 4, быстрый цикл 4:40 -> 1:03. Переезд поймал две регрессии, невидимые быстрому
  профилю: загрузка модулей ПО ПУТИ обходит подмену sys.modules, а repo_graph сканировал только tools/
  и терял реальных импортёров в --impact. Отдельно закрыт дефект, который CI не видел: десять validation/*.py
  делали голый import _bootstrap, резолвившийся только через PYTHONPATH из workflow или editable-установку
  — в свежем child-репозитории валидатор падал с ModuleNotFoundError; проверка на это чистит PYTHONPATH,
  иначе она проверяла бы среду, а не код. Гейт regression_test_evidence остаётся advisory — переключение
  в blocking после живого раунда.'
