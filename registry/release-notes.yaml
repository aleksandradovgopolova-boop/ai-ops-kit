  ЦЕЛИКОМ шестью срезами: R-33 (P1) `_scrub_output` при сбое отдавал НЕСКРАБЛЕННЫЙ вывод в evidence; R-34
  (P1) `derive_status` объявляла `done` при неоценённом blueprint; R-35 (P2) исправление R-26 стояло на
  пути исключения, которого почти не бывает — `journal_append` возвращает `{ok: false}`, и его не читал
  ни один из 11 вызовов; R-36 (P3) выключенная проверка id гейта. Координация сессий: `commit_policy.check_commit`
  жил с v3.19.0 и не запускался нигде — подключён хуком `commit-contract`; реестр активных работ переведён
  на путь, общий для всех worktree. ЗАПИСАНО И НЕ ИСПРАВЛЕНО — F-022 (P1): `parent.update_policy` обязателен
  по схеме, объявлен `silent_update: forbidden`, обещан владельцу вслух при установке — и не читается
  ни одной строкой кода; решение владельца, план `update-policy-enforcement`. Доказательство 3.36.9: охват
  full-current-python (CPython 3.14/darwin) — 1899 passed, 11 skipped; охват compatibility-matrix — CI,
  все 11 проверок зелёные на PR #77. 3.36.7 — Clean Update. Обновление убирает своё старьё даже тогда,
  когда миграция перенесла его в другой каталог. Найдено взглядом на `git diff --stat` перед передачей
  обновления в ии-среду: удалялись 47 валидаторов кита, 8152 строки. Они приехали к ребёнку с 3.7.3, когда
  в поставку шло всё, должны были уйти при обновлении до 3.36.4 — и уцелели; вычистило их только СЛЕДУЮЩЕЕ
  обновление. Причина в порядке шагов, а не в строке: `build_diff()` считал удаление, затем миграция 3.33->3.34
  переносила `validation/` в `ai_ops_kit/validation/`, и удаление шло по путям, которых уже нет. Копия
  по новому пути оставалась навсегда и вдобавок попадала под контроль целостности как managed — ребёнок
  носил мёртвый груз, который кит считал своим. Теперь диф пересчитывается ПОСЛЕ цепочки миграций; первый
  остаётся ровно для решения «есть ли что делать», иначе кит делал бы бэкап и гонял миграции там, где
  делать нечего. В отчёт идёт применённое, а не запланированное. Тест воспроизводит настоящий сценарий:
  файл кладётся по старому пути, РЕАЛЬНАЯ миграция его переносит, и после одного `update` его нет ни там,
  ни там; порядок дополнительно закреплён разбором, чтобы следующая миграция с переносом не повторила
  это молча; отдельный страж следит, что уборка не выносит `_bootstrap.py` — без него уехавшие валидаторы
  умирают на первой строке. Доказательство 3.36.7: охват full-current-python (CPython 3.9.6/darwin) —
  1832 passed, 6 skipped; охват compatibility-matrix — CI. Поле: PR #447 в ии-среде (3.36.4 -> 3.36.6)
  — все восемь проверок зелёные, включая `ai-ops`. 3.36.6 — Delivery Proof Debt. Ловушка обновления, найденная
  на ии-среде при back-fill: правило «`released` требует SHA-verified DeliveryReceipt» появилось в 3.27.4,
  и любой репозиторий, выпускавший функции раньше, при обновлении получает красный CI, который нечем закрыть.
  `sha_verified` ставится ТОЛЬКО сверкой записанного DeliveryIntent с remote (репозиторий, head_sha, base_ref),
  а для функций, выпущенных до требования, интента не существует. У ии-среды так встали 5 функций из 8
  — при том что функции реально в проде. Мы ввели блокирующее правило и не подумали о тех, кто уже живёт
  с `released` без receipt''ов; цену заплатил чужой репозиторий. ПОДДЕЛАТЬ ФЛАГ НЕЛЬЗЯ: проверить другое
  утверждение («merge-коммит есть в истории») и записать его под тем же полем значило бы тихо переопределить
  проверенный факт — ровно то, что кит запрещает всем остальным. Поэтому отсутствие доказательства признаётся
  ОТДЕЛЬНЫМ состоянием: `.ai/project/delivery-proof-debt.yaml` (kind: DeliveryProofDebt) говорит «доказательства
  нет» и доказательством не является — полей sha_verified/DeliveryReceipt в нём нет, это проверяется тестом.
  Находка меняет силу, а не исчезает: для признанных функций она не валит прогон, но печатается ДО вердикта
  и считается в doctor — невидимый долг перестал бы быть долгом, и «не знаю» не превращается в «в порядке».
  ЛАЗЕЙКИ НЕТ, И ЭТО ГЛАВНОЕ: признаётся только запись со `status_at_record: released` (дописанная руками
  строка про запланированную функцию долгом не считается), нечитаемый файл не оправдание, повторный `--apply`
  не добавляет новых id и не переписывает дату признания, закрытый долг уходит из списка, новая функция
  без доказательства снова ошибка. Запись — командой `./ai-ops delivery-proof` с сухим прогоном по умолчанию,
  как у `bootstrap`: это признание ВЛАДЕЛЬЦА, а не вывод кита, и молча писать в чужой репозиторий кит
  не вправе. Долг закрывается настоящей доставкой либо записью merge SHA владельцем — тогда это слово
  владельца, а не проверенный китом факт. Проверено на живом случае: ии-среда 5 из 8 падений -> 8 из 8
  проходят, долг виден в doctor. Доказательство 3.36.6: охват full-current-python (CPython 3.9.6/darwin)
  — 1828 passed, 6 skipped; охват compatibility-matrix — CI. 3.36.5 — доводка Work Is Seen, найденная
  СКВОЗНОЙ проверкой сценария ии-среды. Признак «модель закоммитила сама» сравнивал HEAD с `base_sha`
  — SHA БАЗОВОЙ ВЕТКИ. При `resume` и на ветке, уже ушедшей вперёд базы, HEAD отличается от базы ДО начала
  прогона: коммиты прошлых прогонов засчитывались бы как работа этого. Ложь в эту сторону опаснее исходной
  — «код не написан» при живом коммите заставляет проверить руками, а «работа сделана» на пустом прогоне
  читается как успех и не проверяется вовсе. Точка отсчёта — HEAD, снятый на старте прогона. Отдельно
  про метод: первая версия теста звала конвейер с умолчаниями (`commit=False`) и «доказывала», что починки
  3.36.4 нет, — она проверяла стенд, а не продукт; сценарий подтверждён настоящим `run_pipeline` в продуктовой
  конфигурации (`commit.sha` — коммит модели, `produced_by: model-commit`, файлы названы). Сквозные тесты
  покрывают три случая: коммит модели виден, пустой прогон остаётся пустым, ветка впереди базы не выдаётся
  за работу. Доказательство 3.36.5: охват full-current-python (CPython 3.9.6/darwin) — 1818 passed, 6
  skipped; охват compatibility-matrix — CI. Обкатано в поле: ии-среда обновлена с 3.7.3 (PR #442), child-CI
  кита зелёный. 3.36.4 — Work Is Seen. Находка ии-среды, мешавшая КАЖДЫЙ ДЕНЬ: движок дважды за день отрапортовал
  «код не написан — правок 0» и пометил работу blocked при СДЕЛАННОМ коммите. По отчёту выглядело, будто
  кит не работает, хотя он работал; ложное «ничего не произошло» дороже любой другой неточности, потому
  что после него перестают читать отчёт. Факт правок брался из `loop.applied_writes` — счётчика операций,
  прошедших через брокера, — а писать можно тремя каналами, и счётчик видит один: writer уровня `claude
  -p` правит файлы своими инструментами, `sed -i` правит через shell, и модель может закоммитить сама.
  Третий случай был слеп ПОЛНОСТЬЮ: после собственного коммита модели дерево чистое, `applied` пусто,
  проверка «есть ли изменения» честно отвечает «нет» — и работа, лежащая коммитом на ветке, для движка
  не существовала. Поэтому починка не сводится к «протянуть shell_changed до отчёта»: тот смотрит на грязное
  дерево, а после коммита его нет. Теперь факт считается по git одним предикатом `work_produced` на ВСЕХ
  потребителей — статус активной работы, человеческий вывод, передача исполнителю: пока каждый считал
  по-своему, отчёт говорил «правок 0», статус «код не написан», а в коммите лежали файлы. Свой коммит
  модели виден через сверку HEAD с базой прогона (`_head_advanced`): грязное дерево и продвинувшийся HEAD
  — два разных факта, и оба означают «работа произведена». Канал НАЗЫВАЕТСЯ в отчёте (`commit.produced_by`:
  broker / shell / model-commit), а не выводится читателем. Счётчик брокера остался и честно называется
  «правок через брокера» — он отвечает на свой вопрос, просто это другой вопрос. Поймано этим же изменением:
  собственный тест проверял ФОРМУЛИРОВКУ, а не смысл, и приведён к смыслу. Доказательство 3.36.4: охват
  full-current-python (CPython 3.9.6/darwin) — 1814 passed, 6 skipped; охват compatibility-matrix — CI.
  3.36.3 — Runner Agnostic. Ии-среда три релиза назад выписала ТРИ допущения об одноразовых раннерах GitHub
  и прямо адресовала их киту: «тот же зашитый /tmp лежит в шаблонах кита, правка нужна вверх по течению,
  иначе он воспроизведёт это в любом репозитории со своим раннером». Кит услышал одно и не услышал два
  остальных, хотя они в том же списке и в тех же трёх файлах. (1) `runs-on: ubuntu-latest` существует
  только у GitHub: в организации со своими раннерами джоба с этим ярлыком не падает, а бесконечно висит
  в очереди — худший вид отказа, потому что он не выглядит отказом и на такую джобу никто не смотрит.
  Теперь `${{ vars.CI_RUNNER_LINUX || ''ubuntu-latest'' }}`: у кого раннеры GitHub — поведение прежнее.
  (2) `setup-python` уходит в tool cache по пути раннеров GitHub (`/Users/runner`), которого на своей
  машине нет, а `pip install` в системный python Ubuntu 24.04 запрещён (PEP 668). Шаги ограничены раннерами
  GitHub; на своём выполняется ПРОВЕРКА предустановки с внятным сообщением — молчаливое отсутствие утилиты
  у ии-среды всплывало через тридцать секунд как `net::ERR_CONNECTION_REFUSED`. (3) ДОКУМЕНТАЦИЯ — ТАКАЯ
  ЖЕ ПОВЕРХНОСТЬ ДОСТАВКИ, КАК ШАБЛОН: ии-среда собрала свою джобу по `docs/QUICKSTART.md`, а тот звал
  `validation/validate_knowledge_graph.py` — корневой каталог, которого нет с 3.34. Шаблон починили в
  3.36.1, рецепт нет, и следующий репозиторий унёс бы поломку снова; теперь существование каждого пути
  из документации проверяется тем же тестом, что и в шаблонах. Решение взято у ии-среды, а не придумано:
  выбор раннера переменной обкатан на их живом self-hosted стенде, и изобретать своё там, где есть проверенное
  в поле, значит получить третий вариант поведения. Доказательство 3.36.3: охват full-current-python (CPython
  3.9.6/darwin) — 1803 passed, 6 skipped; охват compatibility-matrix — CI. 3.36.2 — Delivery Truth. Найдено
  на back-fill 3.36.1, то есть при первом же применении только что выпущенного исправления: кит починил
  путь child-валидатора, `ai-ops update` в живом репозитории отработал успешно и оставил сломанный CI
  НЕТРОНУТЫМ. Файлы `.github/workflows/ai-ops-*.yml` копировались только в `init` и только когда файла
  ещё нет — значит исправление шаблона не могло доехать ни до одного подключённого репозитория никогда.
  Дефект оказался шире: за ранним выходом `update` («обновление не требуется») оставались также точка
  входа `./ai-ops`, блок политики общения в CLAUDE.md, засев контура планирования и маркеры зон — ребёнок
  с совпадающей версией не получал ничего из этого, а это состояние ЛЮБОГО репозитория, где кит уже стоит.
  Обнаружилось руками: вернули CLAUDE.md к версии main при разрешении конфликта и попросили кит вставить
  свой блок обратно — «обновление не требуется», блок не вставлен. Теперь `init` и `update` зовут одну
