schema_version: 1
registry_type: model-qualification
# Provider Independence (ADR-004): допуск модели к РОЛИ выводится из Bench-метрик по КОНКРЕТНОЙ
# ревизии (не class×role, не ручное мнение). safety-first: false_green>0 -> not_qualified. Статус ДОЛЖЕН
# быть согласован с метриками (validate_model_qualification это принуждает). Пороги: qualified требует
# false_green==0 И success_rate>=0.8 И schema_valid_rate>=0.9; conditional >=0.5; experimental >0.
#
# ИЗМЕРЕНО в живой кросс-вендорной квалификации 2026-07-28 (N=6 фиксированный корпус, объективная
# приёмка по точному контракту задачи; DeepSeek + Kimi + Qwen = 18 прогонов, БЕЗ Anthropic). Метрики
# статуса: success_rate (доля КОРРЕКТНОЙ реализации); false_green (0 у всех 18 — safety держится);
# schema_valid_rate; latency_s_p50. Ни один вендор НЕ дотянул до qualified на N=6 -> все conditional.
#
# v3.7.10 ЭКОНОМИКА В ДЕНЬГАХ (ревью владельца, «самая важная проблема»): раньше роутер сортировал по
# token-прокси, что при разнице тарифов врёт. Теперь `economics` РАЗДЕЛЯЕТ измеренные токены и
# ДЕКЛАРИРУЕМЫЕ цены -> вычисляемый total_cost_per_verified_change (деньги) — основной критерий роутера.
# Токены — на базе delivered_verified (на УСПЕШНОЕ изменение; прежние all-impl_ok числа были историческими
# и завышали qwen из-за false_fail t5). Цены Kimi/Qwen — с официальных страниц (source+snapshot). DeepSeek:
# цена V4 опубликована ТОЛЬКО картинкой (v4-price-en.png) — не извлекается, оставлена null +
# verification_required (роутер по роли с null-ценой честно откатывается на tokens-fallback). Роутер
# допускает conditional к writer-ролям, строгих судей (security/integration) — нет (нет qualified).
qualifications:
  - model_id: deepseek-chat
    provider: deepseek
    revision: deepseek-chat
    role: implementation
    corpus_version: live-qual-2026-07-28-N6
    # ВНИМАНИЕ (portfolio truth): эндпоинт api.deepseek.com теперь рекламирует ТОЛЬКО deepseek-v4-flash/
    # deepseek-v4-pro; 'deepseek-chat' принимается, но, вероятно, алиас на V4 -> точная ревизия под вопросом,
    # переподтвердить в Bench v2 (v3.7.11).
    metrics: {false_green: 0, schema_valid_rate: 1.0, success_rate: 0.667, latency_s_p50: 95.3}
    economics:
      input_tokens_per_change: 77162
      output_tokens_per_change: 2364
      tokens_per_verified_change: 79526
      input_price_per_mtok: null
      output_price_per_mtok: null
      currency: null
      price_snapshot_at: null
      price_source: null
      total_cost_per_verified_change: null    # цена V4 image-only -> ждём владельца; пока tokens-fallback
      verification_required: true
    status: conditional
    qualified_at: "2026-07-28"
