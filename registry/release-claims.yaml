# release-claims.yaml — machine-readable claims о ТЕКУЩЕМ релизе + runtime-статусах (v3.8.1 Release Truth
# Alignment). ЕДИНСТВЕННЫЙ источник публичных чисел/статусов; validate_release_claims.py (в CI) ловит дрейф
# между этим файлом и фактическим состоянием (VERSION, python3-проверки в AGENTS.md, registry/agents.yaml,
# registry/runtimes.yaml) И требует, чтобы README/ROADMAP ссылались на текущую версию. ОБНОВЛЯТЬ при релизе.
schema_version: 1
registry_type: release-claims

version: 3.29.0
phase: "v3.29 — Field Findings: честный первый запуск, полнота intake, база worktree, правдивый lifecycle"
channel: stable
patch_note: "3.29.0 — закрыты находки двух живых прогонов (niti, ии-среда раунд C) и внешнего ревью v3.28.0. Меняется поведение по умолчанию: run --execute сам выбирает живого провайдера вместо хардкод-mock; отказывается стартовать при неполном intake (exit 2) вместо вердикта после прогона; worktree режется от текущей ветки, а не от remote-default, поэтому последовательные задачи строятся друг на друге. Lifecycle больше не помечает работу done при NOT_READY. Закрыт класс дефектов, из-за которого контур проверки не проверял сам себя: селфтест бенчмарков переписывал собственный baseline, шаг pr-smoke с устаревшим -k выбирал ноль тестов, чеклист опирался на editable-установку и в чистом окружении не выполнял 13 команд из 206."

# Числа сверяются ДЕРИВИРОВАННО (не на слово): checks_count = python3-команды в pre-commit-checklist.md;
# agents_count = записи в registry/agents.yaml. Устаревшие числа (напр. «91+») CI отклонит.
checks_count: 206
agents_count: 51
# Числа гейтов — DERIVED. ПОПРАВКА к формулировке v3.28.x: claim'ы gate-count/mvp-blocking-count,
# на которые ссылается ROADMAP, существуют — они в knowledge/claims.yaml и их проверяет
# validate_claims. Здешние счётчики их ДУБЛИРУЮТ по значению, но добавляют то, чего там нет:
# требование blocking: true у каждого гейта из mvp_blocking_gates (список блокеров без силы —
# такая же ложь публичной поверхности, как устаревшее число). При изменении числа гейтов править
# ОБА места: knowledge/claims.yaml (pattern-счётчик) и этот файл.
gates_count: 33
mvp_blocking_count: 8
# Честное состояние верификации самих валидаторов (рекомендация №6 внешнего ревью): большинство
# по-прежнему подтверждает себя собственным --selftest. Число деривируется из tests/ и обязано
# совпадать: и рост, и просадка покрытия требуют осознанной правки этого файла.
validators_count: 70
validators_externally_tested: 37

qualified_on: >
  provider-neutral портфель по РОЛЯМ: дешёвый API-writer (money-mode) + СИЛЬНЫЙ writer (локальный
  claude -p, без ключа) на сложном full-stack + независимый дешёвый ревьюер (deepseek, writer≠judge)
  + ЧЕЛОВЕК на strict security #5. Sonnet НЕ требуется. Доказано live end-to-end (draft PR на ИИ-Среде).

# Публичная поверхность обязана ссылаться на текущую версию (иначе рассказывает о прошлом продукте).
docs_must_reference_version: [README.md, ROADMAP.md]

# Каждый claim == фактический status в registry/runtimes.yaml (CI ловит расхождение заявленных
# возможностей адаптеров/оркестратора). Обновлено под 3.8: concurrent + fan-in + resume доказаны live.
runtime_capabilities:
  - {runtime: generic-orchestrator, capability: parallel_execution, status: verified}
  - {runtime: generic-orchestrator, capability: resumability,      status: verified}
  # claude-code — first-class executing adapter (v3.9.0): кит оркестрирует локальный claude -p read-only
  # как сильного writer'а; Claude предлагает, кит владеет worktree/diff/evidence/gates/delivery.
  - {runtime: claude-code, capability: parallel_execution, status: documented}

# ЦЕЛЕВЫЕ границы (не дефекты, объявлены явно): human на strict security #5; сильный writer на сложном
# full-stack. Автономный дешёвый auto-close security-судья недостижим -> future_opportunities (см. BQP).
standing_boundaries:
  - human_strict_security_5
  - strong_writer_for_complex_fullstack

# v3.9.1: устаревшие маркеры «текущего статуса», которых НЕ должно быть в README/ROADMAP (ловит повторный
# дрейф в CI). Добавлять сюда стейл-фразы при их удалении из публичной поверхности.
forbidden_stale_markers:
  - "Current Forward Roadmap (актуально с v3.0.14)"
  - "ЗАКРЫТА (v3.0.0 stable, 2026-07-21, claude-sonnet-5)"
  - "sequential-only"                        # кит умеет concurrent parallel-2 (parallel_live.py) с 3.8
  - "не запускает параллельных агентов"

# v3.9.2: файлы, сканируемые на forbidden_stale_markers (шире docs_must_reference_version — вся публичная
# поверхность, включая docs/ и NOTICE). Добавлять сюда доки при выявлении в них дрейфа.
stale_marker_files:
  - README.md
  - ROADMAP.md
  - NOTICE.md
  - docs/parallel-sessions.md
  - docs/QUICKSTART.md
  - docs/adoption-guide.md
  - VISION.md
  - AGENTS.md
