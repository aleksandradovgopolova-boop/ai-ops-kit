      сервисов и совпадает с формой пути gRPC `/package.Service/Method`). `stream` (client/server
      streaming) на факт операции не влияет. Обычные `message`/`enum` — модель данных, их поля/значения
      НЕ операции (сканируются только тела service-блоков). Комментарии `//…` и `/* … */` и строковые
      литералы (`"…"`/`'…'` — значения опций/дефолтов) маскируются пробелами (позиции/номера строк
      сохраняются) — ложных rpc не дают. Тело блока берётся балансировкой `{…}`; незакрытый блок
      (обрыв файла) пропускается. Регэксп/скан по паттерну — не грамматический парсер → confidence:
      inferred. ref = "file:line|<Svc>/<Name>".
    honest_limits:
      sees: >-
        операции gRPC, объявленные `rpc` внутри блока `service` прямо в .proto-файле (в т.ч. unary и
        client/server/bidi streaming через `stream`); даёт file:line и `<Svc>/<Name>` как symbol,
        помечает inferred (не блокирует).
      does_not_see: >-
        СГЕНЕРИРОВАННЫЕ из .proto stubs (code-gen в .py/.go/.java и т.п. — иной носитель, не .proto);
        server reflection в рантайме; REST-mapping через аннотации `option (google.api.http)` (это
        HTTP-биндинг поверх rpc, а не отдельный факт операции); поля `message`/значения `enum` (модель
        данных, НЕ операции); импортированные (`import "other.proto";`) сервисы из другого файла
        (виден только per-file service-блок); незакрытый `service {` без пары (обрыв файла — пропуск).
        Ничего из этого НЕ verified.

  # E16 добавил ТРЕТИЙ носитель вида `api` — операции tRPC-роутера (TypeScript). Честность силы та же,
  # что у graphql-schema (E8) / grpc-proto (E11): tRPC-роутер живёт в TS, а stdlib ast к TS неприменим
  # — разбирается ТЕКСТОМ/паттерном по исходнику (не полноценным TS-парсером, без вызова node, без
  # проверки типов и сети) → это НЕ доказательный AST того же класса, что Python-AST → confidence:
  # inferred (в W4 НЕ блокирует). Код — новый подмодуль
  # ai_ops_kit/checks/surface_extractors/trpc_router.py (extract_trpc_operations), зарегистрирован в
  # DEFAULT_EXTRACTORS фасада surface_extraction.py (.ts уже в union суффиксов js-экстракторов).
  - id: trpc-router
    stack: {language: typescript, frameworks: [trpc]}
    surface_kinds: [api]
    confidence: inferred
    method: >-
      ТЕКСТОВЫЙ (не TS-парсер) разбор файлов .ts без исполнения: роутер объявляется вызовом
      `createTRPCRouter({ … })` / `t.router({ … })` / `router({ … })`, где первый аргумент —
      объектный литерал, а КЛЮЧИ верхнего уровня суть процедуры. Процедура = ключ, значение которого
      содержит вызов `.query(` / `.mutation(` / `.subscription(`; имя операции = ключ. Обычное поле
      объекта (значение без такого вызова) процедурой НЕ считается. Вложенный роутер как значение
      ключа (`orders: createTRPCRouter({ … })`) даёт namespace: его процедуры получают префикс
      `orders.` (форма клиентского вызова tRPC `trpc.orders.getOrders`); сам ключ вложенного роутера
      операцией НЕ считается. Только НЕдинамические литеральные ключи (идентификатор или строковый
      литерал); вычисляемый ключ `[expr]:` — пропуск. Комментарии `//…`/`/* … */` и строковые/backtick
      литералы маскируются пробелами (позиции/номера строк сохраняются) — ложных процедур не дают, и
      `{`/`}` внутри строк не сбивают балансировку. Тело роутера берётся балансировкой `{…}`; незакрытый
      объект (обрыв файла) пропускается. Берётся ТОЛЬКО в файле с индикатором tRPC (`initTRPC` /
      `createTRPCRouter` / `publicProcedure` / импорт из `@trpc/server`), чтобы чужой TS-объект с ключом
      `query`/полем `router` не дал ложных операций. Регэксп/скан по паттерну — не грамматический TS-парсер
      → confidence: inferred. ref = "file:line|<namespace.operation>".
    honest_limits:
      sees: >-
        операции tRPC, объявленные ЛИТЕРАЛЬНЫМ ключом-процедурой (значение содержит
        .query(/.mutation(/.subscription() внутри объектного литерала роутера createTRPCRouter/t.router/
        router в .ts-файле с индикатором tRPC, включая вложенные роутеры с namespace-префиксом
        (`orders.getOrders`); даёт file:line и имя операции как symbol, помечает inferred (не блокирует).
      does_not_see: >-
        склейку `mergeRouters(a, b)` в рантайме (операции склеиваемых роутеров тут не видны); процедуры,
        добавленные через spread (`...otherRouter`) или собранные из переменной/импорта, а не литеральным
        ключом; вычисляемые ключи `[expr]:` (динамика — пропуск); middleware-цепочки как отдельные операции
        (берётся сам факт процедуры, не её пайплайн); глубокую вложенность роутеров, если объект собран не
        литералом; code-first без явных ключей; edge-случаи backtick-интерполяции (backtick-строка гасится
        целиком); файлы без индикатора tRPC; .tsx (берём только .ts). Ничего из этого НЕ verified.

  # E12 добавил извлечение HTTP-эндпоинтов из OpenAPI/Swagger-спеки (вид route) — первый источник
  # поверхностей из ЗАЯВЛЕННОГО КОНТРАКТА API (спека), а не из кода обработчиков. Честность силы: спека
  # может РАСХОДИТЬСЯ с реальным кодом (drift — эндпоинт объявлен в спеке, но в коде отсутствует или
  # наоборот), плюс разбор структурный по тексту спеки (yaml.safe_load/json.loads, без исполнения,
  # без сети, без резолва remote-$ref), а не доказательство из исполняемого исходника → это НЕ
  # доказательный AST того же класса, что Python-AST → confidence: inferred (в W4 НЕ блокирует). Файлы
  # .yaml/.json ОЧЕНЬ распространены, потому экстрактор сужен индикатором top-level `openapi:`/`swagger:`
  # (иначе чужие package.json/конфиги дали бы ложные поверхности). Код — новый подмодуль
  # ai_ops_kit/checks/surface_extractors/openapi_spec.py (extract_openapi_routes), зарегистрирован в
  # DEFAULT_EXTRACTORS фасада surface_extraction.py.
  - id: openapi-spec
    stack: {language: [yaml, json], frameworks: [openapi, swagger]}
    surface_kinds: [route]
    confidence: inferred
    method: >-
      СТРУКТУРНЫЙ (не исполняемый) разбор файлов .yaml/.yml/.json без сети: yaml.safe_load для YAML и
      json.loads для JSON. Срабатывает ТОЛЬКО когда верхний уровень документа — словарь с ключом
      `openapi:` (OpenAPI 3.x) ИЛИ `swagger:` (Swagger/OpenAPI 2.0); иначе сразу []. Каждая пара «путь
      (ключ в секции `paths`) + HTTP-метод (get/post/put/delete/patch)» = одна операция → route. Путь —
      ключ в `paths` (по контракту OpenAPI начинается с "/"), метод — ключ path-item. ref =
      "file:line|<METHOD> <path>" (метод в верхнем регистре; line — строка ключа метода в тексте).
      Битый/не-utf-8 файл не роняет скан (возвращается []). Структурный разбор заявленного контракта ≠
      доказательный AST → confidence: inferred.
    honest_limits:
      sees: >-
        HTTP-эндпоинты, ОБЪЯВЛЕННЫЕ в секции `paths` спеки OpenAPI 3.x / Swagger 2.0 (.yaml/.yml/.json)
        как пары путь+метод (get/post/put/delete/patch); даёт file:line и "<METHOD> <path>" как symbol,
        помечает inferred (заявленный контракт, не блокирует).
      does_not_see: >-
        РАСХОЖДЕНИЕ спеки с кодом (drift — спека может отставать: объявленный эндпоинт в коде может
        отсутствовать, а реальный обработчик — не попасть в спеку); композицию через `$ref`/remote-refs
        (path-item по ссылке в другой файл НЕ разворачивается); `callbacks` и `webhooks` (OpenAPI 3.1 —
        они не в `paths`); методы head/options/trace; серверные префиксы из `servers:`/`basePath:` (к
        путям НЕ приклеиваются — виден только литерал ключа `paths`); спеки, встроенные строкой В КОД
        (SDL/JSON в .js/.ts/.py), и любую спеку без top-level `openapi:`/`swagger:`; переопределение
        путей рантайм-роутером поверх спеки. Ничего из этого НЕ verified.

  # E13 добавил серверные маршруты Phoenix (вид route) — первый стек Elixir/BEAM. Честность силы та
  # же, что у rails-routes (E9) / go_web (E6) / spring-web (E7) / js_server (E4): Elixir разбирается
  # ТЕКСТОМ/паттерном по исходнику (stdlib ast к Elixir неприменим), без вызова компилятора Elixir /
  # BEAM и без сети — это НЕ доказательный AST → confidence: inferred (в W4 НЕ блокирует). Развёртка
  # resources в RESTful — тоже inferred: это КОНВЕНЦИЯ Phoenix (роутер разворачивает пути в рантайме),
  # а не доказанный в исходнике литерал. Код — новый подмодуль
  # ai_ops_kit/checks/surface_extractors/phoenix_router.py (extract_phoenix_routes), зарегистрирован в
  # DEFAULT_EXTRACTORS фасада surface_extraction.py.
  - id: phoenix-router
    stack: {language: elixir, frameworks: [phoenix]}
    surface_kinds: [route]
    confidence: inferred
    method: >-
      ТЕКСТОВЫЙ (не AST) разбор Elixir Phoenix-router-DSL модуля router.ex без исполнения: глаголы
      `get`/`post`/`put`/`patch`/`delete` с двойными кавычками пути → route (метод из глагола DSL:
      `get "/x", Controller, :action` → `GET /x`); `resources "/orders", OrderController` → 7
      стандартных RESTful-маршрутов Phoenix (index/new/create/show/edit/update/delete: `GET /orders`,
      `GET /orders/new`, `POST /orders`, `GET /orders/:id`, `GET /orders/:id/edit`, `PATCH
      /orders/:id`, `DELETE /orders/:id`). Блоки `scope "/api" do …` / `scope "/api", AppWeb do …` /
      `scope path: "/api" do …` дают префикс пути `/api`, склеиваемый с путями внутри блока; `scope
      "/", AppWeb` — пустой сегмент. Путь-НЕ-литерал (переменная `get some_path, …`, атом-параметр,
      интерполяция `"/u/#{id}"`, склейка) в двойные кавычки не попадает или содержит `#{` → пропуск.
      Берётся ТОЛЬКО в файле с индикатором Phoenix (`Phoenix.Router` в тексте, макрос `use <App>Web,
      :router` ИЛИ имя файла router.ex), чтобы чужой `get`/`resources` в стороннем Elixir не дал
      ложный маршрут. Регэксп/скан по паттерну — не грамматика Elixir → confidence: inferred. ref =
      "file:line|<МЕТОД> <path>".
    honest_limits:
      sees: >-
        маршруты Phoenix, объявленные литеральным глаголом (get/post/put/patch/delete) с путём в
        двойных кавычках и стандартную RESTful-развёртку `resources` (inferred-конвенция), с учётом
        префиксов scope одного уровня вложенности; file:line и "<МЕТОД> <path>" как symbol, помечает
        inferred (не блокирует).
      does_not_see: >-
        `pipe_through`/пайплайны и их роль в маршруте; `forward` (монтирование plug/роутера) и
        `live "/x", LiveView` LiveView-роуты (иной вид объявления, не берутся); PUT для update
        (Phoenix даёт и PUT, и PATCH — эмитируется только PATCH из перечисленного RESTful-набора);
        `only:`/`except:`-фильтры и `singleton: true` у `resources` (полный плюральный RESTful-набор
        выдаётся всегда, фильтры/сингулярность НЕ применяются); член/коллекционные и ВЛОЖЕННЫЕ
        `resources` глубже 1 (нутро `resources … do` не разбирается); склейку ВЛОЖЕННЫХ scope глубже
        одного уровня в полный путь в рантайме сверх конкатенации объявленных литеральных сегментов;
        динамические пути (переменная/атом-параметр `get :action`/интерполяция `#{…}`/склейка); файл
        без индикатора Phoenix. Ничего из этого НЕ verified.

  # E14 добавил серверные маршруты Laravel (вид route) — первый стек PHP. Честность силы та же, что у
  # go_web (E6) / java_spring (E7) / rails-routes (E9) / aspnet-routes (E10): PHP разбирается ТЕКСТОМ/
  # паттерном по исходнику (stdlib ast к PHP неприменим), без вызова интерпретатора PHP и без сети —
  # это НЕ доказательный AST → confidence: inferred (в W4 НЕ блокирует). Развёртка
  # resource/apiResource в RESTful — тоже inferred: это КОНВЕНЦИЯ Laravel (роутер разворачивает пути
  # в рантайме), а не доказанный в исходнике литерал. Код — новый подмодуль
  # ai_ops_kit/checks/surface_extractors/laravel_routes.py (extract_laravel_routes), зарегистрирован
  # в DEFAULT_EXTRACTORS фасада surface_extraction.py.
  - id: laravel-routes
    stack: {language: php, frameworks: [laravel]}
    surface_kinds: [route]
    confidence: inferred
    method: >-
      ТЕКСТОВЫЙ (не AST) разбор фасада Laravel в routes/*.php без исполнения: `Route::get('/x', …)` и
      `post`/`put`/`patch`/`delete`/`options` со строковым путём-литералом → route (метод из глагола
      фасада); `Route::resource('orders', …)` → 7 стандартных RESTful-маршрутов Laravel (index/create/
      store/show/edit/update/destroy: `/orders`, `/orders/create`, `/orders/{id}`, `/orders/{id}/edit`);
      `Route::apiResource('orders', …)` → те же 5 без форм create/edit. Группы
      `Route::prefix('api')->group(function () { … })` и `Route::group(['prefix' => 'admin'], …)` дают
      префикс пути, склеиваемый с путями внутри блока при ЛИТЕРАЛЬНОМ префиксе. Путь-НЕ-литерал
      (переменная `Route::get($p, …)`, интерполяция двойных кавычек `"/u/{$id}"`/`"$x"`, склейка через
      `.`) → пропуск. Берётся ТОЛЬКО в файле с индикатором Laravel (фасад `Route::` в тексте,
      `use Illuminate\Support\Facades\Route`, ИЛИ файл в каталоге routes/), чтобы чужой `Route::`/`->get`
      в стороннем PHP не дал ложный маршрут. Регэксп/скан по паттерну — не грамматика PHP → confidence:
      inferred. ref = "file:line|<МЕТОД> <path>".
    honest_limits:
      sees: >-
        маршруты Laravel, объявленные литеральным глаголом фасада (Route::get/post/…), а также
        стандартную RESTful-развёртку `Route::resource`/`Route::apiResource` (inferred-конвенция), с
        учётом литерального префикса одной prefix-группы; file:line и "<МЕТОД> <path>" как symbol,
        помечает inferred (текстовый разбор, не блокирует).
      does_not_see: >-
        `only(...)`/`except(...)`-сужения ресурса (полный RESTful-набор соответствующего типа выдаётся
        всегда, конкретные фильтры НЕ применяются); invokable-контроллеры (`Route::get('/x', Controller
        ::class)` — путь виден, но одиночное действие без глагола-фасада как отдельный маршрут не
        выводится); `Route::match([...], …)`/`Route::any(…)` (несколько/все методы — не разворачиваем);
        имена/группировку через `->name(...)`/`->middleware(...)`/`->domain(...)` и биндинг модели
        (`{order}` вместо `{id}` — конвенциональный плейсхолдер нормализован к `{id}`); ВЛОЖЕННЫЕ группы
        и замыкания-обработчики с фигурными скобками прямо в routes-файле (могут сбить область
        prefix-группы — declared limit); nested-ресурсы с точечной нотацией (`photos.comments`);
        динамические пути (переменная/интерполяция/склейка `.`) и любые маршруты, собранные в рантайме
        (макросы, `Route::macro`, регистрация из провайдеров). Ничего из этого НЕ verified.
  # E15 добавил серверные маршруты Ktor (вид route) — стек Kotlin/JVM. Честность силы та же, что у
  # go_web (E6) / java_spring (E7) / rails-routes (E9) / aspnet-routes (E10): Kotlin разбирается
  # ТЕКСТОМ/паттерном по исходнику (stdlib ast к Kotlin неприменим), без вызова компилятора Kotlin /
  # JVM и без сети — это НЕ доказательный AST → confidence: inferred (в W4 НЕ блокирует). Вложенность
  # блоков `route` учитывается балансом скобок (_matching_brace из _common). Код — новый подмодуль
  # ai_ops_kit/checks/surface_extractors/ktor_routing.py (extract_ktor_routes), зарегистрирован в
  # DEFAULT_EXTRACTORS фасада surface_extraction.py.
  - id: ktor-routing
    stack: {language: kotlin, frameworks: [ktor]}
    surface_kinds: [route]
    confidence: inferred
    method: >-
      ТЕКСТОВЫЙ (не AST) разбор исходника .kt без исполнения: method-вызовы Ktor DSL `get("/p") { … }`,
      `post`/`put`/`patch`/`delete`/`head`/`options` со строковым путём-литералом → route (метод из
      глагола DSL). Блок `route("/prefix") { … }` задаёт ПРЕФИКС, склеиваемый с путём вложенного метода
      (оба литералы); сам блок route маршрутом не считается — эндпоинт делает вложенный method-вызов.
      Метод без пути (`get { … }`) сводится к самому префиксу. Вложенность блоков `route` учитывается
      БАЛАНСОМ СКОБОК (`route("/a") { route("/b") { get { … } } }` → `GET /a/b`). Строки и комментарии
      Kotlin (`//`, вложенные `/* */`, `"…"`, сырые `"""…"""`) маскируются перед сканом (их скобки/
      кавычки не сбивают баланс, номера строк сохраняются). Берётся ТОЛЬКО в файле с индикатором Ktor
      (импорт `io.ktor`, `routing {` либо `install(Routing)`); member-вызовы `x.get { }` отсекаются
      (глагол не после `.`), чтобы обращение к методу объекта не сошло за маршрут. Регэксп по паттерну
      — эвристика → confidence: inferred. ref = "file:line|<МЕТОД> <path>".
    honest_limits:
      sees: >-
        маршруты Ktor, объявленные method-вызовом DSL (get/post/put/patch/delete/head/options) со
        строковым путём-литералом, склеенные с литеральными префиксами объемлющих блоков `route`
        (в т.ч. вложенных); метод без пути — как сам префикс. Даёт file:line и "<МЕТОД> <path>" как
        symbol, помечает inferred (текстовый разбор, не блокирует).
      does_not_see: >-
        обёртки `authenticate { … }` и иные интерсепторы (их семантику не осмысляем — вложенный метод
        виден как обычный маршрут своего префикса, факт защиты не выводим); `route(path)`/метод через
        ПЕРЕМЕННУЮ, Kotlin-интерполяцию `$…`/`${…}`, склейку через `+` (в литерал не попадает → пропуск,
        а НЕлитеральный префикс блока делает вложенные пути неразрешимыми); тип-безопасный
        `resources`-плагин (`get<Article> { }` — путь из типа, не из строки); глубокую склейку вложенных
        `route` в полный путь в рантайме сверх объявленных литералов сегментов; регекс-роуты и
