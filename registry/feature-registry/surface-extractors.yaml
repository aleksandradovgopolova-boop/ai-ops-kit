        Даёт file:line и сам путь как symbol, помечает inferred (текстовый разбор, не блокирует).
      does_not_see: >-
        middleware (r.Use и цепочки хендлеров); СКЛЕЙКУ префикса роут-группы (Group/Route/Mount) с
