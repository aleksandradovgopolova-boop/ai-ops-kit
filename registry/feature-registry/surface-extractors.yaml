        рантаймом полный путь; роут-группы с ДИНАМИЧЕСКИМ (нелитеральным) префиксом; роутеры/пути через
        переменную, конкатенацию, fmt.Sprintf или константу (не литерал — пропуск); генерируемые/
        рефлексией-собранные маршруты; HTTP-метод gorilla из .Methods(...) (берётся путь, не метод);
        стеки сверх перечисленных. Ничего из этого НЕ verified.

