# registry/feature-registry/surface-extractors.yaml
#
# ЧЕСТНАЯ ДЕКЛАРАЦИЯ ЭКСТРАКТОРОВ ПОВЕРХНОСТЕЙ (W1 фичи feature-registry-coverage).
#
# Инвариант кита (AGENTS.md): capability-декларации честные — нельзя объявлять возможность, которой
# нет в коде. На этапе W1 код-экстракторов ещё НЕ существует (извлечение поверхностей — работа W2),
# поэтому список реализованных экстракторов ПУСТ. Это не заглушка «на будущее»: это честное «пока
# кит не умеет извлекать ни одной поверхности ни из одного стека».
#
# Как читать: `extractors` — то, что кит УМЕЕТ прямо сейчас (у каждого есть код и он проверяем).
# `planned` — намерения; они помечены status: unsupported + note planned и НЕ заявляют confidence,
# ровно как планы в registry/capability-index.yaml. Пока экстрактор в `planned`, кит не выдаёт по
# нему verified-поверхностей и не блокирует по ним (см. правило силы в стандарте FEAT).
#
# ЗАМЕТКА О ДОСТАВКЕ (honest): как и схема рядом, файл лежит в подкаталоге registry/ и в дочку пока
# не едет — child-side читателя нет до W2/W3/W5. Поедет плоским registry/-файлом вместе с первым
# реализованным экстрактором, и тогда подъём поставки будет записан в quality/delivery-budget.yaml.

schema_version: 1
registry_type: surface-extractors

# Словарь видов поверхностей, которые вообще бывают (совпадает с surface.kind в схеме реестра фич).
surface_kinds: [route, cli, screen, api]

# Уровни уверенности вывода. verified — доказано детерминированным разбором кода (может блокировать
# в W4); inferred — предположено эвристикой (только предупреждает).
confidence_levels: [verified, inferred]

# ── Реализованные экстракторы ───────────────────────────────────────────────────────────────────
# Здесь ровно то, что кит УМЕЕТ извлекать ПРЯМО СЕЙЧАС — у каждого есть код и он проверяем тестом.
# Заявлять стек, для которого кода нет, запрещено инвариантом честных capability-деклараций.
#
# W2 добавил ПЕРВЫЙ реальный экстрактор: HTTP-маршруты Flask/FastAPI по декораторам, точным разбором
# AST без исполнения кода → confidence: verified. Код — ai_ops_kit/checks/surface_extraction.py
# (функция extract_python_web_routes; ядро обхода — extract_surfaces).
extractors:
  - id: python-web-routes
    stack: {language: python, frameworks: [flask, fastapi]}
    surface_kinds: [route]
    confidence: verified
    method: >-
      статический разбор AST: декоратор @<router>.<method>("/path", ...) над (async-)функцией, где
      <method> ∈ {route, api_route, websocket, get, post, put, delete, patch, head, options, trace},
      а первый позиционный аргумент — строковый путь-литерал, начинающийся с "/". Код не исполняется.
      ref = "file:line|symbol" (symbol — имя функции-обработчика).
    honest_limits:
      sees: >-
        маршруты, объявленные декоратором в исходнике со строковым путём-литералом
        (Flask @app.route/@bp.get, FastAPI @app.get/@router.post и т.п.); даёт точные file:line|symbol.
      does_not_see: >-
        маршруты, собранные динамически (Flask add_url_rule, FastAPI include_router через переменную);
        пути НЕ-литералы (f-строки, константы, конкатенация); Django urlpatterns (список, не декоратор);
        классовые/method-view; любые не-Python стеки. Их появление НЕ доказывает и не блокирует.

  # CLI-команды продукта (вид поверхности cli). Три экстрактора под три стека объявления команд;
  # у каждого — свой честный предел. Общий принцип: доказано литералом → verified, динамика → пропуск.
  - id: python-cli-argparse
    stack: {language: python, frameworks: [argparse]}
    surface_kinds: [cli]
    confidence: verified
    method: >-
      статический разбор AST в файле, импортирующем argparse: `<subparsers>.add_parser("<name>", ...)`
      (имя подкоманды из строкового литерала) и `ArgumentParser(prog="<name>")` (имя программы из
      литерала, по возможности). Код не исполняется. ref = "file:line|<имя-команды>".
    honest_limits:
      sees: >-
        подкоманды argparse с ЛИТЕРАЛЬНЫМ именем (add_parser("name")) и prog-имя верхнего парсера,
        заданное строковым литералом, — в файле, который действительно импортирует argparse.
      does_not_see: >-
        имена, собранные динамически (переменная/f-строка/имя из данных или конфига); prog из
        переменной; add_parser без литерала; argparse-обёртки, спрятанные за своим API без импорта
        argparse в этом файле. Недоказанное verified НЕ помечается.
  - id: python-cli-click
    stack: {language: python, frameworks: [click]}
    surface_kinds: [cli]
    confidence: verified
    method: >-
      статический разбор AST в файле, импортирующем click: декоратор @<x>.command()/@<x>.group()
      (или @command()/@group() из `from click import ...`) над функцией. Имя — из литерала в
      декораторе (`"name"` или `name="..."`) либо из имени функции по правилу click (lower + `_`→`-`).
      ref = "file:line|<имя-команды>".
    honest_limits:
      sees: >-
        команды и группы click, объявленные декоратором command/group в файле с импортом click;
        имя берётся из литерала или детерминированно из имени функции.
      does_not_see: >-
        Typer (@app.command() на typer.Typer — иной стек, не импортирует click) и иные click-надстройки;
        имя из переменной/f-строки; команды, зарегистрированные в рантайме (add_command из данных);
        нестандартный cls с собственным правилом именования. Недоказанное verified НЕ помечается.
  - id: python-console-scripts
    stack: {language: python, frameworks: [setuptools, poetry]}
    surface_kinds: [cli]
    confidence: verified
    method: >-
      текстовый разбор объявленных точек входа (БЕЗ tomllib — пол 3.9): ключи-имена в pyproject.toml
      [project.scripts]/[project.gui-scripts]/[tool.poetry.scripts] и вложенные строки
      console_scripts/gui_scripts в setup.cfg [options.entry_points]. ref = "file:line|<имя-команды>".
    honest_limits:
      sees: >-
        имена команд, ОБЪЯВЛЕННЫЕ как точки входа дистрибутива в pyproject.toml или setup.cfg —
        доказуемо объявленный интерфейс запуска продукта.
      does_not_see: >-
        entry_points, заданные исполняемым setup.py (аргумент entry_points= вызова setup()); точки
        входа из плагинов/иных групп; динамически сформированные списки. Только эти два файла.
  # E2 добавил ещё три верифицированных экстрактора маршрутов для питон-веба (тот же приём: verified
  # только когда путь/префикс — строковый литерал в исходнике, точным разбором AST без исполнения;
  # каждый сужен к файлам с импортом своего фреймворка, чтобы одноимённый чужой вызов не дал ложный
  # verified). Код — те же ai_ops_kit/checks/surface_extraction.py (функции extract_django_urls,
  # extract_drf_router, extract_aiohttp_routes).
  - id: django-urls
    stack: {language: python, frameworks: [django]}
    surface_kinds: [route]
    confidence: verified
    method: >-
      статический разбор AST: вызов path("route/", view) или re_path(r"^...$", view) в файле,
      импортирующем django.urls, где первый позиционный аргумент — строковый путь-литерал.
      Код не исполняется. ref = "file:line|<вьюха-или-путь>" (имя вьюхи, если она записана именем).
    honest_limits:
      sees: >-
        объявления path()/re_path() со строковым путём-литералом в файле, импортирующем django.urls;
        symbol — имя вьюхи (views.orders) либо сам путь-литерал.
      does_not_see: >-
        include(...) — вложенный urlconf монтируется, конкретный эндпоинт им НЕ доказывается (пропуск);
        пути НЕ-литералы (переменная/f-строка/конкатенация); маршруты, собранные динамически или за
        плагинной регистрацией; class-based view с кастомным роутингом; urlpatterns без импорта
        django.urls в этом файле. Ничего из этого НЕ становится verified.
  - id: drf-router
    stack: {language: python, frameworks: [django-rest-framework]}
    surface_kinds: [route]
    confidence: verified
    method: >-
      статический разбор AST: вызов <router>.register("prefix", ViewSet) в файле, импортирующем
      rest_framework, где первый позиционный аргумент — строковый префикс-литерал. Код не
      исполняется. ref = "file:line|<ViewSet-или-префикс>".
    honest_limits:
      sees: >-
        router.register() со строковым префиксом-литералом в файле, импортирующем rest_framework;
        symbol — имя ViewSet либо сам префикс.
      does_not_see: >-
        префикс-НЕ-литерал (переменная/f-строка); конкретные суффиксы маршрутов, которые роутер
        разворачивает в рантайме из ViewSet (list/detail/@action) — виден только зарегистрированный
        префикс, а не порождённые из него URL; чужой .register() в файле без импорта rest_framework.
  - id: aiohttp-routes
    stack: {language: python, frameworks: [aiohttp]}
    surface_kinds: [route]
    confidence: verified
    method: >-
      статический разбор AST в файле, импортирующем aiohttp: app.router.add_route("GET","/p",h)
      (путь — 2-й арг), app.router.add_get("/p",h) и семейство add_<method> (путь — 1-й арг), а также
      app.add_routes([web.get("/p",h), web.route("GET","/p",h), ...]) — разбор списка-литерала. Путь —
      строковый литерал, начинающийся с "/". Код не исполняется. ref = "file:line|<обработчик-или-путь>".
    honest_limits:
      sees: >-
        add_route/add_<method>/add_routes([...]) со строковым путём-литералом (начинается с "/") в
        файле, импортирующем aiohttp; symbol — имя обработчика либо сам путь.
      does_not_see: >-
        путь-НЕ-литерал (переменная/f-строка); add_routes с аргументом-переменной вместо списка-литерала
        (список собран динамически); маршруты, добавленные через RouteTableDef-декораторы (@routes.get)
        или другой способ; чужой .add_route()/.add_get() в файле без импорта aiohttp.

# ── Планы (намерения, НЕ возможности) ───────────────────────────────────────────────────────────
# status: unsupported + note planned — тот же честный приём, что для планов в capability-index.yaml.
# Здесь перечислены НАПРАВЛЕНИЯ, для которых экстрактор задуман, но кода ещё нет. Заявлять по ним
# поддержку (тем более verified) до появления кода — запрещено инвариантом честных деклараций.
planned:
  - intent: python-web-routes-remaining
    stack: {language: python, frameworks: [flask, fastapi, django, aiohttp]}
    surface_kinds: [route, api]
    status: unsupported
    note: >-
      planned: осталось за пределами реализованных экстракторов маршрутов (python-web-routes,
      django-urls, drf-router, aiohttp-routes) — маршруты, собранные ДИНАМИЧЕСКИ: Flask add_url_rule,
      FastAPI include_router через переменную, Django include(...)-вложенность и class-based view с
      кастомным роутингом, aiohttp RouteTableDef-декораторы (@routes.get) и add_routes с
      аргументом-переменной, любая плагинная регистрация в рантайме. Их доказать статическим разбором
      нельзя — они остаются НЕ verified (пропуск), а не заявляются как возможность.
    honest_limits:
      sees: "будет видеть (когда/если реализуем): часть перечисленного как inferred, не verified"
      does_not_see: "не увидит сейчас: динамически собранные маршруты, маршруты за плагинной регистрацией"
  - intent: cli-commands-remaining
    stack: {language: python, frameworks: [typer, setuptools]}
    surface_kinds: [cli]
    status: unsupported
    note: >-
      planned: осталось за пределами реализованных argparse/click/console_scripts — Typer
      (@app.command() на typer.Typer, не импортирует click), entry_points в исполняемом setup.py
      (аргумент вызова setup()), и любые команды, зарегистрированные в рантайме из данных/плагинов.
    honest_limits:
      sees: "будет видеть: объявления команд Typer и entry_points из setup.py статически"
      does_not_see: "не увидит: команды, зарегистрированные в рантайме из данных/плагинов"
  - intent: ui-screens
    stack: {language: [typescript, javascript], frameworks: [react, react-router, vue-router]}
    surface_kinds: [screen]
    status: unsupported
    note: "planned (W2+): разбор объявлений маршрутов/экранов SPA из исходника."
    honest_limits:
      sees: "будет видеть: экраны/маршруты, объявленные в конфигурации роутинга исходника"
      does_not_see: "не увидит: экраны, собранные динамически; серверный рендеринг вне known-роутера"
