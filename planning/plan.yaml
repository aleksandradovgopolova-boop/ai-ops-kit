    type: quality
    goal: checks-that-run
    status: done
    owner_role: engineer
    depends_on: []
    write_scope: [ai_ops_kit/, installer/]
    value: high
    affects: {engineering_quality_security: true}
    # Кит зовёт git и внешние инструменты; проглоченный rc — ровно тот класс, против которого
    # стоит fail-closed. Механически не правится: каждое место требует решения «падать или нет».
    # СДЕЛАНО 2026-08-11: разобраны 65 мест. Опасными оказались 2 — `git clone` в
    # validate_container_delivery: пустой клон делал проверку «доставлять нечего» ТРИВИАЛЬНО
    # верной (ложный green в валидаторе). Исправлены. ОСТАЛЬНЫЕ 63 — подготовка временного
    # git-репозитория внутри валидаторов (init/config/add/commit): их отказ и так валит проверку
    # ниже, поэтому цена правки выше пользы. Замер и разбор — docs/audit-report.md, R-23.

  - id: coverage-threshold-decision
    title: Решить судьбу --cov без порога — метрика собирается и ни на что не влияет
    type: quality
    goal: checks-that-run
    status: done
    owner_role: qa
    depends_on: []
    write_scope: [pytest.ini, .github/]
    value: medium
    affects: {engineering_quality_security: true}
    # РЕШЕНО 2026-08-12: сделано И то, И другое, потому что это были две разные проблемы.
    # `--cov` убран из addopts (он включал покрытие в КАЖДОМ запуске, поэтому все шесть скриптов
    # гасили его `--no-cov`, а джобы падали на «unrecognized arguments», если забывали pytest-cov)
    # и добавлена отдельная джоба `coverage` с порогом-РАТЧЕТОМ: пол 70% при замере 71%
    # (23 889 инструкций, 7 015 без покрытия). Локальный цикл покрытие не считает — v3.35.1
    # замерил, что это стоило ~2× времени при отрицательной пользе.
    # Побочно: тест-охранник `_addopts_require_cov` читал КОММЕНТАРИИ pytest.ini как настройку и
    # уронил два теста на исправной конфигурации — детектор исправлен, инвариант усилен на явный
    # `--cov` в команде (охранял только исчезнувший путь через addopts).

  - id: ruff-rule-set-widening
    title: Расширять исполняемый набор ruff по одному правилу за решение, каждое со своей уборкой
