    # ДВА УСЛОВИЯ ВЛАДЕЛЬЦА 18.08.2026, без которых сценарий команды не считается выполненным:
    # она НЕ думает о том, как правильно устроить эту работу, а участник НЕ беспокоится, что делает
    # неважное или дублирует чужое. То есть распределение — обязанность кита, а не переписка людей.
    #
    # ГЛАВНОЕ УЖЕ ПОСТРОЕНО, И ЭТО НАДО ЗНАТЬ ДО НАЧАЛА: `next` отвечает не порядком строк, а
    # обоснованием («работает на цель первого приоритета; объявленная ценность высокая») и УЖЕ считает
    # непересечение по `write_scope` — печатает, что можно вести параллельно. Значит «важность» и
    # «непересечение» есть; отсутствует ровно одно — ВЫЧИТАНИЕ ТОГО, ЧТО ДЕРЖАТ ДРУГИЕ.
    # ПОЭТОМУ ЗАВИСИМОСТЬ ЖЁСТКАЯ: пока заявка на работу не видна другим машинам
    # (`parallel-sessions-are-traceable`, там же вопрос о носителе), вычитать нечего — реестр локален
    # (`.ai/runtime/active-work.yaml` в `.gitignore`: замер 18.08 в ките и в дочке). Делать эту работу
    # раньше значит выдать «никто не держит» за проверенное, имея данные одной машины.
    #
