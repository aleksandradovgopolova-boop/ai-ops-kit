    status: waiting_on_owner
    waiting_on: >-
      владелец (или сторонний человек / записанный сценарий) проводит прогон, где несколько участников
      берут работу одновременно, кит сам исключает взятое и называет непересекающееся, и фиксирует
      артефакт квалификации с измеренным «владелец не проектировал этот раскрой руками» — кит не
      измеряет себя сам
    owner_role: product
    value: high
    human_decision: >-
      Что считать «владелец не проектирует параллельность» и кто мерит (сторонний человек либо
      записанный сценарий) — решает владелец; кит не «измеряет сам себя». Родственно зачётному
      zero-touch прогону owner-speaks (#748) — ведём вместе, они одного рода.
    write_scope: [qualification/]
    reason: >-
      Механизм направления доведён и подтверждён полем: заявка видна другим машинам
      (claim_is_visible_to_other_machines), next исключает взятое другими (next_excludes_work_others_hold),
      правки самого кита не создают конфликтов (kit_edits_do_not_create_conflicts — замер 11.09,
      parallel-safety-allows-kit-own-update-prs в истории). Единственный оставшийся исход
      `owner_does_not_design_the_parallelism` по своей природе доказывается НЕ кодом, а ЖИВЫМ замером:
      несколько участников работают одновременно, а раскрой параллельности даёт кит, а не владелец —
      и владелец при этом не толкует внутренние заявки/write_scope и ничего не растаскивает руками.
      Готово, когда такой прогон записан на полигоне и «владелец не проектировал параллельность»
      измерено (артефакт квалификации), а не заявлено. Родственно остатку owner-speaks (#748).

