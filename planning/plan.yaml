      issues_classified_by_type_and_area: false
      duplicates_detected_and_merged: false
      ai_priority_explained_per_task: false
      dependency_graph_built: false

  - id: roadmap-and-delivery
    # заморозка: roadmap + delivery planning — новое умение
    freeze_relation: extension
    status: active
    outcome:
