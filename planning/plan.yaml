    # ЭТО РАБОТА ВЛАДЕЛЬЦА, а не инженера: каждый пункт — порог, обязательность ритуала или предел
    # автономии, и вывести их из кода нельзя. Собраны в один пакет, потому что порознь они тянут
    # решения друг друга.
    #
    # 1. ОБЯЗАТЕЛЕН ЛИ handoff при каждом завершении. Сейчас он пишется только когда рекомендация
    #    советует сменить сессию. Разбор владельца прямо говорит, что `/compact` НЕ обязателен
    #    ритуалом, — про handoff такого утверждения нет, и трактовать молчание нельзя.
    #    Цена «обязателен всегда»: файл после каждой закрытой работы, включая односложные.
    # 2. ПОРОГИ. Контекст 150k/250k/400k и потолок сессии 20M объявлены СТАРТОВЫМИ и подлежащими
    #    калибровке (`SessionEconomyPolicy.md:18-26`, `session_guardrails.py:37-47`). Замер:
    #    сессия `88c802ae` — 85.2M при потолке 20M, то есть вчетверо, и работа шла нормально. Либо
    #    потолок занижен, либо он мерит не то, что важно. Пока он превышен вчетверо, он не порог.
    # 3. КТО РЕШАЕТ ПРО НОВУЮ СЕССИЮ. Сейчас `enforcement=advise` — решение владельца от v3.16.0
    #    (`SessionEconomyPolicy.md:70-77`), и кит технически не может исполнить `/clear` сам.
    #    Вопрос не в этом, а в том, обязан ли кит ОТКАЗАТЬСЯ брать новый блок работы в сессии за
    #    пределом, как `process_spend` отказывается на процессной фазе (единственный блокирующий
    #    механизм в наборе). Цена отказа: владелец теряет право сказать «знаю, продолжай».
    # 4. ПЕРЕЕЗЖАЕТ ЛИ handoff МЕЖДУ МАШИНАМИ. Сейчас нет: `.ai/runtime/` в `.gitignore`, и это
    #    сознательно — состояние одной машины. Цена коммита: handoff доживает до другой машины и до
    #    ревью, но история продукта наполняется служебными файлами каждой сессии.
    # 5. НУЖЕН ЛИ CHECKPOINT как сущность. В разборе он отдельное понятие; в ките носитель есть
    #    только у прогона (`features/<wid>/run-handoff.yaml`), у сессии — нет. Прежде чем вводить,
    #    стоит замерить, отличается ли «промежуточный handoff» от того же файла, перезаписанного
    #    дважды: если нет, сущность не нужна.
    # 6. ЗАПИСЬ РЕШЕНИЯ 2026-08-13. Потолок автономии $3.17 и 4 подсессии выведены замером
    #    (`config/session-economy.yaml:9-16`) и работают в коде, но в `decisions/registry.yaml`
    #    записи НЕТ ни одной — ни про них, ни про пороги контекста. Кит требует ADR от других.
    #
    # ГДЕ ЭТО ОТРАЗИТСЯ КРОМЕ РЕШЕНИЯ: `commands/task/ai-session-start.md` — единственная команда,
    # которую агент исполняет на старте сессии, — не упоминает ни порогов, ни `/compact`, ни
    # `/clear`, ни четырёх исходов вообще. То есть ритуал старта сессии молчит о лимитах сессии.

