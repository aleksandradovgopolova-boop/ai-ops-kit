  - id: ten-questions-answered-on-a-real-ii-sreda-feature
    title: >-
      На ОДНОЙ реальной фиче ии-среды кит отвечает на все десять вопросов её жизни из связанных улик,
      а не генерацией
    type: product
    goal: product-memory-org-intelligence
    status: todo
    owner_role: product
    value: high
    source: "roadmap-direction"
    write_scope:
    - ai_ops_kit/
    - qualification/
    - tests/
    rationale: >-
      Это дословная приёмка направления из ROADMAP, у которой до сих пор не было своей работы: зачем
      возникла / какую проблему решает / для кого / какая гипотеза / почему такое решение / что построили /
      что доказано / что произошло после релиза / чему научились / что делать дальше. Механизм нити
      построен целиком (#1025/#1031/#1102), но карта продукта показывает «доля выпущенных фич с полной
      историей жизни — 0% (0/5)»: построено ≠ населено. Ревью просит того же другими словами — не
      расширять граф, а сделать поверх него ОДИН убийственно полезный сценарий «почему мы вообще сделали
      эту функцию». Фича та же, что у работы close-outcome-learning-loop-with-real-analytics, чтобы не
      разводить два разных доказательства одной нити.

  # graph-name-collision-remainder ОТКЛОНЕНА как дубль 2026-09-23, не начавшись: пока работа
  # заводилась разбором ревью, параллельная сессия закрыла тот же остаток #1109 работой
  # `namesake-cascade-is-named-in-full` (PR #1113) — и шире, чем планировалось здесь. Запись ушла в
  # history/plan-history.yaml со статусом dropped: принцип dp-001, дубли уже построенного отклоняем.
  - id: does-the-scanner-judge-the-installed-kit-at-all
    title: >-
      Должен ли сканер вообще судить установленную копию кита в дочке (`.ai/managed/`)
    type: security
    goal: security-signal-is-actionable
    status: waiting_on_owner
    waiting_on: >-
      это не техника, а граница ответственности. Установленную копию кита дочка не писала и починить
      не может — флаги на ней ей ничего не говорят. Но прощать каталог целиком запрещено осознанно
      (исключение стало бы складом), а прощать поимённо — список вырастет с трёх файлов до всего кита.
      Выбор между «сканер не судит то, чем владелец дочки не управляет» и «сканер смотрит на всё, что
      лежит в репозитории» делает владелец.
    owner_role: product
    value: high
    human_decision: >-
      #1118 снял 16 флагов из 20, остались 4 другой природы: реестр кита со СПИСКОМ ИМЁН правил
      (`.ai/managed/security/security-domains.yaml` — имя в значении yaml, не в комментарии, поэтому
      #1124 его не убрал) и `shell=True` в трёх местах кода самого кита. Рекомендация автора —
      прощать `.ai/managed/` целиком: всё, что там лежит, дочка получает готовым, её решения на это
      не влияют, а целостность слоя держится контрольными суммами кита, а не его же сканером.
      Возражение, которое надо услышать раньше решения: PR обновления кита в дочке тоже проходит
      сканер, и после прощения он перестанет смотреть на то, что обновление привозит.
    write_scope:
    - ai_ops_kit/security/
    - tests/
    rationale: >-
      Перезамер (`qualification/SECURITY-SCAN-NOISE-RESCAN-2026-09-23.md`) показал: из 24 оставшихся
      флагов 4 — про кит, а не про продукт. Пока решения нет, они честно считаются и держат исход
      `scanner_measures_the_product_not_itself` закрытым не до конца.

  - id: independent-judge-rules-on-the-remaining-flags
    title: >-
      Независимый судья выносит вердикт по 24 оставшимся флагам — только он может назвать долю шума
    type: research
    goal: security-signal-is-actionable
    status: waiting_on_owner
    waiting_on: >-
      нужен судья, не писавший этих починок (writer != judge). Исходные 80% получены именно так, и
      сравнивать с ними число, посчитанное автором починок, нельзя — это было бы само-аттестацией.
      Кого сажать судьёй, решает владелец.
    owner_role: reviewer
    value: high
    human_decision: >-
      Счёт флагов объективен и уже снят: 61 -> 24. Вердикт «шум / пограничное / релевантное» по
      каждому из 24 — нет, и без него исход `noise_share_drops_below_one_fifth` (не выше 20%) закрыть
      нечем. Это последняя работа направления.
    write_scope:
    - qualification/
    rationale: >-
      `qualification/SECURITY-SCAN-NOISE-RESCAN-2026-09-23.md` называет эту границу первой из трёх:
      выше в артефакте — счёт, а не вердикт.

  # ══ Направление first-hour-for-a-stranger — взято 2026-09-23 (ревью: acquisition + installation) ══

  - id: install-leads-to-first-result
    title: >-
      Установка ведёт к ПЕРВОМУ РЕЗУЛЬТАТУ, а не к состоянию «кит установлен»: путь до пяти минут
    type: product
    goal: first-hour-for-a-stranger
    status: todo
    owner_role: product
    value: high
    source: "roadmap-direction"
    write_scope:
    - installer/
    - ai_ops_kit/
    - README.md
    rationale: >-
      README честно говорит: полностью автоматической установки нет, «установку в ноль касаний кит не
      заявляет» (сведено работой #1028). Это правда, но правда о состоянии кита, а не о человеке:
      обещание «говоришь что нужно — кит делает» начинается не с первой фичи, а с того, что кит появился
      в проекте. Цель работы — чтобы конец установки был не строкой «установлено», а первым полезным
      результатом, за который человек может взяться.

  - id: measure-first-hour-with-a-stranger
    title: >-
      Замер первого часа человека со стороны: время до первого результата, вмешательства, технические
      решения, сорванные прогоны, переделки
    type: research
    goal: first-hour-for-a-stranger
    status: waiting_on_owner
    waiting_on: >-
      нужен ЧЕЛОВЕК СО СТОРОНЫ — тот, кто кит не ставил и внутрь не смотрел. Кто именно и на каком
      репозитории — решение владельца: подобрать участника кит не может, а owner-led прогон этой планки
      не берёт (все прежние засчёты 14–16.09 осознанно оставляли «незнакомца» отдельной планкой).
    owner_role: product
    value: high
    human_decision: >-
      Все зачётные прогоны вёл владелец. Планка «человек со стороны» — единственное, чем проверяется
      пятый раздел ревью (acquisition), и она требует живого участника, а не кода.
    write_scope:
    - qualification/
    rationale: >-
      Ревью называет пять чисел, которых у кита нет ни одного: время до первого значения, число ручных
      вмешательств, число технических решений, принятых пользователем, сорванные прогоны, переделки.
      Без них «кит уменьшает ручную работу» остаётся утверждением без доказательства — ровно тот класс,
      который кит запрещает сам себе.

  # ══ Направление prove-the-loop-not-add-capabilities — взято 2026-09-23 (мандат ревью) ════════════

  - id: child-value-share-in-product-scorecard
    title: >-
      В карте продукта видно, какая доля работ кита имеет доказательство улучшения хотя бы одной дочки
    type: product
    goal: prove-the-loop-not-add-capabilities
    status: todo
    owner_role: product
    value: high
    source: "roadmap-direction"
    write_scope:
