  #     зеркалах: `quality/required-contexts.yaml` (+ contract-тест) и branch protection (владелец сменил
  #     required ДО слияния). test-taxonomy-baseline и pr-smoke целы; пост-мёрж прогон на main зелёный.
  #   * UX «самодостаточный запуск без PYTHONPATH» (идея снятой ветки v4-remove-tools-stage1): ПРОВЕРЕНО —
