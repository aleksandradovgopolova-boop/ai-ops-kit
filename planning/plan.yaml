  - id: kit-release-strategy
    # НОВАЯ ЦЕЛЬ. Заведена по наблюдению владельца 2026-08-31 (во время владелец-ведомого прогона на
    # cockpit). ПОВОД: релиз 3.38.0 вышел РЕАКТИВНО — staleng-гейт cockpit вынудил выпустить одним
    # куском 235 накопленных изменений, потому что cockpit обновили с main (edge) вместо
    # qualification-тега. Каналы (edge/qualification/stable) и ручки дочки (update_channel ×
    # allowed_version_range × update_policy pr|manual) УЖЕ есть — не хватает ДИСЦИПЛИНЫ сборки релиза
    # у самого кита (по вехе/расписанию, а не когда что-то упало), явного владелец-facing МЕНЮ
    # стратегий и режимов доставки за пределами pr/manual (scheduled-батч, auto-stable). Строить
    # ПОСЛЕ stable (решение владельца) — заморозка к тому времени снята.
    # заморозка: как кит собирает и выпускает релизы + меню обновления дочки — новое умение.
    freeze_relation: extension
    status: achieved
    outcome:
      # Релизы собираются осознанно (веха/расписание), а не когда гейт вынудил.
      releases_are_assembled_by_milestone_or_schedule_not_reactively: true
      # Продукт выбирает стратегию обновления из НАЗВАННОГО меню (канал × политика), а не из
      # закопанных полей.
      products_pick_update_strategy_from_a_named_menu: true
      # Режимы доставки за пределами pr/manual: scheduled-батч и auto-stable для боевых продуктов.
      delivery_modes_beyond_pr_and_manual_exist: true

  - id: uiux-standard-as-product
    # НОВАЯ ЦЕЛЬ. Подтверждена владельцем 2026-08-27 (вариант A). Источник — пакет владельца
    # `ai-ops-uiux`: единый ПРОВЕРЯЕМЫЙ UI/UX-стандарт (Конституция со стабильными ID, токены-
    # контракт, реестры возможностей, Storybook-контракт) вместо тонкого набора чек-листов. Кит
    # УЖЕ имеет тонкий слой дизайна на блокирующих гейтах (ux_review/accessibility_review/
    # design_system_usage, rules/design/*); стандарт внедряется СЛИЯНИЕМ/углублением, не вторым
    # островом. Внедряется волнами (см. работы): 1 — Конституция-источник + реконсиляция ID
    # (наблюдение), 2 — токены + реестры, 3 — углубление ролей-ревьюеров + ui-health, 4 — MCP.
    # Storybook-сторона создания идёт через цель `storybook-as-visual-contract`.
    # заморозка: единый UI/UX-стандарт как продукт кита — новое умение, внедряется волнами.
    freeze_relation: extension
    status: achieved
    outcome:
      # Волна 1 — Конституция становится источником; гейты дизайна ссылаются на её ID (наблюдение).
      # ДОСТИГНУТО 2026-08-28: обе половины влиты — источник (#345, uiux-constitution-is-source) и
      # цитирование ID гейтами дизайна (#354, design-gates-cite-constitution-ids). Наблюдение-уровень:
      # чек-листы несут constitution_id, промпты ревьюеров цитируют ID, силу гейтов не меняли.
      constitution_is_source_and_gates_cite_its_ids: true
      # Волна 2 — токены-контракт + реестры компонентов/паттернов/шаблонов доступны агенту.
      # true (#418): реестры standards/uiux/registries/tokens.yaml (контракт дизайн-токенов) и
      # capabilities.yaml (сквозные возможности UI-системы) добавлены как ПРОВЕРЯЕМЫЕ данные — их
      # читает и валидирует standards/uiux/scripts/validate-registries.py (ссылочная целостность:
      # dangling rule/token/namespace/local), схема uiux-registry.schema.json признаёт оба kind.
      tokens_contract_and_capability_registries_available: true
      # Волна 3 — ревьюеры и ui-health углублены содержанием Конституции.
      reviewers_and_ui_health_deepened_from_constitution: true
      # Волна 4 — MCP-доступ к UI-системе (get_*/validate_*).

# ЧТО ЗДЕСЬ ЛЕЖИТ, А ЧТО НЕТ (`plan-as-control-plane`, 2026-08-14). Активный план — это ответ на
# четыре вопроса управления: где мы, что идёт сейчас, что блокирует и чем, какую работу взять
# следующей. Поэтому здесь ТОЛЬКО незакрытая работа (`todo`/`in_progress`); закрытая, вместе со
# своим разбором, уезжает в `history/plan-history.yaml`. Повод — замер: 21 работа из 32 была `done`,
# и чтобы ответить «что идёт», приходилось вычитывать разбор давно оплаченных дефектов.
#
# ПРАВИЛА ПРОВЕРЯЕТ КОД (`delivery_plan.validate` / `validate_history`), а не соглашение:
#   * `done`/`dropped` в этом файле — ошибка: место закрытой работы в истории;
#   * указан `pr` при статусе `todo` — ошибка: PR существует, значит работа начата;
#   * `in_progress` без `pr`/`branch` — предупреждение: состояние работы негде посмотреть;
#   * `evidence`/`finding` обязаны резолвиться от корня: ссылка на доказательство, которого нет,
#     хуже её отсутствия;
#   * в истории `done` обязан назвать РЕЗУЛЬТАТ и место перепроверки (`pr`/`commit`/`evidence`);
#     merged PR сам по себе результатом не считается.
#
# ЧЕГО ЗДЕСЬ НЕТ ОСОЗНАННО: каталога `findings/`. Реестр находок в ките уже есть —
# `docs/audit-report.md` (R-01…R-41) плюс отчёты в `qualification/`; заводить второй означало бы
# развести две правды об одной находке (принцип `dp-001`: дубли уже построенного отклоняем).

