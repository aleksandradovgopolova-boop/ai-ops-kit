  - id: second-brownfield-run
    title: Провести установку и задачу до verified PR на втором реальном brownfield-репозитории
    type: delivery
    goal: second-real-brownfield
    status: in_progress
    owner_role: delivery
    depends_on: [ci-lint-job-proven]
    write_scope: [qualification/]
    value: high
    affects: {delivery_operations: true, analytics_learning: true}
    # Проверяемо глазами владельца: установка и onboarding без вмешательств, DeliveryReceipt с
    # sha_verified=true, названная стоимость прогона. Требует провайдер-ключей и тулчейна стека —
    # объявленная эксплуатационная предпосылка (v3.8.0-plan.yaml -> blocked_by), не дефект.
    #
    # ВЫБОР РЕПОЗИТОРИЯ (owner-review 2026-08-12): максимально НЕ похожий на первый — другой стек,
    # существующая история, реальная БД, свой CI, frontend+backend, нестандартная структура,
    # живые продуктовые артефакты. Полный путь: install -> model -> реконструкция -> вопросы
    # владельцу -> bootstrap -> next -> РЕАЛЬНАЯ продуктовая задача -> implementation -> review ->
    # exact-SHA verification -> draft PR.
    #
    # ГЛАВНЫЙ КРИТЕРИЙ — не сколько тестов прошёл кит, а сколько раз человеку пришлось стать его
    # техническим оператором. Цель прогона:
    #   технических вмешательств владельца = 0
    #   ложных green = 0
    #   необоснованных вопросов = 0
    #   придуманных продуктовых фактов = 0
    #   verified PR = 1
    # Эти пять чисел и есть приёмка; «прогон прошёл» без них — заявление шире полученного.
    #
    # ПОПЫТКА 1 — 2026-08-12, severnaya_traektoriya (Vite/React TS, 72 коммита, без БД и CI).
    # ОСТАНОВЛЕНА на онбординге, отчёт: qualification/REAL-PRODUCT-SEVERNAYA-2026-08-12.md.
    # Замер метрик: вмешательств 0, необоснованных вопросов 0, ложных green 2, придуманных
    # продуктовых фактов 1, verified PR 0. Останов осознанный: кит выдал факт со статусом
    # «подтверждено», опираясь на СВОЙ ЖЕ артефакт (F-019) — доводить такой прогон до PR значило бы
    # получить зелёное на ложном основании.
    # Найдено и закрыто: F-018 (doctor рапортовал «✓ артефакты на месте» про свои черновики) и
    # F-019 (`ci_pipeline: verified` по `.github/workflows`, куда установщик сам положил файлы;
    # плюс evidence указывал не туда, где взяты значения).
    # ПОПЫТКА 2 (частичная, read-only) — 2026-08-12, ii-sreda по выбору владельца. Исправления
    # F-018/F-019 ПОДТВЕРЖДЕНЫ на репозитории с настоящим CI (9 workflow, 6 не китовых):
    # придуманных фактов 0, evidence называет источник значений, классификация EXISTING_PRODUCT
    # confidence=high с фактическими основаниями. Заявка про FSD-ловушку (`entities/` — не модель
    # данных) тоже подтверждена: ложного срабатывания data_contracts нет.
    # НО сценарий B и здесь невозможен: БД внешняя, в репозитории ни схемы, ни миграций, ни
    # DataMap — гейту нечего сверять. Полный прогон не запускался: репозиторий под активной
    # разработкой (ветка base/evals-stack, 11 незакоммиченных изменений, коммит 7 часов назад).
    # ПОВТОР нужен на репозитории с РЕАЛЬНОЙ БД и СВОИМ CI — тогда же закрывается сценарий B
    # обкатки contour_consistency. Полностью подходящий кандидат (msh_news_bot_v2: Python,
    # PostgreSQL+pgvector, 9 workflows, 493 коммита) исключён владельцем; нужен другой такой же.
    # Установка из него откачена побайтово — дерево чистое, SHA не изменён.

  # ─── green-means-checked (находки живых прогонов в дочках) ──────────────────────────────────
  - id: child-repo-hygiene
    title: Кит не сорит в истории дочки и не снимает проверки с её PR (F-020, F-021)
    type: engineering
    goal: green-means-checked
    status: done
    owner_role: engineer
    depends_on: []
    write_scope: [installer/, templates/ci/]
    value: high
    affects: {delivery_operations: true, engineering_quality_security: true}
    # ЗАКРЫТО 2026-08-12 по двум находкам живого прогона в ии-среде. Обе — про границу между китом и
    # чужим репозиторием, там же, где живут почти все находки обкаток.
    # F-020 (P1): `templates/ci/ai-ops-record.yml` коммитил снимок эффекта с `[skip ci]`. Петлю
    #   пометка не предотвращала (её предотвращает GitHub: пуш под GITHUB_TOKEN не перезапускает
    #   workflow — так и было написано в шапке того же файла), зато когда коммит снимка оказывался
    #   вершиной ветки, GitHub гасил ВСЕ проверки PR: «no checks reported». Ветка выглядела зелёной
    #   потому, что проверок не было вовсе. Замер: два PR дочки оживляли пустым коммитом.
    # F-021 (P2): установщик не писал в дочку `.gitignore` вовсе — граница была ОБЪЯВЛЕНА в
    #   tests/unit/test_installer.py и не закрыта. В поле в коммит владельца пытались уехать
    #   `.ai/worktrees/` (вложенный репозиторий), `.ai/runtime/active-work.yaml` и `.lock`,
    #   `.ai/usage/product-ledger.jsonl`, `.ai/reevaluate-evidence-*.json`. Правило доставляется
    #   через `deliver_assets` (единственная точка доставки), поэтому доедет и до УЖЕ подключённых
    #   дочек; чужой `.gitignore` дополняется отмеченным блоком, дописка названа в отчёте.
    # Тесты: обе половины у каждой находки. У F-021 обратная сторона проверяется вопросом К GIT
    # (`git check-ignore`): продуктовые артефакты (.ai/managed, .ai/project, .ai/custom, features)
    # НЕ скрыты — иначе находка «закрывалась» бы строкой `.ai/`.

  - id: update-policy-enforcement
    title: Решить, что делает `update` при update_policy pr — сейчас поле обязательно и не читается (F-022)
    type: engineering
    goal: green-means-checked
    status: todo
    owner_role: delivery
    depends_on: []
    write_scope: [installer/, templates/ci/]
    value: high
    affects: {delivery_operations: true, engineering_quality_security: true}
    human_decision: >
      что должен делать локальный `ai-ops update` при `parent.update_policy: pr` — отказываться и
      печатать точную команду, или применять только под явным признаком CI/PR-пути
    # НАЙДЕНО 2026-08-12 в поле (ии-среда) и ПОДТВЕРЖДЕНО по коду. `parent.update_policy`
    # ОБЯЗАТЕЛЕН по схеме конфига дочки (`schemas/child-config.schema.json` -> required,
    # enum [pr, manual]), манифест объявляет `silent_update: forbidden`, а установщик печатает
    # владельцу вслух: «обновления — только через ваш PR». При этом значение НЕ ЧИТАЕТ ни одна
    # строка кода: единственные попадания `update_policy` в Python — это
    # `manifest.update_policy.managed_set`, другой ключ в другом файле.
    # Замер в поле: `.ai/runtime/last-update-report.json` дочки с `update_policy: pr` показывает
    # 3.36.4 -> 3.36.8 (88 файлов, миграция 3.33-to-3.34), `pull_request: null`,
    # `human_approval_required: false` — применено НА МЕСТЕ, посреди продуктовой задачи.
    # ПОЧЕМУ ТРЕБУЕТ РЕШЕНИЯ, А НЕ ПРАВКИ: CI-путь (`templates/ci/ai-ops-update.yml`) обновляет и
    # САМ открывает PR, для него применение на месте легитимно. Нарушение — только у локального
    # вызова, значит нужно либо различать пути явным признаком, либо запрещать локальное
    # применение. Выбор меняет поведение главной команды установщика.
    # РЯДОМ, та же природа: коммит `report-history` конфликтует сам с собой при слиянии ветки в
    # main — журнал дописывается с двух сторон. У дочки так вышло дважды подряд.

