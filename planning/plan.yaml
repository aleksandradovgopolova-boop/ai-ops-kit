  - id: warning-noise-in-user-output
    title: Предупреждение интерпретатора не уходит в пользовательский вывод безымянным
    type: quality
    goal: green-means-checked
    status: done
    owner_role: engineer
    depends_on: []
    write_scope: [ai_ops_kit/, tests/]
    value: high
    affects: {engineering_quality_security: true}
    # ОТКУДА: `qualification/REAL-PRODUCT-NITI-FULLPATH-2026-08-12.md` -> F-022, не исправлено.
    # ЧТО ВИДЕЛ ВЛАДЕЛЕЦ: `<unknown>:11: SyntaxWarning: "\ " is an invalid escape sequence`
    # посреди вывода прогона. Мелочь по последствиям и НЕ мелочь по адресу: канал, который обещает
    # «наружу — смысл», отдал человеку сообщение, чей источник не назван даже интерпретатору
    # (`<unknown>` = компиляция строки, а не файла). Владелец не может ни починить, ни игнорировать
    # осознанно: он не знает, что предупредило.
    # ПОРЯДОК: сначала НАЙТИ источник (какая строка компилируется на лету), потом чинить escape.
    # Глушить warnings целиком нельзя — это спрятало бы и будущие настоящие; речь о том, чтобы
    # предупреждение либо не возникало, либо называло себя.
    # ЗАМЕР ПРИЁМКИ: прогон `ai-ops model` + `run --execute` на чистом дереве — 0 строк
    # `SyntaxWarning` в пользовательском канале.
    # СДЕЛАНО 2026-08-13. `value` поднят low -> high ПОСЛЕ поиска источника: находка оказалась
    # верхушкой, а не косметикой, и цену стоит называть по тому, что нашли, а не по тому, как
    # выглядело.
    # ИСТОЧНИК НАЙДЕН (порядок соблюдён): предупреждение шло из СТАРОЙ копии самого кита в дочке —
    # `.ai/managed/tools/context_hybrid.py` версии 3.27.7, где докстринг ещё не был raw-строкой.
    # Свой файл кит починил 08.08 (8f6aac4), но у дочки лежала копия ДО правки, и кит разбирал её
    # как код продукта: `.ai/` не было в списке пропуска обхода.
    # ЗАМЕР НА niti (Next.js/Turborepo, собственного Python нет вовсе):
    #   было  6601 файл в графе (4094 python + 2507 js/ts), из них 5719 внутри `.ai/`;
    #         python — 4094 из 4094, то есть 100%: 1891 бэкапы старых версий, 1650 один worktree,
    #         241 managed; js/ts — 1625 из 2507 (64%), каждый реальный файл считался трижды;
    #   стало 882 файла, в `.ai/` — 0. 882 совпадает с независимо посчитанным настоящим кодом.
    # ЦЕНА БЫЛА НЕ КОСМЕТИЧЕСКОЙ: по этому графу считаются `impact()` и `affected_tests()` —
    # «какие тесты задеты правкой». На входе из чужих файлов ответ либо про кит, либо пустой.
    # ПОЧИНЕНО ДВЕ ПОЛОВИНЫ: (1) `.ai/` ушёл из обхода — и для python, и для js/ts (списки сведены
    # в `PY_SKIP_DIRS`/`JS_SKIP_DIRS`, чтобы не разъезжались); (2) `filename=` во ВСЕХ четырёх
    # `ast.parse` — предупреждение называет файл вместо `<unknown>`. Вторая нужна отдельно: даже
    # законный файл продукта обязан быть адресуемым. Глушить warnings нельзя — спрятало бы настоящие.
