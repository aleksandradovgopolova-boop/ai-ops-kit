    # duties.example.yaml`), следит за статусом и доставляет утром; исполняет движок под policy,
    # budget и гейтами. Инвариант «Robin read-mostly» не ослабляется.
    # УТРОМ — ОДИН БРИФ, а не отчёт о ста проверках: главное одним предложением, что изменилось со
    # вчера, что требует решения (максимум три вопроса), ЧЕГО СИСТЕМА НЕ СТАЛА ДЕЛАТЬ И ПОЧЕМУ, и
    # одна рекомендация дня. Раздел «не стала делать» обязателен: именно он строит доверие.
