  - id: reviewer-prompt-uses-xml-anchors-measured
    title: >-
      Секции промпта ревьюера размечены XML-якорями — и это ЗАМЕРЕНО на корпусе вердиктов, а не
      принято на веру
    type: engineering
    goal: green-means-checked
    status: todo
    owner_role: engineer
    value: medium
    write_scope: [ai_ops_kit/engine/, ai_ops_kit/gates/, tests/]
    reason: >-
      Повод — разбор с владельцем 20.08.2026 (статья про XML vs JSON в контексте LLM). РАЗВЕДЕНЫ два
      вопроса: формат данных НА ДИСКЕ (наши 50 JSON-схем — машинные контракты, модель их не читает,
      не трогаем) и структура ПРОМПТА, подаваемого модели. Утверждение статьи про промпт: чёткие
      секционные якори (XML-теги) держат точность на длинном контексте, тогда как сплошной блок
      деградирует. НАПРАВЛЕНИЕ верное и совпадает с прямой рекомендацией Anthropic (Claude обучен на
      XML-теги); КОНКРЕТНЫЕ ЦИФРЫ статьи (99.5%, −30%) — блогерский пересказ без воспроизводимого
      бенчмарка, на веру не берём. Замер поля по нашему коду: промпты кита разделяют секции
      маркерами `=== ЗАДАЧА ===`, XML-тегов нет; самое чувствительное место — промпт СУДЬИ/РЕВЬЮЕРА
      на длинном контексте (дифф + evidence + критерии). Готово, когда: секции промпта ревьюера
      обёрнуты в XML-якори (`<diff>`, `<criteria>`, `<evidence>`, `<task>`), и это ИЗМЕРЕНО на
      корпусе судейских вердиктов, построенном линией C (#216, C1): те же дифы дают вердикт не менее
      стабильный, чем сейчас. Если замер не показал выигрыша — фиксируем это как факт и НЕ меняем
      ради моды (вывод остаётся JSON/structured output — там форму обеспечивает провайдер, это
      правильно и уже делается). Границы: НЕ трогаем JSON-схемы на диске; не меняем формат ВЫВОДА;
      речь только о разметке ВХОДА судейского промпта. Территория пересекается с линией C —
      согласовать, чтобы не столкнуться в промпте ревьюера.

