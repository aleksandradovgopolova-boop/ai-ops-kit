    # ЦИТАТОЙ. Форму держит новый валидатор `validate_acceptance_result` (74-й).
    # ГЛАВНОЕ РЕШЕНИЕ РАБОТЫ — цитата проверяется КОДОМ (`_ground_quote`: дифф, затем названный файл).
