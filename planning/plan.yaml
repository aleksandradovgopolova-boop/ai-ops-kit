      product_memory_coverage_measured: true
      # Слоты outcome-охвата и learning-to-decision стоят каркасом (честное «не измерено»); наполнение — с петлёй. ЗАКРЫТ (PR #1040): метрики 4/5 стоят честным «не измерено» с причиной.
      outcome_and_learning_metric_slots_stand_honestly: true

