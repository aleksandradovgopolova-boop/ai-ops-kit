    # ПОВОД — ЗАМЕР, а не ощущение. Потолок объёма managed поднимали 2026-08-13 (3.2 -> 3.3) с
    # запасом 73 670 Б. За ОДНИ СУТКИ запас съеден до 297 Б, и ни один из четырёх PR этого не
    # заметил: тест краснеет только на СЛЕДУЮЩЕМ коммите после исчерпания. Разбивка записана в
    # `tests/unit/test_installer.py` рядом с потолком — 66 138 Б из 73 372 пришли одной группой
    # работ (#96..#99), а упёрлась в стену правка на 6 520 Б, пришедшая последней.
    # ЧТО ИМЕННО НЕ РАБОТАЕТ. Проверка бинарна: «влезли» / «не влезли». Она не отвечает на вопрос,
    # который единственно полезен ЗАРАНЕЕ: «сколько запаса осталось и с какой скоростью он тает».
    # Поэтому дрейф виден только тому, кто пришёл последним, — и цена (поднять потолок либо резать
    # свою правку) достаётся не тому, кто её создал.
    # ПРЕДЛОЖЕНИЕ (не решение, решать при взятии): порог предупреждения на доле от потолка —
    # при остатке меньше ~10% сообщать в вывод прогона, оставаясь зелёным. Тогда исчерпание
    # называется В ТОТ прогон, где оно происходит.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: превращать потолок в advisory. Он блокирующий не случайно — это то же
    # число класса DERIVED, что и замеры слоёв; предупреждение добавляется К нему, а не ВМЕСТО.

