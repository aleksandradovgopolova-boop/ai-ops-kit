    # неправды, которых он не мог увидеть ни одним механизмом:
    #   OK-04: README и шесть файлов docs/ описывали продукт, брошенный 06.08 (Tauri, AeroSpace,
    #          списки проектов и задач). `contour_consistency` не срабатывает никогда: он сверяет
    #          ИЗМЕНЕНИЕ с источником истины, а испорченную документацию никто не трогал. Датная
    #          свежесть тоже мимо — `repo_audit._is_stale` считает недатированный документ свежим,
    #          а порог 180 дней против порчи ЗА ВОСЕМЬ ДНЕЙ (смена платформы, а не старение).
    #   OK-05: план отстал на 31 изменение, а `status` весь день отвечал «работа не начата».
    #          Артефакты читаются, история репозитория — нет.
    # Обе нашёл ВОПРОС ВЛАДЕЛЬЦА («а документация тоже сохранена?»), а не кит. Класс тот же, что
    # B2-18: не ложное утверждение, а МОЛЧАНИЕ там, где данных достаточно, чтобы сказать.
    # ПРЕДЛОЖЕНИЕ (решать при взятии) — две дешёвые проверки, обе механические:
    #   (а) `docs_reality`: в документе-источнике истины мёртвая команда (`npm run X` без X в
    #       scripts), мёртвый путь (`src-tauri/`, `commands/launcher.rs`) или мёртвая технология
    #       (есть в тексте, нет ни в зависимостях, ни в дереве). Порог доклада — «мёртвых ссылок
    #       больше, чем живых», исторические разделы пропускаются;
    #   (б) `plan_behind_history`: слияний в основную ветку с даты установки больше N, объявленных
    #       работ за тот же период ноль. Место — тот же ответ `status`, где сейчас «работа не начата».
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: чинить это ещё одной джобой в CI. Проверка нужна там, где человек
    # СПРАШИВАЕТ — в `status`, `next` и закрытии работы, — иначе она снова расскажет всё логам.
    # ЕЩЁ ОДНА НАХОДКА ТОГО ЖЕ ДНЯ, НЕ ЗАКРЫТАЯ ЗДЕСЬ (OK-06): за весь день интент-путь не
    # использован ни разу после онбординга — задачи были размером в две минуты («скругление
    # больше»), и цикл заявки тяжелее правки. Кит не заметил ни обхода, ни 31 изменения мимо
    # своего контура. Нужна либо дешёвая полоса для мелкой итерации, либо честно названная граница
    # правила «веди любую продуктовую задачу через кит».

