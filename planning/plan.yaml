    # расхождение окружения. Теперь путь вычисляется один раз (`providers.claude_binary`) и им же
    # исполняется; `AI_OPS_CLAUDE_BIN` — явное слово владельца, сильнее PATH.
    # Отсутствие бинаря: названная причина ДО запуска (что искали, ГДЕ искали — реальный PATH
    # процесса кита, почему так бывает при живом claude в терминале, три выхода). Исчезновение пути
    # между проверкой и запуском — своя причина и БЕЗ ретраев (файл не появится от повтора).
    # Явно выбранный провайдер больше не остаётся непроверенным: слово человека не оспаривается, но
    # об отсутствии сказано до прогона, а не после разбора, плана и подготовки дерева.
    # Попутно: предупреждение печатало «провайдер: mock» намертво — для нового случая это ложь о том,
