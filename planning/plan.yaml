    value: high
    affects: {engineering_quality_security: true}
    # ЗАКРЫТО 2026-08-11. Разобраны все 49 мест; правило оказалось НЕ «сузить типы везде».
    # (а) Гашение искажало ВЕРДИКТ или ЧИСЛО -> исправлено:
    #     validate_feature_blueprint (битая DeliveryReceipt не равна отсутствующей),
    #     kit_observability (непрочитанное называется в отчёте),
