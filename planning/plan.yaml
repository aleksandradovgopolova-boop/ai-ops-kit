    # расхождение окружения. Теперь путь вычисляется один раз (`providers.claude_binary`) и им же
    # исполняется; `AI_OPS_CLAUDE_BIN` — явное слово владельца, сильнее PATH.
    # Отсутствие бинаря: названная причина ДО запуска (что искали, ГДЕ искали — реальный PATH
