    # ЧТО ИМЕННО СДЕЛАТЬ: прогон, который в одноразовом репозитории (git init или репозиторий-
    # фикстура) проходит путь владельца целиком — install -> doctor -> onboard -> specify -> plan ->
    # next -> status — и падает на том, на чём падал владелец: точка входа `./ai-ops` в дочке,
    # разбор `<интент> "текст" --feature X`, состав поставки валидаторов, валидность плана дочки
