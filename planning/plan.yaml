    # false-positive rate — тот же ложный green, только теперь он коммитит.
    # ГЛУБИНА ДВУХУРОВНЕВАЯ: ежедневно delta по изменениям с последнего ПОДТВЕРЖДЁННОГО обзора
    # (файлы, зависимости, документы, тесты, stories, границы пакетов, статусы плана, состояние CI);
    # полное перечитывание продукта каждую ночь не делаем — дорого, шумно, повторяет одни находки.
