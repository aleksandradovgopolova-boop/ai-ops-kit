    # ПРЕДУПРЕЖДЕНИЕ «ни pr, ни branch» ОСТАВЛЕНО НАМЕРЕННО и верно по существу: состояние
    # этой работы живёт в ДРУГОМ репозитории, а поля для этого в плане нет. Написать сюда
    # ветку кита значило бы соврать ради зелёного, а это ровно то, против чего стоит кит.
    # Гап назван; заводить под него работу — решение владельца, а не моё молчаливое.
    # ВОЗВРАЩЕНО В РАБОТУ 19.08.2026 при разборе плана. Работа была объявлена
    # закрытой без названного результата, и улики говорят обратное:
