    # ПРОБЕЛ НАЗВАН ВНЕШНИМ РАЗБОРОМ 17.08.2026 и признан настоящим: набор метрик квалификации мерит
    # КАЧЕСТВО ОДНОГО ПРОГОНА (ложный green, доля правок, доведён ли PR), но не КРИВУЮ. Без неё цикл
    # «прогон -> находка -> починка -> прогон» ощущается развитием при любом результате: находок
    # много, они закрываются, и незаметно, сокращается ли расстояние владельца до результата
    # (принцип ep-2026-08-17-distance-from-intent-to-verified-result).
    #
    # ЧТО ИЗМЕРЯТЬ (величина, а не ощущение): между двумя попытками владельца пройти путь до
    # проверенного PR — сколько правок КИТА потребовалось, скольких из них хватило одной, и сколько
    # раз пришлось трогать одно и то же место. Замер за 17.08.2026, который эта метрика показала бы
    # первым: три работы кита за день (F-032, F-033, диагностика запуска провайдера) — все три о том,
    # что механизм не доезжает до владельца или падает у него.
    # ЧЕГО НЕ ДЕЛАТЬ: считать по числу PR или коммитов. Это мера активности, а не расстояния;
    # активность росла бы и при ухудшении. Источник — прогоны квалификации и находки поля, привязанные
    # к попытке, а не календарь.

  # ─── локальный прогон не равен CI, и это скрывает настоящую красноту ────────────────────────
  - id: local-run-must-mirror-ci
    title: На машине разработки пять проверок красные всегда — при зелёном CI
    type: engineering
    goal: green-means-checked
    status: todo
    owner_role: engineer
    depends_on: []
    write_scope: [tests/, devtools/, docs/]
    value: medium
    affects: {engineering_quality_security: true}
    # ЗАМЕР 17.08.2026 (не догадка): полный локальный прогон на `main` без каких-либо правок даёт
    # 5 failed, 2370 passed. Тот же коммит в CI — зелёный (package-quality на main, 08:14).
    # Красные: test_evidence_scope::test_script_announces_the_scope_it_actually_gives,
    # test_validator_bootstrap::test_missing_bootstrap_is_caught,
    # test_validator_runtime_contract::test_standalone_validator_is_green_from_a_copy[
    # validate_context_qualification] и ::test_corrupted_source_of_truth_is_caught[
    # registry/providers.yaml, registry/workflows.yaml].
    #
    # ПРИЧИНА НАЙДЕНА, А НЕ ПРЕДПОЛОЖЕНА. Четыре из пяти зеленеют в ЧИСТОМ venv (pyyaml + pytest +
    # hypothesis, без editable-установки): в рабочем `~/.venvs/ai-ops-kit` кит стоит editable, его
    # finder отдаёт пакет из `~/ai-ops-kit` ЛЮБОМУ подпроцессу — поэтому пробы, которые копируют
    # валидатор в отдельный каталог и портят там источник правды, читают не свою копию, а рабочий
    # клон. Они краснеют, сообщая «порчу не заметили», хотя не заметили её из-за окружения. Это тот
    # же класс, что и главный урок `fixes-must-reach-the-child`: проба мерила не то дерево.
    # Пятая (охват evidence) краснеет по другой причине и она содержательнее: скрипт объявляет
    # охват по `python3` из PATH (здесь homebrew 3.14 без pytest), а тесты идут другим
    # интерпретатором — то есть ОБЪЯВЛЕННЫЙ охват может не совпасть с измеренным. В CI это
    # совпадает случайно, потому что там интерпретатор один.
