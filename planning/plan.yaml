# planning/plan.yaml — delivery plan самого AI Ops Kit.
#
# Уровень МЕЖДУ направлением (`ROADMAP.md`) и прогоном. По этому файлу `ai-ops next` отвечает на
# четыре вопроса: где мы, что идёт сейчас, что блокирует и чем, какую работу взять следующей.
#
# ПОЧЕМУ ФАЙЛ ПОЯВИЛСЯ (ревизия 2026-08-11). Кит требует план от каждого подключённого
# репозитория, а у себя не имел его вовсе: `roadmap.check()` сверяет цели с планом только когда
# план есть, поэтому связка «направление ↔ работа» у кита не проверялась ничем, а `ai-ops next`
# на самом ките не мог ответить «что взять следующим». Цели здесь — те же id, что в `ROADMAP.md`.
#
# ОТКУДА ВЗЯТА РАБОТА. Это подтверждённый остаток ревизии (`docs/audit-report.md` §6) и объявленные
# разрывы репозитория (`qualification/bootstrap/v3.8.0-plan.yaml -> future_opportunities`,
# `registry/release-claims.yaml -> standing_boundaries`). Ничего не придумано: у каждой работы есть
# место в репозитории, где она обоснована. Что требует решения владельца — помечено
# `human_decision` и НЕ имеет статуса `todo` как будто это уже решено.
#
# Три правила (проверяет `validate_product_model.py` -> `delivery_plan.validate`):
#  1. Статус — только тот, которого код не знает: todo / in_progress / done / dropped.
#     `ready` / `blocked` / `waiting` кит считает сам из зависимостей и гейтов.
#  2. Роль, а не исполнитель: runtime/model/provider/assignee/agent запрещены проверкой.
#  3. id — slug нижнего регистра: такой же, как требует движок для `--feature`.
schema_version: 1
kind: delivery-plan

goals:
  # ЗАМОРОЗКА УМЕНИЙ (`freeze_relation`, работа `capability-freeze-enforced`, 19.08.2026).
  # Решение владельца `ep-2026-08-17-capability-freeze-until-second-brownfield`: новое умение не
  # принимается, пока исход `owner_reaches_verified_pr_without_patching_the_kit` не стал верным.
  # Оговорка: работа, которая снижает цену процесса, замыкает обратную связь из поля или закрывает
  # найденный полем дефект, новым умением НЕ считается.
  #
  # ПОЧЕМУ ПОМЕТКА НА ЦЕЛИ, А НЕ НА РАБОТЕ: сама оговорка сказана про НАЗНАЧЕНИЕ работы, и
  # проверять её по формулировке заявки — значит открыть лазейку через слова (это названо в самом
  # решении). Цель — уровень, где назначение уже объявлено владельцем и не переписывается под
  # задачу. Работа может запросить исключение только явно (`freeze_exception: <причина>`), и
  # причина обязательна — молчаливого обхода нет.
  #
  # КЛАССИФИКАЦИЯ ВЫВЕДЕНА ИЗ ТРЁХ ОГОВОРОК РЕШЕНИЯ, а не из вкуса; она ОБРАТИМА (`two-way`) и
  # правится владельцем одной строкой. Пять целей помечены `extension` — их работы кит перестаёт
  # предлагать, пока заморозка держится: `advisory-gates-obkatka`, `storybook-as-visual-contract`,
  # `owner-speaks-product-not-pipeline`, `nightly-product-review`, `outcome-and-analytics-loop`.
  # ПОВОД БЫЛ ЖИВОЙ: 18.08 кит сам предложил взять `watch-contract-for-night-review` — работу из
  # замороженной цели, — потому что решение существовало записью и ничем не сверялось.
  #
  # СНЯТИЕ ЗАМОРОЗКИ — НЕ ДАТА И НЕ ФЛАГ: тот самый исход, ставший верным. Проверка читает его из
  # цели `second-real-brownfield`, поэтому «разморозить вручную» технически нечем.
  #
  # Порядок = приоритет. Те же id и тот же порядок, что под «Сейчас» и «Следующий результат»
  # в ROADMAP.md: расхождение кит покажет сам (`ai-ops next`).
  - id: one-feature-end-to-end
    # North Star из независимого продуктового ревью владельца (14.09.2026): упрощение и
    # доказанность, а не расширение. Эпик #958.
    freeze_relation: extension
    # PRODUCT-FREEZE ЭТАПА СНЯТ 2026-09-16: правило «не берём новые capability, пока один вертикальный
    # срез не пройден и не доказан» ИСПОЛНИЛО роль — срез доказан ЖИВЫМ ПРОГОНОМ на ии-среде (владелец
    # сделал несколько реальных фич через кит, кит нигде не показал технику, владельцу ок). Решение
    # ep-2026-09-16 держало freeze до живого внешнего прогона — прогон состоялся. Снятие записано
    # решением ep-2026-09-16b (freeze снят по owner-led прогону на ии-среде).
    status: achieved
    outcome:
      # Единый вход «что изменить?»: пользователь описывает изменение и НЕ видит внутренних
      # сущностей (feature id / YAML / агент / workflow / гейт / provider / engine) до PR.
      # ДОСТИГНУТ 2026-09-16 РЕШЕНИЕМ ВЛАДЕЛЬЦА (кит себя не судит, засчёт за владельцем — как #745/#748).
      # Слито: specify без feature id/CLI и с эхом «Поняла: «…»» (#959), status/explain говорят
      # продуктом без заявок/веток/worktree (#973), explain next-step без work-id (#976). Перемер
      # 15.09 (qualification/ONE-FEATURE-SLICE-REMEASURE-2026-09-15.md) подтвердил чистым. Оговорка в
      # артефакте (мерил опсик новым кодом; чистый живой замер на релизнутом ките — впереди) флипа не
      # отменяет — засчёт сделал владелец.
      one_input_hides_the_pipeline: true
      # ФЛИПНУТЫ в true 2026-09-16 РЕШЕНИЕМ ВЛАДЕЛЬЦА (засчёт за владельцем, кит себя не судит — как
      # #745/#748/#701). Основание: ЖИВОЙ owner-led прогон на ии-среде (v4.4.2) — владелец сделал
      # НЕСКОЛЬКО реальных фич через кит, кит НИГДЕ не показал технику (feature id / YAML / агенты /
      # стадии / гейты), владельцу ок. Код всех пяти осей доведён и влит (specify/status/explain/propose
      # продуктом; Verified=уровень знания #985; Outcome-readout #987; outcome-loop→next #988).
      # Отчёт: qualification/ONE-FEATURE-EXTERNAL-RUN-ii-sreda-2026-09-16.md. ОГОВОРКА, ПРИНЯТАЯ
      # ВЛАДЕЛЬЦЕМ ОСОЗНАННО: прогон owner-led, не «человек совсем со стороны» — планка «незнакомец»
      # остаётся отдельной, флипа не отменяет (как и во всех прежних owner-led засчётах).
      #
      # Результат — «Verified — вот почему» (проверены продуктовое решение / архитектура / тесты /
      # безопасность / контракты аналитики), а не перечень гейтов и их числа.
      verified_is_shown_as_trust_not_gate_list: true
      # Человек называет/подразумевает риск (LOW/MEDIUM/HIGH), кит сам подбирает контроль; человек
      # НЕ выбирает стадии, агента или workflow.
      risk_selects_the_process_not_the_human: true
      # После merge кит возвращается и показывает, что стало с продуктом (outcome измерен/связан),
      # а не заканчивается на PR.
      after_merge_kit_shows_what_happened_to_the_product: true
      # Кит САМ советует, что нужно продукту (возможности, следующие шаги, где ценность и где риск)
      # человеческими словами — не ждёт, пока владелец придумает. Опора — слой продуктовой памяти.
      kit_recommends_what_the_product_needs: true

  - id: security-signal-is-actionable
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-23 из независимого продуктового ревью владельца
    # («качество пользовательского сигнала важнее его количества») и — главное — из ЗАМЕРА на реальном
    # диффе ии-среды (`qualification/SECURITY-SCAN-NOISE-MEASURE-2026-09-23.md`, находки #1112):
    # 30 изменений, 491 файл, 10 флагов — 80% шума, 0% релевантных; на контрольной выборке 20 флагов
    # из 61 (33%) — про САМ КИТ, установленный в дочке.
    #
    # ЭТО НЕ РОСТ ВШИРЬ: ни одного нового правила, гейта или команды — наоборот, СУЖЕНИЕ существующего
    # сигнала до того, по чему можно действовать. Ревью прямо просит обратного «не добавлять»:
    # пользователю нужно не «сканер нашёл 10 вещей», а «вот 2 настоящих риска и почему они блокируют».
    freeze_relation: extension
    status: active
    outcome:
      # В ДОЧКЕ сканер меряет ПРОДУКТ, а не установленную копию кита. Сегодня `_is_detector_own` сверяет
      # точное относительное имя файла, а в дочке копия лежит по `.ai/managed/ai_ops_kit/...` — поэтому
      # треть любого замера в дочке меряет кит. Дефект объявлен в коде закрытым: в материнском репозитории
      # закрыт, в дочернем жив.
      scanner_measures_the_product_not_itself: false
      # Доля шума на ПОВТОРНОМ замере того же диффа ии-среды падает с измеренных 80% до не более 20%:
      # флаг снова значит действие, а не повод игнорировать сканер целиком. Число — планка владельца,
      # проверяется тем же замером, что дал 80%, а не новым методом.
      noise_share_drops_below_one_fifth: false

  - id: product-memory-org-intelligence
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-16 после засчёта one-feature-end-to-end. Из
    # продуктового ревью владельца («куда я бы повернул продукт»): не «набор AI-агентов для
    # разработки», а memory + execution + evidence + learning loop продукта. Самая крупная ставка
    # ревью. Вертикальный срез пройден и доказан живым прогоном — freeze снят, направление легально.
    freeze_relation: extension
    status: active
    outcome:
      # У продукта появляется МАШИНОЧИТАЕМАЯ ИСТОРИЯ ЕГО ЖИЗНИ: у каждой фичи связаны зачем-появилась →
      # какое решение → почему → что построили → кто/что проверил → что выпустили → что произошло с
      # пользователями → чему научились. Сущности уже есть по частям (decisions/entities/outcomes/KG);
      # исход — когда они СВЯЗАНЫ в одну прослеживаемую нить на реальной фиче.
      product_has_machine_readable_life_history: false
      # На вопрос «зачем существует эта фича?» кит отвечает ИЗ ИСТОРИИ (решение+outcome), а не пересказом кода.
      kit_answers_why_a_feature_exists_from_history: false
      # Уроки из накопленных outcome ВЛИЯЮТ на следующие решения (не просто записаны) — петля обучения замкнута.
      learnings_from_outcomes_shape_next_decisions: false

  - id: first-hour-for-a-stranger
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-23 из независимого продуктового ревью (разделы
    # «acquisition» и «installation UX»). Все зачётные прогоны (14–16.09) — owner-led: кит на старте
    # уже стоял, а задачу вёл владелец. README это признаёт честно («установку в ноль касаний кит не
    # заявляет»), и незакрытым остаётся ровно ПЕРВЫЙ ЧАС человека, который кит не ставил и внутрь не
    # смотрел. Обещание продукта начинается не с первой фичи, а с того, что кит появился в проекте.
    freeze_relation: extension
    status: active
    outcome:
      # От «репозиторий без кита» до ПЕРВОГО ПОЛЕЗНОГО РЕЗУЛЬТАТА (не до «кит установлен») — 5 минут.
      # Разница принципиальная: «установлено» — состояние кита, «первый результат» — состояние человека.
      install_leads_to_first_result_in_five_minutes: false
      # Первую работу доводит до конца человек СО СТОРОНЫ, без владельца рядом, и замер называет числа:
      # время до первого результата, сколько раз пришлось вмешаться руками, сколько технических решений
      # он принял, сколько прогонов сорвалось, сколько переделок. «Незнакомец» — планка, которую все
      # прежние owner-led засчёты осознанно оставляли отдельной.
      stranger_finishes_first_work_without_the_owner: false

  - id: prove-the-loop-not-add-capabilities
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-23. Главный мандат независимого ревью дословно:
    # «функциональности уже достаточно, чтобы перестать строить и начать доказывать». Здесь НЕ строится
    # ни одной новой возможности — здесь доказывается, что уже построенное меняет жизнь ПРОДУКТОВ, и
    # записываются решения владельца, без которых это не проверяемо.
    #
    # ПОЧЕМУ ОТДЕЛЬНЫМ НАПРАВЛЕНИЕМ, А НЕ ДОПИСКОЙ В `kit-measured-as-a-product` (достигнута 5/5):
    # дописывать работу в достигнутую цель — значит размывать её засчёт задним числом. Мера «ценность
    # для дочки» — новая мера, а не недоделка старой.
    freeze_relation: extension
    status: active
    outcome:
      # Видно, какая доля работ кита имеет доказательство улучшения хотя бы одной дочки. СТРОКОЙ В КАРТЕ
      # ПРОДУКТА, а не блокирующей проверкой: гейт здесь был бы ростом вширь — ровно тем, что ревью
      # запрещает, и ревью само себе противоречит, предлагая guardrail сразу после «не добавлять гейтов».
      kit_work_is_measured_by_child_value: false
      # Мораторий «не добавляем возможности, пока петля не доказана» существует ЗАПИСАННЫМ решением с
      # критерием выхода, а не намерением: через месяц по файлу видно, было это решено или забыто —
      # та же причина, по которой в роадмапе есть раздел «Later».
      moratorium_is_a_recorded_decision_with_exit_criterion: false

  - id: nightly-reviews-show-trends
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-18. Первый срез roadmap-пункта «Дальше» «ночные обзоры
    # по всем направлениям с трендами»: базовый ночной обзор уже есть (цель nightly-product-review), но
    # он ТОЧЕЧНЫЙ — delta с последнего обзора, без «стало лучше/хуже за неделю». Здесь — недельные
    # ТРЕНДЫ: ротация по всем направлениям, hotspot и portfolio-intelligence остаются в «Дальше».
    freeze_relation: extension
    # ДОСТИГНУТО 2026-09-18 (2/2): недельные тренды в ночном обзоре доставлены (#1053).
    status: achieved
    outcome:
      # Находки ночного обзора СОХРАНЯЮТСЯ во времени (счётчики по проверкам/направлениям), а не только снимком.
      # ЗАКРЫТ (#1053): журнал `.ai/project/nightly-review/history.yaml`, запись на каждый прогон.
      nightly_review_persists_findings_over_time: true
      # Бриф показывает НАПРАВЛЕНИЕ за неделю. ЗАКРЫТ (#1053): раздел «Тренд за неделю» — было N → стало M
      # (лучше/хуже/без изменений); «нет истории» честно отделено от «без изменений», тренд не выдуман.
      owner_sees_week_over_week_direction: true

  - id: nightly-review-covers-all-dimensions
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-18. Продолжение того же roadmap-пункта «ночные обзоры по
    # всем направлениям»: тренды уже есть (nightly-reviews-show-trends), здесь — РОТАЦИЯ ПО ОСЯМ. Сейчас
    # ночной сбор даёт плоский список (коммиты/CI/PR/валидаторы) без разбивки по направлениям и без
    # ротации фокуса. hotspot detection, findings→validators и portfolio-intelligence остаются в «Дальше».
    freeze_relation: extension
    # ДОСТИГНУТО 2026-09-18 (2/2): оси + ротация фокуса доставлены (#1058).
    status: achieved
    outcome:
      # Находки организованы по НАЗВАННЫМ осям. ЗАКРЫТ (#1058): сателлит `intelligence/nightly_dimensions.py`
      # (6 осей по каталогу `agents/quality/`); ось без сигнала честно «не наблюдается», не «ок».
      nightly_review_organizes_findings_by_named_dimension: true
      # РОТАЦИЯ фокуса. ЗАКРЫТ (#1058): round-robin, курсор `.ai/project/nightly-review/focus-cursor.json`
      # двигает только реальный прогон; оси питают недельный тренд (#1053).
      dimensions_rotate_so_none_is_silently_unreviewed: true

  - id: nightly-review-detects-hotspots
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-18. Ещё кусок roadmap-пункта «ночные обзоры по всем
    # направлениям»: тренды (#1053) и оси+ротация (#1058) есть, история хранит счётчики по проверкам/
    # осям — здесь HOTSPOT: агрегат по истории «что чаще всего краснеет». Сосед findings→validators
    # НЕ берём: находки = выходы валидаторов (run_checks), новое findings→validators упирается в
    # AI-ревью (в этой среде без ключа молчит — awaiting_reviewer). Hotspot же полностью незаблокирован.
    freeze_relation: extension
    # ДОСТИГНУТО 2026-09-18 (2/2): горячие точки из истории доставлены (#1063).
    status: achieved
    outcome:
      # АГРЕГАТ истории в горячие точки. ЗАКРЫТ (#1063): сателлит `intelligence/nightly_hotspots.py`
      # (окно 14, частота покраснения по проверкам И осям, хроническое выше разового).
      nightly_review_aggregates_history_into_hotspots: true
      # Честный показ. ЗАКРЫТ (#1063): раздел «Горячие точки» в брифе; <3 записей → «мало истории»,
      # и «мало данных» НЕ сворачивается в «за окно ничто не краснело» (разные ответы).
      hotspots_surfaced_in_brief_honestly: true

  - id: delivery-survives-repo-transfer
    # НОВОЕ АКТИВНОЕ НАПРАВЛЕНИЕ, взято 2026-09-18 (из «Дальше» роадмапа). Известный разрыв
    # (docs/changelog): при переносе/переименовании репо на GitHub старый origin-URL отдаёт 301 на
    # новый; `git push` редирект следует, но создание PR/API в `delivery/pr_open.py` бьёт по СТАРОМУ
    # слагу из origin-URL (`_parse_owner_repo`) → PR не туда/не дозавершается (outcome_unknown).
    freeze_relation: extension
    # ДОСТИГНУТО 2026-09-18 (1/1): доставка следует 301 переноса репо (#1068).
    status: achieved
