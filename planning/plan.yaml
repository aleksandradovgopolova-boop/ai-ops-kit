# planning/plan.yaml — delivery plan самого AI Ops Kit.
#
# Уровень МЕЖДУ направлением (`ROADMAP.md`) и прогоном. По этому файлу `ai-ops next` отвечает на
# четыре вопроса: где мы, что идёт сейчас, что блокирует и чем, какую работу взять следующей.
#
# ПОЧЕМУ ФАЙЛ ПОЯВИЛСЯ (ревизия 2026-08-11). Кит требует план от каждого подключённого
# репозитория, а у себя не имел его вовсе: `roadmap.check()` сверяет цели с планом только когда
# план есть, поэтому связка «направление ↔ работа» у кита не проверялась ничем, а `ai-ops next`
# на самом ките не мог ответить «что взять следующим». Цели здесь — те же id, что в `ROADMAP.md`.
#
# ОТКУДА ВЗЯТА РАБОТА. Это подтверждённый остаток ревизии (`docs/audit-report.md` §6) и объявленные
# разрывы репозитория (`qualification/bootstrap/v3.8.0-plan.yaml -> future_opportunities`,
# `registry/release-claims.yaml -> standing_boundaries`). Ничего не придумано: у каждой работы есть
# место в репозитории, где она обоснована. Что требует решения владельца — помечено
# `human_decision` и НЕ имеет статуса `todo` как будто это уже решено.
#
# Три правила (проверяет `validate_product_model.py` -> `delivery_plan.validate`):
#  1. Статус — только тот, которого код не знает: todo / in_progress / done / dropped.
#     `ready` / `blocked` / `waiting` кит считает сам из зависимостей и гейтов.
#  2. Роль, а не исполнитель: runtime/model/provider/assignee/agent запрещены проверкой.
#  3. id — slug нижнего регистра: такой же, как требует движок для `--feature`.
schema_version: 1
kind: delivery-plan

goals:
  # ЗАМОРОЗКА УМЕНИЙ (`freeze_relation`, работа `capability-freeze-enforced`, 19.08.2026).
  # Решение владельца `ep-2026-08-17-capability-freeze-until-second-brownfield`: новое умение не
  # принимается, пока исход `owner_reaches_verified_pr_without_patching_the_kit` не стал верным.
  # Оговорка: работа, которая снижает цену процесса, замыкает обратную связь из поля или закрывает
  # найденный полем дефект, новым умением НЕ считается.
  #
  # ПОЧЕМУ ПОМЕТКА НА ЦЕЛИ, А НЕ НА РАБОТЕ: сама оговорка сказана про НАЗНАЧЕНИЕ работы, и
  # проверять её по формулировке заявки — значит открыть лазейку через слова (это названо в самом
  # решении). Цель — уровень, где назначение уже объявлено владельцем и не переписывается под
  # задачу. Работа может запросить исключение только явно (`freeze_exception: <причина>`), и
  # причина обязательна — молчаливого обхода нет.
  #
  # КЛАССИФИКАЦИЯ ВЫВЕДЕНА ИЗ ТРЁХ ОГОВОРОК РЕШЕНИЯ, а не из вкуса; она ОБРАТИМА (`two-way`) и
  # правится владельцем одной строкой. Пять целей помечены `extension` — их работы кит перестаёт
  # предлагать, пока заморозка держится: `advisory-gates-obkatka`, `storybook-as-visual-contract`,
  # `owner-speaks-product-not-pipeline`, `nightly-product-review`, `outcome-and-analytics-loop`.
  # ПОВОД БЫЛ ЖИВОЙ: 18.08 кит сам предложил взять `watch-contract-for-night-review` — работу из
  # замороженной цели, — потому что решение существовало записью и ничем не сверялось.
  #
  # СНЯТИЕ ЗАМОРОЗКИ — НЕ ДАТА И НЕ ФЛАГ: тот самый исход, ставший верным. Проверка читает его из
  # цели `second-real-brownfield`, поэтому «разморозить вручную» технически нечем.
  #
  # Порядок = приоритет. Те же id и тот же порядок, что под «Сейчас» и «Следующий результат»
  # в ROADMAP.md: расхождение кит покажет сам (`ai-ops next`).
  - id: real-product-qualification
    # заморозка: сама петля квалификации: прогон, находки, закрытие
    freeze_relation: run_condition
    # ДОСТИГНУТА в своей первой части (2026-08-14): первый живой brownfield пройден, находки
    # прогона закрыты (`history/plan-history.yaml`). Продолжение живёт под `qualification-closeout`
    # и `second-real-brownfield`: держать цель активной без активной работы значило бы объявлять
    # направление, которым никто не занят.
    status: achieved
    outcome:
      # Первый живой brownfield пройден (qualification/REAL-PRODUCT-NITI-2026-08-06.md).
      first_real_brownfield_passed: true
      findings_from_first_run_closed: true

  - id: checks-that-run
    # заморозка: ловит класс «объявлено — не исполняется», найденный полем
    freeze_relation: run_condition
    status: active
    outcome:
      # Замеры — в docs/audit-report.md §1. Первые три закрыты ревизией.
      no_test_passes_without_assert: true
      linter_runs_on_the_engine_package: true
      every_declared_entry_point_works: true
      swallowed_exceptions_reviewed: true

  - id: advisory-gates-obkatka
    # заморозка: обкатка новых гейтов расширяет умения; цель на паузе
    freeze_relation: extension
    # ПРИОСТАНОВЛЕНА 2026-08-14, и это честнее, чем «активна»: 14 из 35 гейтов по-прежнему
    # advisory, но обкатку сейчас никто не ведёт — приоритет ушёл в Product OS. Цель убрана из
    # «Сейчас» в ROADMAP; вернётся вместе с работой, а не раньше.
    status: paused
    outcome:
      # 14 из 35 гейтов объявлены и не блокируют (quality/gates.yaml).
      advisory_gates_have_field_evidence: true

  - id: second-real-brownfield
    # заморозка: это и есть тот прогон, ради которого правило введено
    freeze_relation: run_condition
    status: active
    # ЗАМОРОЗКА СНЯТА РЕШЕНИЕМ — И ЭТО НЕ ТО ЖЕ, ЧТО ДОСТИГНУТЫЙ ИСХОД (развязано 19.08.2026).
    # Решение владельца ep-2026-08-19-freeze-lifted: расширять функциональность параллельно с
    # закрытием P0, не дожидаясь verified PR на чужом репозитории. Решение законное и остаётся в
    # силе — здесь изменился только СПОСОБ ЗАПИСИ.
    # Прежде снятие записывали единственным доступным способом: ставили исход верным. Но исход
    # ниже стережёт канал `stable`, и пока он `true`, кит считает второй brownfield пройденным —
    # при `verified PR = 0` и пустом `field_evidence`. Решение о процессе молча переписывало
    # факт о продукте.
    freeze_lifted_by: ep-2026-08-19-freeze-lifted
    outcome:
      # ФАКТ, а не рычаг. Замер 19.08.2026: третий прогон на bolshe-ne-budu-menshe дал
      # verified PR = 0 (условие режима — вела не владелец), registry/release-claims.yaml ->
      # field_evidence пуст. Станет true, когда это перестанет быть так.
      owner_reaches_verified_pr_without_patching_the_kit: false

  - id: session-autonomy-under-ceiling
    # заморозка: снижает цену процесса владельца (потолок траты)
    freeze_relation: run_condition
    # ДОСТИГНУТА 2026-08-14: все объявленные исходы верны (потолок, различимость отказов,
    # измерение сессии), работа закрыта и лежит в истории.
    status: achieved
    outcome:
      # Решение владельца 2026-08-13: подсессии кит открывает сам, но только под потолком.
      autonomous_spend_has_a_declared_ceiling: true
      refusals_are_distinguishable_and_spend_nothing: true
      # Закрыто той же работой (session-economy-measured): сессия опознаётся по
      # CLAUDE_CODE_SESSION_ID, контекст читается из транскрипта со статусом measured. Проверено
      # сцепкой на живой сессии: автономия отказывает уже по причине no_ceiling, а не
      # session_unidentified — то есть измерение доехало до решения о трате.
      session_is_identified_and_measured: true

  - id: green-means-checked
    # заморозка: ложный green — класс, из-за которого прогоны не сходились
    freeze_relation: run_condition
    status: active
    outcome:
      ci_lint_job_green: true
      evidence_scope_named_not_implied: true

  # ─── этап Product OS (решение владельца 14.08.2026, ep-2026-08-14-product-os) ───────────────
  - id: qualification-closeout
    # заморозка: закрытие находок прогонов
    freeze_relation: run_condition
    status: active
    outcome:
      # Семь чисел прогона + перечень внутренних сущностей, которые пришлось понимать человеку.
      # ПЕРЕ-ПРОГОН 14.08 (вечер): 4 вмешательства, 0 ложных green, 1 ложный red, 0 придуманных
      # фактов, $9.71 измерено, verified PR = 0 (qualification/REAL-PRODUCT-BNBM-RERUN-2026-08-14.md).
      real_task_reaches_verified_pr_without_patching_the_kit: false
      repeated_on_two_different_live_repos: false
      # ЗАКРЫТ 14.08: `quality/mutation-probes.yaml` + `devtools/mutation_probe.py` +
      # `validate_mutation_probes` (75-й валидатор) + требование пробы ШВА на каждый механизм с
      # охранными пробами. Замер: 14 проб, 0 выживших, 0 непроверенных; правило шва нашло разрыв в
      # той же работе, где было введено.
      contour_catches_declared_but_not_executed: true

  - id: team-works-in-parallel
    # заморозка: закрывает заявку поля #150 и снижает цену процесса
    freeze_relation: run_condition
    # РЕШЕНИЕ ВЛАДЕЛЬЦА 18.08.2026 (ep-2026-08-18-team-works-in-parallel): вариант «считать конфликты
    # нормальной ценой параллельной работы» ОТКЛОНЁН. Цель стоит третьей, сразу за closeout: она не
    # обгоняет единицу надёжности, но идёт раньше всего остального.
    status: active
    outcome:
      # РЕШАЮЩИЙ. Замер 18.08.2026: `.ai/runtime/active-work.yaml` в `.gitignore` и у кита (:22), и у
      # дочки ИИ-Среда (:48) — реестр локален для одной машины, для команды не координирует ничего.
      # ВИДИМОСТЬ УСЛОВНАЯ ПО РЕШЕНИЮ ВЛАДЕЛЬЦА (ep-2026-08-18-claim-medium-hybrid): гибрид —
      # локально по умолчанию, публикация по явному включению. Поэтому исход считается верным, когда
      # выполнены ОБЕ половины: при включённой публикации другая машина видит заявку, а при
      # выключенной кит ГОВОРИТ, что видит только свою машину, вместо советов «не трогай те же файлы»
      # по неполным данным. Одна половина без второй — снова ложный green.
      # ЗАКРЫТО 18.08.2026 (ep-2026-08-18-published-carrier-file-per-work): при включённой публикации
      # заявка одной машины видна другой через git (.ai/claims/), при выключенной кит честно говорит,
      # что видит только свою. Обе половины пары проверены живьём на двух клонах.
      claim_is_visible_to_other_machines: true
      # `next` уже умеет главное — считает непересечение по `write_scope`. Не хватает вычитания того,
      # что держат другие.
      next_excludes_work_others_hold: false
      # Правки самого кита не создают конфликтов в файлах, которые трогает каждая работа.
      kit_edits_do_not_create_conflicts: false
      # Два условия владельца: она не проектирует эту работу, участник не сомневается в нужности
      # своей задачи и не дублирует чужую.
      owner_does_not_design_the_parallelism: false

  - id: plan-as-control-plane
    # заморозка: план как управление — цена процесса владельца
    freeze_relation: run_condition
    status: active
    outcome:
      # ВСЕ ТРИ ЗАКРЫТЫ 14.08 (PR #120) и проверяются кодом, а не соглашением:
      # `delivery_plan.validate` и `validate_history`, 11 тестов, 10 мутаций — 10 красных.
      open_pr_cannot_coexist_with_todo: true
      done_requires_verified_result_not_merged_pr: true
      closed_investigations_leave_the_active_plan: true

  - id: product-decision-loop
    # заморозка: решения владельца о процессе, не новое умение кита
    freeze_relation: run_condition
    status: active
    outcome:
      # Четыре объекта вместо новых документов: Opportunity Brief, Product Decision Record,
      # Outcome Contract, Outcome Readout.
      # ЗАКРЫТО 19.08.2026: три решения владельца по внешнему ревью (ep-2026-08-19-*) —
      # North Star принят (dp-005), brownfield не ужесточён (сказано что НЕ делаем),
      # anti-matryoshka принят (dp-006). Каждое решение называет альтернативу и отказ.
      decision_names_alternatives_and_what_is_not_done: true
      feature_has_baseline_target_and_guardrails: false

  - id: storybook-as-visual-contract
    # заморозка: визуальные контракты — новое умение
    freeze_relation: extension
    status: active
    outcome:
      # Сторона evidence уже построена (UIEvidenceBundle); достраивается сторона создания.
      required_stories_derived_from_contract_by_code: false
      experience_options_offered_with_tradeoffs: false

  - id: owner-speaks-product-not-pipeline
    # заморозка: вертикальный срез Окошка — новый продукт
    freeze_relation: extension
    status: active
    outcome:
      owner_never_edits_yaml_or_knows_feature_id: false

  - id: nightly-product-review
    # заморозка: ночной обзор — новое умение целиком
    freeze_relation: extension
    status: active
    outcome:
      # v0 — только наблюдение и предложение; класс автофикса пуст, пока точность не измерена.
      delta_review_runs_nightly_and_briefs_the_owner: false
      no_direct_writes_to_main_ever: false
      false_positive_rate_is_named: false

  - id: outcome-and-analytics-loop
    # заморозка: аналитика исходов — новое умение
    freeze_relation: extension
    status: active
    outcome:
      events_verified_in_runtime_not_declared: false

# ЧТО ЗДЕСЬ ЛЕЖИТ, А ЧТО НЕТ (`plan-as-control-plane`, 2026-08-14). Активный план — это ответ на
# четыре вопроса управления: где мы, что идёт сейчас, что блокирует и чем, какую работу взять
# следующей. Поэтому здесь ТОЛЬКО незакрытая работа (`todo`/`in_progress`); закрытая, вместе со
# своим разбором, уезжает в `history/plan-history.yaml`. Повод — замер: 21 работа из 32 была `done`,
# и чтобы ответить «что идёт», приходилось вычитывать разбор давно оплаченных дефектов.
#
# ПРАВИЛА ПРОВЕРЯЕТ КОД (`delivery_plan.validate` / `validate_history`), а не соглашение:
#   * `done`/`dropped` в этом файле — ошибка: место закрытой работы в истории;
#   * указан `pr` при статусе `todo` — ошибка: PR существует, значит работа начата;
#   * `in_progress` без `pr`/`branch` — предупреждение: состояние работы негде посмотреть;
#   * `evidence`/`finding` обязаны резолвиться от корня: ссылка на доказательство, которого нет,
#     хуже её отсутствия;
#   * в истории `done` обязан назвать РЕЗУЛЬТАТ и место перепроверки (`pr`/`commit`/`evidence`);
#     merged PR сам по себе результатом не считается.
#
# ЧЕГО ЗДЕСЬ НЕТ ОСОЗНАННО: каталога `findings/`. Реестр находок в ките уже есть —
# `docs/audit-report.md` (R-01…R-41) плюс отчёты в `qualification/`; заводить второй означало бы
# развести две правды об одной находке (принцип `dp-001`: дубли уже построенного отклоняем).

work:
  # ─── разбор внешнего аудита 19.08.2026 (две параллельные сессии) ─────────────────────────────
  #
  # Работы заведены ПОТОМУ, ЧТО ИХ ВЕДУТ. До этого две сессии правили репозиторий, а план о них не
  # знал и советовал брать `second-brownfield-run` — то самое расхождение «план и исполнение
  # показывают разное состояние», ради которого существует цель `plan-as-control-plane`.
  # `write_scope` здесь не украшение: по нему `ai-ops next` считает, какие работы можно вести
  # одновременно, и именно он разводит ленты по территории. Реестр активных работ лежит в
  # игнорируемых файлах и между машинами не координирует — значит границы держит план.
  - id: audit-phase-0-green
    title: Собственный контур снова что-то значит — красное разобрано как находки, а не покрашено
    type: quality
    goal: checks-that-run
    status: in_progress
    branch: fix/phase-0-green
    owner_role: engineer
    write_scope: [planning/, history/, installer/, registry/, schemas/, templates/,
                  ai_ops_kit/cli/, ai_ops_kit/planning/, .github/workflows/]
    value: high
    affects: {delivery_operations: true}
    # Проверяемо: ruff 0; падения из аудита разобраны с названной причиной, а не заглушены;
    # `./ai-ops next` отвечает; поставка под потолком без его поднятия; обязательные поля конфига
    # дочки читаются кодом. Не входит: публичная граница и охраны — это вторая лента.
  - id: session-recommendation-has-a-validator
    title: У рекомендации сессии есть своя проверка, а не чужая
    type: quality
    goal: checks-that-run
    status: todo
    owner_role: engineer
    write_scope: [ai_ops_kit/engops/]
    value: medium
    affects: {delivery_operations: true}
    # НАЙДЕНО ЛЕНТОЙ A 19.08.2026 на чистой установке, ОТДАНО ЛЕНТЕ B (территория `engops`).
    # `./ai-ops session` печатал в stderr «kind должен быть CompletionRitual» при КАЖДОМ запуске:
    # вызывался `session_guardrails.check(rec)`, который проверяет `CompletionRitual` — результат
    # другой функции, — а `recommend()` возвращает рекомендацию вообще без поля `kind`. Вызов снят
    # (место вызова в `ai_ops_kit/cli/` — территория A), но своего валидатора у
    # `SessionRecommendation` нет вовсе, и это остаток работы `session-ritual-validators-are-dead`:
    # она объявила «check() зовётся на каждом produced-артефакте» и для одного из двух артефактов
    # позвала чужой.
    # Проверяемо: у рекомендации есть `kind` и валидатор её формы; `./ai-ops session` на чистой
    # установке не печатает ни одной строки `session-check:`.

  - id: audit-public-surface-and-guards
    title: Объявлена публичная граница, и охраны кита проверены на самом ките
    type: quality
    goal: checks-that-run
    status: in_progress
    branch: lane-b
    owner_role: engineer
    write_scope: [docs/, mkdocs.yml, quality/, tools/, AGENTS.md,
                  ai_ops_kit/validation/, ai_ops_kit/devtools/, ai_ops_kit/security/,
                  ai_ops_kit/gates/, ai_ops_kit/engine/, ai_ops_kit/ui/]
    value: high
    affects: {delivery_operations: true}
    # Проверяемо: есть docs/api/public-surface.md с четырьмя уровнями и тест, который краснеет на
    # расхождении; определено, что такое breaking change; ни один валидатор не молчит; ни одна
