    # ПОЧЕМУ ЭТО ОТДЕЛЬНАЯ РАБОТА, А НЕ «УЖЕ СДЕЛАНО ЗАПИСЬЮ. Кит требует от других «правило без
    # исполнения — пожелание» и сам ловит «объявлено, но не исполняется». Запись в реестре решений
    # правилом не является: следующая работа заводится текстом заявки, и ничто не сверяет её с
    # заморозкой. Выдавать решение за механизм — ровно тот класс, против которого стоит контур.
    #
    # ЧТО НУЖНО СДЕЛАТЬ (проверяемо, без новых сущностей там, где можно):
