      чтением, не кит; повторный прогон потратился только на переписывание собственных бумаг
      (plan/requirements/spec/tasks), ни одного файла продукта. ЭТО ЯДРО ОБЕЩАНИЯ КИТА: «зелёное
      значит проверенное» держится на судье, а судья не вынес вердикта и работа МОЛЧА встала.
      ТЕРРИТОРИЯ ЛЕНТЫ C. Это ровно её C2 из брифа: «неразобранный ответ даёт честный отказ, а не
      пустой вердикт». Её открытый #216 меряет УСТОЙЧИВОСТЬ вердикта корпусом; здесь — соседний
