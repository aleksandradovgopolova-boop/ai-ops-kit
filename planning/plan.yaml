    # Гейт объявлен advisory ДО обкатки — правило репозитория (ROADMAP.md -> «Правила движения»).
    # Пока обкатки нет, заявленное качество опирается на 21 блокирующий гейт, а не на 34.
    #
    # ПЕРВЫЙ ЗАМЕР 2026-08-12 — на диффе ревизии в этом репозитории (76 файлов, 93fd134..d022b5a):
    #   changed: product_strategy, planning_execution, delivery_operations
    #   not_changed: research_decisions, system_architecture, data_contracts,
    #                engineering_quality_security, analytics_learning
    #   unknown: НИ ОДНОГО — сигнальные пути есть у всех восьми контуров этого репозитория.
    # Отдельно проверено подозрительное: `engineering_quality_security = not_changed` при
    # изменённых `ai_ops_kit/security/*.py` — это ВЕРНО по модели, сигнал контура `security/**`
    # указывает на политики в корне, а не на код реализации. Ложного отрицания нет.
    #
    # ПЕРЕВОДА В BLOCKING НЕТ, и одного замера для него недостаточно: в этом диффе ни разу не
    # возник случай, ради которого гейт существует, — изменение модели данных без обновления
    # DataMap. До тех пор гейт остаётся advisory осознанно, а не по забывчивости.
    #
    # ЗАКРЫТО 2026-08-12. Обкатка выполнена на РЕАЛЬНОЙ истории niti (единственный подключённый
    # репозиторий, где модель данных лежит в коде: supabase/migrations/*.sql + openapi.yaml), и
    # запущена штатной функцией конвейера `contour_consistency_evidence`, а не примитивами.
    #   B  (67ef9a0): миграция изменена, SoT не тронут -> warn, вердикт inconsistent, назван контур
    #                 и файл — то самое поведение, ради которого гейт есть;
    #   B' (6fe342f): миграция И openapi -> pass, ложного срабатывания нет;
    #   A  ×5:        схемы не касались -> pass, ложных срабатываний 0.
    # РЕШЕНИЕ: остаётся advisory. Причина конкретная, не инерция: дефолтный SoT контура
    # (context/system/DataMap.md) объявлен required:false и отсутствует у 0 из 6 подключённых репо.
    # В blocking такой гейт либо требовал бы документ, которого в проекте нет по решению владельца,
    # либо не срабатывал вовсе. ПРЕДУСЛОВИЕ перевода: репозиторий объявил SoT data_contracts (как
    # niti через оверлей); разумная форма — required_when, чтобы blocking действовал только там.
    # Отчёт: qualification/CONTOUR-CONSISTENCY-OBKATKA-2026-08-12.md
    #
    # КРИТЕРИЙ GRADUATION (owner-review 2026-08-12). Целевой сценарий не ждут — его СТАВЯТ, двумя
    # реальными задачами на одном child-репозитории:
    #   A. меняется код, модель данных НЕ меняется -> гейт не выдвигает требований к DataMap
    #      (проверяем отсутствие ложного срабатывания);
    #   B. реально меняется схема/сущность/API -> устаревший DataMap ОБНАРУЖЕН
