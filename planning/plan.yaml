    # (AutoFixResult | HumanDecisionBrief) -> MorningBrief. У находки обязательны: домен, severity,
    # confidence, evidence с base/head SHA и цитатами, `first_seen`, `previous_occurrences`,
    # `action_class`, `autofix_allowed`, владелец. Дедупликация и suppressions с причиной И СРОКОМ —
    # часть контракта, иначе утренний бриф превратится в повтор вчерашнего.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: оформлять ночной прогон как `ResearchRequest` — он не начинается с разового
    # вопроса. Это Watch, и у него своя форма.

