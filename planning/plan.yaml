      ОБЕЩАЕТ, и что ДЕЛАЕТ: (1) run-plan.yaml перечислил 3 гейта, а прогон применил 11 (гейты
      применяются верно — врёт плановый файл: человек по плану не видит, что его ждёт); (2)
      визуальный и документационный треки отключены причинами в ПРОШЕДШЕМ времени о коде, которого
