    # ПОВОД. Коммит #262 положил два верхних яруса пирамиды и записал прямо: «основа под будущую
    # прополку юнитов — сначала ярусы, потом режем». Цель green-means-checked: 350 модульных файлов
    # горят зелёным, а поле находило дефекты, которых набор не ловил (класс «механизм зелён, конвейер
    # его не зовёт»). Число тестов (~2700 функций) само по себе не дефект; дефект — что оно НЕ
    # ОТРАЖАЕТ реальную защиту и его нельзя прочитать ярусами.
    #
    # ЗАМЕР 2026-08-25 (перед взятием — чтобы работа не переоценивала свой размер;
    # полный отчёт фазы анализа: docs/analysis/unit-weeding-analysis.md):
    #  * Разметка неполна: ярусный маркер несут 668 функций из ~2700 (628 unit / 39 contract /
    #    1 integration); ~3/4 без маркера — пирамиду нельзя увидеть числом, а без этого «резать по
    #    ярусу» вслепую.
    #  * Перекрытие ярусов с юнитами ЧАСТИЧНОЕ, не полное. test_product_contract.py и
    #    test_product_registry.py говорят о той же площади, что ярусы, но держат ИНЫЕ инварианты:
    #    агрегация-без-второй-правды (counts == product_templates.report), fail-soft (битый продукт
    #    не топит флот), честный not_computed по граням. Ярус проверяет их ГРУБЕЕ. Значит «удалить
    #    юнит, раз площадь закрыта ярусом» МОЛЧА срежет защиту — выхлоп от перекрытия с ярусом МАЛ.
    #  * Настоящий сигнал дубля — в другом месте: у 26 модулей есть И `test_<m>.py`, И
    #    `test_<m>_selftest.py`. Селфтесты перенесены из модулей дословно (один монолит, печать
    #    PASS/FAIL, один финальный assert, маркер slow). Где гранулярный файл уже утверждает то же —
    #    монолит избыточен. НО селфтесты предписаны AGENTS.md (тест модуля живёт в
    #    `test_<module>_selftest.py`): удалять оптом нельзя, честный ход — перенести уникальные случаи
    #    монолита в гранулярный файл и снять монолит, не теряя ни одной проверки.
    #
    # МЕТОД — мутационный, переиспользует devtools/mutation_probe.py + quality/mutation-probes.yaml.
    # Тест — кандидат на рез ТОЛЬКО если каждая мутация, которую он ловил, остаётся красной у другого
    # теста (ярус или гранулярный юнит). Ничего, чья смерть оставляет пробу зелёной, не режется.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: резать по площади/догадке о перекрытии; удалять селфтесты оптом; делать
    # «меньше тестов» самоцелью — цель green-means-checked, а не малое число.
    # Готово, когда: (1) каждая тест-функция несёт ярусный маркер, и это держит инвариант (новый
    # тест без маркера краснеет — пирамида читается числом); (2) для 26 пар selftest+unit перекрытие
    # измерено, и где монолит доказанно избыточен — его уникальные случаи в гранулярном файле, монолит
    # снят; (3) ни один рез не оставляет мутационную пробу зелёной; число тестов до/после названо в
    # newsfragment как СЛЕДСТВИЕ, а не цель.
