  # ─── инструмент проверки самого кита ────────────────────────────────────────────────────────
  - id: probe-runner-survives-bytecode-cache
    title: Прогон проб не обманывается кэшем байткода
    type: engineering
    goal: green-means-checked
    status: todo
    owner_role: engineer
    depends_on: []
    write_scope: [ai_ops_kit/devtools/, tests/]
    value: medium
    affects: {engineering_quality_security: true}
    # НАЙДЕНО 18.08.2026 при работе над `what-is-running-answered-from-the-plan`, на своей же шкуре.
    # Мутация вида `if stale:` -> `if False:` СОВПАДАЕТ ПО ДЛИНЕ с исходной строкой, и если правка и
    # откат попали в ОДНУ СЕКУНДУ, `.pyc` не перекомпилируется: Python сверяет кэш по паре
    # (mtime в секундах, размер файла). Результат — интерпретатор исполняет СТАРЫЙ байткод, а на
    # экране исправленный исходник. У меня это выглядело как «исправление не работает»: пять тестов
    # краснели на верном коде, пока я не тронула файл ещё раз (`find . -name __pycache__ -exec rm -rf`
    # вернул зелёное).
    # ПОЧЕМУ ЭТО ПРО КИТ, А НЕ ПРО МОЮ МАШИНУ: ровно так работает `devtools/mutation_probe.py` —
    # пишет мутацию в файл, гоняет pytest, восстанавливает файл (строки 116-119). Копия дерева
    # начинается без кэша (SKIP исключает `__pycache__`), поэтому первый прогон честный; но внутри
    # одной пробы базовый прогон уже создал `.pyc`, и мутация той же длины в ту же секунду может быть
    # не подхвачена. Тогда проба скажет «ВЫЖИЛА» на живой охране — ложная тревога; обратный случай
    # (мутантный байткод переживает откат) краснит базовый прогон следующей пробы, то есть тоже шумит.
    # Молчаливого зелёного здесь, похоже, нет — но инструмент, которым кит проверяет свои проверки,
    # обязан быть надёжнее «похоже».
    # ЧТО СДЕЛАТЬ: гонять pytest проб с `PYTHONDONTWRITEBYTECODE=1` (и/или чистить `__pycache__`
    # между применением мутации и прогоном), и ПРОВЕРИТЬ это тестом, который подсовывает мутацию той
    # же длины в ту же секунду — иначе исправление окажется той же самой необеспеченной проверкой.
    # НЕ ДЕЛАТЬ: выключать кэш байткода глобально в CI — это замедление всех прогонов ради одного
    # инструмента.

