    # ОТКУДА: тот же отчёт -> B2-10 и B2-11, найдены подряд в одном прогоне.
    # B2-10: блокирующее сообщение велит «передай resume=True (--resume) … discard_previous=True
    #   (--discard)» — ни одного из этих флагов в CLI НЕТ.
    # B2-11: `resume` печатает команду продолжения `ai-ops resume . <wid> --execute`, и она падает
    #   сырым `ValueError: недопустимый workitem_id '.'` — позиционный `.` уходит в workitem_id.
    # ПОЧЕМУ ЭТО НЕ МЕЛОЧЬ: у кита объявлена цель «каждая объявленная точка входа работает», и она
    # проверяется по точкам входа. А человек набирает не точку входа, а СТРОКУ, которую кит ему
    # напечатал. Обе строки живут в ветках отказа — там, куда тесты не ходят, и куда попадает
    # человек в худший момент: когда у него уже что-то не получилось.
    # СДЕЛАНО 2026-08-14 (B2-10 и механизм): `tests/unit/test_printed_commands_are_runnable.py`
    # извлекает из кода ВСЕ строки вида `ai-ops <intent> …` и сверяет их флаги со словарём,
    # взятым из КОДА обеих поверхностей `ai-ops` (интент-CLI + установщик). Несуществующий флаг
    # краснеет на CI, а не у владельца. Механизм нашёл три случая: сообщение B2-10 (звало
    # `--resume`/`--discard` — флаги ВНУТРЕННЕЙ точки входа) и два докстринга с `ai-ops run
    # --engine pipeline`. Все три исправлены: сообщение называет путь человека
    # (`git branch -D` + `ai-ops run . --feature <id> --execute`), докстринги — внутреннюю точку.
    # Попутно механизм нашёл СВОЙ шум: регулярка съедала полдокстринга, потому что не была
    # ограничена одной строкой.
    # МУТАЦИОННОЙ ПРОБЫ ЗДЕСЬ НЕТ ОСОЗНАННО: охрана живёт в самом тесте, и проба «сломать
    # проверку и ждать падения этого же теста» была бы кругом. Вместо неё — два теста на
    # молчаливый отказ механизма: словарь флагов непуст и извлекатель реально видит флаги.
    # B2-11 (падающая подсказка `resume`) НЕ ВХОДИТ: её чинит PR #117 параллельной сессии —
    # брать ту же правку значило бы делать работу дважды и столкнуться в одном файле.

