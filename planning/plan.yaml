    # ЧЕМ ЭТО ПЛОХО ИМЕННО ЗДЕСЬ. Кит объявляет своей ценностью трассируемость и «знания не
    # устаревают незаметно», а про самого себя узнаёт со слов. Цена уже заплачена трижды:
    # F-030 в ИИ-Среде ЖДАЛ срабатывания и был бы найден автоматически (план дочки содержит 32
    # записи `status: done`, обновление сделало бы его невалидным); дефект «кит подогнал тест под
    # сделанное» записан в памяти проекта ИИ-Среды и в плане кита НЕ ОТРАЖЁН ВООБЩЕ; наблюдение про
    # трассируемость дошло фразой в комментарии, а не замером с уликами.
    #
    # ЧТО ДЕЛАЕМ (контур, а не «отправлялка»):
    #   1. КитОБСЕРВЕЙШН как запись: `.ai/kit-feedback/<id>.yaml` в дочке — {что наблюдалось, чем
    #      подтверждено (пути, команда, вывод), версия кита, дочка, серьёзность, класс}. Пишется
    #      командой в дочке, а не руками в чате;
    #   2. кит СОБИРАЕТ их с известных ему дочек и превращает в раздел плана/находки — с сохранением
    #      источника: наблюдение без улики остаётся наблюдением, а не становится дефектом;
    #   3. ОБРАТНАЯ СВЯЗЬ дочке: наблюдение получает состояние (принято / стало работой / отклонено с
    #      причиной). Канал в одну сторону перестают наполнять — это и есть механизм, который умрёт
    #      молча.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: отправлять что-либо из дочки в сеть без явного решения владельца. Дочка
    # может быть закрытым продуктом, а наблюдение — нести её пути и вывод команд. Первый режим —
    # локальная сборка с машины владельца, ровно как это делается сейчас руками.
    #
    # ПРИЗНАК ГОТОВНОСТИ (проверяемый): взять СУЩЕСТВУЮЩЕЕ наблюдение ИИ-Среды, которого в плане
    # кита нет (кит дважды не доделал задачу и один раз сузил тест до сделанного — память проекта
    # ИИ-Среды, 12.08.2026), провести его этим контуром от записи в дочке до строки в плане кита и
    # обратно до состояния в дочке. Пока это не пройдено — механизм не проверен.
    #
    # СДЕЛАНО 17.08.2026: `engops/kit_feedback.py` (запись, сборка, решение, состояние обратно в
    # дочку) + намерение `feedback` в CLI, чтобы владелец доходил до механизма своей командой, а не
    # через модуль. Улика обязательна только для класса `defect`; трение и вопрос законны без улик.
    # Сети в модуле нет вообще: сборка локальная, с машины владельца — дочка может быть закрытым
    # продуктом, а наблюдение несёт её пути и вывод команд.
    #
    # ПЕРВАЯ ЖЕ ПРОБА НА НАСТОЯЩИХ НАБЛЮДЕНИЯХ нашла два дефекта в самом канале, и оба — из класса,
    # который кит требует от других: (1) отсутствующее наблюдение сообщало «не разобран
    # (FileNotFoundError)», то есть «нет» выдавалось за «испорчено»; (2) состояния печатались
    # человеку внутренними словами (`became_work`, `rejected`). Оба закрыты, на первое есть тест.
    #
    # ЧТО ОСТАЛОСЬ ДО `done` — ровно признак готовности выше, и он НЕ пройден: контур прогнан на
    # пробной копии, а не на живом `~/ii-sreda`. Причина названа: там установлен кит 3.36.8, команды
    # `feedback` в нём нет, и она приедет только обновлением. Писать в чужое рабочее дерево ради
    # проверки я не стал — там параллельные сессии, и неотслеживаемый файл уже однажды уехал чужим
    # `git add -A`. Порядок: обновить дочку -> прогнать контур там -> закрыть работу.

