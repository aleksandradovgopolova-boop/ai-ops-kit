    affects: {engineering_quality_security: true}
    # ПОЛЕ 15.08.2026, дочка ИИ-Среда (~/ii-sreda), сообщение параллельной сессии. `run --execute`
    # не поднимается вовсе: `FileNotFoundError: 'claude'`, при том что `claude` в PATH живой и
    # `resolve_provider` его НАХОДИТ (провайдер выбран, запуск падает). Работу пришлось делать
    # руками, кит использовали только для spec/plan.
    #
    # ЭТО НЕ «НЕ ДОЕХАЛО», А «НЕ ЗАПУСКАЕТСЯ», и потому отдельно от fixes-must-reach-the-child.
    # ПОВТОР: то же самое наблюдалось 13.08.2026 и тогда не было закрыто.
    # РАЗНИЦА, КОТОРУЮ НАДО ОБЪЯСНИТЬ ПЕРВОЙ: в тот же день на «Окошке» тот же провайдер
    # `claude-cli` отработал полностью (два прогона, живые вызовы, коммиты). Значит дело в том, чем
    # отличаются эти два репозитория/окружения, а не в самом адаптере: разный способ запуска
    # (`./ai-ops` vs прямой вызов CLI), другой PATH у порождённого процесса, другой интерпретатор.
    # ДИАГНОСТИКА ДО ПРАВКИ: показать в ошибке, ЧТО именно не найдено и с каким PATH — сейчас
    # `FileNotFoundError` не отличает «нет бинаря» от «нет его в PATH дочернего процесса».
    # НЕ ЧИНИТЬ ВСЛЕПУЮ: воспроизвести на ~/ii-sreda, а не на ките.
    #
    # ═══ 17.08.2026: ДИАГНОСТИКА СДЕЛАНА, ПРИЧИНА НА ИИ-СРЕДЕ ЕЩЁ НЕ ИЗМЕРЕНА ═══
    #
    # НАЙДЕННЫЙ ДЕФЕКТ — ШОВ, а не адаптер: присутствие проверял `resolve_provider` через `which`, а
    # запуск подставлял короткое имя `claude`. Два разных решения, и между ними помещалось
    # расхождение окружения. Теперь путь вычисляется один раз (`providers.claude_binary`) и им же
    # исполняется; `AI_OPS_CLAUDE_BIN` — явное слово владельца, сильнее PATH.
    # Отсутствие бинаря: названная причина ДО запуска (что искали, ГДЕ искали — реальный PATH
    # процесса кита, почему так бывает при живом claude в терминале, три выхода). Исчезновение пути
    # между проверкой и запуском — своя причина и БЕЗ ретраев (файл не появится от повтора).
    # Явно выбранный провайдер больше не остаётся непроверенным: слово человека не оспаривается, но
    # об отсутствии сказано до прогона, а не после разбора, плана и подготовки дерева.
    # Попутно: предупреждение печатало «провайдер: mock» намертво — для нового случая это ложь о том,
    # чем пойдёт прогон.
    #
    # ДВЕ ГИПОТЕЗЫ ПРОВЕРЕНЫ И ОТВЕРГНУТЫ (по коду, до правки): (1) провайдер работает В ТОМ ЖЕ
    # процессе — отдельного окружения с другим PATH у него нет; (2) allowlist `scrub_env` СОДЕРЖИТ
    # PATH, то есть урезание окружения брокера к этому падению отношения не имеет.
    # ЗНАЧИТ ПРИЧИНА — в окружении запуска на той машине, и назвать её теперь обязано само сообщение.
    #
    # ЧТО ОСТАЛОСЬ ДО `done` (честно, а не «сделано»): измерение НА ИИ-СРЕДЕ. Оно требует, чтобы туда
    # доехала эта правка, а там кит 3.36.8 — то есть нужен релиз и обновление дочки. Порядок:
    # релиз -> обновить ~/ii-sreda -> запустить и ПРОЧИТАТЬ причину -> закрыть работу тем, что
    # причина названа и снята. Писать в то дерево без нужды нельзя: там параллельные сессии.

