    # `per-file-ignores` с числами — это замер долга, который вправе только сокращаться.
    # При разборе валидаторов нашлись две фиктивные проверки (см. R-31/R-32 отчёта), а четыре
    # места оказались правильным образцом «отказ становится находкой» — причина записана в noqa.
    # Ратчет проверен: новое гашение в разобранной области краснеет.
    # ОСТАЛОСЬ: engine (15) -> providers (6) -> мелкие (9) -> tests (8) и .research (3);
    # PLW1510 63 (подготовка временных git-репо); F401 105, I001 131, EXE001 180 — стиль.

