    # РЕШЕНИЕ ВЛАДЕЛЬЦА 17.08.2026 (ep-2026-08-17-session-protocol, п. 1): перемерить и поставить ПО
    # ЗАМЕРУ. Вариант «поднять до 100M» отвергнут ею сознательно: цифра была бы взята с одной сессии.
    #
    # ПОВОД — ЗАМЕР НА ЖИВОЙ СЕССИИ 17.08.2026 (88c802ae): расход 85.2M при потолке 20M — вчетверо, —
    # и работа при этом шла нормально: четыре закрытые работы, два выпуска (v3.36.11, v3.36.12).
    # Контекст 427k при пороге новой сессии 400k. То есть оба сигнала сработали, и оба оказались не о
    # том: сессия была здоровой. Порог, который превышается всегда, перестают замечать — это хуже
    # его отсутствия, потому что выглядит как контроль.
    #
    # ЧТО ИЗМЕРИТЬ (величины, а не впечатление): по НЕСКОЛЬКИМ настоящим транскриптам — расход и
    # контекст в точке, где работа реально начала деградировать (агент терял нить, переспрашивал,
    # ошибался в уже сделанном), и отдельно — где не деградировала при превышении. Прежний замер
    # 13.08 (45 ходов — 3.5M; сессия с девятью компакциями — 2.9 млрд при контексте 405k) остаётся
    # основанием для СУЩЕСТВОВАНИЯ потолка сессии, но не для его величины.
    # ЧЕГО НЕ ДЕЛАТЬ: калибровать по одной сессии и по стоимости в рублях — цена меняется прайсом, а
    # порог должен мерить работоспособность.
    #
    # ═══ ПОПРАВКА ВЛАДЕЛЬЦА 18.08.2026: ЭТО ДВЕ РАЗНЫЕ ОСИ, И КОНТЕКСТНЫЙ ПОРОГ — ЭКОНОМИЧЕСКИЙ ═══
    # Формулировка выше («порог занижен / должен мерить работоспособность») НЕВЕРНА для контекста.
    # Разделяем:
    #   * ПОТОЛОК СПОСОБНОСТИ — компакт контекста, ~1M токенов (назван владельцем как реальный предел
    #     сессии без компакта). До него сессия физически работает;
    #   * ПОРОГ ЭКОНОМИКИ — ~400k контекста, и он НИЖЕ по построению: каждый ход заново оплачивает
    #     весь контекст, поэтому стоимость хода растёт вместе с контекстом. «Превышен на здоровой
    #     сессии» НЕ значит «занижен» — значит ПЕРЕПЛАЧИВАЕШЬ за тот же результат. Новая сессия
    #     обнуляет контекст и возвращает дешёвый ход.
    # Отсюда две правки к тому, что написано выше:
    #   1. «порог должен мерить работоспособность» — неверно для контекста: он мерит СТОИМОСТЬ хода.
    #      Перекалибровка — про «где стоимость хода перестаёт стоить результата», НЕ про «поднять до 1M»;
    #   2. «85.2M при потолке 20M — вчетверо, а работа здоровая» — это НЕ довод, что потолок занижен:
    #      20M — кумулятивный расход с перечитыванием кэша, он и РАСТЁТ оттого, что контекст большой и
    #      каждый ход его перечитывает. Это подтверждение экономической природы, а не опровержение порога.
    # ЗАМЕР ЭТОЙ СЕССИИ (18.08, `7c21eaa7`): контекст 523k [measured], 375 ходов, расход 111.3M — то
    # есть за ~400k стоимость хода уже росла, и это видно в кумуляте. Handoff записан перед сменой.
    #
    # ЗАОДНО ПРОВЕРИТЬ, СУЩЕСТВУЮТ ЛИ вообще числа автономии подсессий (потолок траты на подсессию и
    # их количество): в разборе 17.08 они названы, в коде я их не нашла. Если их нет — запись о них
    # тоже не появится (см. ep-2026-08-13-session-ceiling-and-context-thresholds).

