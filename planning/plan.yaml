  - id: delivery-size-warns-before-breach
    title: Потолок объёма поставки предупреждает до пробоя, а не только после
    type: quality
    goal: green-means-checked
    status: todo
    owner_role: engineer
    depends_on: []
    write_scope: [tests/unit/test_installer.py, ai_ops_kit/validation/]
    value: medium
    affects: {engineering_quality_security: true, delivery_operations: true}
    # ПОВОД — ЗАМЕР, а не ощущение. Потолок объёма managed поднимали 2026-08-13 (3.2 -> 3.3) с
    # запасом 73 670 Б. За ОДНИ СУТКИ запас съеден до 297 Б, и ни один из четырёх PR этого не
    # заметил: тест краснеет только на СЛЕДУЮЩЕМ коммите после исчерпания. Разбивка записана в
    # `tests/unit/test_installer.py` рядом с потолком — 66 138 Б из 73 372 пришли одной группой
    # работ (#96..#99), а упёрлась в стену правка на 6 520 Б, пришедшая последней.
    # ЧТО ИМЕННО НЕ РАБОТАЕТ. Проверка бинарна: «влезли» / «не влезли». Она не отвечает на вопрос,
    # который единственно полезен ЗАРАНЕЕ: «сколько запаса осталось и с какой скоростью он тает».
    # Поэтому дрейф виден только тому, кто пришёл последним, — и цена (поднять потолок либо резать
    # свою правку) достаётся не тому, кто её создал.
    # ПРЕДЛОЖЕНИЕ (не решение, решать при взятии): порог предупреждения на доле от потолка —
    # при остатке меньше ~10% сообщать в вывод прогона, оставаясь зелёным. Тогда исчерпание
    # называется В ТОТ прогон, где оно происходит.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: превращать потолок в advisory. Он блокирующий не случайно — это то же
    # число класса DERIVED, что и замеры слоёв; предупреждение добавляется К нему, а не ВМЕСТО.

  - id: printed-commands-are-runnable
    title: Команды, которые кит печатает человеку, исполняются как напечатаны
    type: engineering
    goal: checks-that-run
    status: todo
    owner_role: engineer
    depends_on: []
    write_scope: [ai_ops_kit/, tests/]
    value: medium
    affects: {engineering_quality_security: true, delivery_operations: true}
    # ОТКУДА: тот же отчёт -> B2-10 и B2-11, найдены подряд в одном прогоне.
    # B2-10: блокирующее сообщение велит «передай resume=True (--resume) … discard_previous=True
    #   (--discard)» — ни одного из этих флагов в CLI НЕТ.
    # B2-11: `resume` печатает команду продолжения `ai-ops resume . <wid> --execute`, и она падает
    #   сырым `ValueError: недопустимый workitem_id '.'` — позиционный `.` уходит в workitem_id.
    # ПОЧЕМУ ЭТО НЕ МЕЛОЧЬ: у кита объявлена цель «каждая объявленная точка входа работает», и она
    # проверяется по точкам входа. А человек набирает не точку входа, а СТРОКУ, которую кит ему
    # напечатал. Обе строки живут в ветках отказа — там, куда тесты не ходят, и куда попадает
    # человек в худший момент: когда у него уже что-то не получилось.
    # ПРЕДЛОЖЕНИЕ (решать при взятии): напечатанные команды проверять исполнимостью — парсить их тем
    # же парсером CLI в тесте. Тогда несуществующий флаг краснеет на CI, а не у владельца.

