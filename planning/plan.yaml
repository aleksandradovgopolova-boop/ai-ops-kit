    - tests/
    rationale: >-
      Риск, названный ревью: кит измеряет себя, анализирует себя, ревьюит себя, строит граф себя — и
      начинает быть продуктом для развития самого себя. Проверяемое противоядие — стрелка «работа кита →
      исход дочки», видимая числом. СТРОКОЙ В КАРТЕ, не гейтом: блокирующая проверка была бы ростом вширь,
      то есть ровно тем, что ревью запрещает двумя разделами выше (ревью само себе тут противоречит).
      Честный ноль и честное «не измерено» обязательны — как в метриках 4/5 сегодня.

  - id: north-star-becomes-evidence-backed-outcome
    title: >-
      Главная мера меняется с «идея → релиз» на «доля изменений, дошедших до ИЗМЕРЕННОГО результата
      с непрерывной цепочкой доказательств»
    type: product
    goal: prove-the-loop-not-add-capabilities
    status: waiting_on_owner
    waiting_on: >-
      смена главной меры продукта — решение владельца, а не вывод кита: кит себя не судит. Пока решения
      нет, метрика 1 остаётся «доля фич, дошедших от идеи до релиза» (сегодня 100%, 5/5).
    owner_role: product
    value: high
    human_decision: >-
      Ревью: «идея → релиз» слишком про доставку и потому берётся легко (100% уже сегодня), а обещание
      Vision — про обучение продукта. Предлагаемая мера строже: путь засчитывается только если результат
      ИЗМЕРЕН и цепочка доказательств не рвётся. Цена решения: заглавное число кита упадёт с 100%
      до честно низкого — это и есть смысл смены, но объявлять его должен владелец.
    write_scope:
    - ROADMAP.md
    - VISION.md
    - ai_ops_kit/
    rationale: >-
      Мера, которую легко взять, перестаёт быть мерой. Сегодня метрика 1 показывает 100% при метриках
      4 и 5 «не измерено» — карта выглядит зелёной там, где петля не замкнута.

  - id: moratorium-on-new-capabilities-recorded
    title: >-
      Мораторий «не добавляем возможности, пока петля не доказана» записан решением с критерием выхода
    type: product
    goal: prove-the-loop-not-add-capabilities
    status: waiting_on_owner
    waiting_on: >-
      мораторий — объявление владельца о том, что кит перестаёт принимать: без его слова это не решение,
      а мнение ревьюера. Нужны две вещи: объём запрета (новые агенты/гейты/команды/режимы/реестры) и
      критерий выхода (какой факт его снимает).
    owner_role: product
    value: medium
    human_decision: >-
      Механизм у кита уже есть и уже работал — `freeze_relation` на целях плюс запись решения (так
      держали freeze до живого прогона на ии-среде, ep-2026-09-16). Требуется не постройка, а объявление.
      Рекомендация: критерий выхода — петля «результат → урок → следующее решение», замкнутая на ии-среде
      реальными числами (это работа close-outcome-learning-loop-with-real-analytics, уже взятая).
    write_scope:
    - decisions/
    - planning/
    rationale: >-
      Записанное решение «не сейчас» отличает роадмап от списка желаний: через месяц никто не помнит,
      было это забыто или решено. Это правило кит уже применяет к разделу «Later» — здесь оно
      применяется к нему самому.

  - id: one-sentence-about-the-product-in-readme
    title: >-
      Одна фраза о том, что это за продукт — вместо описания механики
    type: product
    goal: prove-the-loop-not-add-capabilities
    status: todo
    owner_role: product
    value: medium
    source: "roadmap-direction"
    write_scope:
    - README.md
    rationale: >-
      Ревью: настоящий moat кита — не генерация кода, а «контекст + история решений + доказательства +
      доставка + результаты + обучение». Человеческая формулировка этого одной фразой у продукта пока
      отсутствует: вход честный и понятный (работа #1030), но говорит, ЧТО кит делает, а не ЧЕМ он
      отличается. Работа маленькая и намеренно отделена от смены главной меры: текст не должен обещать
      того, что ещё не решено.
