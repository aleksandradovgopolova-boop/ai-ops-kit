  - id: product-next-as-decision-engine
    # T3. `next` предлагает следующее ПРОДУКТОВОЕ решение из улик, а не только техническую задачу.
    # Прямое продолжение уже слитых `candidates` (кандидаты из роадмапа и находок аудита): там кит
    # готовит задачи-кандидаты, здесь — из накопленных улик поднимает продуктовое решение, которое
    # стоит принять следующим.
    # Взято в работу владельцем (accept кандидата 21.09); freeze_relation объявлен (обязателен для
    # каждой цели), но на живость активной цели не влияет (freeze этапа снят 2026-09-16).
    # ДОСТИГНУТА 2026-09-21 РЕШЕНИЕМ ВЛАДЕЛЬЦА (протокол: засчёт за владельцем, кит себя не судит —
    # как #745/#748/#701). Код влит: `next` из накопленных исходов поднимает НЕДОБРАВШИЕ фичи
    # (вердикт failed по числам / неподтверждённая гипотеза) продуктовым РЕШЕНИЕМ, а не техзадачей;
    # met+цель-взята+гипотеза-подтверждена — молчит; контракт без замера — честное «ещё не измерено».
    # Координация #1076 (`4c6487a7`) + код #1077 (`73a9084b`). Владелец по-прежнему принимает решение
    # сам (`candidates accept`). СВЯЗЫВАНИЕ уже слитого `candidates`, а не рост вширь.
    freeze_relation: extension
    status: achieved
    outcome:
      # `next` называет следующее продуктовое решение из улик (неподтверждённые гипотезы,
      # недоработавшие фичи, устаревшие допущения, повторяющиеся находки), а не только тех-задачу.
      # ФЛИПНУТ в true 2026-09-21 решением владельца (см. комментарий цели): недобравший измеренный
      # итог поднимается продуктовым решением; покрыто тестами, независимое ревью — pass. #1077.
      next_proposes_the_next_product_decision_from_evidence: true
      # Поднимает провалившиеся гипотезы и недоработавшие фичи, а не только зелёный бэклог.
      # ФЛИПНУТ в true 2026-09-21 решением владельца: failed-по-числам и неподтверждённые гипотезы
      # всплывают в `candidates`/`inbox`, зелёный бэклог не шумит. #1077.
      next_surfaces_failed_hypotheses_and_underperforming_features: true
  - id: risk-based-ceremony
    # T4. «Сложность растёт с риском, а не с полнотой»: связка риск → церемония видима, есть сторож
    # против расползания церемонии, метрика Time-to-Next-Decision. Частично уже есть (уровни L0…L3).
    # Взято в работу владельцем (accept кандидата 21.09); freeze_relation обязателен, но на живость
    # цели не влияет (freeze этапа снят 2026-09-16).
    # ДОСТИГНУТА 2026-09-21 РЕШЕНИЕМ ВЛАДЕЛЬЦА (протокол: засчёт за владельцем, кит себя не судит).
    # СВЯЗЫВАНИЕ, не рост вширь: движок «риск→уровень процесса» (`gates/spec_levels.classify`, L0…L3)
    # уже был. Код влит: (1) ВИДИМАЯ строка `ui/presenter_ceremony.py` — «объём процесса подобран под
    # РИСК, а не под полноту: <сколько>, потому что <почему>»; честная приписка, когда тяжесть не
    # заявлена; (2) сторож `gates/spec_levels.ceremony_budget_errors` — бюджет разделов/уровень +
    # монотонность на накопленном множестве + без дублей. Независимое ревью поймало блокер (базовый
    # L3 падал в «по максимуму, потому что задача мелкая») — починено до слияния. Координация #1078
