    # ПОВОД — ЗАМЕР НА ЖИВОЙ СЕССИИ КИТА, 17.08.2026 (сессия `88c802ae`, 329 ходов). Владелец
    # спросила, почему кит не следит за лимитами сессии. Проверка показала обратное тому, что
    # ожидалось: СЛЕДИТ, и точно. `ai-ops session` на той же сессии напечатал контекст 427k
    # [measured], «прочитала 85.2M из 20.0M [over_budget]», исход NEW_SESSION и точную команду
    # выхода. Оба числа — из транскрипта рантайма, а не оценка.
    #
    # ЧТО БЫЛО СЛОМАНО НА САМОМ ДЕЛЕ — не измерение, а ДВА ДРУГИХ МЕСТА:
    #   1. никто не спрашивал. Совет живёт на двух путях: `_session_guard_before_start`
    #      (`cli/ai_ops_cli.py:961`, только `do` и `run --execute`) и конец прогона движка
    #      (`engine/ai_ops_run.py:1512`). Обычная рабочая сессия — разбор, правки, ревью — не
    #      проходит ни через один, и кит молчит не потому, что «норма», а потому, что его не звали;
    #   2. когда спрашивали — он ВРАЛ в последней строке. «Что сохранено: … handoff_created …» и
    #      «Handoff/решения сохранены в репозитории» были КОНСТАНТАМИ: параметр `handoff_saved=True`
    #      по умолчанию, которого ни один из двух вызывающих не передавал, и строковая константа в
    #      тексте рекомендации. Сессионного handoff в ките не существовало ни одного файла. То есть
    #      совет «уходи в новую сессию» успокаивал ровно там, где обязан предупредить.
    #
    # ЭТО СВОЙ СОБСТВЕННЫЙ КЛАСС «ОБЪЯВЛЕНО — НЕ ИСПОЛНЯЕТСЯ», в ритуале, который сам проверяет
    # честность закрытия работы. Ни один из 1800+ тестов его не видел: все они проверяли, что
    # функция возвращает то, что в неё написано. `rules/core/SessionEconomyPolicy.md:110-116`
    # объявляет Task Completion Ritual ОБЯЗАТЕЛЬНЫМ («без этого задача не считается закрытой») — и
    # один его пункт был неопровержим по построению.
    #
    # СДЕЛАНО: `engops/session_handoff.py` — SESSION COMPLETE с разделами разбора владельца
    # (Goal/Done/Decisions/Changed/Tests/Open/Next/Risks). Разделы НАЗВАНЫ ИМЕНАМИ `RunHandoff`
    # дословно: тот уже несёт те же семь полей, и заводить второй словарь значило бы развести две
    # правды об одном. Предмет разный, и это единственная причина второй сущности: `RunHandoff` —
    # один прогон движка по одному WorkItem (`features/<wid>/run-handoff.yaml`, читается `resume`);
    # `SessionHandoff` — рабочий контекст целиком, включая работу, которую движок не делал. Замер, из
    # которого видно, что одного `RunHandoff` мало: в сессии `88c802ae` 329 ходов, движок не звался
    # ни разу, `features/` пуст — весь труд сессии не имел носителя вообще.
    # Заявление заменено на ВЫВОД: `handoff_created` считается из наличия файла, параметр
    # `handoff_saved` УДАЛЁН (не переименован — вернуть его значит вернуть ложную галочку), обе
    # безусловные фразы про handoff заменены на производные, и «не смог посмотреть» отличается от
    # «не сохранён». Страж CLI на исходах `new_session`/`clear` теперь ПИШЕТ handoff, а не только
    # советует уйти.
    # Мутационный замер: 3 пробы (2 охранные, 1 шовная), выжило 0, база зелёная. Шовная ломает
    # именно вызов из стража — модуль можно написать и покрыть тестами, и он останется мёртвым, как
    # уже было с `from_doctor` и со всей политикой экономии сессии до 13.08.2026.
    #
    # ЧЕГО В ЭТОЙ РАБОТЕ НЕТ (осознанно, каждое — отдельной работой ниже): проактивного наблюдения
    # (кит по-прежнему говорит только когда его позвали), Checkpoint как сущности, переезда handoff
    # между машинами, и решения владельца о порогах и обязательности ритуала.

