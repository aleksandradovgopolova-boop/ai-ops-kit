    freeze_relation: extension
    status: achieved
    outcome:
      # Объём процесса подбирается по названному/подразумеваемому риску, а не по «заполни всё».
      # ФЛИПНУТ в true 2026-09-21 решением владельца: связка риск→церемония ВИДИМА человеку строкой
      # presenter_ceremony; покрыто тестами (включая базовый L3 после фикса блокера). #1079.
      ceremony_scales_with_risk_not_completeness: true
      # Есть сторож против расползания церемонии (процесс не тяжелеет впустую).
      # ФЛИПНУТ в true 2026-09-21 решением владельца: `ceremony_budget_errors` краснит превышение
      # бюджета разделов, немонотонность по уровням и дубли; покрыто тестами. #1079.
      ceremony_creep_is_guarded: true
  - id: portfolio-intelligence
    # T5. Кит учится на ОБЕЗЛИЧЕННЫХ паттернах отказов дочек — без кода и данных пользователей, только
    # паттерны. Граница анонимизации — часть DoD.
    #
    # ВЗЯТО В РАБОТУ 2026-09-21 (T5, третье из четырёх направлений внешнего ревью). ОТСТУПЛЕНИЕ,
    # НАЗВАННОЕ ЯВНО: роадмап держал направление «ПОСЛЕ вертикального среза product-memory». Разведка
    # 2026-09-21 показала, что это ПОРЯДОК-дисциплина владельца, а НЕ зависимость по данным: механизм
    # агрегации отказов уже существует (`intelligence/precedent_ledger.precedents_from_observations`
    # группирует наблюдения дочек в классы-прецеденты), питается каналом `findings/from-children`
    # (`engops/kit_feedback.py`) и НЕ потребляет структур product-memory. Владелец снял порядок для
    # T3/T4 (accept 21.09) и направил «дальше» на T5 — отступление законно и записано.
    #
    # СРЕЗ ПО ПРАВИЛУ РЕВЬЮ «связать и доказать, не расти вширь»: агрегация есть — не хватает ровно
    # DoD, границы анонимизации. Сейчас канал тащит `child.path` (абсолютный путь машины), `child.commit`,
    # сырой вывод команд; `precedent_ledger._observation_context` ключует контекст по имени/пути дочки —
    # опознаёт. Работа `portfolio-patterns-anonymized`: портфельный вид ключуется на анон-id
    # `proj-<sha256>` (`engops/child_registry.project_anon_id`), несёт ТОЛЬКО класс отказа + счётчики +
    # обезличенный контекст, и сторож краснит утечку любого опознающего поля (путь/коммит/имя/сырой
    # вывод/код) в портфельный вид.
    #
    # ДОСТИГНУТА 2026-09-21 РЕШЕНИЕМ ВЛАДЕЛЬЦА (протокол: засчёт за владельцем, кит себя не судит).
    # Код влит: команда `portfolio` + `intelligence/portfolio_patterns.py` (обезличенный вид на
    # `proj-<sha256>`) + сторож `check_anonymized`. Независимое ревью НАШЛО и мы ЗАКРЫЛИ блокер до
    # слияния: канал `load_findings` не проверяет enum, поэтому свободный текст в `observation_class`
    # мог протащить идентификацию — починено нормализацией у источника + белым списком классов в
    # стороже. Координация #1081 (`16eeb1b0`) + код #1082 (`992c873d`). СВЯЗЫВАНИЕ, не рост вширь.
    freeze_relation: extension
    status: achieved
    outcome:
      # Повторяющиеся классы отказов дочек поднимаются в материнский кит обезличенно (без кода/evidence).
      # ПРИЁМКА: портфельный вид отказов ключуется на анон-id `proj-<sha256>` и несёт только класс +
      # счётчики + обезличенный контекст; опознающие поля (путь/коммит/имя дочки/сырой вывод/код) в него
      # НЕ попадают, и это стережёт проверяемый сторож (тест краснеет на подсунутом опознающем поле).
      # ФЛИПНУТ в true 2026-09-21 решением владельца: граница анонимизации построена, стережётся
      # `check_anonymized` (структурно/по ключам/по форме + белый список классов), покрыта адверсариальными
      # тестами (включая утечку через класс, найденную независимым ревью). #1082.
      kit_learns_failure_patterns_across_child_portfolio_anonymously: true
  - id: operating-modes
    # T6. Один kernel, разные режимы (Product/Design/Engineering/Delivery/Founder) как тонкая ЛИНЗА
    # поверх существующего слоя аудитории (audience: product|technical|debug), НЕ отдельные продукты.
    #
    # ВЗЯТО В РАБОТУ 2026-09-21 (T6, ПОСЛЕДНЕЕ из четырёх направлений внешнего ревью). Разведка 2026-09-21:
    # субстрат аудитории есть (`registry/communication-policy.yaml` → `ui/presenter_core.audience_from_config`
    # → централизованный `render`), режимов в рантайме нет. ВАЖНО: реестр уже рекламирует пять
    # роль-аудиторий в `evaluation.audiences` со `status: partial` — это направление и есть их обещанное
    # ПРОДОЛЖЕНИЕ, а не новая поверхность.
