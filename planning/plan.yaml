    # ПОВОД — ЗАМЕР (EV-1112): 236 версий за 40 календарных дней, и ни одного механизма, проверяющего
    # выпуск. `CHANGELOG.md` правлен 401 раз — больше любого файла кода в 4.5 раза (следующий,
    # `tools/execution_pipeline.py`, — 89), манифест 270, VERSION 260; на восемь служебных файлов
    # пришлось 25% ВСЕХ касаний файлов в истории.
    # ЧЕСТНО О РАЗМЕРЕ БОЛИ: находок поля этот класс не дал НИ ОДНОЙ. Работа берётся не потому, что
    # что-то сломалось, а потому что механизма нет вовсе, — и это ровно класс (б) из собственных
    # замеров кита («объявлено, но не исполняется»), только с другой стороны: здесь не объявлено и
    # не исполняется. Поэтому value: medium, а не high, и место в очереди — последнее.
    # ЧТО ИМЕННО ВЗЯТЬ (EV-1137, EV-1138): два разных гейта, ни один инструмент не даёт оба.
    #  * `towncrier check` — ЕДИНСТВЕННЫЙ из шести рассмотренных инструментов, у кого есть гейт
    #    «в этой ветке добавлена запись для changelog»: берёт `git diff --name-only` против базы,
    #    при отсутствии фрагментов печатает «No new newsfragments found on this branch» и выходит с
    #    кодом 1. Модель фрагментов заодно снимает конфликты в файле на 364 КБ: правки идут в разные
    #    новые файлы. РЕТРО-МИГРАЦИЯ НЕ НУЖНА — старый CHANGELOG.md остаётся как есть.
    #  * `cz bump --check-consistency` (commitizen) — гейт согласованности версии по всем местам,
    #    куда она штампуется (VERSION, манифест, managed-копия), код выхода 17.
    # ЦЕНА И РИСК НАЗВАНЫ: оба dev-only, в поставку не едут, правило AGENTS.md:39 не нарушено;
    # 0.5-1 день. Риск владельца: towncrier выпускался последний раз 30.08.2025 — почти год без
    # релиза при живом trunk. Митигация: фрагменты — просто файлы в каталоге, а `check` — около 40
    # строк логики, воспроизводимых своими силами, если проект замрёт.
    # НЕИЗВЕСТНОЕ, КОТОРОЕ НАДО СНЯТЬ ПЕРВЫМ — с ПЕРЕСЧИТАННЫМ замером. Из 594 коммитов без слияний
    # 72 не несут conventional-префикса; из них 64 — старый формат «vX.Y.Z — Название», а 8
    # остальных это русские заголовки и самодельные префиксы (`plan:`, `R-39:`, `qualification+fix:`,
    # `Находка R-41:`). Первая версия этого комментария называла 21 и 20 — числа были взяты на глаз
    # из гистограммы префиксов и оказались неверны; пересчёт сделан до слияния. Сработает ли
    # `cz check` на этой истории — НЕ ГОНЯЛОСЬ; если потребует правки формата прошлых коммитов,
    # гейт вводится только на новые (`cz check --rev-range` от точки включения).
    #
    # ОТВЕТ ВЛАДЕЛЬЦА 17.08.2026 (ep-2026-08-17-dev-velocity-first-steps, пп. 3 и 4):
    #   — гейты вводить СТРОГИМИ СРАЗУ, но ТОЛЬКО НА НОВЫЕ коммиты. Историю не переписываем: правило,
