# ЧТО ЗДЕСЬ ЛЕЖИТ, А ЧТО НЕТ (`plan-as-control-plane`, 2026-08-14). Активный план — это ответ на
# четыре вопроса управления: где мы, что идёт сейчас, что блокирует и чем, какую работу взять
# следующей. Поэтому здесь ТОЛЬКО незакрытая работа (`todo`/`in_progress`); закрытая, вместе со
# своим разбором, уезжает в `history/plan-history.yaml`. Повод — замер: 21 работа из 32 была `done`,
# и чтобы ответить «что идёт», приходилось вычитывать разбор давно оплаченных дефектов.
#
# ПРАВИЛА ПРОВЕРЯЕТ КОД (`delivery_plan.validate` / `validate_history`), а не соглашение:
#   * `done`/`dropped` в этом файле — ошибка: место закрытой работы в истории;
#   * указан `pr` при статусе `todo` — ошибка: PR существует, значит работа начата;
#   * `in_progress` без `pr`/`branch` — предупреждение: состояние работы негде посмотреть;
#   * `evidence`/`finding` обязаны резолвиться от корня: ссылка на доказательство, которого нет,
#     хуже её отсутствия;
#   * в истории `done` обязан назвать РЕЗУЛЬТАТ и место перепроверки (`pr`/`commit`/`evidence`);
#     merged PR сам по себе результатом не считается.
#
# ЧЕГО ЗДЕСЬ НЕТ ОСОЗНАННО: каталога `findings/`. Реестр находок в ките уже есть —
# `docs/audit-report.md` (R-01…R-41) плюс отчёты в `qualification/`; заводить второй означало бы
# развести две правды об одной находке (принцип `dp-001`: дубли уже построенного отклоняем).

  # ─── этап Product Operating Layer (решение владельца 20.08.2026) ─────────────────────────
  # Продуктовые требования PR-1..PR-25: AI Ops как операционная система управления продуктовой
  # разработкой, а не набор инструментов. Превращает Git-репозиторий в AI-managed product workspace.
  # Цикл: Strategy → Roadmap → Backlog → Prioritization → Delivery → Release → Feedback → Replanning.

  - id: product-operating-layer
    # заморозка: новый продуктовый слой — новое умение
    freeze_relation: extension
    status: active
    outcome:
      # Phase 1: обязательные артефакты, реестр, шаблоны, Product Passport, bootstrap, валидация.
      artifact_registry_exists_as_data: false
      templates_have_versions_and_migrations: false
      product_passport_auto_generated: false
      bootstrap_creates_product_layer: false
      validation_reports_missing_invalid_outdated_valid: false
      continuous_audit_runs_periodically: false

  - id: backlog-intelligence
