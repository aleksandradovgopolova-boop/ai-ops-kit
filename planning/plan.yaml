  - id: parallel-sessions-are-traceable
    title: Кит знает, КТО держит работу сейчас, а не только какие работы существуют
    type: engineering
    goal: team-works-in-parallel
    status: todo
    owner_role: engineer
    depends_on: []
    write_scope: [ai_ops_kit/lifecycle/, ai_ops_kit/engine/, ai_ops_kit/cli/, rules/core/, tests/,
                  quality/]
    value: high
    affects: {delivery_operations: true, planning_execution: true, engineering_quality_security: true}
    # ЗАМЕР ПОТРЕБИТЕЛЯ (заявка #150, ИИ-Среда, 17.08.2026): за ТРИ ЧАСА в main влито ДЕВЯТЬ PR из как
    # минимум ЧЕТЫРЁХ параллельных сессий (видно по префиксам ветвей: `work/`, `ai-ops/`, два разных
    # `claude/…`). Ни одна сессия не могла узнать о работе других. Четыре следствия, каждое проверяемо:
    #   1. ДВОЙНАЯ РАБОТА НА ОДНОЙ ВЕТКЕ: сессия A открыла PR #526 на ветку `ai-ops/c6-8-rights-read-once`
    #      и описала срез; сессия B в те же минуты создала #527 НА ТУ ЖЕ ВЕТКУ и слила. #526 остался
    #      закрытым пустым дублем, перенаправить базу нельзя (`Cannot change the base branch of a
    #      closed pull request`) — половина работы по описанию выброшена;
    #   2. СЛИЯНИЕ ИЗ-ПОД ЧУЖИХ РУК: команда слияния вернула `Pull request #525 was already merged` —
    #      слили из другой сессии, пока первая ждала проверок. Договорённость «сливаю после зелёного»
    #      в такой схеме НЕВОЗМОЖНО соблюсти в одиночку;
    #   3. АТРИБУЦИЯ НЕВОЗМОЖНА: у всех слияний один `mergedBy` — токен общий; `report-history` пишет
    #      по фиче, а не по сессии. Инцидент нельзя разобрать и автора нельзя спросить;
    #   4. КОНФЛИКТЫ МНОЖАТСЯ НА ПАРАЛЛЕЛИЗМЕ: один и тот же конфликт разрешался пять раз за час, по
    #      разу на каждую задетую ветку (`derived-state-out-of-tracked-files`).
    # ЧЕГО НЕТ, А НУЖНО (формулировка потребителя, она точная): кит УЖЕ владеет `features/<id>/` и
    # планом, то есть знает, какие работы существуют, но не знает, КТО ИХ ДЕРЖИТ.
    #   * заявка на работу (claim/lease) при `run --execute`: сессия, машина, время, ветка. Вторая
    #     сессия на ту же работу или ту же ветку получает отказ или явное предупреждение;
    #   * видимый список «кто что держит сейчас» одной командой;
    #   * атрибуция в истории отчётов — идентификатор сессии, а не только фича;
    #   * владелец слияния назван в протоколе (у потребителя это развели ВРУЧНУЮ в середине дня, и
    #     до этого три PR ушли в main при незавершённых проверках).
    # ═══ РЕШАЮЩИЙ ЗАМЕР 18.08.2026: РЕЕСТР ЛОКАЛЕН, ПОЭТОМУ КОМАНДУ НЕ КООРДИНИРУЕТ ВООБЩЕ ═══
    # `.ai/runtime/active-work.yaml` лежит в `.gitignore` — проверено `git check-ignore` и у кита
    # (`.gitignore:22`), и у дочки ИИ-Среда (`.gitignore:48`); в дочке файл не отслеживается git вовсе.
    # Значит «кто что держит» видит ТОЛЬКО своя машина. Всё, что построено поверх такого реестра
    # (предупреждение о пересечении, совет «не трогай те же файлы», отказ второй сессии), для команды
    # на разных машинах не работает по построению, а не из-за дисциплины. Договорённость «сливаю после
    # зелёного» невозможно соблюсти в одиночку — это свойство механизма, и владелец 17.08 разводила
    # слияния ВРУЧНУЮ именно поэтому.
    # ЭТО МЕНЯЕТ ПОРЯДОК РАБОТЫ: пока заявка не видна другим, claim/lease поверх локального файла —
    # это ложное чувство защиты. Носитель — первый шаг, а не деталь реализации.
    human_decision: >
      НОСИТЕЛЬ ОБЩЕЙ ЗАЯВКИ НА РАБОТУ — за владельцем, потому что упирается в её же правило «ничего из
      дочки в сеть без явного решения» (дочка может быть закрытым продуктом, а заявка несёт её пути,
      ветки и имена задач). Варианты и их цена: (а) отслеживаемый файл заявок в репозитории — работает
      офлайн и виден всем, но сам становится точкой конфликта, поэтому только формата «файл на работу»,
      никогда одним файлом; (б) сторона GitHub (черновой PR, метка, issue как держатель) — конфликтов
      нет и видно всем, но нужна сеть, права токена и согласие на то, что имена задач уходят в сервис;
      (в) гибрид: локальная заявка + публикация в GitHub только по явному включению в `.ai-ops.yaml`.
      Пока решения нет, работа НЕ берётся: реализовать claim поверх локального файла значит выдать
      несуществующую координацию за существующую.
    # ОТНОШЕНИЕ К ЗАМОРОЗКЕ УМЕНИЙ: сверка реестра, атрибуция и владелец слияния — закрытие найденных
    # ПОЛЕМ дефектов (оговорка `ep-2026-08-17-capability-freeze…`, новым умением не считаются). Работа
    # команды из НЕСКОЛЬКИХ ЛЮДЕЙ как таковая — личная атрибуция вместо общего токена и общий носитель
    # заявки — за оговорку ВЫХОДИТ, и это названо здесь, чтобы заморозку не обходили словами.
    # СВЯЗЬ, А НЕ ДУБЛЬ: `registry-reconciles-with-base` чинит сверку записи с базой,
    # `what-is-running-answered-from-the-plan` — сверку реестра с планом. Здесь третье: реестр не
    # знает про ЧУЖИЕ сессии, потому что в него пишет только своя.
    # ЖИВОЕ ПОДТВЕРЖДЕНИЕ 18.08.2026, в этой же сессии: дочку ИИ-Среда обновили до 3.36.12 из другой
    # сессии, пока я работала. Узнала я об этом ПО ДАТАМ ФАЙЛОВ, а не от механизма.

