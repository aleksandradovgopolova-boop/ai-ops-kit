    # `verdict=needs-reviewer`, 1 изменённый файл. Ловушка воспроизведения: если ветки работы
    # `ai-ops/<wid>` нет, кит выходит РАНЬШЕ по `no-branch` и падения не видно — проба обязана
    # создавать ветку, иначе тест зелен впустую (я на этом ошиблась утром того же дня).
    # Семантику отсутствующей базы чинит `absent-base-is-resolved-or-refused`; здесь — только то,
    # что наружу не летит traceback.
    # ЧЕМ БУДЕТ ИСПОЛНЯТЬСЯ: тем же прогоном pytest. Флаги — сверкой имён из текста сообщений с
    # парсером CLI; причина — тестом ветки отказа с проверкой, что названная причина и есть
    # сработавшая; сырой traceback — тестом, что верхний уровень CLI не выпускает исключение наружу.
    # hypothesis для этого УЖЕ СТОИТ и используется (EV-1120: 41 декоратор `@given`, но в двух файлах
    # из 271 и не в этом слое) — генеративный тест разбора аргументов новой зависимости не требует.
    # МУТАЦИОННАЯ ПРОБА ОБЯЗАТЕЛЬНА: снятие каждой новой проверки обязано ронять свой тест, и это
    # называется в отчёте (`quality/mutation-probes.yaml`, правило dp-002).

  - id: child-lag-is-a-gate-not-a-hope
    title: Дочка САМА говорит, что отстала от кита — гейтом с кодом возврата, а не отчётом
    type: engineering
    goal: second-real-brownfield
    status: todo
    owner_role: engineer
    depends_on: []
    evidence: .research/decisions/DP-114.yaml
    human_decision: >
      Развилка МЕХАНИЗМА, и она за владельцем: (а) перейти на copier (внешний dev-инструмент, MIT)
      — он единственный из трёх шаблонизаторов даёт и обновление со smart-diff, и миграции с
      диапазонами версий, и готовый гейт `copier check-update --quiet` с кодом выхода 2 (EV-1130);
      цена 3-5 дней и замена самого переделываемого файла кита (EV-1111: installer/ai_ops.py, 21
      исправление из 56 коммитов); либо (б) оставить своё копирование и пристроить гейт отставания к
      существующему `ai_managed_checksums.py` — дешевле (1-2 дня), но миграции и наложение правок
      владельца остаются своими. Решение принимать ПО РЕЗУЛЬТАТУ разведки, описанной ниже, а не до неё.

      ОТВЕТ ВЛАДЕЛЬЦА 17.08.2026 (ep-2026-08-17-dev-velocity-first-steps, п. 1): СНАЧАЛА РАЗВЕДКА НА
      ПОЛДНЯ, решение по замеру. Замена установщика вслепую отвергнута — это самый переделываемый
      файл кита, и ошибка в нём дороже полудня проверки. Развилка (а)/(б) остаётся ОТКРЫТОЙ до
      замера; закрывает её ровно один вопрос: сохраняются ли правки владельца в дочке после
      обновления внешним шаблонизатором. Разведку проводить на КОПИИ дочки, а не на живом
      репозитории.
    write_scope: [installer/, ai_ops_kit/validation/, tests/, docs/]
    value: high
    affects: {delivery_operations: true, engineering_quality_security: true}
    # ПОВОД — ЗАМЕР (EV-1110): второй по размеру класс находок поля — «исправление живёт в ките и не
    # доезжает до установленной копии»: 8 находок из 48 (17%) — F-030, F-031, F-032, F-033, B2-15,
    # B2-19, B2-29, OK-01. F-032 показал форму дефекта точнее всего: в дочке лежали ОБЕ версии точки
    # входа — обновлённый шаблон и старый корневой `./ai-ops`, — и отчёт обновления об этом молчал.
    # ЧЕГО НЕ ХВАТАЕТ ИМЕННО: не механизма обновления (он есть) и не миграций (они есть с 17.08,
    # EV-1119: `migrations/` с парами up/down и цепочкой в `package_migrations`), а ГЕЙТА: команды,
    # которая в CI дочки падает, если дочка отстала. Сейчас такой команды нет ни в одном виде.
    # ОТКУДА ИДЕЯ ДВУХ ГЕЙТОВ (EV-1139, Django, подсмотрено — зависимость не берётся): гейт нужен в
    # ДВУХ местах, а не в одном. `makemigrations --check` в CI РОДИТЕЛЯ ловит «формат конфига
    # поменяли, миграцию не написали»; `migrate --check` в CI ДОЧКИ ловит «состояние отстало от
    # версии инструмента». У кита сейчас нет ни одного из двух.
    # РАЗВЕДКА ДО РЕШЕНИЯ, полдня, полный порядок шагов — в DP-114 -> proposed_validation. Замер,
    # который решает развилку: сохранились ли правки владельца после `copier update` на РЕАЛЬНОЙ
    # дочке и отдал ли `check-update --quiet` код 2 на не обновлённой копии. Хотя бы одно «нет» —
    # берётся вариант (б).
    # ЛОВУШКА, КОТОРУЮ НЕЛЬЗЯ ПРОПУСТИТЬ (EV-1131): copier берёт последний ТЕГ шаблона, а не HEAD, и
    # при грязном локальном шаблоне молча ставит старое состояние. У этого репозитория такая ошибка
    # УЖЕ БЫЛА в другой форме — локальный источник стоял на неслитой ветке, и установка поставила
    # её. Если берётся вариант (а), гейт «источник установки — выпуск, а не ветка» пишется в тот же
    # день, иначе класс не закроется, а сменит форму.

