    # ПОВОД — ЗАМЕР, А НЕ СООБРАЖЕНИЕ (EV-1107, EV-1108, EV-1109). За 14-17.08.2026 CI дал 163
    # прогона и НОЛЬ падений; в те же четыре дня живые прогоны на чужих репозиториях дали 40
    # находок. Всего семь живых прогонов за 06-15.08 дали 48 находок, средняя цена прогона — 6.9
    # находки. При этом 268 тестовых файлов из 271 лежат в `tests/unit`, а `tests/integration`,
    # `tests/live` и `tests/regression` содержат ТОЛЬКО README.md. То есть 99% усилия вложено в
    # слой, где находок поля не было, а слой, давший все 48, не покрыт ничем.
    # ЧТО ИМЕННО СДЕЛАТЬ: прогон, который в одноразовом репозитории (git init или репозиторий-
    # фикстура) проходит путь владельца целиком — install -> doctor -> onboard -> specify -> plan ->
    # next -> status — и падает на том, на чём падал владелец: точка входа `./ai-ops` в дочке,
    # разбор `<интент> "текст" --feature X`, состав поставки валидаторов, валидность плана дочки
    # после подъёма версии. Каждый пункт списка — уже случившаяся находка (F-031, F-032, F-033, F-030).
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: гонять это как ещё одну джобу того же слоя. Замер EV-1107 говорит, что
    # добавлять проверки туда, где 163 прогона зелёные, бессмысленно — прогон обязан идти В ЧУЖОМ
    # ДЕРЕВЕ, иначе он проверяет не то. И не подменять живой прогон: `second-brownfield-run` эту
    # работу не заменяет и ею не заменяется — там продукт и владелец, здесь механизированный путь.
    # ВНЕШНИЙ ИНСТРУМЕНТ НЕ НУЖЕН: разведка DP-114 не нашла ничего, что делало бы это дешевле
    # своих рук; цена — 1-2 дня инженера. Стоимость прогона (минуты, деньги при живом провайдере)
    # НЕ ИЗМЕРЕНА и должна быть названа при взятии, а не после.
    #
    # ОТВЕТ ВЛАДЕЛЬЦА 17.08.2026 (ep-2026-08-17-dev-velocity-first-steps, п. 2): НАЧАТЬ БЕЗ ЖИВОЙ
    # МОДЕЛИ. Причина названа ею прямо: бесплатный и повторяемый прогон пойдёт на каждую заявку, а
    # платный не пойдёт ни на одну. Живая модель — ОТДЕЛЬНОЙ ночной проверкой, и только после того
    # как стоимость прогона измерена. Значит первая версия работы обязана быть исполнима с
    # `--provider mock` целиком, а места, где мок делает путь непроверяемым, — назвать, а не обойти.

