  - id: plan-yaml-edits-do-not-conflict-in-parallel
    title: >-
      Правки plan.yaml из параллельных работ не порождают ручных конфликтов слияния — разбивка по
      работам либо явная стратегия (report-history уже закрыт union, остаётся структурный plan.yaml)
    type: engineering
    goal: team-works-in-parallel
    status: todo
    owner_role: engineer
    value: high
    issue: 148
    write_scope: [ai_ops_kit/planning/, installer/, tests/]
    reason: >-
      Поле 17.08.2026 (ii-sreda): plan.yaml — самый правимый файл кита (25 коммитов/неделю), его
      меняет каждый срез работы, и параллельные ветки дают ручной конфликт на одной строке.
      Append-only журналы (report-history/*.jsonl) уже закрыты — installer ставит .gitattributes
      merge=union. Но к структурному plan.yaml union сознательно не применяют (склеит в битый YAML),
      а разбивку по работам (PR #290) закрыли. Открытый исход цели: kit_edits_do_not_create_conflicts:
      False. Готово, когда правки plan.yaml из двух параллельных работ сводятся без ручного
      разрешения — разбивкой по работам (файл на работу) либо иной проверенной стратегией. Заявка #148.

  - id: declared-tools-and-gates-prove-they-run
    title: >-
      Инвентарь «объявлено → исполняется»: каждый инструмент из [dev]-зависимостей, каждый
      pre-commit-хук и каждый ратчет имеет машинное доказательство «вызывается вот здесь»
    type: engineering
    goal: checks-that-run
    status: in_progress
    owner_role: engineer
    value: high
    write_scope: [ai_ops_kit/validation/, packages/, tests/, registry/]
    reason: >-
      КОРЕНЬ, а не находка. Три из трёх старших находок аудита — один класс «объявлено, но не
      исполняется», в местах, куда чистка не дошла: mypy (объявлен, не запускается), README-счётчик
      (заверение есть, число не подключено), гейт слоёв (исполнялся, но мерил не предмет). Ревизия
      этого класса держится на памяти владельца, а не на машине. Готово, когда есть инвентарь (гейт
      ~40 строк): каждый dev-инструмент, хук и ратчет либо имеет доказательство запуска, либо помечен
      «выключен, причина EP-XXXX»; новый объявленный-но-не-запущенный краснеет.
    progress_note: >-
      v1 доставлен: validate_enforcement_inventory + registry/enforcement-inventory.yaml покрывают две
      острые оси — dev-инструменты (requirements-dev + pyproject [dev]) и ратчет-baseline'ы
      (packages/*baseline*.yaml). Сразу называет mypy честно unenforced (F-05). Под рантайм-контрактом
      (STANDALONE) — гоняется в CI. Остаётся третья ось: pre-commit-хуки (зеркала в CI vs local-only).

  - id: layering-pairs-decoupled-by-substance
    title: >-
      Пять взаимных пар capabilities развязываются по существу (DI/перенос/решение «кто зовёт»),
      начиная с дешёвых: gates→engops и engine↔gates (только CLI-вход)
    type: engineering
    goal: layering-ring-is-a-dag
    status: in_progress
    owner_role: engineer
    value: medium
    write_scope: [ai_ops_kit/, packages/, tests/]
    reason: >-
      После F-03 гейт честен: 5 пар видны как есть (context↔engine, delivery↔engine, engine↔gates,
      engops↔gates, engine↔lifecycle). Развязка — настоящая, а не сокрытие через __import__:
      gates→engops (deploy_readiness, уже в known_violations) и engine↔gates (держится одним
      evidence_collector.main) — самые дешёвые. Готово, когда ратчет mutual_pairs опускается ПО ФАКТУ
      снятых рёбер, known_violations сокращается, и это развязка, а не перенос импорта в функцию.
    progress_note: >-
      K1 engine↔gates РАЗВЯЗАНА ПО-НАСТОЯЩЕМУ (2026-09-10): CLI-обёртка evidence_collector, строившая
      broker через __import__ engine, вынесена в ai_ops_kit/devtools/evidence_collect_cli.py (devtools
      это entrypoints — engine импортить можно); библиотечный collect() давно принимает broker
      параметром. Гейт больше не зависит от engine ни статически, ни динамически — это перенос
      проводки в точку входа, а НЕ сокрытие. mutual_pairs 5→4, cycles 9→5 честно (каскад claim-маркеров
      сведён). ОСТАЮТСЯ 4 пары, каждая — проектное решение, а не хирургия: context↔engine (run_plan),
      delivery↔engine (git/worktree/pipeline), engine↔lifecycle («кто классифицирует»), engops↔gates
      (deploy_readiness нуждается в environment_map — «куда положить»). Их брать отдельными срезами.
