    freeze_relation: extension
    # ДОСТИГНУТО 2026-09-17 (5/5): scorecard построен (#1040) и стал ГЛАВНОЙ мерой самоотчёта (#1045).
    status: achieved
    outcome:
      # Кит мерит СЕБЯ как продукт единой картой (не числом возможностей), честно «не измерено» где данных нет.
      # ЗАКРЫТ 2026-09-17 (PR #1045): самоотчёт кита о себе (витрина capability-map / `--json`) теперь
      # ВЕДЁТ картой продукта из 5 метрик (`headline.scorecard`), а счёт возможностей демотирован до
