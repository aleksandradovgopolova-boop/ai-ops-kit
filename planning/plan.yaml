    # не принимается, пока исход `owner_reaches_verified_pr_without_patching_the_kit` не стал верным.
    # Оговорка: работа, которая снижает цену процесса, замыкает обратную связь из поля или закрывает
    # найденный полем дефект, новым умением НЕ считается — она условие того самого прогона.
