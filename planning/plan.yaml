    #     validate_stale_gates ×3 (дефект кода не должен выглядеть как «нет git»).
    # (б) Гашение теряло АУДИТ-запись при верном решении «не ронять прогон» -> добавлена вторая
    #     половина решения: прогон продолжается, но утрата ВИДНА в отчёте
    #     (`rep.bookkeeping_errors`) — usage_ledger.append и lifecycle_journal.fix_attempt.
    #     Образец взят в самом файле: рядом уже был `escalation_error` («НЕ глотаем молча»).
    # (в) Гашение безвредно по построению (кеш переоценки evidence: не записали -> пересчитаем)
    #     -> решение ЗАПИСАНО в noqa вместо пустого подавления. Поведение не менялось.
    # Остаток BLE001/S110 — это (в): подавления с записанной причиной, не долг.

