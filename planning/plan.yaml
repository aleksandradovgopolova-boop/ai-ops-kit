    # Это чистое расширение сети: от существующего кода они не требуют ничего, ловят только новое.
    # СДЕЛАНО 2026-08-12 (второй заход): BLE001/S110/S112 ВКЛЮЧЕНЫ с ратчетом. Пакет валидаторов
