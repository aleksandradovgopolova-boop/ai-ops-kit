    # ДЕРЕВЕ, иначе он проверяет не то. И не подменять живой прогон: `second-brownfield-run` эту
    # работу не заменяет и ею не заменяется — там продукт и владелец, здесь механизированный путь.
    # ВНЕШНИЙ ИНСТРУМЕНТ НЕ НУЖЕН: разведка DP-114 не нашла ничего, что делало бы это дешевле
    # своих рук; цена — 1-2 дня инженера. Стоимость прогона (минуты, деньги при живом провайдере)
    # НЕ ИЗМЕРЕНА и должна быть названа при взятии, а не после.

