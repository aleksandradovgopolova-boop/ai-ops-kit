    # статусе `in_progress`. Проверено ПРОБОЙ, а не рассуждением: одной работе поставлен
    # `status: in_progress` с веткой, и ответ НЕ ИЗМЕНИЛСЯ ни одним словом.
    #
    # ПРИЧИНА — ДВА ИСТОЧНИКА ПРАВДЫ ОБ ОДНОМ ВОПРОСЕ, которые не встречаются:
    #   * `status` читает ТОЛЬКО реестр рантайма `.ai/runtime/active-work.yaml`
    #     (`cli/ai_ops_cli.py:252-276` -> `presenter.from_active_work`), а в план не смотрит вовсе;
    #   * `in_progress` в плане — объявление человека, и ни `status`, ни `next` его не видят.
    #   В самом ките файла реестра НЕ СУЩЕСТВУЕТ: при его отсутствии подставляется
    #   `data = {"active": []}`, и пустой список печатается как факт со `status: ok`.
    #
    # ПОЧЕМУ ЭТО СВОЙ КЛАСС, А НЕ МЕЛОЧЬ. На соседней ветке того же кода кит рассуждает ПРАВИЛЬНО:
    # для ИСПОРЧЕННОГО реестра стоит комментарий «битый реестр — не „работы нет“», и ответ становится
    # `blocked`. Для ОТСУТСТВУЮЩЕГО реестра тот же вывод не сделан — «не знаю» выдано за «нет»,
    # утвердительно и без оговорки. Это форма ложного green, против которой стоит
    # `green-means-checked`, — в ответе на самый частый вопрос управления.
    # ЦЕНА УЖЕ ЗАПЛАЧЕНА: семь закрытых работ простояли `in_progress` четыре дня (14–18.08), и ни
    # `status`, ни `next` об этом не сказали — расхождение плана с реальностью некому было заметить.
    #
    # ЧТО ДЕЛАЕМ (сверка, а не второй источник): ответ строится из ОБОИХ — реестр говорит, что
    # исполняется прямо сейчас, план говорит, что объявлено идущим, и РАСХОЖДЕНИЕ НАЗЫВАЕТСЯ вслух
    # («в плане объявлено N идущих работ, в реестре их нет — либо работа брошена, либо закрыта и не
    # закрыта в плане»). Отсутствие реестра при непустом плане — не `ok`.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: заводить третье место, где живёт «что идёт», и чинить симптом чисткой
    # плана — 18.08 план вычистили, и фраза стала верной, НЕ став проверенной.
    # ПРИЁМКА — ПРОБА ШВА, а не модульный тест: работа в плане с `in_progress` обязана менять ответ
    # `status`, и снятие сверки обязано ронять именно этот тест (`quality/mutation-probes.yaml`).
    # РЯДОМ, НО ДРУГОЕ: заявка #137 (реестр держит blocked работу, уже влитую в base) — там реестр
    # врёт содержимым, здесь его не спрашивают вместе с планом.

