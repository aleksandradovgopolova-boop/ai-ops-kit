    # ОТКУДА: тот же отчёт -> B2-09 (P2). За правку ОДНОГО текстового документа гейт потребовал
    # независимого ревьюера по доменам authorization_idol, deployment_config, input_validation,
    # rate_limiting. Диффа он не читает вовсе.
    # ЦЕНА: требование, не связанное с изменением, обесценивает само требование — человек учится
    # обходить гейт, который срабатывает всегда. Это дороже, чем пропущенная проверка: обход
    # становится привычкой и на тех изменениях, где ревьюер действительно нужен.
    # ГРАНИЦА: «не читает дифф» != «можно пропускать». Пропуск обязан быть НАЗВАННЫМ и связанным
    # с содержанием изменения, а не с его размером.
    # СДЕЛАНО 2026-08-14. ЗАГОЛОВОК НАХОДКИ БЫЛ НЕВЕРЕН: гейт дифф ЧИТАЕТ. Домены поднимаются по
    # сигналу, по пути и ПО СОДЕРЖИМОМУ изменённых файлов (v2.104, введено правильно: auth-логика в
    # файле с неподходящим путём иначе проходила молча). Дефект — в том, что матч по содержимому
    # это подстрока без границ слова, и в прозе она ловит СЛОВА, а не поведение.
    # ЗАМЕР на живом документе: `log|logger|audit` совпало с «BookTitleLogo», `route|param|query` и
    # `endpoint|route|api` — со словом «ROUTES» в описании роутера, `\.env|deploy` — с фразой
    # «переменные окружения перечислены в `.env.example`». Итог: четыре домена и требование
    # независимого ревьюера за правку одного markdown-файла.
    # ПОЧИНЕНО УЗКО: для прозы отключён ТОЛЬКО матч по содержимому. Путь и сигналы работают
    # по-прежнему (изменил сам `.github/workflows/deploy.yml` — домен поднимется по пути),
    # детерминированные домены объявлены `.*` и применимы всегда, поэтому секрет, забытый в
    # markdown, ловится как и раньше. Под-срабатывания нет: markdown не выполняется.
    # СЛОЙ НЕ НАРУШЕН: список прозы НЕ импортируется из `gates/verification_tiers` (это добавило бы
    # взаимную пару в ратчет связности), а соотношение двух списков закреплено тестом шва.
    # МУТАЦИИ (4, все убиты): проза снова матчится содержимым; матч по содержимому отключён вовсе
    # (возврат дефекта v2.104); матч по пути сломан; прозой считается всё.

