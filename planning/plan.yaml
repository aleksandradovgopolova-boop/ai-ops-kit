    # шаблона совпадает с китом побайтно. Нашлось это мутационной пробой, а не ревью.
    # ВТОРАЯ ВЕРСИЯ ОШИБЛАСЬ В ДРУГУЮ СТОРОНУ, и эта ошибка опаснее: тест про источник доставки
    # покраснел под мутацией — но он был красным и БЕЗ неё (порча managed-копии воспроизводит не тот
    # дефект: `update` распознаёт прямую правку managed-слоя и останавливается, как и должен).
    # «Мутация убита» на всегда-красном тесте не значит ничего. Поймал это полный прогон, а не
    # мутационная проба: в общем наборе тест был красным.
    # ИТОГ: единственное честное состояние для этой проверки — дочка, установленная ПРЕДЫДУЩИМ
    # релизом (кит копируется, шаблон в копии помечен, версия копии на патч ниже, установка идёт из
    # копии). Пять мутаций краснеют, все пять тестов зелены без мутаций.
    # ПРАВИЛО ДЛЯ СЛЕДУЮЩЕЙ РАБОТЫ ЗДЕСЬ: проба шва без мутационного замера не считается пробой, а
    # замер считается только в двух состояниях — зелено без мутации И красно с ней.
    #
    # ОСТАЛОСЬ ДО `done` — F-030: обновление 3.36.8 -> 3.36.10 делает план дочки невалидным (правило
    # «закрытая работа живёт в history» применено к дочкам без миграции). Это НЕ тронуто, и оно ждёт
    # каждую дочку с автообновлением. Второй дочке (ИИ-Среда) F-030 ещё только предстоит: там кит
    # 3.36.8 и 32 записи `status: done` в активном плане.

