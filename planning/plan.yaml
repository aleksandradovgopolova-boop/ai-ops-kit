  - id: verification-gate-matches-what-repo-has
    title: Проверка исполнения требует только те доказательства, которые в репозитории возможны
    type: engineering
    goal: second-real-brownfield
    status: done
    owner_role: engineer
    depends_on: []
    write_scope: [ai_ops_kit/gates/, quality/gates.yaml, tests/]
    value: high
    affects: {engineering_quality_security: true, delivery_operations: true}
    # ОТКУДА: qualification/REAL-PRODUCT-BNBM-2026-08-14.md -> B2-08 (P1). Это причина, по которой
    # второй brownfield не дал verified PR, и она НЕ эксплуатационная предпосылка.
    # ЗАМЕР: `implementation_verification` = fail, блокер «бездоказательный pass: не подтверждены
    # required_evidence: build_passed, lint_passed, typecheck_passed, tests_passed». В evidence
    # ТОГО ЖЕ гейта записано `skip_reason:docs_only`, а `repository-profile`, который кит составил
    # сам, содержит `lint: null, typecheck: null, test: null` с причиной «нет доказательства в
    # репозитории». Кит требует доказательства, которое сам объявил несуществующим, за изменение,
    # которое сам пометил не нуждающимся в нём.
    # СЛЕДСТВИЕ ШИРЕ ОДНОЙ ЗАДАЧИ: на репозитории без тестового тулчейна НИ ОДНО изменение не может
    # дойти до владельца. Для продукта без тестов кит бесполезен целиком, а не частично.
    # ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ: ослаблять гейт до advisory или засчитывать `docs_only` как pass молча.
    # Отказ fail-closed верен по направлению — неверно то, что он не отличает «доказательство не
    # предъявлено» от «доказательство в этом репозитории невозможно», и не говорит этого человеку.
    # ПРИЁМКА: на репозитории без lint/test/typecheck изменение только документации проходит либо
    # честным `not_applicable` с НАЗВАННОЙ причиной, либо отказом, который называет настоящую
    # причину и следующий шаг владельца. Проверять мутацией на обеих ветках.
    # СДЕЛАНО 2026-08-14. ОХВАТ НАХОДКИ ОКАЗАЛСЯ ШИРЕ ЗАЯВЛЕННОГО, и это главное здесь:
    # «кит бесполезен на репозитории без тестов» — НЕВЕРНО. Воспроизведено на ПОЛНОМ наборе команд:
    # блокируется ЛЮБОЕ изменение только документации, на любом репозитории, включая сам кит.
    # Отсутствие тестов у продукта было совпадением, а не причиной. Заявление сузилось до факта.
    # МЕХАНИЗМ: ветка `tier == "skip"` в `evidence_collector` возвращала `status: pass` с флагом
    # `skip_verification`, которого НЕТ в `required_evidence`, и `not_applicable: []`. Дальше
    # `gate_executor` не находил ни одного из пяти обязательных флагов и превращал pass в
    # блокирующий отказ «бездоказательный pass». Ветка, созданная пропустить проверку, сама её и
    # заваливала.
    # ПОЧИНЕНО: пропуск стал ОСВОБОЖДЕНИЕМ с названной причиной — четыре флага объявлены
    # `not_applicable`, `tested_revision` подан как настоящее доказательство (ревизия известна;
    # подменять её освобождением значило бы прятать факт за отговоркой), причина едет вместе с
    # освобождением до отчёта. Прежний текст «нет инструмента в стеке» больше не подставляется
    # чужому случаю: ложное основание хуже отсутствующего, по нему принимают решения.
    # ЗАПРЕТ БЕЗДОКАЗАТЕЛЬНОГО PASS НЕ ОСЛАБЛЕН — это сторожит отдельный тест.
    # МУТАЦИИ (4, все убиты): освобождение не покрывает флаги; запрет бездоказательного pass снят;
    # причина снова зашита жёстко; сборщик не освобождает ничего.
    # ТЕСТ ШВА ПЕРЕЖИЛ мутацию в первой версии — сравнивал КОНСТАНТУ теста с реестром и сборщик не
    # вызывал вовсе. Переписан так, чтобы брать список у обеих сторон. Дефект жил в шве, и тест шва,
    # не трогающий шов, — декорация.

  - id: security-gate-reads-the-diff
    title: Гейт безопасности смотрит, что изменено, прежде чем требовать ревьюера
    type: security
