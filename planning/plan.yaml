  - id: owner-speaks-product-not-pipeline
    # заморозка: вертикальный срез Окошка — новый продукт
    freeze_relation: extension
    status: active
    outcome:
      owner_never_edits_yaml_or_knows_feature_id: false

  - id: nightly-product-review
    # заморозка: ночной обзор — новое умение целиком
    freeze_relation: extension
    # АКТИВНА 2026-09-02 (issue #421): взят один исход — `delta_review_runs_nightly_and_briefs_the_owner`.
    # Обзор умеет идти ночью РЕАЛЬНЫМ триггером (CI-workflow `schedule: cron`, install_schedule +
    # schedule_status с честным detected/declared/absent) и БРИФУЕТ владельца доставкой (durable-инбокс
    # + latest + receipt: произведён ≠ доставлен), а не печатью в stdout. Два других исхода
    # (`no_direct_writes_to_main_ever`, `false_positive_rate_is_named`) остаются открыты — их работа
    # отдельная (#422, #423).
    status: active
    outcome:
      # Механизм ПОСТРОЕН и доказан юнит-тестами: обзор умеет идти ночью (реальный CI-триггер
      # `schedule: cron`, install_schedule + schedule_status) и доставляет бриф (durable-инбокс +
      # receipt). Но исход держим FALSE до ЖИВОГО доказательства: реальный ночной прогон, который
      # отработал и прислал владельцу бриф, ещё не наблюдался, и судейские ворота кита в этой среде
      # не гонялись. «Зелёное значит проверенное» — флипнем в true по факту живого прогона (как #424).
      delta_review_runs_nightly_and_briefs_the_owner: false
      no_direct_writes_to_main_ever: false
      false_positive_rate_is_named: false

  - id: outcome-and-analytics-loop
    # заморозка: аналитика исходов — новое умение
    freeze_relation: extension
    # ДОСТИГНУТА 2026-09-04 (#424): проводка producer -> гейт замкнута. Механизм сверки объявленного
    # с доехавшим (event_arrival.assess) закрыт 2026-08-20; МАШИННЫЙ ПРОИЗВОДИТЕЛЬ
    # (event_arrival.events_verified_live) построен 2026-09-02; недостающее звено — ПРОВОДКА
    # производителя как источника evidence гейта analytics_runtime_verification — закрыто здесь
    # (event_arrival.verify_analytics_runtime зовёт producer и оценивает гейт через
    # gates.gate_executor; вердикт машины авторитетен и переписывает слово судьи). Направление
    # intelligence -> gates легально по слоям (вниз). См. history: analytics-runtime-evidence-wired.
    status: achieved
    outcome:
