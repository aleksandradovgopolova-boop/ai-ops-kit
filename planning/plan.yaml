      feature_completion_rate_measured: true
      # Доля утверждений кита с реальным evidence — выражена долей охвата, не pass/fail. ЗАКРЫТ (PR #1040): метрика 2 даёт долю 8/8.
      evidence_coverage_measured_as_ratio: true
