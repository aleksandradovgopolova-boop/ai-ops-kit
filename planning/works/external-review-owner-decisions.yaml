work:
- id: external-review-owner-decisions
  title: Пакет решений владельца по внешнему ревью 19.08.2026
  type: product
  goal: product-decision-loop
  status: todo
  owner_role: product
  depends_on: []
  human_decision: 'Три пункта ревью меняют не механизм, а решение о продукте, и решать
    их за владельца нельзя — это ровно то, против чего стоит `product-decision-loop`.
    (1) ЦЕНТРАЛЬНОЕ ОБЕЩАНИЕ. Ревью предлагает формулировку: «AI Ops Kit превращает
    задачу владельца продукта в доказуемое изменение продукта, сохраняя связь между
    намерением, реализацией, проверками и результатом» — и правило отбора: умение,
    которое нельзя привязать к цепочке intent -> decision -> change -> evidence ->
    outcome, обязано обосновывать своё существование. Принимаем ли формулировку и
    правило? (2) КРИТЕРИЙ ВТОРОГО BROWNFIELD. Ревью требует, чтобы задачу провёл НАСТОЯЩИЙ
    сторонний владелец — не автор кита, не Claude Code, не разработчик AI Ops. Это
    меняет то, что считается выполненным (сегодняшний третий прогон вёлся мной и по
    решению владельца БЕЗ запроса на слияние в чужой репозиторий), и требует живого
    человека. Ужесточаем ли критерий? (3) ПРАВИЛО ПРОТИВ БЕСКОНЕЧНОЙ МАТРЁШКИ meta-QA.
    Ревью предлагает: новый уровень проверки проверок появляется, только если ловит
    класс дефектов, недостижимый предыдущим уровнем. Фиксируем ли как правило культуры
    — и, значит, как проверку при добавлении нового уровня?

    '
  write_scope:
  - decisions/
  - planning/
  - rules/core/
  value: high
  affects:
    product_strategy: true
    planning_execution: true
  evidence: qualification/EXTERNAL-REVIEW-2026-08-19.md
