[pytest]
# AI Ops Kit Verification Foundation (v3.25.0)
# Pytest configuration for unified test running

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for CI layer separation
markers =
    critical_path: tests for critical execution path (PR smoke layer)
    unit: unit tests (fast, no external deps)
    contract: contract tests (interface verification)
    integration: integration tests (multi-module)
    live: live tests (require external services)
    regression: regression tests for known bugs
    slow: tests that take >10 seconds

# Default options (v3.28.0 R2: coverage reporting enabled; threshold rises with test growth)
# v3.35.1: ОХВАТ МЕРИЛСЯ НЕ ПО ПРОДУКТУ. Стояло `--cov=tools --cov=validation`: корневого
# `validation/` нет с 3.34 (каталог переехал в `ai_ops_kit/validation/`), а `tools/*.py` — это
# семистрочные алиасы через sys.modules. Пакет `ai_ops_kit/` (24 669 строк продакшна) не измерялся
# ВООБЩЕ, и опубликованное «41%» было про алиасы. Мутационное ревью показало цену: именно это
# скрывало, что `contour_consistency_evidence`, `_topo_order` и `_admission` не исполняются тестами
# ни разу — гейт можно было удалить из конвейера, и 1678 тестов оставались зелёными.
# Плюс это стоило ~2× времени: контур платил за метрику с ОТРИЦАТЕЛЬНОЙ пользой.
# `-v` на 1678 тестах тоже убран: он печатает 1678 строк и ничего не сообщает.
# 2026-08-12: --cov ЗДЕСЬ БОЛЬШЕ НЕТ, и это НЕ отказ от покрытия — наоборот, оно стало гейтом.
#
# Что было. `--cov` в addopts включал покрытие в КАЖДОМ запуске pytest, поэтому все шесть
# скриптов контура и все джобы CI передавали `--no-cov`, чтобы его выключить. Итог: покрытие
# собиралось ровно в одном шаге (`pipeline-e2e` -> contracts) и не проверялось порогом НИГДЕ —
# метрика без последствий. Плюс addopts требовал pytest-cov от любого запуска pytest, и джобы
# падали с «unrecognized arguments: --cov=...» ещё до тестов — это записано в комментариях
# package-quality.yml и pr-smoke.yml дважды. Цена без пользы, ровно как в v3.35.1 про охват.
#
# Что стало. Покрытие измеряется В ОДНОМ месте, где у него есть последствие: джоба `coverage` в
# package-quality.yml гоняет весь набор с явными `--cov` и `--cov-fail-under`. Порог — РАТЧЕТ по
# замеру (полный набор: 71%, 23 889 инструкций, 7 015 без покрытия), поднимать можно, опускать —
# только осознанно и заметно, как ратчет слоёв в packages/layering.yaml. Локальный цикл покрытие
# не считает: v3.35.1 замерил, что это стоило ~2× времени при отрицательной пользе.
addopts =
    --tb=short
    --strict-markers
