[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-kit"
dynamic = ["version"]
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0", "ruff>=0.16.2", "mypy>=1.0", "pre-commit>=3.0"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tools", "ai_ops_kit", "ai_ops_kit.*"]

# ruff: НАБОР ОБЪЯВЛЕН И ИСПОЛНЯЕТСЯ (ревизия 2026-08-11).
#
# До ревизии ruff стоял в dev-зависимостях, но не запускался НИГДЕ: в CI его нет, а в
# `.pre-commit-config.yaml` он был ограничен `files: ^(tools|validation|tests)/` — то есть
# пакет `ai_ops_kit/` (40 544 строки продакшна) не линтовался ни разу. Ровно тот же дефект
# «мерили не продукт», что pytest.ini закрыл для coverage в v3.35.1: там `--cov=tools` считал
# семистрочные алиасы, здесь `files:` линтовал их же.
#
# Первый прогон по пакету дал 912 находок. Массовая правка стиля не входит в объём ревизии и
# создала бы дифф, который невозможно отревьюить, поэтому выбран ПОТОЛОК ПО КЛАССУ ОШИБКИ:
# исполняются те правила, что ловят именно поломку, и по ним сейчас ноль. Расширять набор —
# отдельными решениями, каждое со своей уборкой; список остатка — в docs/audit-report.md.
#
#   F821 undefined-name — вызов несуществующего имени. Замер: 15 штук, из них 11 —
#         `sys.exit(selftest())` в модулях, где функция удалена в v3.30. Пять точек входа
#         падали с NameError при ЛЮБОМ запуске; ни один тест этого не видел.
#   F811 redefined-while-unused — повторное объявление затеняет первое. Замер: 6, и один из
#         них прятал тестовый класс `TestPrintHuman` — объявление на строке 204 не исполнялось.
#   B023 loop-variable closure — замыкание на переменную цикла: ломается молча при переходе
#         к отложенному вызову.
#   F841 unused-variable — присваивание, которое никто не читает. Замер: 12 в продакшне + 5 в
#         тестах. Не только мусор: имя обещает логику, которой нет. `hard_blocked` в
#         workpackage_executor выглядел потерянной блокировкой цепочки (оказался дублем
#         `_hard_stop`), `rc = ai_route.selftest_quiet()` выглядел проверкой (функции с таким
#         именем нет вовсе), а в тестах неиспользуемые `signals` и `policy` были следом ВЫПАВШЕЙ
#         половины проверки — оба теста обещали в докстроке больше, чем делали.
#
# ЧЕГО В НАБОРЕ НЕТ И ПОЧЕМУ (чтобы не добавили «до нуля» механически):
#   SIM115 — 2 оставшихся срабатывания ЛОЖНЫЕ: `active_work._lock` и `lifecycle_store._lock`
#     открывают файл блокировки вручную осознанно (он обязан жить дольше `yield`) и закрывают его
#     в `finally`. Утечки там нет; включение правила потребовало бы `noqa` на исправном коде.
#   RUF100 — под узким набором помечает 391 директиву как «неиспользуемую» лишь потому, что
#     правило не включено (`non-enabled: E402`, `BLE001`). `--fix` снёс бы легитимные подавления.
#     Правило осмысленно только вместе с широким набором.
[tool.ruff]
target-version = "py39"
# 110 — ЗАМЕР, а не вкус (2026-08-12): длины строк пакета по СИМВОЛАМ (не байтам — кириллица в
# UTF-8 даёт двойной счёт и завышает картину вдвое) дают p95=101, p99=110, длиннее 120 всего 113
# строк из 42 815. Прежде здесь стояло 120 «на глаз», и это было не безобидно: `ruff format`
# считал бы намеренно разбитые строки слишком короткими и СКЛЕИВАЛ их.
#
# Честно: сегодня это значение не проверяет НИЧТО — E501 в наборе нет, форматтер не запускается
# (см. `.pre-commit-config.yaml`). Оно стоит здесь, чтобы тот, кто однажды включит форматтер,
# стартовал от реальной конвенции репозитория, а не от дефолта инструмента.
line-length = 110
extend-exclude = [".ai", "qualification/fixtures", "examples"]

[tool.ruff.lint]
# Набор расширен 2026-08-12. Порядок расширения объявлен в плане: «по одному решению, каждое со
# своей уборкой». Здесь уборки не потребовалось — все добавленные правила ЗАМЕРЕНЫ на нуле по
# всему репозиторию, то есть это чистое расширение сети: они ничего не требуют от существующего
# кода и ловят только новое. Правила, требующие уборки, в набор НЕ добавлены (см. ниже).
select = [
  # --- Ядро: имя/объявление (было с 2026-08-11) ---
  "F821",    # вызов несуществующего имени: 15 находок при включении, из них 5 падавших входов
  "F811",    # переопределение затеняет первое: прятало тестовый класс, не исполнявшийся никогда
  "F841",    # присваивание, которое никто не читает: имя обещало логику, которой нет
  "B023",    # замыкание на переменную цикла: ломается молча при переходе к отложенному вызову
  # --- Сравнение и формат: ошибка семантики, а не стиля ---
  "E711",    # `== None` вместо `is None`
  "E712",    # `== True` вместо `is`/истинности
  "F632",    # `is` с литералом: сравнение идентичности строк/чисел «работает» до первого случая
  "F502", "F506", "F522",   # ошибки %-форматирования -> исключение в рантайме
  # --- Заведомо неисполнимый код ---
  "F701", "F702", "F706", "F707",   # break/continue/return не на своём месте, порядок except
  "B002",    # `++n` — в Python это двойной унарный плюс, а не инкремент
  "B018",    # выражение-инструкция без эффекта: строка, которая ничего не делает
  "B032",    # `x: 1` — аннотация вместо присваивания
  # --- Потеря информации об ошибке (тема этой ревизии) ---
  "B012",    # break/return внутри finally ГЛОТАЕТ исключение — беззвучно и необратимо
  "B904",    # `raise` без `from` внутри `except`: исходная причина теряется в трейсбеке
  "PLE0704", # голый `raise` вне except — RuntimeError вместо задуманного исключения
  # --- Аргументы и вызовы ---
  "B006",    # изменяемое значение по умолчанию: состояние течёт между вызовами
  "PLE1142", # `await` вне async
  "PLE1205", "PLE1206",   # число аргументов не совпадает с шаблоном logging
  # --- Безопасность ---
  "S102",    # `exec`
  "S307",    # `eval`
  "PLE2502", # двунаправленный unicode: текст читается иначе, чем исполняется
  # --- Гашение исключений: включено с РАТЧЕТОМ (2026-08-12) ---
  "BLE001",  # голый `except Exception`
  "S110",    # try/except/pass
  "S112",    # try/except/continue
]

# РАТЧЕТ ПО ГАШЕНИЮ ИСКЛЮЧЕНИЙ ЗАКРЫТ ПОЛНОСТЬЮ (2026-08-12).
#
# `BLE001`/`S110`/`S112` исполняются по ВСЕМУ репозиторию без исключений: секции
# `per-file-ignores` для них больше нет, потому что нечего исключать. Замер:
# `ruff check --select BLE001,S110,S112` с отключёнными per-file-ignores — 0 находок.
# Проверено и обратное: искусственное гашение без записанной причины краснеет сразу.
#
# Путь от 12 записей к нулю прошёл семью срезами, и каждый находил ДЕФЕКТЫ, а не просто расставлял
# подавления. Разборы — в `planning/plan.yaml` (ruff-rule-set-widening) и `docs/audit-report.md`:
#   validation       — две ФИКТИВНЫЕ проверки (R-31/R-32);
#   engine+lifecycle — четыре дефекта (R-33..R-36), два P1: `_scrub_output` отдавал НЕСКРАБЛЕННЫЙ
#                      вывод в evidence; `derive_status` объявляла `done` при неоценённом blueprint;
#   providers        — три советника молча укорачивали список рекомендаций;
#   хвост (мелкие)   — два fail-open: битый план оставлял контур VERIFIED, сбой графа был неотличим
#                      от «добавить нечего»;
#   .research        — документ ПРИЁМКИ ссылался на CI, которого нет;
#   tests            — мёртвый генератор 148 обёрток селфтестов (F-028): создавались в globals()
#                      conftest, откуда pytest не собирает, и предмет проверки удалён в v3.30.
#
# ЧТО ЭТО ЗНАЧИТ ПРАКТИЧЕСКИ: каждое оставшееся в репозитории подавление несёт ЗАПИСАННУЮ причину
# рядом с проверяемым утверждением. Новое молчаливое гашение не пройдёт ни в продакшне, ни в тестах.

# ПОЧЕМУ ЗДЕСЬ НЕ ВСЁ, ЧТО ХОЧЕТСЯ. Правила ниже ловят настоящее, но требуют уборки, а уборка —
# отдельное решение со своей ценой; список ведётся в `planning/plan.yaml` (ruff-rule-set-widening).
#
# ОХВАТ ЧИСЕЛ НАЗВАН, А НЕ ПОДРАЗУМЕВАЕТСЯ (исправлено 2026-08-12): все цифры ниже замерены
# командой `ruff check --select <RULE> ai_ops_kit installer tools`, то есть по ПРОДАКШНУ. По всему
# репозиторию (`.`) они втрое больше — за счёт `tests/`, `.research/` и `scripts/`. Раньше охват
# здесь не стоял, и число читалось как «по репозиторию», хотя измерялось иначе; для репозитория,
# у которого `evidence_scope_named_not_implied` — объявленная цель, это была своя же ошибка.
#
#   PLW1510 (65) — `subprocess.run` без `check`. Опасные два исправлены; остальные — подготовка
#     временных git-репозиториев в валидаторах, где отказ и так валит проверку ниже.
#   F401 (104), I001 (130), EXE001 (180) — стиль и порядок импортов, не поломка.
#   SIM115 (2) — НЕ долг: оба срабатывания ложные. Разбор — в блоке «ЧЕГО В НАБОРЕ НЕТ» выше:
#     `active_work._lock` и `lifecycle_store._lock` держат файл блокировки дольше `yield` осознанно
#     и закрывают его в `finally`. Было 6; четыре закрыты ревизией (R-20), два оставшихся исправны.
#   RUF100 — включать НЕ надо, обоснование выше.
#
# BLE001 / S110 / S112 из этого списка УШЛИ: они в наборе выше и исполняются по всему репозиторию,
# исключений не осталось вовсе (замер — в шапке ратчета выше).

# ─────────────────────────────────────────────────────────────────────────────────────────────
# ВОРОТА ВЫПУСКА (работа `release-has-a-gate`, 18.08.2026). Оба инструмента DEV-ONLY: в поставку не
# едут, `dependencies` пакета не меняются — правило про отсутствие новых зависимостей про рантайм.
#
# ПОВОД — ЗАМЕР (EV-1112): 236 версий за 40 дней и НИ ОДНОГО механизма, проверяющего выпуск.
# `CHANGELOG.md` правлен 401 раз — в 4.5 раза больше любого файла кода. Находок поля этот класс не
# дал ни одной: механизма не было вовсе. Это тот же класс «объявлено и не исполняется», только с
# другой стороны — здесь не было объявлено и не исполнялось.

# towncrier: ЕДИНСТВЕННЫЙ из шести рассмотренных инструментов, у кого есть гейт «в этой ветке
# добавлена запись для changelog» (EV-1137). Используем ТОЛЬКО `check`, никогда `build`: старый
# CHANGELOG.md остаётся как есть, ретро-миграция не нужна и не делается.
# Модель фрагментов попутно снимает конфликты в файле на 364 КБ — правки идут в разные новые файлы.
[tool.towncrier]
directory = "newsfragments"
filename = "CHANGELOG.md"
package = "ai_ops_kit"
title_format = false
issue_format = "{issue}"

[[tool.towncrier.type]]
directory = "feat"
name = "Новое"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Исправлено"
showcontent = true

[[tool.towncrier.type]]
directory = "quality"
name = "Механизмы и проверки"
showcontent = true

# `chore` считается за запись НАМЕРЕННО: гейт введён строгим (решение владельца 17.08.2026), а
# служебные изменения — план, история, реестр решений — тоже идут через PR. Без этого типа строгий
# гейт заставлял бы придумывать «новость» там, где новости нет, и его начали бы обходить.
[[tool.towncrier.type]]
directory = "chore"
name = "Служебное"
showcontent = true

# commitizen: ТОЛЬКО проверка формата сообщений коммитов, и только на НОВЫЕ (решение владельца
# 17.08.2026). ЗАМЕР 18.08: `cz check` на последних 5 коммитах зелёный, на последних 30 — красный
# (в истории 72 коммита без conventional-префикса из 594). Правило, требующее переписать историю, не
# введут никогда. Точка включения — в `config/release-gates.yaml`, потому что её читают ДВА
# потребителя (CI и валидатор), а строка в одном workflow второму не видна.
#
# ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ: `version_provider = "scm"` + `cz bump --check-consistency` (замысел по
# EV-1138) НЕ ПРИМЕНИМЫ на этом репозитории — ЗАМЕР 18.08.2026: провайдер читает теги и падает
# `InvalidVersion: '3.9.2-remote'` на постороннем теге, который висит рядом с `v3.9.2`. Гейт,
# зависящий от гигиены 259 тегов, ломается от одного лишнего; согласованность версии проверяет свой
# валидатор (~40 строк на stdlib+pyyaml) — ровно как и предполагала митигация в плане. Посторонний
# тег НЕ УДАЛЁН: удаление тега — решение владельца.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"

# Точка включения формата коммитов и параметры ворот. Живут ЗДЕСЬ, а не строкой в workflow, потому
# что их читают два потребителя (CI и тесты), а строка в одном workflow второму не видна — они
# разъезжаются молча. Это ровно тот класс, который кит ловит у других.
[tool.ai_ops.release_gates]
# Коммиты ПОСЛЕ этого SHA обязаны быть conventional. Замер 18.08.2026: `cz check` на последних 5
# коммитах зелёный, на последних 30 — красный.
# СДВИНУТО 20.08.2026 РОВНО НА ОДИН КОММИТ, и это не смягчение правила, а признание, что оно не
# могло быть исполнено. 664c3f0 — squash-мерж PR #211: заголовок PR стал темой коммита на main.
# `cz check` в ветке проверял коммиты ВЕТКИ (там всё по формату) и о заголовке ничего не знал.
# После мержа main стал красным на lint, и КАЖДАЯ ветка от него унаследовала этот красный —
# ровно то, что мы разбирали вчера как «красный фон».
# Переписать историю защищённой ветки нельзя (enforce_admins включён, и это правильно).
# Поэтому: причина закрыта там, где возникла — ворота на ЗАГОЛОВОК PR в pr-smoke.yml, — а точка
# сдвинута на один коммит с этой записью. Сдвиг без такой пары был бы тем самым дешёвым зелёным.
commit_format_enforced_after = "664c3f0"
commit_format_enforced_after_date = "2026-08-18"
# `cz check` на ПУСТОМ диапазоне возвращает 3 («No commit found with range») — замерено. Это не
# нарушение формата, а «проверять нечего», и валить джобу на этом нельзя: гейт, краснеющий на
# пустоте, отключают целиком.
commit_format_empty_range_code = 3
changelog_fragments_dir = "newsfragments"
