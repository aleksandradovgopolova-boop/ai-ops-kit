[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-kit"
dynamic = ["version"]
requires-python = ">=3.12"   # ИНВАРИАНТ: пол = версия, на которой РЕАЛЬНО работают все дочки (3.12)
                             # и система (3.14); ниже — объявленная поддержка без потребителя.
                             # Хроника (3.9 EOL, снятие python39-compat): decisions/registry.yaml
                             # → ep-2026-08-20-python-floor-3.12.
license = {text = "MIT"}
dependencies = ["pyyaml"]

[project.scripts]
# Консольный вход для pip/pipx: `ai-ops <интент>` (next/status/inbox/explain/do/run/…).
# Диспетчер — ai_ops_kit/cli/entry.py; интенты живут в ai_ops_kit/cli/ai_ops_cli.py -> INTENTS
# (уже в поставке). Жизненный цикл кита (init/doctor/update) сюда НЕ входит: установщик
# в поставку не едет (docs/api/public-surface.md). Новый консольный вход АДДИТИВЕН и не
# breaking change (AGENTS.md, «Публичная граница»: новый интент/вход — не ломающее изменение).
ai-ops = "ai_ops_kit.cli.entry:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0", "ruff>=0.16.2", "mypy>=1.0", "pre-commit>=3.0"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tools", "ai_ops_kit", "ai_ops_kit.*"]

# ruff: НАБОР ИСПОЛНЯЕТСЯ (блокирующая джоба `lint`). Список правил — ниже в [tool.ruff.lint].
# ИНВАРИАНТ: включаются только правила класса «поломка» (не стиль), и по каждому сейчас ноль;
#   расширение набора — отдельным решением со своей уборкой, а не «до нуля» механически.
# ГРАНИЦА: SIM115 и RUF100 НЕ включены намеренно — их срабатывания здесь ложные (SIM115:
#   `active_work._lock`/`lifecycle_store._lock` держат файл блокировки дольше `yield` осознанно)
#   либо осмысленны лишь при широком наборе (RUF100). Не добавлять «ради нуля».
# Хроника (когда/каким PR включён, замер 912→0, разбор F821/F811/F841/…): decisions/registry.yaml
#   → ep-2026-08-11-ruff-enforced-class-of-breakage, ep-2026-08-12-ruff-set-widened-suppression-ratchet.
[tool.ruff]
target-version = "py312"
# ИНВАРИАНТ: line-length=110 — ЗАМЕР по СИМВОЛАМ (не байтам: кириллица в UTF-8 удваивает счёт),
# p95=101/p99=110. Тот, кто однажды включит `ruff format`, обязан стартовать от реальной конвенции
# репозитория, а не от дефолта инструмента (иначе форматтер склеил бы намеренно разбитые строки).
# Сегодня значение ничего не проверяет: E501 в наборе нет, форматтер не запускается.
# Хроника: decisions/registry.yaml → ep-2026-08-12-ruff-set-widened-suppression-ratchet.
line-length = 110
extend-exclude = [".ai", "qualification/fixtures", "examples"]

[tool.ruff.lint]
# ИНВАРИАНТ: правила класса «поломка», каждое замерено на нуле по репозиторию (чистое расширение
# сети — ничего не требует от существующего кода, ловит только новое). Инлайн-комментарий у правила —
# это его инвариант (что ловит). Замеры и история включения — decisions/registry.yaml
# → ep-2026-08-11-ruff-enforced-class-of-breakage, ep-2026-08-12-ruff-set-widened-suppression-ratchet.
select = [
  # --- Ядро: имя/объявление ---
  "F821",    # вызов несуществующего имени
  "F811",    # переопределение затеняет первое
  "F841",    # присваивание, которое никто не читает: имя обещает логику, которой нет
  "B023",    # замыкание на переменную цикла: ломается молча при переходе к отложенному вызову
  # --- Сравнение и формат: ошибка семантики, а не стиля ---
  "E711",    # `== None` вместо `is None`
  "E712",    # `== True` вместо `is`/истинности
  "F632",    # `is` с литералом: сравнение идентичности строк/чисел «работает» до первого случая
  "F502", "F506", "F522",   # ошибки %-форматирования -> исключение в рантайме
  # --- Заведомо неисполнимый код ---
  "F701", "F702", "F706", "F707",   # break/continue/return не на своём месте, порядок except
  "B002",    # `++n` — в Python это двойной унарный плюс, а не инкремент
  "B018",    # выражение-инструкция без эффекта: строка, которая ничего не делает
  "B032",    # `x: 1` — аннотация вместо присваивания
  # --- Потеря информации об ошибке (тема этой ревизии) ---
  "B012",    # break/return внутри finally ГЛОТАЕТ исключение — беззвучно и необратимо
  "B904",    # `raise` без `from` внутри `except`: исходная причина теряется в трейсбеке
  "PLE0704", # голый `raise` вне except — RuntimeError вместо задуманного исключения
  # --- Аргументы и вызовы ---
  "B006",    # изменяемое значение по умолчанию: состояние течёт между вызовами
  "PLE1142", # `await` вне async
  "PLE1205", "PLE1206",   # число аргументов не совпадает с шаблоном logging
  # --- Безопасность ---
  "S102",    # `exec`
  "S307",    # `eval`
  "PLE2502", # двунаправленный unicode: текст читается иначе, чем исполняется
  # --- Гашение исключений: исполняется по ВСЕМУ репозиторию, per-file-ignores нет ---
  "BLE001",  # голый `except Exception`
  "S110",    # try/except/pass
  "S112",    # try/except/continue
]

# ИНВАРИАНТ гашения исключений: BLE001/S110/S112 исполняются по всему репозиторию без исключений
# (замер: 0 находок), и каждое оставшееся подавление несёт записанную причину рядом с проверяемым
# утверждением — искусственное гашение без причины краснеет сразу.
# ГРАНИЦА: PLW1510/F401/I001/EXE001 (стиль/порядок импортов) НЕ включены — ловят настоящее, но
#   требуют уборки (отдельное решение; список — planning/plan.yaml, ruff-rule-set-widening).
# Хроника (путь 12→0 семью срезами, найденные дефекты, охват замеров по продакшну):
#   decisions/registry.yaml → ep-2026-08-12-ruff-set-widened-suppression-ratchet.

# ─────────────────────────────────────────────────────────────────────────────────────────────
# ВОРОТА ВЫПУСКА (towncrier/commitizen ниже). ИНВАРИАНТ: оба инструмента DEV-ONLY — в поставку не
# едут, `dependencies` пакета не меняют (правило «рантайм без новых зависимостей»).
# Хроника (повод EV-1112: 236 версий за 40 дней без механизма проверки выпуска):
#   decisions/registry.yaml → ep-2026-08-18-release-has-a-gate.

# mypy: ОБЪЯВЛЕН И ИСПОЛНЯЕТСЯ (блокирующий шаг джобы `lint`). ГРАНИЦА — фундамент (kernel+shared),
# где контракты заданы Protocol/TypedDict; `follow_imports = silent` держит область строгой (ошибки
# из НЕ-фундамента не краснят). ИНВАРИАНТ: держим «реальные типовые ошибки = 0»; py.typed НЕ добавлен
# намеренно — типизирован лишь фундамент, маркер «весь пакет типизирован» был бы над-заявлением.
# Хроника (F-05 внешнего аудита, 8 реальных проблем при включении): decisions/registry.yaml
#   → ep-2026-09-09-mypy-enforced-on-foundation.
[tool.mypy]
files = ["ai_ops_kit/shared", "ai_ops_kit/kernel"]
ignore_missing_imports = true
follow_imports = "silent"

# ИНВАРИАНТ ратчета-ВВЕРХ: под строгим `disallow_untyped_defs` — kernel (типизирован полностью) плюс
# чистые утиль-модули shared (gitio, budget); остальной shared пока лениво-строгий (99 подписей —
# отдельный шаг, когда охват вырастет). Граница «где типы обязательны» ходит только вверх.
# Хроника: decisions/registry.yaml → ep-2026-09-09-mypy-enforced-on-foundation.
[[tool.mypy.overrides]]
module = ["ai_ops_kit.kernel.*", "ai_ops_kit.shared.gitio", "ai_ops_kit.shared.budget"]
disallow_untyped_defs = true

# towncrier: ИНВАРИАНТ — используем ТОЛЬКО `check` (в ветке добавлена запись changelog), никогда
# `build`: старый CHANGELOG.md остаётся как есть, ретро-миграция не делается. Модель фрагментов
# попутно снимает конфликты в файле на 364 КБ (правки идут в разные новые файлы).
# Хроника (единственный из 6 инструментов с таким гейтом, EV-1137): decisions/registry.yaml
#   → ep-2026-08-18-release-has-a-gate.
[tool.towncrier]
directory = "newsfragments"
filename = "CHANGELOG.md"
package = "ai_ops_kit"
title_format = false
issue_format = "{issue}"

[[tool.towncrier.type]]
directory = "feat"
name = "Новое"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Исправлено"
showcontent = true

[[tool.towncrier.type]]
directory = "quality"
name = "Механизмы и проверки"
showcontent = true

# ИНВАРИАНТ: `chore` считается за запись НАМЕРЕННО — гейт строгий, а служебные изменения (план,
# история, реестр решений) тоже идут через PR; без этого типа строгий гейт заставляли бы обходить.
# Хроника: decisions/registry.yaml → ep-2026-08-18-release-has-a-gate.
[[tool.towncrier.type]]
directory = "chore"
name = "Служебное"
showcontent = true

# commitizen: ИНВАРИАНТ — ТОЛЬКО формат сообщений НОВЫХ коммитов (правило, требующее переписать
# историю, не введут никогда). Точка включения и параметры — в таблице `tool.ai_ops.release_gates`
# ниже, т.к. их читают ДВА потребителя (CI и тесты); строка в одном workflow второму не видна.
# ГРАНИЦА: `version_provider = "scm"` + `cz bump --check-consistency` (EV-1138) НЕ применимы —
#   провайдер падает `InvalidVersion` на постороннем теге рядом с v3.9.2; согласованность версии
#   проверяет свой валидатор. Посторонний тег НЕ удалён (удаление тега — решение владельца).
# Хроника: decisions/registry.yaml → ep-2026-08-18-release-has-a-gate.
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"

# ИНВАРИАНТ: точка включения формата и параметры ворот живут ЗДЕСЬ, а не строкой в workflow — их
# читают два потребителя (CI и тесты), иначе они разъезжаются молча (класс, который кит ловит у других).
[tool.ai_ops.release_gates]
# Коммиты ПОСЛЕ этого SHA обязаны быть conventional. ИНВАРИАНТ: каждый сдвиг точки несёт причину
# рядом (иначе гейт превращается в счётчик, который переставляют при каждом покраснении).
# Точку дважды СДВИГАЛИ ровно на слитые squash-мержем коммиты, чьи ЗАГОЛОВКИ PR стали сообщением на
# main без conventional-префикса и красили каждую последующую ветку; историю защищённой ветки
# (enforce_admins) переписать нельзя, поэтому сдвиг исключает уже слитое, а причину закрыли там, где
# она возникла (ворота на заголовок PR в pr-smoke.yml). Полная хроника (664c3f0→b73fd63, даты, PR):
#   decisions/registry.yaml → ep-2026-08-18-release-has-a-gate.
commit_format_enforced_after = "b73fd63"
commit_format_enforced_after_date = "2026-08-18"
# ИНВАРИАНТ: `cz check` на ПУСТОМ диапазоне возвращает 3 («проверять нечего») — валить джобу на этом
# нельзя (гейт, краснеющий на пустоте, отключают целиком).
commit_format_empty_range_code = 3
changelog_fragments_dir = "newsfragments"
