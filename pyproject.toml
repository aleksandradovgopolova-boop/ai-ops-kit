[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ops-kit"
dynamic = ["version"]
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pyyaml"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0", "ruff>=0.8.0", "mypy>=1.0", "pre-commit>=3.0"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["tools", "validation"]
